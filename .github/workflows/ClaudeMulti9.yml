name: ClaudeMulti9

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/ClaudeMulti9.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Write project
        run: |
          mkdir -p app/src/main/java/com/example/claudemulti app/src/main/res/drawable app/src/main/res/layout app/src/main/res/xml
          echo '' | base64 -d > debug.keystore

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'ClaudeMulti'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=false
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.example.claudemulti'
              compileSdk 34
              defaultConfig {
                  applicationId "com.example.claudemulti"
                  minSdk 23
                  targetSdk 26
                  versionCode 9
                  versionName "1.8"
              }
              signingConfigs {
                  debug {
                      storeFile file("${rootDir}/debug.keystore")
                      storePassword 'android'
                      keyAlias 'androiddebugkey'
                      keyPassword 'android'
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
              lint {
                  abortOnError false
                  checkReleaseBuilds false
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28"/>
              <application
                  android:label="Claude x4"
                  android:icon="@drawable/ic_launcher"
                  android:allowBackup="false"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <activity
                      android:name=".Web1"
                      android:theme="@android:style/Theme.DeviceDefault.Light.NoActionBar"
                      android:label="Claude 1"
                      android:process=":a1"
                      android:taskAffinity="com.example.claudemulti.a1"
                      android:launchMode="singleTask"
                      android:configChanges="orientation|screenSize|keyboardHidden|smallestScreenSize|screenLayout"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <activity
                      android:name=".Web2"
                      android:theme="@android:style/Theme.DeviceDefault.Light.NoActionBar"
                      android:label="Claude 2"
                      android:process=":a2"
                      android:taskAffinity="com.example.claudemulti.a2"
                      android:launchMode="singleTask"
                      android:configChanges="orientation|screenSize|keyboardHidden|smallestScreenSize|screenLayout"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <activity
                      android:name=".Web3"
                      android:theme="@android:style/Theme.DeviceDefault.Light.NoActionBar"
                      android:label="Claude 3"
                      android:process=":a3"
                      android:taskAffinity="com.example.claudemulti.a3"
                      android:launchMode="singleTask"
                      android:configChanges="orientation|screenSize|keyboardHidden|smallestScreenSize|screenLayout"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <activity
                      android:name=".Web4"
                      android:theme="@android:style/Theme.DeviceDefault.Light.NoActionBar"
                      android:label="Claude 4"
                      android:process=":a4"
                      android:taskAffinity="com.example.claudemulti.a4"
                      android:launchMode="singleTask"
                      android:configChanges="orientation|screenSize|keyboardHidden|smallestScreenSize|screenLayout"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <receiver
                      android:name=".AccWidget"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.appwidget.action.APPWIDGET_UPDATE"/>
                      </intent-filter>
                      <meta-data
                          android:name="android.appwidget.provider"
                          android:resource="@xml/widget_info"/>
                  </receiver>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/example/claudemulti/MainActivity.java <<'EOF'
          package com.example.claudemulti;

          import android.app.Activity;
          import android.app.AlertDialog;
          import android.content.DialogInterface;
          import android.content.Intent;
          import android.content.res.ColorStateList;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.graphics.drawable.RippleDrawable;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.text.TextUtils;
          import android.view.Gravity;
          import android.view.View;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.LinearLayout;
          import android.widget.ProgressBar;
          import android.widget.ScrollView;
          import android.view.ViewGroup;
          import android.widget.TextView;

          public class MainActivity extends Activity {
              private static final int[][] COLORS = new int[][] {
                  { 0xFFFF9966, 0xFFFF5E62 },
                  { 0xFF56CCF2, 0xFF2F80ED },
                  { 0xFF11998E, 0xFF38EF7D },
                  { 0xFFB24592, 0xFFF15F79 }
              };
              private final Class<?>[] cls = new Class<?>[] { Web1.class, Web2.class, Web3.class, Web4.class };
              private final Button[] btns = new Button[4];
              private float dp = 1f;
              private final TextView[] stats = new TextView[4];
              private final ProgressBar[] pbS = new ProgressBar[4];
              private final ProgressBar[] pbW = new ProgressBar[4];
              private final Handler tickH = new Handler(Looper.getMainLooper());
              private final Runnable tick = new Runnable() {
                  @Override
                  public void run() {
                      refreshLabels();
                      tickH.postDelayed(this, 30000);
                  }
              };

              private int px(int v) {
                  return (int) (v * dp + 0.5f);
              }

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  dp = getResources().getDisplayMetrics().density;

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setGravity(Gravity.CENTER);
                  root.setPadding(px(28), px(28), px(28), px(28));
                  root.setBackground(new GradientDrawable(GradientDrawable.Orientation.TL_BR,
                          new int[] { 0xFF141E30, 0xFF243B55, 0xFF5B3A8C }));

                  TextView title = new TextView(this);
                  title.setText("☁ Claude");
                  title.setTextSize(34);
                  title.setTextColor(Color.WHITE);
                  title.setTypeface(null, Typeface.BOLD);
                  title.setGravity(Gravity.CENTER);
                  root.addView(title);

                  TextView sub = new TextView(this);
                  sub.setText("4 акаунти");
                  sub.setTextSize(14);
                  sub.setTextColor(0xB3FFFFFF);
                  sub.setGravity(Gravity.CENTER);
                  LinearLayout.LayoutParams slp = new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT);
                  slp.bottomMargin = px(14);
                  root.addView(sub, slp);

                  for (int i = 0; i < 4; i++) {
                      final int idx = i;
                      Button btn = new Button(this);
                      btn.setAllCaps(false);
                      btn.setTextColor(Color.WHITE);
                      btn.setTextSize(17);
                      btn.setTypeface(null, Typeface.BOLD);
                      btn.setSingleLine(true);
                      btn.setEllipsize(TextUtils.TruncateAt.END);
                      btn.setPadding(px(20), 0, px(20), 0);

                      GradientDrawable g = new GradientDrawable(GradientDrawable.Orientation.LEFT_RIGHT, COLORS[i]);
                      g.setCornerRadius(px(20));
                      GradientDrawable mask = new GradientDrawable();
                      mask.setColor(Color.WHITE);
                      mask.setCornerRadius(px(20));
                      btn.setBackground(new RippleDrawable(ColorStateList.valueOf(0x55FFFFFF), g, mask));

                      btn.setOnClickListener(new View.OnClickListener() {
                          @Override
                          public void onClick(View v) {
                              openAcc(idx);
                          }
                      });
                      btn.setOnLongClickListener(new View.OnLongClickListener() {
                          @Override
                          public boolean onLongClick(View v) {
                              menuAcc(idx + 1);
                              return true;
                          }
                      });
                      LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(
                              LinearLayout.LayoutParams.MATCH_PARENT, px(64));
                      lp.topMargin = px(14);
                      root.addView(btn, lp);
                      btns[i] = btn;

                      LinearLayout bars = new LinearLayout(this);
                      bars.setOrientation(LinearLayout.HORIZONTAL);
                      pbS[i] = bar(0xFF80D8FF);
                      pbW[i] = bar(0xFFFFD180);
                      LinearLayout.LayoutParams b1 = new LinearLayout.LayoutParams(0, px(5), 1f);
                      b1.setMargins(px(10), 0, px(5), 0);
                      bars.addView(pbS[i], b1);
                      LinearLayout.LayoutParams b2 = new LinearLayout.LayoutParams(0, px(5), 1f);
                      b2.setMargins(px(5), 0, px(10), 0);
                      bars.addView(pbW[i], b2);
                      LinearLayout.LayoutParams blp = new LinearLayout.LayoutParams(
                              LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT);
                      blp.topMargin = px(6);
                      root.addView(bars, blp);
                      TextView st = new TextView(this);
                      st.setTextSize(11);
                      st.setTextColor(0xB3FFFFFF);
                      st.setGravity(Gravity.CENTER);
                      stats[i] = st;
                      root.addView(st, new LinearLayout.LayoutParams(
                              LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT));
                  }

                  TextView hint = new TextView(this);
                  hint.setText("Довге натискання на кнопку: назва, оновлення, вихід");
                  hint.setTextSize(12);
                  hint.setTextColor(0x99FFFFFF);
                  hint.setGravity(Gravity.CENTER);
                  LinearLayout.LayoutParams hlp = new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT);
                  hlp.topMargin = px(26);
                  root.addView(hint, hlp);

                  ScrollView sv = new ScrollView(this);
                  sv.setFillViewport(true);
                  sv.addView(root, new ViewGroup.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));
                  setContentView(sv);
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  tickH.removeCallbacks(tick);
                  tickH.post(tick);
              }

              @Override
              protected void onPause() {
                  super.onPause();
                  tickH.removeCallbacks(tick);
              }

              private ProgressBar bar(int color) {
                  ProgressBar p = new ProgressBar(this, null, android.R.attr.progressBarStyleHorizontal);
                  p.setMax(100);
                  p.setProgressTintList(ColorStateList.valueOf(color));
                  p.setProgressBackgroundTintList(ColorStateList.valueOf(0x33FFFFFF));
                  return p;
              }

              private String ago(long ts) {
                  long m = (System.currentTimeMillis() - ts) / 60000;
                  if (m < 1) {
                      return "щойно";
                  }
                  if (m < 60) {
                      return m + " хв тому";
                  }
                  return (m / 60) + " год тому";
              }

              private void refreshLabels() {
                  for (int i = 0; i < btns.length; i++) {
                      btns[i].setText(Store.label(this, i + 1));
                      long[] u = Store.usage(this, i + 1);
                      if (u == null) {
                          stats[i].setText("Ліміт: ? (відкрийте акаунт)");
                          pbS[i].setProgress(0);
                          pbW[i].setProgress(0);
                      } else {
                          stats[i].setText("Сесія " + u[0] + "% · Тиждень " + (u[1] >= 0 ? u[1] + "%" : "?")
                                  + " · " + ago(u[2]));
                          pbS[i].setProgress((int) u[0]);
                          pbW[i].setProgress((int) Math.max(0, u[1]));
                      }
                  }
              }

              private void launch(int n, String key, String val) {
                  Intent it = new Intent(this, cls[n - 1]);
                  it.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                  if (key != null) {
                      if (val == null) {
                          it.putExtra(key, true);
                      } else {
                          it.putExtra(key, val);
                      }
                  }
                  startActivity(it);
              }

              private void openAcc(int i) {
                  Intent it = new Intent(this, cls[i]);
                  it.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                  startActivity(it);
              }

              private void menuAcc(final int n) {
                  final boolean desk = Store.desktop(this, n);
                  new AlertDialog.Builder(this)
                          .setTitle(Store.label(this, n))
                          .setItems(new String[] {
                                  "Змінити назву",
                                  "Використання (відкрити сторінку)",
                                  "Оновити сторінку (без кешу)",
                                  "Комп'ютерна версія: " + (desk ? "вимкнути" : "увімкнути"),
                                  "Вийти з акаунта" },
                                  new DialogInterface.OnClickListener() {
                                      @Override
                                      public void onClick(DialogInterface d, int which) {
                                          if (which == 0) {
                                              renameAcc(n);
                                          } else if (which == 1) {
                                              launch(n, "open", "https://claude.ai/settings/usage");
                                          } else if (which == 2) {
                                              launch(n, "reload", null);
                                          } else if (which == 3) {
                                              Store.setDesktop(MainActivity.this, n, !desk);
                                              launch(n, "reload", null);
                                          } else {
                                              confirmLogout(n);
                                          }
                                      }
                                  })
                          .show();
              }

              private void confirmLogout(final int n) {
                  new AlertDialog.Builder(this)
                          .setMessage("Вийти з акаунта " + Store.label(this, n) + "?")
                          .setPositiveButton("Вийти", new DialogInterface.OnClickListener() {
                              @Override
                              public void onClick(DialogInterface d, int w) {
                                  Intent it = new Intent(MainActivity.this, cls[n - 1]);
                                  it.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                                  it.putExtra("logout", true);
                                  startActivity(it);
                              }
                          })
                          .setNegativeButton("Скасувати", null)
                          .show();
              }

              private void renameAcc(final int n) {
                  final EditText et = new EditText(this);
                  et.setSingleLine(true);
                  et.setText(Store.custom(this, n));
                  et.setHint("Назва");
                  new AlertDialog.Builder(this)
                          .setTitle("Назва кнопки " + n)
                          .setView(et)
                          .setPositiveButton("Зберегти", new DialogInterface.OnClickListener() {
                              @Override
                              public void onClick(DialogInterface d, int w) {
                                  Store.saveName(MainActivity.this, n, et.getText().toString().trim());
                                  refreshLabels();
                                  Store.refreshWidgets(MainActivity.this);
                              }
                          })
                          .setNeutralButton("Скинути", new DialogInterface.OnClickListener() {
                              @Override
                              public void onClick(DialogInterface d, int w) {
                                  Store.saveName(MainActivity.this, n, "");
                                  refreshLabels();
                                  Store.refreshWidgets(MainActivity.this);
                              }
                          })
                          .setNegativeButton("Скасувати", null)
                          .show();
              }
          }
          EOF

          cat > app/src/main/java/com/example/claudemulti/BaseWeb.java <<'EOF'
          package com.example.claudemulti;

          import android.Manifest;
          import android.app.Activity;
          import android.app.AlertDialog;
          import android.content.ActivityNotFoundException;
          import android.content.DialogInterface;
          import android.content.ContentValues;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.graphics.Bitmap;
          import android.graphics.drawable.GradientDrawable;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.os.Handler;
          import android.os.Looper;
          import android.provider.MediaStore;
          import android.util.Base64;
          import android.view.MotionEvent;
          import android.webkit.DownloadListener;
          import android.webkit.URLUtil;
          import android.widget.Toast;
          import java.io.ByteArrayOutputStream;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.io.OutputStream;
          import java.net.HttpURLConnection;
          import android.view.Gravity;
          import android.view.View;
          import android.webkit.CookieManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebStorage;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Button;
          import android.widget.EditText;
          import android.webkit.MimeTypeMap;
          import android.widget.FrameLayout;

          public abstract class BaseWeb extends Activity {
              private static final String URL = "https://claude.ai";
              private static final int REQ_FILE = 1;
              private static final String JS = "(function(){try{fetch('/api/account',{credentials:'include'})"
                      + ".then(function(r){return r.json();})"
                      + ".then(function(j){var e=j&&(j.email_address||j.email);if(e){AndroidBridge.email(String(e));}})"
                      + ".catch(function(){});}catch(x){}})();";
              private static final String HOOK = "(function(){if(window.__dlHook){return;}window.__dlHook=1;"
                      + "document.addEventListener('click',function(e){var a=e.target&&e.target.closest?e.target.closest('a[download]'):null;"
                      + "if(a){AndroidBridge.dlName(a.getAttribute('download')||'');}},true);"
                      + "var o=HTMLAnchorElement.prototype.click;HTMLAnchorElement.prototype.click=function(){"
                      + "if(this.hasAttribute&&this.hasAttribute('download')){AndroidBridge.dlName(this.getAttribute('download')||'');}"
                      + "return o.apply(this,arguments);};})();";
              private volatile String lastDlName = "";
              private volatile long lastDlTime = 0;
              private static final String EXTRACT = "(function(){try{var p=document.querySelectorAll('[role=progressbar]');var r=[];"
                      + "for(var i=0;i<p.length;i++){var v=p[i].getAttribute('aria-valuenow');"
                      + "if(v!==null&&v!==''){r.push(Math.round(parseFloat(v)));}}"
                      + "if(r.length<2){r=[];var t=document.body?document.body.innerText:'';var m=t.match(/(\\d{1,3})\\s?%/g)||[];"
                      + "for(var j=0;j<m.length;j++){r.push(parseInt(m[j],10));}}"
                      + "return r.length>0?(r[0]+','+(r.length>1?r[1]:-1)):'';}catch(e){return '';}})();";
              private static final String DESK_JS = "(function(){var m=document.querySelector('meta[name=viewport]');"
                      + "if(!m){m=document.createElement('meta');m.name='viewport';document.head.appendChild(m);}"
                      + "m.setAttribute('content','width=1100');})();";
              private FrameLayout root;
              private WebView usageWeb;
              private String mobileUa = "";
              private final Handler uiH = new Handler(Looper.getMainLooper());
              private int usageTry;
              private long lastUsageStart;

              private final Runnable usageTick = new Runnable() {
                  @Override
                  public void run() {
                      startUsage();
                      uiH.postDelayed(this, 300000);
                  }
              };

              private final Runnable usageCheck = new Runnable() {
                  @Override
                  public void run() {
                      if (usageWeb == null) {
                          return;
                      }
                      usageWeb.evaluateJavascript(EXTRACT, new ValueCallback<String>() {
                          @Override
                          public void onReceiveValue(String v) {
                              String r = v == null ? "" : v.replace("\"", "").trim();
                              int c = r.indexOf(',');
                              if (c > 0) {
                                  try {
                                      int a = Integer.parseInt(r.substring(0, c));
                                      int b = Integer.parseInt(r.substring(c + 1));
                                      if (a >= 0 && a <= 100) {
                                          Store.saveUsage(getApplicationContext(), idx(), a, b);
                                          Store.refreshWidgets(getApplicationContext());
                                          return;
                                      }
                                  } catch (Exception e) {
                                  }
                              }
                              usageTry++;
                              if (usageTry < 6) {
                                  uiH.postDelayed(usageCheck, 2500);
                              }
                          }
                      });
                  }
              };
              private WebView web;
              private ValueCallback<Uri[]> fileCb;
              private volatile boolean onClaude = false;

              protected abstract String suffix();

              private int idx() {
                  try {
                      return Integer.parseInt(suffix().substring(1));
                  } catch (Exception e) {
                      return 1;
                  }
              }

              private static boolean isClaude(String url) {
                  if (url == null) {
                      return false;
                  }
                  String h = Uri.parse(url).getHost();
                  return h != null && (h.equals("claude.ai") || h.endsWith(".claude.ai"));
              }

              public class Bridge {
                  @JavascriptInterface
                  public void dlName(String n) {
                      if (!onClaude || n == null) {
                          return;
                      }
                      n = n.trim();
                      if (n.length() == 0 || n.length() > 120) {
                          return;
                      }
                      lastDlName = n;
                      lastDlTime = System.currentTimeMillis();
                  }

                  @JavascriptInterface
                  public void saveData(String dataUrl, String name) {
                      if (!onClaude || dataUrl == null) {
                          return;
                      }
                      saveDataUrl(dataUrl, name);
                  }

                  @JavascriptInterface
                  public void email(String e) {
                      if (!onClaude || e == null) {
                          return;
                      }
                      e = e.trim();
                      if (e.length() < 3 || e.length() > 120 || e.indexOf('@') < 1) {
                          return;
                      }
                      Store.saveEmail(getApplicationContext(), idx(), e);
                      Store.refreshWidgets(getApplicationContext());
                  }
              }

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  if (Build.VERSION.SDK_INT >= 28) {
                      try {
                          WebView.setDataDirectorySuffix(suffix());
                      } catch (Throwable e) {
                      }
                  }
                  web = new WebView(this);
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setAllowFileAccess(false);
                  s.setTextZoom(100);
                  s.setUseWideViewPort(true);
                  s.setLoadWithOverviewMode(true);
                  if (Build.VERSION.SDK_INT >= 29) {
                      try {
                          s.setForceDark(WebSettings.FORCE_DARK_OFF);
                      } catch (Throwable e) {
                      }
                  }
                  mobileUa = s.getUserAgentString().replace("; wv", "").replace(" Version/4.0", "");
                  applyMode();
                  CookieManager cm = CookieManager.getInstance();
                  cm.setAcceptCookie(true);
                  cm.setAcceptThirdPartyCookies(web, true);
                  web.addJavascriptInterface(new Bridge(), "AndroidBridge");

                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public void onPageStarted(WebView v, String url, Bitmap icon) {
                          onClaude = isClaude(url);
                      }

                      @Override
                      public void onPageFinished(WebView v, String url) {
                          onClaude = isClaude(url);
                          if (onClaude) {
                              v.evaluateJavascript(JS, null);
                              v.evaluateJavascript(HOOK, null);
                              if (Store.desktop(getApplicationContext(), idx())) {
                                  v.evaluateJavascript(DESK_JS, null);
                              }
                          }
                      }

                      @Override
                      public boolean shouldOverrideUrlLoading(WebView v, String url) {
                          if (url.startsWith("http://") || url.startsWith("https://")) {
                              return false;
                          }
                          try {
                              startActivity(new Intent(Intent.ACTION_VIEW, Uri.parse(url)));
                          } catch (Exception e) {
                          }
                          return true;
                      }
                  });
                  web.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onShowFileChooser(WebView v, ValueCallback<Uri[]> cb,
                                                       WebChromeClient.FileChooserParams params) {
                          if (fileCb != null) {
                              fileCb.onReceiveValue(null);
                          }
                          fileCb = cb;
                          try {
                              startActivityForResult(params.createIntent(), REQ_FILE);
                          } catch (ActivityNotFoundException e) {
                              fileCb = null;
                              return false;
                          }
                          return true;
                      }
                  });

                  web.setDownloadListener(new DownloadListener() {
                      @Override
                      public void onDownloadStart(String url, String ua, String cd, String mime, long len) {
                          startDownload(url, ua, cd, mime);
                      }
                  });

                  root = new FrameLayout(this);
                  root.addView(web, new FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.MATCH_PARENT, FrameLayout.LayoutParams.MATCH_PARENT));
                  setContentView(root);

                  getIntent().removeExtra("reload");
                  if (getIntent().getBooleanExtra("logout", false)) {
                      getIntent().removeExtra("logout");
                      doLogout();
                  } else if (b != null) {
                      web.restoreState(b);
                  } else {
                      String open = getIntent().getStringExtra("open");
                      getIntent().removeExtra("open");
                      web.loadUrl(open != null && isClaude(open) ? open : URL);
                  }
              }

              @Override
              protected void onNewIntent(Intent i) {
                  super.onNewIntent(i);
                  setIntent(i);
                  if (i.getBooleanExtra("logout", false)) {
                      i.removeExtra("logout");
                      doLogout();
                  } else if (i.getBooleanExtra("reload", false)) {
                      i.removeExtra("reload");
                      applyMode();
                      web.clearCache(true);
                      web.reload();
                  } else if (i.getStringExtra("open") != null) {
                      String o = i.getStringExtra("open");
                      i.removeExtra("open");
                      if (isClaude(o)) {
                          web.loadUrl(o);
                      }
                  }
              }

              private void toast(final String m) {
                  runOnUiThread(new Runnable() {
                      @Override
                      public void run() {
                          Toast.makeText(BaseWeb.this, m, Toast.LENGTH_LONG).show();
                      }
                  });
              }

              private void saveBytes(byte[] data, String name, String mime) {
                  try {
                      if (Build.VERSION.SDK_INT >= 29) {
                          ContentValues cv = new ContentValues();
                          cv.put(MediaStore.MediaColumns.DISPLAY_NAME, name);
                          int dot = name.lastIndexOf('.');
                          String ext = dot >= 0 ? name.substring(dot + 1).toLowerCase() : "";
                          String mm = MimeTypeMap.getSingleton().getMimeTypeFromExtension(ext);
                          if (mm != null) {
                              cv.put(MediaStore.MediaColumns.MIME_TYPE, mm);
                          }
                          cv.put(MediaStore.MediaColumns.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS);
                          Uri u = getContentResolver().insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, cv);
                          OutputStream o = getContentResolver().openOutputStream(u);
                          o.write(data);
                          o.close();
                      } else {
                          if (checkSelfPermission(Manifest.permission.WRITE_EXTERNAL_STORAGE)
                                  != PackageManager.PERMISSION_GRANTED) {
                              runOnUiThread(new Runnable() {
                                  @Override
                                  public void run() {
                                      requestPermissions(new String[] { Manifest.permission.WRITE_EXTERNAL_STORAGE }, 7);
                                  }
                              });
                              toast("Дозвольте доступ до файлів і повторіть завантаження");
                              return;
                          }
                          File dir = Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS);
                          dir.mkdirs();
                          FileOutputStream o = new FileOutputStream(new File(dir, name));
                          o.write(data);
                          o.close();
                      }
                      toast("Збережено в Завантаження: " + name);
                  } catch (Exception e) {
                      toast("Не вдалося зберегти файл");
                  }
              }

              private void saveDataUrl(String d, String name) {
                  try {
                      int c = d.indexOf(',');
                      String head = d.substring(0, c);
                      String body = d.substring(c + 1);
                      String mime = "application/octet-stream";
                      if (head.startsWith("data:")) {
                          String m = head.substring(5);
                          int sc = m.indexOf(';');
                          if (sc >= 0) {
                              m = m.substring(0, sc);
                          }
                          if (m.length() > 0) {
                              mime = m;
                          }
                      }
                      byte[] bytes;
                      if (head.contains(";base64")) {
                          bytes = Base64.decode(body, Base64.DEFAULT);
                      } else {
                          bytes = Uri.decode(body).getBytes("UTF-8");
                      }
                      saveBytes(bytes, name, mime);
                  } catch (Exception e) {
                      toast("Не вдалося зберегти файл");
                  }
              }

              private void startDownload(final String url, final String ua, String cd, final String mime) {
                  String known = "";
                  if (System.currentTimeMillis() - lastDlTime < 20000) {
                      known = lastDlName;
                  }
                  lastDlName = "";
                  final String guessed = URLUtil.guessFileName(url, cd, mime);
                  boolean hasCd = cd != null && cd.toLowerCase().contains("filename");
                  if (known.length() > 0) {
                      doDownload(url, ua, known, mime);
                      return;
                  }
                  if (hasCd || !guessed.endsWith(".bin")) {
                      doDownload(url, ua, guessed, mime);
                      return;
                  }
                  final EditText et = new EditText(this);
                  et.setSingleLine(true);
                  et.setText(guessed);
                  new AlertDialog.Builder(this)
                          .setTitle("Назва файлу")
                          .setView(et)
                          .setPositiveButton("Зберегти", new DialogInterface.OnClickListener() {
                              @Override
                              public void onClick(DialogInterface d, int w) {
                                  String n = et.getText().toString().trim();
                                  if (n.length() == 0) {
                                      n = guessed;
                                  }
                                  doDownload(url, ua, n, mime);
                              }
                          })
                          .setNegativeButton("Скасувати", null)
                          .show();
              }

              private void doDownload(final String url, final String ua, String nm, final String mime) {
                  final String name = nm.replace("/", "_").replace("\\", "_");
                  if (url.startsWith("blob:")) {
                      String u = url.replace("\\", "").replace("'", "");
                      String n = name.replace("'", "");
                      web.evaluateJavascript("(function(u,n){var x=new XMLHttpRequest();x.open('GET',u);"
                              + "x.responseType='blob';x.onload=function(){var r=new FileReader();"
                              + "r.onloadend=function(){AndroidBridge.saveData(String(r.result),n);};"
                              + "r.readAsDataURL(x.response);};x.send();})('" + u + "','" + n + "');", null);
                      toast("Завантаження…");
                      return;
                  }
                  final String cookie = CookieManager.getInstance().getCookie(url);
                  toast("Завантаження…");
                  new Thread(new Runnable() {
                      @Override
                      public void run() {
                          try {
                              if (url.startsWith("data:")) {
                                  saveDataUrl(url, name);
                                  return;
                              }
                              HttpURLConnection c = (HttpURLConnection) new java.net.URL(url).openConnection();
                              c.setRequestProperty("User-Agent", ua);
                              if (cookie != null) {
                                  c.setRequestProperty("Cookie", cookie);
                              }
                              c.setConnectTimeout(20000);
                              c.setReadTimeout(60000);
                              InputStream in = c.getInputStream();
                              ByteArrayOutputStream bo = new ByteArrayOutputStream();
                              byte[] buf = new byte[8192];
                              int r;
                              while ((r = in.read(buf)) > 0) {
                                  bo.write(buf, 0, r);
                              }
                              in.close();
                              String mt = (mime != null && mime.length() > 0) ? mime : "application/octet-stream";
                              saveBytes(bo.toByteArray(), name, mt);
                          } catch (Exception e) {
                              toast("Не вдалося завантажити файл");
                          }
                      }
                  }).start();
              }

              private void applyMode() {
                  WebSettings s = web.getSettings();
                  if (Store.desktop(getApplicationContext(), idx())) {
                      String ver = "120.0.0.0";
                      int i = mobileUa.indexOf("Chrome/");
                      if (i >= 0) {
                          int e = mobileUa.indexOf(' ', i);
                          ver = mobileUa.substring(i + 7, e > 0 ? e : mobileUa.length());
                      }
                      s.setUserAgentString("Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/"
                              + ver + " Safari/537.36");
                      s.setSupportZoom(true);
                      s.setBuiltInZoomControls(true);
                      s.setDisplayZoomControls(false);
                  } else {
                      s.setUserAgentString(mobileUa);
                      s.setBuiltInZoomControls(false);
                  }
              }

              private void startUsage() {
                  long now = System.currentTimeMillis();
                  if (now - lastUsageStart < 60000) {
                      return;
                  }
                  lastUsageStart = now;
                  if (usageWeb == null) {
                      usageWeb = new WebView(this);
                      WebSettings us = usageWeb.getSettings();
                      us.setJavaScriptEnabled(true);
                      us.setDomStorageEnabled(true);
                      us.setUserAgentString(mobileUa);
                      usageWeb.setWebViewClient(new WebViewClient() {
                          @Override
                          public void onPageFinished(WebView v, String url) {
                              if (url != null && url.contains("/settings/usage")) {
                                  usageTry = 0;
                                  uiH.removeCallbacks(usageCheck);
                                  uiH.postDelayed(usageCheck, 2500);
                              }
                          }
                      });
                      root.addView(usageWeb, 0, new FrameLayout.LayoutParams(
                              FrameLayout.LayoutParams.MATCH_PARENT, FrameLayout.LayoutParams.MATCH_PARENT));
                  }
                  usageWeb.loadUrl(URL + "/settings/usage");
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  uiH.removeCallbacks(usageTick);
                  uiH.post(usageTick);
              }

              private void doLogout() {
                  CookieManager cm = CookieManager.getInstance();
                  cm.removeAllCookies(null);
                  cm.flush();
                  WebStorage.getInstance().deleteAllData();
                  web.clearCache(true);
                  web.clearHistory();
                  Store.saveEmail(getApplicationContext(), idx(), "");
                  Store.refreshWidgets(getApplicationContext());
                  web.loadUrl(URL);
              }

              @Override
              protected void onActivityResult(int req, int res, Intent data) {
                  if (req == REQ_FILE && fileCb != null) {
                      fileCb.onReceiveValue(WebChromeClient.FileChooserParams.parseResult(res, data));
                      fileCb = null;
                  } else {
                      super.onActivityResult(req, res, data);
                  }
              }

              @Override
              protected void onSaveInstanceState(Bundle out) {
                  super.onSaveInstanceState(out);
                  web.saveState(out);
              }

              @Override
              protected void onPause() {
                  super.onPause();
                  uiH.removeCallbacks(usageTick);
                  CookieManager.getInstance().flush();
              }

              @Override
              public void onBackPressed() {
                  if (web.canGoBack()) {
                      web.goBack();
                  } else {
                      moveTaskToBack(true);
                  }
              }

              @Override
              protected void onDestroy() {
                  super.onDestroy();
                  uiH.removeCallbacks(usageTick);
                  uiH.removeCallbacks(usageCheck);
                  if (usageWeb != null) {
                      usageWeb.destroy();
                  }
                  web.destroy();
              }
          }
