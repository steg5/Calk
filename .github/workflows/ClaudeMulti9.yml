          package com.example.claudemulti;

          import android.app.PendingIntent;
          import android.appwidget.AppWidgetManager;
          import android.appwidget.AppWidgetProvider;
          import android.content.Context;
          import android.content.Intent;
          import android.graphics.Bitmap;
          import android.graphics.Canvas;
          import android.graphics.Paint;
          import android.graphics.RectF;
          import android.view.View;
          import android.widget.RemoteViews;

          public class AccWidget extends AppWidgetProvider {
              @Override
              public void onUpdate(Context ctx, AppWidgetManager mgr, int[] ids) {
                  render(ctx, mgr, ids);
              }

              private static Bitmap cloud() {
                  Bitmap bm = Bitmap.createBitmap(72, 72, Bitmap.Config.ARGB_8888);
                  Canvas c = new Canvas(bm);
                  Paint p = new Paint(Paint.ANTI_ALIAS_FLAG);
                  p.setColor(0xFFFFFFFF);
                  c.drawCircle(26f, 40f, 12f, p);
                  c.drawCircle(40f, 30f, 16f, p);
                  c.drawCircle(54f, 41f, 11f, p);
                  c.drawRoundRect(new RectF(14f, 40f, 65f, 54f), 7f, 7f, p);
                  return bm;
              }

              private static String cut(String x) {
                  return x.length() > 11 ? x.substring(0, 10) + "…" : x;
              }

              private static String fmt(String s) {
                  int at = s.indexOf('@');
                  if (at > 0) {
                      return cut(s.substring(0, at)) + "\n" + cut(s.substring(at));
                  }
                  return s;
              }

              public static void render(Context ctx, AppWidgetManager mgr, int[] ids) {
                  Class<?>[] cls = new Class<?>[] { Web1.class, Web2.class, Web3.class, Web4.class };
                  int[] cell = new int[] { R.id.c1, R.id.c2, R.id.c3, R.id.c4 };
                  int[] img = new int[] { R.id.i1, R.id.i2, R.id.i3, R.id.i4 };
                  int[] txt = new int[] { R.id.t1, R.id.t2, R.id.t3, R.id.t4 };
                  int[] pb = new int[] { R.id.p1, R.id.p2, R.id.p3, R.id.p4 };
                  Bitmap cl = cloud();
                  for (int id : ids) {
                      RemoteViews rv = new RemoteViews(ctx.getPackageName(), R.layout.widget);
                      for (int i = 0; i < cls.length; i++) {
                          Intent it = new Intent(ctx, cls[i]);
                          it.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                          PendingIntent pi = PendingIntent.getActivity(ctx, i, it,
                                  PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
                          rv.setOnClickPendingIntent(cell[i], pi);
                          rv.setImageViewBitmap(img[i], cl);
                          rv.setTextViewText(txt[i], fmt(Store.label(ctx, i + 1)));
                          long[] u = Store.usage(ctx, i + 1);
                          if (u != null) {
                              rv.setViewVisibility(pb[i], View.VISIBLE);
                              rv.setProgressBar(pb[i], 100, (int) u[0], false);
                          } else {
                              rv.setViewVisibility(pb[i], View.INVISIBLE);
                          }
                      }
                      mgr.updateAppWidget(id, rv);
                  }
              }
          }
