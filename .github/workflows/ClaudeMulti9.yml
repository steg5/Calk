          package com.example.claudemulti;

          import android.appwidget.AppWidgetManager;
          import android.content.ComponentName;
          import android.content.Context;
          import java.io.File;
          import java.io.FileInputStream;
          import java.io.FileOutputStream;

          public class Store {
              private static File file(Context c, String key, int n) {
                  return new File(c.getApplicationContext().getFilesDir(), key + n + ".txt");
              }

              private static String read(Context c, String key, int n) {
                  try {
                      File f = file(c, key, n);
                      if (!f.exists()) {
                          return "";
                      }
                      FileInputStream in = new FileInputStream(f);
                      byte[] buf = new byte[(int) f.length()];
                      int off = 0;
                      while (off < buf.length) {
                          int r = in.read(buf, off, buf.length - off);
                          if (r < 0) {
                              break;
                          }
                          off += r;
                      }
                      in.close();
                      return new String(buf, 0, off, "UTF-8").trim();
                  } catch (Exception e) {
                      return "";
                  }
              }

              private static void write(Context c, String key, int n, String v) {
                  try {
                      File f = file(c, key, n);
                      if (v == null || v.length() == 0) {
                          f.delete();
                          return;
                      }
                      FileOutputStream o = new FileOutputStream(f);
                      o.write(v.getBytes("UTF-8"));
                      o.close();
                  } catch (Exception e) {
                  }
              }

              public static String custom(Context c, int n) {
                  return read(c, "name", n);
              }

              public static String email(Context c, int n) {
                  return read(c, "email", n);
              }

              public static String label(Context c, int n) {
                  String s = custom(c, n);
                  if (s.length() > 0) {
                      return s;
                  }
                  s = email(c, n);
                  if (s.length() > 0) {
                      return s;
                  }
                  return "Акаунт " + n;
              }

              public static void saveName(Context c, int n, String v) {
                  if (v != null && v.length() > 40) {
                      v = v.substring(0, 40);
                  }
                  write(c, "name", n, v);
              }

              public static void saveEmail(Context c, int n, String v) {
                  write(c, "email", n, v);
              }

              public static boolean desktop(Context c, int n) {
                  return read(c, "desk", n).equals("1");
              }

              public static void setDesktop(Context c, int n, boolean on) {
                  write(c, "desk", n, on ? "1" : "");
              }

              public static void saveUsage(Context c, int n, int s, int w) {
                  write(c, "usage", n, s + "," + w + "," + System.currentTimeMillis());
              }

              // {сесія, тиждень, час запису} або null
              public static long[] usage(Context c, int n) {
                  try {
                      String[] p = read(c, "usage", n).split(",");
                      if (p.length < 3) {
                          return null;
                      }
                      return new long[] { Long.parseLong(p[0]), Long.parseLong(p[1]), Long.parseLong(p[2]) };
                  } catch (Exception e) {
                      return null;
                  }
              }

              public static void refreshWidgets(Context c) {
                  try {
                      Context a = c.getApplicationContext();
                      AppWidgetManager m = AppWidgetManager.getInstance(a);
                      int[] ids = m.getAppWidgetIds(new ComponentName(a, AccWidget.class));
                      if (ids != null && ids.length > 0) {
                          AccWidget.render(a, m, ids);
                      }
                  } catch (Exception e) {
                  }
              }
          }
