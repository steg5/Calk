              // ================= Сканування =================

              void startScan() {
                  if (scanning) {
                      scanStop = true;
                      return;
                  }
                  if (!tuner.haveState && tuner.freq == 0) {
                      Toast.makeText(this, "Тюнер ще не відповідає. Зачекай, поки радіо ввімкнеться.", Toast.LENGTH_LONG).show();
                      return;
                  }
                  scanning = true;
                  scanStop = false;
                  btnScan.set(7, "Зупинити пошук", false);
                  updateUi();
                  showTab(2);
                  new Thread(new Runnable() {
                      @Override
                      public void run() {
                          int found = 0;
                          try {
                              tuner.tune(MainActivity.this, FMIN, MainActivity.class);
                              Thread.sleep(500);
                              long tw = System.currentTimeMillis();
                              while (tuner.busy() && System.currentTimeMillis() - tw < 40000) Thread.sleep(100);
                              Thread.sleep(2000);
                              int last = 0;
                              for (int n = 0; n < 80 && !scanStop; n++) {
                                  tuner.next();
                                  long t0 = System.currentTimeMillis();
                                  boolean seen = false;
                                  while (System.currentTimeMillis() - t0 < 12000) {
                                      Thread.sleep(60);
                                      if (tuner.seeking) seen = true;
                                      else if (seen) break;
                                      else if (System.currentTimeMillis() - t0 > 2500) break;
                                  }
                                  Thread.sleep(300);
                                  int f = tuner.freq;
                                  if (f < FMIN || f > FMAX) break;
                                  if (last != 0 && f <= last) break;
                                  last = f;
                                  found++;
                                  final String msg = "Знайдено: " + found + ", зараз " + Station.fmt(f) + " МГц";
                                  runOnUiThread(() -> tvScan.setText(msg));
                                  Thread.sleep(2800);
                                  String ps = tuner.ps;
                                  Station s = store.getOrCreate(f);
                                  if (s.name.isEmpty()) {
                                      if (!ps.isEmpty()) s.name = ps;
                                      else {
                                          int i = Lviv.match(f);
                                          if (i >= 0) s.name = (String) Lviv.LIST[i][1];
                                      }
                                  }
                                  store.save();
                              }
                          } catch (Throwable ignored) {
                          }
                          scanning = false;
                          final int total = found;
                          runOnUiThread(() -> {
                              btnScan.set(6, "Знайти станції", false);
                              tvScan.setText("Готово. Знайдено станцій: " + total);
                              if (tuner.freq >= FMIN && tuner.freq <= FMAX) cur = tuner.freq;
                              refreshLists();
                              updateUi();
                          });
                      }
                  }).start();
              }
          }
