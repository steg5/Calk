              GradientDrawable metalBg(int radiusDp, int rgb, int alpha) {
                  GradientDrawable g = new GradientDrawable(GradientDrawable.Orientation.TOP_BOTTOM, new int[]{
                          withA(mixC(rgb, 0xFFFFFF, 0.55f), alpha), withA(rgb, alpha), withA(mixC(rgb, 0x000000, 0.38f), alpha), withA(mixC(rgb, 0xFFFFFF, 0.22f), alpha)});
                  g.setCornerRadius(dp(radiusDp));
                  return g;
              }

              android.graphics.drawable.Drawable glowWrap(android.graphics.drawable.Drawable base, int radiusDp, int col, int g) {
                  if (g <= 0) return base;
                  int n = 5;
                  android.graphics.drawable.Drawable[] ls = new android.graphics.drawable.Drawable[n + 1];
                  ls[0] = base;
                  int w = Math.max(1, dp(2));
                  for (int i = 0; i < n; i++) {
                      GradientDrawable ring = new GradientDrawable();
                      ring.setColor(0);
                      ring.setCornerRadius(Math.max(1, dp(radiusDp) - i * w));
                      ring.setStroke(w, withA(col, Math.round(255 * (g / 100f) * 0.55f * (1f - i / (float) n))));
                      ls[i + 1] = ring;
                  }
                  android.graphics.drawable.LayerDrawable ld = new android.graphics.drawable.LayerDrawable(ls);
                  for (int i = 0; i < n; i++) ld.setLayerInset(i + 1, i * w, i * w, i * w, i * w);
                  return ld;
              }

              android.graphics.drawable.Drawable outlineWrap(android.graphics.drawable.Drawable d, int radiusDp) {
                  if (!uisp.getBoolean("outl_b", false)) return d;
                  GradientDrawable ring = new GradientDrawable();
                  ring.setColor(0);
                  ring.setCornerRadius(dp(radiusDp));
                  ring.setStroke(Math.max(1, dp(uisp.getInt("outW_b", 3))), uisp.getInt("outC_b", -1) | 0xFF000000);
                  return new android.graphics.drawable.LayerDrawable(new android.graphics.drawable.Drawable[]{d, ring});
              }

              android.graphics.drawable.Drawable blockBg(int base, int radiusDp, float radialPx) {
                  GradientDrawable core;
                  if (uisp.getInt("met1", -1) >= 0) {
                      int mc = hsvc(new float[]{uisp.getFloat("bH", 4), uisp.getFloat("bS", 0.9f), uisp.getFloat("bV", 0.25f)});
                      core = metalBg(radiusDp, mc & 0xFFFFFF, base >>> 24);
                  } else {
                      core = styled(base, radiusDp, radialPx);
                  }
                  return outlineWrap(glowWrap(core, radiusDp, ACC, uisp.getInt("bglow", 0)), radiusDp);
              }

              class Wheel extends View {
                  float h = 0, s = 0, v = 1;
                  Bitmap bmp;
                  Runnable cb;
                  final Paint wp = new Paint(Paint.ANTI_ALIAS_FLAG);

                  Wheel(Context cx) {
                      super(cx);
                  }

                  @Override
                  protected void onSizeChanged(int w, int hh, int ow, int oh) {
                      int n = Math.min(w, hh);
                      if (n <= 0) return;
                      bmp = Bitmap.createBitmap(n, n, Bitmap.Config.ARGB_8888);
                      int[] pxs = new int[n * n];
                      float r = n / 2f;
                      float[] hv = {0, 0, 1};
                      for (int y = 0; y < n; y++) {
                          for (int x = 0; x < n; x++) {
                              float dx = x + 0.5f - r, dy = y + 0.5f - r;
                              float d = (float) Math.sqrt(dx * dx + dy * dy);
                              if (d > r) {
                                  pxs[y * n + x] = 0;
                                  continue;
                              }
                              float an = (float) Math.toDegrees(Math.atan2(dy, dx));
                              if (an < 0) an += 360;
                              hv[0] = an;
                              hv[1] = d / r;
                              pxs[y * n + x] = Color.HSVToColor(hv);
                          }
                      }
                      bmp.setPixels(pxs, 0, n, 0, 0, n, n);
                  }

                  @Override
                  protected void onDraw(Canvas cv) {
                      if (bmp == null) return;
                      float n = bmp.getWidth(), r = n / 2f;
                      cv.drawBitmap(bmp, 0, 0, null);
                      wp.setStyle(Paint.Style.FILL);
                      wp.setColor(Color.argb(Math.round((1 - v) * 255), 0, 0, 0));
                      cv.drawCircle(r, r, r, wp);
                      double an = Math.toRadians(h);
                      float mx = r + (float) Math.cos(an) * s * r, my = r + (float) Math.sin(an) * s * r;
                      wp.setStyle(Paint.Style.STROKE);
                      wp.setStrokeWidth(dp(4));
                      wp.setColor(0xFF000000);
                      cv.drawCircle(mx, my, dp(11), wp);
                      wp.setStrokeWidth(dp(2));
                      wp.setColor(0xFFFFFFFF);
                      cv.drawCircle(mx, my, dp(11), wp);
                  }

                  @Override
                  public boolean onTouchEvent(MotionEvent e) {
                      if (getParent() != null) getParent().requestDisallowInterceptTouchEvent(true);
                      float r = getWidth() / 2f;
                      float dx = e.getX() - r, dy = e.getY() - r;
                      float d = (float) Math.sqrt(dx * dx + dy * dy);
                      float an = (float) Math.toDegrees(Math.atan2(dy, dx));
                      if (an < 0) an += 360;
                      h = an;
                      s = Math.min(1f, d / r);
                      invalidate();
                      if (cb != null) cb.run();
                      return true;
                  }
              }

              class RstGlyph extends View {
                  int col = 0xFFFFFFFF;
                  final Paint gp = new Paint(Paint.ANTI_ALIAS_FLAG);

                  RstGlyph(Context cx) {
                      super(cx);
                      setClickable(true);
                  }

                  @Override
                  protected void onDraw(Canvas cv) {
                      float s = Math.min(getWidth(), getHeight()) * 0.36f;
                      cv.translate(getWidth() / 2f, getHeight() / 2f);
                      gp.setColor(col);
                      gp.setStyle(Paint.Style.STROKE);
                      gp.setStrokeWidth(s * 0.16f);
                      gp.setStrokeCap(Paint.Cap.ROUND);
                      gp.setStrokeJoin(Paint.Join.ROUND);
                      cv.drawArc(new RectF(-s * 0.6f, -s * 0.6f, s * 0.6f, s * 0.6f), -60, 300, false, gp);
                      float ex = (float) Math.cos(Math.toRadians(240)) * 0.6f * s, ey = (float) Math.sin(Math.toRadians(240)) * 0.6f * s;
                      Path hp = new Path();
                      hp.moveTo(ex + 0.866f * 0.45f * s, ey - 0.5f * 0.45f * s);
                      hp.lineTo(ex + 0.5f * 0.35f * s, ey + 0.866f * 0.35f * s);
                      hp.lineTo(ex - 0.5f * 0.35f * s, ey - 0.866f * 0.35f * s);
                      hp.close();
                      gp.setStyle(Paint.Style.FILL);
                      cv.drawPath(hp, gp);
                  }
              }

              float[] hsvIn(float h, float s, float v) {
                  if (h < 0) return new float[]{0, 0, 0};
                  if (h > 360) return new float[]{0, 0, 1};
                  return new float[]{h, s, v};
              }

