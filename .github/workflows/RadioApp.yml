          package com.example.radioapp;

          import android.content.Context;
          import android.graphics.Bitmap;
          import android.graphics.BitmapFactory;
          import android.graphics.Canvas;
          import android.graphics.Paint;
          import android.graphics.Typeface;
          import android.os.Handler;
          import android.os.Looper;
          import android.widget.ImageView;

          import org.json.JSONArray;
          import org.json.JSONObject;

          import java.io.ByteArrayOutputStream;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.net.URLEncoder;
          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;

          /** Логотипи станцій: кеш на диску, пошук в radio-browser.info, запасний варіант — кольорова літера. */
          final class Logos {
              private Logos() {
              }

              private static final ExecutorService EX = Executors.newSingleThreadExecutor();
              private static final Handler UI = new Handler(Looper.getMainLooper());
              private static final String[] HOSTS = {
                  "https://de1.api.radio-browser.info", "https://at1.api.radio-browser.info", "https://nl1.api.radio-browser.info"
              };

              static Bitmap letter(String name, int size) {
                  Bitmap b = Bitmap.createBitmap(size, size, Bitmap.Config.ARGB_8888);
                  Canvas c = new Canvas(b);
                  Paint p = new Paint(Paint.ANTI_ALIAS_FLAG);
                  int h = Math.abs((name == null ? "" : name).hashCode());
                  int[] cols = {0xFF1565C0, 0xFF00838F, 0xFF2E7D32, 0xFFAD1457, 0xFF6A1B9A, 0xFFEF6C00, 0xFF37474F, 0xFFC62828};
                  p.setColor(cols[h % cols.length]);
                  c.drawCircle(size / 2f, size / 2f, size / 2f, p);
                  p.setColor(0xFFFFFFFF);
                  p.setTextAlign(Paint.Align.CENTER);
                  p.setTypeface(Typeface.DEFAULT_BOLD);
                  p.setTextSize(size * 0.5f);
                  String t = (name == null || name.trim().isEmpty()) ? "FM" : name.trim().substring(0, 1).toUpperCase();
                  c.drawText(t, size / 2f, size / 2f + size * 0.18f, p);
                  return b;
              }

              static void load(final Context ctx, final String key, final String display, final String query, final String url, final ImageView iv) {
                  iv.setTag(key);
                  iv.setImageBitmap(letter(display, 128));
                  final String q = (query == null || query.trim().isEmpty()) ? display : query;
                  if ((url == null || url.isEmpty()) && (q == null || q.trim().isEmpty())) return;
                  EX.execute(new Runnable() {
                      @Override
                      public void run() {
                          try {
                              File dir = new File(ctx.getCacheDir(), "logos");
                              dir.mkdirs();
                              String id = Integer.toHexString((q + "|" + url).hashCode());
                              File f = new File(dir, id + ".png");
                              File none = new File(dir, id + ".none");
                              Bitmap bm = null;
                              if (f.exists()) {
                                  bm = BitmapFactory.decodeFile(f.getAbsolutePath());
                              } else if (!(none.exists() && System.currentTimeMillis() - none.lastModified() < 3 * 24 * 3600 * 1000L)) {
                                  String u = url;
                                  if (u == null || u.isEmpty()) u = lookup(q);
                                  if (u != null && !u.isEmpty()) {
                                      byte[] data = download(u);
                                      if (data != null) bm = BitmapFactory.decodeByteArray(data, 0, data.length);
                                  }
                                  if (bm != null) {
                                      int w = bm.getWidth(), h = bm.getHeight();
                                      float k = 192f / Math.max(w, h);
                                      if (k < 1f) bm = Bitmap.createScaledBitmap(bm, Math.max(1, (int) (w * k)), Math.max(1, (int) (h * k)), true);
                                      FileOutputStream fo = new FileOutputStream(f);
                                      bm.compress(Bitmap.CompressFormat.PNG, 100, fo);
                                      fo.close();
                                  } else {
                                      new FileOutputStream(none).close();
                                      none.setLastModified(System.currentTimeMillis());
                                  }
                              }
                              if (bm == null) return;
                              final Bitmap fb = bm;
                              UI.post(new Runnable() {
                                  @Override
                                  public void run() {
                                      if (key.equals(iv.getTag())) iv.setImageBitmap(fb);
                                  }
                              });
                          } catch (Throwable ignored) {
                          }
                      }
                  });
              }

              private static String lookup(String name) {
                  for (String host : HOSTS) {
                      try {
                          String u = host + "/json/stations/search?countrycode=UA&hidebroken=true&order=votes&reverse=true&limit=6&name="
                                  + URLEncoder.encode(name, "UTF-8");
                          byte[] d = download(u);
                          if (d == null) continue;
                          JSONArray a = new JSONArray(new String(d, "UTF-8"));
                          for (int i = 0; i < a.length(); i++) {
                              JSONObject o = a.getJSONObject(i);
                              String fav = o.optString("favicon", "");
                              if (!fav.isEmpty()) return fav;
                          }
                          return null;
                      } catch (Throwable ignored) {
                      }
                  }
                  return null;
              }

              private static byte[] download(String u) {
                  HttpURLConnection c = null;
                  try {
                      c = (HttpURLConnection) new URL(u).openConnection();
                      c.setConnectTimeout(6000);
                      c.setReadTimeout(8000);
                      c.setRequestProperty("User-Agent", "RadioApp/1.0");
                      if (c.getResponseCode() != 200) return null;
                      InputStream in = c.getInputStream();
                      ByteArrayOutputStream bo = new ByteArrayOutputStream();
                      byte[] buf = new byte[8192];
                      int n;
                      while ((n = in.read(buf)) > 0) {
                          bo.write(buf, 0, n);
                          if (bo.size() > 600000) return null;
                      }
                      return bo.toByteArray();
                  } catch (Throwable t) {
                      return null;
                  } finally {
                      if (c != null) c.disconnect();
                  }
              }
          }
          EOF

