          package com.example.radioapp;

          import android.content.Context;
          import android.content.SharedPreferences;

          import org.json.JSONArray;
          import org.json.JSONObject;

          import java.util.TreeMap;

          /** Постійне сховище: список станцій і остання станція. Пишеться синхронно (commit), щоб пережити відключення живлення. */
          final class Store {
              private final SharedPreferences sp;
              final TreeMap<Integer, Station> known = new TreeMap<Integer, Station>();

              Store(Context c) {
                  sp = c.getSharedPreferences("radio", Context.MODE_PRIVATE);
                  try {
                      JSONArray a = new JSONArray(sp.getString("st", "[]"));
                      for (int i = 0; i < a.length(); i++) {
                          JSONObject o = a.getJSONObject(i);
                          Station s = new Station(o.getInt("f"));
                          s.name = o.optString("n", "");
                          s.alias = o.optString("a", "");
                          s.logo = o.optString("u", "");
                          s.fav = o.optBoolean("v", false);
                          known.put(s.f, s);
                      }
                  } catch (Throwable ignored) {
                  }
              }

              synchronized void save() {
                  try {
                      JSONArray a = new JSONArray();
                      for (Station s : known.values()) {
                          JSONObject o = new JSONObject();
                          o.put("f", s.f);
                          o.put("n", s.name);
                          o.put("a", s.alias);
                          o.put("u", s.logo);
                          o.put("v", s.fav);
                          a.put(o);
                      }
                      sp.edit().putString("st", a.toString()).commit();
                  } catch (Throwable ignored) {
                  }
              }

              synchronized Station get(int f) {
                  return known.get(f);
              }

              synchronized Station getOrCreate(int f) {
                  Station s = known.get(f);
                  if (s == null) {
                      s = new Station(f);
                      known.put(f, s);
                  }
                  return s;
              }

              synchronized void remove(int f) {
                  known.remove(f);
                  save();
              }

              int last() {
                  return sp.getInt("last", 0);
              }

              void setLast(int f) {
                  sp.edit().putInt("last", f).commit();
              }
          }
