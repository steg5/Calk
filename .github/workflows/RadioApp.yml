name: RadioApp

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/RadioApp.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Write project
        run: |
          mkdir -p app/src/main/java/com/example/radioapp
          echo '' | base64 -d > debug.keystore

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'RadioApp'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=false
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.example.radioapp'
              compileSdk 34
              defaultConfig {
                  applicationId "com.example.radioapp"
                  minSdk 23
                  targetSdk 26
                  versionCode 28
                  versionName "3.7"
              }
              signingConfigs {
                  debug {
                      storeFile file("${rootDir}/debug.keystore")
                      storePassword 'android'
                      keyAlias 'androiddebugkey'
                      keyPassword 'android'
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
              lint {
                  abortOnError false
                  checkReleaseBuilds false
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <application
                  android:label="Радіо"
                  android:icon="@drawable/ic_launcher"
                  android:allowBackup="false"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF


          cat > app/src/main/java/com/example/radioapp/MainActivity.java <<'EOF'
          package com.example.radioapp;

          import android.app.Activity;
          import android.app.AlertDialog;
          import android.content.ClipData;
          import android.content.ClipboardManager;
          import android.content.SharedPreferences;
          import android.app.Dialog;
          import android.content.Context;
          import android.graphics.Bitmap;
          import android.graphics.Color;
          import android.view.ViewGroup;
          import android.graphics.Canvas;
          import android.graphics.Paint;
          import android.graphics.Path;
          import android.graphics.RectF;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.view.Gravity;
          import android.view.MotionEvent;
          import android.view.View;
          import android.view.WindowManager;
          import android.widget.EditText;
          import android.widget.FrameLayout;
          import android.widget.ImageView;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import android.widget.Toast;

          public class MainActivity extends Activity {
              static final String[] THN = {"Синя ніч", "Графіт", "Смарагд", "Бурштин", "Пурпур", "Червона яскрава", "Океан", "Ліс", "Світла", "Чорна", "Червона тьмяна", "Чорна + червоний", "Свій колір (повзунки)"};
              // bg1, bg2, акцент, плитка, кнопка, текст, дим. текст
              static final int[][] TH = {
                      {0xFF12335C, 0xFF0A1424, 0xFF4FC3F7, 0xB3101A28, 0xFF2A3A52, 0xFFF1F5F9, 0xFFA9B8CC},
                      {0xFF2B2F36, 0xFF111316, 0xFFB0BEC5, 0xB3181A1E, 0xFF343942, 0xFFF1F5F9, 0xFFA9B0B8},
                      {0xFF0F3D33, 0xFF071A16, 0xFF4DD6A8, 0xB30D211C, 0xFF1F4A3F, 0xFFF1F5F9, 0xFF9CBFB4},
                      {0xFF4A3010, 0xFF1A1006, 0xFFFFB74D, 0xB3231708, 0xFF4F3A1B, 0xFFF8F1E7, 0xFFC4B29A},
                      {0xFF3A1F5C, 0xFF150B26, 0xFFCE93D8, 0xB31F1030, 0xFF40295E, 0xFFF4EEF8, 0xFFB7A6C9},
                      {0xFF3A0508, 0xFF120203, 0xFFFF1E1E, 0xB3200709, 0xFF5A0F12, 0xFFFFECEC, 0xFFFF9A9A},
                      {0xFF0B4F6C, 0xFF05202B, 0xFF4DD0E1, 0xB30A2A38, 0xFF16627F, 0xFFEFF9FC, 0xFF9CC4D0},
                      {0xFF2E4A1E, 0xFF111C0B, 0xFFAED581, 0xB3172410, 0xFF3A5A2A, 0xFFF3F8EE, 0xFFB0C4A0},
                      {0xFFDCE6F2, 0xFFB8C7DB, 0xFF1565C0, 0xCCFFFFFF, 0xFFC9D6E6, 0xFF1B2733, 0xFF4F6075},
                      {0xFF000000, 0xFF000000, 0xFFFFFFFF, 0xCC121212, 0xFF262626, 0xFFF1F1F1, 0xFF9A9A9A},
                      {0xFF2A0C0E, 0xFF0D0405, 0xFFB5322F, 0xB3170708, 0xFF3A1416, 0xFFE2BDBA, 0xFF9A6663},
                      {0xFF000000, 0xFF000000, 0xFFFF1A1A, 0xCC140404, 0xFF2A0A0A, 0xFFFFE0E0, 0xFFAA6B6B},
                      {0xFF000000, 0xFF000000, 0xFFF2200F, 0xCC140403, 0xFF3A0805, 0xFFF2200F, 0xFFC4180B}};
              int BG1, BG2, ACC, CARD, BTN, TXT, DIM;
              static final int FMIN = 8750, FMAX = 10800;

              final Handler ui = new Handler(Looper.getMainLooper());
              Store store;
              Tuner tuner;
              SharedPreferences uisp;
              boolean land;
              int cur = 0;
              int shownLogoFreq = -1;
              boolean dragging;
              volatile boolean scanning, scanStop;
              boolean seekWait, seenSeek;
              long seekT;

              View[] tabs = new View[3];
              Glyph[] tabBtns = new Glyph[4];
              TextView tvFreq, tvName, tvSub, tvScan;
              ImageView ivLogo;
              FreqSlider seek;
              Glyph btnScan;
              TextView tvStar;
              LinearLayout backBar;
              int curTab;
              boolean wasPaused;
              LinearLayout favList, allList;

              int dp(int v) {
                  return (int) (v * getResources().getDisplayMetrics().density + 0.5f);
              }

              GradientDrawable rect(int color, int radiusDp) {
                  GradientDrawable g = new GradientDrawable();
                  g.setColor(color);
                  g.setCornerRadius(dp(radiusDp));
                  return g;
              }

              static final String[] BSN = {"Звичайний", "Градієнт вертикальний", "Градієнт до акценту", "Градієнт горизонтальний", "Світіння", "Скло", "Лише контур"};

              int mixC(int a, int b, float t) {
                  int r = Math.round(((a >> 16) & 255) * (1 - t) + ((b >> 16) & 255) * t);
                  int g = Math.round(((a >> 8) & 255) * (1 - t) + ((b >> 8) & 255) * t);
                  int bl = Math.round((a & 255) * (1 - t) + (b & 255) * t);
                  return (r << 16) | (g << 8) | bl;
              }

              int withA(int rgb, int al) {
                  return (al << 24) | (rgb & 0xFFFFFF);
              }

              GradientDrawable styled(int base, int radiusDp, float radialPx) {
                  int st = uisp.getInt("bstyle", 0);
                  int ca = base >>> 24, cr = base & 0xFFFFFF;
                  GradientDrawable g = new GradientDrawable();
                  g.setCornerRadius(dp(radiusDp));
                  switch (st) {
                      case 1:
                          g.setOrientation(GradientDrawable.Orientation.TOP_BOTTOM);
                          g.setColors(new int[]{withA(mixC(cr, 0xFFFFFF, 0.14f), ca), withA(mixC(cr, 0x000000, 0.30f), ca)});
                          break;
                      case 2:
                          g.setOrientation(GradientDrawable.Orientation.TL_BR);
                          g.setColors(new int[]{withA(mixC(cr, ACC, 0.45f), ca), withA(mixC(cr, 0x000000, 0.2f), ca)});
                          break;
                      case 3:
                          g.setOrientation(GradientDrawable.Orientation.LEFT_RIGHT);
                          g.setColors(new int[]{withA(mixC(cr, ACC, 0.38f), ca), withA(cr, ca)});
                          break;
                      case 4:
                          g.setGradientType(GradientDrawable.RADIAL_GRADIENT);
                          g.setGradientRadius(radialPx);
                          g.setColors(new int[]{withA(mixC(cr, ACC, 0.5f), ca), withA(cr, ca)});
                          break;
                      case 5:
                          g.setColor(withA(TXT, Math.round(ca * 0.3f)));
                          break;
                      case 6:
                          g.setColor(withA(cr, Math.round(ca * 0.2f)));
                          g.setStroke(dp(2), withA(ACC, 0xDD));
                          break;
                      default:
                          g.setColor(base);
                  }
                  return g;
              }

              android.graphics.drawable.Drawable card(int radiusDp) {
                  GradientDrawable core;
                  if (uisp.getInt("met1", -1) >= 0) {
                      int mc = hsvc(new float[]{uisp.getFloat("bH", 4), uisp.getFloat("bS", 0.9f), uisp.getFloat("bV", 0.25f)});
                      core = metalBg(radiusDp, mc & 0xFFFFFF, CARD >>> 24);
                  } else {
                      core = styled(CARD, radiusDp, dp(300));
                      if (uisp.getInt("bstyle", 0) != 6) core.setStroke(dp(1), (ACC & 0xFFFFFF) | 0x44000000);
                  }
                  return outlineWrap(glowWrap(core, radiusDp, ACC, uisp.getInt("bglow", 0)), radiusDp);
              }

              TextView tv(String s, int sp, int color, boolean bold) {
                  TextView t = new TextView(this);
                  t.setText(s);
                  t.setTextSize(sp);
                  t.setTextColor(color);
                  if (bold) t.setTypeface(Typeface.DEFAULT_BOLD);
                  if (glowR > 0) t.setShadowLayer(glowR, 0, 0, color);
                  return t;
              }

              float glowR = 0;

              // ---------- власні кнопки з намальованими значками ----------
              class Glyph extends View {
                  int kind;
                  String label;
                  float sp;
                  boolean sel;
                  final Paint p = new Paint(Paint.ANTI_ALIAS_FLAG);

                  Glyph(int kind, String label, float sp) {
                      super(MainActivity.this);
                      this.kind = kind;
                      this.label = label;
                      this.sp = sp;
                      setClickable(true);
                      if (glowR > 0) setLayerType(View.LAYER_TYPE_SOFTWARE, null);
                  }

                  void set(int kind, String label, boolean sel) {
                      this.kind = kind;
                      this.label = label;
                      this.sel = sel;
                      invalidate();
                  }

                  @Override
                  protected void drawableStateChanged() {
                      super.drawableStateChanged();
                      invalidate();
                  }

                  @Override
                  protected void onDraw(Canvas cv) {
                      float w = getWidth(), h = getHeight(), st = dp(1) * 1.5f;
                      RectF r = new RectF(st, st, w - st, h - st);
                      p.setStyle(Paint.Style.FILL);
                      int base = (BTN & 0xFFFFFF) | 0x99000000;
                      android.graphics.drawable.Drawable sg = blockBg(base, 16, Math.max(w, h) * 0.8f);
                      sg.setBounds(Math.round(r.left), Math.round(r.top), Math.round(r.right), Math.round(r.bottom));
                      sg.draw(cv);
                      if (isPressed() || sel) {
                          p.setColor(isPressed() ? (ACC & 0xFFFFFF) | 0x66000000 : (ACC & 0xFFFFFF) | 0x44000000);
                          cv.drawRoundRect(r, dp(16), dp(16), p);
                      }
                      p.setStyle(Paint.Style.STROKE);
                      p.setStrokeWidth(st);
                      p.setColor((ACC & 0xFFFFFF) | (sel ? 0xDD000000 : 0x77000000));
                      cv.drawRoundRect(r, dp(16), dp(16), p);
                      p.setStyle(Paint.Style.FILL);
                      if (glowR > 0) p.setShadowLayer(glowR, 0, 0, TXT);
                      else p.clearShadowLayer();
                      float ts = sp * getResources().getDisplayMetrics().scaledDensity;
                      p.setTextSize(ts);
                      p.setTypeface(Typeface.DEFAULT_BOLD);
                      p.setColor(TXT);
                      float tw = p.measureText(label);
                      float is = kind >= 0 ? ts * 1.25f : 0, gap = kind >= 0 ? ts * 0.5f : 0;
                      float x0 = (w - (is + gap + tw)) / 2f;
                      if (kind >= 0) drawIcon(cv, kind, x0 + is / 2f, h / 2f, is);
                      p.setStyle(Paint.Style.FILL);
                      p.setColor(TXT);
                      p.setTextAlign(Paint.Align.LEFT);
                      cv.drawText(label, x0 + is + gap, h / 2f + ts * 0.35f, p);
                  }

                  void drawIcon(Canvas cv, int k, float cx, float cy, float s) {
                      p.setColor(ACC);
                      p.setStyle(Paint.Style.FILL);
                      float q = s / 2f;
                      Path a = new Path();
                      switch (k) {
                          case 0: // ⏮
                              cv.drawRect(cx - q, cy - q * 0.8f, cx - q * 0.65f, cy + q * 0.8f, p);
                              a.moveTo(cx + q, cy - q * 0.85f);
                              a.lineTo(cx - q * 0.5f, cy);
                              a.lineTo(cx + q, cy + q * 0.85f);
                              a.close();
                              cv.drawPath(a, p);
                              break;
                          case 1: // ⏭
                              cv.drawRect(cx + q * 0.65f, cy - q * 0.8f, cx + q, cy + q * 0.8f, p);
                              a.moveTo(cx - q, cy - q * 0.85f);
                              a.lineTo(cx + q * 0.5f, cy);
                              a.lineTo(cx - q, cy + q * 0.85f);
                              a.close();
                              cv.drawPath(a, p);
                              break;
                          case 2: // ◀
                              a.moveTo(cx + q * 0.7f, cy - q * 0.85f);
                              a.lineTo(cx - q * 0.8f, cy);
                              a.lineTo(cx + q * 0.7f, cy + q * 0.85f);
                              a.close();
                              cv.drawPath(a, p);
                              break;
                          case 3: // ▶
                              a.moveTo(cx - q * 0.7f, cy - q * 0.85f);
                              a.lineTo(cx + q * 0.8f, cy);
                              a.lineTo(cx - q * 0.7f, cy + q * 0.85f);
                              a.close();
                              cv.drawPath(a, p);
                              break;
                          case 4: // зірка (порожня) / 5 - заповнена
                          case 5:
                              for (int i = 0; i < 10; i++) {
                                  double ang = -Math.PI / 2 + i * Math.PI / 5;
                                  float rr = i % 2 == 0 ? q : q * 0.45f;
                                  float xx = cx + (float) Math.cos(ang) * rr, yy = cy + (float) Math.sin(ang) * rr;
                                  if (i == 0) a.moveTo(xx, yy);
                                  else a.lineTo(xx, yy);
                              }
                              a.close();
                              if (k == 4) {
                                  p.setStyle(Paint.Style.STROKE);
                                  p.setStrokeWidth(s * 0.1f);
                                  p.setStrokeJoin(Paint.Join.ROUND);
                              }
                              cv.drawPath(a, p);
                              break;
                          case 6: // пошук
                              p.setStyle(Paint.Style.STROKE);
                              p.setStrokeWidth(s * 0.13f);
                              p.setStrokeCap(Paint.Cap.ROUND);
                              cv.drawCircle(cx - q * 0.15f, cy - q * 0.15f, q * 0.6f, p);
                              cv.drawLine(cx + q * 0.3f, cy + q * 0.3f, cx + q * 0.9f, cy + q * 0.9f, p);
                              break;
                          case 8: // пауза
                              cv.drawRoundRect(new RectF(cx - q * 0.7f, cy - q * 0.8f, cx - q * 0.15f, cy + q * 0.8f), q * 0.1f, q * 0.1f, p);
                              cv.drawRoundRect(new RectF(cx + q * 0.15f, cy - q * 0.8f, cx + q * 0.7f, cy + q * 0.8f), q * 0.1f, q * 0.1f, p);
                              break;
                          case 7: // стоп
                              cv.drawRoundRect(new RectF(cx - q * 0.7f, cy - q * 0.7f, cx + q * 0.7f, cy + q * 0.7f), q * 0.15f, q * 0.15f, p);
                              break;
                      }
                  }
              }

              // ---------- повзунок частоти ----------
              class FreqSlider extends View {
                  int f = FMIN;
                  int liveV = -1;
                  long liveT = 0;
                  final Paint p = new Paint(Paint.ANTI_ALIAS_FLAG);

                  FreqSlider() {
                      super(MainActivity.this);
                  }

                  void setF(int v) {
                      f = Math.max(FMIN, Math.min(FMAX, v));
                      invalidate();
                  }

                  float padX() {
                      return dp(34);
                  }

                  @Override
                  protected void onDraw(Canvas cv) {
                      float w = getWidth(), h = getHeight(), x0 = padX(), x1 = w - padX(), cy = h / 2f;
                      float fr = (f - FMIN) / (float) (FMAX - FMIN), tx = x0 + (x1 - x0) * fr;
                      float th = dp(12);
                      p.setStyle(Paint.Style.FILL);
                      p.setColor((BTN & 0xFFFFFF) | 0x99000000);
                      cv.drawRoundRect(new RectF(x0, cy - th / 2, x1, cy + th / 2), th / 2, th / 2, p);
                      p.setColor((ACC & 0xFFFFFF) | 0xCC000000);
                      cv.drawRoundRect(new RectF(x0, cy - th / 2, Math.max(x0 + th, tx), cy + th / 2), th / 2, th / 2, p);
                      p.setColor((TXT & 0xFFFFFF) | 0x55000000);
                      p.setStrokeWidth(dp(1));
                      for (int m = 88; m <= 108; m++) {
                          float x = x0 + (x1 - x0) * ((m * 100 - FMIN) / (float) (FMAX - FMIN));
                          cv.drawLine(x, cy + th / 2 + dp(5), x, cy + th / 2 + dp(m % 5 == 0 ? 14 : 9), p);
                      }
                      float r = dp(21);
                      p.setColor(0x55000000);
                      cv.drawCircle(tx, cy + dp(2), r + dp(2), p);
                      p.setColor(BG1 | 0xFF000000);
                      cv.drawCircle(tx, cy, r, p);
                      p.setStyle(Paint.Style.STROKE);
                      p.setStrokeWidth(dp(3));
                      p.setColor(ACC);
                      cv.drawCircle(tx, cy, r - dp(1), p);
                      p.setStyle(Paint.Style.FILL);
                      cv.drawCircle(tx, cy, dp(6), p);
                  }

                  @Override
                  public boolean onTouchEvent(MotionEvent e) {
                      float x0 = padX(), x1 = getWidth() - padX();
                      int a = e.getActionMasked();
                      if (a == MotionEvent.ACTION_DOWN) {
                          dragging = true;
                          getParent().requestDisallowInterceptTouchEvent(true);
                      }
                      if (a == MotionEvent.ACTION_DOWN || a == MotionEvent.ACTION_MOVE || a == MotionEvent.ACTION_UP) {
                          float fr = Math.max(0, Math.min(1, (e.getX() - x0) / (x1 - x0)));
                          int v = FMIN + Math.round(fr * (FMAX - FMIN) / 10f) * 10;
                          setF(v);
                          tvFreq.setText(Station.fmt(v));
                          long nw = System.currentTimeMillis();
                          if (a == MotionEvent.ACTION_MOVE && v != liveV && nw - liveT >= 120) {
                              liveV = v;
                              liveT = nw;
                              tuner.tune(MainActivity.this, v, MainActivity.class);
                          }
                          if (a == MotionEvent.ACTION_UP) {
                              dragging = false;
                              tuneTo(v);
                          }
                      }
                      if (a == MotionEvent.ACTION_CANCEL) {
                          dragging = false;
                          updateUi();
                      }
                      return true;
                  }
              }

              /** Відтінок < 0 дає чорний, > 360 дає білий. */
              int hsvc(float[] c) {
                  if (c[0] < 0) return 0xFF000000;
                  if (c[0] > 360) return 0xFFFFFFFF;
                  return android.graphics.Color.HSVToColor(c);
              }

              int dimc(int col, float k) {
                  return 0xFF000000 | (Math.round(((col >> 16) & 255) * k) << 16) | (Math.round(((col >> 8) & 255) * k) << 8) | Math.round((col & 255) * k);
              }

              java.io.File syncFile() {
                  return new java.io.File(android.os.Environment.getExternalStorageDirectory(), "fordtheme.cfg");
              }

              static final String[] SYNC_F = {"cH", "cS", "cV", "bH", "bS", "bV"};
              static final float[] SYNC_FD = {4, 0.95f, 0.95f, 4, 0.9f, 0.25f};

              /** Читає спільний файл теми, якщо він новіший за збережену тему. */
              boolean syncIn() {
                  if (!uisp.getBoolean("sync", true)) return false;
                  try {
                      java.io.File f = syncFile();
                      if (!f.exists()) return false;
                      java.util.Properties p = new java.util.Properties();
                      java.io.FileInputStream in = new java.io.FileInputStream(f);
                      p.load(in);
                      in.close();
                      long ts = Long.parseLong(p.getProperty("ts", "0"));
                      if (ts <= uisp.getLong("ts", 0)) return false;
                      SharedPreferences.Editor e = uisp.edit();
                      for (int i = 0; i < SYNC_F.length; i++) e.putFloat(SYNC_F[i], Float.parseFloat(p.getProperty(SYNC_F[i], "" + SYNC_FD[i])));
                      e.putInt("bstyle", Integer.parseInt(p.getProperty("bstyle", "0")));
                      e.putInt("glow", Integer.parseInt(p.getProperty("glow", "0")));
                      e.putInt("bglow", Integer.parseInt(p.getProperty("bglow", "0")));
                      e.putBoolean("outl_b", p.getProperty("outl_b", "0").equals("1"));
                      e.putInt("outW_b", Integer.parseInt(p.getProperty("outW_b", "3")));
                      e.putInt("outC_b", Integer.parseInt(p.getProperty("outC_b", "-1")));
                      e.putBoolean("bDark", p.getProperty("bDark", "1").equals("1"));
                      e.putBoolean("tDark", p.getProperty("tDark", "1").equals("1"));
                      e.putLong("ts", ts).apply();
                      return true;
                  } catch (Throwable x) {
                      return false;
                  }
              }

              void syncOut() {
                  if (!uisp.getBoolean("sync", true)) return;
                  try {
                      long ts = System.currentTimeMillis();
                      java.util.Properties p = new java.util.Properties();
                      for (int i = 0; i < SYNC_F.length; i++) p.setProperty(SYNC_F[i], "" + uisp.getFloat(SYNC_F[i], SYNC_FD[i]));
                      p.setProperty("bstyle", "" + uisp.getInt("bstyle", 0));
                      p.setProperty("glow", "" + uisp.getInt("glow", 0));
                      p.setProperty("bglow", "" + uisp.getInt("bglow", 0));
                      p.setProperty("outl_b", uisp.getBoolean("outl_b", false) ? "1" : "0");
                      p.setProperty("outW_b", "" + uisp.getInt("outW_b", 3));
                      p.setProperty("outC_b", "" + uisp.getInt("outC_b", -1));
                      p.setProperty("bDark", uisp.getBoolean("bDark", true) ? "1" : "0");
                      p.setProperty("tDark", uisp.getBoolean("tDark", true) ? "1" : "0");
                      p.setProperty("ts", "" + ts);
                      java.io.FileOutputStream o = new java.io.FileOutputStream(syncFile());
                      p.store(o, "FordTheme");
                      o.close();
                      uisp.edit().putLong("ts", ts).apply();
                  } catch (Throwable x) {
                      toastMsg("Не вдалось записати спільну тему: " + x);
                  }
              }

