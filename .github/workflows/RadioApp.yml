              void applyTheme() {
                  int ti = Math.min(TH.length - 1, Math.max(0, uisp.getInt("theme", 0)));
                  int[] t = TH[ti];
                  if (true) {
                      float[] tx = {uisp.getFloat("cH", 4), uisp.getFloat("cS", 0.95f), uisp.getFloat("cV", 0.95f)};
                      float[] bl = {uisp.getFloat("bH", 4), uisp.getFloat("bS", 0.9f), uisp.getFloat("bV", 0.25f)};
                      boolean bd = uisp.getBoolean("bDark", true), td = uisp.getBoolean("tDark", true);
                      int tc = hsvc(tx), bc = hsvc(bl);
                      t = new int[]{
                              bd ? dimc(bc, 0.35f) : bc, bd ? 0xFF000000 : bc,
                              tc, 0xCC000000 | ((bd ? dimc(bc, 0.6f) : bc) & 0xFFFFFF),
                              bc, tc, td ? dimc(tc, 0.75f) : tc};
                  }
                  glowR = uisp.getInt("glow", 0) / 100f * dp(14);
                  BG1 = t[0];
                  BG2 = t[1];
                  ACC = t[2];
                  CARD = (0x80 << 24) | (t[3] & 0xFFFFFF);
                  BTN = t[4];
                  TXT = t[5];
                  DIM = t[6];
              }

