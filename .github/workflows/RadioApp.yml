              void imageBrowser(final java.io.File cur, final EditText target) {
                  java.io.File[] fs = cur.listFiles();
                  final java.util.List<java.io.File> items = new java.util.ArrayList<java.io.File>();
                  final java.util.List<String> names = new java.util.ArrayList<String>();
                  if (cur.getParentFile() != null) {
                      items.add(cur.getParentFile());
                      names.add("⬆  ..");
                  }
                  if (fs != null) {
                      java.util.Arrays.sort(fs);
                      for (java.io.File x : fs) {
                          if (x.isDirectory() && !x.getName().startsWith(".")) {
                              items.add(x);
                              names.add("📁  " + x.getName());
                          }
                      }
                      for (java.io.File x : fs) {
                          String n = x.getName().toLowerCase();
                          if (x.isFile() && (n.endsWith(".png") || n.endsWith(".jpg") || n.endsWith(".jpeg") || n.endsWith(".webp") || n.endsWith(".bmp") || n.endsWith(".gif"))) {
                              items.add(x);
                              names.add("🖼  " + x.getName());
                          }
                      }
                  }
                  new AlertDialog.Builder(this).setTitle(cur.getAbsolutePath())
                          .setItems(names.toArray(new String[0]), (d, i) -> {
                              java.io.File x = items.get(i);
                              if (x.isDirectory()) imageBrowser(x, target);
                              else target.setText(x.getAbsolutePath());
                          }).setNegativeButton("Закрити", null).show();
              }

