              private void toast(String t) {
                  try {
                      android.widget.Toast.makeText(host, t, android.widget.Toast.LENGTH_LONG).show();
                  } catch (Throwable ignored) {
                  }
              }

              volatile boolean directPending;

              boolean busy() {
                  return stepping || directPending;
              }

              void cancelTune() {
                  stepping = false;
                  directPending = false;
                  h.removeCallbacks(stepper);
                  h.removeCallbacks(directCheck);
              }

              private void notifyState() {
                  if (listener != null) listener.onState();
              }

              void next() { cancelTune(); ensure(new Runnable() { public void run() { write(0x401, 1, 0); } }); }
              void prev() { cancelTune(); ensure(new Runnable() { public void run() { write(0x401, 1, 1); } }); }
              void stepUp() { cancelTune(); ensure(new Runnable() { public void run() { write(0x401, 2, 0); } }); }
              void stepDown() { cancelTune(); ensure(new Runnable() { public void run() { write(0x401, 2, 1); } }); }

              private int probeIdx, probeTries, directStart;

              private void sendVariant(int v, int f) {
                  switch (v) {
                      case 0: write(0x402, 255, f); break;
                      case 1: write(0x402, 0, f); break;
                      case 2: write2(0x402, f); break;
                      case 3: write(0x401, 3, f); break;
                      default:
                          if (host != null) launchStock(host, f, front);
                  }
              }

              private int lastChk;
              private long lastProgress, sendT;
              private boolean slewing;

              private void sendProbe() {
                  directStart = freq;
                  lastChk = freq;
                  sendT = System.currentTimeMillis();
                  lastProgress = sendT;
                  slewing = false;
                  log("налаштування на " + tgt + ", варіант " + probeIdx);
                  sendVariant(probeIdx, tgt);
                  h.postDelayed(directCheck, 900);
              }

              private final Runnable directCheck = new Runnable() {
                  @Override
                  public void run() {
                      if (!directPending) return;
                      if (Math.abs(tgt - freq) <= 1) {
                          directPending = false;
                          log("досягнуто " + freq);
                          notifyState();
                          return;
                      }
                      if (++probeTries < 3) {
                          write(0x402, 255, tgt);
                          h.postDelayed(directCheck, 700);
                          return;
                      }
                      directPending = false;
                      log("пряма команда не спрацювала");
                      notifyState();
                      toast("Помилка: тюнер не прийняв команду зміни частоти (0x402 255 " + tgt + ").");
                  }
              };

              void pause() {
                  cancelTune();
                  paused = true;
                  if (tmode == 0) write(0x301, 192, 0);
                  write2(0x9e00, 129);
                  write(0x9e11, 192, 129);
                  haveState = false;
                  inited = false;
                  log("ПАУЗА");
                  notifyState();
              }

              void resume() {
                  paused = false;
                  inited = false;
                  initRadio();
                  log("ГРАТИ");
              }

              private void startStepping() {
                  if (stepping) return;
                  stepping = true;
                  lastFreq = freq;
                  lastSentFrom = -1;
                  nearSends = 0;
                  lastMoveAt = System.currentTimeMillis();
                  h.post(stepper);
              }

              /** Налаштування на частоту (одиниці 10 кГц) кроками ±0.05 МГц — без відкриття штатного радіо. */
              void tune(final Context c, final int f10k, final Class<?> fr) {
                  host = c;
                  front = fr;
                  ensure(new Runnable() {
                      @Override
                      public void run() {
                          if (f10k <= 0) return;
                          cancelTune();
                          paused = false;
                          tgt = f10k;
                          directPending = true;
                          probeTries = 0;
                          write(0x402, 255, tgt);
                          h.postDelayed(directCheck, 700);
                      }
                  });
              }

              private final Runnable stepper = new Runnable() {
                  @Override
                  public void run() {
                      long now = System.currentTimeMillis();
                      int diff = tgt - freq;
                      int ad = Math.abs(diff);
                      if (ad <= 2 || (ad <= 5 && nearSends >= 2)) {
                          stepping = false;
                          notifyState();
                          return;
                      }
                      if (freq != lastFreq) {
                          lastFreq = freq;
                          lastMoveAt = now;
                          stuck = 0;
                      }
                      if (now - lastMoveAt > 2500) {
                          if (stuck++ < 1) {
                              initRadio();
                              lastMoveAt = now;
                          } else {
                              stepping = false;
                              stuck = 0;
                              notifyState();
                              toast("Тюнер не реагує на кроки.");
                              return;
                          }
                      }
                      boolean far = ad > 15;
                      if (far || freq != lastSentFrom || now - lastSendAt > 400) {
                          quiet = true;
                          write(0x401, 2, diff > 0 ? 0 : 1);
                          quiet = false;
                          lastSentFrom = freq;
                          lastSendAt = now;
                          if (ad <= 5) nearSends++;
                      }
                      h.postDelayed(this, far ? 30 : 60);
                  }
              };

              void launchStock(Context c, int f10k, Class<?> front) {
                  try {
                      Intent in = new Intent();
                      in.setClassName("com.tw.radio", "com.tw.radio.RadioActivity");
                      in.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      if (f10k > 0) in.putExtra("frequency", f10k / 10f);
                      c.startActivity(in);
                  } catch (Throwable t) {
                      error = String.valueOf(t);
                  }
                  final Context cc = c;
                  final Class<?> fr = front;
                  h.postDelayed(new Runnable() {
                      @Override
                      public void run() {
                          try {
                              Intent b = new Intent(cc, fr);
                              b.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_REORDER_TO_FRONT);
                              cc.startActivity(b);
                          } catch (Throwable ignored) {
                          }
                      }
                  }, 700);
              }
          }
          EOF

          cat > app/src/main/java/com/example/radioapp/Logos.java <<'EOF'
          package com.example.radioapp;

          import android.content.Context;
          import android.graphics.Bitmap;
          import android.graphics.BitmapFactory;
          import android.graphics.Canvas;
          import android.graphics.Paint;
          import android.graphics.Typeface;
          import android.os.Handler;
          import android.os.Looper;
          import android.widget.ImageView;

          import org.json.JSONArray;
          import org.json.JSONObject;

          import java.io.ByteArrayOutputStream;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.net.URLEncoder;
          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;

          /** Логотипи станцій: кеш на диску, пошук в radio-browser.info, запасний варіант — кольорова літера. */
          final class Logos {
              private Logos() {
              }

              private static final ExecutorService EX = Executors.newSingleThreadExecutor();
              private static final Handler UI = new Handler(Looper.getMainLooper());
              private static final String[] HOSTS = {
                  "https://de1.api.radio-browser.info", "https://at1.api.radio-browser.info", "https://nl1.api.radio-browser.info"
              };

              static Bitmap letter(String name, int size) {
                  Bitmap b = Bitmap.createBitmap(size, size, Bitmap.Config.ARGB_8888);
                  Canvas c = new Canvas(b);
                  Paint p = new Paint(Paint.ANTI_ALIAS_FLAG);
                  int h = Math.abs((name == null ? "" : name).hashCode());
                  int[] cols = {0xFF1565C0, 0xFF00838F, 0xFF2E7D32, 0xFFAD1457, 0xFF6A1B9A, 0xFFEF6C00, 0xFF37474F, 0xFFC62828};
                  p.setColor(cols[h % cols.length]);
                  c.drawCircle(size / 2f, size / 2f, size / 2f, p);
                  p.setColor(0xFFFFFFFF);
                  p.setTextAlign(Paint.Align.CENTER);
                  p.setTypeface(Typeface.DEFAULT_BOLD);
                  p.setTextSize(size * 0.5f);
                  String t = (name == null || name.trim().isEmpty()) ? "FM" : name.trim().substring(0, 1).toUpperCase();
                  c.drawText(t, size / 2f, size / 2f + size * 0.18f, p);
                  return b;
              }

              static volatile boolean netFail;

              static void clearCache(Context ctx) {
                  File[] fs = new File(ctx.getCacheDir(), "logos").listFiles();
                  if (fs != null) for (File f : fs) f.delete();
              }

              static void load(final Context ctx, final String key, final String display, final String query, final String url, final ImageView iv) {
                  iv.setTag(key);
                  iv.setImageBitmap(letter(display, 128));
                  if (key.startsWith("m")) new File(android.os.Environment.getExternalStorageDirectory(), "fordradio_logo.png").delete();
                  final String q = (query == null || query.trim().isEmpty()) ? display : query;
                  if ((url == null || url.isEmpty()) && (q == null || q.trim().isEmpty())) return;
                  EX.execute(new Runnable() {
                      @Override
                      public void run() {
                          try {
                              File dir = new File(ctx.getCacheDir(), "logos");
                              dir.mkdirs();
                              String id = Integer.toHexString((q + "|" + url).hashCode());
                              File f = new File(dir, id + ".png");
                              File none = new File(dir, id + ".none");
                              Bitmap bm = null;
                              if (url != null && url.startsWith("/")) {
                                  bm = BitmapFactory.decodeFile(url);
                              } else if (f.exists()) {
                                  bm = BitmapFactory.decodeFile(f.getAbsolutePath());
                              } else if (!(none.exists() && System.currentTimeMillis() - none.lastModified() < 6 * 3600 * 1000L)) {
                                  netFail = false;
                                  String u = url;
                                  if (u == null || u.isEmpty()) u = lookup(q);
                                  if (u != null && !u.isEmpty()) {
                                      byte[] data = download(u);
                                      if (data != null) bm = BitmapFactory.decodeByteArray(data, 0, data.length);
                                  }
                                  if (bm != null) {
                                      int w = bm.getWidth(), h = bm.getHeight();
                                      float k = 192f / Math.max(w, h);
                                      if (k < 1f) bm = Bitmap.createScaledBitmap(bm, Math.max(1, (int) (w * k)), Math.max(1, (int) (h * k)), true);
                                      FileOutputStream fo = new FileOutputStream(f);
                                      bm.compress(Bitmap.CompressFormat.PNG, 100, fo);
                                      fo.close();
                                  } else if (!netFail) {
                                      new FileOutputStream(none).close();
                                      none.setLastModified(System.currentTimeMillis());
                                  }
                              }
                              if (bm == null) return;
                              final Bitmap fb = bm;
                              if (key.startsWith("m") && key.equals(iv.getTag())) {
                                  try {
                                      FileOutputStream so = new FileOutputStream(new File(android.os.Environment.getExternalStorageDirectory(), "fordradio_logo.png"));
                                      fb.compress(Bitmap.CompressFormat.PNG, 100, so);
                                      so.close();
                                  } catch (Throwable ignored) {
                                  }
                              }
                              UI.post(new Runnable() {
                                  @Override
                                  public void run() {
                                      if (key.equals(iv.getTag())) iv.setImageBitmap(fb);
                                  }
                              });
                          } catch (Throwable ignored) {
                          }
                      }
                  });
              }

              private static String lookup(String name) {
                  java.util.List<String> vs = new java.util.ArrayList<String>();
                  vs.add(name.trim());
                  String s2 = name.replaceAll("(?i)\\b(fm|radio|ФМ|радіо|радио)\\b", " ").replaceAll("\\s+", " ").trim();
                  if (!s2.isEmpty() && !vs.contains(s2)) vs.add(s2);
                  String w1 = name.trim().split("\\s+")[0];
                  if (w1.length() > 2 && !vs.contains(w1)) vs.add(w1);
                  for (String v : vs) {
                      for (int pass = 0; pass < 2; pass++) {
                          for (String host : HOSTS) {
                              try {
                                  String u = host + "/json/stations/search?hidebroken=true&order=votes&reverse=true&limit=10"
                                          + (pass == 0 ? "&countrycode=UA" : "") + "&name=" + URLEncoder.encode(v, "UTF-8");
                                  byte[] d = download(u);
                                  if (d == null) {
                                      if (netFail) return null;
                                      continue;
                                  }
                                  JSONArray a = new JSONArray(new String(d, "UTF-8"));
                                  for (int i = 0; i < a.length(); i++) {
                                      String fav = a.getJSONObject(i).optString("favicon", "");
                                      if (!fav.isEmpty() && !fav.toLowerCase().endsWith(".svg")) return fav;
                                  }
                                  break;
                              } catch (Throwable ignored) {
                              }
                          }
                      }
                  }
                  return null;
              }

              private static byte[] download(String u) {
                  HttpURLConnection c = null;
                  try {
                      for (int hop = 0; hop < 4; hop++) {
                          c = (HttpURLConnection) new URL(u).openConnection();
                          c.setInstanceFollowRedirects(false);
                          c.setConnectTimeout(5000);
                          c.setReadTimeout(8000);
                          c.setRequestProperty("User-Agent", "Mozilla/5.0 (Linux; Android 8.1) RadioApp/3.0");
                          int rc = c.getResponseCode();
                          if (rc == 301 || rc == 302 || rc == 303 || rc == 307 || rc == 308) {
                              String loc = c.getHeaderField("Location");
                              c.disconnect();
                              if (loc == null) return null;
                              u = new URL(new URL(u), loc).toString();
                              continue;
                          }
                          break;
                      }
                      netFail = false;
                      if (c.getResponseCode() != 200) return null;
                      InputStream in = c.getInputStream();
                      ByteArrayOutputStream bo = new ByteArrayOutputStream();
                      byte[] buf = new byte[8192];
                      int n;
                      while ((n = in.read(buf)) > 0) {
                          bo.write(buf, 0, n);
                          if (bo.size() > 600000) return null;
                      }
                      return bo.toByteArray();
                  } catch (Throwable t) {
                      netFail = true;
                      return null;
                  } finally {
                      if (c != null) c.disconnect();
                  }
              }
          }
