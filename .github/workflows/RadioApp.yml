          package com.example.radioapp;

          import android.content.Context;
          import android.content.Intent;
          import android.os.Handler;
          import android.os.Looper;
          import android.os.Message;

          import java.lang.reflect.Method;

          /** Зв'язок із тюнером магнітоли (TWUtil через reflection) і керування штатним радіо. */
          final class Tuner {
              interface Listener {
                  void onState();
              }

              static final int[] IDS = {0x401, 0x402, 0x404, 0x405, 0x406, 0x9e00, 0x9e11};

              private Object util;
              private Class<?> cls;
              private Method wr, wr2;
              private boolean inited;
              boolean directFailed, directOk;
              private final Listener listener;
              private final Handler h;

              volatile int freq, flags, b1;
              volatile String ps = "";
              volatile boolean seeking, haveState;
              volatile long lastMsg;
              String error = "";

              Tuner(Listener l) {
                  listener = l;
                  h = new Handler(Looper.getMainLooper(), new Handler.Callback() {
                      @Override
                      public boolean handleMessage(Message m) {
                          onMsg(m);
                          return true;
                      }
                  });
              }

              boolean start() {
                  try {
                      cls = Class.forName("android.tw.john.TWUtil");
                      util = cls.getConstructor().newInstance();
                      short[] ids = new short[IDS.length];
                      for (int i = 0; i < ids.length; i++) ids[i] = (short) IDS[i];
                      Object r = cls.getMethod("open", short[].class).invoke(util, (Object) ids);
                      cls.getMethod("start").invoke(util);
                      cls.getMethod("addHandler", String.class, Handler.class).invoke(util, "twradio", h);
                      wr = cls.getMethod("write", int.class, int.class, int.class);
                      try { wr2 = cls.getMethod("write", int.class, int.class); } catch (Throwable ignored) { wr2 = null; }
                      error = "";
                      return r != null;
                  } catch (Throwable t) {
                      error = String.valueOf(t.getCause() != null ? t.getCause() : t);
                      return false;
                  }
              }

              void stop() {
                  try {
                      if (util != null) {
                          try { cls.getMethod("removeHandler", String.class).invoke(util, "twradio"); } catch (Throwable ignored) { }
                          try { cls.getMethod("stop").invoke(util); } catch (Throwable ignored) { }
                          try { cls.getMethod("close").invoke(util); } catch (Throwable ignored) { }
                      }
                  } catch (Throwable ignored) {
                  }
                  util = null;
              }

              private void onMsg(Message m) {
                  if (m.what != 0x401 || !(m.obj instanceof byte[])) return;
                  byte[] b = (byte[]) m.obj;
                  if (b.length < 13) return;
                  int f = ((b[2] & 0xff) << 8) | (b[3] & 0xff);
                  flags = b[0] & 0xff;
                  b1 = b[1] & 0xff;
                  seeking = (flags & 0x40) != 0;
                  StringBuilder sb = new StringBuilder();
                  boolean ok = true;
                  for (int i = 5; i < 13; i++) {
                      int c = b[i] & 0xff;
                      if (c == 0) continue;
                      if (c < 32 || c > 126) {
                          ok = false;
                          break;
                      }
                      sb.append((char) c);
                  }
                  ps = ok ? sb.toString().trim() : "";
                  freq = f;
                  haveState = true;
                  lastMsg = System.currentTimeMillis();
                  if (listener != null) listener.onState();
              }

              int write(int what, int a1, int a2) {
                  try {
                      if (wr == null) return -1;
                      Object r = wr.invoke(util, what, a1, a2);
                      return r instanceof Integer ? (Integer) r : 0;
                  } catch (Throwable t) {
                      return -2;
                  }
              }

              int write2(int what, int a1) {
                  try {
                      if (wr2 == null) return -1;
                      Object r = wr2.invoke(util, what, a1);
                      return r instanceof Integer ? (Integer) r : 0;
                  } catch (Throwable t) {
                      return -2;
                  }
              }

              /** Те, що штатне радіо робить у onResume: вмикає режим радіо й просить поточний стан. */
              void initRadio() {
                  write2(0x9e00, 1);
                  write(0x9e11, 192, 1);
                  write2(0x406, 0);
                  write2(0x401, 255);
                  write2(0x404, 255);
                  inited = true;
              }

              private Context host;
              private Class<?> front;
              private boolean waking;
              volatile boolean stepping;
              private volatile int tgt;
              private int lastFreq, lastSentFrom, nearSends, stuck;
              private long lastMoveAt, lastSendAt;

              void setHost(Context c, Class<?> f) {
                  host = c;
                  front = f;
              }

              /** Виконує дію, коли тюнер відповідає; якщо ні — тихо запускає штатне радіо (один раз), щоб воно «розбудило» тюнер. */
              void ensure(final Runnable then) {
                  if (haveState) {
                      then.run();
                      return;
                  }
                  initRadio();
                  h.postDelayed(new Runnable() {
                      @Override
                      public void run() {
                          if (!haveState) initRadio();
                          h.postDelayed(new Runnable() {
                              @Override
                              public void run() {
                                  if (!haveState && !waking && host != null) {
                                      waking = true;
                                      toast("Тюнер не відповідає. Відкрий штатне радіо один раз і повернись.");
                                  }
                                  then.run();
                              }
                          }, 1200);
                      }
                  }, 1000);
              }

              private void toast(String t) {
                  try {
                      android.widget.Toast.makeText(host, t, android.widget.Toast.LENGTH_LONG).show();
                  } catch (Throwable ignored) {
                  }
              }

              volatile boolean directPending;
              private int directTries;

              boolean busy() {
                  return stepping || directPending;
              }

              void cancelTune() {
                  stepping = false;
                  directPending = false;
                  h.removeCallbacks(stepper);
                  h.removeCallbacks(directCheck);
              }

              private void notifyState() {
                  if (listener != null) listener.onState();
              }

              void next() { cancelTune(); ensure(new Runnable() { public void run() { write(0x401, 1, 0); } }); }
              void prev() { cancelTune(); ensure(new Runnable() { public void run() { write(0x401, 1, 1); } }); }
              void stepUp() { cancelTune(); ensure(new Runnable() { public void run() { write(0x401, 2, 0); } }); }
              void stepDown() { cancelTune(); ensure(new Runnable() { public void run() { write(0x401, 2, 1); } }); }

              private void sendDirect() {
                  write(0x402, 255, tgt);
                  h.postDelayed(directCheck, 900);
              }

              private final Runnable directCheck = new Runnable() {
                  @Override
                  public void run() {
                      if (!directPending) return;
                      if (Math.abs(tgt - freq) <= 2) {
                          directOk = true;
                          directPending = false;
                          notifyState();
                          return;
                      }
                      if (++directTries < 2) {
                          sendDirect();
                          return;
                      }
                      directPending = false;
                      if (!directOk) directFailed = true;
                      startStepping();
                  }
              };

              private void startStepping() {
                  if (stepping) return;
                  stepping = true;
                  lastFreq = freq;
                  lastSentFrom = -1;
                  nearSends = 0;
                  lastMoveAt = System.currentTimeMillis();
                  h.post(stepper);
              }

              /** Налаштування на частоту (одиниці 10 кГц) кроками ±0.05 МГц — без відкриття штатного радіо. */
              void tune(final Context c, final int f10k, final Class<?> fr) {
                  host = c;
                  front = fr;
                  ensure(new Runnable() {
                      @Override
                      public void run() {
                          if (f10k <= 0) return;
                          cancelTune();
                          tgt = f10k;
                          if (!directFailed) {
                              directPending = true;
                              directTries = 0;
                              sendDirect();
                          } else {
                              startStepping();
                          }
                      }
                  });
              }

              private final Runnable stepper = new Runnable() {
                  @Override
                  public void run() {
                      long now = System.currentTimeMillis();
                      int diff = tgt - freq;
                      int ad = Math.abs(diff);
                      if (ad <= 2 || (ad <= 5 && nearSends >= 2)) {
                          stepping = false;
                          notifyState();
                          return;
                      }
                      if (freq != lastFreq) {
                          lastFreq = freq;
                          lastMoveAt = now;
                          stuck = 0;
                      }
                      if (now - lastMoveAt > 2500) {
                          if (stuck++ < 1) {
                              initRadio();
                              lastMoveAt = now;
                          } else {
                              stepping = false;
                              stuck = 0;
                              notifyState();
                              toast("Тюнер не реагує на кроки.");
                              return;
                          }
                      }
                      boolean far = ad > 15;
                      if (far || freq != lastSentFrom || now - lastSendAt > 400) {
                          write(0x401, 2, diff > 0 ? 0 : 1);
                          lastSentFrom = freq;
                          lastSendAt = now;
                          if (ad <= 5) nearSends++;
                      }
                      h.postDelayed(this, far ? 30 : 60);
                  }
              };

              void launchStock(Context c, int f10k, Class<?> front) {
                  try {
                      Intent in = new Intent();
                      in.setClassName("com.tw.radio", "com.tw.radio.RadioActivity");
                      in.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      if (f10k > 0) in.putExtra("frequency", f10k / 10f);
                      c.startActivity(in);
                  } catch (Throwable t) {
                      error = String.valueOf(t);
                  }
                  final Context cc = c;
                  final Class<?> fr = front;
                  h.postDelayed(new Runnable() {
                      @Override
                      public void run() {
                          try {
                              Intent b = new Intent(cc, fr);
                              b.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_REORDER_TO_FRONT);
                              cc.startActivity(b);
                          } catch (Throwable ignored) {
                          }
                      }
                  }, 700);
              }
          }
