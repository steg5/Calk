name: RadioApp

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/RadioApp.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Write project
        run: |
          mkdir -p app/src/main/java/com/example/radioapp
          echo '' | base64 -d > debug.keystore

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'RadioApp'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=false
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.example.radioapp'
              compileSdk 34
              defaultConfig {
                  applicationId "com.example.radioapp"
                  minSdk 23
                  targetSdk 26
                  versionCode 6
                  versionName "1.5"
              }
              signingConfigs {
                  debug {
                      storeFile file("${rootDir}/debug.keystore")
                      storePassword 'android'
                      keyAlias 'androiddebugkey'
                      keyPassword 'android'
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
              lint {
                  abortOnError false
                  checkReleaseBuilds false
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <application
                  android:label="Радіо"
                  android:icon="@drawable/ic_launcher"
                  android:allowBackup="false"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF


          cat > app/src/main/java/com/example/radioapp/MainActivity.java <<'EOF'
          package com.example.radioapp;

          import android.app.Activity;
          import android.app.AlertDialog;
          import android.content.SharedPreferences;
          import android.graphics.Canvas;
          import android.graphics.Paint;
          import android.graphics.Path;
          import android.graphics.RectF;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.view.Gravity;
          import android.view.MotionEvent;
          import android.view.View;
          import android.view.WindowManager;
          import android.widget.EditText;
          import android.widget.FrameLayout;
          import android.widget.ImageView;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import android.widget.Toast;

          public class MainActivity extends Activity {
              static final String[] THN = {"Синя ніч", "Графіт", "Смарагд", "Бурштин", "Пурпур", "Червона яскрава", "Океан", "Ліс", "Світла", "Чорна", "Червона тьмяна", "Чорна + червоний"};
              // bg1, bg2, акцент, плитка, кнопка, текст, дим. текст
              static final int[][] TH = {
                      {0xFF12335C, 0xFF0A1424, 0xFF4FC3F7, 0xB3101A28, 0xFF2A3A52, 0xFFF1F5F9, 0xFFA9B8CC},
                      {0xFF2B2F36, 0xFF111316, 0xFFB0BEC5, 0xB3181A1E, 0xFF343942, 0xFFF1F5F9, 0xFFA9B0B8},
                      {0xFF0F3D33, 0xFF071A16, 0xFF4DD6A8, 0xB30D211C, 0xFF1F4A3F, 0xFFF1F5F9, 0xFF9CBFB4},
                      {0xFF4A3010, 0xFF1A1006, 0xFFFFB74D, 0xB3231708, 0xFF4F3A1B, 0xFFF8F1E7, 0xFFC4B29A},
                      {0xFF3A1F5C, 0xFF150B26, 0xFFCE93D8, 0xB31F1030, 0xFF40295E, 0xFFF4EEF8, 0xFFB7A6C9},
                      {0xFF3A0508, 0xFF120203, 0xFFFF1E1E, 0xB3200709, 0xFF5A0F12, 0xFFFFECEC, 0xFFFF9A9A},
                      {0xFF0B4F6C, 0xFF05202B, 0xFF4DD0E1, 0xB30A2A38, 0xFF16627F, 0xFFEFF9FC, 0xFF9CC4D0},
                      {0xFF2E4A1E, 0xFF111C0B, 0xFFAED581, 0xB3172410, 0xFF3A5A2A, 0xFFF3F8EE, 0xFFB0C4A0},
                      {0xFFDCE6F2, 0xFFB8C7DB, 0xFF1565C0, 0xCCFFFFFF, 0xFFC9D6E6, 0xFF1B2733, 0xFF4F6075},
                      {0xFF000000, 0xFF000000, 0xFFFFFFFF, 0xCC121212, 0xFF262626, 0xFFF1F1F1, 0xFF9A9A9A},
                      {0xFF2A0C0E, 0xFF0D0405, 0xFFB5322F, 0xB3170708, 0xFF3A1416, 0xFFE2BDBA, 0xFF9A6663},
                      {0xFF000000, 0xFF000000, 0xFFFF1A1A, 0xCC140404, 0xFF2A0A0A, 0xFFFFE0E0, 0xFFAA6B6B}};
              int BG1, BG2, ACC, CARD, BTN, TXT, DIM;
              static final int FMIN = 8750, FMAX = 10800;

              final Handler ui = new Handler(Looper.getMainLooper());
              Store store;
              Tuner tuner;
              SharedPreferences uisp;
              boolean land;
              int cur = 0;
              int shownLogoFreq = -1;
              boolean dragging;
              volatile boolean scanning, scanStop;
              boolean seekWait, seenSeek;
              long seekT;

              View[] tabs = new View[3];
              Glyph[] tabBtns = new Glyph[4];
              TextView tvFreq, tvName, tvSub, tvScan;
              ImageView ivLogo;
              FreqSlider seek;
              Glyph btnFav, btnScan;
              LinearLayout favList, allList;

              int dp(int v) {
                  return (int) (v * getResources().getDisplayMetrics().density + 0.5f);
              }

              GradientDrawable rect(int color, int radiusDp) {
                  GradientDrawable g = new GradientDrawable();
                  g.setColor(color);
                  g.setCornerRadius(dp(radiusDp));
                  return g;
              }

              GradientDrawable card(int radiusDp) {
                  GradientDrawable g = rect(CARD, radiusDp);
                  g.setStroke(dp(1), (ACC & 0xFFFFFF) | 0x44000000);
                  return g;
              }

              TextView tv(String s, int sp, int color, boolean bold) {
                  TextView t = new TextView(this);
                  t.setText(s);
                  t.setTextSize(sp);
                  t.setTextColor(color);
                  if (bold) t.setTypeface(Typeface.DEFAULT_BOLD);
                  return t;
              }

              // ---------- власні кнопки з намальованими значками ----------
              class Glyph extends View {
                  int kind;
                  String label;
                  float sp;
                  boolean sel;
                  final Paint p = new Paint(Paint.ANTI_ALIAS_FLAG);

                  Glyph(int kind, String label, float sp) {
                      super(MainActivity.this);
                      this.kind = kind;
                      this.label = label;
                      this.sp = sp;
                      setClickable(true);
                  }

                  void set(int kind, String label, boolean sel) {
                      this.kind = kind;
                      this.label = label;
                      this.sel = sel;
                      invalidate();
                  }

                  @Override
                  protected void drawableStateChanged() {
                      super.drawableStateChanged();
                      invalidate();
                  }

                  @Override
                  protected void onDraw(Canvas cv) {
                      float w = getWidth(), h = getHeight(), st = dp(1) * 1.5f;
                      RectF r = new RectF(st, st, w - st, h - st);
                      p.setStyle(Paint.Style.FILL);
                      int base = (BTN & 0xFFFFFF) | 0x99000000;
                      p.setColor(isPressed() ? (ACC & 0xFFFFFF) | 0x66000000 : sel ? (ACC & 0xFFFFFF) | 0x44000000 : base);
                      cv.drawRoundRect(r, dp(16), dp(16), p);
                      p.setStyle(Paint.Style.STROKE);
                      p.setStrokeWidth(st);
                      p.setColor((ACC & 0xFFFFFF) | (sel ? 0xDD000000 : 0x77000000));
                      cv.drawRoundRect(r, dp(16), dp(16), p);
                      p.setStyle(Paint.Style.FILL);
                      float ts = sp * getResources().getDisplayMetrics().scaledDensity;
                      p.setTextSize(ts);
                      p.setTypeface(Typeface.DEFAULT_BOLD);
                      p.setColor(TXT);
                      float tw = p.measureText(label);
                      float is = kind >= 0 ? ts * 1.25f : 0, gap = kind >= 0 ? ts * 0.5f : 0;
                      float x0 = (w - (is + gap + tw)) / 2f;
                      if (kind >= 0) drawIcon(cv, kind, x0 + is / 2f, h / 2f, is);
                      p.setStyle(Paint.Style.FILL);
                      p.setColor(TXT);
                      p.setTextAlign(Paint.Align.LEFT);
                      cv.drawText(label, x0 + is + gap, h / 2f + ts * 0.35f, p);
                  }

                  void drawIcon(Canvas cv, int k, float cx, float cy, float s) {
                      p.setColor(ACC);
                      p.setStyle(Paint.Style.FILL);
                      float q = s / 2f;
                      Path a = new Path();
                      switch (k) {
                          case 0: // ⏮
                              cv.drawRect(cx - q, cy - q * 0.8f, cx - q * 0.65f, cy + q * 0.8f, p);
                              a.moveTo(cx + q, cy - q * 0.85f);
                              a.lineTo(cx - q * 0.5f, cy);
                              a.lineTo(cx + q, cy + q * 0.85f);
                              a.close();
                              cv.drawPath(a, p);
                              break;
                          case 1: // ⏭
                              cv.drawRect(cx + q * 0.65f, cy - q * 0.8f, cx + q, cy + q * 0.8f, p);
                              a.moveTo(cx - q, cy - q * 0.85f);
                              a.lineTo(cx + q * 0.5f, cy);
                              a.lineTo(cx - q, cy + q * 0.85f);
                              a.close();
                              cv.drawPath(a, p);
                              break;
                          case 2: // ◀
                              a.moveTo(cx + q * 0.7f, cy - q * 0.85f);
                              a.lineTo(cx - q * 0.8f, cy);
                              a.lineTo(cx + q * 0.7f, cy + q * 0.85f);
                              a.close();
                              cv.drawPath(a, p);
                              break;
                          case 3: // ▶
                              a.moveTo(cx - q * 0.7f, cy - q * 0.85f);
                              a.lineTo(cx + q * 0.8f, cy);
                              a.lineTo(cx - q * 0.7f, cy + q * 0.85f);
                              a.close();
                              cv.drawPath(a, p);
                              break;
                          case 4: // зірка (порожня) / 5 - заповнена
                          case 5:
                              for (int i = 0; i < 10; i++) {
                                  double ang = -Math.PI / 2 + i * Math.PI / 5;
                                  float rr = i % 2 == 0 ? q : q * 0.45f;
                                  float xx = cx + (float) Math.cos(ang) * rr, yy = cy + (float) Math.sin(ang) * rr;
                                  if (i == 0) a.moveTo(xx, yy);
                                  else a.lineTo(xx, yy);
                              }
                              a.close();
                              if (k == 4) {
                                  p.setStyle(Paint.Style.STROKE);
                                  p.setStrokeWidth(s * 0.1f);
                                  p.setStrokeJoin(Paint.Join.ROUND);
                              }
                              cv.drawPath(a, p);
                              break;
                          case 6: // пошук
                              p.setStyle(Paint.Style.STROKE);
                              p.setStrokeWidth(s * 0.13f);
                              p.setStrokeCap(Paint.Cap.ROUND);
                              cv.drawCircle(cx - q * 0.15f, cy - q * 0.15f, q * 0.6f, p);
                              cv.drawLine(cx + q * 0.3f, cy + q * 0.3f, cx + q * 0.9f, cy + q * 0.9f, p);
                              break;
                          case 7: // стоп
                              cv.drawRoundRect(new RectF(cx - q * 0.7f, cy - q * 0.7f, cx + q * 0.7f, cy + q * 0.7f), q * 0.15f, q * 0.15f, p);
                              break;
                      }
                  }
              }

              // ---------- повзунок частоти ----------
              class FreqSlider extends View {
                  int f = FMIN;
                  final Paint p = new Paint(Paint.ANTI_ALIAS_FLAG);

                  FreqSlider() {
                      super(MainActivity.this);
                  }

                  void setF(int v) {
                      f = Math.max(FMIN, Math.min(FMAX, v));
                      invalidate();
                  }

                  float padX() {
                      return dp(34);
                  }

                  @Override
                  protected void onDraw(Canvas cv) {
                      float w = getWidth(), h = getHeight(), x0 = padX(), x1 = w - padX(), cy = h / 2f;
                      float fr = (f - FMIN) / (float) (FMAX - FMIN), tx = x0 + (x1 - x0) * fr;
                      float th = dp(12);
                      p.setStyle(Paint.Style.FILL);
                      p.setColor((BTN & 0xFFFFFF) | 0x99000000);
                      cv.drawRoundRect(new RectF(x0, cy - th / 2, x1, cy + th / 2), th / 2, th / 2, p);
                      p.setColor((ACC & 0xFFFFFF) | 0xCC000000);
                      cv.drawRoundRect(new RectF(x0, cy - th / 2, Math.max(x0 + th, tx), cy + th / 2), th / 2, th / 2, p);
                      p.setColor((TXT & 0xFFFFFF) | 0x55000000);
                      p.setStrokeWidth(dp(1));
                      for (int m = 88; m <= 108; m++) {
                          float x = x0 + (x1 - x0) * ((m * 100 - FMIN) / (float) (FMAX - FMIN));
                          cv.drawLine(x, cy + th / 2 + dp(5), x, cy + th / 2 + dp(m % 5 == 0 ? 14 : 9), p);
                      }
                      float r = dp(21);
                      p.setColor(0x55000000);
                      cv.drawCircle(tx, cy + dp(2), r + dp(2), p);
                      p.setColor(BG1 | 0xFF000000);
                      cv.drawCircle(tx, cy, r, p);
                      p.setStyle(Paint.Style.STROKE);
                      p.setStrokeWidth(dp(3));
                      p.setColor(ACC);
                      cv.drawCircle(tx, cy, r - dp(1), p);
                      p.setStyle(Paint.Style.FILL);
                      cv.drawCircle(tx, cy, dp(6), p);
                  }

                  @Override
                  public boolean onTouchEvent(MotionEvent e) {
                      float x0 = padX(), x1 = getWidth() - padX();
                      int a = e.getActionMasked();
                      if (a == MotionEvent.ACTION_DOWN) {
                          dragging = true;
                          getParent().requestDisallowInterceptTouchEvent(true);
                      }
                      if (a == MotionEvent.ACTION_DOWN || a == MotionEvent.ACTION_MOVE || a == MotionEvent.ACTION_UP) {
                          float fr = Math.max(0, Math.min(1, (e.getX() - x0) / (x1 - x0)));
                          int v = FMIN + Math.round(fr * (FMAX - FMIN) / 10f) * 10;
                          setF(v);
                          tvFreq.setText(Station.fmt(v));
                          if (a == MotionEvent.ACTION_UP) {
                              dragging = false;
                              tuneTo(v);
                          }
                      }
                      if (a == MotionEvent.ACTION_CANCEL) {
                          dragging = false;
                          updateUi();
                      }
                      return true;
                  }
              }

              void applyTheme() {
                  int[] t = TH[Math.min(TH.length - 1, Math.max(0, uisp.getInt("theme", 0)))];
                  BG1 = t[0];
                  BG2 = t[1];
                  ACC = t[2];
                  CARD = (0x80 << 24) | (t[3] & 0xFFFFFF);
                  BTN = t[4];
                  TXT = t[5];
                  DIM = t[6];
              }

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  CrashGuard.install(this);
                  String crash = CrashGuard.take(this);
                  if (crash != null) {
                      CrashGuard.show(this, crash);
                      return;
                  }
                  uisp = getSharedPreferences("ui", MODE_PRIVATE);
                  applyTheme();
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                  store = new Store(this);
                  tuner = new Tuner(this::onState);
                  land = getResources().getDisplayMetrics().widthPixels > getResources().getDisplayMetrics().heightPixels * 1.2;

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setBackground(new GradientDrawable(GradientDrawable.Orientation.TL_BR, new int[]{BG1, BG2}));
                  root.setPadding(dp(10), dp(8), dp(10), dp(8));

                  LinearLayout bar = new LinearLayout(this);
                  String[] names = {"Радіо", "Обрані", "Станції", "Тема"};
                  for (int i = 0; i < 4; i++) {
                      final int idx = i;
                      Glyph t = new Glyph(-1, names[i], 19);
                      t.setOnClickListener(v -> {
                          if (idx == 3) themeDialog();
                          else showTab(idx);
                      });
                      LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(0, dp(58), i == 3 ? 0.6f : 1);
                      lp.setMargins(dp(4), 0, dp(4), dp(8));
                      bar.addView(t, lp);
                      tabBtns[i] = t;
                  }
                  root.addView(bar);

                  FrameLayout content = new FrameLayout(this);
                  root.addView(content, new LinearLayout.LayoutParams(-1, 0, 1));
                  tabs[0] = buildMain();
                  tabs[1] = buildFavTab();
                  tabs[2] = buildAllTab();
                  for (View v : tabs) content.addView(v, new FrameLayout.LayoutParams(-1, -1));
                  setContentView(root);
                  showTab(0);

                  tuner.setHost(this, MainActivity.class);
                  boolean ok = tuner.start();
                  if (!ok) tvSub.setText("Немає зв'язку з тюнером: " + tuner.error);
                  cur = store.last() >= FMIN && store.last() <= FMAX ? store.last() : 0;
                  updateUi();
                  if (b == null) {
                      // при запуску: вмикаємо тюнер на останній станції
                      tuner.tune(this, cur, MainActivity.class);
                  }
              }

              void themeDialog() {
                  new AlertDialog.Builder(this).setTitle("Колірна тема")
                          .setSingleChoiceItems(THN, uisp.getInt("theme", 0), (d, i) -> {
                              uisp.edit().putInt("theme", i).apply();
                              d.dismiss();
                              recreate();
                          }).setNegativeButton("Скасувати", null).show();
              }

              @Override
              protected void onDestroy() {
                  if (tuner != null) tuner.stop();
                  super.onDestroy();
              }

              // ================= Вкладка «Радіо» =================

              View buildMain() {
                  LinearLayout main = new LinearLayout(this);
                  main.setOrientation(land ? LinearLayout.HORIZONTAL : LinearLayout.VERTICAL);

                  LinearLayout left = new LinearLayout(this);
                  left.setOrientation(LinearLayout.VERTICAL);
                  left.setGravity(Gravity.CENTER);
                  left.setBackground(card(24));
                  left.setPadding(dp(12), dp(10), dp(12), dp(10));
                  ivLogo = new ImageView(this);
                  ivLogo.setScaleType(ImageView.ScaleType.FIT_CENTER);
                  left.addView(ivLogo, new LinearLayout.LayoutParams(dp(land ? 120 : 96), dp(land ? 120 : 96)));
                  tvName = tv("—", 26, TXT, true);
                  tvName.setGravity(Gravity.CENTER);
                  tvName.setSingleLine(true);
                  left.addView(tvName);
                  tvFreq = tv("--.-", land ? 84 : 72, ACC, true);
                  tvFreq.setGravity(Gravity.CENTER);
                  left.addView(tvFreq);
                  tvSub = tv("Чекаю дані тюнера…", 16, DIM, false);
                  tvSub.setGravity(Gravity.CENTER);
                  left.addView(tvSub);
                  LinearLayout.LayoutParams lpL = land ? new LinearLayout.LayoutParams(0, -1, 1) : new LinearLayout.LayoutParams(-1, 0, 1);
                  lpL.setMargins(dp(4), dp(4), dp(4), dp(4));
                  main.addView(left, lpL);

                  LinearLayout right = new LinearLayout(this);
                  right.setOrientation(LinearLayout.VERTICAL);
                  right.setPadding(dp(6), dp(4), dp(6), dp(4));

                  TextView lab = tv("87.5  —  108.0 МГц", 13, DIM, false);
                  lab.setGravity(Gravity.CENTER);
                  right.addView(lab);
                  seek = new FreqSlider();
                  right.addView(seek, new LinearLayout.LayoutParams(-1, dp(84)));

                  right.addView(row2(new Glyph(0, "Попередня станція", 19), new Glyph(1, "Наступна станція", 19),
                          this::doPrev, this::doNext));
                  right.addView(row2(new Glyph(2, "Крок назад", 19), new Glyph(3, "Крок вперед", 19),
                          () -> tuner.stepDown(), () -> tuner.stepUp()));
                  btnFav = new Glyph(4, "В обрані", 19);
                  btnScan = new Glyph(6, "Знайти станції", 19);
                  right.addView(row2(btnFav, btnScan, this::toggleFav, this::startScan));

                  LinearLayout.LayoutParams lpR = land ? new LinearLayout.LayoutParams(0, -1, 1.15f) : new LinearLayout.LayoutParams(-1, 0, 1.3f);
                  main.addView(right, lpR);
                  return main;
              }

              void doNext() {
                  beginSeek();
                  tuner.next();
              }

              void doPrev() {
                  beginSeek();
                  tuner.prev();
              }

              void beginSeek() {
                  seekWait = true;
                  seenSeek = false;
                  seekT = System.currentTimeMillis();
                  updateUi();
                  ui.postDelayed(this::onState, 2700);
                  ui.postDelayed(this::onState, 9200);
              }

              LinearLayout row2(View a, View b, final Runnable ra, final Runnable rb) {
                  LinearLayout r = new LinearLayout(this);
                  a.setOnClickListener(v -> ra.run());
                  b.setOnClickListener(v -> rb.run());
                  LinearLayout.LayoutParams p = new LinearLayout.LayoutParams(0, -1, 1);
                  p.setMargins(dp(4), dp(4), dp(4), dp(4));
                  r.addView(a, p);
                  r.addView(b, p);
                  r.setLayoutParams(new LinearLayout.LayoutParams(-1, 0, 1));
                  return r;
              }

              // ================= Стан тюнера =================

              void onState() {
                  int f = tuner.freq;
                  long now = System.currentTimeMillis();
                  if (seekWait) {
                      if (tuner.seeking) seenSeek = true;
                      if ((seenSeek && !tuner.seeking) || (!seenSeek && now - seekT > 2500) || now - seekT > 9000) seekWait = false;
                  }
                  boolean hold = seekWait || scanning || tuner.busy();
                  if (!hold && f >= FMIN && f <= FMAX) {
                      cur = f;
                      ui.removeCallbacks(saveRun);
                      ui.postDelayed(saveRun, 1500);
                  }
                  updateUi();
              }

              final Runnable saveRun = new Runnable() {
                  @Override
                  public void run() {
                      if (cur >= FMIN && cur <= FMAX) {
                          store.setLast(cur);
                          Station s = store.get(cur);
                          String ps = tuner.ps;
                          if (s != null && s.name.isEmpty() && !ps.isEmpty() && tuner.freq == cur) {
                              s.name = ps;
                              store.save();
                              refreshLists();
                          }
                      }
                  }
              };

              String nameFor(int f) {
                  Station s = store.get(f);
                  if (s != null && !s.name.isEmpty()) return s.name;
                  if (f == tuner.freq && !tuner.ps.isEmpty()) return tuner.ps;
                  int i = Lviv.match(f);
                  if (i >= 0) return (String) Lviv.LIST[i][1];
                  return "FM " + Station.fmt(f);
              }

              String aliasFor(int f) {
                  Station s = store.get(f);
                  if (s != null && !s.alias.isEmpty()) return s.alias;
                  int i = Lviv.match(f);
                  return i >= 0 ? (String) Lviv.LIST[i][2] : "";
              }

              void updateUi() {
                  if (cur <= 0) return;
                  if (!dragging) {
                      tvFreq.setText(Station.fmt(cur));
                      seek.setF(cur);
                  }
                  String name = nameFor(cur);
                  tvName.setText(name);
                  if (seekWait || scanning) tvSub.setText("Шукаю станцію…");
                  else if (tuner.busy()) tvSub.setText("Налаштування…");
                  else if (!tuner.ps.isEmpty() && cur == tuner.freq) tvSub.setText("RDS: " + tuner.ps);
                  else tvSub.setText("FM · МГц");
                  if (shownLogoFreq != cur) {
                      shownLogoFreq = cur;
                      Station s = store.get(cur);
                      Logos.load(this, "m" + cur, name, aliasFor(cur), s != null ? s.logo : "", ivLogo);
                  }
                  Station s = store.get(cur);
                  boolean fav = s != null && s.fav;
                  btnFav.set(fav ? 5 : 4, fav ? "В обраних" : "В обрані", false);
              }

              void tuneTo(int f) {
                  f = Math.max(FMIN, Math.min(FMAX, f));
                  seekWait = false;
                  cur = f;
                  updateUi();
                  tuner.tune(this, f, MainActivity.class);
              }

              void toggleFav() {
                  if (cur <= 0) return;
                  Station s = store.getOrCreate(cur);
                  s.fav = !s.fav;
                  if (s.fav && s.name.isEmpty()) s.name = nameFor(cur);
                  store.save();
                  updateUi();
                  refreshLists();
              }

              // ================= Вкладки списків =================

