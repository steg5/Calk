name: CarProbe

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Write project
        run: |
          mkdir -p app/src/main/java/com/example/carprobe app/src/main/res/drawable
          echo '' | base64 -d > debug.keystore

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'CarProbe'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=false
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.example.carprobe'
              compileSdk 34
              defaultConfig {
                  applicationId "com.example.carprobe"
                  minSdk 23
                  targetSdk 26
                  versionCode 4
                  versionName "1.3"
              }
              signingConfigs {
                  debug {
                      storeFile file("${rootDir}/debug.keystore")
                      storePassword 'android'
                      keyAlias 'androiddebugkey'
                      keyPassword 'android'
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
              lint {
                  abortOnError false
                  checkReleaseBuilds false
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="com.tw.carinfoservice.permission.USE_AIDL"/>
              <application
                  android:label="CarProbe"
                  android:icon="@drawable/ic_launcher"
                  android:allowBackup="false"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/example/carprobe/MainActivity.java <<'EOF'
          package com.example.carprobe;

          import android.app.Activity;
          import android.content.ClipData;
          import android.content.ClipboardManager;
          import android.content.ComponentName;
          import android.content.Context;
          import android.content.Intent;
          import android.content.ServiceConnection;
          import android.content.pm.ResolveInfo;
          import android.graphics.Typeface;
          import android.os.Binder;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.HandlerThread;
          import android.os.IBinder;
          import android.os.Looper;
          import android.os.Parcel;
          import android.os.SystemClock;
          import android.text.InputType;
          import android.view.View;
          import android.view.WindowManager;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import android.widget.Toast;

          import java.util.ArrayList;
          import java.util.List;
          import java.util.Locale;
          import java.util.Map;
          import java.util.TreeMap;

          public class MainActivity extends Activity {

              static final String CTRL = "com.tw.uart.IUartController";
              static final String RCV = "com.tw.uart.IUartReceiver";
              static final String ACT = "com.tw.uart.UartService.Bind";
              static final String PKG = "com.tw.uart";
              static final String CLS = "com.tw.uart.UartService";

              static class Grp {
                  int n;
                  int chg;
                  int len;
                  String last = "";
              }

              final Object lock = new Object();
              final Handler ui = new Handler(Looper.getMainLooper());
              HandlerThread ht;
              Handler bg;
              final Binder recv = new Recv();
              volatile IBinder svc;
              volatile boolean registered;
              boolean bound;
              final long t0 = SystemClock.elapsedRealtime();

              String statusText = "Запуск...";
              String diagText = "";
              int frames = 0;
              long bytes = 0;
              long lastFrameAt = 0;
              final TreeMap<String, Grp> groups = new TreeMap<>();
              final ArrayList<String> logLines = new ArrayList<>();

              TextView tvStatus, tvDiag, tvGroups, tvLog;
              EditText etPort, etBaud;

              final ServiceConnection conn = new ServiceConnection() {
                  @Override
                  public void onServiceConnected(ComponentName name, IBinder b) {
                      svc = b;
                      String d;
                      try { d = b.getInterfaceDescriptor(); } catch (Throwable e) { d = "err " + e; }
                      setStatus("Зв'язок є: " + name.flattenToShortString() + ", дескриптор: " + d);
                      registerRecv();
                  }

                  @Override
                  public void onServiceDisconnected(ComponentName name) {
                      svc = null;
                      registered = false;
                      setStatus("Сервіс відключився");
                  }
              };

              @Override
              protected void onCreate(Bundle s) {
                  super.onCreate(s);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                  ht = new HandlerThread("probe");
                  ht.start();
                  bg = new Handler(ht.getLooper());

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(20, 12, 20, 12);

                  LinearLayout bar = new LinearLayout(this);
                  bar.setOrientation(LinearLayout.HORIZONTAL);
                  bar.addView(btn("Копіювати все", new View.OnClickListener() {
                      public void onClick(View v) { copyAll(); }
                  }));
                  bar.addView(btn("Очистити", new View.OnClickListener() {
                      public void onClick(View v) { clearAll(); }
                  }));
                  bar.addView(btn("Перепідключити", new View.OnClickListener() {
                      public void onClick(View v) { reconnect(); }
                  }));
                  root.addView(bar);

                  LinearLayout exp = new LinearLayout(this);
                  exp.setOrientation(LinearLayout.HORIZONTAL);
                  TextView el = tv(12, true);
                  el.setText("Експеримент, код 3: ");
                  exp.addView(el);
                  etPort = new EditText(this);
                  etPort.setHint("порт (рядок)");
                  etPort.setSingleLine(true);
                  exp.addView(etPort, new LinearLayout.LayoutParams(0, -2, 1f));
                  etBaud = new EditText(this);
                  etBaud.setHint("число");
                  etBaud.setInputType(InputType.TYPE_CLASS_NUMBER);
                  etBaud.setSingleLine(true);
                  exp.addView(etBaud, new LinearLayout.LayoutParams(0, -2, 1f));
                  exp.addView(btn("Викликати", new View.OnClickListener() {
                      public void onClick(View v) { exp3(); }
                  }));
                  root.addView(exp);

                  tvStatus = tv(14, true);
                  root.addView(tvStatus);

                  ScrollView sv = new ScrollView(this);
                  LinearLayout col = new LinearLayout(this);
                  col.setOrientation(LinearLayout.VERTICAL);
                  col.addView(head("== ДІАГНОСТИКА =="));
                  tvDiag = tv(12, false);
                  col.addView(tvDiag);
                  col.addView(head("== КАДРИ UART: останній по групах (перші 2 байти) =="));
                  tvGroups = tv(13, false);
                  col.addView(tvGroups);
                  col.addView(head("== ЛОГ ЗМІН (нові зверху) =="));
                  tvLog = tv(12, false);
                  col.addView(tvLog);
                  sv.addView(col);
                  root.addView(sv, new LinearLayout.LayoutParams(-1, 0, 1f));
                  setContentView(root);

                  connect();
                  ui.postDelayed(ticker, 1000);
                  refresh();
              }

              Button btn(String t, View.OnClickListener l) {
                  Button b = new Button(this);
                  b.setText(t);
                  b.setOnClickListener(l);
                  return b;
              }

              TextView tv(float sp, boolean bold) {
                  TextView t = new TextView(this);
                  t.setTypeface(Typeface.MONOSPACE, bold ? Typeface.BOLD : Typeface.NORMAL);
                  t.setTextSize(sp);
                  return t;
              }

              TextView head(String s) {
                  TextView t = tv(13, true);
                  t.setText(s);
                  t.setPadding(0, 14, 0, 4);
                  return t;
              }

              void setStatus(String s) {
                  synchronized (lock) { statusText = s; }
                  refresh();
              }

              String diag() {
                  StringBuilder sb = new StringBuilder();
                  try {
                      getPackageManager().getPackageInfo(PKG, 0);
                      sb.append("пакет ").append(PKG).append(": є\n");
                  } catch (Throwable e) {
                      sb.append("пакета ").append(PKG).append(": немає\n");
                  }
                  try {
                      List<ResolveInfo> l = getPackageManager().queryIntentServices(new Intent(ACT), 0);
                      sb.append("сервіси на дію ").append(ACT).append(": ").append(l.size()).append("\n");
                      for (ResolveInfo ri : l) {
                          sb.append("  ").append(ri.serviceInfo.packageName).append("/").append(ri.serviceInfo.name).append("\n");
                      }
                  } catch (Throwable e) {
                      sb.append("queryIntentServices: ").append(e).append("\n");
                  }
                  return sb.toString();
              }

              void connect() {
                  diagText = diag();
                  Intent i = new Intent(ACT);
                  i.setClassName(PKG, CLS);
                  try {
                      bound = bindService(i, conn, Context.BIND_AUTO_CREATE);
                  } catch (Throwable e) {
                      bound = false;
                      diagText += "bindService(явний): " + e + "\n";
                  }
                  if (!bound) {
                      try {
                          List<ResolveInfo> l = getPackageManager().queryIntentServices(new Intent(ACT), 0);
                          for (ResolveInfo ri : l) {
                              Intent i2 = new Intent(ACT);
                              i2.setClassName(ri.serviceInfo.packageName, ri.serviceInfo.name);
                              if (bindService(i2, conn, Context.BIND_AUTO_CREATE)) {
                                  bound = true;
                                  break;
                              }
                          }
                      } catch (Throwable e) {
                          diagText += "bindService(пошук): " + e + "\n";
                      }
                  }
                  setStatus("bindService=" + bound);
              }

              void reconnect() {
                  bg.post(new Runnable() {
                      public void run() {
                          unregisterRecv();
                          ui.post(new Runnable() {
                              public void run() {
                                  if (bound) {
                                      try { unbindService(conn); } catch (Throwable e) { }
                                      bound = false;
                                  }
                                  svc = null;
                                  connect();
                              }
                          });
                      }
                  });
              }

              void registerRecv() {
                  bg.post(new Runnable() {
                      public void run() {
                          IBinder s = svc;
                          if (s == null) return;
                          Parcel d = Parcel.obtain();
                          Parcel r = Parcel.obtain();
                          try {
                              d.writeInterfaceToken(CTRL);
                              d.writeStrongBinder(recv);
                              s.transact(1, d, r, 0);
                              r.readException();
                              registered = true;
                              setStatus("Приймача зареєстровано (код 1). Слухаю UART...");
                          } catch (Throwable e) {
                              setStatus("Помилка реєстрації приймача: " + e);
                          } finally {
                              d.recycle();
                              r.recycle();
                          }
                      }
                  });
              }

              void unregisterRecv() {
                  IBinder s = svc;
                  if (s == null || !registered) return;
                  Parcel d = Parcel.obtain();
                  Parcel r = Parcel.obtain();
                  try {
                      d.writeInterfaceToken(CTRL);
                      d.writeStrongBinder(recv);
                      s.transact(2, d, r, 0);
                  } catch (Throwable e) {
                  } finally {
                      d.recycle();
                      r.recycle();
                      registered = false;
                  }
              }

              void exp3() {
                  final String port = etPort.getText().toString().trim();
                  int bd = 0;
                  try { bd = Integer.parseInt(etBaud.getText().toString().trim()); } catch (Throwable e) { }
                  final int baud = bd;
                  bg.post(new Runnable() {
                      public void run() {
                          IBinder s = svc;
                          if (s == null) {
                              setStatus("Код 3: сервіс не підключений");
                              return;
                          }
                          Parcel d = Parcel.obtain();
                          Parcel r = Parcel.obtain();
                          try {
                              d.writeInterfaceToken(CTRL);
                              d.writeInt(baud);
                              d.writeString(port);
                              s.transact(3, d, r, 0);
                              r.readException();
                              setStatus("Код 3 (" + baud + ", \"" + port + "\") виконано");
                          } catch (Throwable e) {
                              setStatus("Код 3: " + e);
                          } finally {
                              d.recycle();
                              r.recycle();
                          }
                      }
                  });
              }

              class Recv extends Binder {
                  @Override
                  protected boolean onTransact(int code, Parcel data, Parcel reply, int flags) {
                      if (code == INTERFACE_TRANSACTION) {
                          if (reply != null) reply.writeString(RCV);
                          return true;
                      }
                      try {
                          try { data.enforceInterface(RCV); } catch (Throwable e) { }
                          if (code == 1) {
                              byte[] b = data.createByteArray();
                              if (b != null) frame(b);
                          } else if (code == 2) {
                              String t = "bundle?";
                              try {
                                  int has = data.readInt();
                                  if (has != 0) {
                                      Bundle bu = Bundle.CREATOR.createFromParcel(data);
                                      bu.setClassLoader(getClassLoader());
                                      StringBuilder sb = new StringBuilder();
                                      for (String k : bu.keySet()) sb.append(k).append("=").append(bu.get(k)).append(" ");
                                      t = sb.toString();
                                  } else {
                                      t = "(порожній)";
                                  }
                              } catch (Throwable e) {
                                  t = "bundle err " + e;
                              }
                              note("BUNDLE", t, 0);
                          } else {
                              note("code" + code, "dataSize=" + data.dataSize(), 0);
                          }
                      } catch (Throwable e) {
                          note("ERR", e.toString(), 0);
                      }
                      if (reply != null && (flags & FLAG_ONEWAY) == 0) reply.writeNoException();
                      return true;
                  }
              }

              static String hex(byte[] b, int max) {
                  StringBuilder sb = new StringBuilder();
                  int n = Math.min(b.length, max);
                  for (int i = 0; i < n; i++) sb.append(String.format("%02X ", b[i] & 0xff));
                  if (b.length > max) sb.append("...");
                  return sb.toString().trim();
              }

              void frame(byte[] b) {
                  String key;
                  if (b.length == 0) key = "(пусто)";
                  else if (b.length == 1) key = String.format("%02X", b[0] & 0xff);
                  else key = String.format("%02X %02X", b[0] & 0xff, b[1] & 0xff);
                  synchronized (lock) {
                      frames++;
                      bytes += b.length;
                      lastFrameAt = SystemClock.elapsedRealtime();
                  }
                  note(key, hex(b, 64), b.length);
              }

              void note(String key, String val, int len) {
                  synchronized (lock) {
                      Grp g = groups.get(key);
                      if (g == null) {
                          g = new Grp();
                          groups.put(key, g);
                      }
                      g.n++;
                      g.len = len;
                      if (!g.last.equals(val)) {
                          g.last = val;
                          g.chg++;
                          double t = (SystemClock.elapsedRealtime() - t0) / 1000.0;
                          logLines.add(String.format(Locale.US, "[%6.1f] %s | %dб | %s", t, key, len, val));
                          if (logLines.size() > 500) logLines.remove(0);
                      }
                  }
                  refresh();
              }

              String buildGroups() {
                  StringBuilder sb = new StringBuilder();
                  synchronized (lock) {
                      for (Map.Entry<String, Grp> e : groups.entrySet()) {
                          Grp g = e.getValue();
                          sb.append(String.format(Locale.US, "%s  всього=%d змін=%d довж=%d\n   %s\n",
                                  e.getKey(), g.n, g.chg, g.len, g.last));
                      }
                  }
                  return sb.length() == 0 ? "(поки нічого не прийшло)" : sb.toString();
              }

              String buildLog() {
                  StringBuilder sb = new StringBuilder();
                  synchronized (lock) {
                      int from = Math.max(0, logLines.size() - 200);
                      for (int i = logLines.size() - 1; i >= from; i--) sb.append(logLines.get(i)).append('\n');
                  }
                  return sb.toString();
              }

              String buildStatus() {
                  synchronized (lock) {
                      String ago = lastFrameAt == 0 ? "ще не було"
                              : String.format(Locale.US, "%.1f с тому", (SystemClock.elapsedRealtime() - lastFrameAt) / 1000.0);
                      return statusText + "\nКадрів: " + frames + ", байт: " + bytes + ", останній: " + ago;
                  }
              }

              final Runnable doRefresh = new Runnable() {
                  public void run() {
                      if (tvStatus == null) return;
                      tvStatus.setText(buildStatus());
                      tvDiag.setText(diagText);
                      tvGroups.setText(buildGroups());
                      tvLog.setText(buildLog());
                  }
              };

              final Runnable ticker = new Runnable() {
                  public void run() {
                      doRefresh.run();
                      ui.postDelayed(this, 1000);
                  }
              };

              void refresh() {
                  ui.removeCallbacks(doRefresh);
                  ui.postDelayed(doRefresh, 200);
              }

              void clearAll() {
                  synchronized (lock) {
                      groups.clear();
                      logLines.clear();
                      frames = 0;
                      bytes = 0;
                      lastFrameAt = 0;
                  }
                  refresh();
              }

              void copyAll() {
                  String all = buildStatus() + "\n\n== ДІАГНОСТИКА ==\n" + diagText
                          + "\n== ГРУПИ ==\n" + buildGroups() + "\n== ЛОГ ==\n" + buildLog();
                  ClipboardManager cm = (ClipboardManager) getSystemService(Context.CLIPBOARD_SERVICE);
                  cm.setPrimaryClip(ClipData.newPlainText("carprobe", all));
                  Toast.makeText(this, "Скопійовано", Toast.LENGTH_SHORT).show();
              }

              @Override
              protected void onDestroy() {
                  super.onDestroy();
                  ui.removeCallbacks(ticker);
                  try { unregisterRecv(); } catch (Throwable e) { }
                  if (bound) {
                      try { unbindService(conn); } catch (Throwable e) { }
                  }
                  ht.quit();
              }
          }
          EOF

          echo '' | base64 -d > app/src/main/res/drawable/ic_launcher.png

      - name: Build
        run: gradle assembleDebug --no-daemon

      - name: Check APK
        run: |
          AAPT=$(ls $ANDROID_HOME/build-tools/*/aapt | tail -1)
          $AAPT dump badging app/build/outputs/apk/debug/app-debug.apk | grep -E "^package:" || true

      - uses: actions/upload-artifact@v4
        with:
          name: CarProbe-v4-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
