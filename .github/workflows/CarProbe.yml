name: CarProbe

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/CarProbe_v2.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Write project
        run: |
          mkdir -p app/src/main/java/com/example/carprobe app/src/main/res/drawable
          echo '' | base64 -d > debug.keystore

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'CarProbe'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=false
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.example.carprobe'
              compileSdk 34
              defaultConfig {
                  applicationId "com.example.carprobe"
                  minSdk 23
                  targetSdk 26
                  versionCode 2
                  versionName "1.1"
              }
              signingConfigs {
                  debug {
                      storeFile file("${rootDir}/debug.keystore")
                      storePassword 'android'
                      keyAlias 'androiddebugkey'
                      keyPassword 'android'
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
              lint {
                  abortOnError false
                  checkReleaseBuilds false
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="com.tw.carinfoservice.permission.USE_AIDL"/>
              <application
                  android:label="CarProbe"
                  android:icon="@drawable/ic_launcher"
                  android:allowBackup="false"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/example/carprobe/MainActivity.java <<'EOF'
          package com.example.carprobe;

          import android.app.Activity;
          import android.content.ClipData;
          import android.content.ClipboardManager;
          import android.content.ComponentName;
          import android.content.Context;
          import android.content.Intent;
          import android.content.ServiceConnection;
          import android.graphics.Typeface;
          import android.os.Binder;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.HandlerThread;
          import android.os.IBinder;
          import android.os.Looper;
          import android.os.Parcel;
          import android.os.SystemClock;
          import android.view.View;
          import android.view.WindowManager;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import android.widget.Toast;

          import java.util.ArrayList;
          import java.util.Arrays;
          import java.util.HashMap;
          import java.util.Locale;
          import java.util.Map;
          import java.util.TreeMap;

          public class MainActivity extends Activity {

              static final String PKG = "com.tw.carinfoservice";
              static final String SVC = "com.tw.carinfoservice.CarServiceAidl";
              static final String CBD = "com.tw.carinfoservice.CarServiceCallBack";
              static final String[] ACTIONS = {
                      "com.tw.carinfoservice.CarService.Bind",
                      "com.tw.car.CarService.Bind",
                      "com.tw.carapps.CarService.Bind"
              };

              // Геттери без побічних ефектів: код, назва, тип (F float, I int, IA int[], FA float[], R сирі слова)
              static final TreeMap<Integer, String[]> G = new TreeMap<>();
              static void g(int c, String n, String t) { G.put(c, new String[]{n, t}); }
              static {
                  g(4, "Напруга", "F");
                  g(5, "Фари", "I");
                  g(7, "get7", "IA");
                  g(8, "get8", "IA");
                  g(10, "Витрата", "R");
                  g(12, "get12", "I");
                  g(13, "get13", "I");
                  g(14, "Ручник", "R");
                  g(15, "get15", "I");
                  g(16, "get16", "I");
                  g(22, "get22", "FA");
                  g(23, "get23", "F");
                  g(29, "get29", "F");
                  g(32, "get32", "F");
                  g(33, "get33", "I");
                  g(35, "get35", "I");
                  g(40, "get40", "I");
                  g(41, "get41", "I");
                  g(42, "get42", "I");
                  g(43, "get43", "IA");
                  g(51, "get51", "IA");
                  g(55, "get55", "FA");
                  g(58, "Радар", "IA");
              }

              final Object lock = new Object();
              final Handler ui = new Handler(Looper.getMainLooper());
              HandlerThread ht;
              Handler bg;
              final Binder cb = new Cb();
              volatile IBinder svc;
              volatile boolean registered;
              boolean bound;
              int actIdx = 0;
              final long t0 = SystemClock.elapsedRealtime();

              String statusText = "Запуск...";
              String getText = "";
              final TreeMap<Integer, String> cbLast = new TreeMap<>();
              final HashMap<Integer, Integer> cbAll = new HashMap<>();
              final HashMap<Integer, Integer> cbChg = new HashMap<>();
              final ArrayList<String> logLines = new ArrayList<>();

              TextView tvStatus, tvGet, tvCb, tvLog;

              final ServiceConnection conn = new ServiceConnection() {
                  @Override
                  public void onServiceConnected(ComponentName name, IBinder b) {
                      svc = b;
                      String d = "?";
                      try { d = b.getInterfaceDescriptor(); } catch (Throwable e) { d = "err " + e; }
                      setStatus("Зв'язок є, дескриптор: " + d);
                      registerCb();
                  }

                  @Override
                  public void onServiceDisconnected(ComponentName name) {
                      svc = null;
                      registered = false;
                      setStatus("Сервіс відключився");
                  }
              };

              @Override
              protected void onCreate(Bundle s) {
                  super.onCreate(s);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                  ht = new HandlerThread("probe");
                  ht.start();
                  bg = new Handler(ht.getLooper());

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(20, 12, 20, 12);

                  LinearLayout bar = new LinearLayout(this);
                  bar.setOrientation(LinearLayout.HORIZONTAL);
                  bar.addView(btn("Копіювати все", new View.OnClickListener() {
                      public void onClick(View v) { copyAll(); }
                  }));
                  bar.addView(btn("Очистити лог", new View.OnClickListener() {
                      public void onClick(View v) { clearLog(); }
                  }));
                  bar.addView(btn("Інша дія / перепідключити", new View.OnClickListener() {
                      public void onClick(View v) { reconnect(true); }
                  }));
                  root.addView(bar);

                  tvStatus = tv(14, true);
                  root.addView(tvStatus);

                  ScrollView sv = new ScrollView(this);
                  LinearLayout col = new LinearLayout(this);
                  col.setOrientation(LinearLayout.VERTICAL);
                  col.addView(head("== ГЕТТЕРИ (раз на секунду) =="));
                  tvGet = tv(13, false);
                  col.addView(tvGet);
                  col.addView(head("== КОЛБЕК: останнє значення по кодах =="));
                  tvCb = tv(13, false);
                  col.addView(tvCb);
                  col.addView(head("== КОЛБЕК: лог змін (нові зверху) =="));
                  tvLog = tv(12, false);
                  col.addView(tvLog);
                  sv.addView(col);
                  root.addView(sv, new LinearLayout.LayoutParams(-1, 0, 1f));
                  setContentView(root);

                  connect();
                  refresh();
              }

              Button btn(String t, View.OnClickListener l) {
                  Button b = new Button(this);
                  b.setText(t);
                  b.setOnClickListener(l);
                  return b;
              }

              TextView tv(float sp, boolean bold) {
                  TextView t = new TextView(this);
                  t.setTypeface(Typeface.MONOSPACE, bold ? Typeface.BOLD : Typeface.NORMAL);
                  t.setTextSize(sp);
                  return t;
              }

              TextView head(String s) {
                  TextView t = tv(13, true);
                  t.setText(s);
                  t.setPadding(0, 14, 0, 4);
                  return t;
              }

              void setStatus(String s) {
                  synchronized (lock) { statusText = s; }
                  refresh();
              }

              void connect() {
                  String a = ACTIONS[actIdx % ACTIONS.length];
                  Intent i = new Intent(a);
                  i.setComponent(new ComponentName(PKG, PKG + ".CarService"));
                  try {
                      bound = bindService(i, conn, Context.BIND_AUTO_CREATE);
                      setStatus("bindService=" + bound + "  дія: " + a);
                  } catch (Throwable e) {
                      bound = false;
                      setStatus("bindService помилка: " + e + "  дія: " + a);
                  }
              }

              void reconnect(final boolean nextAction) {
                  bg.removeCallbacksAndMessages(null);
                  bg.post(new Runnable() {
                      public void run() {
                          unregisterCb();
                          ui.post(new Runnable() {
                              public void run() {
                                  if (bound) {
                                      try { unbindService(conn); } catch (Throwable e) { }
                                      bound = false;
                                  }
                                  svc = null;
                                  if (nextAction) actIdx++;
                                  connect();
                              }
                          });
                      }
                  });
              }

              void registerCb() {
                  bg.post(new Runnable() {
                      public void run() {
                          IBinder s = svc;
                          if (s == null) return;
                          Parcel d = Parcel.obtain();
                          Parcel r = Parcel.obtain();
                          try {
                              d.writeInterfaceToken(SVC);
                              d.writeStrongBinder(cb);
                              s.transact(1, d, r, 0);
                              r.readException();
                              registered = true;
                              setStatus("Колбек зареєстровано (код 1). Чекаю дані...");
                              bg.removeCallbacks(poll);
                              bg.post(poll);
                          } catch (Throwable e) {
                              setStatus("Помилка реєстрації колбека: " + e);
                          } finally {
                              d.recycle();
                              r.recycle();
                          }
                      }
                  });
              }

              void unregisterCb() {
                  IBinder s = svc;
                  if (s == null || !registered) return;
                  Parcel d = Parcel.obtain();
                  Parcel r = Parcel.obtain();
                  try {
                      d.writeInterfaceToken(SVC);
                      d.writeStrongBinder(cb);
                      s.transact(2, d, r, 0);
                  } catch (Throwable e) {
                  } finally {
                      d.recycle();
                      r.recycle();
                      registered = false;
                  }
              }

              final Runnable poll = new Runnable() {
                  public void run() {
                      if (svc == null) return;
                      StringBuilder sb = new StringBuilder();
                      for (Map.Entry<Integer, String[]> e : G.entrySet()) {
                          String[] v = e.getValue();
                          sb.append(String.format(Locale.US, "%2d %-8s %s\n", e.getKey(), v[0], call(e.getKey(), v[1])));
                      }
                      synchronized (lock) { getText = sb.toString(); }
                      refresh();
                      bg.postDelayed(this, 1000);
                  }
              };

              String call(int code, String type) {
                  IBinder s = svc;
                  if (s == null) return "-";
                  Parcel d = Parcel.obtain();
                  Parcel r = Parcel.obtain();
                  try {
                      d.writeInterfaceToken(SVC);
                      s.transact(code, d, r, 0);
                      r.readException();
                      if (type.equals("F")) return String.valueOf(r.readFloat());
                      if (type.equals("I")) return String.valueOf(r.readInt());
                      if (type.equals("IA")) return Arrays.toString(r.createIntArray());
                      if (type.equals("FA")) return Arrays.toString(r.createFloatArray());
                      return words(r, 8);
                  } catch (Throwable e) {
                      return "ERR " + e.getClass().getSimpleName() + ": " + e.getMessage();
                  } finally {
                      d.recycle();
                      r.recycle();
                  }
              }

              // перші n слів парсела: int та, якщо схоже, float
              static String words(Parcel p, int max) {
                  int pos = p.dataPosition();
                  int n = Math.min(p.dataAvail() / 4, max);
                  StringBuilder sb = new StringBuilder();
                  for (int i = 0; i < n; i++) {
                      int v = p.readInt();
                      sb.append(v);
                      int ex = (v >>> 23) & 0xff;
                      if (ex >= 100 && ex <= 160) {
                          sb.append("~").append(String.format(Locale.US, "%.2f", Float.intBitsToFloat(v)));
                      }
                      sb.append(' ');
                  }
                  p.setDataPosition(pos);
                  return sb.toString().trim();
              }

              static String strings(Parcel p) {
                  StringBuilder sb = new StringBuilder();
                  try {
                      int pos = p.dataPosition();
                      byte[] all = p.marshall();
                      p.setDataPosition(pos);
                      for (int i = pos; i + 8 <= all.length; i += 4) {
                          int len = (all[i] & 0xff) | ((all[i + 1] & 0xff) << 8)
                                  | ((all[i + 2] & 0xff) << 16) | ((all[i + 3] & 0xff) << 24);
                          if (len < 2 || len > 40 || i + 4 + len * 2 > all.length) continue;
                          StringBuilder t = new StringBuilder();
                          boolean ok = true;
                          for (int k = 0; k < len; k++) {
                              int c = (all[i + 4 + k * 2] & 0xff) | ((all[i + 5 + k * 2] & 0xff) << 8);
                              if (c < 0x20 || c == 0x7f || c > 0x2fff) { ok = false; break; }
                              t.append((char) c);
                          }
                          if (ok) sb.append(" \"").append(t).append("\"");
                      }
                  } catch (Throwable e) {
                  }
                  return sb.toString();
              }

              class Cb extends Binder {
                  @Override
                  protected boolean onTransact(int code, Parcel data, Parcel reply, int flags) {
                      if (code == INTERFACE_TRANSACTION) {
                          if (reply != null) reply.writeString(CBD);
                          return true;
                      }
                      String p;
                      try {
                          try { data.enforceInterface(CBD); } catch (Throwable e) { }
                          p = words(data, 12) + strings(data);
                      } catch (Throwable e) {
                          p = "? " + e;
                      }
                      record(code, p);
                      if (reply != null && (flags & FLAG_ONEWAY) == 0) reply.writeNoException();
                      return true;
                  }
              }

              void record(int code, String p) {
                  synchronized (lock) {
                      Integer a = cbAll.get(code);
                      cbAll.put(code, a == null ? 1 : a + 1);
                      String old = cbLast.get(code);
                      if (old == null || !old.equals(p)) {
                          cbLast.put(code, p);
                          Integer c = cbChg.get(code);
                          cbChg.put(code, c == null ? 1 : c + 1);
                          double t = (SystemClock.elapsedRealtime() - t0) / 1000.0;
                          logLines.add(String.format(Locale.US, "[%6.1f] cb#%d: %s", t, code, p));
                          if (logLines.size() > 400) logLines.remove(0);
                      }
                  }
                  refresh();
              }

              String buildCb() {
                  StringBuilder sb = new StringBuilder();
                  synchronized (lock) {
                      for (Map.Entry<Integer, String> e : cbLast.entrySet()) {
                          int c = e.getKey();
                          sb.append(String.format(Locale.US, "cb#%-3d всього=%d змін=%d\n     %s\n",
                                  c, cbAll.get(c), cbChg.get(c), e.getValue()));
                      }
                  }
                  return sb.length() == 0 ? "(поки нічого не прийшло)" : sb.toString();
              }

              String buildLog() {
                  StringBuilder sb = new StringBuilder();
                  synchronized (lock) {
                      int from = Math.max(0, logLines.size() - 150);
                      for (int i = logLines.size() - 1; i >= from; i--) sb.append(logLines.get(i)).append('\n');
                  }
                  return sb.toString();
              }

              final Runnable doRefresh = new Runnable() {
                  public void run() {
                      if (tvStatus == null) return;
                      String st, gt;
                      synchronized (lock) { st = statusText; gt = getText; }
                      tvStatus.setText(st);
                      tvGet.setText(gt);
                      tvCb.setText(buildCb());
                      tvLog.setText(buildLog());
                  }
              };

              void refresh() {
                  ui.removeCallbacks(doRefresh);
                  ui.postDelayed(doRefresh, 150);
              }

              void clearLog() {
                  synchronized (lock) {
                      logLines.clear();
                      cbLast.clear();
                      cbAll.clear();
                      cbChg.clear();
                  }
                  refresh();
              }

              void copyAll() {
                  String st, gt;
                  synchronized (lock) { st = statusText; gt = getText; }
                  String all = st + "\n\n== ГЕТТЕРИ ==\n" + gt + "\n== КОЛБЕК ==\n" + buildCb()
                          + "\n== ЛОГ ==\n" + buildLog();
                  ClipboardManager cm = (ClipboardManager) getSystemService(Context.CLIPBOARD_SERVICE);
                  cm.setPrimaryClip(ClipData.newPlainText("carprobe", all));
                  Toast.makeText(this, "Скопійовано", Toast.LENGTH_SHORT).show();
              }

              @Override
              protected void onDestroy() {
                  super.onDestroy();
                  final IBinder s = svc;
                  try { unregisterCb(); } catch (Throwable e) { }
                  if (bound) {
                      try { unbindService(conn); } catch (Throwable e) { }
                  }
                  ht.quit();
              }
          }
          EOF

          echo '' | base64 -d > app/src/main/res/drawable/ic_launcher.png

      - name: Build
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: CarProbe
          path: app/build/outputs/apk/debug/app-debug.apk
