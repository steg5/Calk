
name: CarServiceProbe

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/CarServiceProbe.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Write project
        run: |
          mkdir -p app/src/main/java/ua/step/carserviceprobe

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'CarServiceProbe'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=false
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'ua.step.carserviceprobe'
              compileSdk 34

              defaultConfig {
                  applicationId 'ua.step.carserviceprobe'
                  minSdk 23
                  targetSdk 27
                  versionCode 1
                  versionName '1.0'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }

              lint {
                  abortOnError false
                  checkReleaseBuilds false
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="CarService Probe"
                  android:allowBackup="false"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="landscape">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/ua/step/carserviceprobe/MainActivity.java <<'EOF'
          package ua.step.carserviceprobe;

          import android.app.Activity;
          import android.os.Bundle;
          import android.os.IBinder;
          import android.content.ComponentName;
          import android.content.Context;
          import android.content.Intent;
          import android.content.ServiceConnection;
          import android.view.Gravity;
          import android.view.View;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          public class MainActivity extends Activity {

              private TextView status;
              private boolean binding = false;

              private final ServiceConnection connection = new ServiceConnection() {
                  @Override
                  public void onServiceConnected(ComponentName name, IBinder service) {
                      String result = "ПІДКЛЮЧЕНО\n";
                      result += "Service: " + name.flattenToShortString() + "\n";
                      result += "Binder alive: " + service.isBinderAlive() + "\n";
                      result += "Ping: " + service.pingBinder() + "\n";

                      try {
                          result += "Descriptor: " + service.getInterfaceDescriptor();
                      } catch (Exception e) {
                          result += "Descriptor error: " + e;
                      }

                      status.setText(result);
                  }

                  @Override
                  public void onServiceDisconnected(ComponentName name) {
                      status.setText("З'єднання втрачено:\n" + name.flattenToShortString());
                  }

                  @Override
                  public void onBindingDied(ComponentName name) {
                      status.setText("Binder binding died:\n" + name.flattenToShortString());
                      binding = false;
                  }
              };

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  LinearLayout layout = new LinearLayout(this);
                  layout.setOrientation(LinearLayout.VERTICAL);
                  layout.setGravity(Gravity.CENTER);
                  layout.setPadding(30, 20, 30, 20);

                  TextView title = new TextView(this);
                  title.setText("CarService Binder Probe");
                  title.setTextSize(26);
                  title.setGravity(Gravity.CENTER);

                  status = new TextView(this);
                  status.setText("Очікування перевірки...");
                  status.setTextSize(18);
                  status.setPadding(10, 25, 10, 25);
                  status.setGravity(Gravity.CENTER);

                  Button connect = new Button(this);
                  connect.setText("Перевірити CarService");
                  connect.setTextSize(18);
                  connect.setOnClickListener(v -> connectService());

                  Button disconnect = new Button(this);
                  disconnect.setText("Від'єднатися");
                  disconnect.setTextSize(18);
                  disconnect.setOnClickListener(v -> disconnectService());

                  layout.addView(title);
                  layout.addView(status);
                  layout.addView(connect);
                  layout.addView(disconnect);

                  setContentView(layout);
              }

              private void connectService() {
                  if (binding) {
                      status.setText("Запит на підключення вже виконується.");
                      return;
                  }

                  Intent intent = new Intent();
                  intent.setComponent(new ComponentName(
                      "com.tw.carinfoservice",
                      "com.tw.carinfoservice.CarService"
                  ));

                  try {
                      binding = bindService(intent, connection, Context.BIND_AUTO_CREATE);
                      status.setText(binding
                          ? "Запит на підключення надіслано. Очікуємо Binder..."
                          : "bindService повернув false. Сервіс недоступний.");
                  } catch (Exception e) {
                      binding = false;
                      status.setText("Помилка bindService:\n" + e);
                  }
              }

              private void disconnectService() {
                  if (binding) {
                      try {
                          unbindService(connection);
                      } catch (Exception ignored) {
                      }
                      binding = false;
                  }
                  status.setText("Від'єднано.");
              }

              @Override
              protected void onDestroy() {
                  if (binding) {
                      try {
                          unbindService(connection);
                      } catch (Exception ignored) {
                      }
                      binding = false;
                  }
                  super.onDestroy();
              }
          }
          EOF

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CarServiceProbe-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
