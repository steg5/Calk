              volatile boolean cancelled, paused, cancelAll;

              void waitPause() throws java.io.IOException {
                  while (paused && !cancelled) {
                      try {
                          Thread.sleep(100);
                      } catch (InterruptedException ignored) {
                      }
                  }
                  if (cancelled) throw new java.io.IOException("Скасовано");
