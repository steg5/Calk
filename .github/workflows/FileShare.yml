              @Override
              public synchronized void progress(final String key, final String title, final long done, final long total, final boolean end, final String msg) {
                  long now = System.currentTimeMillis();
                  if (!key.equals(pKey)) {
                      pKey = key;
                      pT0 = now;
                      pLast = 0;
                  }
                  if (!end && now - pLast < 200) return;
                  pLast = now;
                  final double el = Math.max(1, now - pT0) / 1000.0;
                  final double spd = done / el;
                  final int pct = total > 0 ? (int) Math.min(100, done * 100 / total) : 0;
                  String eta = "";
                  if (!end && spd > 1 && total > done) eta = "   залишилось " + Math.max(1, Math.round((total - done) / spd)) + " с";
                  final String info = fmtSize(done) + " з " + fmtSize(total) + "\n" + fmtSize(spd) + "/с" + eta;
                  ui.post(() -> {
                      if (pDlg == null || !pDlg.isShowing() || !key.equals(pDlg.getWindow().getDecorView().getTag())) showProg(key);
                      pTitle.setText(title);
                      pBar.setProgress(end && msg != null && msg.contains("✓") ? 100 : pct);
                      pPct.setText(end ? msg : pct + " %");
                      pInfo.setText(end && !(msg != null && msg.contains("✓")) ? "" : info);
                      if (end) {
                          pPause.setVisibility(View.GONE);
                          pCancel.setVisibility(View.GONE);
                          pBtn.setText("Закрити");
                          if (msg != null && msg.contains("✓")) ui.postDelayed(() -> {
                              try {
                                  if (pDlg != null && key.equals(pDlg.getWindow().getDecorView().getTag())) pDlg.dismiss();
                              } catch (Throwable ignored) {
                              }
                          }, 1800);
                      }
                  });
              }

