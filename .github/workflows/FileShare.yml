name: FileShare

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/FileShare.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Write project
        run: |
          mkdir -p app/src/main/java/com/example/fileshare app/src/main/res/drawable
          echo '' | base64 -d > debug.keystore

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'FileShare'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=false
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.example.fileshare'
              compileSdk 34
              defaultConfig {
                  applicationId "com.example.fileshare"
                  minSdk 23
                  targetSdk 26
                  versionCode 5
                  versionName "1.4"
              }
              signingConfigs {
                  debug {
                      storeFile file("${rootDir}/debug.keystore")
                      storePassword 'android'
                      keyAlias 'androiddebugkey'
                      keyPassword 'android'
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
              lint {
                  abortOnError false
                  checkReleaseBuilds false
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE"/>
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"/>
              <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES"/>
              <application
                  android:label="Передача"
                  android:icon="@drawable/ic_launcher"
                  android:allowBackup="false"
                  android:usesCleartextTraffic="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/example/fileshare/MainActivity.java <<'EOF'
          package com.example.fileshare;

          import android.Manifest;
          import android.app.Activity;
          import android.app.AlertDialog;
          import android.app.Dialog;
          import android.widget.ProgressBar;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.PackageManager;
          import android.database.Cursor;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.os.Handler;
          import android.os.Looper;
          import android.os.StrictMode;
          import android.provider.OpenableColumns;
          import android.view.Gravity;
          import android.view.View;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;

          import java.io.BufferedReader;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.io.InputStreamReader;
          import java.io.OutputStream;
          import java.net.HttpURLConnection;
          import java.net.InetAddress;
          import java.net.NetworkInterface;
          import java.net.URL;
          import java.net.URLEncoder;
          import java.text.SimpleDateFormat;
          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.Date;
          import java.util.List;
          import java.util.Locale;

          public class MainActivity extends Activity implements FileServer.Host {
              static final int PORT = 8080;
              static final int BG = 0xFF0B0F17, CARD = 0xFF172033, TXT = 0xFFF1F5F9, DIM = 0xFF8A99B3, ACC = 0xFF22D3EE;

              final Handler ui = new Handler(Looper.getMainLooper());
              SharedPreferences sp;
              FileServer server;
              EditText etIp, etPin;
              TextView tvLog, tvMy;
              ScrollView logScroll;
              final SimpleDateFormat tf = new SimpleDateFormat("HH:mm:ss", Locale.US);

              int dp(int v) {
                  return (int) (v * getResources().getDisplayMetrics().density + 0.5f);
              }

              Button btn(String s, int color) {
                  Button b = new Button(this);
                  b.setText(s);
                  b.setAllCaps(false);
                  b.setTextColor(Color.WHITE);
                  b.setTextSize(19);
                  b.setTypeface(Typeface.DEFAULT_BOLD);
                  GradientDrawable g = new GradientDrawable();
                  g.setColor(color);
                  g.setCornerRadius(dp(16));
                  b.setBackground(g);
                  return b;
              }

              EditText field(String hint, String val) {
                  EditText e = new EditText(this);
                  e.setHint(hint);
                  e.setText(val);
                  e.setTextColor(TXT);
                  e.setHintTextColor(DIM);
                  e.setSingleLine(true);
                  return e;
              }

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  StrictMode.setVmPolicy(new StrictMode.VmPolicy.Builder().build());
                  sp = getSharedPreferences("fs", MODE_PRIVATE);
                  if (Build.VERSION.SDK_INT >= 23 && checkSelfPermission(Manifest.permission.WRITE_EXTERNAL_STORAGE) != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(new String[]{Manifest.permission.WRITE_EXTERNAL_STORAGE}, 1);
                  }

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setBackgroundColor(BG);
                  root.setPadding(dp(14), dp(10), dp(14), dp(10));

                  TextView title = new TextView(this);
                  title.setText("Передача файлів");
                  title.setTextSize(24);
                  title.setTextColor(TXT);
                  title.setTypeface(Typeface.DEFAULT_BOLD);
                  root.addView(title);
                  tvMy = new TextView(this);
                  tvMy.setTextColor(ACC);
                  tvMy.setTextSize(15);
                  root.addView(tvMy);

                  LinearLayout row = new LinearLayout(this);
                  etIp = field("Адреса іншого пристрою", sp.getString("ip", "192.168.11.215"));
                  etPin = field("PIN", sp.getString("pin", "1234"));
                  row.addView(etIp, new LinearLayout.LayoutParams(0, -2, 2));
                  row.addView(etPin, new LinearLayout.LayoutParams(0, -2, 1));
                  root.addView(row);

                  LinearLayout r1 = new LinearLayout(this);
                  Button send = btn("⬆  Відправити", 0xFF2563EB);
                  Button recv = btn("⬇  Прийняти", 0xFF16A34A);
                  send.setOnClickListener(v -> {
                      save();
                      pick();
                  });
                  recv.setOnClickListener(v -> {
                      save();
                      listRemote();
                  });
                  LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(0, dp(78), 1);
                  lp.setMargins(dp(4), dp(8), dp(4), dp(4));
                  r1.addView(send, lp);
                  r1.addView(recv, lp);
                  root.addView(r1);

                  LinearLayout r2 = new LinearLayout(this);
                  Button csend = btn("📋  Передати буфер", 0xFF0EA5E9);
                  Button crecv = btn("📋  Прийняти буфер", 0xFF14B8A6);
                  csend.setOnClickListener(v -> {
                      save();
                      clipSend();
                  });
                  crecv.setOnClickListener(v -> {
                      save();
                      clipRecv();
                  });
                  LinearLayout.LayoutParams lpc = new LinearLayout.LayoutParams(0, dp(64), 1);
                  lpc.setMargins(dp(4), dp(4), dp(4), dp(4));
                  r2.addView(csend, lpc);
                  r2.addView(crecv, lpc);
                  root.addView(r2);

                  Button inst = btn("📦  Встановити APK з цього пристрою", 0xFF7C3AED);
                  inst.setOnClickListener(v -> listLocalApk());
                  LinearLayout.LayoutParams lp2 = new LinearLayout.LayoutParams(-1, dp(64));
                  lp2.setMargins(dp(4), dp(4), dp(4), dp(8));
                  root.addView(inst, lp2);

                  logScroll = new ScrollView(this);
                  tvLog = new TextView(this);
                  tvLog.setTextColor(DIM);
                  tvLog.setTextSize(14);
                  tvLog.setTextIsSelectable(true);
                  logScroll.addView(tvLog);
                  root.addView(logScroll, new LinearLayout.LayoutParams(-1, 0, 1));
                  setContentView(root);

                  tvMy.setText("Ця адреса: " + myIps() + ":" + PORT + "   |   Папка: Download/Transfer");
                  server = new FileServer(this);
                  server.start(PORT);
                  log("Готово. Встанови цю програму на обидва пристрої й тримай її відкритою там, куди відправляєш.");
              }

              @Override
              protected void onDestroy() {
                  if (server != null) server.stop();
                  super.onDestroy();
              }

              void save() {
                  sp.edit().putString("ip", etIp.getText().toString().trim()).putString("pin", etPin.getText().toString().trim()).apply();
              }

              static String myIps() {
                  StringBuilder sb = new StringBuilder();
                  try {
                      for (NetworkInterface ni : Collections.list(NetworkInterface.getNetworkInterfaces())) {
                          for (InetAddress a : Collections.list(ni.getInetAddresses())) {
                              if (!a.isLoopbackAddress() && a.getHostAddress().indexOf(':') < 0) {
                                  if (sb.length() > 0) sb.append(", ");
                                  sb.append(a.getHostAddress());
                              }
                          }
                      }
                  } catch (Throwable ignored) {
                  }
                  return sb.length() == 0 ? "немає мережі" : sb.toString();
              }

              // ---- Host ----
              @Override
              public File dir() {
                  File d = new File(Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS), "Transfer");
                  d.mkdirs();
                  if (!d.isDirectory() || !d.canWrite()) {
                      File alt = getExternalFilesDir(null);
                      d = alt != null ? alt : getFilesDir();
                  }
                  return d;
              }

              @Override
              public String pin() {
                  return sp.getString("pin", "1234");
              }

              @Override
              public void received(final File f) {
                  ui.post(() -> {
                      if (f.getName().toLowerCase().endsWith(".apk")) {
                          new AlertDialog.Builder(this)
                                  .setTitle("Отримано " + f.getName())
                                  .setMessage("Встановити цей APK зараз?")
                                  .setPositiveButton("Встановити", (d, w) -> install(f))
                                  .setNegativeButton("Пізніше", null)
                                  .show();
                      }
                  });
              }

              @Override
              public void log(final String s) {
                  ui.post(() -> {
                      tvLog.append(tf.format(new Date()) + "  " + s + "\n");
                      logScroll.post(() -> logScroll.fullScroll(View.FOCUS_DOWN));
                  });
              }

              // ---- відправлення ----
              void pick() {
                  Intent i = new Intent(Intent.ACTION_OPEN_DOCUMENT);
                  i.addCategory(Intent.CATEGORY_OPENABLE);
                  i.setType("*/*");
                  i.putExtra(Intent.EXTRA_ALLOW_MULTIPLE, true);
                  try {
                      if (Build.VERSION.SDK_INT >= 26) {
                          dir();
                          i.putExtra(android.provider.DocumentsContract.EXTRA_INITIAL_URI,
                                  Uri.parse("content://com.android.externalstorage.documents/document/primary%3ADownload%2FTransfer"));
                      }
                  } catch (Throwable ignored) {
                  }
                  startActivityForResult(i, 10);
              }

              @Override
              protected void onActivityResult(int req, int res, Intent data) {
                  super.onActivityResult(req, res, data);
                  if (req == 10 && res == RESULT_OK && data != null) {
                      final java.util.ArrayList<Uri> us = new java.util.ArrayList<Uri>();
                      if (data.getClipData() != null) {
                          for (int k = 0; k < data.getClipData().getItemCount(); k++) us.add(data.getClipData().getItemAt(k).getUri());
                      } else if (data.getData() != null) {
                          us.add(data.getData());
                      }
                      if (us.isEmpty()) return;
                      new Thread(() -> {
                          for (int k = 0; k < us.size(); k++) upload(us.get(k), us.size() > 1 ? "Файл " + (k + 1) + " з " + us.size() + ". " : "");
                          if (us.size() > 1) log("Відправлено файлів: " + us.size());
                      }).start();
                  }
              }

              String readClip() {
                  try {
                      android.content.ClipboardManager cm = (android.content.ClipboardManager) getSystemService(CLIPBOARD_SERVICE);
                      android.content.ClipData d = cm.getPrimaryClip();
                      if (d != null && d.getItemCount() > 0) {
                          CharSequence c = d.getItemAt(0).coerceToText(this);
                          if (c != null) return c.toString();
                      }
                  } catch (Throwable ignored) {
                  }
                  return "";
              }

              @Override
              public String clipText() {
                  if (Looper.myLooper() == Looper.getMainLooper()) return readClip();
                  final String[] r = {""};
                  final java.util.concurrent.CountDownLatch l = new java.util.concurrent.CountDownLatch(1);
                  runOnUiThread(() -> {
                      r[0] = readClip();
                      l.countDown();
                  });
                  try {
                      l.await(3, java.util.concurrent.TimeUnit.SECONDS);
                  } catch (Exception ignored) {
                  }
                  return r[0];
              }

              @Override
              public void setClip(final String t) {
                  runOnUiThread(() -> {
                      try {
                          android.content.ClipboardManager cm = (android.content.ClipboardManager) getSystemService(CLIPBOARD_SERVICE);
                          cm.setPrimaryClip(android.content.ClipData.newPlainText("Передача", t));
                      } catch (Throwable ignored) {
                      }
                  });
              }

              void clipSend() {
                  final String t = readClip();
                  if (t.isEmpty()) {
                      log("Буфер порожній (на Android 10+ застосунок має бути на екрані)");
                      return;
                  }
                  new Thread(() -> {
                      try {
                          byte[] b = t.getBytes("UTF-8");
                          HttpURLConnection c = (HttpURLConnection) new URL(base() + "/clipset?pin=" + q(etPin.getText().toString().trim())).openConnection();
                          c.setConnectTimeout(5000);
                          c.setReadTimeout(10000);
                          c.setDoOutput(true);
                          c.setRequestMethod("POST");
                          c.setFixedLengthStreamingMode(b.length);
                          java.io.OutputStream o = c.getOutputStream();
                          o.write(b);
                          o.close();
                          int rc = c.getResponseCode();
                          log(rc == 200 ? "Буфер передано (" + t.length() + " символів)" : "Помилка передачі: " + rc);
                      } catch (Throwable e) {
                          log("Помилка: " + e);
                      }
                  }).start();
              }

              void clipRecv() {
                  new Thread(() -> {
                      try {
                          HttpURLConnection c = (HttpURLConnection) new URL(base() + "/clipget?pin=" + q(etPin.getText().toString().trim())).openConnection();
                          c.setConnectTimeout(5000);
                          c.setReadTimeout(10000);
                          if (c.getResponseCode() != 200) {
                              log("Помилка: " + c.getResponseCode());
                              return;
                          }
                          java.io.InputStream in = c.getInputStream();
                          java.io.ByteArrayOutputStream bo = new java.io.ByteArrayOutputStream();
                          byte[] buf = new byte[8192];
                          int n;
                          while ((n = in.read(buf)) > 0) bo.write(buf, 0, n);
                          in.close();
                          String t = new String(bo.toByteArray(), "UTF-8");
                          setClip(t);
                          log(t.isEmpty() ? "Буфер на тому пристрої порожній" : "Буфер прийнято (" + t.length() + " символів)");
                      } catch (Throwable e) {
                          log("Помилка: " + e);
                      }
                  }).start();
              }

              String base() {
                  return "http://" + etIp.getText().toString().trim() + ":" + PORT;
              }

              String q(String s) throws Exception {
                  return URLEncoder.encode(s, "UTF-8");
              }

              void upload(Uri u, String pre) {
                  final String key = "up" + System.nanoTime();
                  String ttl = "Відправлення";
                  long size = -1;
                  try {
                      String name = "file";
                      Cursor c = getContentResolver().query(u, null, null, null, null);
                      if (c != null) {
                          if (c.moveToFirst()) {
                              int ni = c.getColumnIndex(OpenableColumns.DISPLAY_NAME);
                              int si = c.getColumnIndex(OpenableColumns.SIZE);
                              if (ni >= 0) name = c.getString(ni);
                              if (si >= 0 && !c.isNull(si)) size = c.getLong(si);
                          }
                          c.close();
                      }
                      ttl = pre + "Відправлення: " + name;
                      InputStream in = getContentResolver().openInputStream(u);
                      File tmp = null;
                      if (size <= 0) {
                          tmp = new File(getCacheDir(), "up.tmp");
                          FileOutputStream fo = new FileOutputStream(tmp);
                          byte[] buf = new byte[65536];
                          int n;
                          while ((n = in.read(buf)) > 0) fo.write(buf, 0, n);
                          fo.close();
                          in.close();
                          size = tmp.length();
                          in = new java.io.FileInputStream(tmp);
                      }
                      log("Відправляю " + name + " (" + size / 1024 + " КБ)…");
                      progress(key, ttl, 0, size, false, null);
                      HttpURLConnection c2 = (HttpURLConnection) new URL(base() + "/upload?name=" + q(name) + "&pin=" + q(etPin.getText().toString().trim())).openConnection();
                      c2.setConnectTimeout(6000);
                      c2.setReadTimeout(30000);
                      c2.setRequestMethod("POST");
                      c2.setDoOutput(true);
                      c2.setFixedLengthStreamingMode(size);
                      OutputStream o = c2.getOutputStream();
                      byte[] buf = new byte[65536];
                      int n;
                      long sent = 0;
                      while ((n = in.read(buf)) > 0) {
                          o.write(buf, 0, n);
                          sent += n;
                          progress(key, ttl, sent, size, false, null);
                      }
                      o.close();
                      in.close();
                      int code = c2.getResponseCode();
                      progress(key, ttl, size, size, true, code == 200 ? "Відправлено ✓" : "Помилка " + code);
                      log(code == 200 ? "Відправлено ✓ " + name : "Помилка " + code + " " + readAll(code == 200 ? c2.getInputStream() : c2.getErrorStream()));
                      if (tmp != null) tmp.delete();
                  } catch (Throwable t) {
                      progress(key, ttl, 0, Math.max(1, size), true, "Не вдалось: " + t);
                      log("Не вдалось відправити: " + t);
                  }
              }

              // ---- вікно прогресу ----
              Dialog pDlg;
              TextView pTitle, pPct, pInfo;
              ProgressBar pBar;
              Button pBtn;
              String pKey = "";
              long pT0, pLast;

              static String fmtSize(double b) {
                  if (b >= 1048576) return String.format(Locale.US, "%.1f МБ", b / 1048576.0);
                  return String.format(Locale.US, "%.0f КБ", b / 1024.0);
              }

              @Override
              public synchronized void progress(final String key, final String title, final long done, final long total, final boolean end, final String msg) {
                  long now = System.currentTimeMillis();
                  if (!key.equals(pKey)) {
                      pKey = key;
                      pT0 = now;
                      pLast = 0;
                  }
                  if (!end && now - pLast < 200) return;
                  pLast = now;
                  final double el = Math.max(1, now - pT0) / 1000.0;
                  final double spd = done / el;
                  final int pct = total > 0 ? (int) Math.min(100, done * 100 / total) : 0;
                  String eta = "";
                  if (!end && spd > 1 && total > done) eta = "   залишилось " + Math.max(1, Math.round((total - done) / spd)) + " с";
                  final String info = fmtSize(done) + " з " + fmtSize(total) + "\n" + fmtSize(spd) + "/с" + eta;
                  ui.post(() -> {
                      if (pDlg == null || !pDlg.isShowing() || !key.equals(pDlg.getWindow().getDecorView().getTag())) showProg(key);
                      pTitle.setText(title);
                      pBar.setProgress(end && msg != null && msg.contains("✓") ? 100 : pct);
                      pPct.setText(end ? msg : pct + " %");
                      pInfo.setText(end && !(msg != null && msg.contains("✓")) ? "" : info);
                      if (end) {
                          pBtn.setText("Закрити");
                          if (msg != null && msg.contains("✓")) ui.postDelayed(() -> {
                              try {
                                  if (pDlg != null && key.equals(pDlg.getWindow().getDecorView().getTag())) pDlg.dismiss();
                              } catch (Throwable ignored) {
                              }
                          }, 1800);
                      }
                  });
              }

              void showProg(String key) {
                  try {
                      if (pDlg != null) pDlg.dismiss();
                  } catch (Throwable ignored) {
                  }
                  LinearLayout col = new LinearLayout(this);
                  col.setOrientation(LinearLayout.VERTICAL);
                  col.setPadding(dp(24), dp(20), dp(24), dp(16));
                  col.setBackgroundColor(CARD);
                  pTitle = new TextView(this);
                  pTitle.setTextColor(TXT);
                  pTitle.setTextSize(20);
                  pTitle.setTypeface(Typeface.DEFAULT_BOLD);
                  col.addView(pTitle);
                  pPct = new TextView(this);
                  pPct.setTextColor(ACC);
                  pPct.setTextSize(40);
                  pPct.setTypeface(Typeface.DEFAULT_BOLD);
                  col.addView(pPct);
                  pBar = new ProgressBar(this, null, android.R.attr.progressBarStyleHorizontal);
                  pBar.setMax(100);
                  col.addView(pBar, new LinearLayout.LayoutParams(-1, dp(14)));
                  pInfo = new TextView(this);
                  pInfo.setTextColor(DIM);
                  pInfo.setTextSize(18);
                  pInfo.setPadding(0, dp(10), 0, dp(10));
                  col.addView(pInfo);
                  pBtn = btn("Сховати", 0xFF2563EB);
                  pBtn.setOnClickListener(v -> pDlg.dismiss());
                  col.addView(pBtn, new LinearLayout.LayoutParams(-1, dp(56)));
                  Dialog d = new Dialog(this);
                  d.requestWindowFeature(android.view.Window.FEATURE_NO_TITLE);
                  d.setContentView(col);
                  d.getWindow().getDecorView().setTag(key);
                  d.getWindow().setLayout((int) (getResources().getDisplayMetrics().widthPixels * 0.6f), -2);
                  pDlg = d;
                  d.show();
              }

              static String readAll(InputStream in) {
                  try {
                      BufferedReader r = new BufferedReader(new InputStreamReader(in, "UTF-8"));
                      StringBuilder sb = new StringBuilder();
                      String l;
                      while ((l = r.readLine()) != null) sb.append(l).append('\n');
                      return sb.toString().trim();
                  } catch (Throwable t) {
                      return "";
                  }
              }

              // ---- прийняття ----
              void listRemote() {
                  log("Запитую список файлів…");
                  new Thread(() -> {
                      try {
                          HttpURLConnection c = (HttpURLConnection) new URL(base() + "/list?pin=" + q(etPin.getText().toString().trim())).openConnection();
                          c.setConnectTimeout(6000);
                          c.setReadTimeout(10000);
                          if (c.getResponseCode() != 200) {
                              log("Помилка " + c.getResponseCode() + " " + readAll(c.getErrorStream()));
                              return;
                          }
                          final List<String> names = new ArrayList<String>();
                          final List<String> labels = new ArrayList<String>();
                          for (String line : readAll(c.getInputStream()).split("\n")) {
                              String[] p = line.split("\t");
                              if (p.length == 2) {
                                  names.add(p[0]);
                                  labels.add(p[0] + "  (" + Long.parseLong(p[1]) / 1024 + " КБ)");
                              }
                          }
                          ui.post(() -> {
                              if (names.isEmpty()) {
                                  log("На іншому пристрої немає файлів у «Download/Transfer».");
                                  return;
                              }
                              new AlertDialog.Builder(this)
                                      .setTitle("Що прийняти?")
                                      .setItems(labels.toArray(new String[0]), (d, i) -> new Thread(() -> download(names.get(i))).start())
                                      .setNegativeButton("Скасувати", null)
                                      .show();
                          });
                      } catch (Throwable t) {
                          log("Не вдалось підключитись: " + t);
                      }
                  }).start();
              }

              void download(String name) {
                  final String key = "dn" + System.nanoTime(), ttl = "Приймання: " + name;
                  long tot = 0;
                  try {
                      log("Приймаю " + name + "…");
                      HttpURLConnection c = (HttpURLConnection) new URL(base() + "/get?name=" + q(name) + "&pin=" + q(etPin.getText().toString().trim())).openConnection();
                      c.setConnectTimeout(6000);
                      c.setReadTimeout(30000);
                      if (c.getResponseCode() != 200) {
                          log("Помилка " + c.getResponseCode());
                          progress(key, ttl, 0, 1, true, "Помилка " + c.getResponseCode());
                          return;
                      }
                      tot = c.getContentLength();
                      File f = new File(dir(), name);
                      InputStream in = c.getInputStream();
                      FileOutputStream fo = new FileOutputStream(f);
                      byte[] buf = new byte[65536];
                      int n;
                      long total = 0;
                      progress(key, ttl, 0, tot, false, null);
                      while ((n = in.read(buf)) > 0) {
                          fo.write(buf, 0, n);
                          total += n;
                          progress(key, ttl, total, tot, false, null);
                      }
                      fo.close();
                      in.close();
                      progress(key, ttl, total, total, true, "Прийнято ✓");
                      log("Прийнято ✓ " + name + " (" + total / 1024 + " КБ) → " + f.getParent());
                      received(f);
                  } catch (Throwable t) {
                      progress(key, ttl, 0, Math.max(1, tot), true, "Не вдалось: " + t);
                      log("Не вдалось прийняти: " + t);
                  }
              }

              // ---- встановлення ----
              void listLocalApk() {
                  File[] fs = dir().listFiles();
                  final List<File> apks = new ArrayList<File>();
                  if (fs != null) {
                      java.util.Arrays.sort(fs, (a, b2) -> Long.compare(b2.lastModified(), a.lastModified()));
                      for (File f : fs) if (f.getName().toLowerCase().endsWith(".apk")) apks.add(f);
                  }
                  if (apks.isEmpty()) {
                      log("У папці немає APK-файлів.");
                      return;
                  }
                  String[] names = new String[apks.size()];
                  for (int i = 0; i < names.length; i++) names[i] = apks.get(i).getName();
                  new AlertDialog.Builder(this)
                          .setTitle("Який APK встановити?")
                          .setItems(names, (d, i) -> install(apks.get(i)))
                          .setNegativeButton("Скасувати", null)
                          .show();
              }

              void install(File f) {
                  try {
                      Intent i = new Intent(Intent.ACTION_VIEW);
                      i.setDataAndType(Uri.fromFile(f), "application/vnd.android.package-archive");
                      i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      startActivity(i);
                  } catch (Throwable t) {
                      log("Не вдалось запустити встановлення: " + t);
                  }
              }
          }
          EOF

          cat > app/src/main/java/com/example/fileshare/FileServer.java <<'EOF'
          package com.example.fileshare;

          import android.net.Uri;

          import java.io.BufferedOutputStream;
          import java.io.File;
          import java.io.FileInputStream;
          import java.io.FileOutputStream;
          import java.io.IOException;
          import java.io.InputStream;
          import java.io.OutputStream;
          import java.net.ServerSocket;
          import java.net.Socket;
          import java.util.Arrays;
          import java.util.Comparator;

          /** Простий HTTP-сервер для прийому/віддачі файлів: /upload, /list, /get. */
          final class FileServer {
              interface Host {
                  File dir();

                  String pin();

                  void received(File f);

                  void log(String s);

                  String clipText();

                  void setClip(String t);

                  void progress(String key, String title, long done, long total, boolean end, String msg);
              }

              private final Host host;
              private ServerSocket ss;
              private volatile boolean run;

              FileServer(Host h) {
                  host = h;
              }

              void start(final int port) {
                  run = true;
                  new Thread(new Runnable() {
                      @Override
                      public void run() {
                          try {
                              ss = new ServerSocket(port);
                              host.log("Сервер слухає порт " + port);
                              while (run) {
                                  final Socket s = ss.accept();
                                  new Thread(new Runnable() {
                                      @Override
                                      public void run() {
                                          handle(s);
                                      }
                                  }).start();
                              }
                          } catch (Throwable t) {
                              if (run) host.log("Сервер: " + t);
                          }
                      }
                  }, "fs-accept").start();
              }

              void stop() {
                  run = false;
                  try {
                      if (ss != null) ss.close();
                  } catch (Throwable ignored) {
                  }
              }

              private static String readLine(InputStream in) throws IOException {
                  StringBuilder sb = new StringBuilder();
                  int c;
                  while ((c = in.read()) >= 0) {
                      if (c == '\n') break;
                      if (c != '\r') sb.append((char) c);
                      if (sb.length() > 8192) break;
                  }
                  return c < 0 && sb.length() == 0 ? null : sb.toString();
              }

              private static void reply(OutputStream o, int code, String type, byte[] body) throws IOException {
                  String head = "HTTP/1.1 " + code + (code == 200 ? " OK" : " ERR") + "\r\nContent-Type: " + type
                          + "\r\nContent-Length: " + body.length + "\r\nConnection: close\r\n\r\n";
                  o.write(head.getBytes("ISO-8859-1"));
                  o.write(body);
                  o.flush();
              }

              private static String safeName(String n) {
                  if (n == null) return "file";
                  n = n.replace('\\', '/');
                  n = n.substring(n.lastIndexOf('/') + 1).trim();
                  while (n.startsWith(".")) n = n.substring(1);
                  return n.isEmpty() ? "file" : n;
              }

              private void handle(Socket s) {
                  try {
                      s.setSoTimeout(20000);
                      InputStream in = s.getInputStream();
                      OutputStream out = new BufferedOutputStream(s.getOutputStream());
                      String line = readLine(in);
                      if (line == null) return;
                      String[] p = line.split(" ");
                      if (p.length < 2) return;
                      long len = 0;
                      String h;
                      while ((h = readLine(in)) != null && !h.isEmpty()) {
                          if (h.toLowerCase().startsWith("content-length:")) {
                              try {
                                  len = Long.parseLong(h.substring(15).trim());
                              } catch (NumberFormatException ignored) {
                              }
                          }
                      }
                      Uri u = Uri.parse("http://x" + p[1]);
                      String path = u.getPath() == null ? "/" : u.getPath();
                      String pin = u.getQueryParameter("pin");
                      if (pin == null || !pin.equals(host.pin())) {
                          reply(out, 403, "text/plain; charset=utf-8", "Невірний PIN".getBytes("UTF-8"));
                          host.log("Відхилено запит: невірний PIN");
                          return;
                      }
                      File dir = host.dir();
                      dir.mkdirs();
                      if (path.equals("/upload")) {
                          String name = safeName(u.getQueryParameter("name"));
                          File tmp = new File(dir, name + ".part");
                          FileOutputStream fo = new FileOutputStream(tmp);
                          byte[] buf = new byte[65536];
                          long left = len;
                          String key = "in" + System.nanoTime(), ttl = "Отримання: " + name;
                          host.progress(key, ttl, 0, len, false, null);
                          while (left > 0) {
                              int n = in.read(buf, 0, (int) Math.min(buf.length, left));
                              if (n < 0) break;
                              fo.write(buf, 0, n);
                              left -= n;
                              host.progress(key, ttl, len - left, len, false, null);
                          }
                          fo.close();
                          if (left > 0) {
                              host.progress(key, ttl, len - left, len, true, "Обірвано");
                              tmp.delete();
                              reply(out, 500, "text/plain; charset=utf-8", "Обірвано".getBytes("UTF-8"));
                              host.log("Отримання обірвано: " + name);
                              return;
                          }
                          File dst = new File(dir, name);
                          if (dst.exists()) dst.delete();
                          tmp.renameTo(dst);
                          reply(out, 200, "text/plain; charset=utf-8", "OK".getBytes("UTF-8"));
                          host.progress(key, ttl, len, len, true, "Отримано ✓");
                          host.log("Отримано: " + name + " (" + len / 1024 + " КБ)");
                          host.received(dst);
                      } else if (path.equals("/list")) {
                          File[] fs = dir.listFiles();
                          StringBuilder sb = new StringBuilder();
                          if (fs != null) {
                              Arrays.sort(fs, new Comparator<File>() {
                                  @Override
                                  public int compare(File a, File b) {
                                      return Long.compare(b.lastModified(), a.lastModified());
                                  }
                              });
                              int n = 0;
                              for (File f : fs) {
                                  if (!f.isFile() || f.getName().endsWith(".part")) continue;
                                  sb.append(f.getName()).append('\t').append(f.length()).append('\n');
                                  if (++n >= 60) break;
                              }
                          }
                          reply(out, 200, "text/plain; charset=utf-8", sb.toString().getBytes("UTF-8"));
                      } else if (path.equals("/get")) {
                          File f = new File(dir, safeName(u.getQueryParameter("name")));
                          if (!f.isFile()) {
                              reply(out, 404, "text/plain; charset=utf-8", "Немає файлу".getBytes("UTF-8"));
                              return;
                          }
                          String head = "HTTP/1.1 200 OK\r\nContent-Type: application/octet-stream\r\nContent-Length: " + f.length()
                                  + "\r\nConnection: close\r\n\r\n";
                          out.write(head.getBytes("ISO-8859-1"));
                          FileInputStream fi = new FileInputStream(f);
                          byte[] buf = new byte[65536];
                          int n;
                          long sent = 0, tot = f.length();
                          String key = "out" + System.nanoTime(), ttl = "Віддача: " + f.getName();
                          host.progress(key, ttl, 0, tot, false, null);
                          try {
                              while ((n = fi.read(buf)) > 0) {
                                  out.write(buf, 0, n);
                                  sent += n;
                                  host.progress(key, ttl, sent, tot, false, null);
                              }
                              out.flush();
                          } catch (IOException e) {
                              host.progress(key, ttl, sent, tot, true, "Обірвано");
                              fi.close();
                              throw e;
                          }
                          fi.close();
                          host.progress(key, ttl, tot, tot, true, "Віддано ✓");
                          host.log("Віддано: " + f.getName());
                      } else if (path.equals("/clipget")) {
                          reply(out, 200, "text/plain; charset=utf-8", host.clipText().getBytes("UTF-8"));
                          host.log("Буфер віддано");
                      } else if (path.equals("/clipset")) {
                          java.io.ByteArrayOutputStream bo = new java.io.ByteArrayOutputStream();
                          byte[] cb = new byte[8192];
                          long cl = Math.min(len, 1048576);
                          while (cl > 0) {
                              int n = in.read(cb, 0, (int) Math.min(cb.length, cl));
                              if (n < 0) break;
                              bo.write(cb, 0, n);
                              cl -= n;
                          }
                          host.setClip(new String(bo.toByteArray(), "UTF-8"));
                          reply(out, 200, "text/plain; charset=utf-8", "OK".getBytes("UTF-8"));
                          host.log("Буфер отримано (" + bo.size() + " байт)");
                      } else {
                          reply(out, 404, "text/plain; charset=utf-8", "?".getBytes("UTF-8"));
                      }
                  } catch (Throwable t) {
                      host.log("Помилка сервера: " + t);
                  } finally {
                      try {
                          s.close();
                      } catch (Throwable ignored) {
                      }
                  }
              }
          }
          EOF

