                      progress(key, ttl, size, size, true, code == 200 ? "Відправлено ✓" : "Помилка " + code);
                      log(code == 200 ? "Відправлено ✓ " + name : "Помилка " + code + " " + readAll(code == 200 ? c2.getInputStream() : c2.getErrorStream()));
                      if (tmp != null) tmp.delete();
