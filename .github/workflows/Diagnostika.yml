          package com.example.diagnostics;

          import android.bluetooth.BluetoothAdapter;
          import android.bluetooth.BluetoothDevice;
          import android.bluetooth.BluetoothSocket;
          import android.content.Context;
          import android.net.ConnectivityManager;
          import android.net.Network;
          import android.net.NetworkCapabilities;

          import java.io.IOException;
          import java.io.InputStream;
          import java.io.OutputStream;
          import java.net.InetSocketAddress;
          import java.net.Socket;
          import java.util.ArrayList;
          import java.util.List;
          import java.util.UUID;

          /** Зв'язок з ELM327 (Wi-Fi або Bluetooth SPP). Усі виклики — з робочого потоку. */
          final class Elm {
              static final UUID SPP = UUID.fromString("00001101-0000-1000-8000-00805F9B34FB");

              private InputStream in;
              private OutputStream out;
              private Socket ip;
              private BluetoothSocket bt;
              volatile boolean alive;

              String version = "", proto = "", volts = "";
              boolean can = true;

              void connectWifi(Context ctx, String host, int port) throws IOException {
                  bindWifi(ctx);
                  Socket s = new Socket();
                  s.connect(new InetSocketAddress(host, port), 6000);
                  ip = s;
                  in = s.getInputStream();
                  out = s.getOutputStream();
                  alive = true;
              }

              void connectBt(BluetoothDevice dev) throws Exception {
                  BluetoothAdapter ad = BluetoothAdapter.getDefaultAdapter();
                  if (ad == null) throw new IOException("Bluetooth недоступний");
                  if (!ad.isEnabled()) throw new IOException("Bluetooth вимкнений");
                  ad.cancelDiscovery();
                  BluetoothSocket s = null;
                  try {
                      s = dev.createRfcommSocketToServiceRecord(SPP);
                      s.connect();
                  } catch (IOException e1) {
                      try { if (s != null) s.close(); } catch (Throwable ignored) { }
                      s = (BluetoothSocket) dev.getClass().getMethod("createRfcommSocket", int.class).invoke(dev, 1);
                      s.connect();
                  }
                  bt = s;
                  in = s.getInputStream();
                  out = s.getOutputStream();
                  alive = true;
              }

              private static void bindWifi(Context ctx) {
                  try {
                      ConnectivityManager cm = (ConnectivityManager) ctx.getSystemService(Context.CONNECTIVITY_SERVICE);
                      for (Network n : cm.getAllNetworks()) {
                          NetworkCapabilities nc = cm.getNetworkCapabilities(n);
                          if (nc != null && nc.hasTransport(NetworkCapabilities.TRANSPORT_WIFI)) {
                              cm.bindProcessToNetwork(n);
                              return;
                          }
                      }
                  } catch (Throwable ignored) {
                  }
              }

              void close() {
                  alive = false;
                  try { if (ip != null) ip.close(); } catch (Throwable ignored) { }
                  try { if (bt != null) bt.close(); } catch (Throwable ignored) { }
                  ip = null;
                  bt = null;
                  in = null;
                  out = null;
              }

              private boolean dirty = false;

              /** Після затримки відповіді: шле порожній рядок і чекає на '>' щоб вирівняти обмін. */
              void resync() {
                  try {
                      InputStream i = in;
                      OutputStream o = out;
                      if (i == null || o == null) return;
                      o.write("\r".getBytes("US-ASCII"));
                      o.flush();
                      long end = System.currentTimeMillis() + 1500;
                      while (System.currentTimeMillis() < end) {
                          if (i.available() > 0) {
                              if (i.read() == '>') {
                                  Thread.sleep(40);
                                  while (i.available() > 0) i.read();
                                  break;
                              }
                          } else {
                              Thread.sleep(10);
                          }
                      }
                  } catch (Throwable ignored) {
                  }
                  dirty = false;
              }

              String send(String cmd, int timeoutMs) throws IOException {
                  if (dirty) resync();
                  InputStream i = in;
                  OutputStream o = out;
                  if (i == null || o == null) throw new IOException("не підключено");
                  while (i.available() > 0) i.read();
                  o.write((cmd + "\r").getBytes("US-ASCII"));
                  o.flush();
                  StringBuilder sb = new StringBuilder();
                  long end = System.currentTimeMillis() + timeoutMs;
                  boolean prompt = false;
                  while (System.currentTimeMillis() < end && alive) {
                      if (i.available() > 0) {
                          int c = i.read();
                          if (c < 0) throw new IOException("з'єднання закрито");
                          if (c == '>') {
                              prompt = true;
                              break;
                          }
                          sb.append((char) c);
                      } else {
                          try {
                              Thread.sleep(8);
                          } catch (InterruptedException e) {
                              throw new IOException("перервано");
                          }
                      }
                  }
                  if (!prompt) dirty = true;
                  StringBuilder clean = new StringBuilder();
                  for (String line : sb.toString().replace('\r', '\n').split("\n")) {
                      String t = line.trim();
                      if (t.isEmpty() || t.equalsIgnoreCase(cmd)) continue;
                      if (clean.length() > 0) clean.append('\n');
                      clean.append(t);
                  }
                  return clean.toString();
              }

              /** Початкове налаштування адаптера. */
              void init() throws IOException {
                  version = send("ATZ", 3000);
                  send("ATE0", 1000);
                  send("ATL0", 1000);
                  send("ATS0", 1000);
                  send("ATH0", 1000);
                  send("ATSP0", 1000);
                  send("0100", 8000);
                  proto = send("ATDP", 1000);
                  can = proto.toUpperCase().contains("CAN");
                  volts = send("ATRV", 1000);
              }

              /** Список підтримуваних PID (наприклад "010C"). Порожній, якщо ЕБУ не відповів. */
              List<String> scanSupported() throws IOException {
                  List<String> res = new ArrayList<String>();
                  for (int base = 0; base <= 0x80; base += 0x20) {
                      String q = String.format("01%02X", base);
                      int[] d = Pids.parsePid(send(q, 5000), q);
                      if (d == null || d.length < 4) break;
                      long mask = 0;
                      for (int k = 0; k < 4; k++) mask = (mask << 8) | d[k];
                      for (int bit = 0; bit < 32; bit++) {
                          if ((mask & (1L << (31 - bit))) != 0) {
                              res.add(String.format("01%02X", base + bit + 1));
                          }
                      }
                      if ((mask & 1L) == 0) break;
                  }
                  return res;
              }
          }
