          package com.example.diagnostics;

          import android.os.Build;

          import java.io.BufferedWriter;
          import java.io.File;
          import java.io.FileWriter;
          import java.text.SimpleDateFormat;
          import java.util.ArrayList;
          import java.util.Date;
          import java.util.LinkedHashMap;
          import java.util.List;
          import java.util.Locale;
          import java.util.Map;

          /** Журнал подій, статистика PID, історія для графіків, CSV і текстовий звіт. */
          final class Rep {
              static final class Stat {
                  int ok, nodata, err;
                  double min = Double.MAX_VALUE, max = -Double.MAX_VALUE, sum;
                  double last = Double.NaN;
                  long lastT = 0;
                  String lastRaw = "";
              }

              static final class Hist {
                  final ArrayList<Long> t = new ArrayList<Long>();
                  final ArrayList<Double> v = new ArrayList<Double>();
              }

              private final SimpleDateFormat tf = new SimpleDateFormat("HH:mm:ss.SSS", Locale.US);
              private final ArrayList<String> events = new ArrayList<String>();
              private final ArrayList<String> rows = new ArrayList<String>();
              final Map<String, Stat> stats = new LinkedHashMap<String, Stat>();
              final Map<String, Hist> hist = new LinkedHashMap<String, Hist>();
              final Map<String, String> unknown = new LinkedHashMap<String, String>();
              String lastDtc = "";
              String supported = "";
              String initInfo = "";
              String appVersion = "2.0";
              private BufferedWriter csv;
              String csvPath = "";
              final long t0 = System.currentTimeMillis();

              synchronized void openCsv(File dir) {
                  try {
                      if (dir == null) return;
                      dir.mkdirs();
                      File f = new File(dir, "diag_" + new SimpleDateFormat("yyyyMMdd_HHmmss", Locale.US).format(new Date()) + ".csv");
                      csv = new BufferedWriter(new FileWriter(f));
                      csv.write("time_ms;pid;value;raw\n");
                      csvPath = f.getAbsolutePath();
                  } catch (Throwable ignored) {
                      csv = null;
                  }
              }

              synchronized void event(String s) {
                  events.add(tf.format(new Date()) + " " + s);
                  while (events.size() > 400) events.remove(0);
              }

              // ---------- запис ----------
              static final class RecRow {
                  double t;
                  String text;
                  boolean mark;
              }

              boolean recording;
              long recT0;
              final List<String> recCols = new ArrayList<String>();
              final ArrayList<RecRow> recRows = new ArrayList<RecRow>();

              synchronized void recStart(List<String> cols) {
                  recCols.clear();
                  recCols.addAll(cols);
                  recRows.clear();
                  recT0 = System.currentTimeMillis();
                  recording = true;
                  event("=== ЗАПИС ПОЧАТО ===");
              }

              synchronized void recRow() {
                  if (!recording) return;
                  long now = System.currentTimeMillis();
                  RecRow r = new RecRow();
                  r.t = (now - recT0) / 1000.0;
                  StringBuilder sb = new StringBuilder(String.format(Locale.US, "%.1f", r.t));
                  for (String c : recCols) {
                      Stat s = stats.get(c);
                      sb.append(';');
                      if (s != null && now - s.lastT < 6000 && !Double.isNaN(s.last)) sb.append(Pids.fmt(c, s.last));
                  }
                  r.text = sb.toString();
                  recRows.add(r);
                  if (recRows.size() > 20000) recRows.remove(0);
              }

              synchronized void recMark(String text) {
                  if (!recording) return;
                  RecRow r = new RecRow();
                  r.t = (System.currentTimeMillis() - recT0) / 1000.0;
                  r.mark = true;
                  r.text = String.format(Locale.US, "%.1f;>>> ПОЗНАЧКА: %s", r.t, text);
                  recRows.add(r);
                  event("★ ЗАПИС: " + text);
              }

              synchronized String recStop() {
                  recording = false;
                  event("=== ЗАПИС ЗАВЕРШЕНО ===");
                  ArrayList<Double> marks = new ArrayList<Double>();
                  for (RecRow r : recRows) if (r.mark) marks.add(r.t);
                  int n = recRows.size();
                  int k = n > 450 ? (int) Math.ceil(n / 350.0) : 1;
                  StringBuilder b = new StringBuilder();
                  b.append("=== ЗАПИС (час,с;");
                  for (String c : recCols) b.append(c).append(';');
                  b.append(") ===\n");
                  b.append("Параметри: ");
                  for (String c : recCols) {
                      Pids.Def d = Pids.find(c);
                      b.append(c).append('=').append(d != null ? d.name : "?").append(", ");
                  }
                  b.append("\nВсього рядків запису: ").append(n).append(", кожен ").append(k).append("-й поза вікнами ±25 с навколо позначок\n");
                  int idx = 0;
                  for (RecRow r : recRows) {
                      boolean near = false;
                      for (double m : marks) if (Math.abs(r.t - m) <= 25) near = true;
                      if (r.mark || near || idx % k == 0) b.append(r.text).append('\n');
                      idx++;
