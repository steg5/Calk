              static int minBytes(String pid) {
                  switch (pid) {
                      case "010C":
                      case "0110":
                      case "0123":
                      case "0142":
                      case "011F":
                      case "0121":
                      case "0131":
                      case "015E":
                      case "015D":
                      case "0163":
                      case "0143":
