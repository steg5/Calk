              void loadBt() {
                  devs.clear();
                  List<String> names = new ArrayList<String>();
                  try {
                      BluetoothAdapter ad = BluetoothAdapter.getDefaultAdapter();
                      if (ad != null && ad.isEnabled()) {
                          for (BluetoothDevice d : ad.getBondedDevices()) {
                              devs.add(d);
                              names.add(d.getName() + "  " + d.getAddress());
                          }
                      }
                  } catch (Throwable ignored) {
                  }
                  if (names.isEmpty()) names.add("(немає спарених Bluetooth-пристроїв)");
                  ArrayAdapter<String> ad = new ArrayAdapter<String>(this, android.R.layout.simple_spinner_item, names);
                  ad.setDropDownViewResource(android.R.layout.simple_spinner_dropdown_item);
                  String last = prefs.getString("btaddr", "");
                  for (ConnPanel cp : new ConnPanel[]{pTop}) {
                      cp.spin.setAdapter(ad);
                      for (int i = 0; i < devs.size(); i++) {
                          if (devs.get(i).getAddress().equals(last)) cp.spin.setSelection(i);
                      }
                  }
              }

