name: Diagnostika

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/Diagnostika.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Write project
        run: |
          mkdir -p app/src/main/java/com/example/diagnostics

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'Diagnostika'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=false
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.example.diagnostics'
              compileSdk 34
              defaultConfig {
                  applicationId "com.example.diagnostics"
                  minSdk 23
                  targetSdk 26
                  versionCode 7
                  versionName "2.5"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
              lint {
                  abortOnError false
                  checkReleaseBuilds false
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.BLUETOOTH"/>
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN"/>
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE"/>
              <application
                  android:label="Діагностика"
                  android:icon="@drawable/ic_launcher"
                  android:allowBackup="false">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/example/diagnostics/MainActivity.java <<'EOF'
          package com.example.diagnostics;

          import android.app.Activity;
          import android.app.AlertDialog;
          import android.bluetooth.BluetoothAdapter;
          import android.bluetooth.BluetoothDevice;
          import android.content.ClipData;
          import android.content.ClipboardManager;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.net.Uri;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.view.Gravity;
          import android.view.View;
          import android.view.ViewGroup;
          import android.widget.ArrayAdapter;
          import android.widget.Button;
          import android.widget.CheckBox;
          import android.widget.EditText;
          import android.widget.FrameLayout;
          import android.widget.LinearLayout;
          import android.widget.RadioButton;
          import android.widget.RadioGroup;
          import android.widget.ScrollView;
          import android.widget.Spinner;
          import android.widget.TextView;
          import android.widget.Toast;

          import java.io.IOException;
          import java.util.ArrayList;
          import java.util.HashMap;
          import java.util.HashSet;
          import java.util.List;
          import java.util.Map;
          import java.util.Set;
          import java.util.concurrent.LinkedBlockingQueue;
          import java.util.concurrent.TimeUnit;

          public class MainActivity extends Activity {
              static final int RED = 0xFFEF5350, GRN = 0xFF81C784;
              int BG, CARD, TXT, DIM, ACC, BTN, TABON;

              static final String[] SCHEME_NAMES = {"Темна синя", "Світла", "Зелена ніч", "Бурштин", "Чорна (AMOLED)"};
              static final int[][] SCHEMES = {
                      {0xFF101418, 0xFF1A2026, 0xFFECEFF1, 0xFF8899A6, 0xFF4FC3F7, 0xFF2A3640, 0xFF2E7D9A},
                      {0xFFF3F5F8, 0xFFFFFFFF, 0xFF1B2430, 0xFF5B6B7F, 0xFF0277BD, 0xFFDCE3EA, 0xFF7FBDE6},
                      {0xFF0E1512, 0xFF17231D, 0xFFE6F2EA, 0xFF86A394, 0xFF4ADE80, 0xFF22352B, 0xFF2F8F5B},
                      {0xFF15110C, 0xFF211A12, 0xFFF5ECE0, 0xFFA8967F, 0xFFFFB74D, 0xFF33291D, 0xFFB9741F},
                      {0xFF000000, 0xFF0D0D0D, 0xFFFFFFFF, 0xFF8A8A8A, 0xFF22D3EE, 0xFF1C1C1C, 0xFF0E7490}};

              void applyScheme(int i) {
                  if (i < 0 || i >= SCHEMES.length) i = 0;
                  int[] c = SCHEMES[i];
                  BG = c[0];
                  CARD = c[1];
                  TXT = c[2];
                  DIM = c[3];
                  ACC = c[4];
                  BTN = c[5];
                  TABON = c[6];
              }

              void paint(View v, int color) {
                  GradientDrawable g = new GradientDrawable();
                  g.setColor(color);
                  g.setCornerRadius(dp(12));
                  v.setBackground(g);
              }

              final Handler ui = new Handler(Looper.getMainLooper());
              final Rep rep = new Rep();
              final LinkedBlockingQueue<Runnable> queue = new LinkedBlockingQueue<Runnable>();
              SharedPreferences prefs;
              Elm elm;
              volatile boolean connected, wantConn, running = true;
              volatile Set<String> supported = new HashSet<String>();
              final Set<String> enabled = new HashSet<String>();
              final List<String> graphPids = new ArrayList<String>();
              long lastTry;
              boolean btMode;
              List<BluetoothDevice> devs = new ArrayList<BluetoothDevice>();

              TextView connLog;
              ScrollView connLogSv;
              Button indBtn, arrowBtn;
              LinearLayout rightCol;
              boolean connOpen = false;
              ConnPanel pTop;
              boolean topShown = true;
              final List<String> clines = new ArrayList<String>();
              String lastStatus = "";
              final boolean[] win = new boolean[40];
              int wn = 0, wi = 0;

              synchronized void qrec(boolean ok) {
                  win[wi] = ok;
                  wi = (wi + 1) % win.length;
                  if (wn < win.length) wn++;
              }

              synchronized int quality() {
                  if (wn < 5) return -1;
                  int c = 0;
                  for (int i = 0; i < wn; i++) if (win[i]) c++;
                  return c * 100 / wn;
              }

              synchronized void qreset() {
                  wn = 0;
                  wi = 0;
              }

              /** Один набір елементів підключення (є зверху і у вкладці «Сервіс»). */
              class ConnPanel {
                  final LinearLayout root = new LinearLayout(MainActivity.this);
                  final RadioButton wifi = new RadioButton(MainActivity.this);
                  final RadioButton bt = new RadioButton(MainActivity.this);
                  final EditText host = new EditText(MainActivity.this);
                  final EditText port = new EditText(MainActivity.this);
                  final Spinner spin = new Spinner(MainActivity.this);
                  final Button btn = btn("Підключитись");

                  ConnPanel() {
                      root.setOrientation(LinearLayout.VERTICAL);
                      RadioGroup rg = new RadioGroup(MainActivity.this);
                      rg.setOrientation(LinearLayout.HORIZONTAL);
                      wifi.setText("Wi-Fi");
                      wifi.setTextColor(TXT);
                      bt.setText("Bluetooth");
                      bt.setTextColor(TXT);
                      rg.addView(wifi);
                      rg.addView(bt);
                      root.addView(rg);
                      (btMode ? bt : wifi).setChecked(true);
                      LinearLayout hp = new LinearLayout(MainActivity.this);
                      host.setText(prefs.getString("host", "192.168.0.10"));
                      host.setTextColor(TXT);
                      host.setSingleLine(true);
                      port.setText(prefs.getString("port", "35000"));
                      port.setTextColor(TXT);
                      port.setSingleLine(true);
                      hp.addView(host, new LinearLayout.LayoutParams(0, -2, 2));
                      hp.addView(port, new LinearLayout.LayoutParams(0, -2, 1));
                      root.addView(hp);
                      root.addView(spin);
                      btn.setOnClickListener(v -> {
                          if (wantConn) stopConnect();
                          else startConnect();
                      });
                      root.addView(btn, bl());
                  }
              }

              void setConnText(String t) {
                  pTop.btn.setText(t);
                  pTop.btn.setText(t);
              }

              void clog(final String msg) {
                  ui.post(() -> {
                      if (msg.equals(lastStatus)) return;
                      lastStatus = msg;
                      clines.add(new java.text.SimpleDateFormat("HH:mm:ss", java.util.Locale.US).format(new java.util.Date()) + "  " + msg);
                      while (clines.size() > 60) clines.remove(0);
                      connLog.setText(join(clines, "\n"));
                      connLogSv.post(() -> connLogSv.fullScroll(View.FOCUS_DOWN));
                  });
              }

              void setTop(boolean show) {
                  topShown = show;
                  applyTop();
              }

              void applyTop() {
                  connLogSv.setVisibility(topShown ? View.VISIBLE : View.GONE);
                  arrowBtn.setVisibility(topShown ? View.VISIBLE : View.GONE);
                  arrowBtn.setText(connOpen ? "▴" : "▾");
                  pTop.root.setVisibility(topShown && connOpen ? View.VISIBLE : View.GONE);
                  LinearLayout.LayoutParams lp = (LinearLayout.LayoutParams) rightCol.getLayoutParams();
                  lp.width = topShown ? dp(150) : -1;
                  rightCol.setLayoutParams(lp);
                  LinearLayout.LayoutParams ip = (LinearLayout.LayoutParams) indBtn.getLayoutParams();
                  ip.height = topShown ? dp(60) : dp(44);
                  indBtn.setLayoutParams(ip);
              }

              void tickInd() {
                  int q = quality();
                  String t;
                  int col;
                  if (!wantConn && !connected) {
                      t = "● Не підключено";
                      col = 0xFF546E7A;
                  } else if (!connected) {
                      t = "● Немає зв'язку";
                      col = 0xFFC62828;
                  } else if (supported.isEmpty()) {
                      t = "● ЕБУ мовчить";
                      col = 0xFFEF6C00;
                  } else if (q < 0) {
                      t = "● Зв'язок …";
                      col = 0xFF2E7D32;
                  } else {
                      t = "● Зв'язок " + q + "%";
                      col = q >= 85 ? 0xFF2E7D32 : q >= 50 ? 0xFFEF6C00 : 0xFFC62828;
                  }
                  indBtn.setText(t);
                  paint(indBtn, col);
                  ui.postDelayed(this::tickInd, 1000);
              }

              static final String[][] MODS = {{"7E0", "Двигун (ECM)"}, {"7E1", "Коробка (TCM)"}, {"760", "ABS"},
                      {"720", "Панель приладів"}, {"726", "Кузовний блок (BCM)"}, {"730", "Підсилювач керма"},
                      {"733", "Клімат"}, {"736", "Парктронік"}, {"737", "Подушки безпеки"}};

              void scanModules() throws IOException {
                  if (!elm.can) {
                      clog("Інші блоки: пропущено (протокол не CAN)");
                      return;
                  }
                  clog("Сканую інші блоки (типові адреси Ford)…");
                  List<String> ok = new ArrayList<String>();
                  try {
                      for (String[] m : MODS) {
                          if (!connected) return;
                          elm.send("ATSH" + m[0], 1000);
                          String r = elm.send("3E00", 1200).toUpperCase().replace(" ", "");
                          boolean yes = false;
                          for (String line : r.split("\n")) {
                              if (line.startsWith("7E00") || line.startsWith("7F3E")) yes = true;
                          }
                          clog(m[1] + " [" + m[0] + "]: " + (yes ? "відповідає ✓" : "немає відповіді"));
                          if (yes) ok.add(m[1]);
                      }
                  } finally {
                      try {
                          elm.send("ATSH7DF", 1000);
                      } catch (IOException ignored) {
                      }
                  }
                  rep.event("Блоки: " + (ok.isEmpty() ? "жодного" : join(ok, ", ")));
              }

              static String join(List<String> l, String sep) {
                  StringBuilder b = new StringBuilder();
                  for (String x : l) {
                      if (b.length() > 0) b.append(sep);
                      b.append(x);
                  }
                  return b.toString();
              }
              Button recBtn;
              long recStartMs;
              int failStreak = 0;
              FrameLayout content;
              View[] tabs = new View[5];
              TextView[] tabBtns = new TextView[5];
              View[] tabLines = new View[5];
              final Map<String, TextView> valViews = new HashMap<String, TextView>();
              final Map<String, CheckBox> checks = new HashMap<String, CheckBox>();
              final Map<String, TextView> nameViews = new HashMap<String, TextView>();
              GraphView graph;
              LinearLayout dtcList;
              TextView dtcInfo;
              EditText markEt;
              int curTab = 0;

              int dp(int v) {
                  return (int) (v * getResources().getDisplayMetrics().density + 0.5f);
              }

              // ================= UI =================

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  CrashGuard.install(this);
                  String crash = CrashGuard.take(this);
                  if (crash != null) {
                      CrashGuard.show(this, crash);
                      return;
                  }
                  prefs = getSharedPreferences("diag", MODE_PRIVATE);
                  applyScheme(prefs.getInt("scheme", 0));
                  getWindow().setSoftInputMode(android.view.WindowManager.LayoutParams.SOFT_INPUT_STATE_ALWAYS_HIDDEN);
                  rep.openCsv(getExternalFilesDir(null) != null ? getExternalFilesDir(null) : getFilesDir());
                  String en = prefs.getString("enabled", null);
                  if (en == null) {
                      for (Pids.Def d : Pids.ALL) if (d.on) enabled.add(d.pid);
                  } else {
                      for (String s : en.split(",")) if (!s.isEmpty()) enabled.add(s);
                  }
                  String gp = prefs.getString("graph", "010C,010D");
                  for (String s : gp.split(",")) if (!s.isEmpty() && graphPids.size() < 3) graphPids.add(s);
                  btMode = prefs.getBoolean("bt", false);

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setBackgroundColor(BG);
                  root.setPadding(dp(8), dp(6), dp(8), dp(6));

                  pTop = new ConnPanel();
                  loadBt();

                  LinearLayout head = new LinearLayout(this);
                  head.setOrientation(LinearLayout.HORIZONTAL);
                  connLogSv = new ScrollView(this);
                  paint(connLogSv, CARD);
                  connLog = text("Не підключено", 13, DIM);
                  connLog.setPadding(dp(6), dp(4), dp(6), dp(4));
                  connLogSv.addView(connLog);
                  head.addView(connLogSv, new LinearLayout.LayoutParams(0, dp(96), 1));
                  rightCol = new LinearLayout(this);
                  rightCol.setOrientation(LinearLayout.VERTICAL);
                  indBtn = btn("● …");
                  indBtn.setTextSize(16);
                  indBtn.setTextColor(0xFFFFFFFF);
                  indBtn.setOnClickListener(v -> setTop(!topShown));
                  rightCol.addView(indBtn, new LinearLayout.LayoutParams(-1, dp(60)));
                  arrowBtn = btn("▾");
                  arrowBtn.setTextSize(16);
                  arrowBtn.setMinHeight(0);
                  arrowBtn.setMinimumHeight(0);
                  arrowBtn.setPadding(0, 0, 0, 0);
                  arrowBtn.setOnClickListener(v -> {
                      connOpen = !connOpen;
                      applyTop();
                  });
                  LinearLayout.LayoutParams alp = new LinearLayout.LayoutParams(-1, dp(32));
                  alp.setMargins(0, dp(4), 0, 0);
                  rightCol.addView(arrowBtn, alp);
                  LinearLayout.LayoutParams rcp = new LinearLayout.LayoutParams(dp(150), -2);
                  rcp.setMargins(dp(6), 0, 0, 0);
                  head.addView(rightCol, rcp);
                  root.addView(head);
                  root.addView(pTop.root);

                  LinearLayout bar = new LinearLayout(this);
                  bar.setOrientation(LinearLayout.VERTICAL);
                  LinearLayout[] rows = {new LinearLayout(this), new LinearLayout(this)};
                  String[] names = {"Дані", "Графіки", "Помилки", "Сервіс", "Лог"};
                  for (int i = 0; i < 5; i++) {
                      final int idx = i;
                      LinearLayout cell = new LinearLayout(this);
                      cell.setOrientation(LinearLayout.VERTICAL);
                      TextView t = text(names[i], 18, DIM);
                      t.setGravity(Gravity.CENTER);
                      t.setSingleLine(true);
                      t.setPadding(0, dp(10), 0, dp(8));
                      View line = new View(this);
                      cell.addView(t, bl());
                      LinearLayout.LayoutParams ll = new LinearLayout.LayoutParams(-1, dp(3));
                      ll.setMargins(dp(14), 0, dp(14), 0);
                      cell.addView(line, ll);
                      cell.setOnClickListener(v -> {
                          showTab(idx);
                          setTop(false);
                      });
                      rows[i < 3 ? 0 : 1].addView(cell, new LinearLayout.LayoutParams(0, -2, 1));
                      tabBtns[i] = t;
                      tabLines[i] = line;
                  }
                  bar.addView(rows[0]);
                  bar.addView(rows[1]);
                  root.addView(bar);
                  content = new FrameLayout(this);
                  root.addView(content, new LinearLayout.LayoutParams(-1, 0, 1));

                  tabs[0] = buildData();
                  tabs[1] = buildGraph();
                  tabs[2] = buildDtc();
                  tabs[3] = buildSvc();
                  tabs[4] = buildLog();
                  for (View v : tabs) content.addView(v, new FrameLayout.LayoutParams(-1, -1));
                  setContentView(root);
                  showTab(4);
                  root.setFocusableInTouchMode(true);
                  root.requestFocus();
                  applyTop();
                  tickInd();

                  new Thread(this::worker, "elm-worker").start();
                  if (prefs.getBoolean("auto", false)) startConnect();
              }

              TextView text(String s, int sp, int color) {
                  TextView t = new TextView(this);
                  t.setText(s);
                  t.setTextSize(sp);
                  t.setTextColor(color);
                  return t;
              }

              Button btn(String s) {
                  Button b = new Button(this);
                  b.setText(s);
                  b.setAllCaps(false);
                  b.setTextColor(TXT);
                  paint(b, BTN);
                  b.setTextSize(15);
                  b.setMinHeight(dp(44));
                  b.setMinimumHeight(dp(44));
                  b.setPadding(dp(12), dp(6), dp(12), dp(6));
                  return b;
              }

              static final String[] REC_PIDS = {"010C", "010D", "014A", "0111", "010B", "0110", "0104", "0123",
                      "0105", "010F", "012C", "012D", "0145", "014C", "0133"};

              void toggleRec() {
                  if (!rep.recording) {
                      if (!connected) {
                          toast("Спочатку підключись (кнопка зв'язку вгорі)");
                          return;
                      }
                      Set<String> sup = supported;
                      List<String> cols = new ArrayList<String>();
                      for (String p : REC_PIDS) {
                          if (sup.isEmpty() || sup.contains(p)) {
                              enabled.add(p);
                              CheckBox cb = checks.get(p);
                              if (cb != null) cb.setChecked(true);
                              cols.add(p);
                          }
                      }
                      savePrefs();
                      rep.recStart(cols);
                      recStartMs = System.currentTimeMillis();
                      paint(recBtn, 0xFF455A64);
                      tickRec();
                  } else {
                      String rpt = rep.recStop();
                      recBtn.setText("● Почати запис");
                      paint(recBtn, 0xFF2E7D32);
                      ClipboardManager cm = (ClipboardManager) getSystemService(Context.CLIPBOARD_SERVICE);
                      cm.setPrimaryClip(ClipData.newPlainText("diag", rpt));
                      try {
                          java.io.File dir = getExternalFilesDir(null) != null ? getExternalFilesDir(null) : getFilesDir();
                          java.io.File f = new java.io.File(dir, "rec_" + new java.text.SimpleDateFormat("yyyyMMdd_HHmmss",
                                  java.util.Locale.US).format(new java.util.Date()) + ".txt");
                          java.io.FileWriter w = new java.io.FileWriter(f);
                          w.write(rpt);
                          w.close();
                      } catch (Throwable ignored) {
                      }
                      new AlertDialog.Builder(this)
                              .setTitle("Запис завершено")
                              .setMessage("Звіт скопійовано в буфер обміну (" + rpt.length() + " символів). Встав його в чат.")
                              .setPositiveButton("Ок", null)
                              .setNeutralButton("Поділитись", (d, w) -> {
                                  Intent i = new Intent(Intent.ACTION_SEND);
                                  i.setType("text/plain");
                                  i.putExtra(Intent.EXTRA_TEXT, rpt);
                                  startActivity(Intent.createChooser(i, "Звіт"));
                              })
                              .show();
                  }
              }

              void tickRec() {
                  if (!rep.recording) return;
                  long s = (System.currentTimeMillis() - recStartMs) / 1000;
                  recBtn.setText(String.format(java.util.Locale.US, "■ Закінчити запис  %d:%02d", s / 60, s % 60));
                  ui.postDelayed(this::tickRec, 1000);
              }

              void showTab(int i) {
                  curTab = i;
                  for (int k = 0; k < 5; k++) {
                      tabs[k].setVisibility(k == i ? View.VISIBLE : View.GONE);
                      tabBtns[k].setTextColor(k == i ? ACC : DIM);
                      tabBtns[k].setTypeface(k == i ? Typeface.DEFAULT_BOLD : Typeface.DEFAULT);
                      GradientDrawable ln = new GradientDrawable();
                      ln.setColor(k == i ? ACC : 0x00000000);
                      ln.setCornerRadius(dp(2));
                      tabLines[k].setBackground(ln);
                  }
                  if (i == 1) refreshGraph();
              }

              View buildData() {
                  ScrollView sv = new ScrollView(this);
                  LinearLayout col = new LinearLayout(this);
                  col.setOrientation(LinearLayout.VERTICAL);
                  sv.addView(col);
                  TextView hint = text("Галочка — опитувати параметр. Кнопка «📈» — додати на графік (до 3).", 13, DIM);
                  hint.setPadding(dp(4), dp(6), dp(4), dp(6));
                  col.addView(hint);
                  for (final Pids.Def d : Pids.ALL) {
                      LinearLayout row = new LinearLayout(this);
                      row.setOrientation(LinearLayout.HORIZONTAL);
                      row.setGravity(Gravity.CENTER_VERTICAL);
                      paint(row, CARD);
                      row.setPadding(dp(6), dp(4), dp(6), dp(4));
                      CheckBox cb = new CheckBox(this);
                      cb.setChecked(enabled.contains(d.pid));
                      cb.setOnCheckedChangeListener((v, on) -> {
                          if (on) enabled.add(d.pid);
                          else enabled.remove(d.pid);
                          savePrefs();
                      });
                      checks.put(d.pid, cb);
                      row.addView(cb);
                      TextView name = text(d.name + "  (" + d.pid.substring(2) + ")", 16, TXT);
                      nameViews.put(d.pid, name);
                      row.addView(name, new LinearLayout.LayoutParams(0, -2, 1));
                      TextView val = text("—", 22, ACC);
                      val.setTypeface(Typeface.MONOSPACE, Typeface.BOLD);
                      val.setGravity(Gravity.END);
                      valViews.put(d.pid, val);
                      row.addView(val, new LinearLayout.LayoutParams(dp(110), -2));
                      TextView unit = text(d.unit, 13, DIM);
                      row.addView(unit, new LinearLayout.LayoutParams(dp(56), -2));
                      Button g = btn("📈");
                      g.setOnClickListener(v -> toggleGraph(d.pid));
                      row.addView(g, new LinearLayout.LayoutParams(dp(54), dp(40)));
                      LinearLayout.LayoutParams lp = bl();
                      lp.setMargins(0, 0, 0, dp(2));
                      col.addView(row, lp);
                  }
                  return sv;
              }

              void toggleGraph(String pid) {
                  if (graphPids.contains(pid)) graphPids.remove(pid);
                  else {
                      if (graphPids.size() >= 3) graphPids.remove(0);
                      graphPids.add(pid);
                  }
                  savePrefs();
                  Toast.makeText(this, "На графіку: " + graphPids.size() + " з 3", Toast.LENGTH_SHORT).show();
              }

              View buildGraph() {
                  LinearLayout col = new LinearLayout(this);
                  col.setOrientation(LinearLayout.VERTICAL);
                  LinearLayout row = new LinearLayout(this);
                  String[] lab = {"30 с", "2 хв", "10 хв"};
                  final long[] win = {30000, 120000, 600000};
                  for (int i = 0; i < 3; i++) {
                      final int k = i;
