                      }
                  });
              }

              /** Байти відповіді після заголовка (напр. "490201"); склеює кадри ISO-TP. */
              static int[] after(String resp, String head) {
                  if (resp == null) return null;
                  StringBuilder sb = new StringBuilder();
                  for (String line : resp.split("\n")) {
                      String l = line.replace(" ", "").toUpperCase(java.util.Locale.US);
                      if (l.matches("^[0-9A-F]:.*")) l = l.substring(2);
                      else if (l.matches("^[0-9A-F]{3}$")) continue;
                      sb.append(l);
                  }
                  String all = sb.toString();
                  int i = all.indexOf(head);
                  if (i < 0) return null;
                  all = all.substring(i + head.length());
                  int n = all.length() / 2;
                  int[] r = new int[n];
                  try {
                      for (int k = 0; k < n; k++) r[k] = Integer.parseInt(all.substring(2 * k, 2 * k + 2), 16);
                  } catch (NumberFormatException e) {
                      return null;
                  }
                  return r;
              }

              static String hx(int[] d) {
                  StringBuilder b = new StringBuilder();
                  for (int x : d) b.append(String.format("%02X ", x));
                  return b.toString().trim();
              }

              static String ascii(int[] d) {
                  StringBuilder b = new StringBuilder();
                  for (int x : d) b.append(x >= 32 && x < 127 ? (char) x : ' ');
                  return b.toString().replaceAll("\\s+", " ").trim();
              }

              String svcInfo() throws IOException {
                  StringBuilder b = new StringBuilder();
                  int[] d = after(elm.send("0902", 4000), "490201");
                  b.append("VIN: ").append(d == null ? "немає відповіді" : ascii(d)).append('\n');
                  d = after(elm.send("0904", 4000), "4904");
                  b.append("Версія калібрування: ").append(d == null ? "немає відповіді" : ascii(d)).append('\n');
                  d = after(elm.send("0906", 4000), "4906");
                  b.append("CVN: ").append(d == null ? "немає відповіді" : hx(d)).append('\n');
                  d = after(elm.send("090A", 4000), "490A");
                  b.append("Ім'я ЕБУ: ").append(d == null ? "немає відповіді" : ascii(d)).append('\n');
                  return b.toString();
              }

              String svcFreeze() throws IOException {
                  int[] d = after(elm.send("0202", 4000), "4202");
                  if (d == null || d.length < 3) return "Заморожених кадрів немає (або ЕБУ не підтримує режим 02).";
                  if (d[1] == 0 && d[2] == 0) return "Заморожений кадр порожній (помилок, що його викликали, немає).";
                  String[] L = {"P", "C", "B", "U"};
                  String code = String.format("%s%d%X%02X", L[(d[1] >> 6) & 3], (d[1] >> 4) & 3, d[1] & 15, d[2]);
                  StringBuilder b = new StringBuilder();
                  b.append("Помилка, що викликала кадр: ").append(code).append(" — ").append(Dtc.describe(code)).append('\n');
                  for (String pid : REC_PIDS) {
                      String sfx = pid.substring(2);
                      int[] v = after(elm.send("02" + sfx + "00", 2500), "42" + sfx + "00");
                      if (v == null || v.length < Pids.minBytes(pid)) continue;
                      Pids.Def df = Pids.find(pid);
                      b.append(df.name).append(": ").append(Pids.fmt(pid, Pids.decode(pid, v))).append(' ').append(df.unit).append('\n');
                  }
                  return b.toString();
              }

              String svcMode06() throws IOException {
                  List<Integer> mids = new ArrayList<Integer>();
                  for (int base = 0; base <= 0xE0; base += 0x20) {
                      int[] d = after(elm.send(String.format("06%02X", base), 4000), String.format("46%02X", base));
                      if (d == null || d.length < 4) break;
                      long mask = 0;
                      for (int k = 0; k < 4; k++) mask = (mask << 8) | d[k];
                      for (int bit = 0; bit < 32; bit++) {
                          int m = base + bit + 1;
                          if ((mask & (1L << (31 - bit))) != 0 && m % 0x20 != 0) mids.add(m);
                      }
                      if ((mask & 1L) == 0) break;
                  }
                  if (mids.isEmpty()) return "ЕБУ не віддає результати самотестів (режим 06).";
                  StringBuilder b = new StringBuilder("Значення сирі (без перерахунку). ✗ = поза межами.\n");
                  int n = 0;
                  for (int m : mids) {
                      if (++n > 40) break;
                      int[] d = after(elm.send(String.format("06%02X", m), 4000), String.format("46%02X", m));
                      if (d == null) {
                          b.append(String.format("MID %02X: немає даних\n", m));
                          continue;
                      }
                      for (int i = 0; i + 8 <= d.length; i += 8) {
                          int val = d[i + 2] * 256 + d[i + 3];
                          int mn = d[i + 4] * 256 + d[i + 5];
                          int mx = d[i + 6] * 256 + d[i + 7];
                          boolean bad = val < mn || val > mx;
                          b.append(String.format("MID %02X TID %02X: %d  [%d…%d] %s\n", m, d[i], val, mn, mx, bad ? "✗" : "ok"));
                      }
                  }
                  return b.toString();
              }

              static final String[][] EXT = {
                      {"0178", "Темп. вихлопу, блок 1 (EGT)"}, {"0179", "Темп. вихлопу, блок 2"},
                      {"017A", "DPF блок 1 (тиски)"}, {"017B", "DPF блок 2"}, {"017C", "Температура DPF"},
                      {"0169", "EGR: команда і похибка"}, {"016A", "Повітря/положення EGR"}, {"016B", "Температура EGR"},
                      {"016F", "Тиск на вході компресора"}, {"0170", "Керування наддувом"}, {"0171", "Керування VGT"},
                      {"0172", "Вестгейт"}, {"0173", "Тиск вихлопу"}, {"0174", "Оберти турбіни"},
                      {"0175", "Темп. турбіни A"}, {"0177", "Темп. наддувного повітря"}};

              String svcExt() throws IOException {
                  StringBuilder b = new StringBuilder("Сирі байти; розшифровку температур дано за стандартом J1979.\n");
                  Set<String> sup = supported;
                  for (String[] e : EXT) {
                      if (!sup.isEmpty() && !sup.contains(e[0])) {
                          b.append(e[1]).append(": ЕБУ не підтримує\n");
                          continue;
                      }
                      int[] d = Pids.parsePid(elm.send(e[0], 3000), e[0]);
                      if (d == null) {
                          b.append(e[1]).append(": немає даних\n");
                          continue;
                      }
                      b.append(e[1]).append(": ").append(hx(d));
                      if ((e[0].equals("0178") || e[0].equals("0179") || e[0].equals("017C")) && d.length >= 5) {
                          b.append("  →");
                          for (int k = 0; k < 4 && 2 * k + 2 < d.length; k++) {
                              if (e[0].equals("017C") || (d[0] & (1 << k)) != 0 && k < 2) {
                                  b.append(String.format(" %.1f°C", (d[1 + 2 * k] * 256 + d[2 + 2 * k]) / 10.0 - 40));
                              }
                          }
                      }
                      b.append('\n');
                  }
                  return b.toString();
              }

