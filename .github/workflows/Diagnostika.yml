          cat > app/src/main/java/com/example/diagnostics/GraphView.java <<'EOF'
          package com.example.diagnostics;

          import android.content.Context;
          import android.graphics.Canvas;
          import android.graphics.Color;
          import android.graphics.Paint;
          import android.graphics.Path;
          import android.view.View;

          import java.util.ArrayList;
          import java.util.List;
          import java.util.Locale;

          /** Графік до 3 PID, у кожного власна шкала. */
          final class GraphView extends View {
              static final int[] COLORS = {0xFF4FC3F7, 0xFFFFB74D, 0xFF81C784};
              Rep rep;
              final List<String> pids = new ArrayList<String>();
              long windowMs = 60000;
              private final Paint p = new Paint(Paint.ANTI_ALIAS_FLAG);

              GraphView(Context c) {
                  super(c);
                  setBackgroundColor(0xFF0B0F12);
              }

              @Override
              protected void onDraw(Canvas cv) {
                  float w = getWidth(), h = getHeight();
                  float d = getResources().getDisplayMetrics().density;
                  float legendH = 22 * d * Math.max(1, pids.size());
                  float top = legendH + 6 * d, bottom = h - 18 * d, left = 6 * d, right = w - 6 * d;
                  p.setStyle(Paint.Style.STROKE);
                  p.setStrokeWidth(1);
                  p.setColor(0xFF2A3238);
                  for (int i = 0; i <= 4; i++) {
                      float y = top + (bottom - top) * i / 4f;
                      cv.drawLine(left, y, right, y, p);
                  }
                  for (int i = 0; i <= 4; i++) {
                      float x = left + (right - left) * i / 4f;
                      cv.drawLine(x, top, x, bottom, p);
                  }
                  p.setStyle(Paint.Style.FILL);
                  p.setTextSize(11 * d);
                  p.setColor(0xFF8899A6);
                  cv.drawText("−" + (windowMs / 1000) + " с", left, h - 4 * d, p);
                  cv.drawText("зараз", right - 30 * d, h - 4 * d, p);
                  if (rep == null) return;
                  long now = System.currentTimeMillis();
                  long since = now - windowMs;
                  for (int si = 0; si < pids.size(); si++) {
                      String pid = pids.get(si);
                      int col = COLORS[si % COLORS.length];
                      List<Long> ts = new ArrayList<Long>();
                      List<Double> vs = rep.values(pid, since, ts);
                      Pids.Def def = Pids.find(pid);
                      String name = def != null ? def.name + ", " + def.unit : pid;
                      p.setStyle(Paint.Style.FILL);
                      p.setColor(col);
                      p.setTextSize(15 * d);
                      float ty = 18 * d * (si + 1) + 2 * d * si;
                      if (vs.isEmpty()) {
                          cv.drawText(name + ": немає даних", left, ty, p);
                          continue;
                      }
                      double mn = Double.MAX_VALUE, mx = -Double.MAX_VALUE;
                      for (double v : vs) {
                          if (v < mn) mn = v;
                          if (v > mx) mx = v;
                      }
                      double span = mx - mn;
                      if (span < 1e-9) {
                          mn -= 1;
                          mx += 1;
                          span = 2;
                      }
                      double pad = span * 0.08;
                      mn -= pad;
                      mx += pad;
                      double last = vs.get(vs.size() - 1);
                      cv.drawText(String.format(Locale.US, "%s: %s  [%s … %s]", name, Pids.fmt(pid, last),
                              Pids.fmt(pid, mn + pad), Pids.fmt(pid, mx - pad)), left, ty, p);
                      Path path = new Path();
                      for (int i = 0; i < vs.size(); i++) {
                          float x = left + (right - left) * (ts.get(i) - since) / (float) windowMs;
                          float y = (float) (bottom - (bottom - top) * (vs.get(i) - mn) / (mx - mn));
                          if (i == 0) path.moveTo(x, y);
                          else path.lineTo(x, y);
                      }
                      p.setStyle(Paint.Style.STROKE);
                      p.setStrokeWidth(2.2f * d);
                      cv.drawPath(path, p);
                  }
              }
          }
          EOF

