name: Diagnostika

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/Diagnostika.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Write project
        run: |
          mkdir -p app/src/main/java/com/example/diagnostics

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'Diagnostika'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=false
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.example.diagnostics2'
              compileSdk 34
              defaultConfig {
                  applicationId "com.example.diagnostics2"
                  minSdk 23
                  targetSdk 26
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
              lint {
                  abortOnError false
                  checkReleaseBuilds false
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="Калькулятор 2"
                  android:icon="@drawable/ic_launcher"
                  android:allowBackup="false"
                  android:theme="@android:style/Theme.DeviceDefault">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/example/diagnostics/MainActivity.java <<'EOF'
          package com.example.diagnostics;

          import android.app.Activity;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.os.Bundle;
          import android.view.Gravity;
          import android.view.View;
          import android.widget.Button;
          import android.widget.GridLayout;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          public class MainActivity extends Activity {
              private TextView display;
              private double firstNum = 0;
              private String operation = "";
              private boolean isNewOp = true;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setBackgroundColor(0xFF121212);
                  root.setPadding(24, 48, 24, 24);

                  display = new TextView(this);
                  display.setText("0");
                  display.setTextSize(48);
                  display.setTextColor(Color.WHITE);
                  display.setGravity(Gravity.END | Gravity.CENTER_VERTICAL);
                  display.setPadding(24, 24, 24, 24);
                  display.setTypeface(Typeface.DEFAULT_BOLD);
                  root.addView(display, new LinearLayout.LayoutParams(-1, 0, 1));

                  GridLayout grid = new GridLayout(this);
                  grid.setColumnCount(4);
                  grid.setRowCount(5);

                  String[] buttons = {
                      "C", "⌫", "%", "/",
                      "7", "8", "9", "*",
                      "4", "5", "6", "-",
                      "1", "2", "3", "+",
                      "0", ".", "=", ""
                  };

                  for (String text : buttons) {
                      if (text.isEmpty()) continue;

                      Button btn = new Button(this);
                      btn.setText(text);
                      btn.setTextSize(24);
                      btn.setTextColor(Color.WHITE);

                      if ("/*-+=".contains(text)) {
                          btn.setBackgroundColor(0xFFFF9800);
                      } else if ("C⌫%".contains(text)) {
                          btn.setBackgroundColor(0xFF757575);
                      } else {
                          btn.setBackgroundColor(0xFF424242);
                      }

                      btn.setOnClickListener(this::onButtonClick);

                      GridLayout.LayoutParams params = new GridLayout.LayoutParams();
                      params.width = 0;
                      params.height = 0;
                      params.columnSpec = GridLayout.spec(GridLayout.UNDEFINED, 1f);
                      params.rowSpec = GridLayout.spec(GridLayout.UNDEFINED, 1f);
                      params.setMargins(8, 8, 8, 8);

                      if (text.equals("0")) {
                          params.columnSpec = GridLayout.spec(GridLayout.UNDEFINED, 2, 2f);
                      }

                      grid.addView(btn, params);
                  }

                  root.addView(grid, new LinearLayout.LayoutParams(-1, 0, 3));
                  setContentView(root);
              }

              private void onButtonClick(View view) {
                  Button b = (Button) view;
                  String txt = b.getText().toString();

                  if ("0123456789".contains(txt)) {
                      if (isNewOp || display.getText().toString().equals("0")) {
                          display.setText(txt);
                      } else {
                          display.append(txt);
                      }
                      isNewOp = false;
                  } else if (txt.equals(".")) {
                      if (isNewOp) {
                          display.setText("0.");
                          isNewOp = false;
                      } else if (!display.getText().toString().contains(".")) {
                          display.append(".");
                      }
                  } else if (txt.equals("C")) {
                      display.setText("0");
                      firstNum = 0;
                      operation = "";
                      isNewOp = true;
                  } else if (txt.equals("⌫")) {
                      String s = display.getText().toString();
                      if (s.length() > 1) {
                          display.setText(s.substring(0, s.length() - 1));
                      } else {
                          display.setText("0");
                          isNewOp = true;
                      }
                  } else if ("/*-+".contains(txt)) {
                      firstNum = Double.parseDouble(display.getText().toString());
                      operation = txt;
                      isNewOp = true;
                  } else if (txt.equals("=")) {
                      if (!operation.isEmpty()) {
                          double secondNum = Double.parseDouble(display.getText().toString());
                          double res = 0;
                          switch (operation) {
                              case "+": res = firstNum + secondNum; break;
                              case "-": res = firstNum - secondNum; break;
                              case "*": res = firstNum * secondNum; break;
                              case "/": res = secondNum != 0 ? firstNum / secondNum : 0; break;
                          }
                          if (res == (long) res) {
                              display.setText(String.format("%d", (long) res));
                          } else {
                              display.setText(String.valueOf(res));
                          }
                          operation = "";
                          isNewOp = true;
                      }
                  }
              }
          }
          EOF

          mkdir -p app/src/main/res/drawable
          cat > app/src/main/res/drawable/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/android"
              android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#121212" android:pathData="M54,4 a50,50 0 1,0 0.01,0 z"/>
              <path android:fillColor="#FF9800" android:pathData="M30,35 h48 v8 h-48 z M30,65 h48 v8 h-48 z M50,45 h8 v48 h-8 z"/>
          </vector>
          EOF

      - name: Build
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: Diagnostika
          path: app/build/outputs/apk/debug/app-debug.apk
