              static String join(java.util.Collection<String> c) {
                  StringBuilder b = new StringBuilder();
                  for (String s : c) {
                      if (b.length() > 0) b.append(',');
                      b.append(s);
                  }
                  return b.toString();
              }

              // ================= Підключення =================

              void startConnect() {
                  btMode = pTop.bt.isChecked();
                  prefs.edit().putBoolean("bt", btMode).putString("host", pTop.host.getText().toString().trim())
                          .putString("port", pTop.port.getText().toString().trim()).apply();
                  wantConn = true;
                  lastTry = 0;
                  setConnText("Відключитись");
                  setStatus("Підключення…", DIM);
              }

              void stopConnect() {
                  wantConn = false;
                  prefs.edit().putBoolean("auto", false).apply();
                  queue.add(() -> {
                      closeElm();
                      setStatus("Відключено", DIM);
                  });
                  setConnText("Підключитись");
              }

              void closeElm() {
                  connected = false;
                  if (elm != null) elm.close();
                  elm = null;
              }

              void lost(Exception e) {
                  rep.event("Втрата зв'язку: " + e);
                  closeElm();
                  lastTry = System.currentTimeMillis();
                  qreset();
                  setStatus("Зв'язок втрачено, повтор…", RED);
                  ui.post(() -> setTop(true));
              }

              void doConnect() {
                  lastTry = System.currentTimeMillis();
                  try {
                      setStatus("Підключення…", DIM);
                      Elm e = new Elm();
                      if (btMode) {
                          int i = pTop.spin.getSelectedItemPosition();
                          if (i < 0 || i >= devs.size())
                              throw new IOException("Не вибрано Bluetooth-адаптер (спочатку спаруй його в налаштуваннях)");
                          BluetoothDevice d = devs.get(i);
                          prefs.edit().putString("btaddr", d.getAddress()).apply();
                          e.connectBt(d);
                      } else {
                          e.connectWifi(this, prefs.getString("host", "192.168.0.10"),
                                  Integer.parseInt(prefs.getString("port", "35000").trim()));
                      }
                      clog((btMode ? "Bluetooth: з'єднано" : "Wi-Fi: з'єднано з " + prefs.getString("host", "") + ":" + prefs.getString("port", "")));
                      elm = e;
                      clog("Ініціалізація ELM327…");
                      e.init();
                      clog("ELM327: " + e.version);
                      clog("Протокол: " + e.proto + ",  живлення " + e.volts);
                      rep.initInfo = e.version + " | " + e.proto + " | " + e.volts;
                      rep.event("ELM: " + rep.initInfo);
                      qreset();
                      connected = true;
                      prefs.edit().putBoolean("auto", true).apply();
                      doScan();
                  } catch (Exception ex) {
                      rep.event("Помилка підключення: " + ex);
                      closeElm();
                      setStatus("Немає зв'язку: " + ex.getMessage(), RED);
                  }
              }

              void doScan() throws IOException {
                  List<String> sup = elm.scanSupported();
                  final Set<String> set = new HashSet<String>(sup);
                  supported = set;
                  rep.supported = sup.isEmpty() ? "(порожньо — ЕБУ не відповів, заведи двигун)" : join(sup);
                  rep.event("Підтримується PID: " + sup.size());
                  // невідомі PID — одноразово, сирі відповіді для аналізу
                  int n = 0;
                  for (String p : sup) {
                      if (Pids.find(p) != null || p.endsWith("00") || p.endsWith("20") || p.endsWith("40")
                              || p.endsWith("60") || p.endsWith("80")) continue;
                      if (n++ > 40) break;
                      rep.unknown.put(p, elm.send(p, 1500));
                  }
                  ui.post(() -> {
                      for (Pids.Def d : Pids.ALL) {
                          boolean ok = set.isEmpty() || set.contains(d.pid);
                          nameViews.get(d.pid).setTextColor(ok ? TXT : 0xFF55606A);
                      }
                  });
                  setStatus(set.isEmpty() ? "ЕБУ двигуна (7E0) мовчить — заведи двигун" : "ЕБУ двигуна (7E0): відповідає, параметрів: " + set.size(), set.isEmpty() ? 0xFFFFB74D : GRN);
                  scanModules();
                  if (!set.isEmpty()) {
                      clog("Готово — зв'язок встановлено");
                      ui.post(() -> {
                          connOpen = false;
                          setTop(false);
                      });
                  }
              }

              // ================= Робочий потік =================

              int idx = 0, cycle = 0;
              boolean any;

              void worker() {
                  while (running) {
                      try {
                          Runnable r = queue.poll(connected ? 0 : 300, TimeUnit.MILLISECONDS);
                          if (r != null) {
                              r.run();
                              continue;
                          }
                          if (!connected) {
                              if (wantConn && System.currentTimeMillis() - lastTry > 3000) doConnect();
                              continue;
                          }
                          pollOne();
                      } catch (IOException e) {
                          lost(e);
                      } catch (Throwable t) {
                          rep.event("Збій: " + t);
                      }
                  }
              }

              void pollOne() throws IOException {
                  Pids.Def d = Pids.ALL[idx];
                  Set<String> sup = supported;
                  boolean ok = enabled.contains(d.pid) && (sup.isEmpty() || sup.contains(d.pid)) && (rep.recording || cycle % d.period == 0);
                  if (ok) {
                      any = true;
                      query(d);
                  }
                  if (++idx >= Pids.ALL.length) {
                      idx = 0;
                      cycle++;
                      if (!any) {
                          try {
                              Thread.sleep(250);
                          } catch (InterruptedException ignored) {
                          }
                      }
                      any = false;
                      rep.recRow();
                      if (cycle % 10 == 0) rep.flush();
                  }
              }

              void query(final Pids.Def d) throws IOException {
                  String resp = elm.send(d.pid, 1500);
                  int[] b = Pids.parsePid(resp, d.pid);
                  if (b == null && resp.replace(" ", "").startsWith("41")) {
                      // відповідь на інший запит — вирівнюємо обмін і пробуємо ще раз
                      elm.resync();
                      resp = elm.send(d.pid, 1500);
                      b = Pids.parsePid(resp, d.pid);
                  }
                  if (b == null || b.length < Pids.minBytes(d.pid)) {
                      String up0 = resp.toUpperCase();
                      if (!up0.contains("NO DATA") && !up0.contains("UNABLE")) qrec(false);
                      if (!resp.toUpperCase().contains("NO DATA") && ++failStreak >= 12) {
                          failStreak = 0;
                          throw new IOException("багато збоїв підряд, перепідключення");
                      }
                      if (resp.toUpperCase().contains("NO DATA") || resp.toUpperCase().contains("UNABLE")) rep.nodata(d.pid, resp);
                      else rep.err(d.pid, resp);
                      setVal(d.pid, "—");
                      return;
                  }
                  failStreak = 0;
                  qrec(true);
                  boolean allFF = true;
                  for (int x : b) if (x != 0xFF) allFF = false;
                  if (allFF) {
                      rep.nodata(d.pid, resp + " (усі FF)");
                      setVal(d.pid, "н/д");
                      return;
                  }
                  double v = Pids.decode(d.pid, b);
                  rep.ok(d.pid, v, resp);
                  setVal(d.pid, Pids.fmt(d.pid, v));
              }

              void setVal(final String pid, final String s) {
                  ui.post(() -> {
                      TextView t = valViews.get(pid);
                      if (t != null) t.setText(s);
                      if (curTab == 1 && graph != null) graph.invalidate();
                  });
              }

              // ================= Помилки =================

              void queueDtcRead() {
                  if (!connected) {
                      toast("Спочатку підключись (кнопка зв'язку вгорі)");
                      return;
                  }
                  dtcInfo.setText("Читаю…");
                  queue.add(() -> {
                      try {
                          readDtc();
                      } catch (IOException e) {
                          lost(e);
                      }
                  });
              }

              void readDtc() throws IOException {
                  final StringBuilder log = new StringBuilder();
                  String r0101 = elm.send("0101", 3000);
                  log.append("0101: ").append(r0101.replace('\n', '|')).append('\n');
                  int[] st = Pids.parsePid(r0101, "0101");
                  final String milS;
                  if (st != null && st.length >= 1) {
                      milS = ((st[0] & 0x80) != 0 ? "Лампа Check Engine: УВІМКНЕНА" : "Лампа Check Engine: вимкнена")
                              + ", кодів у ЕБУ: " + (st[0] & 0x7F);
                  } else {
                      milS = "Статус ЕБУ не отримано";
                  }
                  final List<String[]> found = new ArrayList<String[]>();
                  String[][] modes = {{"03", "43", "stored"}, {"07", "47", "pending"}, {"0A", "4A", "permanent"}};
                  for (String[] m : modes) {
                      String r = elm.send(m[0], 5000);
                      log.append(m[0]).append(": ").append(r.replace('\n', '|')).append('\n');
                      for (String c : Dtc.parse(r, m[1], elm.can)) {
                          boolean dup = false;
                          for (String[] f : found) if (f[0].equals(c) && f[1].equals(m[2])) dup = true;
                          if (!dup) found.add(new String[]{c, m[2]});
                      }
                  }
                  rep.lastDtc = milS + "\n" + log + "Знайдено: " + found.size();
                  rep.event("Читання помилок: " + found.size());
                  ui.post(() -> showDtc(milS, found));
              }

              void showDtc(String mil, List<String[]> found) {
                  dtcInfo.setText(mil + "\nЗнайдено помилок: " + found.size());
                  dtcList.removeAllViews();
                  for (final String[] f : found) {
                      LinearLayout card = new LinearLayout(this);
                      card.setOrientation(LinearLayout.VERTICAL);
                      paint(card, CARD);
                      card.setPadding(dp(10), dp(8), dp(10), dp(8));
                      TextView h = text(f[0] + "   (" + Dtc.kindLabel(f[1]) + ")", 20, RED);
                      h.setTypeface(Typeface.DEFAULT_BOLD);
                      card.addView(h);
                      card.addView(text(Dtc.describe(f[0]), 15, TXT));
                      Button web = btn("Читати про цю помилку в інтернеті");
                      web.setOnClickListener(v -> {
                          try {
                              String q = Uri.encode(f[0] + " Ford Focus 2 1.6 TDCi");
                              startActivity(new Intent(Intent.ACTION_VIEW, Uri.parse("https://www.google.com/search?q=" + q)));
                          } catch (Throwable t) {
                              toast("Немає браузера");
                          }
                      });
                      card.addView(web, bl());
                      LinearLayout.LayoutParams lp = bl();
                      lp.setMargins(0, dp(4), 0, dp(4));
                      dtcList.addView(card, lp);
                  }
              }

              void confirmClear() {
                  if (!connected) {
                      toast("Спочатку підключись");
                      return;
                  }
                  new AlertDialog.Builder(this)
                          .setTitle("Стерти помилки?")
                          .setMessage("Помилки та дані заморожених кадрів будуть видалені з ЕБУ. Якщо несправність лишилась — помилка з'явиться знову.")
                          .setPositiveButton("Стерти", (d, w) -> queue.add(() -> {
                              try {
                                  String r = elm.send("04", 5000);
                                  rep.event("Стирання (04): " + r.replace('\n', '|'));
                                  ui.post(() -> dtcInfo.setText("Команду стирання надіслано: " + r));
                                  readDtc();
                              } catch (IOException e) {
                                  lost(e);
                              }
                          }))
                          .setNegativeButton("Скасувати", null)
                          .show();
              }

              @Override
              protected void onDestroy() {
                  running = false;
                  rep.flush();
                  if (elm != null) elm.close();
                  super.onDestroy();
              }
          }
