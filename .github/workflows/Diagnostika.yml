              }

              synchronized void ok(String pid, double v, String raw) {
                  Stat s = st(pid);
                  s.lastT = System.currentTimeMillis();
                  s.ok++;
                  s.sum += v;
                  if (v < s.min) s.min = v;
                  if (v > s.max) s.max = v;
                  s.last = v;
                  s.lastRaw = raw;
                  long now = System.currentTimeMillis();
                  Hist h = hist.get(pid);
                  if (h == null) {
                      h = new Hist();
                      hist.put(pid, h);
                  }
                  h.t.add(now);
                  h.v.add(v);
                  while (h.t.size() > 4000) {
                      h.t.remove(0);
                      h.v.remove(0);
                  }
                  String row = (now - t0) + ";" + pid + ";" + String.format(Locale.US, "%.2f", v) + ";" + raw.replace('\n', '|');
                  rows.add(row);
                  while (rows.size() > 60) rows.remove(0);
                  try {
                      if (csv != null) {
                          csv.write(row + "\n");
                          if (rows.size() % 20 == 0) csv.flush();
                      }
                  } catch (Throwable ignored) {
                  }
              }

              synchronized void nodata(String pid, String raw) {
                  Stat s = st(pid);
                  s.nodata++;
                  s.lastRaw = raw;
              }

              synchronized void err(String pid, String raw) {
                  Stat s = st(pid);
                  s.err++;
                  s.lastRaw = raw;
              }

              synchronized void reset() {
                  stats.clear();
                  hist.clear();
                  rows.clear();
              }

