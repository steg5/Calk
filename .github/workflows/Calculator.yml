name: Calculator

​on:

workflow_dispatch:

push:

paths:

- '.github/workflows/Calculator.yml'

​jobs:

build:

runs-on: ubuntu-latest

steps:

- uses: actions/setup-java@v4

with:

distribution: temurin

java-version: '17'

​- uses: gradle/actions/setup-gradle@v3

with:

gradle-version: '8.5'

​- name: Write project

run: |

mkdir -p app/src/main/java/com/example/calculator app/src/main/res/drawable

​cat > settings.gradle <<'EOF'

pluginManagement {

repositories {

google()

mavenCentral()

gradlePluginPortal()

}

}

dependencyResolutionManagement {

repositories {

google()

mavenCentral()

}

}

rootProject.name = 'Calculator'

include ':app'

EOF

​cat > build.gradle <<'EOF'

plugins {

id 'com.android.application' version '8.2.2' apply false

}

EOF

​cat > gradle.properties <<'EOF'

org.gradle.jvmargs=-Xmx2g

android.useAndroidX=false

EOF

​cat > app/build.gradle <<'EOF'

plugins {

id 'com.android.application'

}

android {

namespace 'com.example.calculator'

compileSdk 34

defaultConfig {

applicationId "com.example.calculator"

minSdk 23

targetSdk 26

versionCode 1

versionName "1.0"

}

compileOptions {

sourceCompatibility JavaVersion.VERSION_1_8

targetCompatibility JavaVersion.VERSION_1_8

}

lint {

abortOnError false

checkReleaseBuilds false

}

}

EOF

​cat > app/src/main/AndroidManifest.xml <<'EOF'

<?xml version="1.0" encoding="utf-8"?>

<manifest xmlns:android="http://schemas.android.com/apk/res/android">

<application

android:label="Калькулятор"

android:icon="@drawable/ic_launcher"

android:allowBackup="false"

android:theme="@android:style/Theme.DeviceDefault.NoActionBar">

<activity

android:name=".MainActivity"

android:exported="true"

android:launchMode="singleTask">

<intent-filter>

<action android:name="android.intent.action.MAIN"/>

<category android:name="android.intent.category.LAUNCHER"/>

</intent-filter>

</activity>

</application>

</manifest>

EOF

​cat > app/src/main/java/com/example/calculator/MainActivity.java <<'EOF'

package com.example.calculator;

​import android.app.Activity;

import android.graphics.Color;

import android.graphics.Typeface;

import android.graphics.drawable.GradientDrawable;

import android.os.Bundle;

import android.view.Gravity;

import android.view.View;

import android.widget.Button;

import android.widget.GridLayout;

import android.widget.LinearLayout;

import android.widget.TextView;

​public class MainActivity extends Activity {

static final int BG = 0xFF0B0F17, CARD = 0xFF172033, TXT = 0xFFF1F5F9, ACC = 0xFF22D3EE, NUM_BG = 0xFF1E293B, OP_BG = 0xFF2563EB;

​private TextView tvDisplay;

private String firstNum = "";

private String operator = "";

private boolean isNewOp = true;

​int dp(int v) {

return (int) (v * getResources().getDisplayMetrics().density + 0.5f);

}

​@Override

protected void onCreate(Bundle savedInstanceState) {

super.onCreate(savedInstanceState);

​LinearLayout root = new LinearLayout(this);

root.setOrientation(LinearLayout.VERTICAL);

root.setBackgroundColor(BG);

root.setPadding(dp(16), dp(16), dp(16), dp(16));

​tvDisplay = new TextView(this);

tvDisplay.setText("0");

tvDisplay.setTextColor(TXT);

tvDisplay.setTextSize(40);

tvDisplay.setGravity(Gravity.END | Gravity.BOTTOM);

tvDisplay.setTypeface(Typeface.DEFAULT_BOLD);

tvDisplay.setPadding(dp(16), dp(16), dp(16), dp(16));

​LinearLayout.LayoutParams displayParams = new LinearLayout.LayoutParams(

LinearLayout.LayoutParams.MATCH_PARENT, 0, 1.5f);

root.addView(tvDisplay, displayParams);

​GridLayout grid = new GridLayout(this);

grid.setColumnCount(4);

grid.setRowCount(5);

​String[][] buttons = {

{"C", "(", ")", "/"},

{"7", "8", "9", "*"},

{"4", "5", "6", "-"},

{"1", "2", "3", "+"},

{"0", ".", "DEL", "="}

};

​for (int r = 0; r < 5; r++) {

for (int c = 0; c < 4; c++) {

final String text = buttons[r][c];

Button b = createButton(text);

GridLayout.LayoutParams params = new GridLayout.LayoutParams(

GridLayout.spec(r, 1f),

GridLayout.spec(c, 1f)

);

params.width = 0;

params.height = 0;

params.setMargins(dp(4), dp(4), dp(4), dp(4));

b.setLayoutParams(params);

b.setOnClickListener(v -> onButtonClick(text));

grid.addView(b);

}

}

​LinearLayout.LayoutParams gridParams = new LinearLayout.LayoutParams(

LinearLayout.LayoutParams.MATCH_PARENT, 0, 4f);

root.addView(grid, gridParams);

​setContentView(root);

}

​private Button createButton(String text) {

Button b = new Button(this);

b.setText(text);

b.setAllCaps(false);

b.setTextSize(22);

b.setTypeface(Typeface.DEFAULT_BOLD);

​int bg = NUM_BG;

int textColor = TXT;

​if (text.matches("[/*+\-=]")) {

bg = OP_BG;

textColor = Color.WHITE;

} else if (text.equals("C") || text.equals("DEL")) {

bg = 0xFFDC2626;

textColor = Color.WHITE;

}

​b.setTextColor(textColor);

GradientDrawable g = new GradientDrawable();

g.setColor(bg);

g.setCornerRadius(dp(16));

b.setBackground(g);

return b;

}

​private void onButtonClick(String text) {

if (text.matches("[0-9]|\.")) {

if (isNewOp) {

tvDisplay.setText("");

isNewOp = false;

}

if (text.equals(".") && tvDisplay.getText().toString().contains(".")) return;

tvDisplay.append(text);

} else if (text.equals("C")) {

tvDisplay.setText("0");

firstNum = "";

operator = "";

isNewOp = true;

} else if (text.equals("DEL")) {

String str = tvDisplay.getText().toString();

if (str.length() > 1) {

tvDisplay.setText(str.substring(0, str.length() - 1));

} else {

tvDisplay.setText("0");

isNewOp = true;

}

} else if (text.matches("[/*+\-]")) {

firstNum = tvDisplay.getText().toString();

operator = text;

isNewOp = true;

} else if (text.equals("=")) {

if (operator.isEmpty() || firstNum.isEmpty()) return;

double num1 = Double.parseDouble(firstNum);

double num2 = Double.parseDouble(tvDisplay.getText().toString());

double result = 0;

​switch (operator) {

case "+": result = num1 + num2; break;

case "-": result = num1 - num2; break;

case "*": result = num1 * num2; break;

case "/":

if (num2 != 0) result = num1 / num2;

else {

tvDisplay.setText("Помилка");

isNewOp = true;

return;

}

break;

}

​if (result == (long) result) {

tvDisplay.setText(String.format("%d", (long) result));

} else {

tvDisplay.setText(String.valueOf(result));

}

isNewOp = true;

operator = "";

}

}

}

EOF

​echo '' | base64 -d > app/src/main/res/drawable/ic_launcher.png

​- name: Build

run: gradle assembleDebug --no-daemon

​- uses: actions/upload-artifact@v4

with:

name: Calculator

path: app/build/outputs/apk/debug/app-debug.apk

