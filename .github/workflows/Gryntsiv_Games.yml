              private void refreshRooms() {
                  long now = System.currentTimeMillis();
                  final ArrayList<Discovery.Room> list = new ArrayList<Discovery.Room>();
                  for (Discovery.Room r : disc.rooms.values()) {
                      if (now - r.seen <= 5000) list.add(r);
                  }
                  StringBuilder sig = new StringBuilder();
                  for (Discovery.Room r : list) sig.append(r.ip).append(r.port).append(r.count).append(';');
                  if (sig.toString().equals(joinSig)) return;
                  joinSig = sig.toString();
                  joinList.removeAllViews();
                  if (list.isEmpty()) {
                      joinList.addView(tv("Кімнат не знайдено. Обидва гравці мають бути в одній Wi-Fi мережі.", 0.36f, 0xFFB0BEC5, false));
                      return;
                  }
                  for (final Discovery.Room r : list) {
                      final boolean ok = r.count < 2;
                      String t = r.name + "   " + r.ip + (ok ? "" : "   зайнята");
                      joinList.addView(btn(t, ok ? 0xFF1E88E5 : 0xFF607D8B, new View.OnClickListener() {
                          public void onClick(View v) {
                              if (ok) joinLan(r.ip, r.port);
                          }
                      }), lp(MATCH, 1.0f, 0.08f));
                  }
              }

              private Net newGuestNet() {
                  Net old = net;
                  net = null;
                  if (old != null) old.close();
                  mp = true;
                  final Net[] ref = new Net[1];
                  net = new Net(netCb(ref));
                  ref[0] = net;
                  net.setInfo(nick, avatar);
                  say("Підключення…");
                  return net;
              }

              private void joinLan(String ip, int port) {
                  newGuestNet().joinLan(ip, port);
              }

              private void joinCode(String code) {
                  newGuestNet().joinCode(code, cid);
              }

              private void opponentLeft() {
                  if (screen == S_BATTLE && !over) {
                      over = true;
                      bv.myTurn = false;
                      setMsg("Суперник вийшов");
                      snd.play(Snd.WIN);
                      addHist(peerNick == null ? "гравцем" : peerNick, true);
                      bv.banner("Перемога!", 0xFF69F0AE, 1300);
                      showEnd(true, "Суперник вийшов із гри", false);
                  } else if (screen == S_PLACE) {
                      say("Суперник вийшов");
                      showSea();
                  } else if (screen == S_BATTLE && endDlg != null) {
                      peerRematch = false;
                      say("Суперник вийшов");
                  }
              }

              // ---------- розстановка ----------
              private void showPlace(int lvl) {
                  if (lvl >= 0) level = lvl;
                  resetMatchFlags();
                  begin(S_PLACE);
                  final PlaceView pv = new PlaceView(this);
                  pview = pv;
                  pv.theme = theme;
                  pv.mix = sp.getBoolean("mix", false);
                  root.addView(pv, new FrameLayout.LayoutParams(MATCH, MATCH));
                  pv.listener = new PlaceView.Listener() {
                      public void onChanged() {
                      }

                      public void onSound(int kind) {
                          snd.play(kind);
                      }

                      public void onTheme(int t) {
                          theme = t;
                          sp.edit().putInt("theme", t).commit();
                      }

                      public void onMix(boolean on) {
                          sp.edit().putBoolean("mix", on).commit();
                      }

                      public void onBack() {
                          showSea();
                      }

                      public void onDone() {
                          if (!pv.board.allPlaced() || myReady) return;
                          if (!mp) {
                              startBattle(pv.board);
                              return;
                          }
                          myReady = true;
                          pv.locked = true;
                          myBoard = pv.board;
                          pv.status = "Чекаємо суперника…";
                          net.send("READY");
                          checkStart();
                      }
                  };
              }

              private void checkStart() {
                  if (!mp || net == null || !net.host || started) return;
                  if (myReady && peerReady) {
                      started = true;
                      int first = rnd.nextInt(2); // 0 — господар
                      net.send("START|" + first);
                      beginBattleMp(first == 0);
                  }
              }

              // ---------- бій ----------
              private void buildBattle() {
                  begin(S_BATTLE);
                  over = false;
                  pausedBy = 0;
                  awaiting = false;
                  bv = new BattleView(this);
                  bv.theme = theme;
                  bv.mine = mine;
                  bv.enemy = enemy;
                  bv.myName = nick;
                  bv.enemyName = mp ? (peerNick == null ? "Суперник" : peerNick) : "Бот " + botName;
                  bv.listener = new BattleView.Listener() {
                      public void onShoot(int cell) {
                          myShot(cell);
                      }

                      public void onEmoji() {
                          showEmoji();
                      }

                      public void onPause() {
                          togglePause();
                      }

                      public void onExit() {
                          askExit();
                      }
                  };
                  root.addView(bv, new FrameLayout.LayoutParams(MATCH, MATCH));
                  bv.banner("До бою", 0xFFFFD54F, 1500);
              }

              private void setMsg(String s) {
                  lastMsg = s;
                  if (bv == null) return;
                  if (pausedBy == 1) bv.msg = "Пауза — натисніть ▶, щоб продовжити";
                  else if (pausedBy == 2) bv.msg = "Суперник поставив паузу";
                  else bv.msg = s;
                  bv.pausedBy = pausedBy;
                  bv.invalidate();
              }

              private void startBattle(Board my) {
                  mine = my;
                  mine.baseTheme = theme;
                  for (int i = 0; i < mine.shot.length; i++) mine.shot[i] = 0;
                  enemy = new Board();
                  enemy.baseTheme = theme;
                  enemy.randomize(rnd);
                  if (sp.getBoolean("mix", false)) {
                      for (Board.Ship s : enemy.ships) s.theme = rnd.nextInt(Painter.THEMES.length);
                  }
                  bot = new Bot(level);
                  if (botName.length() == 0) botName = BOT_NAMES[rnd.nextInt(BOT_NAMES.length)];
                  buildBattle();
                  myTurn = rnd.nextBoolean();
                  bv.myTurn = myTurn;
                  setMsg(myTurn ? "Ви починаєте — стріляйте!" : "Першим стріляє бот");
                  if (!myTurn) botLater(900);
              }

              private void beginBattleMp(boolean iFirst) {
                  mine = myBoard;
                  mine.baseTheme = theme;
                  for (int i = 0; i < mine.shot.length; i++) mine.shot[i] = 0;
                  enemy = new Board();
                  enemy.baseTheme = theme;
                  buildBattle();
                  myTurn = iFirst;
                  bv.myTurn = myTurn;
                  setMsg(myTurn ? "Ви починаєте — стріляйте!" : "Суперник починає");
              }

              private void myShot(int cell) {
                  if (over || !myTurn || awaiting || pausedBy != 0 || enemy.shot[cell] != 0) return;
                  bv.lastEnemy = cell;
                  if (mp) {
                      awaiting = true;
                      net.send("SHOT|" + cell);
                      snd.play(Snd.SHOT);
                      bv.invalidate();
                      return;
                  }
                  int res = enemy.shoot(cell);
                  sounds(res);
                  if (enemy.allSunk()) {
                      setMsg("Усі кораблі бота потоплено!");
                      endGame(true);
                  } else if (res == 0) {
                      setMsg("Мимо. Хід бота");
                      myTurn = false;
                      bv.myTurn = false;
                      botLater(1000);
                  } else {
                      setMsg(res == 2 ? "Потоплено! Стріляйте ще" : "Влучили! Стріляйте ще");
                  }
                  bv.invalidate();
              }

              private void botLater(int ms) {
                  final int g = gen;
                  ui.postDelayed(new Runnable() {
                      public void run() {
                          if (g == gen && !over) botShot();
                      }
                  }, ms);
              }

              private void botShot() {
                  if (pausedBy != 0) {
                      botLater(500);
                      return;
                  }
                  int cell = bot.next(mine);
                  int res = mine.shoot(cell);
                  bv.lastMine = cell;
                  sounds(res);
                  if (mine.allSunk()) {
                      setMsg("Бот потопив усі ваші кораблі");
                      endGame(false);
                  } else if (res == 0) {
                      setMsg("Бот схибив. Ваш хід");
                      myTurn = true;
                      bv.myTurn = true;
                  } else {
                      setMsg(res == 2 ? "Бот потопив ваш корабель" : "Бот влучив");
                      botLater(900);
                  }
                  bv.invalidate();
              }

              private void sounds(final int res) {
                  snd.play(Snd.SHOT);
                  final int g = gen;
                  ui.postDelayed(new Runnable() {
                      public void run() {
                          if (g == gen) snd.play(res == 0 ? Snd.MISS : (res == 1 ? Snd.HIT : Snd.SUNK));
                      }
                  }, 260);
              }

              private void handleNet(String line) {
                  String[] f = line.split("\\|", -1);
                  String c = f[0];
                  try {
                      if (c.equals("GO")) {
                          if (screen == S_LOBBY && net != null && !net.host) showPlace(-1);
                      } else if (c.equals("KICK")) {
                          say("Господар вилучив вас з кімнати");
                          showSea();
                      } else if (c.equals("READY")) {
                          peerReady = true;
                          checkStart();
                      } else if (c.equals("START")) {
                          if (!mp || started) return;
                          started = true;
                          beginBattleMp(f[1].equals("1"));
                      } else if (c.equals("SHOT")) {
                          if (screen != S_BATTLE || over) return;
                          int cell = Integer.parseInt(f[1]);
                          String ans = mine.answer(cell);
                          net.send(ans);
                          String[] rf = ans.split("\\|", -1);
                          int res = Integer.parseInt(rf[2]);
                          boolean fin = rf[4].equals("1");
                          bv.lastMine = cell;
                          sounds(res);
                          if (fin) {
                              setMsg("Суперник потопив усі ваші кораблі");
                              endGame(false);
                          } else if (res == 0) {
                              setMsg("Суперник схибив. Ваш хід");
                              myTurn = true;
                              bv.myTurn = true;
                          } else {
                              setMsg(res == 2 ? "Суперник потопив ваш корабель" : "Суперник влучив");
                          }
                          bv.invalidate();
                      } else if (c.equals("RES")) {
                          if (screen != S_BATTLE || over) return;
                          awaiting = false;
                          enemy.applyRes(f);
                          int res = Integer.parseInt(f[2]);
                          bv.lastEnemy = Integer.parseInt(f[1]);
                          sounds(res);
                          if (f[4].equals("1")) {
                              setMsg("Усі кораблі суперника потоплено!");
                              endGame(true);
                          } else if (res == 0) {
                              setMsg("Мимо. Хід суперника");
                              myTurn = false;
                              bv.myTurn = false;
                          } else {
                              setMsg(res == 2 ? "Потоплено! Стріляйте ще" : "Влучили! Стріляйте ще");
                          }
                          bv.invalidate();
                      } else if (c.equals("EMO")) {
                          int k = Integer.parseInt(f[1]);
                          if (bv != null && screen == S_BATTLE && k >= 0 && k < EMOJI.length) bv.showEmoji(false, EMOJI[k]);
                      } else if (c.equals("PAUSE")) {
                          if (f[1].equals("1")) {
                              pausedBy = 2;
                          } else if (pausedBy == 2) {
                              pausedBy = 0;
                          }
                          setMsg(lastMsg);
                      } else if (c.equals("REMATCH")) {
                          peerRematch = true;
                          if (myRematch) rematch();
                      }
                  } catch (Exception e) {
                      // некоректне повідомлення ігноруємо
                  }
              }

              private void togglePause() {
                  if (over) return;
                  if (pausedBy == 2) {
                      say("Паузу поставив суперник");
                      return;
                  }
                  pausedBy = pausedBy == 1 ? 0 : 1;
                  if (mp && net != null) net.send("PAUSE|" + pausedBy);
                  setMsg(lastMsg);
              }

              private void askExit() {
                  new AlertDialog.Builder(this).setTitle(over ? "Вийти?" : "Вийти з гри?")
                      .setPositiveButton("Так", new DialogInterface.OnClickListener() {
                          public void onClick(DialogInterface d, int w) {
                              showSea();
                          }
                      }).setNegativeButton("Ні", null).show();
              }

              private void showEmoji() {
                  if (emoDlg != null) {
                      try {
                          emoDlg.dismiss();
                      } catch (Exception e) {
                          // ignore
                      }
                  }
                  LinearLayout box = new LinearLayout(this);
                  box.setOrientation(LinearLayout.VERTICAL);
                  for (int r = 0; r < 4; r++) {
                      LinearLayout row = new LinearLayout(this);
                      for (int c = 0; c < 8; c++) {
                          final int k = r * 8 + c;
                          TextView e = tv(EMOJI[k], 0.85f, WHITE, false);
                          e.setGravity(Gravity.CENTER);
                          e.setOnClickListener(new View.OnClickListener() {
                              public void onClick(View v) {
                                  if (emoDlg != null) emoDlg.dismiss();
                                  sendEmoji(k);
                              }
                          });
                          row.addView(e, new LinearLayout.LayoutParams(0, px(1.3f), 1f));
                      }
                      box.addView(row, new LinearLayout.LayoutParams(MATCH, WRAP));
                  }
                  Dialog d = dialog(box, true);
                  emoDlg = d;
                  d.show();
                  if (d.getWindow() != null) d.getWindow().setLayout(px(12.5f), WRAP);
              }

              private void sendEmoji(int k) {
                  if (bv == null) return;
                  bv.showEmoji(true, EMOJI[k]);
                  if (mp) {
                      if (net != null) net.send("EMO|" + k);
                  } else if (rnd.nextInt(2) == 0) {
                      final int g = gen;
                      ui.postDelayed(new Runnable() {
                          public void run() {
                              if (g == gen && bv != null) bv.showEmoji(false, EMOJI[GOOD_EMO[rnd.nextInt(GOOD_EMO.length)]]);
                          }
                      }, 1200 + rnd.nextInt(1000));
                  }
              }

              private Dialog dialog(View content, boolean cancel) {
                  LinearLayout wrap = new LinearLayout(this);
                  wrap.setOrientation(LinearLayout.VERTICAL);
                  wrap.setBackground(bg(0xFF263238, 0.3f));
                  wrap.setPadding(px(0.5f), px(0.4f), px(0.5f), px(0.4f));
                  wrap.addView(content);
                  Dialog d = new Dialog(this, android.R.style.Theme_DeviceDefault_Dialog_NoActionBar);
                  d.setContentView(wrap);
                  d.setCancelable(cancel);
                  if (d.getWindow() != null) d.getWindow().setBackgroundDrawable(new ColorDrawable(Color.TRANSPARENT));
                  return d;
              }

              private void endGame(final boolean win) {
                  over = true;
                  myTurn = false;
                  bv.myTurn = false;
                  bv.reveal = true;
                  bv.banner(win ? "Перемога!" : "Поразка", win ? 0xFF69F0AE : 0xFFFF8A80, 1300);
                  addHist(mp ? (peerNick == null ? "гравцем" : peerNick) : "ботом (" + Bot.LEVELS[level] + ")", win);
                  final int g = gen;
                  ui.postDelayed(new Runnable() {
                      public void run() {
                          if (g != gen) return;
                          snd.play(win ? Snd.WIN : Snd.LOSE);
                          showEnd(win, win ? (mp ? "Флот суперника знищено" : "Флот бота знищено") : "Ваш флот знищено", true);
                      }
                  }, 1300);
              }

              private void showEnd(boolean win, String text, boolean rematchOk) {
                  LinearLayout box = column();
                  box.addView(tv(win ? "Перемога!" : "Поразка", 0.8f, win ? 0xFF69F0AE : 0xFFFF8A80, true), lp(WRAP, WRAP, 0.1f));
                  box.addView(tv(text, 0.38f, WHITE, false), lp(WRAP, WRAP, 0.1f));
                  LinearLayout row = new LinearLayout(this);
                  row.setOrientation(LinearLayout.HORIZONTAL);
                  if (rematchOk) {
                      final Button rb = btn("Реванш", 0xFF2E7D32, null);
                      rb.setOnClickListener(new View.OnClickListener() {
                          public void onClick(View v) {
                              snd.play(Snd.BTN);
                              if (!mp) {
                                  showPlace(level);
                                  return;
                              }
                              if (myRematch) return;
                              myRematch = true;
                              net.send("REMATCH");
                              rb.setText("Чекаємо…");
                              rb.setAlpha(0.6f);
                              if (peerRematch) rematch();
                          }
                      });
                      row.addView(rb, new LinearLayout.LayoutParams(0, px(1.0f), 1f));
                  }
                  row.addView(btn("В меню", 0xFF1565C0, new View.OnClickListener() {
                      public void onClick(View v) {
                          showSea();
                      }
                  }), new LinearLayout.LayoutParams(0, px(1.0f), 1f));
                  for (int k = 0; k < row.getChildCount(); k++) {
                      ((LinearLayout.LayoutParams) row.getChildAt(k).getLayoutParams()).setMargins(px(0.1f), px(0.1f), px(0.1f), px(0.1f));
                  }
                  box.addView(row, new LinearLayout.LayoutParams(px(7.2f), WRAP));
                  Dialog d = dialog(box, false);
                  endDlg = d;
                  d.show();
              }

              private void rematch() {
                  if (net == null) return;
                  showPlace(-1);
              }

              @Override
              public void onBackPressed() {
                  if (screen == S_MENU) {
                      finish();
                  } else if (screen == S_SEA) {
                      showMenu();
                  } else if (screen == S_LOBBY || screen == S_JOIN || screen == S_HIST || screen == S_PLACE) {
                      showSea();
                  } else if (screen == S_BATTLE) {
                      askExit();
                  } else {
                      if (prevScreen == S_SEA) showSea();
                      else showMenu();
                  }
              }
          }
