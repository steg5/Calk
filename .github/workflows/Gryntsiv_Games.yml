              public static class Listener {
                  public final ConcurrentHashMap<String, Room> rooms = new ConcurrentHashMap<String, Room>();
                  private volatile boolean run;
                  private DatagramSocket ds;
                  private WifiManager.MulticastLock lock;
                  private final Context ctx;

                  public Listener(Context ctx) {
                      this.ctx = ctx.getApplicationContext();
                  }

                  public void start() {
                      try {
                          WifiManager wm = (WifiManager) ctx.getSystemService(Context.WIFI_SERVICE);
                          if (wm != null) {
                              lock = wm.createMulticastLock("unogryntsiv");
                              lock.setReferenceCounted(false);
                              lock.acquire();
                          }
                      } catch (Exception e) {
                          // ignore
                      }
                      run = true;
                      Thread t = new Thread(new Runnable() {
                          public void run() {
                              try {
                                  ds = new DatagramSocket(null);
                                  ds.setReuseAddress(true);
                                  ds.bind(new InetSocketAddress(PORT));
                                  ds.setBroadcast(true);
                                  ds.setSoTimeout(1000);
                                  byte[] buf = new byte[512];
                                  while (run) {
                                      try {
                                          DatagramPacket p = new DatagramPacket(buf, buf.length);
                                          ds.receive(p);
                                          String s = new String(p.getData(), 0, p.getLength(), "UTF-8");
                                          String[] f = s.split("\\|", -1);
                                          if (f.length < 6 || !f[0].equals("UNO1")) continue;
                                          Room r = new Room();
                                          r.name = f[1];
                                          r.ip = p.getAddress().getHostAddress();
                                          r.port = Integer.parseInt(f[2]);
                                          r.count = Integer.parseInt(f[3]);
                                          r.inGame = f[4].equals("1");
                                          r.rejoin = Integer.parseInt(f[5].trim());
                                          r.seen = System.currentTimeMillis();
                                          rooms.put(r.ip + ":" + r.port, r);
                                      } catch (java.net.SocketTimeoutException e) {
                                          // чекаємо далі
                                      }
                                  }
                              } catch (Exception e) {
                                  // ignore
                              } finally {
                                  if (ds != null) ds.close();
                              }
                          }
                      });
                      t.setDaemon(true);
                      t.start();
                  }

                  public void stop() {
                      run = false;
                      try {
                          if (ds != null) ds.close();
                      } catch (Exception e) {
                          // ignore
                      }
                      try {
                          if (lock != null && lock.isHeld()) lock.release();
                      } catch (Exception e) {
                          // ignore
                      }
                  }
              }
          }
