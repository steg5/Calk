          cat > app/src/main/java/com/example/gryntsivgames/Snd.java <<'EOF'
          package com.example.gryntsivgames;

          import android.content.Context;
          import android.content.SharedPreferences;
          import android.media.AudioManager;
          import android.media.SoundPool;

          public class Snd {
              public static final int BTN = 0, SHOT = 1, MISS = 2, HIT = 3, SUNK = 4, WIN = 5, LOSE = 6, PLACE = 7;
              // власні mp3 (якщо є), інакше вбудований звук
              private static final String[] NAMES = {"buttons|bs_btn", "bs_shot", "bs_miss", "bs_hit", "bs_sunk", "bs_win", "bs_lose", "bs_place"};
              private SoundPool pool;
              private final int[] ids = new int[NAMES.length];
              private final SharedPreferences sp;
              public boolean sound = true;

              public Snd(Context c, SharedPreferences sp) {
                  this.sp = sp;
                  sound = sp.getBoolean("sound", true);
                  Context ctx = c.getApplicationContext();
                  try {
                      pool = new SoundPool(8, AudioManager.STREAM_MUSIC, 0);
                      for (int i = 0; i < NAMES.length; i++) {
                          int rid = 0;
                          String[] cand = NAMES[i].split("\\|");
                          for (int k = 0; k < cand.length && rid == 0; k++) {
                              rid = ctx.getResources().getIdentifier(cand[k], "raw", ctx.getPackageName());
                          }
                          ids[i] = rid == 0 ? 0 : pool.load(ctx, rid, 1);
                      }
                  } catch (Exception e) {
                      pool = null;
                  }
              }

              public void setSound(boolean on) {
                  sound = on;
                  sp.edit().putBoolean("sound", on).commit();
              }

              public void play(int kind) {
                  if (!sound || pool == null || kind < 0 || kind >= ids.length || ids[kind] == 0) return;
                  try {
                      pool.play(ids[kind], 0.9f, 0.9f, 1, 0, 1f);
                  } catch (Exception e) {
                      // ignore
                  }
              }

              public void release() {
                  try {
                      if (pool != null) pool.release();
                  } catch (Exception e) {
                      // ignore
                  }
                  pool = null;
              }
          }
          EOF

