                          rr(c, p, x - s * 0.04f, s * 0.47f, x + s * 0.08f, s * 0.53f, 0, 0xFF37474F);
                      }
                  }
              }

              // ---------- жуки ----------
              private static void caterpillar(Canvas c, Paint p, float s, int len, int v) {
