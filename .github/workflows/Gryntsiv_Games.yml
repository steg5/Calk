                  new Theme("Ретро",
                      new int[]{0xFFD32F2F, 0xFFF9A825, 0xFF2E7D32, 0xFF1565C0},
                      0xFF1A1A1A, 0xFFFFF8E1, 0xFF1B5E3A, 0xFFFFFFFF, 2),
                  new Theme("Неон",
                      new int[]{0xFFFF1744, 0xFFFFEA00, 0xFF00E676, 0xFF00B0FF},
