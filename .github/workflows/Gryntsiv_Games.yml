          package com.example.gryntsivgames;

          import android.content.Context;
          import android.graphics.Canvas;
          import android.graphics.Paint;
          import android.view.MotionEvent;
          import android.view.View;

          public class BattleView extends View {
              public interface Listener {
                  void onShoot(int cell);
              }

              public Board mine, enemy;
              public Listener listener;
              public int theme;
              public String msg = "";
              public boolean myTurn, reveal;
              public int lastMine = -1, lastEnemy = -1;
              private final Paint p = new Paint(Paint.ANTI_ALIAS_FLAG);
              private float ex, ey, ec, mx, my, mc;

              public BattleView(Context c) {
                  super(c);
              }

              private void calc() {
                  float W = getWidth(), H = getHeight();
                  float u = Math.min(W / 16f, H / 9f);
                  ec = Math.min(H * 0.78f, W * 0.52f) / 10f;
                  ex = W - u * 0.7f - ec * 10;
                  ey = H - u * 0.5f - ec * 10;
                  mc = ec * 0.6f;
                  mx = u * 1.0f;
                  my = ey;
              }

              @Override
              protected void onDraw(Canvas cv) {
                  calc();
                  float W = getWidth(), H = getHeight();
                  float u = Math.min(W / 16f, H / 9f);
                  cv.drawColor(0xFF0D2847);
                  if (mine == null || enemy == null) return;
                  Painter.board(cv, p, enemy, ex, ey, ec, reveal, theme, lastEnemy, true);
                  Painter.board(cv, p, mine, mx, my, mc, true, theme, lastMine, false);
                  p.setStyle(Paint.Style.FILL);
                  p.setTextAlign(Paint.Align.CENTER);
                  p.setTextSize(u * 0.42f);
                  p.setColor(myTurn ? 0xFF69F0AE : 0xFFFFD54F);
                  cv.drawText(msg, (ex - u * 0.3f) / 2f + u * 0.3f, u * 0.65f, p);
                  p.setTextAlign(Paint.Align.LEFT);
                  p.setTextSize(u * 0.36f);
                  p.setColor(0xFFB0BEC5);
                  cv.drawText("Ваше поле", mx, my - u * 0.15f, p);
                  cv.drawText("Поле ворога", ex, ey - ec * 0.7f, p);
                  // залишок флоту ворога
                  float sy = my + mc * 10 + u * 0.35f;
                  cv.drawText("Флот ворога:", mx, sy + u * 0.3f, p);
                  float x0 = mx, y0 = sy + u * 0.55f, sq = u * 0.22f;
                  for (Board.Ship s : enemy.ships) {
                      boolean dead = enemy.sunk(s);
                      p.setColor(dead ? 0xFFD32F2F : 0xFF90A4AE);
                      for (int k = 0; k < s.len; k++) {
                          cv.drawRect(x0 + k * (sq + 2), y0, x0 + k * (sq + 2) + sq, y0 + sq, p);
                      }
                      x0 += s.len * (sq + 2) + sq * 0.8f;
                      if (x0 > mx + mc * 10 - sq * 3) {
                          x0 = mx;
                          y0 += sq + 4;
                      }
                  }
              }

              @Override
              public boolean onTouchEvent(MotionEvent e) {
                  if (e.getAction() != MotionEvent.ACTION_UP) return true;
                  calc();
                  int c = (int) Math.floor((e.getX() - ex) / ec), r = (int) Math.floor((e.getY() - ey) / ec);
                  if (c < 0 || r < 0 || c >= 10 || r >= 10) return true;
                  if (listener != null) listener.onShoot(r * 10 + c);
                  return true;
              }
          }
