              private void sendEmoji(int k) {
                  if (bv == null) return;
                  bv.showEmoji(true, EMOJI[k]);
                  if (mp) {
                      if (net != null) net.send("EMO|" + k);
                  } else if (rnd.nextInt(2) == 0) {
                      final int g = gen;
                      ui.postDelayed(new Runnable() {
                          public void run() {
                              if (g == gen && bv != null) bv.showEmoji(false, EMOJI[GOOD_EMO[rnd.nextInt(GOOD_EMO.length)]]);
                          }
                      }, 1200 + rnd.nextInt(1000));
