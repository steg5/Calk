              private void emo(Canvas cv, String e, float x, float y, long left, float u) {
                  float k = left > 400 ? 1f : left / 400f;
                  p.setTextAlign(Paint.Align.CENTER);
                  p.setTextSize(u * 2.2f * (0.6f + 0.4f * k));
                  p.setAlpha((int) (255 * k));
                  p.setColor(0xFFFFFFFF);
                  cv.drawText(e, x, y + u * 0.7f, p);
                  p.setAlpha(255);
              }

              private boolean hit(float[] c, float x, float y) {
                  float dx = x - c[0], dy = y - c[1];
                  return dx * dx + dy * dy <= c[2] * c[2] * 1.5f;
              }

              @Override
              public boolean onTouchEvent(MotionEvent e) {
                  if (e.getAction() != MotionEvent.ACTION_UP) return true;
                  Lay l = layout(getWidth(), getHeight());
                  float x = e.getX(), y = e.getY();
                  if (listener != null) {
                      if (hit(icon(l, 0), x, y)) {
                          listener.onPause();
                          return true;
                      }
                      if (hit(icon(l, 1), x, y)) {
                          listener.onExit();
                          return true;
                      }
                      if (x >= l.mx && x < l.mx + 10 * l.ec && y >= l.y0 && y < l.y0 + 10 * l.ec) {
                          listener.onEmoji();
                          return true;
                      }
                  }
                  int c = (int) Math.floor((x - l.ex) / l.ec), r = (int) Math.floor((y - l.y0) / l.ec);
                  if (c < 0 || r < 0 || c >= 10 || r >= 10) return true;
                  if (listener != null) listener.onShoot(r * 10 + c);
                  return true;
              }
          }
