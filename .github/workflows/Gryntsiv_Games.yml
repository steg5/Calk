                                          showHistory();
                                      }
                                  }).setNegativeButton("Ні", null).show();
                          }
                      }), lp(5.2f, 0.95f, 0.1f));
                  }
                  col.addView(bar, new LinearLayout.LayoutParams(MATCH, WRAP));
                  root.addView(col, new FrameLayout.LayoutParams(MATCH, MATCH));
              }

