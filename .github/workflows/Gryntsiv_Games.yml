                      float[] m = btn[B_MIX];
                      float sw = u * 1.1f, sh = u * 0.56f, sy = m[1] + (m[3] - sh) / 2f;
                      p.setStyle(Paint.Style.FILL);
                      p.setColor(mix ? 0xFF2E7D32 : 0xFF455A64);
                      rf.set(m[0], sy, m[0] + sw, sy + sh);
                      cv.drawRoundRect(rf, sh / 2f, sh / 2f, p);
