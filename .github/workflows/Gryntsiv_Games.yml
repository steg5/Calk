                  rr(c, p, x + s * 0.18f, s * 0.76f, x + s * 0.38f, s * 0.9f, s * 0.04f, 0xFF212121);
                  rr(c, p, x + s * 0.66f, s * 0.76f, x + s * 0.86f, s * 0.9f, s * 0.04f, 0xFF212121);
