              // ---------- розстановка ----------
              private void showPlace(int lvl) {
                  level = lvl;
                  begin(S_PLACE);
                  final PlaceView pv = new PlaceView(this);
                  pv.theme = theme;
                  root.addView(pv, new FrameLayout.LayoutParams(MATCH, MATCH));
                  final Button done = btn("Готово", 0xFF2E7D32, new View.OnClickListener() {
                      public void onClick(View v) {
                          if (!pv.board.allPlaced()) return;
                          startBattle(pv.board);
                      }
                  });
                  pv.listener = new PlaceView.Listener() {
                      public void onChanged() {
                          done.setAlpha(pv.board.allPlaced() ? 1f : 0.4f);
                      }

                      public void onSound(int kind) {
                          snd.play(kind);
                      }
                  };
                  done.setAlpha(0.4f);
                  LinearLayout panel = new LinearLayout(this);
                  panel.setOrientation(LinearLayout.VERTICAL);
                  LinearLayout r1 = new LinearLayout(this);
                  r1.addView(btn("Випадково", 0xFF1565C0, new View.OnClickListener() {
                      public void onClick(View v) {
                          pv.randomize();
                      }
                  }), new LinearLayout.LayoutParams(0, px(0.95f), 1f));
                  r1.addView(btn("Очистити", 0xFF6D4C41, new View.OnClickListener() {
                      public void onClick(View v) {
                          pv.clearAll();
                      }
                  }), new LinearLayout.LayoutParams(0, px(0.95f), 1f));
                  LinearLayout r2 = new LinearLayout(this);
                  r2.addView(btn("Назад", 0xFF455A64, new View.OnClickListener() {
                      public void onClick(View v) {
                          showSea();
                      }
                  }), new LinearLayout.LayoutParams(0, px(0.95f), 1f));
                  r2.addView(done, new LinearLayout.LayoutParams(0, px(0.95f), 1f));
                  for (int i = 0; i < 2; i++) {
                      LinearLayout r = i == 0 ? r1 : r2;
                      for (int k = 0; k < r.getChildCount(); k++) {
                          ((LinearLayout.LayoutParams) r.getChildAt(k).getLayoutParams()).setMargins(px(0.08f), px(0.08f), px(0.08f), px(0.08f));
                      }
                      panel.addView(r, new LinearLayout.LayoutParams(MATCH, WRAP));
                  }
                  panel.addView(tv("Перетягуйте кораблі на поле. Дотик до корабля на полі — повернути.", 0.28f, 0xFFB0BEC5, false), lp(WRAP, WRAP, 0.08f));
                  FrameLayout.LayoutParams fp = new FrameLayout.LayoutParams(px(6.3f), WRAP);
                  fp.gravity = Gravity.BOTTOM | Gravity.RIGHT;
                  fp.setMargins(0, 0, px(0.4f), px(0.5f));
                  root.addView(panel, fp);
              }

              // ---------- бій ----------
              private void startBattle(Board my) {
                  begin(S_BATTLE);
                  mine = my;
                  for (int i = 0; i < mine.shot.length; i++) mine.shot[i] = 0;
                  enemy = new Board();
                  enemy.randomize(rnd);
                  bot = new Bot(level);
                  over = false;
                  bv = new BattleView(this);
                  bv.theme = theme;
                  bv.mine = mine;
                  bv.enemy = enemy;
                  bv.myTurn = rnd.nextBoolean();
                  bv.msg = bv.myTurn ? "Ви починаєте — стріляйте!" : "Першим стріляє бот";
                  bv.listener = new BattleView.Listener() {
                      public void onShoot(int cell) {
                          myShot(cell);
                      }
                  };
                  root.addView(bv, new FrameLayout.LayoutParams(MATCH, MATCH));
                  Button give = btn("Здатися", 0xFF8E2424, new View.OnClickListener() {
                      public void onClick(View v) {
                          askSurrender();
                      }
                  });
                  FrameLayout.LayoutParams fp = new FrameLayout.LayoutParams(px(2.4f), px(0.8f));
                  fp.gravity = Gravity.TOP | Gravity.LEFT;
                  fp.setMargins(px(0.3f), px(0.2f), 0, 0);
                  root.addView(give, fp);
                  if (!bv.myTurn) botLater(900);
              }

              private void myShot(int cell) {
                  if (over || !bv.myTurn || enemy.shot[cell] != 0) return;
                  int res = enemy.shoot(cell);
                  bv.lastEnemy = cell;
                  sounds(res);
                  if (enemy.allSunk()) {
                      bv.msg = "Усі кораблі бота потоплено!";
                      endGame(true);
                  } else if (res == 0) {
                      bv.msg = "Мимо. Хід бота";
                      bv.myTurn = false;
                      botLater(1000);
                  } else {
                      bv.msg = res == 2 ? "Потоплено! Стріляйте ще" : "Влучили! Стріляйте ще";
                  }
                  bv.invalidate();
              }

              private void botLater(int ms) {
                  final int g = gen;
                  ui.postDelayed(new Runnable() {
                      public void run() {
                          if (g == gen && !over) botShot();
                      }
                  }, ms);
              }

              private void botShot() {
                  int cell = bot.next(mine);
                  int res = mine.shoot(cell);
                  bv.lastMine = cell;
                  sounds(res);
                  if (mine.allSunk()) {
                      bv.msg = "Бот потопив усі ваші кораблі";
                      endGame(false);
                  } else if (res == 0) {
                      bv.msg = "Бот схибив. Ваш хід";
                      bv.myTurn = true;
                  } else {
                      bv.msg = res == 2 ? "Бот потопив ваш корабель" : "Бот влучив";
                      botLater(900);
                  }
                  bv.invalidate();
              }

              private void sounds(final int res) {
                  snd.play(Snd.SHOT);
                  final int g = gen;
                  ui.postDelayed(new Runnable() {
                      public void run() {
                          if (g == gen) snd.play(res == 0 ? Snd.MISS : (res == 1 ? Snd.HIT : Snd.SUNK));
                      }
                  }, 260);
              }

              private void endGame(final boolean win) {
                  over = true;
                  bv.myTurn = false;
                  bv.reveal = true;
                  final int g = gen;
                  ui.postDelayed(new Runnable() {
                      public void run() {
                          if (g != gen) return;
                          snd.play(win ? Snd.WIN : Snd.LOSE);
                          showEnd(win);
                      }
                  }, 1300);
              }

              private void showEnd(boolean win) {
                  LinearLayout box = column();
                  box.addView(tv(win ? "Перемога!" : "Поразка", 0.8f, win ? 0xFF69F0AE : 0xFFFF8A80, true), lp(WRAP, WRAP, 0.1f));
                  box.addView(tv(win ? "Флот бота знищено" : "Ваш флот знищено", 0.38f, WHITE, false), lp(WRAP, WRAP, 0.1f));
                  LinearLayout row = new LinearLayout(this);
                  row.addView(btn("Реванш", 0xFF2E7D32, new View.OnClickListener() {
                      public void onClick(View v) {
                          showPlace(level);
                      }
                  }), lp(3.2f, 1.0f, 0.1f));
                  row.addView(btn("В меню", 0xFF1565C0, new View.OnClickListener() {
                      public void onClick(View v) {
                          showSea();
                      }
                  }), lp(3.2f, 1.0f, 0.1f));
                  box.addView(row);
                  LinearLayout wrap = new LinearLayout(this);
                  wrap.setOrientation(LinearLayout.VERTICAL);
                  wrap.setBackground(bg(0xFF263238, 0.3f));
                  wrap.setPadding(px(0.5f), px(0.4f), px(0.5f), px(0.4f));
                  wrap.addView(box);
                  Dialog d = new Dialog(this, android.R.style.Theme_DeviceDefault_Dialog_NoActionBar);
                  d.setContentView(wrap);
                  d.setCancelable(false);
                  if (d.getWindow() != null) d.getWindow().setBackgroundDrawable(new ColorDrawable(Color.TRANSPARENT));
                  endDlg = d;
                  d.show();
              }

              private void askSurrender() {
                  if (over) return;
                  new AlertDialog.Builder(this).setTitle("Здатися?")
                      .setPositiveButton("Так", new DialogInterface.OnClickListener() {
                          public void onClick(DialogInterface d, int w) {
                              showSea();
                          }
                      }).setNegativeButton("Ні", null).show();
              }

              // ---------- налаштування ----------
              private class Prev extends View {
                  private final Paint p = new Paint(Paint.ANTI_ALIAS_FLAG);

                  Prev(MainActivity a) {
                      super(a);
                  }

                  @Override
                  protected void onDraw(Canvas c) {
                      float cell = u * 0.9f;
                      Painter.draw(c, p, theme, u * 0.2f, u * 0.2f, cell, 4, true, 0);
                      Painter.draw(c, p, theme, u * 0.2f, u * 1.3f, cell, 3, true, 1);
                      Painter.draw(c, p, theme, u * 0.2f + cell * 4.3f, u * 0.2f, cell, 2, true, 3);
                      Painter.draw(c, p, theme, u * 0.2f + cell * 4.3f, u * 1.3f, cell, 1, true, 2);
                      Painter.draw(c, p, theme, u * 0.2f + cell * 6.0f, u * 1.3f, cell, 3, false, 4);
                  }
              }

              private void showSettings() {
                  final int back = screen == S_SEA ? S_SEA : S_MENU;
                  begin(S_SET);
                  LinearLayout col = column();
                  col.addView(tv("Налаштування", 0.7f, 0xFFFFD54F, true), lp(WRAP, WRAP, 0.1f));
                  col.addView(tv("Тема фігур", 0.4f, WHITE, false), lp(WRAP, WRAP, 0.08f));
                  final Prev prev = new Prev(this);
                  final Button[] tb = new Button[Painter.THEMES.length];
                  LinearLayout row = new LinearLayout(this);
                  for (int k = 0; k < tb.length; k++) {
                      final int tk = k;
                      tb[k] = btn(Painter.THEMES[k], k == theme ? 0xFF2E7D32 : 0xFF455A64, new View.OnClickListener() {
                          public void onClick(View v) {
                              theme = tk;
                              sp.edit().putInt("theme", theme).commit();
                              for (int j = 0; j < tb.length; j++) tb[j].setBackground(bg(j == theme ? 0xFF2E7D32 : 0xFF455A64, 0.2f));
                              prev.invalidate();
                          }
                      });
                      row.addView(tb[k], lp(2.8f, 0.95f, 0.06f));
                  }
                  col.addView(row);
                  col.addView(prev, lp(9.5f, 2.4f, 0.1f));
                  final Button sb = btn(snd.sound ? "Звук: увімкнено" : "Звук: вимкнено", snd.sound ? 0xFF2E7D32 : 0xFF455A64, null);
                  sb.setOnClickListener(new View.OnClickListener() {
                      public void onClick(View v) {
                          snd.setSound(!snd.sound);
                          snd.play(Snd.BTN);
                          sb.setText(snd.sound ? "Звук: увімкнено" : "Звук: вимкнено");
                          sb.setBackground(bg(snd.sound ? 0xFF2E7D32 : 0xFF455A64, 0.2f));
                      }
                  });
                  col.addView(sb, lp(7.5f, 1.0f, 0.1f));
                  col.addView(btn("Готово", 0xFF1565C0, new View.OnClickListener() {
                      public void onClick(View v) {
                          if (back == S_SEA) showSea();
                          else showMenu();
                      }
                  }), lp(7.5f, 1.0f, 0.1f));
                  root.addView(col, new FrameLayout.LayoutParams(MATCH, MATCH));
              }

              @Override
              public void onBackPressed() {
                  if (screen == S_MENU) {
                      finish();
                  } else if (screen == S_SEA) {
                      showMenu();
                  } else if (screen == S_PLACE) {
                      showSea();
                  } else if (screen == S_BATTLE) {
                      askSurrender();
                  } else {
                      if (prevScreen == S_SEA) showSea();
                      else showMenu();
                  }
              }
          }
