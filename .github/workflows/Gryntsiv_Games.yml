          public class BattleView extends View {
              public interface Listener {
                  void onShoot(int cell);

                  void onEmoji();

                  void onPause();

                  void onExit();
              }

              public static class Lay {
                  public float u, ec, mx, ex, y0, midX, midW;
              }

              public static Lay layout(float W, float H) {
                  Lay l = new Lay();
                  l.u = Math.min(W / 16f, H / 9f);
                  float u = l.u;
                  l.ec = Math.min(H * 0.74f / 10f, (W - 1.2f * u - 5.0f * u) / 20f);
                  l.midW = Math.min(W - 1.2f * u - 20 * l.ec, 6.5f * u);
                  float total = 20 * l.ec + l.midW;
                  l.mx = (W - total) / 2f + 0.15f * u;
                  l.midX = l.mx + 10 * l.ec;
                  l.ex = l.midX + l.midW;
                  l.y0 = (H - 10 * l.ec) / 2f + 0.7f * u;
                  return l;
              }

              public Board mine, enemy;
              public Listener listener;
              public int theme;
              public String msg = "", myName = "", enemyName = "";
              public boolean myTurn, reveal;
              public int pausedBy; // 0 ні, 1 я, 2 суперник
              public int lastMine = -1, lastEnemy = -1;
              private String banner = "";
              private int bannerColor;
              private long bannerStart, bannerUntil;
              private String emoMine = "", emoEnemy = "";
              private long emoMineUntil, emoEnemyUntil;
              private final Paint p = new Paint(Paint.ANTI_ALIAS_FLAG);
              private final RectF rf = new RectF();

              public BattleView(Context c) {
                  super(c);
              }

              public void showEmoji(boolean forMe, String e) {
                  long until = System.currentTimeMillis() + 2600;
                  if (forMe) {
                      emoMine = e;
                      emoMineUntil = until;
                  } else {
                      emoEnemy = e;
                      emoEnemyUntil = until;
                  }
                  invalidate();
              }

              private float zoneCx(Lay l) {
                  return (l.midX + 0.1f * l.u + l.ex - 0.85f * l.ec) / 2f;
              }

              private float[] icon(Lay l, int i) {
                  float bottom = l.y0 + 10 * l.ec - 0.55f * l.u;
                  return new float[]{zoneCx(l), bottom - (2 - i) * 1.05f * l.u, 0.44f * l.u};
              }

              public void banner(String s, int color, long ms) {
                  banner = s;
                  bannerColor = color;
                  bannerStart = System.currentTimeMillis();
                  bannerUntil = bannerStart + ms;
                  invalidate();
              }

              private void circleBtn(Canvas cv, float[] c, int color) {
                  p.setStyle(Paint.Style.FILL);
                  p.setColor(color);
                  cv.drawCircle(c[0], c[1], c[2], p);
              }

              private void nameLabel(Canvas cv, String s, float x, float y, float maxW, float u) {
                  p.setStyle(Paint.Style.FILL);
                  p.setTextAlign(Paint.Align.LEFT);
                  p.setColor(0xFFE0E6EA);
                  p.setTextSize(u * 0.4f);
                  float w = p.measureText(s);
                  if (w > maxW) p.setTextSize(u * 0.4f * maxW / w);
                  cv.drawText(s, x, y, p);
              }

              @Override
              protected void onDraw(Canvas cv) {
                  Lay l = layout(getWidth(), getHeight());
                  float u = l.u;
                  cv.drawColor(Scheme.cur.bg);
                  if (mine == null || enemy == null) return;
                  Painter.board(cv, p, enemy, l.ex, l.y0, l.ec, reveal, theme, lastEnemy, true);
                  Painter.board(cv, p, mine, l.mx, l.y0, l.ec, true, theme, lastMine, true);
                  p.setStyle(Paint.Style.FILL);
                  p.setTextAlign(Paint.Align.CENTER);
                  p.setTextSize(u * 0.42f);
                  float mw = p.measureText(msg);
                  if (mw > getWidth() * 0.9f) p.setTextSize(u * 0.42f * getWidth() * 0.9f / mw);
                  p.setColor(myTurn ? 0xFF69F0AE : 0xFFFFD54F);
                  cv.drawText(msg, getWidth() / 2f, u * 0.62f, p);
                  p.setStyle(Paint.Style.FILL);
                  p.setColor(0x44000000);
                  rf.set(l.mx, l.y0, l.mx + 10 * l.ec, l.y0 + 10 * l.ec);
                  cv.drawRoundRect(rf, l.ec * 0.12f, l.ec * 0.12f, p);
                  nameLabel(cv, myName, l.mx, l.y0 - l.ec * 0.85f, l.ec * 10, u);
                  nameLabel(cv, enemyName, l.ex, l.y0 - l.ec * 0.85f, l.ec * 10, u);
                  // флот ворога посередині
                  p.setTextAlign(Paint.Align.CENTER);
                  p.setTextSize(u * 0.32f);
                  p.setColor(0xFFB0BEC5);
                  float cx = zoneCx(l);
                  float zone = l.ex - 0.85f * l.ec - (l.midX + 0.1f * u);
                  cv.drawText("Флот ворога", cx, l.y0 + u * 0.3f, p);
                  float fc = Math.min(0.5f * u, (zone - 0.3f * u) / 6.6f), gap = fc * 0.4f, rowH = fc * 1.25f;
                  int n = enemy.ships.length;
                  int[] row = new int[n];
                  float[] rowW = new float[12];
                  int r = 0;
                  for (int i = 0; i < n; i++) {
                      if (i > 0 && enemy.ships[i].len != enemy.ships[i - 1].len) r++;
                      row[i] = r;
                      rowW[r] += (rowW[r] > 0 ? gap : 0) + enemy.ships[i].len * fc;
                  }
                  float maxW = 0;
                  for (int i = 0; i <= r; i++) maxW = Math.max(maxW, rowW[i]);
                  float left = cx - maxW / 2f;
                  float[] pos = new float[12];
                  for (int i = 0; i < n; i++) {
                      Board.Ship s = enemy.ships[i];
                      float x = left + pos[row[i]];
                      float y = l.y0 + u * 0.55f + row[i] * rowH;
                      int th = s.theme >= 0 ? s.theme : theme;
                      Painter.draw(cv, p, th, x, y, fc, s.len, true, s.idx);
                      if (enemy.sunk(s)) {
                          p.setStyle(Paint.Style.FILL);
                          p.setColor(0x88B71C1C);
                          rf.set(x, y + fc * 0.05f, x + s.len * fc, y + fc * 0.95f);
                          cv.drawRoundRect(rf, fc * 0.15f, fc * 0.15f, p);
                      }
                      pos[row[i]] += s.len * fc + gap;
                  }
                  // кнопки-значки
                  float[] c0 = icon(l, 0), c1 = icon(l, 1), c2 = icon(l, 2);
                  circleBtn(cv, c0, 0xFF6A1B9A);
                  p.setTextAlign(Paint.Align.CENTER);
                  p.setTextSize(u * 0.6f);
                  p.setColor(0xFFFFFFFF);
                  cv.drawText("😀", c0[0], c0[1] + u * 0.21f, p);
                  circleBtn(cv, c1, pausedBy == 2 ? 0x88455A64 : 0xFF455A64);
                  p.setColor(0xFFFFFFFF);
                  float k = c1[2] * 0.5f;
                  if (pausedBy == 1) {
                      android.graphics.Path q = new android.graphics.Path();
                      q.moveTo(c1[0] - k * 0.7f, c1[1] - k);
                      q.lineTo(c1[0] + k * 1.0f, c1[1]);
                      q.lineTo(c1[0] - k * 0.7f, c1[1] + k);
                      q.close();
                      cv.drawPath(q, p);
                  } else {
                      cv.drawRect(c1[0] - k * 0.8f, c1[1] - k, c1[0] - k * 0.2f, c1[1] + k, p);
                      cv.drawRect(c1[0] + k * 0.2f, c1[1] - k, c1[0] + k * 0.8f, c1[1] + k, p);
                  }
                  circleBtn(cv, c2, 0xFF8E2424);
                  p.setColor(0xFFFFFFFF);
                  p.setStyle(Paint.Style.FILL);
                  rf.set(c2[0] - k * 1.0f, c2[1] - k * 1.1f, c2[0] - k * 0.05f, c2[1] + k * 1.1f);
                  cv.drawRoundRect(rf, k * 0.1f, k * 0.1f, p);
                  p.setColor(0xFF8E2424);
                  cv.drawCircle(c2[0] - k * 0.3f, c2[1], k * 0.09f, p);
                  p.setColor(0xFFFFFFFF);
                  p.setStyle(Paint.Style.STROKE);
                  p.setStrokeWidth(k * 0.22f);
                  cv.drawLine(c2[0] + k * 0.2f, c2[1], c2[0] + k * 1.0f, c2[1], p);
                  p.setStyle(Paint.Style.FILL);
                  android.graphics.Path ar = new android.graphics.Path();
                  ar.moveTo(c2[0] + k * 1.25f, c2[1]);
                  ar.lineTo(c2[0] + k * 0.8f, c2[1] - k * 0.38f);
                  ar.lineTo(c2[0] + k * 0.8f, c2[1] + k * 0.38f);
                  ar.close();
                  cv.drawPath(ar, p);
                  p.setStyle(Paint.Style.FILL);
                  long now = System.currentTimeMillis();
                  boolean anim = false;
                  if (emoMineUntil > now) {
                      emo(cv, emoMine, l.mx + 5 * l.ec, l.y0 + 5 * l.ec, emoMineUntil - now, u);
                      anim = true;
                  }
                  if (emoEnemyUntil > now) {
                      emo(cv, emoEnemy, l.ex + 5 * l.ec, l.y0 + 5 * l.ec, emoEnemyUntil - now, u);
                      anim = true;
                  }
                  if (bannerUntil > now) {
                      long el = now - bannerStart, left2 = bannerUntil - now;
                      float sc = el < 250 ? 0.5f + 0.5f * el / 250f : 1f;
                      float al = left2 < 350 ? left2 / 350f : 1f;
                      p.setTextAlign(Paint.Align.CENTER);
                      p.setTextSize(u * 1.6f * sc);
                      float by = l.y0 + 5 * l.ec + u * 0.6f * sc;
                      p.setStyle(Paint.Style.STROKE);
                      p.setStrokeWidth(u * 0.14f);
                      p.setColor(0xFF000000);
                      p.setAlpha((int) (255 * al));
                      cv.drawText(banner, getWidth() / 2f, by, p);
                      p.setStyle(Paint.Style.FILL);
                      p.setColor(bannerColor);
                      p.setAlpha((int) (255 * al));
                      cv.drawText(banner, getWidth() / 2f, by, p);
                      p.setAlpha(255);
                      anim = true;
                  }
                  if (anim) postInvalidateDelayed(40);
              }

              private void emo(Canvas cv, String e, float x, float y, long left, float u) {
                  float k = left > 400 ? 1f : left / 400f;
                  p.setTextAlign(Paint.Align.CENTER);
                  p.setTextSize(u * 2.2f * (0.6f + 0.4f * k));
                  p.setAlpha((int) (255 * k));
                  p.setColor(0xFFFFFFFF);
                  cv.drawText(e, x, y + u * 0.7f, p);
                  p.setAlpha(255);
              }

              private boolean hit(float[] c, float x, float y) {
                  float dx = x - c[0], dy = y - c[1];
                  return dx * dx + dy * dy <= c[2] * c[2] * 1.5f;
              }

              @Override
              public boolean onTouchEvent(MotionEvent e) {
                  if (e.getAction() != MotionEvent.ACTION_UP) return true;
                  Lay l = layout(getWidth(), getHeight());
                  float x = e.getX(), y = e.getY();
                  if (listener != null) {
                      if (hit(icon(l, 0), x, y)) {
                          listener.onEmoji();
                          return true;
                      }
                      if (hit(icon(l, 1), x, y)) {
                          listener.onPause();
                          return true;
                      }
                      if (hit(icon(l, 2), x, y)) {
                          listener.onExit();
                          return true;
                      }
                  }
                  int c = (int) Math.floor((x - l.ex) / l.ec), r = (int) Math.floor((y - l.y0) / l.ec);
                  if (c < 0 || r < 0 || c >= 10 || r >= 10) return true;
                  if (listener != null) listener.onShoot(r * 10 + c);
                  return true;
              }
          }
