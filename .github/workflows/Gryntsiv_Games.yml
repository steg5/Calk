              private Bot bot;
              private BattleView bv;
              private boolean over;
              private Dialog endDlg;

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  sp = getSharedPreferences("gg", MODE_PRIVATE);
                  theme = sp.getInt("theme", 0);
                  snd = new Snd(this, sp);
                  DisplayMetrics dm = getResources().getDisplayMetrics();
                  float big = Math.max(dm.widthPixels, dm.heightPixels);
                  float small = Math.min(dm.widthPixels, dm.heightPixels);
                  u = Math.min(big / 16f, small / 9f);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                  root = new FrameLayout(this);
