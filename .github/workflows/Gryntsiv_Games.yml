                  rr(c, p, x + s * 0.06f, s * 0.2f, x + s * 0.95f, s * 0.8f, s * 0.17f, shade(col, 0.7f));
                  rr(c, p, x + s * 0.08f, s * 0.21f, x + s * 0.93f, s * 0.76f, s * 0.15f, col);
                  rr(c, p, x + s * 0.12f, s * 0.23f, x + s * 0.9f, s * 0.38f, s * 0.08f, shade(col, 1.25f));
                  if (type == 2) {
