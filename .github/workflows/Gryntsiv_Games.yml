          package com.example.gryntsivgames;

          import android.os.Handler;
          import android.os.Looper;

          import java.net.InetSocketAddress;
          import java.net.ServerSocket;
          import java.net.Socket;

          // Зв'язок двох гравців: господар (кімната) і гість. Wi-Fi та інтернет можуть працювати одночасно.
          public class Net {
              public static final int PORT = 45464;

              public interface Cb {
                  void onConnected(String nick, int avatar);

                  void onLine(String line);

                  void onLost();

                  void onFail(String msg);

                  void onRoom(String code);
              }

              private final Handler h = new Handler(Looper.getMainLooper());
              private final Cb cb;
              private volatile boolean closed;
              public boolean host;

              // господар
              private String cid = "";
              private ServerSocket server;
              private Discovery.Announcer ann;
              private Relay.HostSide rel;
              private Link peer;
              private String peerCid = "";
              private boolean peerRelay;
              private boolean wifiOn, netOn;
              private volatile String code = "";
              private volatile boolean netBusy;
              private String wantCode = "";
              private String myNick = "Гравець";
              private int myAvatar;
              private boolean locked;

              // гість
              private Client client;

              public Net(Cb cb) {
                  this.cb = cb;
              }

              public void setInfo(String nick, int avatar) {
                  myNick = nick.replace("|", " ");
                  myAvatar = avatar;
              }

              public String hello() {
                  return "HELLO|" + myNick + "|" + myAvatar;
              }

              public void lock(boolean on) {
                  locked = on;
                  if (ann != null) ann.count = on || peer != null ? 2 : 1;
              }

              public void kick() {
                  Link p = peer;
                  if (p != null) {
                      p.send("KICK");
                      dropPeer();
                  }
              }

              public boolean isWifi() {
                  return wifiOn;
              }

              public boolean isInternet() {
                  return netOn;
              }

              public boolean isBusy() {
                  return netBusy;
              }

              public String code() {
                  return code;
              }

              // ---------- господар ----------
              public void startHost(String cid, String wantCode) {
                  host = true;
                  this.cid = cid;
                  this.wantCode = wantCode == null ? "" : wantCode;
                  setWifi(true);
                  tick();
              }

              private void tick() {
                  h.postDelayed(new Runnable() {
                      public void run() {
                          if (closed || !host) return;
                          if (peer != null && peerRelay && rel != null && System.currentTimeMillis() - rel.lastRx(peerCid) > 30000) {
                              dropPeer();
                          }
                          tick();
                      }
                  }, 5000);
              }

              public void setWifi(boolean on) {
                  if (!host || closed) return;
                  if (on == wifiOn) return;
                  if (on) {
                      try {
                          final ServerSocket ss = new ServerSocket();
                          ss.setReuseAddress(true);
                          ss.bind(new InetSocketAddress(PORT));
                          server = ss;
                          Thread t = new Thread(new Runnable() {
                              public void run() {
                                  while (!closed && !ss.isClosed()) {
                                      try {
                                          Socket s = ss.accept();
                                          s.setTcpNoDelay(true);
                                          accepted(s);
                                      } catch (Exception e) {
                                          if (ss.isClosed()) return;
                                      }
                                  }
                              }
                          });
                          t.setDaemon(true);
                          t.start();
                          ann = new Discovery.Announcer("Морський бій", PORT);
                          ann.count = peer == null ? 1 : 2;
                          ann.start();
                          wifiOn = true;
                      } catch (Exception e) {
                          cb.onFail("Не вдалося відкрити Wi-Fi кімнату");
                      }
                  } else {
                      wifiOn = false;
                      try {
                          if (server != null) server.close();
                      } catch (Exception e) {
                          // ignore
                      }
                      server = null;
                      if (ann != null) ann.stop();
                      ann = null;
                      if (peer != null && !peerRelay) dropPeer();
                  }
              }

              private void accepted(Socket s) {
                  final Link.SocketLink l = new Link.SocketLink(s);
                  l.readLoop(new Link.LineSink() {
                      public void onLine(final String line) {
                          h.post(new Runnable() {
                              public void run() {
                                  fromPeer(l, "", false, line);
                              }
                          });
                      }

                      public void onClosed() {
                          h.post(new Runnable() {
                              public void run() {
                                  if (peer == l) dropPeer();
                              }
                          });
                      }
                  });
              }

              private void fromPeer(Link l, String c, boolean relay, String line) {
                  if (closed) return;
                  if (line.startsWith("HELLO")) {
                      if (peer == null && !locked) {
                          peer = l;
                          peerCid = c;
                          peerRelay = relay;
                          if (ann != null) ann.count = 2;
                          l.send("WELCOME|" + myNick + "|" + myAvatar);
                          String[] f = line.split("\\|", -1);
                          cb.onConnected(f.length > 1 ? f[1] : "Гравець", f.length > 2 ? num(f[2]) : 0);
                      } else if (peer != l) {
                          l.send("FULL");
                          l.close();
                      }
                      return;
                  }
                  if (peer != l) return;
                  if (line.equals("BYE")) {
                      dropPeer();
                      return;
                  }
                  cb.onLine(line);
              }

              private static int num(String s) {
                  try {
                      return Integer.parseInt(s.trim());
                  } catch (Exception e) {
                      return 0;
                  }
              }

              private void dropPeer() {
                  Link p = peer;
                  peer = null;
                  peerCid = "";
                  if (ann != null) ann.count = locked ? 2 : 1;
                  if (p != null) {
                      p.close();
                      cb.onLost();
                  }
              }

              public void setInternet(boolean on) {
                  if (!host || closed) return;
                  if (!on) {
                      netOn = false;
                      code = "";
                      if (rel != null) rel.stop();
                      rel = null;
                      if (peer != null && peerRelay) dropPeer();
                      cb.onRoom("");
                      return;
                  }
                  if (netOn || netBusy) return;
                  netBusy = true;
                  final Relay.HostSide hs = new Relay.HostSide(cid, wantCode, new Relay.HostSide.Cb() {
                      public void onLine(final String c, final String line) {
                          h.post(new Runnable() {
                              public void run() {
                                  if (rel == null) return;
                                  Link l;
                                  if (peer != null && peerRelay && c.equals(peerCid)) {
                                      l = peer;
                                  } else {
                                      l = rel.newLink(c);
                                  }
                                  fromPeer(l, c, true, line);
                              }
                          });
                      }

                      public void onReady(final String cd) {
                          h.post(new Runnable() {
                              public void run() {
                                  netBusy = false;
                                  if (closed || rel == null) return;
                                  code = cd;
                                  netOn = true;
                                  cb.onRoom(cd);
                              }
                          });
                      }

                      public void onError(final String msg) {
                          h.post(new Runnable() {
                              public void run() {
                                  netBusy = false;
                                  rel = null;
                                  cb.onFail(msg);
                                  cb.onRoom("");
                              }
                          });
                      }
                  });
                  rel = hs;
                  hs.start();
              }

              // ---------- гість ----------
              private Client.Cb guestCb() {
                  return new Client.Cb() {
                      public void onLine(String line) {
                          if (line.startsWith("WELCOME")) {
                              String[] f = line.split("\\|", -1);
                              cb.onConnected(f.length > 1 ? f[1] : "Гравець", f.length > 2 ? num(f[2]) : 0);
                          } else if (line.equals("FULL")) {
                              cb.onFail("У кімнаті вже є суперник");
                          } else if (line.equals("BYE")) {
                              cb.onLost();
                          } else {
                              cb.onLine(line);
                          }
                      }

                      public void onClosed() {
                          cb.onLost();
                      }

                      public void onFail() {
                          String m = client == null ? "" : client.failMsg;
                          cb.onFail(m.length() > 0 ? m : "Не вдалося підключитися");
                      }
                  };
              }

              public void joinLan(String ip, int port) {
                  host = false;
                  client = new Client();
                  client.connect(ip, port, hello(), guestCb());
              }

              public void joinCode(String code, String cid) {
                  host = false;
                  client = new Client();
                  client.connectRelay(code, cid, hello(), guestCb());
              }

              // ---------- спільне ----------
              public void send(String line) {
                  if (host) {
                      Link p = peer;
                      if (p != null) p.send(line);
                  } else if (client != null) {
                      client.send(line);
                  }
              }

              public boolean connected() {
                  return host ? peer != null : client != null;
              }

              public void close() {
                  if (closed) return;
                  if (host) {
                      Link p = peer;
                      if (p != null) p.send("BYE");
                  }
                  closed = true;
                  try {
                      if (server != null) server.close();
                  } catch (Exception e) {
                      // ignore
                  }
                  if (ann != null) ann.stop();
                  if (rel != null) rel.stop();
                  Link p = peer;
                  peer = null;
                  if (p != null) p.close();
                  if (client != null) client.close();
              }
          }
