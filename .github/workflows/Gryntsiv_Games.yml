              // ---------- розстановка ----------
              private void showPlace(int lvl) {
                  if (lvl >= 0) level = lvl;
                  resetMatchFlags();
                  begin(S_PLACE);
                  final PlaceView pv = new PlaceView(this);
                  pview = pv;
                  pv.theme = theme;
                  pv.mix = sp.getBoolean("sbMix", false);
                  root.addView(pv, new FrameLayout.LayoutParams(MATCH, MATCH));
                  pv.listener = new PlaceView.Listener() {
                      public void onChanged() {
                      }

                      public void onSound(int kind) {
                          snd.play(kind);
                      }

                      public void onTheme(int t) {
                          theme = t;
                          sp.edit().putInt("sbTheme", t).commit();
                      }

                      public void onMix(boolean on) {
                          sp.edit().putBoolean("sbMix", on).commit();
                      }

                      public void onBack() {
                          showSea();
                      }

                      public void onDone() {
                          if (!pv.board.allPlaced() || myReady) return;
                          if (!mp) {
                              startBattle(pv.board);
                              return;
                          }
                          myReady = true;
                          pv.locked = true;
                          myBoard = pv.board;
                          pv.status = "Чекаємо суперника…";
                          net.send("READY");
                          checkStart();
                      }
                  };
              }

              private void checkStart() {
                  if (!mp || net == null || !net.host || started) return;
                  if (myReady && peerReady) {
                      started = true;
                      int first = rnd.nextInt(2); // 0 — господар
                      net.send("START|" + first);
                      beginBattleMp(first == 0);
                  }
              }

              // ---------- бій ----------
              private void buildBattle() {
                  begin(S_BATTLE);
                  over = false;
                  pausedBy = 0;
                  awaiting = false;
                  bv = new BattleView(this);
                  bv.theme = theme;
                  bv.mine = mine;
                  bv.enemy = enemy;
                  bv.myName = nick;
                  bv.enemyName = mp ? (peerNick == null ? "Суперник" : peerNick) : "Бот " + botName;
                  bv.listener = new BattleView.Listener() {
                      public void onShoot(int cell) {
                          myShot(cell);
                      }

                      public void onEmoji() {
                          showEmoji();
                      }

                      public void onPause() {
                          togglePause();
                      }

                      public void onExit() {
                          askExit();
                      }
                  };
                  root.addView(bv, new FrameLayout.LayoutParams(MATCH, MATCH));
                  bv.banner("До бою", 0xFFFFD54F, 1500);
              }

              private void setMsg(String s) {
                  lastMsg = s;
                  if (bv == null) return;
                  if (pausedBy == 1) bv.msg = "Пауза — натисніть ▶, щоб продовжити";
                  else if (pausedBy == 2) bv.msg = "Суперник поставив паузу";
                  else bv.msg = s;
                  bv.pausedBy = pausedBy;
                  bv.invalidate();
              }

              private void startBattle(Board my) {
                  mine = my;
                  mine.baseTheme = theme;
                  for (int i = 0; i < mine.shot.length; i++) mine.shot[i] = 0;
                  enemy = new Board();
                  enemy.baseTheme = theme;
                  enemy.randomize(rnd);
                  if (sp.getBoolean("sbMix", false)) {
                      for (Board.Ship s : enemy.ships) s.theme = rnd.nextInt(Painter.THEMES.length);
                  }
                  bot = new Bot(level);
                  if (botName.length() == 0) botName = BOT_NAMES[rnd.nextInt(BOT_NAMES.length)];
                  buildBattle();
                  myTurn = rnd.nextBoolean();
                  bv.myTurn = myTurn;
                  setMsg(myTurn ? "Ви починаєте — стріляйте!" : "Першим стріляє бот");
                  if (!myTurn) botLater(900);
              }

              private void beginBattleMp(boolean iFirst) {
                  mine = myBoard;
                  mine.baseTheme = theme;
                  for (int i = 0; i < mine.shot.length; i++) mine.shot[i] = 0;
                  enemy = new Board();
                  enemy.baseTheme = theme;
                  buildBattle();
                  myTurn = iFirst;
                  bv.myTurn = myTurn;
                  setMsg(myTurn ? "Ви починаєте — стріляйте!" : "Суперник починає");
              }

              private void myShot(int cell) {
                  if (over) return;
                  if (!myTurn || awaiting || pausedBy != 0 || System.currentTimeMillis() < busyUntil) {
                      if (enemy.shot[cell] == 0) bv.cross(cell);
                      return;
                  }
                  if (enemy.shot[cell] != 0) return;
                  bv.lastEnemy = cell;
                  if (mp) {
                      awaiting = true;
                      net.send("SHOT|" + cell);
                      bv.invalidate();
                      return;
                  }
                  int res = enemy.shoot(cell);
                  sounds(res);
                  bv.pulse(true, cell, res);
                  if (enemy.allSunk()) {
                      setMsg("Усі кораблі бота потоплено!");
                      endGame(true);
                  } else if (res == 0) {
                      setMsg("Мимо. Хід бота");
                      myTurn = false;
                      bv.myTurn = false;
                      botLater(1000);
                  } else {
                      setMsg(res == 2 ? "Потоплено! Стріляйте ще" : "Влучили! Стріляйте ще");
                  }
                  bv.invalidate();
              }

              private void botLater(int ms) {
                  final int g = gen;
                  ui.postDelayed(new Runnable() {
                      public void run() {
                          if (g == gen && !over) botShot();
                      }
                  }, ms);
              }

              private void botShot() {
                  long wait = busyUntil - System.currentTimeMillis();
                  if (pausedBy != 0 || wait > 0) {
                      botLater(pausedBy != 0 ? 500 : (int) wait + 50);
                      return;
                  }
                  int cell = bot.next(mine);
                  int res = mine.shoot(cell);
                  bv.lastMine = cell;
                  sounds(res);
                  bv.pulse(false, cell, res);
                  if (mine.allSunk()) {
                      setMsg("Бот потопив усі ваші кораблі");
                      endGame(false);
                  } else if (res == 0) {
                      setMsg("Бот схибив. Ваш хід");
                      myTurn = true;
                      bv.myTurn = true;
                  } else {
                      setMsg(res == 2 ? "Бот потопив ваш корабель" : "Бот влучив");
                      botLater(900);
                  }
                  bv.invalidate();
              }

              private void sounds(int res) {
                  snd.play(res == 0 ? Snd.MISS : (res == 1 ? Snd.HIT : Snd.SUNK));
                  busyUntil = System.currentTimeMillis() + (res == 0 ? 800 : 1100);
              }

              private void handleNet(String line) {
                  String[] f = line.split("\\|", -1);
                  String c = f[0];
                  try {
                      if (c.equals("GO")) {
                          if (screen == S_LOBBY && net != null && !net.host) showPlace(-1);
                      } else if (c.equals("KICK")) {
                          say("Господар вилучив вас з кімнати");
                          showSea();
                      } else if (c.equals("READY")) {
                          peerReady = true;
                          checkStart();
                      } else if (c.equals("START")) {
                          if (!mp || started) return;
                          started = true;
                          beginBattleMp(f[1].equals("1"));
                      } else if (c.equals("SHOT")) {
                          if (screen != S_BATTLE || over) return;
                          int cell = Integer.parseInt(f[1]);
                          String ans = mine.answer(cell);
                          net.send(ans);
                          String[] rf = ans.split("\\|", -1);
                          int res = Integer.parseInt(rf[2]);
                          boolean fin = rf[4].equals("1");
                          bv.lastMine = cell;
                          sounds(res);
                          bv.pulse(false, cell, res);
                          if (fin) {
                              setMsg("Суперник потопив усі ваші кораблі");
                              endGame(false);
                          } else if (res == 0) {
                              setMsg("Суперник схибив. Ваш хід");
                              myTurn = true;
                              bv.myTurn = true;
                          } else {
                              setMsg(res == 2 ? "Суперник потопив ваш корабель" : "Суперник влучив");
                          }
                          bv.invalidate();
                      } else if (c.equals("RES")) {
                          if (screen != S_BATTLE || over) return;
                          awaiting = false;
                          enemy.applyRes(f);
                          int res = Integer.parseInt(f[2]);
                          bv.lastEnemy = Integer.parseInt(f[1]);
                          sounds(res);
                          bv.pulse(true, bv.lastEnemy, res);
                          if (f[4].equals("1")) {
                              setMsg("Усі кораблі суперника потоплено!");
                              endGame(true);
                          } else if (res == 0) {
                              setMsg("Мимо. Хід суперника");
                              myTurn = false;
                              bv.myTurn = false;
                          } else {
                              setMsg(res == 2 ? "Потоплено! Стріляйте ще" : "Влучили! Стріляйте ще");
                          }
                          bv.invalidate();
                      } else if (c.equals("EMO")) {
                          int k = Integer.parseInt(f[1]);
                          if (bv != null && screen == S_BATTLE && k >= 0 && k < EMOJI.length) bv.showEmoji(false, EMOJI[k]);
                      } else if (c.equals("PAUSE")) {
                          if (f[1].equals("1")) {
                              pausedBy = 2;
                          } else if (pausedBy == 2) {
                              pausedBy = 0;
                          }
                          setMsg(lastMsg);
                      } else if (c.equals("REMATCH")) {
                          peerRematch = true;
                          if (myRematch) rematch();
                      }
                  } catch (Exception e) {
                      // некоректне повідомлення ігноруємо
                  }
              }

              private void togglePause() {
                  if (over) return;
                  if (pausedBy == 2) {
                      say("Паузу поставив суперник");
                      return;
                  }
                  pausedBy = pausedBy == 1 ? 0 : 1;
                  if (mp && net != null) net.send("PAUSE|" + pausedBy);
                  setMsg(lastMsg);
              }

