                      o.put("t", System.currentTimeMillis());
                      o.put("loser", names[loser]);
                      o.put("pts", totals[loser]);
                      JSONArray ns = new JSONArray();
                      JSONArray ts = new JSONArray();
                      for (int i = 0; i < names.length; i++) {
                          ns.put(names[i]);
                          ts.put(totals[i]);
