              private void pickAvatar(final Avatars.AvatarView target) {
                  LinearLayout box = new LinearLayout(this);
                  box.setOrientation(LinearLayout.VERTICAL);
                  for (int r = 0; r * 8 < Avatars.TOTAL; r++) {
                      LinearLayout row = new LinearLayout(this);
                      for (int c = 0; c < 8; c++) {
                          final int id = r * 8 + c;
                          if (id >= Avatars.TOTAL) break;
                          Avatars.AvatarView a = avView(id);
                          a.set(id, "-", id == avatar);
                          a.setOnClickListener(new View.OnClickListener() {
                              public void onClick(View v) {
                                  avatar = id;
                                  sp.edit().putInt("avatar", id).commit();
                                  target.set(id, "-", false);
                                  if (avDlg != null) avDlg.dismiss();
                              }
                          });
                          row.addView(a, new LinearLayout.LayoutParams(px(1.3f), px(1.3f)));
                      }
                      box.addView(row);
                  }
                  ScrollView sv = new ScrollView(this);
                  sv.addView(box);
                  Dialog d = dialog(sv, true);
                  avDlg = d;
                  d.show();
                  if (d.getWindow() != null) d.getWindow().setLayout(px(11.5f), px(7.5f));
              }

              // ---------- мережа ----------
              private Net.Cb netCb(final Net[] ref) {
                  return new Net.Cb() {
                      public void onConnected(String n, int a) {
                          if (net != ref[0]) return;
                          peerNick = n;
                          peerAvatar = a;
                          if (net.host) {
                              if (screen == S_LOBBY) fillLobby();
                          } else {
                              showLobbyGuest();
                          }
                      }

                      public void onLine(String line) {
                          if (net != ref[0]) return;
                          handleNet(line);
                      }

                      public void onLost() {
                          if (net != ref[0]) return;
                          if (screen == S_LOBBY) {
                              if (net.host) {
                                  peerNick = null;
                                  fillLobby();
                                  say("Суперник вийшов");
                              } else {
                                  say("Господар закрив кімнату");
                                  showSea();
                              }
                          } else {
                              opponentLeft();
                          }
                      }

                      public void onFail(String msg) {
                          if (net != ref[0]) return;
                          say(msg);
                          if (screen == S_JOIN) {
                              Net n = net;
                              net = null;
                              if (n != null) n.close();
                          }
                      }

                      public void onRoom(String code) {
                          if (net != ref[0]) return;
                          netCode = code;
                          if (code.length() > 0) sp.edit().putString("roomCode", code).commit();
                          if (screen == S_LOBBY) fillNetBar();
                      }
                  };
              }

