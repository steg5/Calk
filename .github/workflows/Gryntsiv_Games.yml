                  Scheme.panel(cv, p, l.mx - 0.8f * l.ec, l.y0 - 1.5f * l.ec, l.mx + 10.2f * l.ec, l.y0 + 10.2f * l.ec, 0.3f * l.ec, 0x66000000);
                  Scheme.panel(cv, p, l.ex - 0.8f * l.ec, l.y0 - 1.5f * l.ec, l.ex + 10.2f * l.ec, l.y0 + 10.2f * l.ec, 0.3f * l.ec, 0x66000000);
                  Painter.board(cv, p, enemy, l.ex, l.y0, l.ec, reveal, theme, lastEnemy, true);
                  Painter.board(cv, p, mine, l.mx, l.y0, l.ec, true, theme, lastMine, true);
                  p.setStyle(Paint.Style.FILL);
