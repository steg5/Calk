name: Gryntsiv_Games

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/Gryntsiv_Games.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Write project
        run: |
          mkdir -p app/src/main/java/com/example/gryntsivgames app/src/main/res/drawable app/src/main/res/raw
          echo '' | base64 -d > debug.keystore

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'GryntsivGames'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=false
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.example.gryntsivgames'
              compileSdk 34
              defaultConfig {
                  applicationId "com.example.gryntsivgames"
                  minSdk 23
                  targetSdk 26
                  versionCode 1
                  versionName "0.1"
              }
              signingConfigs {
                  debug {
                      storeFile file("${rootDir}/debug.keystore")
                      storePassword 'android'
                      keyAlias 'androiddebugkey'
                      keyPassword 'android'
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
              lint {
                  abortOnError false
                  checkReleaseBuilds false
              }
          }
          tasks.withType(JavaCompile).configureEach {
              options.encoding = 'UTF-8'
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE"/>
              <application
                  android:label="Gryntsiv Games"
                  android:icon="@drawable/ic_launcher"
                  android:allowBackup="false"
                  android:usesCleartextTraffic="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:screenOrientation="sensorLandscape"
                      android:configChanges="orientation|screenSize|keyboardHidden|smallestScreenSize|screenLayout|uiMode"
                      android:windowSoftInputMode="stateHidden|adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/example/gryntsivgames/Board.java <<'EOF'
          package com.example.gryntsivgames;

          import java.util.ArrayList;
          import java.util.Random;

          public class Board {
              public static final int N = 10;
              public static final int[] FLEET = {4, 3, 3, 2, 2, 2, 1, 1, 1, 1};

              public static class Ship {
                  public int len, r, c, idx;
                  public boolean h = true, placed;

                  public boolean has(int rr, int cc) {
                      if (!placed) return false;
                      if (h) return rr == r && cc >= c && cc < c + len;
                      return cc == c && rr >= r && rr < r + len;
                  }
              }

              public final Ship[] ships = new Ship[FLEET.length];
              // 0 нічого, 1 мимо, 2 влучання, 3 потоплено
              public final int[] shot = new int[N * N];

              public Board() {
                  for (int i = 0; i < ships.length; i++) {
                      ships[i] = new Ship();
                      ships[i].len = FLEET[i];
                      ships[i].idx = i;
                  }
              }

              public int shipAt(int r, int c) {
                  for (Ship s : ships) {
                      if (s.has(r, c)) return s.idx;
                  }
                  return -1;
              }

              public boolean canPlace(int r, int c, int len, boolean h, int ignore) {
                  int er = h ? r : r + len - 1;
                  int ec = h ? c + len - 1 : c;
                  if (r < 0 || c < 0 || er >= N || ec >= N) return false;
                  for (int rr = r - 1; rr <= er + 1; rr++) {
                      for (int cc = c - 1; cc <= ec + 1; cc++) {
                          if (rr < 0 || cc < 0 || rr >= N || cc >= N) continue;
                          int id = shipAt(rr, cc);
                          if (id >= 0 && id != ignore) return false;
                      }
                  }
                  return true;
              }

              public void place(int idx, int r, int c, boolean h) {
                  Ship s = ships[idx];
                  s.r = r;
                  s.c = c;
                  s.h = h;
                  s.placed = true;
              }

              public void clear() {
                  for (Ship s : ships) s.placed = false;
              }

              public boolean allPlaced() {
                  for (Ship s : ships) if (!s.placed) return false;
                  return true;
              }

              public void randomize(Random rnd) {
                  while (true) {
                      clear();
                      boolean ok = true;
                      for (int i = 0; i < ships.length && ok; i++) {
                          boolean done = false;
                          for (int t = 0; t < 300 && !done; t++) {
                              boolean h = rnd.nextBoolean();
                              int r = rnd.nextInt(N), c = rnd.nextInt(N);
                              if (canPlace(r, c, ships[i].len, h, i)) {
                                  place(i, r, c, h);
                                  done = true;
                              }
                          }
                          if (!done) ok = false;
                      }
                      if (ok) return;
                  }
              }

              public boolean sunk(Ship s) {
                  for (int k = 0; k < s.len; k++) {
                      int r = s.h ? s.r : s.r + k;
                      int c = s.h ? s.c + k : s.c;
                      if (shot[r * N + c] < 2) return false;
                  }
                  return true;
              }

              // 0 мимо, 1 влучив, 2 потопив
              public int shoot(int cell) {
                  int r = cell / N, c = cell % N;
                  int id = shipAt(r, c);
                  if (id < 0) {
                      shot[cell] = 1;
                      return 0;
                  }
                  shot[cell] = 2;
                  Ship s = ships[id];
                  if (!sunk(s)) return 1;
                  for (int k = 0; k < s.len; k++) {
                      int rr = s.h ? s.r : s.r + k;
                      int cc = s.h ? s.c + k : s.c;
                      shot[rr * N + cc] = 3;
                  }
                  for (int rr = s.r - 1; rr <= (s.h ? s.r : s.r + s.len - 1) + 1; rr++) {
                      for (int cc = s.c - 1; cc <= (s.h ? s.c + s.len - 1 : s.c) + 1; cc++) {
                          if (rr < 0 || cc < 0 || rr >= N || cc >= N) continue;
                          if (shot[rr * N + cc] == 0) shot[rr * N + cc] = 1;
                      }
                  }
                  return 2;
              }

              public boolean allSunk() {
                  for (Ship s : ships) if (!sunk(s)) return false;
                  return true;
              }

              public ArrayList<Integer> aliveLens() {
                  ArrayList<Integer> l = new ArrayList<Integer>();
                  for (Ship s : ships) if (!sunk(s)) l.add(s.len);
                  return l;
              }
          }
          EOF

          cat > app/src/main/java/com/example/gryntsivgames/Bot.java <<'EOF'
          package com.example.gryntsivgames;

          import java.util.ArrayList;
          import java.util.Random;

          public class Bot {
              public static final String[] LEVELS = {"Аматор", "Студент", "Геній", "Легенда"};
              private final int level;
              private final Random rnd = new Random();
              private static final int N = Board.N;

              public Bot(int level) {
                  this.level = level;
              }

              private int pick(ArrayList<Integer> l) {
                  return l.get(rnd.nextInt(l.size()));
              }

              private ArrayList<Integer> unknown(int[] s) {
                  ArrayList<Integer> l = new ArrayList<Integer>();
                  for (int i = 0; i < s.length; i++) if (s[i] == 0) l.add(i);
                  return l;
              }

              private void add(ArrayList<Integer> l, int[] s, int r, int c) {
                  if (r < 0 || c < 0 || r >= N || c >= N) return;
                  if (s[r * N + c] == 0 && !l.contains(r * N + c)) l.add(r * N + c);
              }

              // клітинки навколо підбитих (не потоплених) палуб
              private ArrayList<Integer> targets(int[] s, boolean line) {
                  ArrayList<Integer> l = new ArrayList<Integer>();
                  ArrayList<Integer> hits = new ArrayList<Integer>();
                  for (int i = 0; i < s.length; i++) if (s[i] == 2) hits.add(i);
                  if (hits.isEmpty()) return l;
                  if (line && hits.size() >= 2) {
                      int a = hits.get(0), b = hits.get(hits.size() - 1);
                      int ra = a / N, ca = a % N, rb = b / N, cb = b % N;
                      if (ra == rb) {
                          int lo = Math.min(ca, cb), hi = Math.max(ca, cb);
                          add(l, s, ra, lo - 1);
                          add(l, s, ra, hi + 1);
                      } else if (ca == cb) {
                          int lo = Math.min(ra, rb), hi = Math.max(ra, rb);
                          add(l, s, lo - 1, ca);
                          add(l, s, hi + 1, ca);
                      }
                      if (!l.isEmpty()) return l;
                  }
                  for (int h : hits) {
                      int r = h / N, c = h % N;
                      add(l, s, r - 1, c);
                      add(l, s, r + 1, c);
                      add(l, s, r, c - 1);
                      add(l, s, r, c + 1);
                  }
                  return l;
              }

              public int next(Board b) {
                  int[] s = b.shot;
                  if (level == 0) return pick(unknown(s));
                  if (level == 1) {
                      ArrayList<Integer> t = targets(s, false);
                      return t.isEmpty() ? pick(unknown(s)) : pick(t);
                  }
                  if (level == 2) {
                      ArrayList<Integer> t = targets(s, true);
                      if (!t.isEmpty()) return pick(t);
                      ArrayList<Integer> par = new ArrayList<Integer>();
                      for (int i = 0; i < s.length; i++) {
                          if (s[i] == 0 && ((i / N + i % N) % 2 == 0)) par.add(i);
                      }
                      return par.isEmpty() ? pick(unknown(s)) : pick(par);
                  }
                  return legend(b);
              }

              private int legend(Board b) {
                  int[] s = b.shot;
                  int[] score = new int[N * N];
                  ArrayList<Integer> lens = b.aliveLens();
                  boolean anyHit = false;
                  boolean[] blocked = new boolean[N * N];
                  for (int i = 0; i < s.length; i++) {
                      if (s[i] != 2) continue;
                      anyHit = true;
                      int r0 = i / N, c0 = i % N;
                      for (int dr = -1; dr <= 1; dr += 2) {
                          for (int dc = -1; dc <= 1; dc += 2) {
                              int rr = r0 + dr, cc = c0 + dc;
                              if (rr >= 0 && cc >= 0 && rr < N && cc < N) blocked[rr * N + cc] = true;
                          }
                      }
                  }
                  for (int len : lens) {
                      for (int dir = 0; dir < 2; dir++) {
                          if (len == 1 && dir == 1) continue;
                          for (int r = 0; r < N; r++) {
                              for (int c = 0; c < N; c++) {
                                  int er = dir == 1 ? r + len - 1 : r;
                                  int ec = dir == 0 ? c + len - 1 : c;
                                  if (er >= N || ec >= N) continue;
                                  boolean ok = true;
                                  int hits = 0;
                                  for (int k = 0; k < len && ok; k++) {
                                      int v = s[(dir == 1 ? r + k : r) * N + (dir == 0 ? c + k : c)];
                                      if (v == 1 || v == 3 || blocked[(dir == 1 ? r + k : r) * N + (dir == 0 ? c + k : c)]) ok = false;
                                      else if (v == 2) hits++;
                                  }
                                  if (!ok) continue;
                                  int w = 1 + hits * hits * 60;
                                  if (anyHit && hits == 0) w = 1;
                                  for (int k = 0; k < len; k++) {
                                      int cell = (dir == 1 ? r + k : r) * N + (dir == 0 ? c + k : c);
                                      if (s[cell] == 0) score[cell] += w;
                                  }
                              }
                          }
                      }
                  }
                  int best = -1;
                  ArrayList<Integer> bl = new ArrayList<Integer>();
                  for (int i = 0; i < s.length; i++) {
                      if (s[i] != 0) continue;
                      if (score[i] > best) {
                          best = score[i];
                          bl.clear();
                      }
                      if (score[i] == best) bl.add(i);
                  }
                  return bl.isEmpty() ? pick(unknown(s)) : pick(bl);
              }
          }
          EOF

          cat > app/src/main/java/com/example/gryntsivgames/Painter.java <<'EOF'
          package com.example.gryntsivgames;

          import android.graphics.Canvas;
          import android.graphics.Paint;
          import android.graphics.Path;
          import android.graphics.RectF;

          public class Painter {
              public static final String[] THEMES = {"Кораблі", "Машини", "Поїзди", "Жуки", "Лего"};
              private static final int[] CAR = {0xFFE53935, 0xFF1E88E5, 0xFFFDD835, 0xFF43A047, 0xFF8E24AA, 0xFFFB8C00};
              private static final int[] BRICK = {0xFFE53935, 0xFF1E88E5, 0xFFFDD835, 0xFF43A047, 0xFFFB8C00, 0xFF8E24AA};
              private static final Path path = new Path();
              private static final RectF rf = new RectF();

              private static void fill(Canvas c, Paint p, int col) {
                  p.setStyle(Paint.Style.FILL);
                  p.setColor(col);
              }

              private static void rr(Canvas c, Paint p, float l, float t, float r, float b, float rad, int col) {
                  fill(c, p, col);
                  rf.set(l, t, r, b);
                  c.drawRoundRect(rf, rad, rad, p);
              }

              private static void circle(Canvas c, Paint p, float x, float y, float r, int col) {
                  fill(c, p, col);
                  c.drawCircle(x, y, r, p);
              }

              // малює фігуру довжини len у клітинках; (x,y) — лівий верхній кут, cell — розмір клітинки
              public static void draw(Canvas c, Paint p, int theme, float x, float y, float cell, int len, boolean horiz, int variant) {
                  c.save();
                  if (horiz) {
                      c.translate(x, y);
                  } else {
                      c.translate(x + cell, y);
                      c.rotate(90, 0, 0);
                  }
                  drawH(c, p, theme, cell, len, variant);
                  c.restore();
              }

              private static void drawH(Canvas c, Paint p, int theme, float s, int len, int v) {
                  float w = len * s;
                  switch (theme) {
                      case 1:
                          for (int k = 0; k < len; k++) car(c, p, k * s, s, CAR[(v + k) % CAR.length]);
                          break;
                      case 2:
                          for (int k = 0; k < len; k++) {
                              float x = k * s;
                              if (k == len - 1) loco(c, p, x, s);
                              else wagon(c, p, x, s, BRICK[(v + k) % BRICK.length]);
                          }
                          break;
                      case 3:
                          bug(c, p, w, s, len, v);
                          break;
                      case 4:
                          lego(c, p, w, s, len, BRICK[v % BRICK.length]);
                          break;
                      default:
                          ship(c, p, w, s, len);
                  }
              }

              private static void ship(Canvas c, Paint p, float w, float s, int len) {
                  float pad = s * 0.08f;
                  path.reset();
                  path.moveTo(pad, s * 0.2f);
                  path.lineTo(w - s * 0.5f, s * 0.2f);
                  path.lineTo(w - pad, s * 0.5f);
                  path.lineTo(w - s * 0.5f, s * 0.8f);
                  path.lineTo(pad, s * 0.8f);
                  path.close();
                  fill(c, p, 0xFF78909C);
                  c.drawPath(path, p);
                  p.setStyle(Paint.Style.STROKE);
                  p.setStrokeWidth(s * 0.05f);
                  p.setColor(0xFF37474F);
                  c.drawPath(path, p);
                  rr(c, p, pad + s * 0.1f, s * 0.32f, w - s * 0.6f, s * 0.68f, s * 0.06f, 0xFFB0BEC5);
                  if (len == 1) {
                      circle(c, p, w * 0.45f, s * 0.5f, s * 0.16f, 0xFFECEFF1);
                      return;
                  }
                  rr(c, p, w * 0.38f, s * 0.3f, w * 0.38f + s * 0.55f, s * 0.7f, s * 0.08f, 0xFFECEFF1);
                  if (len >= 3) rr(c, p, w * 0.38f + s * 0.12f, s * 0.38f, w * 0.38f + s * 0.43f, s * 0.62f, s * 0.04f, 0xFFD32F2F);
                  circle(c, p, w * 0.17f, s * 0.5f, s * 0.12f, 0xFF455A64);
              }

              private static void car(Canvas c, Paint p, float x, float s, int col) {
                  rr(c, p, x + s * 0.1f, s * 0.22f, x + s * 0.92f, s * 0.78f, s * 0.14f, col);
                  rr(c, p, x + s * 0.38f, s * 0.3f, x + s * 0.72f, s * 0.7f, s * 0.07f, 0xFF263238);
                  rr(c, p, x + s * 0.2f, s * 0.12f, x + s * 0.32f, s * 0.24f, s * 0.03f, 0xFF212121);
                  rr(c, p, x + s * 0.64f, s * 0.12f, x + s * 0.76f, s * 0.24f, s * 0.03f, 0xFF212121);
                  rr(c, p, x + s * 0.2f, s * 0.76f, x + s * 0.32f, s * 0.88f, s * 0.03f, 0xFF212121);
                  rr(c, p, x + s * 0.64f, s * 0.76f, x + s * 0.76f, s * 0.88f, s * 0.03f, 0xFF212121);
                  circle(c, p, x + s * 0.88f, s * 0.35f, s * 0.05f, 0xFFFFF59D);
                  circle(c, p, x + s * 0.88f, s * 0.65f, s * 0.05f, 0xFFFFF59D);
              }

              private static void wheels(Canvas c, Paint p, float x, float s) {
                  circle(c, p, x + s * 0.28f, s * 0.84f, s * 0.1f, 0xFF212121);
                  circle(c, p, x + s * 0.72f, s * 0.84f, s * 0.1f, 0xFF212121);
              }

              private static void wagon(Canvas c, Paint p, float x, float s, int col) {
                  rr(c, p, x, s * 0.45f, x + s, s * 0.52f, 0, 0xFF424242);
                  rr(c, p, x + s * 0.06f, s * 0.2f, x + s * 0.94f, s * 0.78f, s * 0.08f, col);
                  rr(c, p, x + s * 0.18f, s * 0.3f, x + s * 0.38f, s * 0.5f, s * 0.03f, 0xFFE3F2FD);
                  rr(c, p, x + s * 0.62f, s * 0.3f, x + s * 0.82f, s * 0.5f, s * 0.03f, 0xFFE3F2FD);
                  wheels(c, p, x, s);
              }

              private static void loco(Canvas c, Paint p, float x, float s) {
                  rr(c, p, x, s * 0.45f, x + s * 0.5f, s * 0.52f, 0, 0xFF424242);
                  rr(c, p, x + s * 0.06f, s * 0.34f, x + s * 0.94f, s * 0.78f, s * 0.1f, 0xFFB71C1C);
                  rr(c, p, x + s * 0.1f, s * 0.14f, x + s * 0.45f, s * 0.4f, s * 0.04f, 0xFF7F0000);
                  rr(c, p, x + s * 0.58f, s * 0.14f, x + s * 0.74f, s * 0.36f, s * 0.04f, 0xFF212121);
                  circle(c, p, x + s * 0.9f, s * 0.56f, s * 0.06f, 0xFFFFF59D);
                  wheels(c, p, x, s);
              }

              private static void bug(Canvas c, Paint p, float w, float s, int len, int v) {
                  int col = v % 2 == 0 ? 0xFF558B2F : 0xFFD84315;
                  int dark = 0xFF1B2A12;
                  p.setStyle(Paint.Style.STROKE);
                  p.setStrokeWidth(s * 0.06f);
                  p.setColor(dark);
                  for (int k = 0; k < len; k++) {
                      float cx = k * s + s * 0.5f;
                      c.drawLine(cx - s * 0.12f, s * 0.5f, cx - s * 0.28f, s * 0.08f, p);
                      c.drawLine(cx + s * 0.12f, s * 0.5f, cx + s * 0.28f, s * 0.08f, p);
                      c.drawLine(cx - s * 0.12f, s * 0.5f, cx - s * 0.28f, s * 0.92f, p);
                      c.drawLine(cx + s * 0.12f, s * 0.5f, cx + s * 0.28f, s * 0.92f, p);
                  }
                  for (int k = 0; k < len - 1; k++) {
                      float cx = k * s + s * 0.5f;
                      rf.set(cx - s * 0.46f, s * 0.2f, cx + s * 0.46f, s * 0.8f);
                      fill(c, p, k % 2 == 0 ? col : 0xFF7CB342);
                      c.drawOval(rf, p);
                      circle(c, p, cx, s * 0.5f, s * 0.09f, dark);
                  }
                  float hx = (len - 1) * s + s * 0.5f;
                  circle(c, p, hx, s * 0.5f, s * 0.36f, dark);
                  circle(c, p, hx + s * 0.14f, s * 0.36f, s * 0.08f, 0xFFFFFFFF);
                  circle(c, p, hx + s * 0.14f, s * 0.64f, s * 0.08f, 0xFFFFFFFF);
                  p.setStyle(Paint.Style.STROKE);
                  p.setColor(dark);
                  c.drawLine(hx + s * 0.3f, s * 0.4f, hx + s * 0.48f, s * 0.2f, p);
                  c.drawLine(hx + s * 0.3f, s * 0.6f, hx + s * 0.48f, s * 0.8f, p);
              }

              private static void lego(Canvas c, Paint p, float w, float s, int len, int col) {
                  rr(c, p, s * 0.05f, s * 0.12f, w - s * 0.05f, s * 0.92f, s * 0.07f, ((col >> 1) & 0x7F7F7F) | 0xFF000000);
                  rr(c, p, s * 0.05f, s * 0.12f, w - s * 0.05f, s * 0.84f, s * 0.07f, col);
                  for (int k = 0; k < len; k++) {
                      float cx = k * s + s * 0.5f;
                      circle(c, p, cx, s * 0.5f, s * 0.24f, 0x55000000);
                      circle(c, p, cx, s * 0.46f, s * 0.24f, col);
                      circle(c, p, cx - s * 0.06f, s * 0.4f, s * 0.08f, 0x66FFFFFF);
                  }
              }

              // ---- поле ----
              public static void board(Canvas c, Paint p, Board b, float ox, float oy, float cell, boolean showShips, int theme, int lastCell, boolean labels) {
                  int n = Board.N;
                  float sz = cell * n;
                  rr(c, p, ox, oy, ox + sz, oy + sz, cell * 0.12f, 0xFF1565C0);
                  p.setStyle(Paint.Style.STROKE);
                  p.setStrokeWidth(Math.max(1f, cell * 0.03f));
                  p.setColor(0x66BBDEFB);
                  for (int i = 0; i <= n; i++) {
                      c.drawLine(ox + i * cell, oy, ox + i * cell, oy + sz, p);
                      c.drawLine(ox, oy + i * cell, ox + sz, oy + i * cell, p);
                  }
                  if (labels) {
                      p.setStyle(Paint.Style.FILL);
                      p.setColor(0xFFB0BEC5);
                      p.setTextSize(cell * 0.45f);
                      p.setTextAlign(Paint.Align.CENTER);
                      String abc = "АБВГДЕЖЗИК";
                      for (int i = 0; i < n; i++) {
                          c.drawText(String.valueOf(abc.charAt(i)), ox + i * cell + cell / 2, oy - cell * 0.18f, p);
                          c.drawText(String.valueOf(i + 1), ox - cell * 0.32f, oy + i * cell + cell * 0.66f, p);
                      }
                  }
                  for (Board.Ship s : b.ships) {
                      if (!s.placed) continue;
                      boolean sunk = b.sunk(s);
                      if (!showShips && !sunk) continue;
                      draw(c, p, theme, ox + s.c * cell, oy + s.r * cell, cell, s.len, s.h, s.idx);
                      if (sunk) {
                          float w = s.h ? s.len * cell : cell, h = s.h ? cell : s.len * cell;
                          rr(c, p, ox + s.c * cell + cell * 0.04f, oy + s.r * cell + cell * 0.04f, ox + s.c * cell + w - cell * 0.04f, oy + s.r * cell + h - cell * 0.04f, cell * 0.1f, 0x66B71C1C);
                      }
                  }
                  for (int i = 0; i < n * n; i++) {
                      int v = b.shot[i];
                      if (v == 0) continue;
                      float cx = ox + (i % n) * cell + cell / 2, cy = oy + (i / n) * cell + cell / 2;
                      if (v == 1) {
                          circle(c, p, cx, cy, cell * 0.11f, 0xFFE1F5FE);
                      } else {
                          p.setStyle(Paint.Style.STROKE);
                          p.setStrokeWidth(cell * 0.1f);
                          p.setColor(v == 3 ? 0xFF8B0000 : 0xFFFF1744);
                          float d = cell * 0.26f;
                          c.drawLine(cx - d, cy - d, cx + d, cy + d, p);
                          c.drawLine(cx - d, cy + d, cx + d, cy - d, p);
                      }
                  }
                  if (lastCell >= 0) {
                      p.setStyle(Paint.Style.STROKE);
                      p.setStrokeWidth(cell * 0.08f);
                      p.setColor(0xFFFFEB3B);
                      rf.set(ox + (lastCell % n) * cell + cell * 0.06f, oy + (lastCell / n) * cell + cell * 0.06f,
                          ox + (lastCell % n) * cell + cell * 0.94f, oy + (lastCell / n) * cell + cell * 0.94f);
                      c.drawRoundRect(rf, cell * 0.1f, cell * 0.1f, p);
                  }
                  p.setStyle(Paint.Style.FILL);
              }
          }
