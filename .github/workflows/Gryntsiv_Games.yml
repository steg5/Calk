                  row.addView(btn("Wifi", w ? 0xFF2E7D32 : 0xFF455A64, new View.OnClickListener() {
                      public void onClick(View v) {
                          if (net == null) return;
                          net.setWifi(!net.isWifi());
                          fillNetBar();
