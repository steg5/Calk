          // Кольори гри за спільним фоном (7 фонів)
          public class Scheme {
              public final int bg, btn, water, grid;
              public static int id;

              private Scheme(int bg, int btn, int water, int grid) {
                  this.bg = bg;
                  this.btn = btn;
                  this.water = water;
                  this.grid = grid;
              }

              // порядок як у Bg.NAMES: Сукно, Ніч, Захід, Океан, Ромби, Горошок, Дерево
              public static final Scheme[] ALL = {
                  new Scheme(0xFF1B5E3A, 0xFF0F3D26, 0xFF1F6FB5, 0x66BBDEFB),
                  new Scheme(0xFF12121C, 0xFF37474F, 0xFF1F5FA3, 0x668FA6D8),
                  new Scheme(0xFF3B1D3A, 0xFF8E3B2C, 0xFF1F66A8, 0x66FFCC80),
                  new Scheme(0xFF0D2847, 0xFF1565C0, 0xFF1F78C4, 0x66BBDEFB),
                  new Scheme(0xFF2A2250, 0xFF5E35B1, 0xFF2A6CB8, 0x66D1C4E9),
                  new Scheme(0xFF3A1D2C, 0xFF8E2D5A, 0xFF1F6AB0, 0x66F8BBD0),
                  new Scheme(0xFF3E2C1E, 0xFF5D4037, 0xFF1F68AC, 0x66FFE0B2)
              };
              public static Scheme cur = ALL[0];

              public static void set(int i) {
                  id = Math.max(0, Math.min(ALL.length - 1, i));
