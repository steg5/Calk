          package com.example.gryntsivgames;

          import android.content.Context;
          import android.graphics.Canvas;
          import android.graphics.Paint;
          import android.graphics.RectF;
          import android.view.MotionEvent;
          import android.view.View;

          public class PlaceView extends View {
              public interface Listener {
                  void onChanged();

                  void onSound(int kind);
              }

              public Board board = new Board();
              public Listener listener;
              public int theme;
              private final Paint p = new Paint(Paint.ANTI_ALIAS_FLAG);
              private float ox, oy, cell, trayX, trayY, trayCell, trayW, trayH;
              private Board.Ship pick;
              private boolean fromBoard, moved;
              private int origR, origC;
              private boolean origH;
              private float downX, downY, fx, fy, offR, offC;

              public PlaceView(Context c) {
                  super(c);
              }

              private void calc() {
                  float W = getWidth(), H = getHeight();
                  float u = Math.min(W / 16f, H / 9f);
                  cell = Math.min(H * 0.8f, W * 0.5f) / 10f;
                  ox = u * 0.9f;
                  oy = (H - cell * 10) / 2f + u * 0.2f;
                  trayX = ox + cell * 10 + u * 0.8f;
                  trayW = W - trayX - u * 0.4f;
                  trayCell = Math.min(cell * 0.8f, trayW / 2f / 4.3f);
                  trayY = u * 1.1f;
                  trayH = u * 0.95f;
              }

              private float slotX(int i) {
                  return trayX + (i % 2) * (trayW / 2f);
              }

              private float slotY(int i) {
                  return trayY + (i / 2) * trayH;
              }

              private Board.Ship trayAt(float x, float y) {
                  for (Board.Ship s : board.ships) {
                      if (s.placed || s == pick) continue;
                      float sx = slotX(s.idx), sy = slotY(s.idx);
                      if (x >= sx - trayCell * 0.2f && x <= sx + s.len * trayCell + trayCell * 0.2f && y >= sy - trayCell * 0.2f && y <= sy + trayCell * 1.2f) return s;
                  }
                  return null;
              }

              private int cellAt(float x, float y, boolean any) {
                  int c = (int) Math.floor((x - ox) / cell), r = (int) Math.floor((y - oy) / cell);
                  if (c < 0 || r < 0 || c >= 10 || r >= 10) return -1;
                  return r * 10 + c;
              }

              @Override
              protected void onDraw(Canvas cv) {
                  calc();
                  float W = getWidth(), H = getHeight();
                  float u = Math.min(W / 16f, H / 9f);
                  cv.drawColor(0xFF0D2847);
                  Painter.board(cv, p, board, ox, oy, cell, true, theme, -1, true);
                  p.setStyle(Paint.Style.FILL);
                  p.setColor(0xFFFFFFFF);
                  p.setTextAlign(Paint.Align.LEFT);
                  p.setTextSize(u * 0.5f);
                  cv.drawText("Розстав кораблі", trayX, u * 0.75f, p);
                  for (Board.Ship s : board.ships) {
                      if (s.placed || s == pick) continue;
                      Painter.draw(cv, p, theme, slotX(s.idx), slotY(s.idx), trayCell, s.len, true, s.idx);
                  }
                  if (pick != null) {
                      if (fx >= ox - cell && fx <= ox + cell * 11 && fy >= oy - cell && fy <= oy + cell * 11) {
                          int cc = (int) Math.floor((fx - ox) / cell) - (int) offC, rr = (int) Math.floor((fy - oy) / cell) - (int) offR;
                          boolean ok = board.canPlace(rr, cc, pick.len, pick.h, pick.idx);
                          float w = pick.h ? pick.len * cell : cell, h = pick.h ? cell : pick.len * cell;
                          p.setStyle(Paint.Style.FILL);
                          p.setColor(ok ? 0x5500E676 : 0x55FF1744);
                          RectF r = new RectF(ox + cc * cell, oy + rr * cell, ox + cc * cell + w, oy + rr * cell + h);
                          cv.drawRoundRect(r, cell * 0.1f, cell * 0.1f, p);
                          Painter.draw(cv, p, theme, ox + cc * cell, oy + rr * cell, cell, pick.len, pick.h, pick.idx);
                      } else {
                          Painter.draw(cv, p, theme, fx - offC * cell - cell / 2, fy - offR * cell - cell / 2, cell, pick.len, pick.h, pick.idx);
                      }
                  }
              }

              @Override
              public boolean onTouchEvent(MotionEvent e) {
                  calc();
                  float x = e.getX(), y = e.getY();
                  int a = e.getAction();
                  if (a == MotionEvent.ACTION_DOWN) {
                      moved = false;
                      downX = x;
                      downY = y;
                      fx = x;
                      fy = y;
                      int ci = cellAt(x, y, false);
                      if (ci >= 0) {
                          int id = board.shipAt(ci / 10, ci % 10);
                          if (id >= 0) {
                              pick = board.ships[id];
                              fromBoard = true;
                              origR = pick.r;
                              origC = pick.c;
                              origH = pick.h;
                              offR = ci / 10 - pick.r;
                              offC = ci % 10 - pick.c;
                              pick.placed = false;
                              invalidate();
                              return true;
                          }
                      }
                      Board.Ship t = trayAt(x, y);
                      if (t != null) {
                          pick = t;
                          fromBoard = false;
                          pick.h = true;
                          offR = 1;
                          offC = 0;
                          invalidate();
                      }
                      return true;
                  }
                  if (pick == null) return true;
                  if (a == MotionEvent.ACTION_MOVE) {
                      fx = x;
                      fy = y;
                      if (Math.abs(x - downX) + Math.abs(y - downY) > cell * 0.3f) moved = true;
                      invalidate();
                      return true;
                  }
                  if (a == MotionEvent.ACTION_UP || a == MotionEvent.ACTION_CANCEL) {
                      Board.Ship s = pick;
                      pick = null;
                      boolean done = false;
                      if (a == MotionEvent.ACTION_UP) {
                          if (fromBoard && !moved) {
                              boolean nh = !origH;
                              int nr = origR, nc = origC;
                              if (board.canPlace(nr, nc, s.len, nh, s.idx)) {
                                  board.place(s.idx, nr, nc, nh);
                                  done = true;
                                  if (listener != null) listener.onSound(Snd.PLACE);
                              }
                          } else if (fromBoard && x > ox + cell * 10 + cell * 0.5f) {
                              done = true;
                          } else {
                              int ci = cellAt(x, y, true);
                              if (ci >= 0) {
                                  int cc = ci % 10 - (int) offC, rr = ci / 10 - (int) offR;
                                  if (board.canPlace(rr, cc, s.len, s.h, s.idx)) {
                                      board.place(s.idx, rr, cc, s.h);
                                      done = true;
                                      if (listener != null) listener.onSound(Snd.PLACE);
                                  }
                              }
                          }
                      }
                      if (!done && fromBoard) board.place(s.idx, origR, origC, origH);
                      invalidate();
                      if (listener != null) listener.onChanged();
                  }
                  return true;
              }

              public void randomize() {
                  board.randomize(new java.util.Random());
                  invalidate();
                  if (listener != null) listener.onChanged();
              }

              public void clearAll() {
                  board.clear();
                  invalidate();
                  if (listener != null) listener.onChanged();
              }
          }
          EOF

