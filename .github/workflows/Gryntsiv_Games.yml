                  rr(c, p, x + s * 0.6f, s * 0.8f, x + s * 0.7f, s * 0.88f, s * 0.03f, shade(col, 0.7f));
                  oval(c, p, x + s * 0.88f, s * 0.24f, x + s * 0.96f, s * 0.38f, 0xFFFFF59D);
