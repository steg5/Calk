              // квадратна плитка гри з малюнком
              private class Tile extends View {
                  private final int kind;
                  private final Paint pt = new Paint(Paint.ANTI_ALIAS_FLAG);
                  private final RectF r = new RectF();

                  Tile(Context c, int kind) {
                      super(c);
                      this.kind = kind;
                  }

                  private void card(Canvas cv, float cx, float cy, float w, float h, float ang, int col, String s) {
                      cv.save();
                      cv.rotate(ang, cx, cy);
                      pt.setStyle(Paint.Style.FILL);
                      pt.setColor(0xFFFFFFFF);
                      r.set(cx - w / 2, cy - h / 2, cx + w / 2, cy + h / 2);
                      cv.drawRoundRect(r, w * 0.12f, w * 0.12f, pt);
                      pt.setColor(col);
                      r.set(cx - w * 0.44f, cy - h * 0.45f, cx + w * 0.44f, cy + h * 0.45f);
                      cv.drawRoundRect(r, w * 0.09f, w * 0.09f, pt);
                      pt.setColor(0xFFFFFFFF);
                      cv.save();
                      cv.rotate(-25, cx, cy);
                      r.set(cx - w * 0.3f, cy - h * 0.38f, cx + w * 0.3f, cy + h * 0.38f);
                      cv.drawOval(r, pt);
                      cv.restore();
                      pt.setColor(col);
                      pt.setTextAlign(Paint.Align.CENTER);
                      pt.setTextSize(h * 0.36f);
                      pt.setTypeface(Typeface.DEFAULT_BOLD);
                      cv.drawText(s, cx, cy + h * 0.13f, pt);
                      cv.restore();
                  }

                  @Override
                  protected void onDraw(Canvas cv) {
                      float W = getWidth(), H = getHeight();
                      pt.setStyle(Paint.Style.FILL);
                      if (kind == 0) {
                          pt.setColor(0xFF1B5E3A);
                          r.set(0, 0, W, H);
                          cv.drawRoundRect(r, W * 0.1f, W * 0.1f, pt);
                          pt.setColor(0x33000000);
                          r.set(W * 0.06f, H * 0.06f, W * 0.94f, H * 0.94f);
                          cv.drawRoundRect(r, W * 0.08f, W * 0.08f, pt);
                          card(cv, W * 0.30f, H * 0.52f, W * 0.40f, H * 0.58f, -18, 0xFFE53935, "7");
                          card(cv, W * 0.70f, H * 0.52f, W * 0.40f, H * 0.58f, 18, 0xFF1E88E5, "+2");
                          card(cv, W * 0.50f, H * 0.48f, W * 0.42f, H * 0.62f, 0, 0xFFFDD835, "9");
                      } else {
                          pt.setColor(0xFF0D3B6E);
                          r.set(0, 0, W, H);
                          cv.drawRoundRect(r, W * 0.1f, W * 0.1f, pt);
                          pt.setColor(0xFF1F78C4);
                          r.set(W * 0.06f, H * 0.06f, W * 0.94f, H * 0.94f);
                          cv.drawRoundRect(r, W * 0.08f, W * 0.08f, pt);
                          pt.setStyle(Paint.Style.STROKE);
                          pt.setStrokeWidth(Math.max(1f, W * 0.006f));
                          pt.setColor(0x55FFFFFF);
                          for (int i = 1; i < 8; i++) {
                              cv.drawLine(W * 0.06f + i * W * 0.11f, H * 0.06f, W * 0.06f + i * W * 0.11f, H * 0.94f, pt);
                              cv.drawLine(W * 0.06f, H * 0.06f + i * H * 0.11f, W * 0.94f, H * 0.06f + i * H * 0.11f, pt);
                          }
                          float cs = W * 0.11f;
                          Painter.draw(cv, pt, 0, W * 0.06f + cs, H * 0.06f + cs * 1, cs, 4, true, 0);
                          Painter.draw(cv, pt, 0, W * 0.06f + cs * 4, H * 0.06f + cs * 4, cs, 3, true, 1);
                          Painter.draw(cv, pt, 0, W * 0.06f + cs * 1, H * 0.06f + cs * 5, cs, 2, false, 2);
                          Painter.draw(cv, pt, 0, W * 0.06f + cs * 6, H * 0.06f + cs * 1, cs, 1, true, 3);
                          // влучання й промах
                          pt.setStyle(Paint.Style.STROKE);
                          pt.setStrokeWidth(cs * 0.14f);
                          pt.setColor(0xFFFF1744);
                          float cx = W * 0.06f + cs * 5.5f, cy = H * 0.06f + cs * 4.5f, d = cs * 0.3f;
                          cv.drawLine(cx - d, cy - d, cx + d, cy + d, pt);
                          cv.drawLine(cx - d, cy + d, cx + d, cy - d, pt);
                          pt.setStyle(Paint.Style.FILL);
                          pt.setColor(0xFFE1F5FE);
                          cv.drawCircle(W * 0.06f + cs * 2.5f, H * 0.06f + cs * 3.5f, cs * 0.12f, pt);
                          cv.drawCircle(W * 0.06f + cs * 7.5f, H * 0.06f + cs * 6.5f, cs * 0.12f, pt);
                      }
                  }
              }

