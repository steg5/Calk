                      JSONArray neu = new JSONArray();
                      neu.put(o);
                      for (int i = 0; i < old.length() && i < 99; i++) neu.put(old.get(i));
                      sp.edit().putString("hist", neu.toString()).commit();
                  } catch (Exception e) {
                      // ignore
                  }
              }

