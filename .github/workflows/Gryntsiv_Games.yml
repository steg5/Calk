                  }), lp(2.4f, 0.85f, 0.04f));
                  row.addView(btn("Інтернет", n ? 0xFF2E7D32 : 0xFF455A64, new View.OnClickListener() {
                      public void onClick(View v) {
                          if (net == null) return;
                          if (net.isInternet()) {
                              net.setInternet(false);
                              netCode = "";
                              fillNetBar();
                          } else if (!net.isBusy()) {
                              say("Підключення до інтернету…");
                              net.setInternet(true);
                          }
                      }
                  }), lp(3.0f, 0.85f, 0.04f));
                  netBox.addView(row);
                  if (n && netCode.length() > 0) {
                      LinearLayout cr = new LinearLayout(this);
                      cr.setGravity(Gravity.CENTER_VERTICAL);
                      cr.addView(tv("Код: " + netCode, 0.45f, 0xFFFFD54F, true), lp(WRAP, WRAP, 0.05f));
