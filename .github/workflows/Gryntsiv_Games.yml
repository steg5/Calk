              private void fillLobby() {
                  if (lobbyBody == null || screen != S_LOBBY) return;
                  lobbyBody.removeAllViews();
                  lobbyBody.addView(playerRow(avatar, nick + " - господар"), new LinearLayout.LayoutParams(MATCH, WRAP));
                  if (hasBot) {
                      LinearLayout row = playerRow(botAvatar, "Бот " + botName);
                      for (int k = 0; k < LV_SHORT.length; k++) {
                          final int lk = k;
                          Button lb = btn(LV_SHORT[k], botLevel == k ? 0xFF2E7D32 : 0xFF455A64, new View.OnClickListener() {
                              public void onClick(View v) {
                                  botLevel = lk;
                                  sp.edit().putInt("lvl", lk).commit();
                                  fillLobby();
                              }
                          });
                          small(lb, 0.28f);
                          row.addView(lb, lp(1.9f, 0.8f, 0.02f));
                      }
                      Button rm = btn("Прибрати", 0xFFC62828, new View.OnClickListener() {
                          public void onClick(View v) {
                              hasBot = false;
                              if (net != null) net.lock(false);
                              fillLobby();
                          }
                      });
                      small(rm, 0.28f);
                      row.addView(rm, lp(2.2f, 0.8f, 0.04f));
                      lobbyBody.addView(row, new LinearLayout.LayoutParams(MATCH, WRAP));
                  } else if (peerNick != null) {
                      LinearLayout row = playerRow(peerAvatar, peerNick + " - гість");
                      Button rm = btn("Прибрати", 0xFFC62828, new View.OnClickListener() {
                          public void onClick(View v) {
                              if (net != null) net.kick();
                              peerNick = null;
                              fillLobby();
                          }
                      });
                      small(rm, 0.3f);
                      row.addView(rm, lp(2.4f, 0.8f, 0.04f));
                      lobbyBody.addView(row, new LinearLayout.LayoutParams(MATCH, WRAP));
                  } else {
                      lobbyBody.addView(tv("Очікуємо суперника… Він може приєднатися по Wi-Fi або за кодом з інтернету.", 0.36f, 0xFFB0BEC5, false), lp(WRAP, WRAP, 0.2f));
                  }
                  lobbyBody.addView(new View(this), new LinearLayout.LayoutParams(MATCH, 0, 1f));
                  LinearLayout row = new LinearLayout(this);
                  row.setGravity(Gravity.CENTER_VERTICAL);
                  final boolean hasOpp = hasBot || peerNick != null;
                  if (!hasOpp) {
                      row.addView(btn("Додати бота", 0xFF1565C0, new View.OnClickListener() {
                          public void onClick(View v) {
                              hasBot = true;
                              botName = BOT_NAMES[rnd.nextInt(BOT_NAMES.length)];
                              do {
                                  botAvatar = rnd.nextInt(Avatars.TOTAL);
                              } while (botAvatar == avatar);
                              botLevel = sp.getInt("lvl", 1);
                              if (net != null) net.lock(true);
                              fillLobby();
                          }
                      }), lp(3.6f, 1.0f, 0.08f));
                  }
                  Button start = btn("Старт", 0xFF2E7D32, new View.OnClickListener() {
                      public void onClick(View v) {
                          startFromLobby();
                      }
                  });
                  start.setAlpha(hasOpp ? 1f : 0.4f);
                  row.addView(start, lp(3.6f, 1.0f, 0.08f));
                  row.addView(btn("Вийти", 0xFFC62828, new View.OnClickListener() {
                      public void onClick(View v) {
                          showSea();
                      }
                  }), lp(3f, 1.0f, 0.08f));
                  lobbyBody.addView(row, new LinearLayout.LayoutParams(WRAP, WRAP));
              }

              private void startFromLobby() {
                  if (hasBot) {
                      int lv = botLevel;
                      stopNet();
                      level = lv;
                      showPlace(lv);
