                  float[] rowW = new float[12];
                  int r = 0;
                  for (int i = 0; i < n; i++) {
                      if (i > 0 && enemy.ships[i].len != enemy.ships[i - 1].len) r++;
                      row[i] = r;
                      rowW[r] += (rowW[r] > 0 ? gap : 0) + enemy.ships[i].len * fc;
                  }
                  float maxW = 0;
                  for (int i = 0; i <= r; i++) maxW = Math.max(maxW, rowW[i]);
                  float left = cx - maxW / 2f;
                  float[] pos = new float[12];
                  for (int i = 0; i < n; i++) {
                      Board.Ship s = enemy.ships[i];
                      float x = left + pos[row[i]];
                      float y = l.y0 + u * 0.55f + row[i] * rowH;
