                  cv.drawRoundRect(rf, l.ec * 0.12f, l.ec * 0.12f, p);
                  nameLabel(cv, myName, l.mx + 5 * l.ec, l.y0 - l.ec * 0.85f, l.ec * 10, u);
                  nameLabel(cv, enemyName, l.ex + 5 * l.ec, l.y0 - l.ec * 0.85f, l.ec * 10, u);
