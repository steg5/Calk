name: ClaudeMulti3

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/ClaudeMulti3.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Write project
        run: |
          mkdir -p app/src/main/java/com/example/claudemulti app/src/main/res/drawable app/src/main/res/layout app/src/main/res/xml
          echo '' | base64 -d > debug.keystore

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'ClaudeMulti'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=false
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.example.claudemulti'
              compileSdk 34
              defaultConfig {
                  applicationId "com.example.claudemulti"
                  minSdk 23
                  targetSdk 26
                  versionCode 3
                  versionName "1.2"
              }
              signingConfigs {
                  debug {
                      storeFile file("${rootDir}/debug.keystore")
                      storePassword 'android'
                      keyAlias 'androiddebugkey'
                      keyPassword 'android'
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
              lint {
                  abortOnError false
                  checkReleaseBuilds false
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <application
                  android:label="Claude x4"
                  android:icon="@drawable/ic_launcher"
                  android:allowBackup="false"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <activity
                      android:name=".Web1"
                      android:label="Claude 1"
                      android:process=":a1"
                      android:taskAffinity="com.example.claudemulti.a1"
                      android:launchMode="singleTask"
                      android:configChanges="orientation|screenSize|keyboardHidden|smallestScreenSize|screenLayout"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <activity
                      android:name=".Web2"
                      android:label="Claude 2"
                      android:process=":a2"
                      android:taskAffinity="com.example.claudemulti.a2"
                      android:launchMode="singleTask"
                      android:configChanges="orientation|screenSize|keyboardHidden|smallestScreenSize|screenLayout"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <activity
                      android:name=".Web3"
                      android:label="Claude 3"
                      android:process=":a3"
                      android:taskAffinity="com.example.claudemulti.a3"
                      android:launchMode="singleTask"
                      android:configChanges="orientation|screenSize|keyboardHidden|smallestScreenSize|screenLayout"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <activity
                      android:name=".Web4"
                      android:label="Claude 4"
                      android:process=":a4"
                      android:taskAffinity="com.example.claudemulti.a4"
                      android:launchMode="singleTask"
                      android:configChanges="orientation|screenSize|keyboardHidden|smallestScreenSize|screenLayout"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <receiver
                      android:name=".AccWidget"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.appwidget.action.APPWIDGET_UPDATE"/>
                      </intent-filter>
                      <meta-data
                          android:name="android.appwidget.provider"
                          android:resource="@xml/widget_info"/>
                  </receiver>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/example/claudemulti/MainActivity.java <<'EOF'
          package com.example.claudemulti;

          import android.app.Activity;
          import android.content.Intent;
          import android.os.Bundle;
          import android.view.Gravity;
          import android.view.View;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setGravity(Gravity.CENTER);
                  int p = (int) (24 * getResources().getDisplayMetrics().density);
                  root.setPadding(p, p, p, p);

                  TextView title = new TextView(this);
                  title.setText("Claude: 4 акаунти");
                  title.setTextSize(24);
                  title.setGravity(Gravity.CENTER);
                  root.addView(title);

                  final Class<?>[] cls = new Class<?>[] { Web1.class, Web2.class, Web3.class, Web4.class };
                  for (int i = 0; i < cls.length; i++) {
                      final Class<?> target = cls[i];
                      Button btn = new Button(this);
                      btn.setText("Акаунт " + (i + 1));
                      btn.setOnClickListener(new View.OnClickListener() {
                          @Override
                          public void onClick(View v) {
                              Intent it = new Intent(MainActivity.this, target);
                              it.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                              startActivity(it);
                          }
                      });
                      LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(
                              LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT);
                      lp.topMargin = p / 2;
                      root.addView(btn, lp);
                  }
                  setContentView(root);
              }
          }
          EOF

          cat > app/src/main/java/com/example/claudemulti/BaseWeb.java <<'EOF'
          package com.example.claudemulti;

          import android.app.Activity;
          import android.content.ActivityNotFoundException;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.webkit.CookieManager;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebStorage;
          import android.app.AlertDialog;
          import android.content.DialogInterface;
          import android.view.Gravity;
          import android.widget.Button;
          import android.widget.FrameLayout;

          public abstract class BaseWeb extends Activity {
              private static final String URL = "https://claude.ai";
              private static final int REQ_FILE = 1;
              private WebView web;
              private ValueCallback<Uri[]> fileCb;

              protected abstract String suffix();

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  if (Build.VERSION.SDK_INT >= 28) {
                      try {
                          WebView.setDataDirectorySuffix(suffix());
                      } catch (Throwable e) {
                      }
                  }
                  web = new WebView(this);
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setAllowFileAccess(false);
                  s.setUserAgentString(s.getUserAgentString().replace("; wv", ""));
                  CookieManager cm = CookieManager.getInstance();
                  cm.setAcceptCookie(true);
                  cm.setAcceptThirdPartyCookies(web, true);

                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView v, String url) {
                          if (url.startsWith("http://") || url.startsWith("https://")) {
                              return false;
                          }
                          try {
                              startActivity(new Intent(Intent.ACTION_VIEW, Uri.parse(url)));
                          } catch (Exception e) {
                          }
                          return true;
                      }
                  });
                  web.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onShowFileChooser(WebView v, ValueCallback<Uri[]> cb,
                                                       WebChromeClient.FileChooserParams params) {
                          if (fileCb != null) {
                              fileCb.onReceiveValue(null);
                          }
                          fileCb = cb;
                          try {
                              startActivityForResult(params.createIntent(), REQ_FILE);
                          } catch (ActivityNotFoundException e) {
                              fileCb = null;
                              return false;
                          }
                          return true;
                      }
                  });
                  FrameLayout box = new FrameLayout(this);
                  box.addView(web, new FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.MATCH_PARENT, FrameLayout.LayoutParams.MATCH_PARENT));
                  Button lo = new Button(this);
                  lo.setText("Вийти");
                  lo.setTextSize(11);
                  lo.setMinHeight(0);
                  lo.setMinWidth(0);
                  lo.setAlpha(0.6f);
                  FrameLayout.LayoutParams lp = new FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.WRAP_CONTENT, FrameLayout.LayoutParams.WRAP_CONTENT);
                  lp.gravity = Gravity.BOTTOM | Gravity.START;
                  box.addView(lo, lp);
                  lo.setOnClickListener(new android.view.View.OnClickListener() {
                      @Override
                      public void onClick(android.view.View v) {
                          confirmLogout();
                      }
                  });
                  setContentView(box);
                  if (b != null) {
                      web.restoreState(b);
                  } else {
                      web.loadUrl(URL);
                  }
              }

              private void confirmLogout() {
                  new AlertDialog.Builder(this)
                          .setMessage("Вийти з цього акаунта?")
                          .setPositiveButton("Вийти", new DialogInterface.OnClickListener() {
                              @Override
                              public void onClick(DialogInterface d, int w) {
                                  doLogout();
                              }
                          })
                          .setNegativeButton("Скасувати", null)
                          .show();
              }

              private void doLogout() {
                  CookieManager cm = CookieManager.getInstance();
                  cm.removeAllCookies(null);
                  cm.flush();
                  WebStorage.getInstance().deleteAllData();
                  web.clearCache(true);
                  web.clearHistory();
                  web.loadUrl(URL);
              }

              @Override
              protected void onActivityResult(int req, int res, Intent data) {
                  if (req == REQ_FILE && fileCb != null) {
                      fileCb.onReceiveValue(WebChromeClient.FileChooserParams.parseResult(res, data));
                      fileCb = null;
                  } else {
                      super.onActivityResult(req, res, data);
                  }
              }

              @Override
              protected void onSaveInstanceState(Bundle out) {
                  super.onSaveInstanceState(out);
                  web.saveState(out);
              }

              @Override
              protected void onPause() {
                  super.onPause();
                  CookieManager.getInstance().flush();
              }

              @Override
              public void onBackPressed() {
                  if (web.canGoBack()) {
                      web.goBack();
                  } else {
                      moveTaskToBack(true);
                  }
              }

              @Override
              protected void onDestroy() {
                  super.onDestroy();
                  web.destroy();
              }
          }
          EOF

          cat > app/src/main/java/com/example/claudemulti/AccWidget.java <<'EOF'
          package com.example.claudemulti;

          import android.app.PendingIntent;
          import android.appwidget.AppWidgetManager;
          import android.appwidget.AppWidgetProvider;
          import android.content.Context;
          import android.content.Intent;
          import android.widget.RemoteViews;

          public class AccWidget extends AppWidgetProvider {
              @Override
              public void onUpdate(Context ctx, AppWidgetManager mgr, int[] ids) {
                  Class<?>[] cls = new Class<?>[] { Web1.class, Web2.class, Web3.class, Web4.class };
                  int[] btn = new int[] { R.id.b1, R.id.b2, R.id.b3, R.id.b4 };
                  for (int id : ids) {
                      RemoteViews rv = new RemoteViews(ctx.getPackageName(), R.layout.widget);
                      for (int i = 0; i < cls.length; i++) {
                          Intent it = new Intent(ctx, cls[i]);
                          it.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                          PendingIntent pi = PendingIntent.getActivity(ctx, i, it,
                                  PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
                          rv.setOnClickPendingIntent(btn[i], pi);
                      }
                      mgr.updateAppWidget(id, rv);
                  }
              }
          }
          EOF

          cat > app/src/main/res/layout/widget.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="horizontal"
              android:padding="4dp">
              <Button
                  android:id="@+id/b1"
                  android:layout_width="0dp"
                  android:layout_height="match_parent"
                  android:layout_weight="1"
                  android:text="1"/>
              <Button
                  android:id="@+id/b2"
                  android:layout_width="0dp"
                  android:layout_height="match_parent"
                  android:layout_weight="1"
                  android:text="2"/>
              <Button
                  android:id="@+id/b3"
                  android:layout_width="0dp"
                  android:layout_height="match_parent"
                  android:layout_weight="1"
                  android:text="3"/>
              <Button
                  android:id="@+id/b4"
                  android:layout_width="0dp"
                  android:layout_height="match_parent"
                  android:layout_weight="1"
                  android:text="4"/>
          </LinearLayout>
          EOF

          cat > app/src/main/res/xml/widget_info.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android"
              android:minWidth="250dp"
              android:minHeight="40dp"
              android:updatePeriodMillis="0"
              android:resizeMode="horizontal"
              android:initialLayout="@layout/widget"/>
          EOF

          cat > app/src/main/java/com/example/claudemulti/Web1.java <<'EOF'
          package com.example.claudemulti;

          public class Web1 extends BaseWeb {
              @Override
              protected String suffix() {
                  return "a1";
              }
          }
          EOF

          cat > app/src/main/java/com/example/claudemulti/Web2.java <<'EOF'
          package com.example.claudemulti;

          public class Web2 extends BaseWeb {
              @Override
              protected String suffix() {
                  return "a2";
              }
          }
          EOF

          cat > app/src/main/java/com/example/claudemulti/Web3.java <<'EOF'
          package com.example.claudemulti;

          public class Web3 extends BaseWeb {
              @Override
              protected String suffix() {
                  return "a3";
              }
          }
          EOF

          cat > app/src/main/java/com/example/claudemulti/Web4.java <<'EOF'
          package com.example.claudemulti;

          public class Web4 extends BaseWeb {
              @Override
              protected String suffix() {
                  return "a4";
              }
          }
          EOF

          echo '' | base64 -d > app/src/main/res/drawable/ic_launcher.png

      - name: Build
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: ClaudeMulti
          path: app/build/outputs/apk/debug/app-debug.apk
