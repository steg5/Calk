                              placed.add(rc);
                              tpn.setTextAlign(Paint.Align.CENTER);
                              halo(cv, tpn, pt.name, x, y + 4 * density);
                          }
                      }
                  }
              }

              @Override
              protected void onDraw(Canvas cv) {
                  stepAnim();
                  float W = getWidth(), H = getHeight(), pvx = pvx(), pvy = pvy();
                  cv.drawColor(night ? 0xFF111111 : 0xFFE8E4DC);
                  if (db == null) {
                      p.setColor(0xFF888888);
                      p.setTextSize(28 * density);
                      p.setTextAlign(Paint.Align.CENTER);
                      cv.drawText(error == null ? "Немає файлу карти" : "Помилка карти", W / 2, H / 2, p);
                      return;
                  }
                  int tz = (int) Math.max(minZ, Math.min(maxZ, Math.floor(zoom)));
                  double scale = Math.pow(2, zoom - tz);
                  float ts = (float) (256.0 * density * scale);
                  double n = Math.pow(2, tz);
                  double cx = lonToX(lon) * n, cy = latToY(lat) * n;
                  double r = Math.toRadians(rot), cr = Math.cos(r), sr = Math.sin(r);
                  double minX = 1e18, maxX = -1e18, minY = 1e18, maxY = -1e18;
                  float[][] cs = {{0, 0}, {W, 0}, {0, H}, {W, H}};
                  for (float[] c : cs) {
                      double ddx = c[0] - pvx, ddy = c[1] - pvy;
                      double ux = ddx * cr - ddy * sr, uy = ddx * sr + ddy * cr;
                      minX = Math.min(minX, ux);
                      maxX = Math.max(maxX, ux);
                      minY = Math.min(minY, uy);
                      maxY = Math.max(maxY, uy);
                  }
                  int x0 = (int) Math.floor(cx + minX / ts), x1 = (int) Math.floor(cx + maxX / ts);
                  int y0 = (int) Math.floor(cy + minY / ts), y1 = (int) Math.floor(cy + maxY / ts);
                  int max = (int) n;
                  List<Object[]> vis = new ArrayList<Object[]>();
                  cv.save();
                  cv.rotate(-rot, pvx, pvy);
                  if ((x1 - x0 + 1) * (y1 - y0 + 1) <= 160) {
                      for (int ty = y0; ty <= y1; ty++) {
                          if (ty < 0 || ty >= max) continue;
                          for (int tx = x0; tx <= x1; tx++) {
                              int txx = ((tx % max) + max) % max;
                              Tile b = tile(tz, txx, ty);
                              float l = (float) (pvx + (tx - cx) * ts), t = (float) (pvy + (ty - cy) * ts);
                              if (b != null) {
                                  cv.drawBitmap(b.bm, null, new RectF(l, t, l + ts + 1, t + ts + 1), night ? nightP : tp);
                                  if (b.labels != null) vis.add(new Object[]{b.labels, l, t, ts});
                              }
                          }
                      }
                  }
                  cv.restore();
                  drawLabels(cv, vis);
                  // мітка і лінія
                  boolean fl = follow && hasFix;
                  float[] me = fl ? new float[]{pvx, pvy} : (hasFix ? scr(myLat, myLon) : null);
                  if (markLat != null) {
                      float[] m = scr(markLat, markLon);
                      if (me != null) {
                          p.setColor(0xFFE53935);
                          p.setStrokeWidth(4 * density);
                          p.setStyle(Paint.Style.STROKE);
                          cv.drawLine(me[0], me[1], m[0], m[1], p);
                      }
                      p.setStyle(Paint.Style.FILL);
                      p.setColor(0xFFE53935);
                      cv.drawCircle(m[0], m[1], 11 * density, p);
                      p.setColor(0xFFFFFFFF);
                      cv.drawCircle(m[0], m[1], 4 * density, p);
                  }
                  if (me != null) {
                      cv.save();
                      cv.translate(me[0], me[1]);
                      cv.rotate(fixBearing - rot);
                      Path a = new Path();
                      float s = 18 * density;
                      a.moveTo(0, -s);
                      a.lineTo(s * 0.75f, s * 0.8f);
                      a.lineTo(0, s * 0.4f);
                      a.lineTo(-s * 0.75f, s * 0.8f);
                      a.close();
                      p.setStyle(Paint.Style.FILL);
                      p.setColor(0xFF1E88E5);
                      cv.drawPath(a, p);
                      p.setStyle(Paint.Style.STROKE);
                      p.setStrokeWidth(2.5f * density);
                      p.setColor(0xFFFFFFFF);
                      cv.drawPath(a, p);
                      cv.restore();
                  }
                  p.setStyle(Paint.Style.FILL);
                  if (fl) postInvalidateOnAnimation();
              }

              @Override
              public boolean onTouchEvent(MotionEvent e) {
                  sg.onTouchEvent(e);
                  gd.onTouchEvent(e);
                  return true;
              }
          }
