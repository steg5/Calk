              }

              static final String[] RANK = {"service", "minor", "tertiary", "secondary", "primary", "trunk", "motorway"};
              static final int[] FILL = {0xFFFFFFFF, 0xFFFFFFFF, 0xFFFFFFFF, 0xFFF7FABF, 0xFFFCD6A4, 0xFFF9B29C, 0xFFE892A2};
              static final int[] CASE = {0xFFBDBDBD, 0xFFBDBDBD, 0xFFBDBDBD, 0xFFB9B97A, 0xFFD9A55A, 0xFFD98A74, 0xFFDC2A67};
              static final float[] WID = {1.5f, 2.2f, 3f, 3.5f, 4f, 4.5f, 5f};

              static int rank(String c) {
                  if (c == null) return -1;
                  if (c.equals("residential") || c.equals("unclassified") || c.equals("living_street")) c = "minor";
                  for (int i = 0; i < RANK.length; i++) if (RANK[i].equals(c)) return i;
                  return -1;
              }

              static Integer landColor(String layer, String c) {
                  if (c == null) return null;
                  if (layer.equals("landcover")) {
                      if (c.equals("wood")) return 0xFFC5E0B0;
                      if (c.equals("grass")) return 0xFFDDEBC8;
                      if (c.equals("farmland")) return 0xFFEEEFD5;
                      if (c.equals("wetland")) return 0xFFD3E8E0;
                      if (c.equals("sand")) return 0xFFF5E9C6;
                      if (c.equals("rock")) return 0xFFE0DCD5;
                      if (c.equals("ice")) return 0xFFFFFFFF;
                  } else {
                      if (c.equals("residential") || c.equals("suburb")) return 0xFFE9E5DC;
                      if (c.equals("commercial") || c.equals("retail")) return 0xFFF2DAD9;
                      if (c.equals("industrial") || c.equals("railway")) return 0xFFE6DDE8;
                      if (c.equals("cemetery")) return 0xFFAACBAF;
                      if (c.equals("garden") || c.equals("park") || c.equals("playground") || c.equals("pitch") || c.equals("zoo") || c.equals("theme_park"))
                          return 0xFFCDEBB1;
                      if (c.equals("military")) return 0xFFF1D9D9;
                      if (c.equals("quarry")) return 0xFFC5C3C3;
                  }
                  return null;
              }

              public static Bitmap render(byte[] raw, int z, int size, TileLabels out) {
                  Bitmap bm = Bitmap.createBitmap(size, size, Bitmap.Config.ARGB_8888);
                  Canvas c = new Canvas(bm);
                  c.drawColor(0xFFF2EFE9);
                  try {
                      byte[] d = raw;
                      if (raw.length > 2 && (raw[0] & 0xff) == 0x1f && (raw[1] & 0xff) == 0x8b) d = gunzip(raw);
                      Map<String, Layer> L = parse(d);
                      float k = (float) Math.max(0.6, Math.min(3.0, 0.6 + 0.35 * (z - 10))) * size / 512f;
                      Paint p = new Paint(Paint.ANTI_ALIAS_FLAG);
                      p.setStrokeCap(Paint.Cap.ROUND);
                      p.setStrokeJoin(Paint.Join.ROUND);

                      for (String ln : new String[]{"landcover", "landuse"}) {
                          Layer l = L.get(ln);
                          if (l == null) continue;
                          float sc = size / (float) l.extent;
                          for (Feat f : l.feats) {
                              if (f.type != 3) continue;
                              Integer col = landColor(ln, f.str("class"));
                              if (col == null) continue;
                              Path pa = toPath(f, sc);
                              pa.setFillType(Path.FillType.EVEN_ODD);
                              p.setStyle(Paint.Style.FILL);
                              p.setColor(col);
                              c.drawPath(pa, p);
                          }
                      }
                      Layer w = L.get("water");
                      if (w != null) {
                          float sc = size / (float) w.extent;
                          for (Feat f : w.feats) {
                              if (f.type != 3) continue;
                              Path pa = toPath(f, sc);
                              pa.setFillType(Path.FillType.EVEN_ODD);
                              p.setStyle(Paint.Style.FILL);
                              p.setColor(0xFFAAD3DF);
                              c.drawPath(pa, p);
                          }
                      }
                      Layer ww = L.get("waterway");
                      if (ww != null) {
                          float sc = size / (float) ww.extent;
                          p.setStyle(Paint.Style.STROKE);
                          p.setColor(0xFF8CBCDB);
                          p.setStrokeWidth(1.6f * k);
                          for (Feat f : ww.feats) if (f.type == 2) c.drawPath(toPath(f, sc), p);
                      }
                      Layer bl = L.get("building");
                      if (bl != null && z >= 13) {
                          float sc = size / (float) bl.extent;
                          for (Feat f : bl.feats) {
                              if (f.type != 3) continue;
                              Path pa = toPath(f, sc);
                              pa.setFillType(Path.FillType.EVEN_ODD);
                              p.setStyle(Paint.Style.FILL);
                              p.setColor(0xFFD9D0C9);
                              c.drawPath(pa, p);
                              p.setStyle(Paint.Style.STROKE);
                              p.setStrokeWidth(1f);
                              p.setColor(0xFFC4B7AE);
                              c.drawPath(pa, p);
                          }
                      }
                      Layer tr = L.get("transportation");
                      if (tr != null) {
                          float sc = size / (float) tr.extent;
                          List<List<Path>> byRank = new ArrayList<List<Path>>();
                          for (int i = 0; i < RANK.length; i++) byRank.add(new ArrayList<Path>());
                          List<Path> rail = new ArrayList<Path>(), paths = new ArrayList<Path>();
                          for (Feat f : tr.feats) {
                              if (f.type != 2) continue;
                              String cl = f.str("class");
                              if ("rail".equals(cl)) {
                                  rail.add(toPath(f, sc));
                                  continue;
                              }
                              if ("path".equals(cl) || "track".equals(cl)) {
                                  if (z >= 13) paths.add(toPath(f, sc));
                                  continue;
                              }
                              int r = rank(cl);
                              if (r >= 0) byRank.get(r).add(toPath(f, sc));
                          }
                          p.setStyle(Paint.Style.STROKE);
                          p.setPathEffect(new DashPathEffect(new float[]{6 * k, 4 * k}, 0));
                          p.setColor(0xFFB5A99C);
                          p.setStrokeWidth(1.2f * k);
                          for (Path pa : paths) c.drawPath(pa, p);
                          p.setPathEffect(null);
                          for (int r = 0; r < RANK.length; r++) {
                              List<Path> l = byRank.get(r);
                              if (l.isEmpty()) continue;
                              p.setColor(CASE[r]);
                              p.setStrokeWidth(WID[r] * k + 1.6f * k);
                              for (Path pa : l) c.drawPath(pa, p);
                              p.setColor(FILL[r]);
                              p.setStrokeWidth(WID[r] * k);
                              for (Path pa : l) c.drawPath(pa, p);
                          }
                          p.setColor(0xFF888888);
                          p.setStrokeWidth(1.3f * k);
                          p.setPathEffect(new DashPathEffect(new float[]{10 * k, 6 * k}, 0));
                          for (Path pa : rail) c.drawPath(pa, p);
                          p.setPathEffect(null);
                      }
                      Layer bd = L.get("boundary");
                      if (bd != null) {
                          float sc = size / (float) bd.extent;
                          p.setStyle(Paint.Style.STROKE);
                          p.setColor(0xFF9E7CB3);
                          p.setPathEffect(new DashPathEffect(new float[]{12 * k, 6 * k}, 0));
                          for (Feat f : bd.feats) {
                              if (f.type != 2) continue;
                              double al = f.num("admin_level", 9);
                              if (al > 6) continue;
                              p.setStrokeWidth((al <= 2 ? 3f : 1.8f) * k);
                              c.drawPath(toPath(f, sc), p);
                          }
                          p.setPathEffect(null);
                      }
                      if (out != null) {
                          Layer tn = L.get("transportation_name");
                          if (tn != null) {
                              float sc = 1f / tn.extent;
                              for (Feat f : tn.feats) {
                                  if (f.type != 2) continue;
                                  String nm = nameOf(f);
                                  if (nm == null) continue;
                                  int rk = Math.max(0, rank(f.str("class")));
                                  for (float[] ln : lines(f, sc)) {
                                      Road r = new Road();
                                      r.name = nm;
                                      r.rank = rk;
                                      r.xy = ln;
                                      out.roads.add(r);
                                  }
                              }
                          }
                          String[] pl2 = {"housenumber", "poi", "place"};
                          for (int q = 0; q < 3; q++) {
                              Layer ly = L.get(pl2[q]);
                              if (ly == null) continue;
                              float sc = 1f / ly.extent;
                              for (Feat f : ly.feats) {
                                  if (f.type != 1 || f.geom.length < 3) continue;
                                  PointLabel pt = new PointLabel();
                                  pt.kind = q + 1;
                                  pt.name = q == 0 ? f.str("housenumber") : nameOf(f);
                                  pt.cls = q == 0 ? "" : q == 2 ? String.valueOf(f.str("class")) : String.valueOf(f.str("class")) + "/" + String.valueOf(f.str("subclass"));
                                  if (pt.name == null && q != 1) continue;
                                  pt.x = unzig(f.geom[1]) * sc;
                                  pt.y = unzig(f.geom[2]) * sc;
                                  out.pts.add(pt);
                              }
                          }
                      }
                  } catch (Throwable t) {
                      // залишаємо те, що встигли намалювати
                  }
                  return bm;
              }
          }
          EOF

          cat > app/src/main/java/com/example/maptest/MainActivity.java <<'EOF'
          package com.example.maptest;

          import android.Manifest;
          import android.app.Activity;
          import android.content.SharedPreferences;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.graphics.drawable.GradientDrawable;
          import android.location.Location;
          import android.location.LocationListener;
          import android.location.LocationManager;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.Gravity;
          import android.view.View;
          import android.widget.Button;
          import android.widget.FrameLayout;
          import android.widget.TextView;

          import java.io.File;
          import java.util.Locale;

          public class MainActivity extends Activity implements MapView.Listener {
              MapView map;
              TextView info;
              SharedPreferences sp;
              LocationManager lm;
              boolean opened = false;

              Button btn(String t, int size) {
                  Button b = new Button(this);
                  b.setText(t);
                  b.setAllCaps(false);
                  b.setTextSize(size);
                  b.setTextColor(Color.WHITE);
                  GradientDrawable g = new GradientDrawable();
                  g.setColor(0xCC1B2838);
                  g.setCornerRadius(16);
                  b.setBackground(g);
                  b.setMinWidth(0);
                  b.setMinimumWidth(0);
                  b.setMinHeight(0);
                  b.setMinimumHeight(0);
                  return b;
              }

              @Override
              protected void onCreate(Bundle s) {
                  super.onCreate(s);
                  sp = getSharedPreferences("map", MODE_PRIVATE);
                  FrameLayout root = new FrameLayout(this);
                  map = new MapView(this);
                  map.listener = this;
                  root.addView(map, new FrameLayout.LayoutParams(-1, -1));
                  info = new TextView(this);
                  info.setTextColor(Color.WHITE);
                  info.setTextSize(18);
                  info.setPadding(20, 12, 20, 12);
                  GradientDrawable ig = new GradientDrawable();
                  ig.setColor(0xAA101A28);
                  ig.setCornerRadius(16);
                  info.setBackground(ig);
                  FrameLayout.LayoutParams ip = new FrameLayout.LayoutParams(-2, -2, Gravity.TOP | Gravity.LEFT);
                  ip.setMargins(16, 16, 0, 0);
                  root.addView(info, ip);

                  int sz = (int) (64 * getResources().getDisplayMetrics().density);
                  Button plus = btn("+", 30), minus = btn("−", 30), me = btn("◎", 26), nt = btn("Ніч", 16), clr = btn("✕", 22), hd = btn("↑", 24);
                  plus.setOnClickListener(v -> map.zoomBy(1));
                  minus.setOnClickListener(v -> map.zoomBy(-1));
                  me.setOnClickListener(v -> map.goToMe());
                  nt.setOnClickListener(v -> {
                      map.night = !map.night;
                      sp.edit().putBoolean("night", map.night).apply();
                      map.invalidate();
                  });
                  clr.setOnClickListener(v -> {
                      map.markLat = null;
                      map.markLon = null;
                      sp.edit().remove("mlat").remove("mlon").apply();
                      onMarkChanged();
                      map.invalidate();
                  });
                  hd.setOnClickListener(v -> {
                      map.headingUp = !map.headingUp;
                      hd.setText(map.headingUp ? "↑" : "N");
                      map.invalidate();
                  });
                  Button[] bs = {plus, minus, me, hd, nt, clr};
                  for (int i = 0; i < bs.length; i++) {
                      FrameLayout.LayoutParams bp = new FrameLayout.LayoutParams(sz, sz, Gravity.RIGHT | Gravity.CENTER_VERTICAL);
                      bp.setMargins(0, 0, 16, 0);
                      bs[i].setTranslationY((i - 2.5f) * (sz + 12));
                      root.addView(bs[i], bp);
                  }
                  setContentView(root);

                  map.night = sp.getBoolean("night", false);
                  if (sp.contains("mlat")) {
                      map.markLat = (double) sp.getFloat("mlat", 0);
                      map.markLon = (double) sp.getFloat("mlon", 0);
                  }
                  if (sp.contains("clat")) {
                      map.lat = sp.getFloat("clat", 49.84f);
                      map.lon = sp.getFloat("clon", 24.03f);
                      map.zoom = sp.getFloat("czoom", 12);
                  }
                  if (Build.VERSION.SDK_INT >= 23 && (checkSelfPermission(Manifest.permission.READ_EXTERNAL_STORAGE) != PackageManager.PERMISSION_GRANTED
                          || checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION) != PackageManager.PERMISSION_GRANTED)) {
                      requestPermissions(new String[]{Manifest.permission.READ_EXTERNAL_STORAGE, Manifest.permission.ACCESS_FINE_LOCATION}, 1);
                  } else {
                      init();
                  }
              }

              void init() {
                  if (opened) return;
                  opened = true;
                  File ext = getExternalFilesDir(null);
                  String root = android.os.Environment.getExternalStorageDirectory().getAbsolutePath();
                  String[] paths = {root + "/map.mbtiles", "/storage/emulated/0/map.mbtiles", "/sdcard/map.mbtiles", ext == null ? "" : ext.getAbsolutePath() + "/map.mbtiles"};
                  boolean ok = false;
                  for (String p : paths) {
                      if (!p.isEmpty() && new File(p).canRead() && map.open(p)) {
                          ok = true;
                          break;
                      }
                  }
                  if (!ok) info.setText("Файл карти не знайдено.\nПоклади в корінь пам'яті (" + root + "/map.mbtiles)" + (map.error == null ? "" : "\n" + map.error));
                  startGps();
                  onMarkChanged();
              }

              @Override
              public void onRequestPermissionsResult(int r, String[] p, int[] g) {
                  super.onRequestPermissionsResult(r, p, g);
                  init();
                  startGps();
              }

              final LocationListener ll = new LocationListener() {
                  @Override
                  public void onLocationChanged(Location l) {
                      float b = l.hasBearing() && l.getSpeed() > 1.5f ? l.getBearing() : -1;
                      map.setMyLocation(l.getLatitude(), l.getLongitude(), b, l.hasSpeed() ? l.getSpeed() : 0f);
                      onMarkChanged();
                  }

                  @Override
                  public void onStatusChanged(String s, int i, Bundle b) {
                  }

                  @Override
                  public void onProviderEnabled(String s) {
                  }

                  @Override
                  public void onProviderDisabled(String s) {
                  }
              };

              boolean gps = false;

              void startGps() {
                  if (gps) return;
                  if (Build.VERSION.SDK_INT >= 23 && checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION) != PackageManager.PERMISSION_GRANTED) return;
                  try {
                      lm = (LocationManager) getSystemService(LOCATION_SERVICE);
                      lm.requestLocationUpdates(LocationManager.GPS_PROVIDER, 1000, 0, ll);
                      gps = true;
                  } catch (Throwable ignored) {
                  }
              }

              @Override
              public void onMarkChanged() {
                  if (map.db == null) return;
                  String t = String.format(Locale.US, "Масштаб %.1f   %s", map.zoom, map.hasFix ? "GPS ✓" : "GPS: чекаю…");
                  if (map.markLat != null) {
                      sp.edit().putFloat("mlat", map.markLat.floatValue()).putFloat("mlon", map.markLon.floatValue()).apply();
                      if (map.hasFix) {
                          double d = MapView.distKm(map.myLat, map.myLon, map.markLat, map.markLon);
                          double br = MapView.bearing(map.myLat, map.myLon, map.markLat, map.markLon);
                          t += String.format(Locale.US, "\nДо мітки: %.1f км, азимут %d°", d, Math.round(br));
                      }
                  } else {
                      t += "\nДовге натискання на карті — поставити мітку";
                  }
                  info.setText(t);
              }

              @Override
              protected void onPause() {
                  super.onPause();
                  sp.edit().putFloat("clat", (float) map.lat).putFloat("clon", (float) map.lon).putFloat("czoom", (float) map.zoom).apply();
              }

              @Override
              protected void onDestroy() {
                  try {
                      if (lm != null) lm.removeUpdates(ll);
                  } catch (Throwable ignored) {
                  }
                  map.close();
                  super.onDestroy();
              }
          }
          EOF

          echo '' | base64 -d > app/src/main/res/drawable/ic_launcher.png

      - name: Build
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: MapTest
          path: app/build/outputs/apk/debug/app-debug.apk
