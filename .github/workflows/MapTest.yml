name: Build CarServiceProbe APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Create Android project
        shell: bash
        run: |
          mkdir -p app/src/main/java/ua/step/carserviceprobe

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "CarServiceProbe"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'ua.step.carserviceprobe'
              compileSdk 35

              defaultConfig {
                  applicationId 'ua.step.carserviceprobe'
                  minSdk 23
                  targetSdk 27
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="false"
                  android:label="CarService Probe"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/ua/step/carserviceprobe/MainActivity.java <<'EOF'
          package ua.step.carserviceprobe;

          import android.app.Activity;
          import android.content.ComponentName;
          import android.content.Context;
          import android.content.Intent;
          import android.content.ServiceConnection;
          import android.os.Bundle;
          import android.os.IBinder;
          import android.view.Gravity;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;

          public class MainActivity extends Activity {
              private static final String SERVICE_PACKAGE = "com.tw.carinfoservice";
              private static final String SERVICE_CLASS = "com.tw.carinfoservice.CarService";
              private static final String SERVICE_ACTION = "com.tw.carinfoservice.CarService.Bind";

              private TextView result;
              private boolean bound = false;
              private ServiceConnection connection;

              private void log(String message) {
                  runOnUiThread(() -> result.append(message + "\n\n"));
              }

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(20, 20, 20, 20);

                  TextView title = new TextView(this);
                  title.setText("CarService Probe");
                  title.setTextSize(24);
                  title.setGravity(Gravity.CENTER);
                  root.addView(title);

                  TextView info = new TextView(this);
                  info.setText("Перевірка Binder-з'єднання зі штатною службою. UART не відкривається.");
                  info.setTextSize(15);
                  root.addView(info);

                  Button connect = new Button(this);
                  connect.setText("Перевірити CarService");
                  root.addView(connect);

                  Button disconnect = new Button(this);
                  disconnect.setText("Від'єднатися");
                  root.addView(disconnect);

                  result = new TextView(this);
                  result.setTextSize(14);
                  result.setTextIsSelectable(true);
                  ScrollView scroll = new ScrollView(this);
                  scroll.addView(result);
                  root.addView(scroll, new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT, 0, 1f));

                  setContentView(root);

                  connect.setOnClickListener(v -> connectToCarService());
                  disconnect.setOnClickListener(v -> disconnectFromCarService());

                  result.setText("Готово. Натисни «Перевірити CarService».\n\n");
                  log("Компонент: " + SERVICE_PACKAGE + "/" + SERVICE_CLASS);
                  log("Action: " + SERVICE_ACTION);
                  log("Android API: " + android.os.Build.VERSION.SDK_INT);
              }

              private void connectToCarService() {
                  if (bound) {
                      log("З'єднання вже встановлене.");
                      return;
                  }

                  connection = new ServiceConnection() {
                      @Override
                      public void onServiceConnected(ComponentName name, IBinder service) {
                          bound = true;
                          log("УСПІХ: onServiceConnected викликано.");
                          log("Компонент: " + name.flattenToShortString());
                          log("Binder alive: " + service.isBinderAlive());
                          log("Binder ping: " + service.pingBinder());
                          try {
                              log("Interface descriptor: " + service.getInterfaceDescriptor());
                          } catch (Exception e) {
                              log("Не вдалося прочитати descriptor: " + e);
                          }
                          log("Binder доступний. Це ще не підтверджує отримання телеметрії.");
                      }

                      @Override
                      public void onServiceDisconnected(ComponentName name) {
                          bound = false;
                          log("Служба від'єдналася: " + name.flattenToShortString());
                      }

                      @Override
                      public void onBindingDied(ComponentName name) {
                          bound = false;
                          log("Binding died: " + name.flattenToShortString());
                      }

                      @Override
                      public void onNullBinding(ComponentName name) {
                          bound = false;
                          log("Служба повернула null binding.");
                      }
                  };

                  Intent intent = new Intent();
                  intent.setComponent(new ComponentName(SERVICE_PACKAGE, SERVICE_CLASS));
                  intent.setAction(SERVICE_ACTION);

                  try {
                      boolean accepted = bindService(intent, connection, Context.BIND_AUTO_CREATE);
                      log("bindService() повернув: " + accepted);
                      if (!accepted) {
                          log("Android не прийняв запит на підключення.");
                      }
                  } catch (SecurityException e) {
                      log("ВІДМОВА ДОСТУПУ: " + e);
                  } catch (Exception e) {
                      log("ПОМИЛКА ПІДКЛЮЧЕННЯ: " + e);
                  }
              }

              private void disconnectFromCarService() {
                  if (bound && connection != null) {
                      try {
                          unbindService(connection);
                          log("Від'єднано.");
                      } catch (Exception e) {
                          log("Помилка від'єднання: " + e);
                      }
                  } else {
                      log("Активного з'єднання немає.");
                  }
                  bound = false;
                  connection = null;
              }

              @Override
              protected void onDestroy() {
                  if (bound && connection != null) {
                      try {
                          unbindService(connection);
                      } catch (Exception ignored) {
                      }
                  }
                  bound = false;
                  super.onDestroy();
              }
          }
          EOF

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CarServiceProbe-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
