          /** Дуже проста відмальовка векторних плиток (Mapbox Vector Tile, схема OpenMapTiles) у растр. */
          public class VectorRenderer {
              static class Layer {
                  String name;
                  List<String> keys = new ArrayList<String>();
                  List<Object> vals = new ArrayList<Object>();
                  List<Feat> feats = new ArrayList<Feat>();
                  int extent = 4096;
              }

              static class Feat {
                  int type;
                  int[] tags, geom;
                  Layer layer;

                  Object get(String k) {
                      if (tags == null) return null;
                      for (int i = 0; i + 1 < tags.length; i += 2) {
                          int ki = tags[i], vi = tags[i + 1];
                          if (ki < layer.keys.size() && layer.keys.get(ki).equals(k)) return vi < layer.vals.size() ? layer.vals.get(vi) : null;
                      }
                      return null;
                  }

                  String str(String k) {
                      Object o = get(k);
                      return o == null ? null : String.valueOf(o);
                  }

                  double num(String k, double d) {
                      Object o = get(k);
                      if (o instanceof Number) return ((Number) o).doubleValue();
                      return d;
                  }
              }

              static class Pb {
                  byte[] b;
                  int p, end;

                  Pb(byte[] b, int p, int end) {
                      this.b = b;
                      this.p = p;
                      this.end = end;
                  }

                  boolean more() {
                      return p < end;
                  }

                  long v64() {
                      long r = 0;
                      int sh = 0;
                      while (true) {
                          int c = b[p++];
                          r |= (long) (c & 0x7f) << sh;
                          if ((c & 0x80) == 0) break;
                          sh += 7;
                      }
                      return r;
                  }

                  int v32() {
                      return (int) v64();
                  }

                  void skip(int w) {
                      if (w == 0) v64();
                      else if (w == 1) p += 8;
                      else if (w == 2) p += v32();
                      else if (w == 5) p += 4;
                  }
              }

              static byte[] gunzip(byte[] d) throws Exception {
                  GZIPInputStream in = new GZIPInputStream(new ByteArrayInputStream(d));
                  ByteArrayOutputStream bo = new ByteArrayOutputStream();
                  byte[] buf = new byte[8192];
                  int n;
                  while ((n = in.read(buf)) > 0) bo.write(buf, 0, n);
                  return bo.toByteArray();
              }

              static int[] packed(byte[] d, int s, int e) {
                  int[] tmp = new int[e - s];
                  int n = 0;
                  Pb pb = new Pb(d, s, e);
                  while (pb.more()) tmp[n++] = pb.v32();
                  return Arrays.copyOf(tmp, n);
              }

              static Object parseValue(byte[] d, int s, int e) {
                  Pb pb = new Pb(d, s, e);
                  Object r = null;
                  while (pb.more()) {
                      int tag = pb.v32(), f = tag >>> 3, w = tag & 7;
                      if (f == 1 && w == 2) {
                          int len = pb.v32();
                          r = new String(d, pb.p, len, java.nio.charset.Charset.forName("UTF-8"));
                          pb.p += len;
                      } else if (f == 2 && w == 5) {
                          int bits = (d[pb.p] & 0xff) | (d[pb.p + 1] & 0xff) << 8 | (d[pb.p + 2] & 0xff) << 16 | (d[pb.p + 3] & 0xff) << 24;
                          r = (double) Float.intBitsToFloat(bits);
                          pb.p += 4;
                      } else if (f == 3 && w == 1) {
                          long bits = 0;
                          for (int i = 7; i >= 0; i--) bits = (bits << 8) | (d[pb.p + i] & 0xff);
                          r = Double.longBitsToDouble(bits);
                          pb.p += 8;
                      } else if (w == 0) {
                          long v = pb.v64();
                          if (f == 6) v = (v >>> 1) ^ -(v & 1);
                          r = v;
                      } else {
