                  return r;
              }

              static Layer parseLayer(byte[] d, int s, int e) {
                  Layer l = new Layer();
                  Pb pb = new Pb(d, s, e);
                  while (pb.more()) {
                      int tag = pb.v32(), f = tag >>> 3, w = tag & 7;
                      if (w == 2 && (f == 1 || f == 3)) {
                          int len = pb.v32();
                          String str = new String(d, pb.p, len, java.nio.charset.Charset.forName("UTF-8"));
                          pb.p += len;
                          if (f == 1) l.name = str;
                          else l.keys.add(str);
                      } else if (w == 2 && f == 2) {
                          int len = pb.v32();
                          Feat ft = new Feat();
                          ft.layer = l;
                          Pb fp = new Pb(d, pb.p, pb.p + len);
                          while (fp.more()) {
                              int t2 = fp.v32(), f2 = t2 >>> 3, w2 = t2 & 7;
                              if (f2 == 2 && w2 == 2) {
                                  int n = fp.v32();
                                  ft.tags = packed(d, fp.p, fp.p + n);
                                  fp.p += n;
                              } else if (f2 == 3 && w2 == 0) {
                                  ft.type = fp.v32();
                              } else if (f2 == 4 && w2 == 2) {
                                  int n = fp.v32();
                                  ft.geom = packed(d, fp.p, fp.p + n);
                                  fp.p += n;
                              } else {
                                  fp.skip(w2);
                              }
                          }
                          if (ft.geom != null) l.feats.add(ft);
                          pb.p += len;
                      } else if (w == 2 && f == 4) {
                          int len = pb.v32();
                          l.vals.add(parseValue(d, pb.p, pb.p + len));
                          pb.p += len;
                      } else if (w == 0 && f == 5) {
                          l.extent = pb.v32();
                      } else {
                          pb.skip(w);
                      }
                  }
                  return l;
              }

              static Map<String, Layer> parse(byte[] d) {
                  Map<String, Layer> m = new HashMap<String, Layer>();
                  Pb t = new Pb(d, 0, d.length);
                  while (t.more()) {
                      int tag = t.v32(), f = tag >>> 3, w = tag & 7;
                      if (f == 3 && w == 2) {
                          int len = t.v32();
                          Layer l = parseLayer(d, t.p, t.p + len);
                          t.p += len;
                          if (l.name != null) m.put(l.name, l);
                      } else {
                          t.skip(w);
                      }
                  }
                  return m;
              }

              static int unzig(int v) {
                  return (v >>> 1) ^ -(v & 1);
              }

              static Path toPath(Feat f, float sc) {
                  Path p = new Path();
                  int x = 0, y = 0, i = 0;
                  int[] g = f.geom;
                  while (i < g.length) {
                      int cmd = g[i++], id = cmd & 7, cnt = cmd >>> 3;
                      if (id == 1 || id == 2) {
                          for (int k = 0; k < cnt && i + 1 < g.length + 1; k++) {
                              x += unzig(g[i++]);
                              y += unzig(g[i++]);
                              if (id == 1) p.moveTo(x * sc, y * sc);
                              else p.lineTo(x * sc, y * sc);
                          }
                      } else if (id == 7) {
                          p.close();
                      }
                  }
                  return p;
              }

              public static class Road {
                  public String name;
                  public int rank;
                  public float[] xy;
              }

              public static class PointLabel {
                  public String name, cls;
                  public int kind; // 1 - номер будинку, 2 - заклад, 3 - населений пункт
                  public float x, y;
              }

              public static class TileLabels {
                  public List<Road> roads = new ArrayList<Road>();
                  public List<PointLabel> pts = new ArrayList<PointLabel>();
              }

              /** Лінії об'єкта в нормалізованих координатах (0..1), напрямок зліва направо. */
              static List<float[]> lines(Feat f, float sc) {
                  List<float[]> res = new ArrayList<float[]>();
                  List<float[]> pts = new ArrayList<float[]>();
                  int x = 0, y = 0, i = 0;
                  int[] g = f.geom;
                  while (i < g.length) {
                      int cmd = g[i++], id = cmd & 7, cnt = cmd >>> 3;
                      if (id == 1 || id == 2) {
                          for (int k = 0; k < cnt; k++) {
                              x += unzig(g[i++]);
                              y += unzig(g[i++]);
                              if (id == 1 && !pts.isEmpty()) {
                                  flat(pts, res);
                                  pts = new ArrayList<float[]>();
                              }
                              pts.add(new float[]{x * sc, y * sc});
                          }
                      }
                  }
                  flat(pts, res);
                  return res;
              }

              static void flat(List<float[]> pts, List<float[]> out) {
                  if (pts.size() < 2) return;
                  if (pts.get(pts.size() - 1)[0] < pts.get(0)[0]) java.util.Collections.reverse(pts);
                  float[] a = new float[pts.size() * 2];
                  for (int i = 0; i < pts.size(); i++) {
                      a[i * 2] = pts.get(i)[0];
                      a[i * 2 + 1] = pts.get(i)[1];
                  }
                  out.add(a);
              }

              static String nameOf(Feat f) {
                  String nm = f.str("name");
                  if (nm == null) nm = f.str("name:uk");
                  if (nm == null) nm = f.str("name:latin");
