name: MapTest

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/MapTest.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Write project
        run: |
          mkdir -p app/src/main/java/com/example/maptest app/src/main/res/drawable
          echo '' | base64 -d > debug.keystore

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'MapTest'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=false
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.example.maptest'
              compileSdk 34
              defaultConfig {
                  applicationId "com.example.maptest"
                  minSdk 23
                  targetSdk 26
                  versionCode 7
                  versionName "1.6"
              }
              signingConfigs {
                  debug {
                      storeFile file("${rootDir}/debug.keystore")
                      storePassword 'android'
                      keyAlias 'androiddebugkey'
                      keyPassword 'android'
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
              lint {
                  abortOnError false
                  checkReleaseBuilds false
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>
              <application
                  android:label="Карта"
                  android:icon="@drawable/ic_launcher"
                  android:allowBackup="false"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="sensorLandscape"
                      android:configChanges="orientation|screenSize|keyboardHidden|screenLayout|density">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/example/maptest/MapView.java <<'EOF'
          package com.example.maptest;

          import android.content.Context;
          import android.database.Cursor;
          import android.database.sqlite.SQLiteDatabase;
          import android.graphics.Bitmap;
          import android.graphics.BitmapFactory;
          import android.graphics.Canvas;
          import android.graphics.ColorMatrix;
          import android.graphics.ColorMatrixColorFilter;
          import android.graphics.Paint;
          import android.graphics.Path;
          import android.graphics.PathMeasure;
          import android.graphics.RectF;
          import android.graphics.Typeface;
          import android.util.LruCache;
          import android.view.GestureDetector;
          import android.view.MotionEvent;
          import android.view.ScaleGestureDetector;
          import android.view.View;

          import java.util.ArrayList;
          import java.util.List;
          import java.util.Set;
          import java.util.concurrent.ConcurrentHashMap;
          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;

          /** Проста офлайн-карта з файлу MBTiles (растр або вектор OpenMapTiles). */
          public class MapView extends View {
              public interface Listener {
                  void onMarkChanged();
              }

              SQLiteDatabase db;
              int minZ = 0, maxZ = 18;
              // відображуваний стан (плавно рухається до цілі)
              public double lat = 49.8397, lon = 24.0297, zoom = 12;
              public float rot = 0;
              float pivY = -1;
              public boolean follow = true, night = false, hasFix = false, headingUp = true;
              long manualUntil = 0;
              // останній GPS-фікс
              double fixLat, fixLon;
              float fixBearing = 0, fixSpeed = 0;
              long fixTime = 0, lastNs = 0;
              public double myLat, myLon;
              public Double markLat, markLon;
              public Listener listener;
              public String error = null;
              boolean vector = false;
              float density;

              static class Tile {
                  Bitmap bm;
                  VectorRenderer.TileLabels labels;

                  Tile(Bitmap b, VectorRenderer.TileLabels l) {
                      bm = b;
                      labels = l;
                  }
              }

              final LruCache<String, Tile> cache = new LruCache<String, Tile>(72 * 1024 * 1024) {
                  @Override
                  protected int sizeOf(String k, Tile t) {
                      return t.bm.getByteCount() + 2048;
                  }
              };
              final Set<String> pending = java.util.Collections.newSetFromMap(new ConcurrentHashMap<String, Boolean>());
              final ExecutorService ex = Executors.newSingleThreadExecutor();
              final Paint p = new Paint(Paint.ANTI_ALIAS_FLAG);
              final Paint tp = new Paint(Paint.FILTER_BITMAP_FLAG);
              final Paint nightP = new Paint(Paint.FILTER_BITMAP_FLAG);
              final ScaleGestureDetector sg;
              final GestureDetector gd;

              public MapView(Context c) {
                  super(c);
                  density = c.getResources().getDisplayMetrics().density;
                  ColorMatrix cm = new ColorMatrix(new float[]{
                          -1, 0, 0, 0, 255,
                          0, -1, 0, 0, 255,
                          0, 0, -1, 0, 255,
                          0, 0, 0, 1, 0});
                  nightP.setColorFilter(new ColorMatrixColorFilter(cm));
                  sg = new ScaleGestureDetector(c, new ScaleGestureDetector.SimpleOnScaleGestureListener() {
                      @Override
                      public boolean onScale(ScaleGestureDetector d) {
                          setManualZoom(zoom + Math.log(d.getScaleFactor()) / Math.log(2));
                          return true;
                      }
                  });
                  gd = new GestureDetector(c, new GestureDetector.SimpleOnGestureListener() {
                      @Override
                      public boolean onScroll(MotionEvent e1, MotionEvent e2, float dx, float dy) {
                          if (sg.isInProgress()) return true;
                          follow = false;
                          double s = worldPx(), a = Math.toRadians(rot);
                          double wx = dx * Math.cos(a) - dy * Math.sin(a), wy = dx * Math.sin(a) + dy * Math.cos(a);
                          lon += wx / s * 360.0;
                          lat = yToLat(Math.max(0.001, Math.min(0.999, latToY(lat) + wy / s)));
                          invalidate();
                          return true;
                      }

                      @Override
                      public boolean onDoubleTap(MotionEvent e) {
                          setManualZoom(zoom + 1);
                          return true;
                      }

                      @Override
                      public void onLongPress(MotionEvent e) {
                          double[] w = unscr(e.getX(), e.getY());
                          markLat = w[0];
                          markLon = w[1];
                          if (listener != null) listener.onMarkChanged();
                          invalidate();
                      }
                  });
              }

              void setManualZoom(double z) {
                  zoom = Math.max(minZ, Math.min(maxZ + 3, z));
                  manualUntil = System.nanoTime() + 15_000_000_000L;
                  invalidate();
              }

              // ---- Web Mercator ----
              static double lonToX(double lon) {
                  return (lon + 180.0) / 360.0;
              }

              static double latToY(double lat) {
                  double r = Math.toRadians(lat);
                  return (1.0 - Math.log(Math.tan(r) + 1.0 / Math.cos(r)) / Math.PI) / 2.0;
              }

              static double yToLat(double y) {
                  return Math.toDegrees(Math.atan(Math.sinh(Math.PI * (1 - 2 * y))));
              }

              double worldPx() {
                  return 256.0 * density * Math.pow(2, zoom);
              }

              float pvx() {
                  return getWidth() / 2f;
              }

              float pvy() {
                  return pivY < 0 ? getHeight() / 2f : pivY;
              }

              /** Координати -> екран (з урахуванням повороту карти). */
              float[] scr(double la, double lo) {
                  double s = worldPx();
                  double dx = (lonToX(lo) - lonToX(lon)) * s, dy = (latToY(la) - latToY(lat)) * s;
                  double a = Math.toRadians(-rot);
                  return new float[]{(float) (pvx() + dx * Math.cos(a) - dy * Math.sin(a)), (float) (pvy() + dx * Math.sin(a) + dy * Math.cos(a))};
              }

              double[] unscr(float x, float y) {
                  double ddx = x - pvx(), ddy = y - pvy(), a = Math.toRadians(rot), s = worldPx();
                  double dx = ddx * Math.cos(a) - ddy * Math.sin(a), dy = ddx * Math.sin(a) + ddy * Math.cos(a);
                  double nx = lonToX(lon) + dx / s, ny = latToY(lat) + dy / s;
                  return new double[]{yToLat(Math.max(0.001, Math.min(0.999, ny))), nx * 360.0 - 180.0};
              }

              public boolean open(String path) {
                  try {
                      db = SQLiteDatabase.openDatabase(path, null, SQLiteDatabase.OPEN_READONLY);
                      Cursor c = db.rawQuery("select min(zoom_level), max(zoom_level) from tiles", null);
                      if (c.moveToFirst()) {
                          minZ = c.getInt(0);
                          maxZ = c.getInt(1);
                      }
                      c.close();
                      try {
                          Cursor mc = db.rawQuery("select value from metadata where name='format'", null);
                          if (mc.moveToFirst()) {
                              String f = mc.getString(0);
                              vector = f != null && (f.equalsIgnoreCase("pbf") || f.equalsIgnoreCase("mvt"));
                          }
                          mc.close();
                      } catch (Throwable ignored) {
                      }
                      zoom = Math.max(minZ, Math.min(maxZ, zoom));
                      return true;
                  } catch (Throwable t) {
                      error = String.valueOf(t);
                      return false;
                  }
              }

              public void close() {
                  ex.shutdownNow();
                  try {
                      if (db != null) db.close();
                  } catch (Throwable ignored) {
                  }
              }

              Tile tile(final int z, final int x, final int y) {
                  final String key = z + "/" + x + "/" + y;
                  Tile b = cache.get(key);
                  if (b != null) return b;
                  if (db != null && pending.add(key)) {
                      try {
                          ex.execute(() -> {
                              try {
                                  int row = (1 << z) - 1 - y;
                                  Cursor c = db.rawQuery("select tile_data from tiles where zoom_level=? and tile_column=? and tile_row=?",
                                          new String[]{String.valueOf(z), String.valueOf(x), String.valueOf(row)});
                                  Bitmap bm = null;
                                  VectorRenderer.TileLabels tl = null;
                                  if (c.moveToFirst()) {
                                      byte[] d = c.getBlob(0);
                                      if (vector) {
                                          tl = new VectorRenderer.TileLabels();
                                          bm = VectorRenderer.render(d, z, 384, tl);
                                      } else {
                                          bm = BitmapFactory.decodeByteArray(d, 0, d.length);
                                      }
                                  }
                                  c.close();
                                  if (bm != null) cache.put(key, new Tile(bm, tl));
                              } catch (Throwable ignored) {
                              }
                              pending.remove(key);
                              postInvalidate();
                          });
                      } catch (Throwable ignored) {
                          pending.remove(key);
                      }
                  }
                  return null;
              }

              /** Нове положення з GPS. speed у м/с, bearing у градусах (або -1). */
              public void setMyLocation(double la, double lo, float bearing, float speed) {
                  boolean first = !hasFix;
                  myLat = la;
                  myLon = lo;
                  fixLat = la;
                  fixLon = lo;
                  fixSpeed = speed;
                  if (bearing >= 0 && speed > 1.5f) fixBearing = bearing;
                  fixTime = System.currentTimeMillis();
                  hasFix = true;
                  if (first && follow) {
                      lat = la;
                      lon = lo;
                      rot = headingUp ? fixBearing : 0;
                  }
                  postInvalidate();
              }

              public void zoomBy(double d) {
                  setManualZoom(zoom + d);
              }

              public void goToMe() {
                  follow = true;
                  manualUntil = 0;
                  invalidate();
              }

              static double speedZoom(double kmh) {
                  double[][] t = {{0, 17.2}, {15, 17.0}, {30, 16.4}, {50, 15.9}, {70, 15.3}, {90, 14.7}, {120, 14.2}};
                  if (kmh <= t[0][0]) return t[0][1];
                  for (int i = 1; i < t.length; i++) {
                      if (kmh <= t[i][0]) return t[i - 1][1] + (t[i][1] - t[i - 1][1]) * (kmh - t[i - 1][0]) / (t[i][0] - t[i - 1][0]);
                  }
                  return t[t.length - 1][1];
              }

              static double angDiff(double to, double from) {
                  double d = ((to - from) % 360 + 540) % 360 - 180;
                  return d;
              }

              /** Плавне наближення до цілі: положення, поворот, масштаб. */
              void stepAnim() {
                  long now = System.nanoTime();
                  float dt = lastNs == 0 ? 0.016f : (now - lastNs) / 1e9f;
                  if (dt > 0.25f) dt = 0.016f;
                  lastNs = now;
                  float H = getHeight();
                  boolean fl = follow && hasFix;
                  float targetPiv = fl && headingUp ? H * 0.62f : H / 2f;
                  if (pivY < 0) pivY = targetPiv;
                  pivY += (targetPiv - pivY) * (1 - Math.exp(-dt / 0.5));
                  if (fl) {
                      double age = Math.min(2.0, (System.currentTimeMillis() - fixTime) / 1000.0);
                      double d = fixSpeed * age, br = Math.toRadians(fixBearing);
                      double tLat = fixLat + d * Math.cos(br) / 111320.0;
                      double tLon = fixLon + d * Math.sin(br) / (111320.0 * Math.cos(Math.toRadians(fixLat)));
                      double a = 1 - Math.exp(-dt / 0.35);
                      lat += (tLat - lat) * a;
                      lon += (tLon - lon) * a;
                      double tRot = headingUp ? fixBearing : 0;
                      rot += angDiff(tRot, rot) * (1 - Math.exp(-dt / 0.7));
                      rot = (rot % 360 + 360) % 360;
                      if (now > manualUntil) {
                          double tz = Math.max(minZ, Math.min(maxZ + 3, speedZoom(fixSpeed * 3.6)));
                          zoom += (tz - zoom) * (1 - Math.exp(-dt / 1.2));
                      }
                  }
              }

              public static double distKm(double a1, double o1, double a2, double o2) {
                  double R = 6371.0;
                  double dLa = Math.toRadians(a2 - a1), dLo = Math.toRadians(o2 - o1);
                  double h = Math.sin(dLa / 2) * Math.sin(dLa / 2)
                          + Math.cos(Math.toRadians(a1)) * Math.cos(Math.toRadians(a2)) * Math.sin(dLo / 2) * Math.sin(dLo / 2);
                  return 2 * R * Math.asin(Math.sqrt(h));
              }

              public static double bearing(double a1, double o1, double a2, double o2) {
                  double y = Math.sin(Math.toRadians(o2 - o1)) * Math.cos(Math.toRadians(a2));
                  double x = Math.cos(Math.toRadians(a1)) * Math.sin(Math.toRadians(a2))
                          - Math.sin(Math.toRadians(a1)) * Math.cos(Math.toRadians(a2)) * Math.cos(Math.toRadians(o2 - o1));
                  return (Math.toDegrees(Math.atan2(y, x)) + 360) % 360;
              }

              int poiColor(String cls) {
                  String c = cls.toLowerCase();
                  if (c.contains("fuel")) return 0xFF1E88E5;
                  if (c.contains("hospital") || c.contains("pharmacy") || c.contains("doctor") || c.contains("clinic")) return 0xFFD32F2F;
                  if (c.contains("restaurant") || c.contains("cafe") || c.contains("bar") || c.contains("food")) return 0xFFEF6C00;
                  if (c.contains("shop") || c.contains("supermarket") || c.contains("mall") || c.contains("convenience")) return 0xFF8E24AA;
                  if (c.contains("parking")) return 0xFF546E7A;
                  if (c.contains("bank") || c.contains("atm")) return 0xFF2E7D32;
                  return 0xFF607D8B;
              }

              void halo(Canvas cv, Paint tpn, String s, float x, float y) {
                  tpn.setStyle(Paint.Style.STROKE);
                  tpn.setStrokeWidth(3.5f * density);
                  tpn.setColor(night ? 0xFF111111 : 0xFFFFFFFF);
                  cv.drawText(s, x, y, tpn);
                  tpn.setStyle(Paint.Style.FILL);
                  tpn.setColor(night ? 0xFFEEEEEE : 0xFF333333);
                  cv.drawText(s, x, y, tpn);
              }

              static boolean hits(List<RectF> placed, RectF rc) {
                  for (RectF q : placed) if (RectF.intersects(q, rc)) return true;
                  return false;
              }

              float placeSize(String c) {
                  if (c.equals("country")) return zoom < 7 ? 20 : 0;
                  if (c.equals("state") || c.equals("region")) return zoom >= 4 && zoom < 9 ? 17 : 0;
                  if (c.equals("city")) return 20;
                  if (c.equals("town")) return zoom >= 8 ? 17 : 0;
                  if (c.equals("village")) return zoom >= 10 ? 15 : 0;
                  if (c.equals("suburb") || c.equals("hamlet")) return zoom >= 12.5 ? 13 : 0;
                  if (c.equals("neighbourhood")) return zoom >= 14 ? 12 : 0;
                  return 0;
              }

              /** Підписи малюються по екрану з постійним розміром; з урахуванням повороту карти. */
              void drawLabels(Canvas cv, List<Object[]> vis) {
                  if (vis.isEmpty()) return;
                  float W = getWidth(), H = getHeight(), pvx = pvx(), pvy = pvy();
                  double a = Math.toRadians(-rot), ca = Math.cos(a), sa = Math.sin(a);
                  List<RectF> placed = new ArrayList<RectF>();
                  Paint tpn = new Paint(Paint.ANTI_ALIAS_FLAG);
                  tpn.setStrokeJoin(Paint.Join.ROUND);
                  PathMeasure pm = new PathMeasure();
                  float[] sp = new float[2];
                  // 1) населені пункти
                  tpn.setTextAlign(Paint.Align.CENTER);
                  for (Object[] v : vis) {
                      VectorRenderer.TileLabels tl = (VectorRenderer.TileLabels) v[0];
                      float l = (Float) v[1], t = (Float) v[2], ts = (Float) v[3];
                      for (VectorRenderer.PointLabel pt : tl.pts) {
                          if (pt.kind != 3 || pt.name == null) continue;
                          float sz = placeSize(pt.cls == null ? "" : pt.cls);
                          if (sz == 0) continue;
                          double ux = l + pt.x * ts - pvx, uy = t + pt.y * ts - pvy;
                          float x = (float) (pvx + ux * ca - uy * sa), y = (float) (pvy + ux * sa + uy * ca);
                          if (x < -100 || x > W + 100 || y < -50 || y > H + 50) continue;
                          tpn.setTextSize(sz * density);
                          tpn.setTypeface(sz >= 20 ? Typeface.DEFAULT_BOLD : Typeface.DEFAULT);
                          float w = tpn.measureText(pt.name);
                          RectF rc = new RectF(x - w / 2 - 4 * density, y - sz * density, x + w / 2 + 4 * density, y + 6 * density);
                          if (hits(placed, rc)) continue;
                          placed.add(rc);
                          halo(cv, tpn, pt.name, x, y);
                      }
                  }
                  tpn.setTypeface(Typeface.DEFAULT);
                  // 2) вулиці
                  tpn.setTextSize(13 * density);
                  for (Object[] v : vis) {
                      VectorRenderer.TileLabels tl = (VectorRenderer.TileLabels) v[0];
                      float l = (Float) v[1], t = (Float) v[2], ts = (Float) v[3];
                      for (VectorRenderer.Road r : tl.roads) {
                          if (zoom < 15 && !(zoom >= 13.5 && r.rank >= 2) && !(zoom >= 11 && r.rank >= 4)) continue;
                          int n = r.xy.length / 2;
                          float[] pts = new float[r.xy.length];
                          float x0 = 1e9f, x1 = -1e9f, y0 = 1e9f, y1 = -1e9f;
                          for (int i = 0; i < n; i++) {
                              double ux = l + r.xy[i * 2] * ts - pvx, uy = t + r.xy[i * 2 + 1] * ts - pvy;
                              float x = (float) (pvx + ux * ca - uy * sa), y = (float) (pvy + ux * sa + uy * ca);
                              pts[i * 2] = x;
                              pts[i * 2 + 1] = y;
                              x0 = Math.min(x0, x);
                              x1 = Math.max(x1, x);
                              y0 = Math.min(y0, y);
                              y1 = Math.max(y1, y);
                          }
                          if (x1 < 0 || x0 > W || y1 < 0 || y0 > H) continue;
                          boolean rev = pts[(n - 1) * 2] < pts[0];
                          Path pa = new Path();
                          for (int k = 0; k < n; k++) {
                              int i = rev ? n - 1 - k : k;
                              if (k == 0) pa.moveTo(pts[i * 2], pts[i * 2 + 1]);
                              else pa.lineTo(pts[i * 2], pts[i * 2 + 1]);
                          }
                          pm.setPath(pa, false);
                          float len = pm.getLength(), tw = tpn.measureText(r.name);
                          if (len < tw + 12 * density) continue;
                          float off = (len - tw) / 2f;
                          float[] p1 = new float[2], p2 = new float[2];
                          pm.getPosTan(off, p1, null);
                          pm.getPosTan(off + tw, p2, null);
                          float chord = (float) Math.hypot(p2[0] - p1[0], p2[1] - p1[1]);
                          if (chord < 0.93f * tw) continue; // надто крива лінія — текст «ламається»
                          Path seg = new Path();
                          pm.getSegment(off, off + tw, seg, true);
                          RectF rc = new RectF();
                          seg.computeBounds(rc, true);
                          rc.inset(-7 * density, -9 * density);
                          if (hits(placed, rc)) continue;
                          placed.add(rc);
                          tpn.setTextAlign(Paint.Align.LEFT);
                          tpn.setStyle(Paint.Style.STROKE);
                          tpn.setStrokeWidth(3.5f * density);
                          tpn.setColor(night ? 0xFF111111 : 0xFFFFFFFF);
                          cv.drawTextOnPath(r.name, pa, off, 4 * density, tpn);
                          tpn.setStyle(Paint.Style.FILL);
                          tpn.setColor(night ? 0xFFEEEEEE : 0xFF444444);
                          cv.drawTextOnPath(r.name, pa, off, 4 * density, tpn);
                      }
                  }
                  // 3) заклади й номери будинків
                  for (Object[] v : vis) {
                      VectorRenderer.TileLabels tl = (VectorRenderer.TileLabels) v[0];
                      float l = (Float) v[1], t = (Float) v[2], ts = (Float) v[3];
                      for (VectorRenderer.PointLabel pt : tl.pts) {
                          if (pt.kind == 3) continue;
                          if (pt.kind == 2 && zoom < 15.5) continue;
                          if (pt.kind == 1 && (zoom < 16.5 || pt.name == null)) continue;
                          double ux = l + pt.x * ts - pvx, uy = t + pt.y * ts - pvy;
                          float x = (float) (pvx + ux * ca - uy * sa), y = (float) (pvy + ux * sa + uy * ca);
                          if (x < -50 || x > W + 50 || y < -50 || y > H + 50) continue;
                          if (pt.kind == 2) {
                              if (pt.name == null && zoom < 17) continue;
                              tpn.setTextSize(12 * density);
                              float w = pt.name == null ? 0 : tpn.measureText(pt.name);
                              RectF rc = new RectF(x - 7 * density, y - 9 * density, x + 12 * density + w, y + 9 * density);
                              if (hits(placed, rc)) continue;
                              placed.add(rc);
                              p.setStyle(Paint.Style.FILL);
                              p.setColor(poiColor(pt.cls == null ? "" : pt.cls));
                              cv.drawCircle(x, y, 5.5f * density, p);
                              p.setColor(0xFFFFFFFF);
                              cv.drawCircle(x, y, 2f * density, p);
                              if (pt.name != null) {
                                  tpn.setTextAlign(Paint.Align.LEFT);
                                  halo(cv, tpn, pt.name, x + 9 * density, y + 4 * density);
                              }
                          } else {
                              tpn.setTextSize(11 * density);
                              float w = tpn.measureText(pt.name);
                              RectF rc = new RectF(x - w / 2, y - 7 * density, x + w / 2, y + 7 * density);
