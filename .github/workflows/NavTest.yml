name: NavTest

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/NavTest.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Write project
        run: |
          mkdir -p app/src/main/java/com/example/navtest app/src/main/res/drawable

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'NavTest'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=false
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.example.navtest'
              compileSdk 34
              defaultConfig {
                  applicationId "com.example.navtest"
                  minSdk 23
                  targetSdk 26
                  versionCode 2
                  versionName "1.1"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
              lint {
                  abortOnError false
                  checkReleaseBuilds false
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="NavTest"
                  android:allowBackup="false"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden"
                      android:hardwareAccelerated="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/example/navtest/MainActivity.java <<'EOF'
          package com.example.navtest;

          import android.app.Activity;
          import android.app.ActivityOptions;
          import android.app.AlertDialog;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.content.pm.ResolveInfo;
          import android.graphics.SurfaceTexture;
          import android.hardware.display.DisplayManager;
          import android.hardware.display.VirtualDisplay;
          import android.os.Bundle;
          import android.view.Display;
          import android.view.Surface;
          import android.view.TextureView;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;

          import java.lang.reflect.Method;
          import java.util.ArrayList;
          import java.util.List;
          import java.util.Locale;

          /** Експеримент: чи можна показати чужу програму (навігацію) у вікні всередині нашої програми. */
          public class MainActivity extends Activity {
              static final int W = 960, H = 540;
              TextureView tv;
              TextView log;
              ScrollView sv;
              Surface surface;
              VirtualDisplay vd;
              DisplayManager dm;
              PackageManager pm;

              void say(String s) {
                  log.append(s + "\n");
                  sv.post(() -> sv.fullScroll(android.view.View.FOCUS_DOWN));
              }

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  dm = (DisplayManager) getSystemService(DISPLAY_SERVICE);
                  pm = getPackageManager();
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.HORIZONTAL);
                  root.setPadding(12, 12, 12, 12);
                  tv = new TextureView(this);
                  tv.setSurfaceTextureListener(new TextureView.SurfaceTextureListener() {
                      @Override
                      public void onSurfaceTextureAvailable(SurfaceTexture st, int w, int h) {
                          st.setDefaultBufferSize(W, H);
                          surface = new Surface(st);
                          say("Поверхня готова " + w + "x" + h);
                      }

                      @Override
                      public void onSurfaceTextureSizeChanged(SurfaceTexture st, int w, int h) {
                      }

                      @Override
                      public boolean onSurfaceTextureDestroyed(SurfaceTexture st) {
                          return true;
                      }

                      @Override
                      public void onSurfaceTextureUpdated(SurfaceTexture st) {
                      }
                  });
                  root.addView(tv, new LinearLayout.LayoutParams(W / 2 + 200, H / 2 + 120));
                  LinearLayout right = new LinearLayout(this);
                  right.setOrientation(LinearLayout.VERTICAL);
                  Button igo = new Button(this);
                  igo.setText("Запустити iGO у вікні");
                  igo.setOnClickListener(v -> startIn(findIgo()));
                  Button om = new Button(this);
                  om.setText("Запустити Organic Maps у вікні");
                  om.setOnClickListener(v -> startIn(findApp("organic", "organicmaps")));
                  Button other = new Button(this);
                  other.setText("Запустити іншу програму у вікні");
                  other.setOnClickListener(v -> pick());
                  Button stop = new Button(this);
                  stop.setText("Закрити вікно");
                  stop.setOnClickListener(v -> {
                      if (vd != null) {
                          vd.release();
                          vd = null;
                          say("Вікно закрито");
                      }
                  });
                  right.addView(igo);
                  right.addView(om);
                  right.addView(other);
                  right.addView(stop);
                  sv = new ScrollView(this);
                  log = new TextView(this);
                  log.setTextIsSelectable(true);
                  log.setTextSize(13);
                  sv.addView(log);
                  right.addView(sv, new LinearLayout.LayoutParams(-1, 0, 1));
                  root.addView(right, new LinearLayout.LayoutParams(0, -1, 1));
                  setContentView(root);
                  say("Android " + android.os.Build.VERSION.SDK_INT);
                  for (Display d : dm.getDisplays()) say("Екран " + d.getDisplayId() + " " + d.getName());
              }

              List<ResolveInfo> apps() {
                  Intent i = new Intent(Intent.ACTION_MAIN);
                  i.addCategory(Intent.CATEGORY_LAUNCHER);
                  return pm.queryIntentActivities(i, 0);
              }

              String findApp(String label, String pkg) {
                  for (ResolveInfo ri : apps()) {
                      String l = String.valueOf(ri.loadLabel(pm)).toLowerCase(Locale.US);
                      String p = ri.activityInfo.packageName.toLowerCase(Locale.US);
                      if (l.contains(label) || p.contains(pkg)) return ri.activityInfo.packageName;
                  }
                  return null;
              }

              String findIgo() {
                  for (ResolveInfo ri : apps()) {
                      String l = String.valueOf(ri.loadLabel(pm)).toLowerCase(Locale.US);
                      String p = ri.activityInfo.packageName.toLowerCase(Locale.US);
                      if (l.contains("igo") || p.contains("igo")) return ri.activityInfo.packageName;
                  }
                  return null;
              }

              void pick() {
                  final List<ResolveInfo> l = apps();
                  String[] n = new String[l.size()];
                  for (int i = 0; i < n.length; i++) n[i] = String.valueOf(l.get(i).loadLabel(pm));
                  new AlertDialog.Builder(this).setItems(n, (d, i) -> startIn(l.get(i).activityInfo.packageName)).show();
              }

              void startIn(String pkg) {
                  if (pkg == null) {
                      say("Програму не знайдено");
                      return;
                  }
                  if (surface == null) {
                      say("Поверхня ще не готова");
                      return;
                  }
                  try {
                      if (vd != null) vd.release();
                      int flags = DisplayManager.VIRTUAL_DISPLAY_FLAG_PUBLIC | DisplayManager.VIRTUAL_DISPLAY_FLAG_OWN_CONTENT_ONLY;
                      vd = dm.createVirtualDisplay("navtest", W, H, 160, surface, flags);
                      int id = vd.getDisplay().getDisplayId();
                      say("Віртуальний екран створено, id=" + id);
                      Intent in = pm.getLaunchIntentForPackage(pkg);
                      in.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_MULTIPLE_TASK);
                      ActivityOptions o = ActivityOptions.makeBasic();
                      Method m = ActivityOptions.class.getMethod("setLaunchDisplayId", int.class);
                      m.invoke(o, id);
                      startActivity(in, o.toBundle());
                      say("Запуск " + pkg + " на екрані " + id + " виконано без помилки");
                  } catch (Throwable t) {
                      say("ПОМИЛКА: " + (t.getCause() != null ? t.getCause() : t));
                  }
              }
          }
          EOF

      - name: Build
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: NavTest
          path: app/build/outputs/apk/debug/app-debug.apk
