          EOF

          cat > src/main/java/com/example/nightnet/AlarmReceiver.java <<'EOF'
          package com.example.nightnet;

          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;

          public class AlarmReceiver extends BroadcastReceiver {
              @Override
              public void onReceive(Context context, Intent intent) {
                  final PendingResult result = goAsync();
                  final Context app = context.getApplicationContext();
                  new Thread(() -> {
                      try {
                          Scheduler.sync(app);
                      } finally {
                          result.finish();
                      }
                  }).start();
              }
          }
          EOF

          cat > src/main/java/com/example/nightnet/QuickToggleService.java <<'EOF'
          package com.example.nightnet;

          import android.service.quicksettings.Tile;
          import android.service.quicksettings.TileService;

          public class QuickToggleService extends TileService {
              @Override
              public void onStartListening() {
                  super.onStartListening();
                  updateTileState();
              }

              @Override
              public void onClick() {
                  super.onClick();
                  new Thread(() -> {
                      boolean active = Prefs.get(this).getBoolean("active", false);
                      if (active) {
                          Radio.on(this);
                          Prefs.get(this).edit().putBoolean("active", false).apply();
                      } else {
                          Radio.off(this);
                          Prefs.get(this).edit().putBoolean("active", true).apply();
                      }
                      Scheduler.sync(getApplicationContext());
                      updateTileState();
                  }).start();
              }

              private void updateTileState() {
                  Tile tile = getQsTile();
                  if (tile == null) return;
                  boolean active = Prefs.get(this).getBoolean("active", false);
                  tile.setState(active ? Tile.STATE_ACTIVE : Tile.STATE_INACTIVE);
                  tile.setLabel("Нічна мережа");
                  tile.updateTile();
              }
          }
          EOF

          cat > src/main/java/com/example/nightnet/Core.java <<'EOF'
          package com.example.nightnet;

          import android.app.AlarmManager;
          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.PackageManager;
          import java.lang.reflect.Method;
          import java.util.Calendar;
          import java.util.Locale;
          import rikka.shizuku.Shizuku;

          final class Prefs {
              static SharedPreferences get(Context c) {
                  return c.getSharedPreferences("cfg", Context.MODE_PRIVATE);
              }
          }

          final class Radio {
              static final int OK = 0, NOT_READY = 1, FAILED = 2;

              private static boolean ready(int waitMs) {
                  long end = System.currentTimeMillis() + waitMs;
                  try {
                      while (!Shizuku.pingBinder()) {
                          if (System.currentTimeMillis() > end) return false;
                          Thread.sleep(200);
                      }
                      return Shizuku.checkSelfPermission() == PackageManager.PERMISSION_GRANTED;
                  } catch (Throwable t) {
                      return false;
                  }
              }

              private static boolean run(String... cmd) {
                  try {
                      Method m = Shizuku.class.getDeclaredMethod(
                              "newProcess", String[].class, String[].class, String.class);
                      m.setAccessible(true);
                      Process p = (Process) m.invoke(null, cmd, null, null);
                      return p.waitFor() == 0;
                  } catch (Throwable t) {
                      return false;
                  }
              }

              private static int apply(boolean wifi, boolean data, boolean enable) {
                  if (!wifi && !data) return OK;
                  if (!ready(6000)) return NOT_READY;
                  String act = enable ? "enable" : "disable";
                  boolean ok = true;
                  if (wifi) ok &= run("/system/bin/svc", "wifi", act);
                  if (data) ok &= run("/system/bin/svc", "data", act);
                  return ok ? OK : FAILED;
              }

              static int off(Context c) {
                  SharedPreferences p = Prefs.get(c);
                  boolean w = p.getBoolean("wifi", false);
                  boolean d = p.getBoolean("data", false);
                  p.edit().putBoolean("off_wifi", w).putBoolean("off_data", d).apply();
                  return apply(w, d, false);
              }

              static int on(Context c) {
                  SharedPreferences p = Prefs.get(c);
                  return apply(p.getBoolean("off_wifi", false), p.getBoolean("off_data", false), true);
              }

              static int force(Context c, boolean enable) {
                  SharedPreferences p = Prefs.get(c);
                  return apply(p.getBoolean("wifi", false), p.getBoolean("data", false), enable);
              }
          }

          final class Scheduler {
              private static final String CHANNEL = "status";
              private static final int NOTIFICATION_ID = 1;

              static String hhmm(int minutes) {
                  return String.format(Locale.US, "%02d:%02d", minutes / 60, minutes % 60);
              }

              static boolean isWeekend() {
                  int day = Calendar.getInstance().get(Calendar.DAY_OF_WEEK);
                  return day == Calendar.SATURDAY || day == Calendar.SUNDAY;
              }

              static boolean inWindow(int start, int end) {
                  Calendar now = Calendar.getInstance();
                  int m = now.get(Calendar.HOUR_OF_DAY) * 60 + now.get(Calendar.MINUTE);
                  if (start < end) return m >= start && m < end;
                  return m >= start || m < end;
              }

              private static long nextTrigger(int minuteOfDay) {
                  Calendar c = Calendar.getInstance();
                  c.set(Calendar.HOUR_OF_DAY, minuteOfDay / 60);
                  c.set(Calendar.MINUTE, minuteOfDay % 60);
                  c.set(Calendar.SECOND, 0);
                  c.set(Calendar.MILLISECOND, 0);
                  if (c.getTimeInMillis() <= System.currentTimeMillis()) c.add(Calendar.DAY_OF_YEAR, 1);
                  return c.getTimeInMillis();
              }

              private static PendingIntent pending(Context c, int code) {
                  Intent i = new Intent(c, AlarmReceiver.class).setAction("com.example.nightnet.SYNC");
                  return PendingIntent.getBroadcast(c, code, i,
                          PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT);
              }

              private static void setAlarm(Context c, int code, int minuteOfDay) {
                  AlarmManager am = c.getSystemService(AlarmManager.class);
                  am.setAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, nextTrigger(minuteOfDay), pending(c, code));
              }

              private static void cancelAlarms(Context c) {
                  AlarmManager am = c.getSystemService(AlarmManager.class);
                  am.cancel(pending(c, 1));
                  am.cancel(pending(c, 2));
              }

              private static void show(Context c, String title, String text) {
                  NotificationManager nm = c.getSystemService(NotificationManager.class);
                  nm.createNotificationChannel(new NotificationChannel(
                          CHANNEL, "Стан розкладу", NotificationManager.IMPORTANCE_LOW));
                  PendingIntent open = PendingIntent.getActivity(c, 0,
                          new Intent(c, MainActivity.class),
                          PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT);
                  Notification n = new Notification.Builder(c, CHANNEL)
                          .setSmallIcon(R.drawable.ic_stat)
                          .setContentTitle(title)
                          .setContentText(text)
                          .setContentIntent(open)
                          .setOngoing(false)
                          .setAutoCancel(true)
                          .setShowWhen(false)
                          .build();
                  nm.notify(NOTIFICATION_ID, n);
              }

              static synchronized void sync(Context c) {
                  SharedPreferences p = Prefs.get(c);
                  boolean wifi = p.getBoolean("wifi", false);
                  boolean data = p.getBoolean("data", false);
                  boolean weekend = isWeekend();

                  int start = p.getInt(weekend ? "start_w" : "start_d", 22 * 60);
                  int end = p.getInt(weekend ? "end_w" : "end_d", 6 * 60);

                  boolean on = p.getBoolean("enabled", false) && (wifi || data) && start != end;
                  boolean active = p.getBoolean("active", false);
                  NotificationManager nm = c.getSystemService(NotificationManager.class);

                  if (!on) {
                      cancelAlarms(c);
                      nm.cancel(NOTIFICATION_ID);
                      if (active && Radio.on(c) != Radio.NOT_READY) {
                          p.edit().putBoolean("active", false).apply();
                      }
                      return;
                  }

                  int notifyTriggerTime = start - 5;
                  if (notifyTriggerTime < 0) notifyTriggerTime += 24 * 60;

                  setAlarm(c, 1, notifyTriggerTime);
                  setAlarm(c, 2, end);

                  boolean inside = inWindow(start, end);
                  if (inside && !active && Radio.off(c) != Radio.NOT_READY) {
                      active = true;
                  } else if (!inside && active && Radio.on(c) != Radio.NOT_READY) {
                      active = false;
                  }
                  p.edit().putBoolean("active", active).apply();

                  Calendar now = Calendar.getInstance();
                  int currentMin = now.get(Calendar.HOUR_OF_DAY) * 60 + now.get(Calendar.MINUTE);
                  
                  boolean showNotification = false;
                  if (inside) {
                      showNotification = true;
                  } else {
                      int diff = start - currentMin;
                      if (diff < 0) diff += 24 * 60;
                      if (diff <= 5) {
                          showNotification = true;
                      }
                  }

                  if (!showNotification) {
                      nm.cancel(NOTIFICATION_ID);
                  } else {
                      StringBuilder what = new StringBuilder();
                      if (wifi) what.append("Wi-Fi");
                      if (data) {
                          if (what.length() > 0) what.append(", ");
                          what.append("мобільні дані");
                      }
                      String text;
                      if (inside && !active) {
                          text = "Не вдалося вимкнути: запустіть Shizuku";
                      } else if (!inside && active) {
                          text = "Не вдалося повернути зв’язок: запустіть Shizuku";
                      } else {
                          text = (active ? "Зараз вимкнено: " : "Вимикатиме о " + hhmm(start) + ": ") + what;
                      }
                      show(c, "Нічна мережа", text);
                  }
              }
          }
          EOF

