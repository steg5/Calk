name: Diagnostika

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Write project
        run: |
          mkdir -p app/src/main/java/com/example/diagnostics

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'Diagnostika'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=false
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.example.diagnostics'
              compileSdk 34
              defaultConfig {
                  applicationId "com.example.diagnostics"
                  minSdk 23
                  targetSdk 26
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
              lint {
                  abortOnError false
                  checkReleaseBuilds false
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.BLUETOOTH"/>
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN"/>
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE"/>
              <application
                  android:label="Діагностика"
                  android:allowBackup="false">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/example/diagnostics/MainActivity.java <<'EOF'
          package com.example.diagnostics;

          import android.app.Activity;
          import android.app.AlertDialog;
          import android.bluetooth.BluetoothAdapter;
          import android.bluetooth.BluetoothDevice;
          import android.content.ClipData;
          import android.content.ClipboardManager;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.graphics.Typeface;
          import android.net.Uri;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.view.Gravity;
          import android.view.View;
          import android.view.ViewGroup;
          import android.widget.ArrayAdapter;
          import android.widget.Button;
          import android.widget.CheckBox;
          import android.widget.EditText;
          import android.widget.FrameLayout;
          import android.widget.LinearLayout;
          import android.widget.RadioButton;
          import android.widget.RadioGroup;
          import android.widget.ScrollView;
          import android.widget.Spinner;
          import android.widget.TextView;
          import android.widget.Toast;

          import java.io.IOException;
          import java.util.ArrayList;
          import java.util.HashMap;
          import java.util.HashSet;
          import java.util.List;
          import java.util.Map;
          import java.util.Set;
          import java.util.concurrent.LinkedBlockingQueue;
          import java.util.concurrent.TimeUnit;

          public class MainActivity extends Activity {
              static final int BG = 0xFF101418, CARD = 0xFF1A2026, TXT = 0xFFECEFF1, DIM = 0xFF8899A6,
                      ACC = 0xFF4FC3F7, RED = 0xFFEF5350, GRN = 0xFF81C784;

              final Handler ui = new Handler(Looper.getMainLooper());
              final Rep rep = new Rep();
              final LinkedBlockingQueue<Runnable> queue = new LinkedBlockingQueue<Runnable>();
              SharedPreferences prefs;
              Elm elm;
              volatile boolean connected, wantConn, running = true;
              volatile Set<String> supported = new HashSet<String>();
              final Set<String> enabled = new HashSet<String>();
              final List<String> graphPids = new ArrayList<String>();
              long lastTry;
              boolean btMode;
              List<BluetoothDevice> devs = new ArrayList<BluetoothDevice>();

              TextView status;
              FrameLayout content;
              View[] tabs = new View[4];
              Button[] tabBtns = new Button[4];
              final Map<String, TextView> valViews = new HashMap<String, TextView>();
              final Map<String, CheckBox> checks = new HashMap<String, CheckBox>();
              final Map<String, TextView> nameViews = new HashMap<String, TextView>();
              GraphView graph;
              LinearLayout dtcList;
              TextView dtcInfo;
              Button connBtn;
              EditText hostEt, portEt, markEt;
              Spinner btSpin;
              RadioButton rbWifi, rbBt;
              int curTab = 0;

              int dp(int v) {
                  return (int) (v * getResources().getDisplayMetrics().density + 0.5f);
              }

              // ================= UI =================

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  prefs = getSharedPreferences("diag", MODE_PRIVATE);
                  rep.openCsv(getExternalFilesDir(null) != null ? getExternalFilesDir(null) : getFilesDir());
                  String en = prefs.getString("enabled", null);
                  if (en == null) {
                      for (Pids.Def d : Pids.ALL) if (d.on) enabled.add(d.pid);
                  } else {
                      for (String s : en.split(",")) if (!s.isEmpty()) enabled.add(s);
                  }
                  String gp = prefs.getString("graph", "010C,010D");
                  for (String s : gp.split(",")) if (!s.isEmpty() && graphPids.size() < 3) graphPids.add(s);
                  btMode = prefs.getBoolean("bt", false);

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setBackgroundColor(BG);
                  root.setPadding(dp(8), dp(6), dp(8), dp(6));

                  status = text("Не підключено", 15, DIM);
                  status.setPadding(dp(4), dp(2), dp(4), dp(4));
                  root.addView(status);

                  LinearLayout bar = new LinearLayout(this);
                  bar.setOrientation(LinearLayout.HORIZONTAL);
                  String[] names = {"Дані", "Графіки", "Помилки", "Сервіс"};
                  for (int i = 0; i < 4; i++) {
                      final int idx = i;
                      Button t = btn(names[i]);
                      t.setOnClickListener(v -> showTab(idx));
                      LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(0, dp(46), 1);
                      lp.setMargins(dp(2), 0, dp(2), 0);
                      bar.addView(t, lp);
                      tabBtns[i] = t;
                  }
                  root.addView(bar);

                  content = new FrameLayout(this);
                  root.addView(content, new LinearLayout.LayoutParams(-1, 0, 1));

                  tabs[0] = buildData();
                  tabs[1] = buildGraph();
                  tabs[2] = buildDtc();
                  tabs[3] = buildService();
                  for (View v : tabs) content.addView(v, new FrameLayout.LayoutParams(-1, -1));
                  setContentView(root);
                  showTab(0);

                  new Thread(this::worker, "elm-worker").start();
                  if (prefs.getBoolean("auto", false)) startConnect();
              }

              TextView text(String s, int sp, int color) {
                  TextView t = new TextView(this);
                  t.setText(s);
                  t.setTextSize(sp);
                  t.setTextColor(color);
                  return t;
              }

              Button btn(String s) {
                  Button b = new Button(this);
                  b.setText(s);
                  b.setAllCaps(false);
                  b.setTextColor(TXT);
                  b.setBackgroundColor(0xFF2A3640);
                  b.setTextSize(15);
                  return b;
              }

              void showTab(int i) {
                  curTab = i;
                  for (int k = 0; k < 4; k++) {
                      tabs[k].setVisibility(k == i ? View.VISIBLE : View.GONE);
                      tabBtns[k].setBackgroundColor(k == i ? 0xFF2E7D9A : 0xFF2A3640);
                  }
                  if (i == 1) refreshGraph();
              }

              View buildData() {
                  ScrollView sv = new ScrollView(this);
                  LinearLayout col = new LinearLayout(this);
                  col.setOrientation(LinearLayout.VERTICAL);
                  sv.addView(col);
                  TextView hint = text("Галочка — опитувати параметр. Кнопка «📈» — додати на графік (до 3).", 13, DIM);
                  hint.setPadding(dp(4), dp(6), dp(4), dp(6));
                  col.addView(hint);
                  for (final Pids.Def d : Pids.ALL) {
                      LinearLayout row = new LinearLayout(this);
                      row.setOrientation(LinearLayout.HORIZONTAL);
                      row.setGravity(Gravity.CENTER_VERTICAL);
                      row.setBackgroundColor(CARD);
                      row.setPadding(dp(6), dp(4), dp(6), dp(4));
                      CheckBox cb = new CheckBox(this);
                      cb.setChecked(enabled.contains(d.pid));
                      cb.setOnCheckedChangeListener((v, on) -> {
                          if (on) enabled.add(d.pid);
                          else enabled.remove(d.pid);
                          savePrefs();
                      });
                      checks.put(d.pid, cb);
                      row.addView(cb);
                      TextView name = text(d.name + "  (" + d.pid.substring(2) + ")", 16, TXT);
                      nameViews.put(d.pid, name);
                      row.addView(name, new LinearLayout.LayoutParams(0, -2, 1));
                      TextView val = text("—", 22, ACC);
                      val.setTypeface(Typeface.MONOSPACE, Typeface.BOLD);
                      val.setGravity(Gravity.END);
                      valViews.put(d.pid, val);
                      row.addView(val, new LinearLayout.LayoutParams(dp(110), -2));
                      TextView unit = text(d.unit, 13, DIM);
                      row.addView(unit, new LinearLayout.LayoutParams(dp(56), -2));
                      Button g = btn("📈");
                      g.setOnClickListener(v -> toggleGraph(d.pid));
                      row.addView(g, new LinearLayout.LayoutParams(dp(54), dp(40)));
                      LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(-1, -2);
                      lp.setMargins(0, 0, 0, dp(2));
                      col.addView(row, lp);
                  }
                  return sv;
              }

              void toggleGraph(String pid) {
                  if (graphPids.contains(pid)) graphPids.remove(pid);
                  else {
                      if (graphPids.size() >= 3) graphPids.remove(0);
                      graphPids.add(pid);
                  }
                  savePrefs();
                  Toast.makeText(this, "На графіку: " + graphPids.size() + " з 3", Toast.LENGTH_SHORT).show();
              }

              View buildGraph() {
                  LinearLayout col = new LinearLayout(this);
                  col.setOrientation(LinearLayout.VERTICAL);
                  LinearLayout row = new LinearLayout(this);
                  String[] lab = {"30 с", "2 хв", "10 хв"};
                  final long[] win = {30000, 120000, 600000};
                  for (int i = 0; i < 3; i++) {
                      final int k = i;
                      Button b = btn(lab[i]);
                      b.setOnClickListener(v -> {
                          graph.windowMs = win[k];
                          graph.invalidate();
                      });
                      LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(0, dp(42), 1);
                      lp.setMargins(dp(2), dp(4), dp(2), dp(4));
                      row.addView(b, lp);
                  }
                  col.addView(row);
                  graph = new GraphView(this);
                  graph.rep = rep;
                  col.addView(graph, new LinearLayout.LayoutParams(-1, 0, 1));
                  return col;
              }

              void refreshGraph() {
                  graph.pids.clear();
                  graph.pids.addAll(graphPids);
                  graph.invalidate();
              }

              View buildDtc() {
                  LinearLayout col = new LinearLayout(this);
                  col.setOrientation(LinearLayout.VERTICAL);
                  LinearLayout row = new LinearLayout(this);
                  Button rd = btn("Прочитати помилки");
                  Button cl = btn("Стерти помилки");
                  rd.setOnClickListener(v -> queueDtcRead());
                  cl.setOnClickListener(v -> confirmClear());
                  LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(0, dp(46), 1);
                  lp.setMargins(dp(2), dp(4), dp(2), dp(4));
                  row.addView(rd, lp);
                  row.addView(cl, lp);
                  col.addView(row);
                  dtcInfo = text("Натисни «Прочитати помилки». Двигун краще завести або ввімкнути запалювання.", 14, DIM);
                  dtcInfo.setPadding(dp(4), dp(4), dp(4), dp(4));
                  col.addView(dtcInfo);
                  ScrollView sv = new ScrollView(this);
                  dtcList = new LinearLayout(this);
                  dtcList.setOrientation(LinearLayout.VERTICAL);
                  sv.addView(dtcList);
                  col.addView(sv, new LinearLayout.LayoutParams(-1, 0, 1));
                  return col;
              }

              View buildService() {
                  ScrollView sv = new ScrollView(this);
                  LinearLayout col = new LinearLayout(this);
                  col.setOrientation(LinearLayout.VERTICAL);
                  col.setPadding(dp(4), dp(4), dp(4), dp(4));
                  sv.addView(col);

                  RadioGroup rg = new RadioGroup(this);
                  rg.setOrientation(LinearLayout.HORIZONTAL);
                  rbWifi = new RadioButton(this);
                  rbWifi.setText("Wi-Fi");
                  rbWifi.setTextColor(TXT);
                  rbBt = new RadioButton(this);
                  rbBt.setText("Bluetooth");
                  rbBt.setTextColor(TXT);
                  rg.addView(rbWifi);
                  rg.addView(rbBt);
                  col.addView(rg);
                  (btMode ? rbBt : rbWifi).setChecked(true);

                  LinearLayout hp = new LinearLayout(this);
                  hostEt = new EditText(this);
                  hostEt.setText(prefs.getString("host", "192.168.0.10"));
                  hostEt.setTextColor(TXT);
                  portEt = new EditText(this);
                  portEt.setText(prefs.getString("port", "35000"));
                  portEt.setTextColor(TXT);
                  hp.addView(hostEt, new LinearLayout.LayoutParams(0, -2, 2));
                  hp.addView(portEt, new LinearLayout.LayoutParams(0, -2, 1));
                  col.addView(hp);

                  btSpin = new Spinner(this);
                  loadBt();
                  col.addView(btSpin);

                  connBtn = btn("Підключитись");
                  connBtn.setOnClickListener(v -> {
                      if (wantConn) stopConnect();
                      else startConnect();
                  });
                  col.addView(connBtn, new LinearLayout.LayoutParams(-1, dp(50)));

                  col.addView(gap());
                  Button rescan = btn("Пересканувати підтримувані параметри");
                  rescan.setOnClickListener(v -> {
                      if (!connected) {
                          toast("Спочатку підключись");
                          return;
                      }
                      queue.add(() -> {
                          try {
                              doScan();
                          } catch (IOException e) {
                              lost(e);
                          }
                      });
                  });
                  col.addView(rescan, new LinearLayout.LayoutParams(-1, dp(46)));

                  col.addView(gap());
                  col.addView(text("Лог для аналізу", 16, ACC));
                  markEt = new EditText(this);
                  markEt.setHint("Позначка, напр. «газ у підлогу», «фари ввімкнув»");
                  markEt.setHintTextColor(DIM);
                  markEt.setTextColor(TXT);
                  col.addView(markEt);
                  Button mk = btn("Поставити позначку в лог");
                  mk.setOnClickListener(v -> {
                      String s = markEt.getText().toString().trim();
                      if (s.isEmpty()) s = "-";
                      rep.marker(s);
                      toast("Позначку додано");
                  });
                  col.addView(mk, new LinearLayout.LayoutParams(-1, dp(46)));
                  Button cp = btn("Копіювати звіт (вставити мені в чат)");
                  cp.setOnClickListener(v -> {
                      ClipboardManager cm = (ClipboardManager) getSystemService(Context.CLIPBOARD_SERVICE);
                      cm.setPrimaryClip(ClipData.newPlainText("diag", rep.report()));
                      toast("Звіт скопійовано");
                  });
                  col.addView(cp, new LinearLayout.LayoutParams(-1, dp(46)));
                  Button sh = btn("Поділитись звітом");
                  sh.setOnClickListener(v -> {
                      Intent i = new Intent(Intent.ACTION_SEND);
                      i.setType("text/plain");
                      i.putExtra(Intent.EXTRA_TEXT, rep.report());
                      startActivity(Intent.createChooser(i, "Звіт"));
                  });
                  col.addView(sh, new LinearLayout.LayoutParams(-1, dp(46)));
                  Button rs = btn("Скинути статистику й графіки");
                  rs.setOnClickListener(v -> {
                      rep.reset();
                      toast("Скинуто");
                  });
                  col.addView(rs, new LinearLayout.LayoutParams(-1, dp(46)));

                  col.addView(gap());
                  TextView about = text("Діагностика v1.0\nEGR-адаптація та сервісні скидання поки що не додані — потрібна перевірена процедура для Ford.", 13, DIM);
                  col.addView(about);
                  return sv;
              }

              View gap() {
                  View v = new View(this);
                  v.setLayoutParams(new LinearLayout.LayoutParams(-1, dp(12)));
                  return v;
              }

              void loadBt() {
                  devs.clear();
                  List<String> names = new ArrayList<String>();
                  try {
                      BluetoothAdapter ad = BluetoothAdapter.getDefaultAdapter();
                      if (ad != null && ad.isEnabled()) {
                          for (BluetoothDevice d : ad.getBondedDevices()) {
                              devs.add(d);
                              names.add(d.getName() + "  " + d.getAddress());
                          }
                      }
                  } catch (Throwable ignored) {
                  }
                  if (names.isEmpty()) names.add("(немає спарених Bluetooth-пристроїв)");
                  ArrayAdapter<String> ad = new ArrayAdapter<String>(this, android.R.layout.simple_spinner_item, names);
                  ad.setDropDownViewResource(android.R.layout.simple_spinner_dropdown_item);
                  btSpin.setAdapter(ad);
                  String last = prefs.getString("btaddr", "");
                  for (int i = 0; i < devs.size(); i++) {
                      if (devs.get(i).getAddress().equals(last)) btSpin.setSelection(i);
                  }
              }

              void toast(String s) {
                  Toast.makeText(this, s, Toast.LENGTH_SHORT).show();
              }

              void setStatus(final String s, final int color) {
                  ui.post(() -> {
                      status.setText(s);
                      status.setTextColor(color);
                  });
              }

              void savePrefs() {
                  prefs.edit().putString("enabled", join(enabled)).putString("graph", join(graphPids)).apply();
              }

              static String join(java.util.Collection<String> c) {
                  StringBuilder b = new StringBuilder();
                  for (String s : c) {
                      if (b.length() > 0) b.append(',');
                      b.append(s);
                  }
                  return b.toString();
              }

              // ================= Підключення =================

              void startConnect() {
                  btMode = rbBt.isChecked();
                  prefs.edit().putBoolean("bt", btMode).putString("host", hostEt.getText().toString().trim())
                          .putString("port", portEt.getText().toString().trim()).apply();
                  wantConn = true;
                  lastTry = 0;
                  connBtn.setText("Відключитись");
                  setStatus("Підключення…", DIM);
              }

              void stopConnect() {
                  wantConn = false;
                  prefs.edit().putBoolean("auto", false).apply();
                  queue.add(() -> {
                      closeElm();
                      setStatus("Відключено", DIM);
                  });
                  connBtn.setText("Підключитись");
              }

              void closeElm() {
                  connected = false;
                  if (elm != null) elm.close();
                  elm = null;
              }

              void lost(Exception e) {
                  rep.event("Втрата зв'язку: " + e);
                  closeElm();
                  lastTry = System.currentTimeMillis();
                  setStatus("Зв'язок втрачено, повтор…", RED);
              }

              void doConnect() {
                  lastTry = System.currentTimeMillis();
                  try {
                      setStatus("Підключення…", DIM);
                      Elm e = new Elm();
                      if (btMode) {
                          int i = btSpin.getSelectedItemPosition();
                          if (i < 0 || i >= devs.size())
                              throw new IOException("Не вибрано Bluetooth-адаптер (спочатку спаруй його в налаштуваннях)");
                          BluetoothDevice d = devs.get(i);
                          prefs.edit().putString("btaddr", d.getAddress()).apply();
                          e.connectBt(d);
                      } else {
                          e.connectWifi(this, prefs.getString("host", "192.168.0.10"),
                                  Integer.parseInt(prefs.getString("port", "35000").trim()));
                      }
                      elm = e;
                      e.init();
                      rep.initInfo = e.version + " | " + e.proto + " | " + e.volts;
                      rep.event("ELM: " + rep.initInfo);
                      connected = true;
                      prefs.edit().putBoolean("auto", true).apply();
                      doScan();
                  } catch (Exception ex) {
                      rep.event("Помилка підключення: " + ex);
                      closeElm();
                      setStatus("Немає зв'язку: " + ex.getMessage(), RED);
                  }
              }

              void doScan() throws IOException {
                  List<String> sup = elm.scanSupported();
                  final Set<String> set = new HashSet<String>(sup);
                  supported = set;
                  rep.supported = sup.isEmpty() ? "(порожньо — ЕБУ не відповів, заведи двигун)" : join(sup);
                  rep.event("Підтримується PID: " + sup.size());
                  // невідомі PID — одноразово, сирі відповіді для аналізу
                  int n = 0;
                  for (String p : sup) {
                      if (Pids.find(p) != null || p.endsWith("00") || p.endsWith("20") || p.endsWith("40")
                              || p.endsWith("60") || p.endsWith("80")) continue;
                      if (n++ > 40) break;
                      rep.unknown.put(p, elm.send(p, 1500));
                  }
                  ui.post(() -> {
                      for (Pids.Def d : Pids.ALL) {
                          boolean ok = set.isEmpty() || set.contains(d.pid);
                          nameViews.get(d.pid).setTextColor(ok ? TXT : 0xFF55606A);
                      }
                  });
                  setStatus((set.isEmpty() ? "ELM є, ЕБУ мовчить (заведи двигун)" : "Підключено, параметрів: " + set.size())
                          + "  " + elm.volts, set.isEmpty() ? 0xFFFFB74D : GRN);
              }

              // ================= Робочий потік =================

              int idx = 0, cycle = 0;
              boolean any;

              void worker() {
                  while (running) {
                      try {
                          Runnable r = queue.poll(connected ? 0 : 300, TimeUnit.MILLISECONDS);
                          if (r != null) {
                              r.run();
                              continue;
                          }
                          if (!connected) {
                              if (wantConn && System.currentTimeMillis() - lastTry > 3000) doConnect();
                              continue;
                          }
                          pollOne();
                      } catch (IOException e) {
                          lost(e);
                      } catch (Throwable t) {
                          rep.event("Збій: " + t);
                      }
                  }
              }

              void pollOne() throws IOException {
                  Pids.Def d = Pids.ALL[idx];
                  Set<String> sup = supported;
                  boolean ok = enabled.contains(d.pid) && (sup.isEmpty() || sup.contains(d.pid)) && cycle % d.period == 0;
                  if (ok) {
                      any = true;
                      query(d);
                  }
                  if (++idx >= Pids.ALL.length) {
                      idx = 0;
                      cycle++;
                      if (!any) {
                          try {
                              Thread.sleep(250);
                          } catch (InterruptedException ignored) {
                          }
                      }
                      any = false;
                      if (cycle % 10 == 0) rep.flush();
                  }
              }

              void query(final Pids.Def d) throws IOException {
                  String resp = elm.send(d.pid, 1500);
                  int[] b = Pids.parsePid(resp, d.pid);
                  if (b == null || b.length < Pids.minBytes(d.pid)) {
                      if (resp.toUpperCase().contains("NO DATA") || resp.toUpperCase().contains("UNABLE")) rep.nodata(d.pid, resp);
                      else rep.err(d.pid, resp);
                      setVal(d.pid, "—");
                      return;
                  }
                  boolean allFF = true;
                  for (int x : b) if (x != 0xFF) allFF = false;
                  if (allFF) {
                      rep.nodata(d.pid, resp + " (усі FF)");
                      setVal(d.pid, "н/д");
                      return;
                  }
                  double v = Pids.decode(d.pid, b);
                  rep.ok(d.pid, v, resp);
                  setVal(d.pid, Pids.fmt(d.pid, v));
              }

              void setVal(final String pid, final String s) {
                  ui.post(() -> {
                      TextView t = valViews.get(pid);
