              /** Charge counter in microampere-hours, or 0 if the phone does not report it. */
              static long cc(Context c) {
                  try {
                      BatteryManager bm = c.getSystemService(BatteryManager.class);
                      long v = bm.getLongProperty(BatteryManager.BATTERY_PROPERTY_CHARGE_COUNTER);
                      return v > 0 ? v : 0;
                  } catch (Throwable t) { return 0; }
              }

              static boolean charging(Context c) {
                  try {
                      Intent i = c.registerReceiver(null, new IntentFilter(Intent.ACTION_BATTERY_CHANGED));
                      return i != null && i.getIntExtra(BatteryManager.EXTRA_PLUGGED, 0) != 0;
                  } catch (Throwable t) { return false; }
              }

              static synchronized double designMah(Context c) {
                  if (design >= 0) return design;
                  try {
                      Class<?> k = Class.forName("com.android.internal.os.PowerProfile");
                      Object pp = k.getConstructor(Context.class).newInstance(c);
                      design = ((Number) k.getMethod("getBatteryCapacity").invoke(pp)).doubleValue();
                  } catch (Throwable t) { design = 0; }
                  return design;
              }

              static BatInfo info(Context c) {
                  BatInfo b = new BatInfo();
                  try {
                      Intent i = c.registerReceiver(null, new IntentFilter(Intent.ACTION_BATTERY_CHANGED));
                      if (i != null) {
                          int lv = i.getIntExtra(BatteryManager.EXTRA_LEVEL, 0);
                          int sc = i.getIntExtra(BatteryManager.EXTRA_SCALE, 100);
                          b.level = sc > 0 ? lv * 100 / sc : lv;
                          b.status = i.getIntExtra(BatteryManager.EXTRA_STATUS, 0);
                          b.plugged = i.getIntExtra(BatteryManager.EXTRA_PLUGGED, 0);
                          b.health = i.getIntExtra(BatteryManager.EXTRA_HEALTH, 0);
                          b.temp = i.getIntExtra(BatteryManager.EXTRA_TEMPERATURE, 0);
                          b.volt = i.getIntExtra(BatteryManager.EXTRA_VOLTAGE, 0);
                          String t = i.getStringExtra(BatteryManager.EXTRA_TECHNOLOGY);
                          b.tech = t == null ? "" : t;
                      }
                      b.charging = b.plugged != 0 && b.status == BatteryManager.BATTERY_STATUS_CHARGING;
                      BatteryManager bm = c.getSystemService(BatteryManager.class);
                      long raw = bm.getLongProperty(BatteryManager.BATTERY_PROPERTY_CURRENT_NOW);
                      if (raw != Long.MIN_VALUE) {
                          double ma = raw / 1000.0;
                          if (b.charging) ma = Math.abs(ma);
                          else if (b.plugged == 0) ma = -Math.abs(ma);
                          b.ma = ma;
                      }
                      b.ccUah = cc(c);
                      b.designMah = designMah(c);
                  } catch (Throwable ignored) { }
                  return b;
              }
