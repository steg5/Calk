                      root.addView(scroll, new LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT));

                      pager = new ViewPager(act);
                      pager.setAdapter(new PagerAdapter() {
                          @Override public int getCount() { return pgs.length; }
                          @Override public boolean isViewFromObject(View view, Object object) { return view == object; }
                          @Override public Object instantiateItem(ViewGroup container, int position) {
                              View v = pgs[position];
                              container.addView(v);
                              return v;
                          }
                          @Override public void destroyItem(ViewGroup container, int position, Object object) {
                              container.removeView((View) object);
                          }
                      });
                      pager.setOffscreenPageLimit(pgs.length - 1);
                      pager.addOnPageChangeListener(new ViewPager.OnPageChangeListener() {
                          @Override public void onPageScrolled(int position, float positionOffset, int positionOffsetPixels) { }
                          @Override public void onPageSelected(int position) {
                              select(position);
                              onSel.accept(position);
                          }
                          @Override public void onPageScrollStateChanged(int state) { }
                      });
                      root.addView(pager, new LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, 0, 1f));
                      select(0);
                  }

                  void select(int p) {
                      int acc = accent();
                      for (int i = 0; i < tt.length; i++) {
                          boolean on = i == p;
                          tt[i].setTextColor(on ? acc : 0xFF5F6368);
                          tt[i].setTypeface(null, on ? android.graphics.Typeface.BOLD : android.graphics.Typeface.NORMAL);
                          tl[i].setBackgroundColor(on ? acc : 0x00000000);
                      }
                      final View child = row.getChildAt(p);
                      if (child != null) scroll.post(() -> scroll.smoothScrollTo(Math.max(0, child.getLeft() - dp(48)), 0));
                  }
              }

              View build(View networkPage) {
                  pages[0] = buildCurrent();
                  pages[1] = buildLog();
                  pages[2] = buildRange();
                  pages[3] = buildOverview();
                  pages[4] = buildSettings();
                  sub = new Tabs(TITLES_SUB, pages, 14, 0xFFEEF1F4, p -> refreshSub());
                  top = new Tabs(TITLES_TOP, new View[]{networkPage, sub.root}, 17, 0xFFFFFFFF, p -> {
                      if (p == 1) refreshSub();
                      else stopCurrent();
                  });
                  top.pager.setOffscreenPageLimit(1);

                  if (prefs.getBoolean("mon_enabled", true) && !prefs.getBoolean("asked_notif", false)) {
                      prefs.edit().putBoolean("asked_notif", true).apply();
                      askNotif();
                  }
                  return top.root;
              }

              /** Called from the activity's onResume. */
              void refresh() {
                  if (top == null) return;
                  ColorStateList cs = ColorStateList.valueOf(accent());
                  for (Button b : buttons) b.setBackgroundTintList(cs);
                  int[][] st = {{android.R.attr.state_checked}, {}};
                  ColorStateList thumb = new ColorStateList(st, new int[]{accent(), 0xFF9AA0A6});
                  ColorStateList track = new ColorStateList(st, new int[]{(accent() & 0x00FFFFFF) | 0x80000000, 0x55888888});
                  swMon.setThumbTintList(thumb);
                  swMon.setTrackTintList(track);
                  swShowCur.setThumbTintList(thumb);
                  swShowCur.setTrackTintList(track);
                  curValue.setTextColor(accent());
                  chart.accent = accent();
                  top.select(top.pager.getCurrentItem());
                  sub.select(sub.pager.getCurrentItem());
                  if (top.pager.getCurrentItem() == 1) refreshSub();
              }

              /** Called from the activity's onPause. */
              void pause() { stopCurrent(); }

              private void refreshSub() {
                  int p = sub.pager.getCurrentItem();
                  if (p != 0) stopCurrent();
                  if (p == 0) startCurrent();
                  else if (p == 1) loadLog();
                  else if (p == 2) loadRange();
                  else if (p == 3) loadOverview();
                  else loadSettings();
              }

              private void askNotif() {
                  if (Build.VERSION.SDK_INT >= 33 && act.checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                      act.requestPermissions(new String[]{Manifest.permission.POST_NOTIFICATIONS}, 2);
                  }
              }

