name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-34 build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Create app files
        run: |
          mkdir -p src/main/java/com/example/nightnet src/main/res/drawable

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "NightNet"
          EOF

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3"
          }

          android {
              namespace = "com.example.nightnet"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.example.nightnet"
                  minSdk = 29
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }

          tasks.withType<JavaCompile>().configureEach {
              options.encoding = "UTF-8"
          }

          dependencies {
              implementation("dev.rikka.shizuku:api:13.1.5")
              implementation("dev.rikka.shizuku:provider:13.1.5")
          }
          EOF

          cat > src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <application
                  android:allowBackup="false"
                  android:icon="@drawable/ic_launcher"
                  android:label="Нічна мережа"
                  android:theme="@android:style/Theme.DeviceDefault.DayNight">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <receiver
                      android:name=".AlarmReceiver"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                          <action android:name="android.intent.action.MY_PACKAGE_REPLACED" />
                      </intent-filter>
                  </receiver>

                  <provider
                      android:name="rikka.shizuku.ShizukuProvider"
                      android:authorities="${applicationId}.shizuku"
                      android:enabled="true"
                      android:exported="true"
                      android:multiprocess="false"
                      android:permission="android.permission.INTERACT_ACROSS_USERS_FULL" />
              </application>
          </manifest>
          EOF

          cat > src/main/res/drawable/ic_stat.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp"
              android:height="24dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M12,3c-4.97,0 -9,4.03 -9,9s4.03,9 9,9 9,-4.03 9,-9c0,-0.46 -0.04,-0.92 -0.1,-1.36 -0.98,1.37 -2.58,2.26 -4.4,2.26 -2.98,0 -5.4,-2.42 -5.4,-5.4 0,-1.81 0.89,-3.42 2.26,-4.4C12.92,3.04 12.46,3 12,3z" />
          </vector>
          EOF

          cat > src/main/res/drawable/ic_launcher.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#0D7A6D" android:pathData="M0,0h108v108h-108z" />
              <group
                  android:scaleX="3"
                  android:scaleY="3"
                  android:translateX="18"
                  android:translateY="18">
                  <path
                      android:fillColor="#FFFFFF"
                      android:pathData="M12,3c-4.97,0 -9,4.03 -9,9s4.03,9 9,9 9,-4.03 9,-9c0,-0.46 -0.04,-0.92 -0.1,-1.36 -0.98,1.37 -2.58,2.26 -4.4,2.26 -2.98,0 -5.4,-2.42 -5.4,-5.4 0,-1.81 0.89,-3.42 2.26,-4.4C12.92,3.04 12.46,3 12,3z" />
              </group>
          </vector>
          EOF

          cat > src/main/java/com/example/nightnet/AlarmReceiver.java <<'EOF'
          package com.example.nightnet;

          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;

          public class AlarmReceiver extends BroadcastReceiver {
              @Override
              public void onReceive(Context context, Intent intent) {
                  final PendingResult result = goAsync();
                  final Context app = context.getApplicationContext();
                  final String action = intent == null ? null : intent.getAction();
                  new Thread(() -> {
                      try {
                          boolean preNotice = false;
                          if (action != null) {
                              int dot = action.lastIndexOf('.');
                              if (dot >= 0) {
                                  try { preNotice = Integer.parseInt(action.substring(dot + 1)) % 3 == 1; }
                                  catch (NumberFormatException ignored) { }
                              }
                          }
                          Scheduler.sync(app, preNotice);
                      } finally {
                          result.finish();
                      }
                  }).start();
              }
          }
          EOF

          cat > src/main/java/com/example/nightnet/Core.java <<'EOF'
          package com.example.nightnet;

          import android.app.AlarmManager;
          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.PackageManager;
          import java.lang.reflect.Method;
          import java.util.Calendar;
          import java.util.Locale;
          import rikka.shizuku.Shizuku;

          final class Prefs {
              static SharedPreferences get(Context c) { return c.getSharedPreferences("cfg", Context.MODE_PRIVATE); }
          }

          final class Radio {
              static final int OK = 0, NOT_READY = 1, FAILED = 2;
              private static boolean ready(int waitMs) {
                  long end = System.currentTimeMillis() + waitMs;
                  try {
                      while (!Shizuku.pingBinder()) {
                          if (System.currentTimeMillis() > end) return false;
                          Thread.sleep(200);
                      }
                      return Shizuku.checkSelfPermission() == PackageManager.PERMISSION_GRANTED;
                  } catch (Throwable t) { return false; }
              }
              private static boolean run(String... cmd) {
                  try {
                      Method m = Shizuku.class.getDeclaredMethod("newProcess", String[].class, String[].class, String.class);
                      m.setAccessible(true);
                      Process p = (Process) m.invoke(null, cmd, null, null);
                      return p.waitFor() == 0;
                  } catch (Throwable t) { return false; }
              }
              private static int apply(boolean wifi, boolean data, boolean enable) {
                  if (!wifi && !data) return OK;
                  if (!ready(6000)) return NOT_READY;
                  String act = enable ? "enable" : "disable";
                  boolean ok = true;
                  if (wifi) ok &= run("/system/bin/svc", "wifi", act);
                  if (data) ok &= run("/system/bin/svc", "data", act);
                  return ok ? OK : FAILED;
              }
              static int off(Context c) {
                  SharedPreferences p = Prefs.get(c);
                  boolean w = p.getBoolean("wifi", false), d = p.getBoolean("data", false);
                  p.edit().putBoolean("off_wifi", w).putBoolean("off_data", d).apply();
                  return apply(w, d, false);
              }
              static int on(Context c) {
                  SharedPreferences p = Prefs.get(c);
                  return apply(p.getBoolean("off_wifi", false), p.getBoolean("off_data", false), true);
              }
              static int force(Context c, boolean enable) {
                  SharedPreferences p = Prefs.get(c);
                  return apply(p.getBoolean("wifi", false), p.getBoolean("data", false), enable);
              }
          }

          final class Scheduler {
              private static final String CHANNEL = "schedule_notice";
              private static final int NOTIFICATION_ID = 1;
              static String hhmm(int minutes) { return String.format(Locale.US, "%02d:%02d", minutes / 60, minutes % 60); }

              private static int startFor(SharedPreferences p, int day) {
                  boolean weekend = day == Calendar.SATURDAY || day == Calendar.SUNDAY;
                  return p.getInt(weekend ? "weekend_start" : "weekday_start", 22 * 60);
              }
              private static int endFor(SharedPreferences p, int day) {
                  boolean weekend = day == Calendar.SATURDAY || day == Calendar.SUNDAY;
                  return p.getInt(weekend ? "weekend_end" : "weekday_end", 6 * 60);
              }
              private static PendingIntent pending(Context c, int code) {
                  Intent i = new Intent(c, AlarmReceiver.class).setAction("com.example.nightnet.SYNC." + code);
                  return PendingIntent.getBroadcast(c, code, i, PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT);
              }
              private static void cancelAlarms(Context c) {
                  AlarmManager am = c.getSystemService(AlarmManager.class);
                  for (int i = 100; i < 140; i++) am.cancel(pending(c, i));
              }
              private static void schedule(Context c, int code, long when) {
                  if (when <= System.currentTimeMillis()) return;
                  AlarmManager am = c.getSystemService(AlarmManager.class);
                  am.setAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, when, pending(c, code));
              }
              private static Calendar at(Calendar base, int minute) {
                  Calendar c = (Calendar) base.clone();
                  c.set(Calendar.HOUR_OF_DAY, minute / 60);
                  c.set(Calendar.MINUTE, minute % 60);
                  c.set(Calendar.SECOND, 0);
                  c.set(Calendar.MILLISECOND, 0);
                  return c;
              }
              private static boolean inWindow(Calendar now, Calendar start, Calendar end) {
                  return !now.before(start) && now.before(end);
              }
              private static void showPreNotice(Context c, SharedPreferences p) {
                  if (!p.getBoolean("notifications", true)) return;
                  NotificationManager nm = c.getSystemService(NotificationManager.class);
                  nm.createNotificationChannel(new NotificationChannel(CHANNEL, "Нагадування розкладу", NotificationManager.IMPORTANCE_DEFAULT));
                  StringBuilder what = new StringBuilder();
                  if (p.getBoolean("wifi", false)) what.append("Wi-Fi");
                  if (p.getBoolean("data", false)) {
                      if (what.length() > 0) what.append(" та ");
                      what.append("мобільні дані");
                  }
                  Notification n = new Notification.Builder(c, CHANNEL)
                          .setSmallIcon(R.drawable.ic_stat)
                          .setContentTitle("За 5 хвилин почнеться розклад")
                          .setContentText("Буде вимкнено: " + what)
                          .setAutoCancel(true)
                          .setTimeoutAfter(5 * 60 * 1000L)
                          .build();
                  nm.notify(NOTIFICATION_ID, n);
              }
              static synchronized void sync(Context c) { sync(c, false); }

              static synchronized void sync(Context c, boolean preNotice) {
                  SharedPreferences p = Prefs.get(c);
                  boolean wifi = p.getBoolean("wifi", false), data = p.getBoolean("data", false);
                  boolean enabled = p.getBoolean("enabled", false) && (wifi || data);
                  NotificationManager nm = c.getSystemService(NotificationManager.class);
                  cancelAlarms(c);
                  if (!enabled) {
                      nm.cancel(NOTIFICATION_ID);
                      if (p.getBoolean("active", false)) {
                          int result = Radio.on(c);
                          if (result == Radio.OK) p.edit().putBoolean("active", false).apply();
                      }
                      return;
                  }

                  Calendar now = Calendar.getInstance();
                  Calendar activeStart = null, activeEnd = null;
                  // Check windows starting yesterday or today. The schedule belongs to its start day.
                  for (int back = 1; back >= 0; back--) {
                      Calendar day = (Calendar) now.clone();
                      day.add(Calendar.DAY_OF_YEAR, -back);
                      int startMin = startFor(p, day.get(Calendar.DAY_OF_WEEK));
                      int endMin = endFor(p, day.get(Calendar.DAY_OF_WEEK));
                      if (startMin == endMin) continue;
                      Calendar st = at(day, startMin);
                      Calendar en = at(day, endMin);
                      if (endMin <= startMin) en.add(Calendar.DAY_OF_YEAR, 1);
                      if (inWindow(now, st, en)) { activeStart = st; activeEnd = en; break; }
                  }
                  boolean active = p.getBoolean("active", false);
                  if (activeStart != null && !active) {
                      int result = Radio.off(c);
                      if (result == Radio.OK) active = true;
                  } else if (activeStart == null && active) {
                      int result = Radio.on(c);
                      if (result == Radio.OK) active = false;
                  }
                  p.edit().putBoolean("active", active).apply();
                  if (preNotice && activeStart == null && p.getBoolean("notifications", true)) showPreNotice(c, p);
                  if (activeStart != null || !preNotice || !p.getBoolean("notifications", true)) nm.cancel(NOTIFICATION_ID);

                  // Schedule pre-start, start and end alarms for the next 8 calendar days.
                  for (int offset = 0; offset < 8; offset++) {
                      Calendar day = (Calendar) now.clone();
                      day.add(Calendar.DAY_OF_YEAR, offset);
                      int startMin = startFor(p, day.get(Calendar.DAY_OF_WEEK));
                      int endMin = endFor(p, day.get(Calendar.DAY_OF_WEEK));
                      if (startMin == endMin) continue;
                      Calendar st = at(day, startMin);
                      Calendar en = at(day, endMin);
                      if (endMin <= startMin) en.add(Calendar.DAY_OF_YEAR, 1);
                      int base = 100 + offset * 3;
                      Calendar pre = (Calendar) st.clone();
                      pre.add(Calendar.MINUTE, -5);
                      if (pre.after(now)) schedule(c, base, pre.getTimeInMillis());
                      if (st.after(now)) schedule(c, base + 1, st.getTimeInMillis());
                      if (en.after(now)) schedule(c, base + 2, en.getTimeInMillis());
                  }
                  // If the active window is already in progress, no persistent notification is shown.
              }
          }
          EOF

          cat > src/main/java/com/example/nightnet/MainActivity.java <<'EOF'
          package com.example.nightnet;

          import android.Manifest;
          import android.app.Activity;
          import android.app.TimePickerDialog;
          import android.content.Context;
          import android.content.SharedPreferences;
          import android.content.pm.PackageManager;
          import android.content.res.ColorStateList;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.View;
          import android.widget.Button;
          import android.widget.CheckBox;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.Switch;
          import android.widget.TextView;
          import android.widget.Toast;
          import rikka.shizuku.Shizuku;

          public class MainActivity extends Activity {
              private SharedPreferences prefs;
              private CheckBox cbWifi, cbData, cbNotifications;
              private Button btnWeekdayFrom, btnWeekdayTo, btnWeekendFrom, btnWeekendTo, btnTheme, btnPermission;
              private Switch swEnabled;
              private TextView tvStatus;
              private boolean loading;
              private final String[] themeNames = {"Бірюзова", "Синя", "Фіолетова", "Смарагдова", "Бурштинова"};
              private final int[] themeColors = {0xFF168C83, 0xFF3978C6, 0xFF8064B5, 0xFF27866A, 0xFFB77924};
              private int color() { return themeColors[Math.floorMod(prefs.getInt("theme", 0), themeColors.length)]; }
              private int dp(int v) { return (int) (v * getResources().getDisplayMetrics().density); }
              private TextView label(String text) {
                  TextView t = new TextView(this); t.setText(text); t.setTextSize(18); t.setTextColor(0xFF202124);
                  t.setPadding(0, dp(18), 0, dp(6)); return t;
              }
              private void toast(String s) { Toast.makeText(this, s, Toast.LENGTH_LONG).show(); }
              private Button makeButton(String text) {
                  Button b = new Button(this); b.setText(text); b.setAllCaps(false);
                  b.setBackgroundTintList(ColorStateList.valueOf(color())); b.setTextColor(0xFFFFFFFF); return b;
              }
              private LinearLayout timeRow(Button a, Button b) {
                  LinearLayout row = new LinearLayout(this); row.setOrientation(LinearLayout.HORIZONTAL);
                  LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f);
                  lp.setMargins(dp(3), 0, dp(3), 0); row.addView(a, lp); row.addView(b, lp); return row;
              }
              @Override protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  prefs = Prefs.get(this);
                  // Migrate the original single schedule to both new schedules without losing user settings.
                  SharedPreferences.Editor migration = prefs.edit();
                  if (!prefs.contains("weekday_start")) migration.putInt("weekday_start", prefs.getInt("start", 22 * 60));
                  if (!prefs.contains("weekday_end")) migration.putInt("weekday_end", prefs.getInt("end", 6 * 60));
                  if (!prefs.contains("weekend_start")) migration.putInt("weekend_start", prefs.getInt("start", 22 * 60));
                  if (!prefs.contains("weekend_end")) migration.putInt("weekend_end", prefs.getInt("end", 6 * 60));
                  migration.apply();

                  LinearLayout root = new LinearLayout(this); root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(dp(20), dp(8), dp(20), dp(24));
                  root.setBackgroundColor(0xFFF7F8FA);
                  root.addView(label("Що вимикати"));
                  cbWifi = new CheckBox(this); cbWifi.setText("Wi-Fi"); root.addView(cbWifi);
                  cbData = new CheckBox(this); cbData.setText("Мобільні дані"); root.addView(cbData);

                  root.addView(label("Графік на будні (понеділок – п’ятниця)"));
                  btnWeekdayFrom = makeButton("Початок"); btnWeekdayTo = makeButton("Завершення");
                  root.addView(timeRow(btnWeekdayFrom, btnWeekdayTo));
                  root.addView(label("Графік на вихідні (субота – неділя)"));
                  btnWeekendFrom = makeButton("Початок"); btnWeekendTo = makeButton("Завершення");
                  root.addView(timeRow(btnWeekendFrom, btnWeekendTo));

                  swEnabled = new Switch(this); swEnabled.setText("Розклад увімкнено"); swEnabled.setTextSize(18);
                  swEnabled.setPadding(0, dp(20), 0, dp(8)); root.addView(swEnabled);
                  cbNotifications = new CheckBox(this); cbNotifications.setText("Нагадувати за 5 хвилин до початку");
                  root.addView(cbNotifications);
                  btnTheme = makeButton("Колірна схема"); root.addView(btnTheme);
                  tvStatus = new TextView(this); tvStatus.setPadding(0, dp(12), 0, dp(4)); tvStatus.setTextColor(0xFF30343A); root.addView(tvStatus);
                  btnPermission = makeButton("Дати дозвіл Shizuku"); root.addView(btnPermission);
                  root.addView(label("Перевірка"));
                  Button testOff = makeButton("Вимкнути зараз");
                  Button testOn = makeButton("Увімкнути назад");
                  root.addView(testOff); root.addView(testOn);
                  ScrollView sv = new ScrollView(this); sv.addView(root); setContentView(sv);

                  cbWifi.setOnCheckedChangeListener((v, on) -> { if (!loading) changed(); });
                  cbData.setOnCheckedChangeListener((v, on) -> { if (!loading) changed(); });
                  swEnabled.setOnCheckedChangeListener((v, on) -> { if (!loading) changed(); });
                  cbNotifications.setOnCheckedChangeListener((v, on) -> { if (!loading) { prefs.edit().putBoolean("notifications", on).apply(); if (on) requestNotificationPermissionIfNeeded(); runSync(); } });
                  btnWeekdayFrom.setOnClickListener(v -> pick("weekday_start"));
                  btnWeekdayTo.setOnClickListener(v -> pick("weekday_end"));
                  btnWeekendFrom.setOnClickListener(v -> pick("weekend_start"));
                  btnWeekendTo.setOnClickListener(v -> pick("weekend_end"));
                  btnTheme.setOnClickListener(v -> { prefs.edit().putInt("theme", (prefs.getInt("theme", 0) + 1) % themeNames.length).apply(); render(); });
                  btnPermission.setOnClickListener(v -> { try { Shizuku.requestPermission(100); } catch (Throwable t) { toast("Спершу запустіть Shizuku"); } });
                  testOff.setOnClickListener(v -> test(false)); testOn.setOnClickListener(v -> test(true));
                  render();
              }
              @Override protected void onResume() { super.onResume(); render(); runSync(); }
              private void requestNotificationPermissionIfNeeded() {
                  if (Build.VERSION.SDK_INT >= 33 && checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED)
                      requestPermissions(new String[]{Manifest.permission.POST_NOTIFICATIONS}, 1);
              }
              private void changed() {
                  boolean w = cbWifi.isChecked(), d = cbData.isChecked(), en = swEnabled.isChecked();
                  if (en && !w && !d) {
                      en = false; loading = true; swEnabled.setChecked(false); loading = false;
                      toast("Оберіть, що вимикати: Wi-Fi або мобільні дані");
                  }
                  prefs.edit().putBoolean("wifi", w).putBoolean("data", d).putBoolean("enabled", en).apply();
                  if (en && cbNotifications.isChecked()) requestNotificationPermissionIfNeeded();
                  runSync(); render();
              }
              private void pick(String key) {
                  int cur = prefs.getInt(key, key.endsWith("start") ? 22 * 60 : 6 * 60);
                  new TimePickerDialog(this, (view, h, m) -> {
                      int value = h * 60 + m;
                      String otherKey = key.endsWith("start") ? key.replace("start", "end") : key.replace("end", "start");
                      if (value == prefs.getInt(otherKey, key.endsWith("start") ? 6 * 60 : 22 * 60)) { toast("Початок і кінець не можуть збігатися"); return; }
                      prefs.edit().putInt(key, value).apply(); runSync(); render();
                  }, cur / 60, cur % 60, true).show();
              }
              private void runSync() {
                  final Context app = getApplicationContext();
                  new Thread(() -> { Scheduler.sync(app); runOnUiThread(this::render); }).start();
              }
              private void test(boolean enable) {
                  if (!cbWifi.isChecked() && !cbData.isChecked()) { toast("Спершу оберіть Wi-Fi або мобільні дані"); return; }
                  final Context app = getApplicationContext();
                  new Thread(() -> {
                      int r = Radio.force(app, enable);
                      String msg = r == Radio.OK ? "Команду виконано. Перевірте, чи змінився стан." : r == Radio.NOT_READY ? "Shizuku не запущено або немає дозволу." : "Команда не спрацювала.";
                      runOnUiThread(() -> toast(msg));
                  }).start();
              }
              private void render() {
                  if (prefs == null || cbWifi == null) return;
                  loading = true;
                  cbWifi.setChecked(prefs.getBoolean("wifi", false)); cbData.setChecked(prefs.getBoolean("data", false));
                  swEnabled.setChecked(prefs.getBoolean("enabled", false)); cbNotifications.setChecked(prefs.getBoolean("notifications", true));
                  loading = false;
                  btnWeekdayFrom.setText("З " + Scheduler.hhmm(prefs.getInt("weekday_start", 22 * 60)));
                  btnWeekdayTo.setText("До " + Scheduler.hhmm(prefs.getInt("weekday_end", 6 * 60)));
                  btnWeekendFrom.setText("З " + Scheduler.hhmm(prefs.getInt("weekend_start", 22 * 60)));
                  btnWeekendTo.setText("До " + Scheduler.hhmm(prefs.getInt("weekend_end", 6 * 60)));
                  btnTheme.setText("Колірна схема: " + themeNames[prefs.getInt("theme", 0) % themeNames.length]);
                  int c = color();
                  btnWeekdayFrom.setBackgroundTintList(ColorStateList.valueOf(c)); btnWeekdayTo.setBackgroundTintList(ColorStateList.valueOf(c));
                  btnWeekendFrom.setBackgroundTintList(ColorStateList.valueOf(c)); btnWeekendTo.setBackgroundTintList(ColorStateList.valueOf(c));
                  btnTheme.setBackgroundTintList(ColorStateList.valueOf(c)); btnPermission.setBackgroundTintList(ColorStateList.valueOf(c));
                  boolean binder = false, granted = false;
                  try { binder = Shizuku.pingBinder(); granted = binder && Shizuku.checkSelfPermission() == PackageManager.PERMISSION_GRANTED; } catch (Throwable ignored) {}
                  String s = !binder ? "Shizuku не запущено. Запустіть його, і розклад запрацює." : !granted ? "Shizuku запущено, але цьому застосунку ще не дано дозвіл." : "Shizuku готовий.";
                  if (prefs.getBoolean("active", false)) s += "\nЗараз зв’язок вимкнено за розкладом.";
                  s += "\nСповіщення необов’язкові: без них розклад працює.";
                  tvStatus.setText(s); btnPermission.setVisibility(binder && !granted ? View.VISIBLE : View.GONE);
              }
          }
          EOF

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: NightNet-APK
          path: build/outputs/apk/debug/*.apk
