          import java.util.regex.Matcher;
          import java.util.regex.Pattern;

          /** Розбір кодів помилок (режими 03/07/0A) і вбудований довідник описів. Без залежностей від Android. */
          final class Dtc {
              private Dtc() {
              }

              private static final Pattern FRAME = Pattern.compile("^([0-9A-F]):(.*)$");
              private static final Pattern LEN3 = Pattern.compile("^[0-9A-F]{3}$");

              /** Витягує коди з відповіді ELM. id = "43", "47" або "4A". can = true для CAN (є байт кількості). */
              static List<String> parse(String resp, String id, boolean can) {
                  List<String> codes = new ArrayList<String>();
                  if (resp == null) return codes;
                  List<StringBuilder> blocks = new ArrayList<StringBuilder>();
                  StringBuilder cur = null;
                  for (String line : resp.split("\n")) {
                      String s = line.replace(" ", "").toUpperCase(Locale.US);
                      if (s.isEmpty()) continue;
                      Matcher m = FRAME.matcher(s);
                      if (m.matches()) {
                          if (m.group(1).equals("0")) {
                              cur = new StringBuilder(m.group(2));
                              blocks.add(cur);
                          } else if (cur != null) {
                              cur.append(m.group(2));
                          }
                          continue;
                      }
                      if (LEN3.matcher(s).matches()) continue;
                      if (s.startsWith(id)) {
                          cur = new StringBuilder(s);
                          blocks.add(cur);
                      }
                  }
                  for (StringBuilder sb : blocks) {
                      String b = sb.toString();
                      if (!b.startsWith(id)) continue;
                      String data = b.substring(2);
                      if (can) {
                          if (data.length() < 2) continue;
                          data = data.substring(2);
                      }
                      for (int i = 0; i + 4 <= data.length(); i += 4) {
                          String pair = data.substring(i, i + 4);
                          if (pair.equals("0000")) continue;
                          try {
                              int hi = Integer.parseInt(pair.substring(0, 2), 16);
                              int lo = Integer.parseInt(pair.substring(2, 4), 16);
                              char t = "PCBU".charAt((hi >> 6) & 3);
                              int d1 = (hi >> 4) & 3;
                              int d2 = hi & 0xF;
                              String code = "" + t + d1 + Integer.toHexString(d2).toUpperCase(Locale.US)
                                      + String.format(Locale.US, "%02X", lo);
                              if (!codes.contains(code)) codes.add(code);
                          } catch (NumberFormatException e) {
                              // пропускаємо сміття
                          }
                      }
                  }
                  return codes;
              }

              static String kindLabel(String kind) {
                  if ("stored".equals(kind)) return "збережена";
                  if ("pending".equals(kind)) return "очікує підтвердження";
                  if ("permanent".equals(kind)) return "постійна";
                  return kind;
              }

              static String describe(String code) {
                  String d = DB.get(code);
                  if (d != null) return d;
                  return fallback(code);
              }

              static boolean known(String code) {
                  return DB.containsKey(code);
              }

              private static String fallback(String code) {
                  char t = code.charAt(0);
                  char d1 = code.length() > 1 ? code.charAt(1) : '0';
                  char d2 = code.length() > 2 ? code.charAt(2) : '0';
                  if (t == 'U') {
                      return "Помилка зв'язку між блоками керування (мережа CAN). Точний опис — кнопкою «Інтернет».";
                  }
                  if (t == 'B') return "Кузовна помилка. Точний опис — кнопкою «Інтернет».";
                  if (t == 'C') return "Помилка шасі (ABS, ходова). Точний опис — кнопкою «Інтернет».";
                  // P
                  if (d1 == '1' || d1 == '3') {
                      return "Код виробника (Ford), в довіднику відсутній. Точний опис — кнопкою «Інтернет».";
                  }
                  String area;
                  switch (d2) {
                      case '1': area = "подача палива й повітря (датчики витрати, тиску, температури)"; break;
                      case '2': area = "подача палива й повітря (форсунки, наддув)"; break;
                      case '3': area = "запалювання або пропуски займання"; break;
                      case '4': area = "допоміжні системи контролю викидів (EGR, сажовий фільтр)"; break;
                      case '5': area = "швидкість, холостий хід, допоміжні входи"; break;
                      case '6': area = "електронний блок керування та його виходи"; break;
                      case '7':
                      case '8': area = "коробка передач"; break;
                      default: area = "силовий агрегат"; break;
                  }
                  return "Стандартний код SAE, область: " + area + ". Точний опис — кнопкою «Інтернет».";
              }

