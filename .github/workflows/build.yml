          /** Журнал подій, статистика PID, історія для графіків, CSV і текстовий звіт. */
          final class Rep {
              static final class Stat {
                  int ok, nodata, err;
                  double min = Double.MAX_VALUE, max = -Double.MAX_VALUE, sum;
                  double last = Double.NaN;
                  String lastRaw = "";
              }

              static final class Hist {
                  final ArrayList<Long> t = new ArrayList<Long>();
                  final ArrayList<Double> v = new ArrayList<Double>();
              }

              private final SimpleDateFormat tf = new SimpleDateFormat("HH:mm:ss.SSS", Locale.US);
              private final ArrayList<String> events = new ArrayList<String>();
              private final ArrayList<String> rows = new ArrayList<String>();
              final Map<String, Stat> stats = new LinkedHashMap<String, Stat>();
              final Map<String, Hist> hist = new LinkedHashMap<String, Hist>();
              final Map<String, String> unknown = new LinkedHashMap<String, String>();
              String lastDtc = "";
              String supported = "";
              String initInfo = "";
              String appVersion = "1.0";
              private BufferedWriter csv;
              String csvPath = "";
              final long t0 = System.currentTimeMillis();

              synchronized void openCsv(File dir) {
                  try {
                      if (dir == null) return;
                      dir.mkdirs();
                      File f = new File(dir, "diag_" + new SimpleDateFormat("yyyyMMdd_HHmmss", Locale.US).format(new Date()) + ".csv");
                      csv = new BufferedWriter(new FileWriter(f));
                      csv.write("time_ms;pid;value;raw\n");
                      csvPath = f.getAbsolutePath();
                  } catch (Throwable ignored) {
                      csv = null;
                  }
              }

              synchronized void event(String s) {
                  events.add(tf.format(new Date()) + " " + s);
                  while (events.size() > 400) events.remove(0);
              }

              synchronized void marker(String s) {
                  event("★ ПОЗНАЧКА: " + s);
                  try {
                      if (csv != null) {
                          csv.write((System.currentTimeMillis() - t0) + ";MARK;;" + s.replace(';', ',') + "\n");
                          csv.flush();
                      }
                  } catch (Throwable ignored) {
                  }
              }

              private Stat st(String pid) {
                  Stat s = stats.get(pid);
                  if (s == null) {
                      s = new Stat();
                      stats.put(pid, s);
                  }
                  return s;
              }

              synchronized void ok(String pid, double v, String raw) {
                  Stat s = st(pid);
                  s.ok++;
                  s.sum += v;
                  if (v < s.min) s.min = v;
                  if (v > s.max) s.max = v;
                  s.last = v;
                  s.lastRaw = raw;
                  long now = System.currentTimeMillis();
                  Hist h = hist.get(pid);
                  if (h == null) {
                      h = new Hist();
                      hist.put(pid, h);
                  }
                  h.t.add(now);
                  h.v.add(v);
                  while (h.t.size() > 4000) {
                      h.t.remove(0);
                      h.v.remove(0);
                  }
                  String row = (now - t0) + ";" + pid + ";" + String.format(Locale.US, "%.2f", v) + ";" + raw.replace('\n', '|');
                  rows.add(row);
                  while (rows.size() > 60) rows.remove(0);
                  try {
                      if (csv != null) {
                          csv.write(row + "\n");
                          if (rows.size() % 20 == 0) csv.flush();
                      }
                  } catch (Throwable ignored) {
                  }
              }

              synchronized void nodata(String pid, String raw) {
                  Stat s = st(pid);
                  s.nodata++;
                  s.lastRaw = raw;
              }

              synchronized void err(String pid, String raw) {
                  Stat s = st(pid);
                  s.err++;
                  s.lastRaw = raw;
              }

              synchronized void reset() {
                  stats.clear();
                  hist.clear();
                  rows.clear();
              }

              synchronized String report() {
                  StringBuilder b = new StringBuilder();
                  b.append("=== ЗВІТ ДІАГНОСТИКА v").append(appVersion).append(" ===\n");
                  b.append("Пристрій: ").append(Build.MANUFACTURER).append(' ').append(Build.MODEL)
                          .append(", Android ").append(Build.VERSION.RELEASE).append('\n');
                  b.append("Час: ").append(new SimpleDateFormat("yyyy-MM-dd HH:mm:ss", Locale.US).format(new Date()))
                          .append(", сесія ").append((System.currentTimeMillis() - t0) / 1000).append(" с\n");
                  b.append("ELM: ").append(initInfo.replace('\n', ' ')).append('\n');
                  b.append("Підтримувані PID: ").append(supported).append('\n');
                  if (!unknown.isEmpty()) {
                      b.append("\n-- PID поза таблицею (сирі відповіді) --\n");
                      for (Map.Entry<String, String> e : unknown.entrySet()) {
                          b.append(e.getKey()).append(" = ").append(e.getValue().replace('\n', '|')).append('\n');
                      }
                  }
                  b.append("\n-- Статистика PID (ok/нема даних/помилок, min/сер/max, останнє, сире) --\n");
                  for (Map.Entry<String, Stat> e : stats.entrySet()) {
                      Stat s = e.getValue();
                      Pids.Def d = Pids.find(e.getKey());
                      b.append(e.getKey()).append(' ').append(d != null ? d.name : "?").append(": ")
                              .append(s.ok).append('/').append(s.nodata).append('/').append(s.err);
                      if (s.ok > 0) {
                          b.append(String.format(Locale.US, "  %.1f/%.1f/%.1f  last=%.1f", s.min, s.sum / s.ok, s.max, s.last));
                      }
                      b.append("  raw=").append(s.lastRaw.replace('\n', '|')).append('\n');
                  }
                  b.append("\n-- Останнє читання помилок --\n").append(lastDtc.isEmpty() ? "(не читали)\n" : lastDtc + "\n");
                  b.append("\n-- Події --\n");
                  int from = Math.max(0, events.size() - 120);
                  for (int i = from; i < events.size(); i++) b.append(events.get(i)).append('\n');
                  b.append("\n-- Останні рядки даних --\n");
                  for (String r : rows) b.append(r).append('\n');
                  if (!csvPath.isEmpty()) b.append("\nCSV: ").append(csvPath).append('\n');
                  return b.toString();
              }

              synchronized void flush() {
                  try {
                      if (csv != null) csv.flush();
                  } catch (Throwable ignored) {
                  }
              }

              synchronized List<Double> values(String pid, long sinceMs, List<Long> times) {
                  Hist h = hist.get(pid);
                  List<Double> r = new ArrayList<Double>();
                  if (h == null) return r;
                  for (int i = 0; i < h.t.size(); i++) {
                      if (h.t.get(i) >= sinceMs) {
                          times.add(h.t.get(i));
                          r.add(h.v.get(i));
                      }
                  }
                  return r;
              }
          }
