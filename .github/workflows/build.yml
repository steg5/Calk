              private View buildRange() {
                  LinearLayout col = col();
                  col.addView(title("Вибір проміжку часу"));
                  btnFrom = mk("");
                  btnTo = mk("");
                  col.addView(hrow(btnFrom, btnTo));
                  Button pNight = mk("Ніч");
                  Button p6 = mk("6 год");
                  Button p24 = mk("24 год");
                  Button p7 = mk("7 днів");
                  col.addView(hrow(pNight, p6, p24, p7), Ui.lp(act, ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT, 0, 4, 0, 0));
                  rangeDetail = new DetailView(act);
                  col.addView(rangeDetail);

                  rTo = prefs.getLong("r_to", 0);
                  rFrom = prefs.getLong("r_from", 0);
                  if (rTo <= rFrom) setPreset(0);

                  btnFrom.setOnClickListener(v -> pickDateTime(true));
                  btnTo.setOnClickListener(v -> pickDateTime(false));
                  pNight.setOnClickListener(v -> { setPreset(0); rangeChanged(); });
                  p6.setOnClickListener(v -> { setPreset(1); rangeChanged(); });
                  p24.setOnClickListener(v -> { setPreset(2); rangeChanged(); });
                  p7.setOnClickListener(v -> { setPreset(3); rangeChanged(); });
                  updateRangeButtons();
                  return scroll(col);
              }

              private void setPreset(int kind) {
                  long now = System.currentTimeMillis();
                  if (kind == 0) {
                      Calendar c = Calendar.getInstance();
                      c.set(Calendar.HOUR_OF_DAY, 8);
                      c.set(Calendar.MINUTE, 0);
                      c.set(Calendar.SECOND, 0);
                      c.set(Calendar.MILLISECOND, 0);
                      long end = Math.min(c.getTimeInMillis(), now);
                      rTo = end;
                      rFrom = end - 10L * 3600000L;
                  } else {
                      long span = kind == 1 ? 6L * 3600000L : kind == 2 ? 24L * 3600000L : 7L * 24L * 3600000L;
                      rTo = now;
                      rFrom = now - span;
                  }
              }

              private void pickDateTime(final boolean from) {
                  final Calendar c = Calendar.getInstance();
                  c.setTimeInMillis(from ? rFrom : rTo);
                  new DatePickerDialog(act, (dv, y, mo, d) -> {
                      new TimePickerDialog(act, (tv, h, m) -> {
                          Calendar n = Calendar.getInstance();
                          n.set(y, mo, d, h, m, 0);
                          n.set(Calendar.MILLISECOND, 0);
                          if (from) rFrom = n.getTimeInMillis();
                          else rTo = n.getTimeInMillis();
                          rangeChanged();
                      }, c.get(Calendar.HOUR_OF_DAY), c.get(Calendar.MINUTE), true).show();
                  }, c.get(Calendar.YEAR), c.get(Calendar.MONTH), c.get(Calendar.DAY_OF_MONTH)).show();
              }

              private void rangeChanged() {
                  if (rTo <= rFrom) {
                      toast("Кінець проміжку має бути пізніше за початок");
                      updateRangeButtons();
                      return;
                  }
                  prefs.edit().putLong("r_from", rFrom).putLong("r_to", rTo).apply();
                  loadRange();
              }

              private void updateRangeButtons() {
                  btnFrom.setText("Від: " + Ui.when(rFrom));
                  btnTo.setText("До: " + Ui.when(rTo));
              }

              private void loadRange() {
                  updateRangeButtons();
                  if (rTo <= rFrom) return;
                  final int seq = ++rangeSeq;
                  rangeDetail.message("Обчислення…");
                  final long f = rFrom, t = rTo;
                  new Thread(() -> {
                      final Detail d = Detail.forRange(act.getApplicationContext(), f, t);
                      act.runOnUiThread(() -> {
                          if (seq == rangeSeq) rangeDetail.show(d, accent(), 25, 15);
                      });
                  }).start();
              }

