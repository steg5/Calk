              private void showLog(List<Sess> list) {
                  int minMin = prefs.getInt("min_minutes", 30);
                  boolean on = prefs.getBoolean("mon_enabled", true);
                  logHint.setText(on
                          ? "Записуються блокування екрана довші за " + minMin + " хв (без зарядки). Тапніть запис, щоб побачити, що розряджало батарею і не давало заснути."
                          : "Моніторинг вимкнено. Увімкніть його у вкладці «Налаштування».");
                  logList.removeAllViews();
                  if (list.isEmpty()) {
                      logList.addView(Ui.tv(act, "Записів ще немає. Вони з'являться після першого блокування екрана довше за " + minMin + " хв.", 15, 0xFF30343A, false));
                      return;
                  }
                  for (final Sess s : list) {
                      LinearLayout card = Ui.card(act);
                      card.addView(Ui.tv(act, Ui.when(s.st) + "  →  " + Ui.when(s.en), 16, 0xFF202124, true));
                      card.addView(Ui.tv(act, "Заблоковано: " + Ui.dur(s.durMs()), 14, 0xFF30343A, false));
                      String drain = "Розряд: " + Ui.signed(s.drop()) + " (" + String.format(Locale.US, "%.2f", s.perHour()) + " %/год)";
                      double mah = s.mah();
                      if (mah >= 0) drain += " · " + String.format(Locale.US, "%.0f", mah) + " мАг";
                      card.addView(Ui.tv(act, drain, 14, 0xFF30343A, false));
                      int deep = (int) Math.round(s.deepPct());
                      card.addView(Ui.tv(act, "Глибокий сон: " + deep + "%", 14, Ui.deepColor(s.deepPct()), true));
                      if (s.sched) card.addView(Ui.tv(act, "Мережа була вимкнена за розкладом", 13, accent(), false));
                      if (s.snapA <= 0 || s.snapB <= 0) card.addView(Ui.tv(act, "Деталей немає: статистику не вдалося зчитати", 12, 0xFF5F6368, false));
                      card.setOnClickListener(v -> {
                          Intent i = new Intent(act, SessionActivity.class);
                          i.putExtra("id", s.id);
                          act.startActivity(i);
                      });
                      logList.addView(card, Ui.lp(act, ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT, 0, 0, 0, 10));
                  }
              }

