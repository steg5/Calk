          package com.example.nightnet;

          import android.app.Activity;
          import android.os.Bundle;
          import android.view.MenuItem;
          import android.view.ViewGroup;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import java.util.Locale;

          public class SessionActivity extends Activity {
              private LinearLayout head;
              private DetailView detail;
              private int accent;

              @Override protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setTitle("Деталі запису");
                  if (getActionBar() != null) getActionBar().setDisplayHomeAsUpEnabled(true);
                  int[] colors = {0xFF168C83, 0xFF3978C6, 0xFF8064B5, 0xFF27866A, 0xFFB77924};
                  accent = colors[Math.floorMod(Prefs.get(this).getInt("theme", 0), colors.length)];

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(Ui.dp(this, 16), Ui.dp(this, 12), Ui.dp(this, 16), Ui.dp(this, 24));
                  head = Ui.card(this);
                  head.addView(Ui.tv(this, "Завантаження…", 15, 0xFF30343A, false));
                  root.addView(head, Ui.lp(this, ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT, 0, 0, 0, 0));
                  detail = new DetailView(this);
                  root.addView(detail);
                  ScrollView sv = new ScrollView(this);
                  sv.setBackgroundColor(0xFFF7F8FA);
                  sv.addView(root);
                  setContentView(sv);

                  final long id = getIntent().getLongExtra("id", 0);
                  new Thread(() -> {
                      final Sess s = Db.get(getApplicationContext()).session(id);
                      final Detail d = s == null ? null : Detail.forSession(getApplicationContext(), s);
                      runOnUiThread(() -> bind(s, d));
                  }).start();
              }

              private TextView line(String s, float sp, int color, boolean bold) {
                  TextView t = Ui.tv(this, s, sp, color, bold);
                  t.setPadding(0, Ui.dp(this, 2), 0, 0);
                  return t;
              }

              private void bind(Sess s, Detail d) {
                  head.removeAllViews();
                  if (s == null) {
                      head.addView(line("Запис не знайдено (можливо, його вже видалено).", 15, 0xFF30343A, false));
                      detail.removeAllViews();
                      return;
                  }
                  head.addView(line(Ui.when(s.st) + "  →  " + Ui.when(s.en), 17, 0xFF202124, true));
                  head.addView(line("Заблоковано: " + Ui.dur(s.durMs()), 14, 0xFF30343A, false));
                  String drain = "Заряд: " + s.stLvl + "% → " + s.enLvl + "% (" + Ui.signed(s.drop()) + ", "
                          + String.format(Locale.US, "%.2f", s.perHour()) + " %/год)";
                  double mah = s.mah();
                  if (mah >= 0) drain += " · " + String.format(Locale.US, "%.0f", mah) + " мАг";
                  head.addView(line(drain, 14, 0xFF30343A, false));
                  long deepMs = Math.max(0, s.el - s.up);
                  head.addView(line("Глибокий сон: " + Math.round(s.deepPct()) + "% часу (" + Ui.dur(deepMs) + " з " + Ui.dur(s.el) + ")",
                          14, Ui.deepColor(s.deepPct()), true));
                  head.addView(line("Не в глибокому сні: " + Ui.dur(Math.max(0, s.el - deepMs)), 14, 0xFF30343A, false));
                  if (s.sched) head.addView(line("Мережа була вимкнена за розкладом", 13, accent, false));
                  detail.show(d, accent, 30, 20);
              }

              @Override public boolean onOptionsItemSelected(MenuItem item) {
                  if (item.getItemId() == android.R.id.home) {
                      finish();
                      return true;
                  }
                  return super.onOptionsItemSelected(item);
              }
          }
