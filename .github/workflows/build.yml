                      try { again = doTick(); } catch (Throwable ignored) { }
                      if (again) h.postDelayed(this, 1000L);
                      else ticking = false;
                  }
              };

              private void kick() {
                  if (!ticking) {
                      ticking = true;
                      h.post(tickRun);
                  }
