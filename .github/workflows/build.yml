name: RadioApp

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Write project
        run: |
          mkdir -p app/src/main/java/com/example/radioapp

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'RadioApp'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=false
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.example.radioapp'
              compileSdk 34
              defaultConfig {
                  applicationId "com.example.radioapp"
                  minSdk 23
                  targetSdk 26
                  versionCode 2
                  versionName "1.1"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
              lint {
                  abortOnError false
                  checkReleaseBuilds false
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <application
                  android:label="Радіо"
                  android:allowBackup="false"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF


          cat > app/src/main/java/com/example/radioapp/MainActivity.java <<'EOF'
          package com.example.radioapp;

          import android.app.Activity;
          import android.app.AlertDialog;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.graphics.drawable.StateListDrawable;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.view.Gravity;
          import android.view.View;
          import android.view.WindowManager;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.FrameLayout;
          import android.widget.ImageView;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.SeekBar;
          import android.widget.TextView;
          import android.widget.Toast;

          import java.util.ArrayList;
          import java.util.List;

          public class MainActivity extends Activity {
              static final int BG = 0xFF0B0F17, CARD = 0xFF172033, CARD2 = 0xFF1F2B42, TXT = 0xFFF1F5F9,
                      DIM = 0xFF8A99B3, ACC = 0xFF22D3EE, GRN = 0xFF16A34A, RED = 0xFFDC2626, ORG = 0xFFEA580C;
              static final int FMIN = 8750, FMAX = 10800;

              final Handler ui = new Handler(Looper.getMainLooper());
              Store store;
              Tuner tuner;
              boolean land;
              int cur = 0;
              int shownLogoFreq = -1;
              boolean dragging;
              volatile boolean scanning, scanStop;

              View[] tabs = new View[3];
              Button[] tabBtns = new Button[3];
              TextView tvFreq, tvName, tvSub, tvScan, tvStar;
              ImageView ivLogo;
              SeekBar seek;
              Button btnFav, btnScan;
              LinearLayout favList, allList;

              int dp(int v) {
                  return (int) (v * getResources().getDisplayMetrics().density + 0.5f);
              }

              GradientDrawable rect(int color, int radiusDp) {
                  GradientDrawable g = new GradientDrawable();
                  g.setColor(color);
                  g.setCornerRadius(dp(radiusDp));
                  return g;
              }

              TextView tv(String s, int sp, int color, boolean bold) {
                  TextView t = new TextView(this);
                  t.setText(s);
                  t.setTextSize(sp);
                  t.setTextColor(color);
                  if (bold) t.setTypeface(Typeface.DEFAULT_BOLD);
                  return t;
              }

              Button bigBtn(String s, int color, int sp) {
                  Button b = new Button(this);
                  b.setText(s);
                  b.setAllCaps(false);
                  b.setTextColor(Color.WHITE);
                  b.setTextSize(sp);
                  b.setTypeface(Typeface.DEFAULT_BOLD);
                  StateListDrawable sl = new StateListDrawable();
                  sl.addState(new int[]{android.R.attr.state_pressed}, rect(darker(color), 18));
                  sl.addState(new int[]{}, rect(color, 18));
                  b.setBackground(sl);
                  return b;
              }

              static int darker(int c) {
                  return Color.rgb((int) (Color.red(c) * 0.7), (int) (Color.green(c) * 0.7), (int) (Color.blue(c) * 0.7));
              }

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                  store = new Store(this);
                  land = getResources().getDisplayMetrics().widthPixels > getResources().getDisplayMetrics().heightPixels * 1.2;

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setBackgroundColor(BG);
                  root.setPadding(dp(10), dp(8), dp(10), dp(8));

                  LinearLayout bar = new LinearLayout(this);
                  String[] names = {"Радіо", "Обрані", "Станції"};
                  for (int i = 0; i < 3; i++) {
                      final int idx = i;
                      Button t = bigBtn(names[i], CARD, 20);
                      t.setOnClickListener(v -> showTab(idx));
                      LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(0, dp(62), 1);
                      lp.setMargins(dp(4), 0, dp(4), dp(8));
                      bar.addView(t, lp);
                      tabBtns[i] = t;
                  }
                  root.addView(bar);

                  FrameLayout content = new FrameLayout(this);
                  root.addView(content, new LinearLayout.LayoutParams(-1, 0, 1));
                  tabs[0] = buildMain();
                  tabs[1] = buildFavTab();
                  tabs[2] = buildAllTab();
                  for (View v : tabs) content.addView(v, new FrameLayout.LayoutParams(-1, -1));
                  setContentView(root);
                  showTab(0);

                  tuner = new Tuner(this::onState);
                  boolean ok = tuner.start();
                  if (!ok) tvSub.setText("Немає зв'язку з тюнером: " + tuner.error);
                  cur = store.last() >= FMIN && store.last() <= FMAX ? store.last() : 0;
                  updateUi();
                  if (b == null) {
                      // при запуску: вмикаємо штатне радіо на останній станції
                      tuner.tune(this, cur, MainActivity.class);
                  }
              }

              @Override
              protected void onDestroy() {
                  if (tuner != null) tuner.stop();
                  super.onDestroy();
              }

              // ================= Вкладка «Радіо» =================

              View buildMain() {
                  LinearLayout main = new LinearLayout(this);
                  main.setOrientation(land ? LinearLayout.HORIZONTAL : LinearLayout.VERTICAL);

                  LinearLayout left = new LinearLayout(this);
                  left.setOrientation(LinearLayout.VERTICAL);
                  left.setGravity(Gravity.CENTER);
                  left.setBackground(rect(CARD, 24));
                  left.setPadding(dp(12), dp(10), dp(12), dp(10));
                  ivLogo = new ImageView(this);
                  ivLogo.setScaleType(ImageView.ScaleType.FIT_CENTER);
                  left.addView(ivLogo, new LinearLayout.LayoutParams(dp(land ? 120 : 96), dp(land ? 120 : 96)));
                  tvName = tv("—", 26, TXT, true);
                  tvName.setGravity(Gravity.CENTER);
                  tvName.setSingleLine(true);
                  left.addView(tvName);
                  tvFreq = tv("--.-", land ? 84 : 72, ACC, true);
                  tvFreq.setGravity(Gravity.CENTER);
                  left.addView(tvFreq);
                  tvSub = tv("Чекаю дані тюнера…", 16, DIM, false);
                  tvSub.setGravity(Gravity.CENTER);
                  left.addView(tvSub);
                  LinearLayout.LayoutParams lpL = land ? new LinearLayout.LayoutParams(0, -1, 1) : new LinearLayout.LayoutParams(-1, 0, 1);
                  lpL.setMargins(dp(4), dp(4), dp(4), dp(4));
                  main.addView(left, lpL);

                  LinearLayout right = new LinearLayout(this);
                  right.setOrientation(LinearLayout.VERTICAL);
                  right.setPadding(dp(6), dp(4), dp(6), dp(4));

                  TextView lab = tv("87.5 ─────────────── 108.0 МГц", 13, DIM, false);
                  lab.setGravity(Gravity.CENTER);
                  right.addView(lab);
                  seek = new SeekBar(this);
                  seek.setMax((FMAX - FMIN) / 10);
                  seek.setPadding(dp(18), dp(14), dp(18), dp(14));
                  seek.setOnSeekBarChangeListener(new SeekBar.OnSeekBarChangeListener() {
                      @Override
                      public void onProgressChanged(SeekBar s, int p, boolean fromUser) {
                          if (fromUser) {
                              tvFreq.setText(Station.fmt(FMIN + p * 10));
                          }
                      }

                      @Override
                      public void onStartTrackingTouch(SeekBar s) {
                          dragging = true;
                      }

                      @Override
                      public void onStopTrackingTouch(SeekBar s) {
                          dragging = false;
                          tuneTo(FMIN + s.getProgress() * 10);
                      }
                  });
                  right.addView(seek, new LinearLayout.LayoutParams(-1, dp(56)));

                  right.addView(row2(bigBtn("⏮  Попередня станція", 0xFF2563EB, 19), bigBtn("Наступна станція  ⏭", 0xFF2563EB, 19),
                          () -> tuner.prev(), () -> tuner.next()));
                  right.addView(row2(bigBtn("◀  Крок назад", 0xFF475569, 19), bigBtn("Крок вперед  ▶", 0xFF475569, 19),
                          () -> tuner.stepDown(), () -> tuner.stepUp()));
                  btnFav = bigBtn("☆  В обрані", ORG, 19);
                  Button sc = bigBtn("🔍  Знайти станції", GRN, 19);
                  btnScan = sc;
                  right.addView(row2(btnFav, sc, this::toggleFav, this::startScan));

                  LinearLayout.LayoutParams lpR = land ? new LinearLayout.LayoutParams(0, -1, 1.15f) : new LinearLayout.LayoutParams(-1, 0, 1.3f);
                  main.addView(right, lpR);
                  return main;
              }

              LinearLayout row2(Button a, Button b, final Runnable ra, final Runnable rb) {
                  LinearLayout r = new LinearLayout(this);
                  a.setOnClickListener(v -> ra.run());
                  b.setOnClickListener(v -> rb.run());
                  LinearLayout.LayoutParams p = new LinearLayout.LayoutParams(0, -1, 1);
                  p.setMargins(dp(4), dp(4), dp(4), dp(4));
                  r.addView(a, p);
                  r.addView(b, p);
                  r.setLayoutParams(new LinearLayout.LayoutParams(-1, 0, 1));
                  return r;
              }

              // ================= Стан тюнера =================

              void onState() {
                  int f = tuner.freq;
                  if (f >= FMIN && f <= FMAX) {
                      cur = f;
                      if (!tuner.seeking) {
                          ui.removeCallbacks(saveRun);
                          ui.postDelayed(saveRun, 1500);
                      }
                  }
                  updateUi();
              }

              final Runnable saveRun = new Runnable() {
                  @Override
                  public void run() {
                      if (cur >= FMIN && cur <= FMAX) {
                          store.setLast(cur);
                          Station s = store.get(cur);
                          String ps = tuner.ps;
                          if (s != null && s.name.isEmpty() && !ps.isEmpty() && tuner.freq == cur) {
                              s.name = ps;
                              store.save();
                              refreshLists();
                          }
                      }
                  }
              };

              String nameFor(int f) {
                  Station s = store.get(f);
                  if (s != null && !s.name.isEmpty()) return s.name;
                  if (f == tuner.freq && !tuner.ps.isEmpty()) return tuner.ps;
                  int i = Lviv.match(f);
                  if (i >= 0) return (String) Lviv.LIST[i][1];
                  return "FM " + Station.fmt(f);
              }

              String aliasFor(int f) {
                  Station s = store.get(f);
                  if (s != null && !s.alias.isEmpty()) return s.alias;
                  int i = Lviv.match(f);
                  return i >= 0 ? (String) Lviv.LIST[i][2] : "";
              }

              void updateUi() {
                  if (cur <= 0) return;
                  if (!dragging) {
                      tvFreq.setText(Station.fmt(cur));
                      seek.setProgress(Math.max(0, Math.min(seek.getMax(), (cur - FMIN + 5) / 10)));
                  }
                  String name = nameFor(cur);
                  tvName.setText(name);
                  if (tuner.seeking) tvSub.setText("Шукаю станцію…");
                  else if (!tuner.ps.isEmpty() && cur == tuner.freq) tvSub.setText("RDS: " + tuner.ps);
                  else tvSub.setText("FM · МГц");
                  if (shownLogoFreq != cur) {
                      shownLogoFreq = cur;
                      Station s = store.get(cur);
                      Logos.load(this, "m" + cur, name, aliasFor(cur), s != null ? s.logo : "", ivLogo);
                  }
                  Station s = store.get(cur);
                  boolean fav = s != null && s.fav;
                  btnFav.setText(fav ? "★  В обраних" : "☆  В обрані");
              }

              void tuneTo(int f) {
                  f = Math.max(FMIN, Math.min(FMAX, f));
                  cur = f;
                  updateUi();
                  tuner.tune(this, f, MainActivity.class);
              }

              void toggleFav() {
                  if (cur <= 0) return;
                  Station s = store.getOrCreate(cur);
                  s.fav = !s.fav;
                  if (s.fav && s.name.isEmpty()) s.name = nameFor(cur);
                  store.save();
                  updateUi();
                  refreshLists();
              }

              // ================= Вкладки списків =================

              View buildFavTab() {
                  ScrollView sv = new ScrollView(this);
                  favList = new LinearLayout(this);
                  favList.setOrientation(LinearLayout.VERTICAL);
                  sv.addView(favList);
                  return sv;
              }

              View buildAllTab() {
                  LinearLayout col = new LinearLayout(this);
                  col.setOrientation(LinearLayout.VERTICAL);
                  Button b = bigBtn("🔍  Сканувати діапазон", GRN, 20);
                  b.setOnClickListener(v -> startScan());
                  LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(-1, dp(66));
                  lp.setMargins(dp(4), 0, dp(4), dp(4));
                  col.addView(b, lp);
                  tvScan = tv("", 15, DIM, false);
                  tvScan.setPadding(dp(8), 0, dp(8), dp(4));
                  col.addView(tvScan);
                  ScrollView sv = new ScrollView(this);
                  allList = new LinearLayout(this);
                  allList.setOrientation(LinearLayout.VERTICAL);
                  sv.addView(allList);
                  col.addView(sv, new LinearLayout.LayoutParams(-1, 0, 1));
                  return col;
              }

              void showTab(int i) {
                  for (int k = 0; k < 3; k++) {
                      tabs[k].setVisibility(k == i ? View.VISIBLE : View.GONE);
                      GradientDrawable g = rect(k == i ? 0xFF0891B2 : CARD, 18);
                      tabBtns[k].setBackground(g);
                  }
                  refreshLists();
              }

              void refreshLists() {
                  if (favList == null || allList == null) return;
                  favList.removeAllViews();
                  int n = 0;
                  for (Station s : store.known.values()) {
                      if (s.fav) {
                          favList.addView(rowView(s.f, true));
                          n++;
                      }
                  }
                  if (n == 0) {
                      TextView t = tv("Обраних поки немає.\nДодай станцію кнопкою «В обрані» або зірочкою у вкладці «Станції».", 18, DIM, false);
                      t.setPadding(dp(16), dp(24), dp(16), dp(16));
                      favList.addView(t);
                  }
                  allList.removeAllViews();
                  int found = 0;
                  for (Station s : store.known.values()) {
                      allList.addView(rowView(s.f, false));
                      found++;
                  }
                  if (found == 0) {
                      TextView t = tv("Знайдених станцій ще немає. Натисни «Сканувати діапазон».", 16, DIM, false);
                      t.setPadding(dp(16), dp(8), dp(16), dp(8));
                      allList.addView(t);
                  }
                  TextView h = tv("Довідник: Львів", 16, ACC, true);
                  h.setPadding(dp(10), dp(14), dp(10), dp(4));
                  allList.addView(h);
                  for (Object[] e : Lviv.LIST) {
                      int f = (Integer) e[0];
                      if (store.get(f) == null) allList.addView(rowView(f, false));
                  }
              }

              View rowView(final int f, final boolean inFav) {
                  final Station s = store.get(f);
                  String name = nameFor(f);
                  LinearLayout r = new LinearLayout(this);
                  r.setGravity(Gravity.CENTER_VERTICAL);
                  r.setBackground(rect(CARD, 16));
                  r.setPadding(dp(10), dp(8), dp(10), dp(8));
                  ImageView iv = new ImageView(this);
                  iv.setScaleType(ImageView.ScaleType.FIT_CENTER);
                  r.addView(iv, new LinearLayout.LayoutParams(dp(60), dp(60)));
                  Logos.load(this, "r" + f + (inFav ? "f" : "a"), name, aliasFor(f), s != null ? s.logo : "", iv);
                  LinearLayout t = new LinearLayout(this);
                  t.setOrientation(LinearLayout.VERTICAL);
                  t.setPadding(dp(12), 0, dp(8), 0);
                  t.addView(tv(name, 21, TXT, true));
                  int li = Lviv.match(f);
                  t.addView(tv(s != null ? "Знайдена станція" : (li >= 0 ? "Довідник Львова" : ""), 13, DIM, false));
                  r.addView(t, new LinearLayout.LayoutParams(0, -2, 1));
                  r.addView(tv(Station.fmt(f), 26, ACC, true));
                  final TextView star = tv(s != null && s.fav ? "★" : "☆", 34, s != null && s.fav ? 0xFFFBBF24 : DIM, false);
                  star.setPadding(dp(14), 0, dp(6), 0);
                  star.setOnClickListener(v -> {
                      Station st = store.getOrCreate(f);
                      st.fav = !st.fav;
                      if (st.name.isEmpty()) st.name = nameFor(f);
                      store.save();
                      updateUi();
                      refreshLists();
                  });
                  r.addView(star);
                  r.setOnClickListener(v -> {
                      tuneTo(f);
                      showTab(0);
                  });
                  r.setOnLongClickListener(v -> {
                      editDialog(f);
                      return true;
                  });
                  LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(-1, -2);
                  lp.setMargins(dp(4), dp(4), dp(4), dp(4));
                  r.setLayoutParams(lp);
                  return r;
              }

              void editDialog(final int f) {
                  final Station s = store.getOrCreate(f);
                  LinearLayout box = new LinearLayout(this);
                  box.setOrientation(LinearLayout.VERTICAL);
                  box.setPadding(dp(20), dp(10), dp(20), dp(0));
                  final EditText en = new EditText(this);
                  en.setHint("Назва станції");
                  en.setText(s.name.isEmpty() ? nameFor(f) : s.name);
                  final EditText ea = new EditText(this);
                  ea.setHint("Назва для пошуку логотипа (латиницею, необов'язково)");
                  ea.setText(s.alias);
                  final EditText eu = new EditText(this);
                  eu.setHint("Посилання на логотип (необов'язково)");
                  eu.setText(s.logo);
                  box.addView(en);
                  box.addView(ea);
                  box.addView(eu);
                  new AlertDialog.Builder(this)
                          .setTitle("Станція " + Station.fmt(f) + " МГц")
                          .setView(box)
                          .setPositiveButton("Зберегти", (d, w) -> {
                              s.name = en.getText().toString().trim();
                              s.alias = ea.getText().toString().trim();
                              s.logo = eu.getText().toString().trim();
                              store.save();
                              shownLogoFreq = -1;
                              updateUi();
                              refreshLists();
                          })
                          .setNegativeButton("Видалити", (d, w) -> {
                              store.remove(f);
                              updateUi();
                              refreshLists();
                          })
                          .setNeutralButton("Скасувати", null)
                          .show();
              }

              // ================= Сканування =================

              void startScan() {
                  if (scanning) {
                      scanStop = true;
                      return;
                  }
                  if (!tuner.haveState && tuner.freq == 0) {
                      Toast.makeText(this, "Тюнер ще не відповідає. Зачекай, поки радіо ввімкнеться.", Toast.LENGTH_LONG).show();
                      return;
                  }
                  scanning = true;
                  scanStop = false;
                  btnScan.setText("⏹  Зупинити пошук");
                  showTab(2);
                  new Thread(new Runnable() {
                      @Override
                      public void run() {
                          int found = 0;
                          try {
                              tuner.tune(MainActivity.this, FMIN, MainActivity.class);
                              Thread.sleep(3000);
                              int last = 0;
                              for (int n = 0; n < 80 && !scanStop; n++) {
                                  tuner.next();
                                  long t0 = System.currentTimeMillis();
                                  boolean seen = false;
                                  while (System.currentTimeMillis() - t0 < 12000) {
                                      Thread.sleep(60);
                                      if (tuner.seeking) seen = true;
                                      else if (seen) break;
                                      else if (System.currentTimeMillis() - t0 > 2500) break;
                                  }
                                  Thread.sleep(300);
                                  int f = tuner.freq;
                                  if (f < FMIN || f > FMAX) break;
                                  if (last != 0 && f <= last) break;
                                  last = f;
                                  found++;
                                  final String msg = "Знайдено: " + found + ", зараз " + Station.fmt(f) + " МГц";
                                  runOnUiThread(() -> tvScan.setText(msg));
                                  Thread.sleep(2800);
                                  String ps = tuner.ps;
                                  Station s = store.getOrCreate(f);
                                  if (s.name.isEmpty()) {
                                      if (!ps.isEmpty()) s.name = ps;
                                      else {
                                          int i = Lviv.match(f);
                                          if (i >= 0) s.name = (String) Lviv.LIST[i][1];
                                      }
                                  }
                                  store.save();
                              }
                          } catch (Throwable ignored) {
                          }
                          scanning = false;
                          final int total = found;
                          runOnUiThread(() -> {
                              btnScan.setText("🔍  Знайти станції");
                              tvScan.setText("Готово. Знайдено станцій: " + total);
                              refreshLists();
                              updateUi();
                          });
                      }
                  }).start();
              }
          }
          EOF

          cat > app/src/main/java/com/example/radioapp/Station.java <<'EOF'
          package com.example.radioapp;

          final class Station {
              int f;              // частота в одиницях 10 кГц (9030 = 90,30 МГц)
              String name = "";
              String alias = "";  // назва для пошуку логотипа
              String logo = "";   // власний URL логотипа
              boolean fav;

              Station(int f) {
                  this.f = f;
              }

              static String fmt(int f) {
                  if (f % 10 == 0) return (f / 100) + "." + ((f % 100) / 10);
                  return (f / 100) + "." + String.format(java.util.Locale.US, "%02d", f % 100);
              }
          }
          EOF

          cat > app/src/main/java/com/example/radioapp/Lviv.java <<'EOF'
          package com.example.radioapp;

          /** Довідник FM-станцій Львова (з відкритих джерел; сигнал RDS має пріоритет над назвою звідси). */
          final class Lviv {
              private Lviv() {
              }

              // частота (10 кГц), назва, назва для пошуку логотипа
              static final Object[][] LIST = {
                  {8820, "Перше", "Перше радіо"},
                  {8860, "Радіо НВ", "Radio NV"},
                  {8910, "Radio ROKS", "Radio ROKS"},
