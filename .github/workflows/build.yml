          package com.example.diagnostics;

          import java.util.Locale;

          /** Таблиця стандартних PID (режим 01), формули, парсер відповіді. Без залежностей від Android. */
          final class Pids {
              private Pids() {
              }

              static final class Def {
                  final String pid;
                  final String name;
                  final String unit;
                  final int period;     // опитувати кожен N-й цикл
                  final boolean on;     // увімкнено за замовчуванням

                  Def(String pid, String name, String unit, int period, boolean on) {
                      this.pid = pid;
                      this.name = name;
                      this.unit = unit;
                      this.period = period;
                      this.on = on;
                  }
              }

              static final Def[] ALL = {
                  new Def("010C", "Оберти двигуна", "об/хв", 1, true),
                  new Def("010D", "Швидкість", "км/год", 1, true),
                  new Def("014A", "Педаль газу", "%", 1, true),
                  new Def("0111", "Дросельна заслінка", "%", 1, true),
                  new Def("0145", "Дросель відносний", "%", 2, false),
                  new Def("014C", "Дросель (команда)", "%", 2, false),
                  new Def("010B", "Тиск впуску MAP", "кПа", 1, true),
                  new Def("0133", "Атмосферний тиск", "кПа", 20, true),
                  new Def("0110", "Витрата повітря MAF", "г/с", 1, true),
                  new Def("0104", "Навантаження двигуна", "%", 1, true),
                  new Def("0143", "Абсолютне навантаження", "%", 3, false),
                  new Def("0123", "Тиск палива в рейці", "бар", 1, true),
                  new Def("012C", "EGR (команда)", "%", 3, false),
                  new Def("012D", "EGR (похибка)", "%", 3, false),
                  new Def("0105", "Температура рідини", "°C", 10, true),
                  new Def("010F", "Температура впуску", "°C", 10, true),
                  new Def("0146", "Температура зовнішня", "°C", 20, false),
                  new Def("015C", "Температура оливи", "°C", 10, false),
                  new Def("0142", "Напруга ECU", "В", 10, false),
                  new Def("011F", "Час після запуску", "с", 10, false),
                  new Def("0121", "Пробіг із MIL", "км", 50, false),
                  new Def("0131", "Пробіг після стирання", "км", 50, false),
                  new Def("0130", "Прогрівів після стирання", "шт", 50, false),
                  new Def("015E", "Витрата палива", "л/год", 3, false),
                  new Def("015D", "Кут впорскування", "°", 3, false),
                  new Def("0161", "Момент (запит)", "%", 2, false),
                  new Def("0162", "Момент (факт)", "%", 2, false),
                  new Def("0163", "Момент (опорний)", "Нм", 50, false),
              };

              static Def find(String pid) {
                  for (Def d : ALL) {
                      if (d.pid.equals(pid)) return d;
                  }
                  return null;
              }

              /** Скільки байт даних очікується у відповіді. */
              static int minBytes(String pid) {
                  switch (pid) {
                      case "010C":
                      case "0110":
                      case "0123":
                      case "0142":
                      case "011F":
                      case "0121":
                      case "0131":
                      case "015E":
                      case "015D":
                      case "0163":
                      case "0143":
                          return 2;
                      default:
                          return 1;
                  }
              }

              static double decode(String pid, int[] d) {
                  int a = d.length > 0 ? d[0] : 0;
                  int b = d.length > 1 ? d[1] : 0;
                  int ab = a * 256 + b;
                  switch (pid) {
                      case "010C": return ab / 4.0;
                      case "010D": return a;
                      case "014A":
                      case "0111":
                      case "0145":
                      case "014C":
                      case "0104":
                      case "012C":
                          return a * 100.0 / 255.0;
                      case "0143": return ab * 100.0 / 255.0;
                      case "010B":
                      case "0133":
                          return a;
                      case "0110": return ab / 100.0;
                      case "0123": return ab / 10.0;           // кПа*10 -> бар
                      case "012D": return a * 100.0 / 128.0 - 100.0;
                      case "0105":
                      case "010F":
                      case "0146":
                      case "015C":
                          return a - 40;
                      case "0142": return ab / 1000.0;
                      case "011F":
                      case "0121":
                      case "0131":
                      case "0163":
                          return ab;
                      case "0130": return a;
                      case "015E": return ab / 20.0;
                      case "015D": return ab / 128.0 - 210.0;
                      case "0161":
                      case "0162":
                          return a - 125;
                      default: return Double.NaN;
                  }
              }

              static String fmt(String pid, double v) {
                  if (Double.isNaN(v)) return "—";
                  switch (pid) {
                      case "010C":
                      case "010D":
                      case "011F":
                      case "0121":
                      case "0131":
                      case "0130":
                      case "0163":
                      case "010B":
                      case "0133":
                      case "0105":
                      case "010F":
                      case "0146":
                      case "015C":
                      case "0161":
                      case "0162":
                          return String.format(Locale.US, "%.0f", v);
                      default:
                          return String.format(Locale.US, "%.1f", v);
                  }
              }

              /** Розбір відповіді на запит PID. Повертає байти даних або null. */
              static int[] parsePid(String resp, String pid) {
                  if (resp == null) return null;
                  String head = "41" + pid.substring(2);
                  for (String line : resp.split("\n")) {
                      String s = line.replace(" ", "").toUpperCase(Locale.US);
                      if (s.startsWith(head)) {
                          String hex = s.substring(head.length());
                          int n = hex.length() / 2;
                          int[] r = new int[n];
                          try {
                              for (int k = 0; k < n; k++) {
                                  r[k] = Integer.parseInt(hex.substring(2 * k, 2 * k + 2), 16);
                              }
                          } catch (NumberFormatException e) {
                              return null;
                          }
                          return r;
                      }
                  }
                  return null;
              }
          }
