          cat > src/main/java/com/example/nightnet/AlarmReceiver.java <<'EOF'
          package com.example.nightnet;

          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;

          public class AlarmReceiver extends BroadcastReceiver {
              @Override
              public void onReceive(Context context, Intent intent) {
                  MonitorService.ensure(context.getApplicationContext());
                  final PendingResult result = goAsync();
                  final Context app = context.getApplicationContext();
                  final String action = intent == null ? null : intent.getAction();
                  new Thread(() -> {
                      try {
                          boolean preNotice = false;
                          if (action != null) {
                              int dot = action.lastIndexOf('.');
                              if (dot >= 0) {
                                  try { preNotice = Integer.parseInt(action.substring(dot + 1)) % 3 == 1; }
                                  catch (NumberFormatException ignored) { }
                              }
                          }
                          Scheduler.sync(app, preNotice);
                      } finally {
                          result.finish();
                      }
                  }).start();
              }
          }
          EOF

          cat > src/main/java/com/example/nightnet/Core.java <<'EOF'
          package com.example.nightnet;

          import android.app.AlarmManager;
          import android.app.KeyguardManager;
          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.PackageManager;
          import android.os.PowerManager;
          import android.provider.Settings;
          import java.lang.reflect.Method;
          import java.util.Calendar;
          import java.util.Locale;
          import rikka.shizuku.Shizuku;

          final class Prefs {
              static SharedPreferences get(Context c) { return c.getSharedPreferences("cfg", Context.MODE_PRIVATE); }
          }

          final class Radio {
              static final int OK = 0, NOT_READY = 1, FAILED = 2;
              static boolean ready(int waitMs) {
                  long end = System.currentTimeMillis() + waitMs;
                  try {
                      while (!Shizuku.pingBinder()) {
                          if (System.currentTimeMillis() > end) return false;
                          Thread.sleep(200);
                      }
                      return Shizuku.checkSelfPermission() == PackageManager.PERMISSION_GRANTED;
                  } catch (Throwable t) { return false; }
              }
              static Process spawn(String... cmd) {
                  try {
                      Method m = Shizuku.class.getDeclaredMethod("newProcess", String[].class, String[].class, String.class);
                      m.setAccessible(true);
                      return (Process) m.invoke(null, cmd, null, null);
                  } catch (Throwable t) { return null; }
              }
              private static boolean run(String... cmd) {
                  try {
                      Process p = spawn(cmd);
                      return p != null && p.waitFor() == 0;
                  } catch (Throwable t) { return false; }
              }
              private static int apply(boolean wifi, boolean data, boolean enable) {
                  if (!wifi && !data) return OK;
                  if (!ready(6000)) return NOT_READY;
                  String act = enable ? "enable" : "disable";
                  boolean ok = true;
                  if (wifi) ok &= run("/system/bin/svc", "wifi", act);
                  if (data) ok &= run("/system/bin/svc", "data", act);
                  return ok ? OK : FAILED;
              }
              static int setData(boolean enable) { return apply(false, true, enable); }
              static int off(Context c) {
                  SharedPreferences p = Prefs.get(c);
                  boolean w = p.getBoolean("wifi", false), d = p.getBoolean("data", false);
                  p.edit().putBoolean("off_wifi", w).putBoolean("off_data", d).apply();
                  return apply(w, d, false);
              }
              static int on(Context c) {
                  SharedPreferences p = Prefs.get(c);
                  return apply(p.getBoolean("off_wifi", false), p.getBoolean("off_data", false), true);
              }
          }

          /** Switches mobile data off on a stable Wi-Fi and back on when Wi-Fi has been gone for a while. */
          final class WifiAuto {
              static final long HOLD_MS = 5 * 60 * 1000L;

              private static boolean dataOn(Context c) {
                  try { return Settings.Global.getInt(c.getContentResolver(), "mobile_data", 1) == 1; }
                  catch (Throwable t) { return true; }
              }

              static synchronized void eval(Context c) {
                  try {
                      SharedPreferences p = Prefs.get(c);
                      boolean mine = p.getBoolean("auto_data_off", false);
                      if (!p.getBoolean("wifi_auto", false)) {
                          if (mine) {
                              if (dataOn(c) || Radio.setData(true) == Radio.OK) p.edit().putBoolean("auto_data_off", false).apply();
                          }
                          return;
                      }
                      // The night schedule has priority.
                      if (p.getBoolean("active", false)) return;
                      long now = System.currentTimeMillis();
                      long conn = p.getLong("wifi_conn_since", 0);
                      long lost = p.getLong("wifi_lost_since", 0);
                      boolean on = dataOn(c);
                      if (conn > 0 && now - conn >= HOLD_MS) {
                          if (on && Radio.setData(false) == Radio.OK) p.edit().putBoolean("auto_data_off", true).apply();
                      } else if (conn == 0 && lost > 0 && now - lost >= HOLD_MS) {
                          if (mine && (on || Radio.setData(true) == Radio.OK)) p.edit().putBoolean("auto_data_off", false).apply();
                      } else if (conn > 0) {
                          Scheduler.schedule(c, 161, conn + HOLD_MS + 2000L);
                      } else if (lost > 0) {
                          Scheduler.schedule(c, 161, lost + HOLD_MS + 2000L);
                      }
                  } catch (Throwable ignored) { }
              }
          }

          final class Scheduler {
              private static final String CHANNEL = "schedule_notice";
              private static final int NOTIFICATION_ID = 1;
              static final long IDLE_MS = 20 * 60 * 1000L;
              static String hhmm(int minutes) { return String.format(Locale.US, "%02d:%02d", minutes / 60, minutes % 60); }

              private static int startFor(SharedPreferences p, int day) {
                  boolean weekend = day == Calendar.SATURDAY || day == Calendar.SUNDAY;
                  return p.getInt(weekend ? "weekend_start" : "weekday_start", 22 * 60);
              }
              private static int endFor(SharedPreferences p, int day) {
                  boolean weekend = day == Calendar.SATURDAY || day == Calendar.SUNDAY;
                  return p.getInt(weekend ? "weekend_end" : "weekday_end", 6 * 60);
              }
              static PendingIntent pending(Context c, int code) {
                  Intent i = new Intent(c, AlarmReceiver.class).setAction("com.example.nightnet.SYNC." + code);
                  return PendingIntent.getBroadcast(c, code, i, PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT);
              }
              private static void cancelAlarms(Context c) {
                  AlarmManager am = c.getSystemService(AlarmManager.class);
                  for (int i = 100; i < 152; i++) am.cancel(pending(c, i));
              }
              static void schedule(Context c, int code, long when) {
                  if (when <= System.currentTimeMillis()) return;
                  AlarmManager am = c.getSystemService(AlarmManager.class);
                  am.setAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, when, pending(c, code));
              }
              private static Calendar at(Calendar base, int minute) {
                  Calendar c = (Calendar) base.clone();
                  c.set(Calendar.HOUR_OF_DAY, minute / 60);
                  c.set(Calendar.MINUTE, minute % 60);
                  c.set(Calendar.SECOND, 0);
                  c.set(Calendar.MILLISECOND, 0);
                  return c;
              }
              private static boolean inWindow(Calendar now, Calendar start, Calendar end) {
                  return !now.before(start) && now.before(end);
              }
              private static void showPreNotice(Context c, SharedPreferences p) {
                  if (!p.getBoolean("notifications", true)) return;
                  NotificationManager nm = c.getSystemService(NotificationManager.class);
                  nm.createNotificationChannel(new NotificationChannel(CHANNEL, "Нагадування розкладу", NotificationManager.IMPORTANCE_DEFAULT));
                  StringBuilder what = new StringBuilder();
                  if (p.getBoolean("wifi", false)) what.append("Wi-Fi");
                  if (p.getBoolean("data", false)) {
                      if (what.length() > 0) what.append(" та ");
                      what.append("мобільні дані");
                  }
                  Notification n = new Notification.Builder(c, CHANNEL)
                          .setSmallIcon(R.drawable.ic_stat)
                          .setContentTitle("За 5 хвилин почнеться розклад")
                          .setContentText("Буде вимкнено: " + what)
                          .setAutoCancel(true)
                          .setTimeoutAfter(5 * 60 * 1000L)
                          .build();
                  nm.notify(NOTIFICATION_ID, n);
              }
              static synchronized void sync(Context c) { sync(c, false); }

              static synchronized void sync(Context c, boolean preNotice) {
                  try {
                      syncCore(c, preNotice);
                  } finally {
                      WifiAuto.eval(c);
                  }
              }

              private static void syncCore(Context c, boolean preNotice) {
                  SharedPreferences p = Prefs.get(c);
                  boolean wifi = p.getBoolean("wifi", false), data = p.getBoolean("data", false);
                  boolean enabled = p.getBoolean("enabled", false) && (wifi || data);
                  NotificationManager nm = c.getSystemService(NotificationManager.class);
                  cancelAlarms(c);
                  if (!enabled) {
                      nm.cancel(NOTIFICATION_ID);
                      if (p.getBoolean("active", false)) {
                          int result = Radio.on(c);
                          if (result == Radio.OK) p.edit().putLong("flip_ts", System.currentTimeMillis()).putBoolean("active", false).apply();
                      }
                      return;
                  }

                  Calendar now = Calendar.getInstance();
                  Calendar activeStart = null;
                  // Check windows starting yesterday or today. The schedule belongs to its start day.
                  for (int back = 1; back >= 0; back--) {
                      Calendar day = (Calendar) now.clone();
                      day.add(Calendar.DAY_OF_YEAR, -back);
                      int startMin = startFor(p, day.get(Calendar.DAY_OF_WEEK));
                      int endMin = endFor(p, day.get(Calendar.DAY_OF_WEEK));
                      if (startMin == endMin) continue;
                      Calendar st = at(day, startMin);
                      Calendar en = at(day, endMin);
                      if (endMin <= startMin) en.add(Calendar.DAY_OF_YEAR, 1);
                      if (inWindow(now, st, en)) { activeStart = st; break; }
                  }

                  // The schedule only runs while the phone is not in use: locked for at least IDLE_MS.
                  long nowMs = now.getTimeInMillis();
                  PowerManager pm = c.getSystemService(PowerManager.class);
                  KeyguardManager km = c.getSystemService(KeyguardManager.class);
                  boolean inUse = pm != null && km != null && pm.isInteractive() && !km.isKeyguardLocked();
                  long idleSince = p.getLong("idle_since", 0);
                  if (inUse) {
                      if (idleSince != 0) { p.edit().putLong("idle_since", 0).apply(); idleSince = 0; }
                  } else if (idleSince == 0) {
                      idleSince = nowMs;
                      p.edit().putLong("idle_since", nowMs).apply();
                  }
                  boolean idleOk = !inUse && idleSince > 0 && nowMs - idleSince >= IDLE_MS;
                  boolean want = activeStart != null && idleOk;

                  boolean active = p.getBoolean("active", false);
                  boolean was = active;
                  if (want && !active) {
                      int result = Radio.off(c);
                      if (result == Radio.OK) active = true;
                  } else if (!want && active) {
                      int result = Radio.on(c);
                      if (result == Radio.OK) active = false;
                  }
                  if (active != was) p.edit().putLong("flip_ts", nowMs).apply();
                  p.edit().putBoolean("active", active).apply();

                  boolean notif = p.getBoolean("notifications", true);
                  if (preNotice && activeStart == null && notif) showPreNotice(c, p);
                  if (activeStart != null || !preNotice || !notif) nm.cancel(NOTIFICATION_ID);

                  // Inside the window, wait for 20 idle minutes.
                  if (activeStart != null && !idleOk && !inUse && idleSince > 0) schedule(c, 150, idleSince + IDLE_MS);

                  // Schedule pre-start, start and end alarms for the next 8 calendar days.
                  for (int offset = 0; offset < 8; offset++) {
                      Calendar day = (Calendar) now.clone();
                      day.add(Calendar.DAY_OF_YEAR, offset);
                      int startMin = startFor(p, day.get(Calendar.DAY_OF_WEEK));
                      int endMin = endFor(p, day.get(Calendar.DAY_OF_WEEK));
                      if (startMin == endMin) continue;
                      Calendar st = at(day, startMin);
                      Calendar en = at(day, endMin);
                      if (endMin <= startMin) en.add(Calendar.DAY_OF_YEAR, 1);
                      int base = 100 + offset * 3;
                      Calendar pre = (Calendar) st.clone();
                      pre.add(Calendar.MINUTE, -5);
                      if (pre.after(now)) schedule(c, base, pre.getTimeInMillis());
                      if (st.after(now)) schedule(c, base + 1, st.getTimeInMillis());
                      if (en.after(now)) schedule(c, base + 2, en.getTimeInMillis());
                  }
              }
          }
          EOF

          cat > src/main/java/com/example/nightnet/Store.java <<'EOF'
          package com.example.nightnet;

          import android.content.ContentValues;
          import android.content.Context;
          import android.database.Cursor;
          import android.database.sqlite.SQLiteDatabase;
          import android.database.sqlite.SQLiteOpenHelper;
          import java.io.ByteArrayInputStream;
          import java.io.ByteArrayOutputStream;
          import java.util.ArrayList;
          import java.util.List;
          import java.util.zip.GZIPInputStream;
          import java.util.zip.GZIPOutputStream;
          import org.json.JSONObject;

          final class Sess {
              long id, st, en, el, up, snapA, snapB;
              int stLvl, enLvl;
              long stCc, enCc;
              boolean sched;
              long durMs() { return en - st; }
              double deepPct() {
                  if (el <= 0) return 0;
                  double d = 100.0 * (el - up) / el;
                  return Math.max(0, Math.min(100, d));
              }
              int drop() { return stLvl - enLvl; }
              double perHour() {
                  double h = durMs() / 3600000.0;
                  return h <= 0 ? 0 : drop() / h;
              }
              double mah() {
                  if (stCc > 0 && enCc > 0 && stCc >= enCc) return (stCc - enCc) / 1000.0;
                  return -1;
              }
          }

          final class SnapRow {
              long ts, el, up, cc;
              int level;
              boolean charging;
              Snap data;
          }

          final class Db extends SQLiteOpenHelper {
              private static Db inst;

              static synchronized Db get(Context c) {
                  if (inst == null) inst = new Db(c.getApplicationContext());
                  return inst;
              }

              private Db(Context c) { super(c, "battery.db", null, 1); }

              @Override public void onCreate(SQLiteDatabase d) {
                  d.execSQL("CREATE TABLE snaps(ts INTEGER PRIMARY KEY, level INTEGER, cc INTEGER, el INTEGER, up INTEGER, charging INTEGER, data BLOB)");
                  d.execSQL("CREATE TABLE sess(id INTEGER PRIMARY KEY AUTOINCREMENT, st INTEGER, en INTEGER, st_lvl INTEGER, en_lvl INTEGER, st_cc INTEGER, en_cc INTEGER, el_ms INTEGER, up_ms INTEGER, sched INTEGER, snap_a INTEGER, snap_b INTEGER)");
              }

              @Override public void onUpgrade(SQLiteDatabase d, int o, int n) { }

              private static byte[] pack(Snap s) {
                  if (s == null) return null;
                  try {
                      ByteArrayOutputStream bo = new ByteArrayOutputStream();
                      GZIPOutputStream g = new GZIPOutputStream(bo);
                      g.write(s.toJson().toString().getBytes("UTF-8"));
                      g.close();
                      return bo.toByteArray();
                  } catch (Throwable t) { return null; }
              }

              private static Snap unpack(byte[] b) {
                  if (b == null) return null;
                  try {
                      GZIPInputStream gi = new GZIPInputStream(new ByteArrayInputStream(b));
                      ByteArrayOutputStream bo = new ByteArrayOutputStream();
                      byte[] buf = new byte[8192];
                      int n;
                      while ((n = gi.read(buf)) > 0) bo.write(buf, 0, n);
                      gi.close();
                      return Snap.fromJson(new JSONObject(bo.toString("UTF-8")));
                  } catch (Throwable t) { return null; }
              }

              synchronized void putSnap(SnapRow r) {
                  ContentValues v = new ContentValues();
                  v.put("ts", r.ts);
                  v.put("level", r.level);
                  v.put("cc", r.cc);
                  v.put("el", r.el);
                  v.put("up", r.up);
                  v.put("charging", r.charging ? 1 : 0);
                  byte[] blob = pack(r.data);
                  if (blob != null) v.put("data", blob);
                  getWritableDatabase().insertWithOnConflict("snaps", null, v, SQLiteDatabase.CONFLICT_REPLACE);
              }

              private static SnapRow snapOf(Cursor c) {
                  SnapRow r = new SnapRow();
                  r.ts = c.getLong(0);
                  r.level = c.getInt(1);
                  r.cc = c.getLong(2);
                  r.el = c.getLong(3);
                  r.up = c.getLong(4);
                  r.charging = c.getInt(5) != 0;
                  r.data = c.isNull(6) ? null : unpack(c.getBlob(6));
                  return r;
              }

              private SnapRow oneSnap(String where, long arg, String order) {
                  Cursor c = getReadableDatabase().rawQuery(
                          "SELECT ts,level,cc,el,up,charging,data FROM snaps WHERE " + where + " ORDER BY " + order + " LIMIT 1",
                          new String[]{String.valueOf(arg)});
                  try {
                      if (!c.moveToFirst()) return null;
                      return snapOf(c);
                  } finally { c.close(); }
              }

              long lastSnapTs() {
                  Cursor c = getReadableDatabase().rawQuery("SELECT MAX(ts) FROM snaps WHERE data IS NOT NULL", null);
                  try {
                      return c.moveToFirst() && !c.isNull(0) ? c.getLong(0) : 0;
                  } finally { c.close(); }
              }

              SnapRow snapAt(long ts) { return oneSnap("ts=?", ts, "ts ASC"); }

              SnapRow nearest(long ts) {
                  SnapRow before = oneSnap("ts<=? AND data IS NOT NULL", ts, "ts DESC");
                  SnapRow after = oneSnap("ts>=? AND data IS NOT NULL", ts, "ts ASC");
                  if (before == null) return after;
                  if (after == null) return before;
                  return (ts - before.ts) <= (after.ts - ts) ? before : after;
              }

              boolean chargedBetween(long a, long b) {
                  Cursor c = getReadableDatabase().rawQuery("SELECT COUNT(*) FROM snaps WHERE ts BETWEEN ? AND ? AND charging=1",
                          new String[]{String.valueOf(a), String.valueOf(b)});
                  try {
                      return c.moveToFirst() && c.getInt(0) > 0;
                  } finally { c.close(); }
              }

              List<long[]> levels(long from, long to) {
                  List<long[]> out = new ArrayList<>();
                  Cursor c = getReadableDatabase().rawQuery("SELECT ts,level FROM snaps WHERE ts BETWEEN ? AND ? ORDER BY ts",
                          new String[]{String.valueOf(from), String.valueOf(to)});
                  try {
                      while (c.moveToNext()) out.add(new long[]{c.getLong(0), c.getLong(1)});
                  } finally { c.close(); }
                  return out;
              }

              synchronized long putSession(Sess s) {
                  ContentValues v = new ContentValues();
                  v.put("st", s.st);
                  v.put("en", s.en);
                  v.put("st_lvl", s.stLvl);
                  v.put("en_lvl", s.enLvl);
                  v.put("st_cc", s.stCc);
                  v.put("en_cc", s.enCc);
                  v.put("el_ms", s.el);
                  v.put("up_ms", s.up);
                  v.put("sched", s.sched ? 1 : 0);
                  v.put("snap_a", s.snapA);
                  v.put("snap_b", s.snapB);
                  return getWritableDatabase().insert("sess", null, v);
              }

              private static final String SESS_COLS = "id,st,en,st_lvl,en_lvl,st_cc,en_cc,el_ms,up_ms,sched,snap_a,snap_b";

              private static Sess sessOf(Cursor c) {
                  Sess s = new Sess();
                  s.id = c.getLong(0);
                  s.st = c.getLong(1);
                  s.en = c.getLong(2);
                  s.stLvl = c.getInt(3);
                  s.enLvl = c.getInt(4);
                  s.stCc = c.getLong(5);
                  s.enCc = c.getLong(6);
                  s.el = c.getLong(7);
                  s.up = c.getLong(8);
                  s.sched = c.getInt(9) != 0;
                  s.snapA = c.getLong(10);
                  s.snapB = c.getLong(11);
                  return s;
              }

              List<Sess> sessions(long from, long to, int limit) {
                  List<Sess> out = new ArrayList<>();
                  Cursor c = getReadableDatabase().rawQuery(
                          "SELECT " + SESS_COLS + " FROM sess WHERE en>=? AND st<=? ORDER BY st DESC LIMIT " + limit,
                          new String[]{String.valueOf(from), String.valueOf(to)});
                  try {
                      while (c.moveToNext()) out.add(sessOf(c));
                  } finally { c.close(); }
                  return out;
              }

              Sess session(long id) {
                  Cursor c = getReadableDatabase().rawQuery("SELECT " + SESS_COLS + " FROM sess WHERE id=?", new String[]{String.valueOf(id)});
                  try {
                      return c.moveToFirst() ? sessOf(c) : null;
                  } finally { c.close(); }
              }

              synchronized void prune(long before) {
                  SQLiteDatabase d = getWritableDatabase();
                  d.delete("snaps", "ts<?", new String[]{String.valueOf(before)});
                  d.delete("sess", "en<?", new String[]{String.valueOf(before)});
              }

              synchronized void clear() {
                  SQLiteDatabase d = getWritableDatabase();
                  d.delete("snaps", null, null);
                  d.delete("sess", null, null);
              }

              int[] counts() {
                  int[] r = new int[2];
                  SQLiteDatabase d = getReadableDatabase();
                  Cursor c = d.rawQuery("SELECT COUNT(*) FROM snaps", null);
                  try { if (c.moveToFirst()) r[0] = c.getInt(0); } finally { c.close(); }
                  c = d.rawQuery("SELECT COUNT(*) FROM sess", null);
                  try { if (c.moveToFirst()) r[1] = c.getInt(0); } finally { c.close(); }
                  return r;
              }
          }
