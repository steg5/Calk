          package com.example.nightnet;

          import android.content.Context;
          import android.content.pm.PackageManager;
          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.Comparator;
          import java.util.HashMap;
          import java.util.List;
          import java.util.Map;
          import java.util.regex.Matcher;
          import java.util.regex.Pattern;

          /** Difference of two snapshots: who drained the battery and who kept the phone awake. */
          final class Detail {
              static final class Row {
                  String key;
                  String sub;
                  double v;
                  long ms;
                  long cnt;
              }

              final List<Row> apps = new ArrayList<>();
              final List<Row> wake = new ArrayList<>();
              final List<Row> kernel = new ArrayList<>();
              final List<Row> reasons = new ArrayList<>();
              double totalMah;
              boolean reset;
              boolean charged;
              long fromTs, toTs;
              int fromLvl, toLvl;
              String note;

              private static final Comparator<Row> BY_TIME = (x, y) -> {
                  if (x.ms != y.ms) return Long.compare(y.ms, x.ms);
                  return Long.compare(y.cnt, x.cnt);
              };
              private static final Comparator<Row> BY_COUNT = (x, y) -> {
                  if (x.cnt != y.cnt) return Long.compare(y.cnt, x.cnt);
                  return Long.compare(y.ms, x.ms);
              };

              private static void diffMap(Map<String, long[]> a, Map<String, long[]> b, List<Row> out, Detail d, boolean split) {
                  for (Map.Entry<String, long[]> e : b.entrySet()) {
                      long[] pb = e.getValue();
                      long[] pa = a.get(e.getKey());
                      long ms = pb[0] - (pa == null ? 0 : pa[0]);
                      long cnt = pb[1] - (pa == null ? 0 : pa[1]);
                      if (ms < 0 || cnt < 0) {
                          d.reset = true;
                          continue;
                      }
                      if (ms <= 0 && cnt <= 0) continue;
                      Row r = new Row();
                      String key = e.getKey();
                      if (split) {
                          int i = key.indexOf('|');
                          if (i > 0) {
                              r.key = key.substring(0, i);
                              r.sub = key.substring(i + 1);
                          } else {
                              r.key = key;
                          }
                      } else {
                          r.key = key;
                      }
                      r.ms = ms;
                      r.cnt = cnt;
                      out.add(r);
                  }
              }

              static Detail diff(Snap a, Snap b) {
                  Detail d = new Detail();
                  for (Map.Entry<String, Double> e : b.power.entrySet()) {
                      Double prev = a.power.get(e.getKey());
                      double v = e.getValue() - (prev == null ? 0 : prev);
                      if (v < -0.05) {
                          d.reset = true;
                          continue;
                      }
                      if (v > 0.001) {
                          Row r = new Row();
                          r.key = e.getKey();
                          r.v = v;
                          d.apps.add(r);
                          d.totalMah += v;
                      }
                  }
                  diffMap(a.wake, b.wake, d.wake, d, true);
                  diffMap(a.kernel, b.kernel, d.kernel, d, false);
                  diffMap(a.reasons, b.reasons, d.reasons, d, false);
                  Collections.sort(d.apps, (x, y) -> Double.compare(y.v, x.v));
                  Collections.sort(d.wake, BY_TIME);
                  Collections.sort(d.kernel, BY_TIME);
                  Collections.sort(d.reasons, BY_COUNT);
                  return d;
              }

              static Detail forSession(Context c, Sess s) {
                  if (s.snapA <= 0 || s.snapB <= 0) return null;
                  Db db = Db.get(c);
                  SnapRow a = db.snapAt(s.snapA);
                  SnapRow b = db.snapAt(s.snapB);
                  if (a == null || b == null || a.data == null || b.data == null) return null;
                  Detail d = diff(a.data, b.data);
                  d.fromTs = a.ts;
                  d.toTs = b.ts;
                  d.fromLvl = a.level;
                  d.toLvl = b.level;
                  return d;
              }

              /** Must be called from a background thread: may take a live snapshot. */
              static Detail forRange(Context c, long from, long to) {
                  Db db = Db.get(c);
                  long now = System.currentTimeMillis();
                  if (to >= now - 120000L) Snapper.ensure(c, 20000L);
                  SnapRow a = db.nearest(from);
                  SnapRow b = db.nearest(Math.min(to, now));
                  Detail d;
                  if (a == null || b == null || a.data == null || b.data == null || a.ts >= b.ts) {
                      d = new Detail();
                      d.note = "У цьому проміжку немає двох знімків статистики. Знімки робляться при кожному вимкненні екрана і розблокуванні, тож дані з'являться після першого використання телефона з увімкненим моніторингом.";
                      return d;
                  }
                  d = diff(a.data, b.data);
                  d.fromTs = a.ts;
                  d.toTs = b.ts;
                  d.fromLvl = a.level;
                  d.toLvl = b.level;
                  d.charged = db.chargedBetween(a.ts, b.ts);
                  if (Math.abs(a.ts - from) > 20 * 60000L || Math.abs(b.ts - to) > 20 * 60000L) {
                      d.note = "Межі зсунуто до найближчих знімків статистики (вони робляться при вимкненні екрана і розблокуванні).";
                  }
                  return d;
              }
          }

          final class Names {
              private static final HashMap<String, String> cache = new HashMap<>();
              private static final Pattern APP = Pattern.compile("^u(\\d+)a(\\d+)$");

              static synchronized String label(Context c, String key) {
                  String v = cache.get(key);
                  if (v != null) return v;
                  v = resolve(c, key);
                  cache.put(key, v);
                  return v;
              }

              private static String component(String n) {
                  switch (n) {
                      case "Screen": return "Екран";
                      case "Idle": return "Стан очікування (idle)";
                      case "Cell standby": return "Мобільна мережа (очікування)";
                      case "Mobile radio": return "Мобільний радіомодуль";
                      case "Cell": return "Мобільна мережа";
                      case "Wifi": return "Wi‑Fi";
                      case "Bluetooth": return "Bluetooth";
                      case "Phone calls": return "Дзвінки";
                      case "Camera": return "Камера";
                      case "Flashlight": return "Ліхтарик";
                      case "Over-counted": return "Перерахунок (over-counted)";
                      case "Unaccounted": return "Не віднесено (unaccounted)";
                      default: return n;
                  }
              }

              private static String resolve(Context c, String key) {
                  if (key.startsWith("#")) return component(key.substring(1));
                  int uid;
                  Matcher m = APP.matcher(key);
                  if (m.matches()) {
                      uid = Integer.parseInt(m.group(1)) * 100000 + 10000 + Integer.parseInt(m.group(2));
                  } else {
                      try {
                          uid = Integer.parseInt(key);
                      } catch (NumberFormatException e) {
                          return key;
                      }
                  }
                  if (uid == 0) return "Ядро Android (root)";
                  if (uid == 1000) return "Система Android (system)";
                  if (uid == 1001) return "Радіомодуль / телефонія";
                  if (uid == 2000) return "Shell (adb / Shizuku)";
                  try {
                      PackageManager pm = c.getPackageManager();
                      String[] pk = pm.getPackagesForUid(uid);
                      if (pk != null && pk.length > 0) {
                          String name = pm.getApplicationLabel(pm.getApplicationInfo(pk[0], 0)).toString();
                          return pk.length > 1 ? name + " (+" + (pk.length - 1) + ")" : name;
                      }
                  } catch (Throwable ignored) { }
                  return uid < 10000 ? "Системний процес (uid " + uid + ")" : key;
              }
          }
