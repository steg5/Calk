name: Car probe

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Write project
        run: |
          mkdir -p app/src/main/java/com/example/carprobe

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'CarProbe'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=false
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.example.carprobe'
              compileSdk 34
              defaultConfig {
                  applicationId "com.example.carprobe"
                  minSdk 21
                  targetSdk 26
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
              lint {
                  abortOnError false
                  checkReleaseBuilds false
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="com.tw.carinfoservice.permission.USE_AIDL"/>
              <application
                  android:label="CarProbe"
                  android:allowBackup="false">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/example/carprobe/MainActivity.java <<'EOF'
          package com.example.carprobe;

          import android.app.Activity;
          import android.content.ClipData;
          import android.content.ClipboardManager;
          import android.content.ComponentName;
          import android.content.Context;
          import android.content.Intent;
          import android.content.ServiceConnection;
          import android.graphics.Typeface;
          import android.os.Bundle;
          import android.os.IBinder;
          import android.os.Parcel;
          import android.view.View;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import android.widget.Toast;

          import java.util.Arrays;

          public class MainActivity extends Activity {

              static final String DESC = "com.tw.carinfoservice.CarServiceAidl";
              static final String ACTION = "com.tw.carinfoservice.CarService.Bind";
              static final String PKG = "com.tw.carinfoservice";

              // transaction code = 4 + index (1 register, 2 unregister, 3 requestData)
              static final int FIRST = 4;
              static final String[][] ITEMS = {
                  {"ElectricVoltage", "f"},
                  {"Headlight", "i"},
                  {"DrivingTime", "i"},
                  {"TotalMileage", "I"},
                  {"RechargeMileage", "I"},
                  {"AvgFuel", "f"},
                  {"InstantFuel", "f"},
                  {"Gear", "i"},
                  {"MainSeatBelt", "i"},
                  {"CoPilotSeatBelt", "i"},
                  {"Handbrake", "i"},
                  {"LeftTurn", "i"},
                  {"RightTurn", "i"},
                  {"DoubleFlash", "i"},
                  {"Speed", "I"},
                  {"EngineRPM", "i"},
                  {"WaterTemp", "F"},
                  {"AmbientTemp", "F"},
                  {"OilTemp", "F"},
                  {"OilVolume", "f"},
                  {"Electricity", "f"},
                  {"Charging", "i"},
                  {"VoltageWarning", "i"},
                  {"CarReverse", "i"},
                  {"Door", "i"},
                  {"OriginalCarVoltage", "f"},
                  {"TransTemp", "f"},
                  {"IntakeTemp", "f"},
                  {"IntakePressure", "f"},
                  {"Turbocharged", "i"},
                  {"DrivingMode", "i"},
                  {"OffSign", "i"},
                  {"OnSign", "i"},
                  {"TirePressure", "F"},
                  {"Throttle", "i"},
                  {"SteeringAngle", "i"}
              };

              TextView tv;
              volatile IBinder svc;
              volatile boolean running;

              ServiceConnection conn = new ServiceConnection() {
                  @Override
                  public void onServiceConnected(ComponentName name, IBinder service) {
                      svc = service;
                      startLoop();
                  }

                  @Override
                  public void onServiceDisconnected(ComponentName name) {
                      svc = null;
                      running = false;
                      show("Service disconnected");
                  }
              };

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(16, 16, 16, 16);

                  Button copy = new Button(this);
                  copy.setText("Копіювати");
                  copy.setOnClickListener(new View.OnClickListener() {
                      @Override
                      public void onClick(View v) {
                          ClipboardManager cm = (ClipboardManager) getSystemService(Context.CLIPBOARD_SERVICE);
                          cm.setPrimaryClip(ClipData.newPlainText("car", tv.getText()));
                          Toast.makeText(MainActivity.this, "Скопійовано", Toast.LENGTH_SHORT).show();
                      }
                  });
                  root.addView(copy);

                  ScrollView sv = new ScrollView(this);
                  tv = new TextView(this);
                  tv.setTypeface(Typeface.MONOSPACE);
                  tv.setTextSize(15);
                  tv.setText("Підключення...");
                  sv.addView(tv);
                  root.addView(sv);
                  setContentView(root);

                  try {
                      Intent i = new Intent(ACTION);
                      i.setPackage(PKG);
                      boolean ok = bindService(i, conn, Context.BIND_AUTO_CREATE);
                      if (!ok) {
                          tv.setText("bindService повернув false (сервіс не знайдено або немає доступу)");
                      }
                  } catch (Throwable t) {
                      tv.setText("bind ERR: " + t);
                  }
              }

              void show(final String s) {
                  runOnUiThread(new Runnable() {
                      @Override
                      public void run() {
                          tv.setText(s);
                      }
                  });
              }

              void startLoop() {
                  if (running) return;
                  running = true;
                  new Thread(new Runnable() {
                      @Override
                      public void run() {
                          while (running && svc != null) {
                              poll();
                              try {
                                  Thread.sleep(1000);
                              } catch (InterruptedException e) {
                                  return;
                              }
                          }
                      }
                  }).start();
              }

              static Parcel call(IBinder b, int code) throws Exception {
                  Parcel d = Parcel.obtain();
                  Parcel r = Parcel.obtain();
                  try {
                      d.writeInterfaceToken(DESC);
                      b.transact(code, d, r, 0);
                      r.readException();
                      return r;
                  } catch (Exception e) {
                      r.recycle();
                      throw e;
                  } finally {
                      d.recycle();
                  }
              }

              void poll() {
                  IBinder b = svc;
                  if (b == null) return;
                  StringBuilder sb = new StringBuilder();
                  try {
                      call(b, 3).recycle();
                  } catch (Exception e) {
                      sb.append("requestData: ERR ").append(e).append("\n");
                  }
                  for (int k = 0; k < ITEMS.length; k++) {
                      String name = ITEMS[k][0];
                      char type = ITEMS[k][1].charAt(0);
                      try {
                          Parcel r = call(b, FIRST + k);
                          String v;
                          if (type == 'i') v = String.valueOf(r.readInt());
                          else if (type == 'f') v = String.valueOf(r.readFloat());
                          else if (type == 'I') v = Arrays.toString(r.createIntArray());
                          else v = Arrays.toString(r.createFloatArray());
                          r.recycle();
                          sb.append(name).append(": ").append(v).append("\n");
                      } catch (Exception e) {
                          sb.append(name).append(": ERR ").append(e).append("\n");
                      }
                  }
                  show(sb.toString());
              }

              @Override
              protected void onDestroy() {
                  running = false;
                  try {
                      unbindService(conn);
                  } catch (Throwable ignored) {
                  }
                  super.onDestroy();
              }
          }
          EOF

      - name: Build
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: CarProbe
          path: app/build/outputs/apk/debug/app-debug.apk
