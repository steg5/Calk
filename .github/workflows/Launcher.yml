              static final String[] BSN = {"Звичайний", "Градієнт вертикальний", "Градієнт до акценту", "Градієнт горизонтальний", "Світіння", "Скло", "Лише контур"};

              int mixC(int a, int b, float t) {
                  int r = Math.round(((a >> 16) & 255) * (1 - t) + ((b >> 16) & 255) * t);
                  int g = Math.round(((a >> 8) & 255) * (1 - t) + ((b >> 8) & 255) * t);
                  int bl = Math.round((a & 255) * (1 - t) + (b & 255) * t);
                  return (r << 16) | (g << 8) | bl;
              }

              int withA(int rgb, int al) {
                  return (al << 24) | (rgb & 0xFFFFFF);
              }

              GradientDrawable blockBg(float r) {
                  return blockBg(r, CARD);
              }

              GradientDrawable blockBg(float r, int base) {
                  int st = sp.getInt("bstyle", 0);
                  int ca = base >>> 24, cr = base & 0xFFFFFF;
                  GradientDrawable g = new GradientDrawable();
                  g.setCornerRadius(px(r));
                  switch (st) {
                      case 1:
                          g.setOrientation(GradientDrawable.Orientation.TOP_BOTTOM);
                          g.setColors(new int[]{withA(mixC(cr, 0xFFFFFF, 0.14f), ca), withA(mixC(cr, 0x000000, 0.30f), ca)});
                          break;
                      case 2:
                          g.setOrientation(GradientDrawable.Orientation.TL_BR);
                          g.setColors(new int[]{withA(mixC(cr, ACC, 0.45f), ca), withA(mixC(cr, 0x000000, 0.2f), ca)});
                          break;
                      case 3:
                          g.setOrientation(GradientDrawable.Orientation.LEFT_RIGHT);
                          g.setColors(new int[]{withA(mixC(cr, ACC, 0.38f), ca), withA(cr, ca)});
                          break;
                      case 4:
                          g.setGradientType(GradientDrawable.RADIAL_GRADIENT);
                          g.setGradientRadius(px(420));
                          g.setColors(new int[]{withA(mixC(cr, ACC, 0.42f), ca), withA(cr, ca)});
                          break;
                      case 5:
                          g.setColor(withA(TXT, Math.round(ca * 0.3f)));
                          break;
                      case 6:
                          g.setColor(withA(cr, Math.round(ca * 0.2f)));
                          g.setStroke(px(2), withA(ACC, 0xDD));
                          break;
                      default:
                          g.setColor(base);
                  }
                  return g;
              }

