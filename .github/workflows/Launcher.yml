name: Launcher

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/Launcher.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Write project
        run: |
          mkdir -p app/src/main/java/com/example/launcher app/src/main/res/drawable

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'Launcher'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=false
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.example.launcher'
              compileSdk 34
              defaultConfig {
                  applicationId "com.example.launcher"
                  minSdk 23
                  targetSdk 26
                  versionCode 4
                  versionName "1.3"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
              lint {
                  abortOnError false
                  checkReleaseBuilds false
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>
              <uses-permission android:name="android.permission.WRITE_SETTINGS"/>
              <application
                  android:label="Лаунчер"
                  android:icon="@drawable/ic_launcher"
                  android:allowBackup="false"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:screenOrientation="sensorLandscape"
                      android:configChanges="orientation|screenSize|keyboardHidden|screenLayout|density">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.HOME"/>
                          <category android:name="android.intent.category.DEFAULT"/>
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".MediaListener"
                      android:label="Лаунчер"
                      android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.service.notification.NotificationListenerService"/>
                      </intent-filter>
                  </service>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/example/launcher/MainActivity.java <<'EOF'
          package com.example.launcher;

          import android.Manifest;
          import android.app.Activity;
          import android.app.ActivityOptions;
          import android.app.AlertDialog;
          import android.content.ComponentName;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.PackageManager;
          import android.content.pm.ResolveInfo;
          import android.graphics.Bitmap;
          import android.graphics.BitmapFactory;
          import android.graphics.Canvas;
          import android.graphics.Paint;
          import android.graphics.RectF;
          import android.graphics.SurfaceTexture;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.hardware.display.DisplayManager;
          import android.hardware.display.VirtualDisplay;
          import android.location.GpsSatellite;
          import android.location.GpsStatus;
          import android.location.Location;
          import android.location.LocationListener;
          import android.location.LocationManager;
          import android.media.AudioManager;
          import android.media.MediaMetadata;
          import android.media.session.MediaController;
          import android.media.session.MediaSessionManager;
          import android.media.session.PlaybackState;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.provider.Settings;
          import android.util.TypedValue;
          import android.view.Gravity;
          import android.view.KeyEvent;
          import android.view.Surface;
          import android.view.TextureView;
          import android.view.View;
          import android.widget.Button;
          import android.widget.FrameLayout;
          import android.widget.HorizontalScrollView;
          import android.widget.ImageView;
          import android.widget.LinearLayout;
          import android.widget.SeekBar;
          import android.widget.TextView;
          import android.widget.Toast;

          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.lang.reflect.Method;
          import java.text.SimpleDateFormat;
          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.Comparator;
          import java.util.Date;
          import java.util.List;
          import java.util.Locale;

          public class MainActivity extends Activity implements Tuner.Listener {
              int ACC, TXT, DIM, CARD, BTN, BG1, BG2, OV;
              static final String[] THN = {"Синя ніч", "Графіт", "Смарагд", "Бурштин", "Пурпур", "Червона", "Океан", "Ліс", "Світла", "Чорна"};
              // bg1, bg2, акцент, плитка, кнопка, текст, дим. текст, затемнення фону
              static final int[][] TH = {
                      {0xFF12335C, 0xFF0A1424, 0xFF4FC3F7, 0xB3101A28, 0xFF2A3A52, 0xFFF1F5F9, 0xFFA9B8CC, 0x55000000},
                      {0xFF2B2F36, 0xFF111316, 0xFFB0BEC5, 0xB3181A1E, 0xFF343942, 0xFFF1F5F9, 0xFFA9B0B8, 0x55000000},
                      {0xFF0F3D33, 0xFF071A16, 0xFF4DD6A8, 0xB30D211C, 0xFF1F4A3F, 0xFFF1F5F9, 0xFF9CBFB4, 0x55000000},
                      {0xFF4A3010, 0xFF1A1006, 0xFFFFB74D, 0xB3231708, 0xFF4F3A1B, 0xFFF8F1E7, 0xFFC4B29A, 0x55000000},
                      {0xFF3A1F5C, 0xFF150B26, 0xFFCE93D8, 0xB31F1030, 0xFF40295E, 0xFFF4EEF8, 0xFFB7A6C9, 0x55000000},
                      {0xFF4A1218, 0xFF1A0709, 0xFFFF8A80, 0xB3260B0F, 0xFF52232A, 0xFFF8EDEE, 0xFFC9A3A7, 0x55000000},
                      {0xFF0B4F6C, 0xFF05202B, 0xFF4DD0E1, 0xB30A2A38, 0xFF16627F, 0xFFEFF9FC, 0xFF9CC4D0, 0x55000000},
                      {0xFF2E4A1E, 0xFF111C0B, 0xFFAED581, 0xB3172410, 0xFF3A5A2A, 0xFFF3F8EE, 0xFFB0C4A0, 0x55000000},
                      {0xFFDCE6F2, 0xFFB8C7DB, 0xFF1565C0, 0xCCFFFFFF, 0xFFC9D6E6, 0xFF1B2733, 0xFF4F6075, 0x00000000},
                      {0xFF000000, 0xFF000000, 0xFFFFFFFF, 0xCC121212, 0xFF262626, 0xFFF1F1F1, 0xFF9A9A9A, 0x00000000}};

              void applyTheme() {
                  int[] t = TH[Math.min(TH.length - 1, Math.max(0, sp.getInt("theme", 0)))];
                  BG1 = t[0];
                  BG2 = t[1];
                  ACC = t[2];
                  CARD = t[3];
                  BTN = t[4];
                  TXT = t[5];
                  DIM = t[6];
                  OV = t[7];
              }

              final Handler ui = new Handler(Looper.getMainLooper());
              SharedPreferences sp;
              PackageManager pm;
              Tuner tuner;
              LocationManager lm;
              boolean ready = false;
              float u = 1f;

              // GPS і поїздка
              long lastFix = 0, lastLoc = 0;
              int satUsed = 0, satTotal = 0;
              float maxKmh = 0, distKm = 0, movH = 0;
              long lastSave = 0;

              ImageView bg;
              TextView tvClock, tvDate, tvSpeed, tvAvg, tvMax, tvSats, tvStation, tvFreq, tvTrack, tvArtist, navNote;
              Button dayNight, rPlay, aPlay;
              ImageView cover, navIcon;
              LinearLayout appsRow;
              boolean radioOn = true, needAccess = false;

              // вікно навігації
              TextureView navView;
              Surface navSurface;
              VirtualDisplay navVd;
              boolean navFailed = false;
              int navW = 0, navH = 0;

              // медіа
              MediaController ctl;

              static final String[] FN = {"Звичайний", "Тонкий", "Середній", "Вузький", "З засічками", "Моноширинний", "Рукописний"};
              static final String[] FF = {"sans-serif", "sans-serif-light", "sans-serif-medium", "sans-serif-condensed", "serif", "monospace", "casual"};

              Typeface tf(boolean bold) {
                  int i = Math.min(FF.length - 1, Math.max(0, sp.getInt("font", 0)));
                  return Typeface.create(FF[i], bold ? Typeface.BOLD : Typeface.NORMAL);
              }

              void fontMenu() {
                  new AlertDialog.Builder(this).setTitle("Шрифт")
                          .setSingleChoiceItems(FN, sp.getInt("font", 0), (d, i) -> {
                              sp.edit().putInt("font", i).apply();
                              d.dismiss();
                              recreate();
                          }).show();
              }

              int px(float v) {
                  return Math.round(v * u);
              }

              TextView text(String s, float size, int color, boolean bold) {
                  TextView t = new TextView(this);
                  t.setText(s);
                  t.setTextColor(color);
                  t.setTextSize(TypedValue.COMPLEX_UNIT_PX, size * u);
                  t.setTypeface(tf(bold));
                  return t;
              }

              GradientDrawable rounded(int color, float r) {
                  GradientDrawable g = new GradientDrawable();
                  g.setColor(color);
                  g.setCornerRadius(px(r));
                  return g;
              }

              Button btn(String s, float size) {
                  Button b = new Button(this);
                  b.setText(s);
                  b.setAllCaps(false);
                  b.setTypeface(tf(false));
                  b.setTextColor(TXT);
                  b.setTextSize(TypedValue.COMPLEX_UNIT_PX, size * u);
                  b.setBackground(rounded(BTN, 16));
                  b.setPadding(0, 0, 0, 0);
                  b.setMinWidth(0);
                  b.setMinimumWidth(0);
                  b.setMinHeight(0);
                  b.setMinimumHeight(0);
                  return b;
              }

              LinearLayout.LayoutParams lp(float w, float h, float weight) {
                  return new LinearLayout.LayoutParams(w < 0 ? (int) w : px(w), h < 0 ? (int) h : px(h), weight);
              }

              LinearLayout card(int orientation) {
                  LinearLayout c = new LinearLayout(this);
                  c.setOrientation(orientation);
                  c.setBackground(rounded(CARD, 24));
                  return c;
              }

              /** Іконка супутника, намальована кодом. */
              class SatView extends View {
                  final Paint p = new Paint(Paint.ANTI_ALIAS_FLAG);

                  SatView(Context c) {
                      super(c);
                  }

                  @Override
                  protected void onDraw(Canvas cv) {
                      float w = getWidth(), h = getHeight(), s = Math.min(w, h);
                      p.setColor(ACC);
                      p.setStyle(Paint.Style.FILL);
                      cv.save();
                      cv.translate(w / 2, h / 2);
                      cv.rotate(-40);
                      cv.drawRoundRect(new RectF(-s * 0.14f, -s * 0.14f, s * 0.14f, s * 0.14f), s * 0.04f, s * 0.04f, p);
                      cv.drawRect(-s * 0.46f, -s * 0.10f, -s * 0.20f, s * 0.10f, p);
                      cv.drawRect(s * 0.20f, -s * 0.10f, s * 0.46f, s * 0.10f, p);
                      p.setStyle(Paint.Style.STROKE);
                      p.setStrokeWidth(s * 0.05f);
                      cv.drawLine(0, s * 0.14f, 0, s * 0.30f, p);
                      cv.drawArc(new RectF(-s * 0.16f, s * 0.20f, s * 0.16f, s * 0.44f), 0, 180, false, p);
                      cv.restore();
                  }
              }

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  CrashGuard.install(this);
                  String tr = CrashGuard.take(this);
                  if (tr != null) {
                      CrashGuard.show(this, tr);
                      return;
                  }
                  sp = getSharedPreferences("launcher", MODE_PRIVATE);
                  pm = getPackageManager();
                  applyTheme();
                  android.util.DisplayMetrics dm = getResources().getDisplayMetrics();
                  u = Math.min(dm.widthPixels, dm.heightPixels) / 720f;
                  maxKmh = sp.getFloat("max", 0);
                  distKm = sp.getFloat("dist", 0);
                  movH = sp.getFloat("mov", 0);

                  FrameLayout root = new FrameLayout(this);
                  root.setBackground(new GradientDrawable(GradientDrawable.Orientation.TL_BR, new int[]{BG1, BG2}));
                  bg = new ImageView(this);
                  bg.setScaleType(ImageView.ScaleType.CENTER_CROP);
                  root.addView(bg, new FrameLayout.LayoutParams(-1, -1));
                  View dim = new View(this);
                  dim.setBackgroundColor(OV);
                  root.addView(dim, new FrameLayout.LayoutParams(-1, -1));

                  LinearLayout main = new LinearLayout(this);
                  main.setOrientation(LinearLayout.HORIZONTAL);
                  main.setPadding(px(20), px(20), px(20), px(20));
                  root.addView(main, new FrameLayout.LayoutParams(-1, -1));

                  // ================= ліва колонка (40 %) =================
                  LinearLayout left = new LinearLayout(this);
                  left.setOrientation(LinearLayout.VERTICAL);
                  LinearLayout.LayoutParams llp = lp(0, -1, 4);
                  llp.setMargins(0, 0, px(16), 0);
                  main.addView(left, llp);

                  // --- плитка з годинником і швидкістю ---
                  FrameLayout clockCard = new FrameLayout(this);
                  clockCard.setBackground(rounded(CARD, 24));
                  left.addView(clockCard, lp(-1, 0, 4.6f));
                  LinearLayout cc = new LinearLayout(this);
                  cc.setOrientation(LinearLayout.VERTICAL);
                  cc.setPadding(px(22), px(12), px(22), px(12));
                  clockCard.addView(cc, new FrameLayout.LayoutParams(-1, -1));
                  tvClock = text("00:00", 76, TXT, true);
                  tvClock.setGravity(Gravity.CENTER);
                  cc.addView(tvClock, lp(-1, -2, 0));
                  tvDate = text("", 22, DIM, false);
                  tvDate.setSingleLine(true);
                  tvDate.setGravity(Gravity.CENTER);
                  cc.addView(tvDate, lp(-1, -2, 0));
                  LinearLayout speedRow = new LinearLayout(this);
                  speedRow.setOrientation(LinearLayout.VERTICAL);
                  speedRow.setGravity(Gravity.CENTER);
                  speedRow.setClickable(true);
                  speedRow.setOnLongClickListener(v -> {
                      resetTrip();
                      return true;
                  });
                  cc.addView(speedRow, lp(-1, 0, 1));
                  tvSpeed = text("—", 110, ACC, true);
                  tvSpeed.setGravity(Gravity.CENTER);
                  speedRow.addView(tvSpeed, lp(-1, -2, 0));
                  TextView kmh = text("км/год", 20, DIM, false);
                  kmh.setGravity(Gravity.CENTER);
                  speedRow.addView(kmh, lp(-1, -2, 0));
                  LinearLayout stats = new LinearLayout(this);
                  stats.setOrientation(LinearLayout.VERTICAL);
                  stats.setGravity(Gravity.RIGHT);
                  tvAvg = text("Сер.  0", 20, TXT, false);
                  tvMax = text("Макс. 0", 20, TXT, false);
                  stats.addView(tvAvg, lp(-2, -2, 0));
                  stats.addView(tvMax, lp(-2, -2, 0));
                  LinearLayout satRow = new LinearLayout(this);
                  satRow.setOrientation(LinearLayout.HORIZONTAL);
                  satRow.setGravity(Gravity.CENTER_VERTICAL);
                  satRow.addView(new SatView(this), lp(28, 28, 0));
                  tvSats = text(" —", 20, DIM, false);
                  satRow.addView(tvSats, lp(-2, -2, 0));
                  stats.addView(satRow, lp(-2, -2, 0));
                  FrameLayout.LayoutParams stp = new FrameLayout.LayoutParams(-2, -2, Gravity.TOP | Gravity.RIGHT);
                  stp.setMargins(0, px(12), px(14), 0);
                  clockCard.addView(stats, stp);

                  // --- яскравість: квадратна кнопка зверху зліва ---
                  dayNight = btn("", 41);
                  dayNight.setOnClickListener(v -> toggleBright());
                  dayNight.setOnLongClickListener(v -> {
                      minDialog();
                      return true;
                  });
                  FrameLayout.LayoutParams dnp = new FrameLayout.LayoutParams(px(72), px(72), Gravity.TOP | Gravity.LEFT);
                  dnp.setMargins(px(12), px(12), 0, 0);
                  clockCard.addView(dayNight, dnp);

                  // --- радіо і AIMP: дві вертикальні плитки ---
                  LinearLayout media = new LinearLayout(this);
                  media.setOrientation(LinearLayout.HORIZONTAL);
                  LinearLayout.LayoutParams mlp = lp(-1, 0, 5.4f);
                  mlp.setMargins(0, px(14), 0, 0);
                  left.addView(media, mlp);

                  LinearLayout radio = card(LinearLayout.VERTICAL);
                  radio.setGravity(Gravity.CENTER_HORIZONTAL);
                  radio.setPadding(px(10), px(14), px(10), px(12));
                  radio.setClickable(true);
                  radio.setOnClickListener(v -> launchKey("radio"));
                  TextView rl = text("РАДІО", 20, DIM, true);
                  rl.setGravity(Gravity.CENTER);
                  radio.addView(rl, lp(-1, -2, 0));
                  tvStation = text(sp.getString("lname", "Радіо"), 28, TXT, true);
                  tvStation.setGravity(Gravity.CENTER);
                  tvStation.setMaxLines(3);
                  tvStation.setEllipsize(android.text.TextUtils.TruncateAt.END);
                  radio.addView(tvStation, lp(-1, 0, 1));
                  tvFreq = text(sp.getString("lfreq", ""), 22, ACC, true);
                  tvFreq.setGravity(Gravity.CENTER);
                  radio.addView(tvFreq, lp(-1, -2, 0));
                  LinearLayout rb = new LinearLayout(this);
                  rb.setOrientation(LinearLayout.HORIZONTAL);
                  Button rPrev = btn("⏮", 30);
                  rPrev.setOnClickListener(v -> tuner.prev());
                  rPlay = btn("■", 30);
                  rPlay.setOnClickListener(v -> toggleRadio());
                  Button rNext = btn("⏭", 30);
                  rNext.setOnClickListener(v -> tuner.next());
                  for (Button x : new Button[]{rPrev, rPlay, rNext}) {
                      LinearLayout.LayoutParams bp = lp(0, 68, 1);
                      bp.setMargins(px(3), 0, px(3), 0);
                      rb.addView(x, bp);
                  }
                  LinearLayout.LayoutParams rbp = lp(-1, -2, 0);
                  rbp.setMargins(0, px(10), 0, 0);
                  radio.addView(rb, rbp);
                  LinearLayout.LayoutParams rlp = lp(0, -1, 1);
                  rlp.setMargins(0, 0, px(7), 0);
                  media.addView(radio, rlp);

                  LinearLayout aimp = card(LinearLayout.VERTICAL);
                  aimp.setGravity(Gravity.CENTER_HORIZONTAL);
                  aimp.setPadding(px(10), px(14), px(10), px(12));
                  aimp.setClickable(true);
                  aimp.setOnClickListener(v -> launchKey("aimp"));
                  cover = new ImageView(this);
                  cover.setScaleType(ImageView.ScaleType.CENTER_CROP);
                  cover.setBackground(rounded(BTN, 14));
                  aimp.addView(cover, lp(130, 130, 0));
                  tvTrack = text("AIMP", 24, TXT, true);
                  tvTrack.setGravity(Gravity.CENTER);
                  tvTrack.setMaxLines(2);
                  tvTrack.setEllipsize(android.text.TextUtils.TruncateAt.END);
                  tvTrack.setOnClickListener(v -> {
                      if (needAccess) startActivity(new Intent("android.settings.ACTION_NOTIFICATION_LISTENER_SETTINGS"));
                      else launchKey("aimp");
                  });
                  LinearLayout.LayoutParams tp = lp(-1, -2, 0);
                  tp.setMargins(0, px(8), 0, 0);
                  aimp.addView(tvTrack, tp);
                  tvArtist = text("", 20, DIM, false);
                  tvArtist.setGravity(Gravity.CENTER);
                  tvArtist.setSingleLine(true);
                  tvArtist.setEllipsize(android.text.TextUtils.TruncateAt.END);
                  aimp.addView(tvArtist, lp(-1, -2, 0));
                  aimp.addView(new View(this), lp(-1, 0, 1));
                  LinearLayout ab = new LinearLayout(this);
                  ab.setOrientation(LinearLayout.HORIZONTAL);
                  Button aPrev = btn("⏮", 30);
                  aPrev.setOnClickListener(v -> mediaCmd(0));
                  aPlay = btn("⏯", 30);
                  aPlay.setOnClickListener(v -> mediaCmd(1));
                  Button aNext = btn("⏭", 30);
                  aNext.setOnClickListener(v -> mediaCmd(2));
                  for (Button x : new Button[]{aPrev, aPlay, aNext}) {
                      LinearLayout.LayoutParams bp = lp(0, 68, 1);
                      bp.setMargins(px(3), 0, px(3), 0);
                      ab.addView(x, bp);
                  }
                  aimp.addView(ab, lp(-1, -2, 0));
                  LinearLayout.LayoutParams alp = lp(0, -1, 1);
                  alp.setMargins(px(7), 0, 0, 0);
                  media.addView(aimp, alp);

                  // ================= права колонка (60 %) =================
                  LinearLayout right = new LinearLayout(this);
                  right.setOrientation(LinearLayout.VERTICAL);
                  main.addView(right, lp(0, -1, 6));

                  // --- вікно навігації ---
                  FrameLayout nav = new FrameLayout(this);
                  nav.setBackground(rounded(0xFF000000, 24));
                  nav.setClickable(true);
                  nav.setOnClickListener(v -> launchKey("nav"));
                  nav.setOnLongClickListener(v -> {
                      chooseApp("nav", "Навігація");
                      return true;
                  });
                  navView = new TextureView(this);
                  navView.setSurfaceTextureListener(new TextureView.SurfaceTextureListener() {
                      @Override
                      public void onSurfaceTextureAvailable(SurfaceTexture st, int w, int h) {
                          navW = w;
                          navH = h;
                          st.setDefaultBufferSize(w, h);
                          navSurface = new Surface(st);
                          startNav();
                      }

                      @Override
                      public void onSurfaceTextureSizeChanged(SurfaceTexture st, int w, int h) {
                      }

                      @Override
                      public boolean onSurfaceTextureDestroyed(SurfaceTexture st) {
                          releaseNav();
                          return true;
                      }

                      @Override
                      public void onSurfaceTextureUpdated(SurfaceTexture st) {
                      }
                  });
                  nav.addView(navView, new FrameLayout.LayoutParams(-1, -1));
                  LinearLayout navHint = new LinearLayout(this);
                  navHint.setOrientation(LinearLayout.VERTICAL);
                  navHint.setGravity(Gravity.CENTER);
                  navHint.setClickable(false);
                  navIcon = new ImageView(this);
                  navHint.addView(navIcon, lp(150, 150, 0));
                  navNote = text("Навігація", 30, TXT, true);
                  navNote.setGravity(Gravity.CENTER);
                  navHint.addView(navNote, lp(-2, -2, 0));
                  nav.addView(navHint, new FrameLayout.LayoutParams(-1, -1));
                  navHintView = navHint;
                  right.addView(nav, lp(-1, 0, 8.4f));

                  // --- ряд програм + кнопка налаштувань ---
                  appsRow = new LinearLayout(this);
                  appsRow.setOrientation(LinearLayout.HORIZONTAL);
                  appsRow.setGravity(Gravity.CENTER_VERTICAL);
                  appsRow.setBackground(rounded(CARD, 24));
                  appsRow.setPadding(px(10), px(8), px(10), px(8));
                  LinearLayout.LayoutParams hlp = lp(-1, 0, 1.7f);
                  hlp.setMargins(0, px(14), 0, 0);
                  right.addView(appsRow, hlp);

                  setContentView(root);
                  ready = true;
                  loadBg();
                  tick();
                  startGps();
                  tuner = new Tuner(this);
                  tuner.setHost(this, MainActivity.class);
                  tuner.start();
              }

              View navHintView;

              @Override
              protected void onResume() {
                  super.onResume();
                  if (!ready) return;
                  refreshApps();
                  updateBright();
                  refreshMedia();
                  if (navVd == null && navSurface != null && !navFailed) startNav();
              }

              @Override
              protected void onPause() {
                  super.onPause();
                  if (ready) saveTrip();
              }

              @Override
              protected void onDestroy() {
                  if (ready) {
                      saveTrip();
                      releaseNav();
                      try {
                          tuner.stop();
                      } catch (Throwable ignored) {
                      }
                      try {
