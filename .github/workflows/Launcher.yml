          cat > app/src/main/java/com/example/launcher/CrashGuard.java <<'EOF'
          package com.example.launcher;

          import android.app.Activity;
          import android.content.ClipData;
          import android.content.ClipboardManager;
          import android.content.Context;
          import android.content.SharedPreferences;
          import android.view.View;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;

          import java.io.PrintWriter;
          import java.io.StringWriter;

          /** Записує причину збою програми й показує її при наступному запуску, щоб її можна було скопіювати. */
          final class CrashGuard {
              private CrashGuard() {
              }

              static void install(final Context ctx) {
                  final SharedPreferences sp = ctx.getSharedPreferences("crash", Context.MODE_PRIVATE);
                  final Thread.UncaughtExceptionHandler old = Thread.getDefaultUncaughtExceptionHandler();
                  Thread.setDefaultUncaughtExceptionHandler(new Thread.UncaughtExceptionHandler() {
                      @Override
                      public void uncaughtException(Thread t, Throwable e) {
                          try {
                              StringWriter sw = new StringWriter();
                              e.printStackTrace(new PrintWriter(sw));
                              sp.edit().putString("trace", sw.toString()).commit();
                          } catch (Throwable ignored) {
                          }
                          if (old != null) old.uncaughtException(t, e);
                      }
                  });
              }

              static String take(Context ctx) {
                  SharedPreferences sp = ctx.getSharedPreferences("crash", Context.MODE_PRIVATE);
                  String s = sp.getString("trace", null);
                  if (s != null) sp.edit().remove("trace").commit();
                  return s;
              }

              static void show(final Activity a, final String trace) {
                  LinearLayout col = new LinearLayout(a);
                  col.setOrientation(LinearLayout.VERTICAL);
                  col.setBackgroundColor(0xFF101418);
                  col.setPadding(24, 24, 24, 24);
                  TextView h = new TextView(a);
                  h.setText("Попередній запуск завершився збоєм. Натисни «Копіювати» і встав текст у чат, потім запусти програму ще раз.");
                  h.setTextColor(0xFFFFB74D);
                  h.setTextSize(16);
                  col.addView(h);
                  Button b = new Button(a);
                  b.setText("Копіювати");
                  b.setOnClickListener(new View.OnClickListener() {
                      @Override
                      public void onClick(View v) {
                          ClipboardManager cm = (ClipboardManager) a.getSystemService(Context.CLIPBOARD_SERVICE);
                          cm.setPrimaryClip(ClipData.newPlainText("crash", trace));
                      }
                  });
                  col.addView(b);
                  ScrollView sv = new ScrollView(a);
                  TextView t = new TextView(a);
                  t.setText(trace);
                  t.setTextColor(0xFFECEFF1);
                  t.setTextSize(11);
                  t.setTextIsSelectable(true);
                  sv.addView(t);
                  col.addView(sv, new LinearLayout.LayoutParams(-1, 0, 1));
                  a.setContentView(col);
              }
          }
          EOF

