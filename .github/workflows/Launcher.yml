                  byte[] buf = new byte[8192];
                  int n;
                  while ((n = in.read(buf)) > 0) bo.write(buf, 0, n);
                  return bo.toByteArray();
              }

              static int[] packed(byte[] d, int s, int e) {
                  int[] tmp = new int[e - s];
                  int n = 0;
                  Pb pb = new Pb(d, s, e);
                  while (pb.more()) tmp[n++] = pb.v32();
                  return Arrays.copyOf(tmp, n);
              }

              static Object parseValue(byte[] d, int s, int e) {
                  Pb pb = new Pb(d, s, e);
                  Object r = null;
                  while (pb.more()) {
                      int tag = pb.v32(), f = tag >>> 3, w = tag & 7;
                      if (f == 1 && w == 2) {
                          int len = pb.v32();
                          r = new String(d, pb.p, len, java.nio.charset.Charset.forName("UTF-8"));
                          pb.p += len;
                      } else if (f == 2 && w == 5) {
                          int bits = (d[pb.p] & 0xff) | (d[pb.p + 1] & 0xff) << 8 | (d[pb.p + 2] & 0xff) << 16 | (d[pb.p + 3] & 0xff) << 24;
                          r = (double) Float.intBitsToFloat(bits);
                          pb.p += 4;
                      } else if (f == 3 && w == 1) {
                          long bits = 0;
                          for (int i = 7; i >= 0; i--) bits = (bits << 8) | (d[pb.p + i] & 0xff);
                          r = Double.longBitsToDouble(bits);
                          pb.p += 8;
                      } else if (w == 0) {
                          long v = pb.v64();
                          if (f == 6) v = (v >>> 1) ^ -(v & 1);
                          r = v;
                      } else {
                          pb.skip(w);
                      }
                  }
                  return r;
              }

              static Layer parseLayer(byte[] d, int s, int e) {
                  Layer l = new Layer();
                  Pb pb = new Pb(d, s, e);
                  while (pb.more()) {
                      int tag = pb.v32(), f = tag >>> 3, w = tag & 7;
                      if (w == 2 && (f == 1 || f == 3)) {
                          int len = pb.v32();
                          String str = new String(d, pb.p, len, java.nio.charset.Charset.forName("UTF-8"));
                          pb.p += len;
                          if (f == 1) l.name = str;
                          else l.keys.add(str);
                      } else if (w == 2 && f == 2) {
                          int len = pb.v32();
                          Feat ft = new Feat();
                          ft.layer = l;
                          Pb fp = new Pb(d, pb.p, pb.p + len);
                          while (fp.more()) {
                              int t2 = fp.v32(), f2 = t2 >>> 3, w2 = t2 & 7;
                              if (f2 == 2 && w2 == 2) {
                                  int n = fp.v32();
                                  ft.tags = packed(d, fp.p, fp.p + n);
                                  fp.p += n;
                              } else if (f2 == 3 && w2 == 0) {
                                  ft.type = fp.v32();
                              } else if (f2 == 4 && w2 == 2) {
                                  int n = fp.v32();
                                  ft.geom = packed(d, fp.p, fp.p + n);
                                  fp.p += n;
                              } else {
                                  fp.skip(w2);
                              }
                          }
                          if (ft.geom != null) l.feats.add(ft);
                          pb.p += len;
                      } else if (w == 2 && f == 4) {
                          int len = pb.v32();
                          l.vals.add(parseValue(d, pb.p, pb.p + len));
                          pb.p += len;
                      } else if (w == 0 && f == 5) {
                          l.extent = pb.v32();
                      } else {
                          pb.skip(w);
                      }
                  }
                  return l;
              }

              static Map<String, Layer> parse(byte[] d) {
                  Map<String, Layer> m = new HashMap<String, Layer>();
                  Pb t = new Pb(d, 0, d.length);
                  while (t.more()) {
                      int tag = t.v32(), f = tag >>> 3, w = tag & 7;
                      if (f == 3 && w == 2) {
                          int len = t.v32();
                          Layer l = parseLayer(d, t.p, t.p + len);
                          t.p += len;
                          if (l.name != null) m.put(l.name, l);
                      } else {
                          t.skip(w);
                      }
                  }
                  return m;
              }

              static int unzig(int v) {
                  return (v >>> 1) ^ -(v & 1);
              }

              static Path toPath(Feat f, float sc) {
                  Path p = new Path();
                  int x = 0, y = 0, i = 0;
                  int[] g = f.geom;
                  while (i < g.length) {
                      int cmd = g[i++], id = cmd & 7, cnt = cmd >>> 3;
                      if (id == 1 || id == 2) {
                          for (int k = 0; k < cnt && i + 1 < g.length + 1; k++) {
                              x += unzig(g[i++]);
                              y += unzig(g[i++]);
                              if (id == 1) p.moveTo(x * sc, y * sc);
                              else p.lineTo(x * sc, y * sc);
                          }
                      } else if (id == 7) {
                          p.close();
                      }
                  }
                  return p;
              }

              public static class Road {
                  public String name;
                  public int rank;
                  public float[] xy;
              }

              public static class PointLabel {
                  public String name, cls;
                  public int kind; // 1 - номер будинку, 2 - заклад, 3 - населений пункт
                  public float x, y;
              }

              public static class TileLabels {
                  public List<Road> roads = new ArrayList<Road>();
                  public List<PointLabel> pts = new ArrayList<PointLabel>();
              }

              /** Лінії об'єкта в нормалізованих координатах (0..1), напрямок зліва направо. */
              static List<float[]> lines(Feat f, float sc) {
                  List<float[]> res = new ArrayList<float[]>();
                  List<float[]> pts = new ArrayList<float[]>();
                  int x = 0, y = 0, i = 0;
                  int[] g = f.geom;
                  while (i < g.length) {
                      int cmd = g[i++], id = cmd & 7, cnt = cmd >>> 3;
                      if (id == 1 || id == 2) {
                          for (int k = 0; k < cnt; k++) {
                              x += unzig(g[i++]);
                              y += unzig(g[i++]);
                              if (id == 1 && !pts.isEmpty()) {
                                  flat(pts, res);
                                  pts = new ArrayList<float[]>();
                              }
                              pts.add(new float[]{x * sc, y * sc});
                          }
                      }
                  }
                  flat(pts, res);
                  return res;
              }

              static void flat(List<float[]> pts, List<float[]> out) {
                  if (pts.size() < 2) return;
                  if (pts.get(pts.size() - 1)[0] < pts.get(0)[0]) java.util.Collections.reverse(pts);
                  float[] a = new float[pts.size() * 2];
                  for (int i = 0; i < pts.size(); i++) {
                      a[i * 2] = pts.get(i)[0];
                      a[i * 2 + 1] = pts.get(i)[1];
                  }
                  out.add(a);
              }

              static String nameOf(Feat f) {
                  String nm = f.str("name");
                  if (nm == null) nm = f.str("name:uk");
                  if (nm == null) nm = f.str("name:latin");
                  return nm;
              }

              static final String[] RANK = {"service", "minor", "tertiary", "secondary", "primary", "trunk", "motorway"};
              static final int[] FILL = {0xFFFFFFFF, 0xFFFFFFFF, 0xFFFFFFFF, 0xFFF7FABF, 0xFFFCD6A4, 0xFFF9B29C, 0xFFE892A2};
              static final int[] CASE = {0xFFBDBDBD, 0xFFBDBDBD, 0xFFBDBDBD, 0xFFB9B97A, 0xFFD9A55A, 0xFFD98A74, 0xFFDC2A67};
              static final float[] WID = {1.5f, 2.2f, 3f, 3.5f, 4f, 4.5f, 5f};

              static int rank(String c) {
                  if (c == null) return -1;
                  if (c.equals("residential") || c.equals("unclassified") || c.equals("living_street")) c = "minor";
                  for (int i = 0; i < RANK.length; i++) if (RANK[i].equals(c)) return i;
                  return -1;
              }

              static Integer landColor(String layer, String c) {
                  if (c == null) return null;
                  if (layer.equals("landcover")) {
                      if (c.equals("wood")) return 0xFFC5E0B0;
                      if (c.equals("grass")) return 0xFFDDEBC8;
                      if (c.equals("farmland")) return 0xFFEEEFD5;
                      if (c.equals("wetland")) return 0xFFD3E8E0;
                      if (c.equals("sand")) return 0xFFF5E9C6;
                      if (c.equals("rock")) return 0xFFE0DCD5;
                      if (c.equals("ice")) return 0xFFFFFFFF;
                  } else {
                      if (c.equals("residential") || c.equals("suburb")) return 0xFFE9E5DC;
                      if (c.equals("commercial") || c.equals("retail")) return 0xFFF2DAD9;
                      if (c.equals("industrial") || c.equals("railway")) return 0xFFE6DDE8;
                      if (c.equals("cemetery")) return 0xFFAACBAF;
                      if (c.equals("garden") || c.equals("park") || c.equals("playground") || c.equals("pitch") || c.equals("zoo") || c.equals("theme_park"))
                          return 0xFFCDEBB1;
                      if (c.equals("military")) return 0xFFF1D9D9;
                      if (c.equals("quarry")) return 0xFFC5C3C3;
                  }
                  return null;
              }

              public static Bitmap render(byte[] raw, int z, int size, TileLabels out) {
                  return render(raw, z, size, out, 0, 0, 0);
              }

              /** dz>0: плитка збільшується з батьківської (z - dz), показується частина sx,sy. */
              public static Bitmap render(byte[] raw, int z, int size, TileLabels out, int dz, int sx, int sy) {
                  final float ovz = (float) (1 << dz);
                  Bitmap bm = Bitmap.createBitmap(size, size, Bitmap.Config.ARGB_8888);
                  Canvas c = new Canvas(bm);
                  c.drawColor(0xFFF2EFE9);
                  c.save();
                  c.translate(-sx * size, -sy * size);
                  c.scale(ovz, ovz);
                  try {
                      byte[] d = raw;
                      if (raw.length > 2 && (raw[0] & 0xff) == 0x1f && (raw[1] & 0xff) == 0x8b) d = gunzip(raw);
                      Map<String, Layer> L = parse(d);
                      float k = (float) Math.max(0.6, Math.min(3.0, 0.6 + 0.35 * (z - 10))) * size / 512f / ovz;
                      Paint p = new Paint(Paint.ANTI_ALIAS_FLAG);
                      p.setStrokeCap(Paint.Cap.ROUND);
                      p.setStrokeJoin(Paint.Join.ROUND);

                      for (String ln : new String[]{"landcover", "landuse"}) {
                          Layer l = L.get(ln);
                          if (l == null) continue;
                          float sc = size / (float) l.extent;
                          for (Feat f : l.feats) {
                              if (f.type != 3) continue;
                              Integer col = landColor(ln, f.str("class"));
                              if (col == null) continue;
                              Path pa = toPath(f, sc);
                              pa.setFillType(Path.FillType.EVEN_ODD);
                              p.setStyle(Paint.Style.FILL);
                              p.setColor(col);
                              c.drawPath(pa, p);
                          }
                      }
                      Layer w = L.get("water");
                      if (w != null) {
                          float sc = size / (float) w.extent;
                          for (Feat f : w.feats) {
                              if (f.type != 3) continue;
                              Path pa = toPath(f, sc);
                              pa.setFillType(Path.FillType.EVEN_ODD);
                              p.setStyle(Paint.Style.FILL);
                              p.setColor(0xFFAAD3DF);
                              c.drawPath(pa, p);
                          }
                      }
                      Layer ww = L.get("waterway");
                      if (ww != null) {
                          float sc = size / (float) ww.extent;
                          p.setStyle(Paint.Style.STROKE);
                          p.setColor(0xFF8CBCDB);
                          p.setStrokeWidth(1.6f * k);
                          for (Feat f : ww.feats) if (f.type == 2) c.drawPath(toPath(f, sc), p);
                      }
                      Layer bl = L.get("building");
                      if (bl != null && z >= 13) {
                          float sc = size / (float) bl.extent;
                          for (Feat f : bl.feats) {
                              if (f.type != 3) continue;
                              Path pa = toPath(f, sc);
                              pa.setFillType(Path.FillType.EVEN_ODD);
                              p.setStyle(Paint.Style.FILL);
                              p.setColor(0xFFD9D0C9);
                              c.drawPath(pa, p);
                              p.setStyle(Paint.Style.STROKE);
                              p.setStrokeWidth(1f / ovz);
                              p.setColor(0xFFC4B7AE);
                              c.drawPath(pa, p);
                          }
                      }
                      Layer tr = L.get("transportation");
                      if (tr != null) {
                          float sc = size / (float) tr.extent;
                          List<List<Path>> byRank = new ArrayList<List<Path>>();
                          for (int i = 0; i < RANK.length; i++) byRank.add(new ArrayList<Path>());
                          List<Path> rail = new ArrayList<Path>(), paths = new ArrayList<Path>();
                          for (Feat f : tr.feats) {
                              if (f.type != 2) continue;
                              String cl = f.str("class");
                              if ("rail".equals(cl)) {
                                  rail.add(toPath(f, sc));
                                  continue;
                              }
                              if ("path".equals(cl) || "track".equals(cl)) {
                                  if (z >= 13) paths.add(toPath(f, sc));
                                  continue;
                              }
                              int r = rank(cl);
                              if (r >= 0) byRank.get(r).add(toPath(f, sc));
                          }
                          p.setStyle(Paint.Style.STROKE);
                          p.setPathEffect(new DashPathEffect(new float[]{6 * k, 4 * k}, 0));
                          p.setColor(0xFFB5A99C);
                          p.setStrokeWidth(1.2f * k);
                          for (Path pa : paths) c.drawPath(pa, p);
                          p.setPathEffect(null);
                          for (int r = 0; r < RANK.length; r++) {
                              List<Path> l = byRank.get(r);
                              if (l.isEmpty()) continue;
                              p.setColor(CASE[r]);
                              p.setStrokeWidth(WID[r] * k + 1.6f * k);
                              for (Path pa : l) c.drawPath(pa, p);
                              p.setColor(FILL[r]);
                              p.setStrokeWidth(WID[r] * k);
                              for (Path pa : l) c.drawPath(pa, p);
                          }
                          p.setColor(0xFF888888);
                          p.setStrokeWidth(1.3f * k);
                          p.setPathEffect(new DashPathEffect(new float[]{10 * k, 6 * k}, 0));
                          for (Path pa : rail) c.drawPath(pa, p);
                          p.setPathEffect(null);
                      }
                      Layer bd = L.get("boundary");
                      if (bd != null) {
                          float sc = size / (float) bd.extent;
                          p.setStyle(Paint.Style.STROKE);
                          p.setColor(0xFF9E7CB3);
                          p.setPathEffect(new DashPathEffect(new float[]{12 * k, 6 * k}, 0));
                          for (Feat f : bd.feats) {
                              if (f.type != 2) continue;
                              double al = f.num("admin_level", 9);
                              if (al > 6) continue;
                              p.setStrokeWidth((al <= 2 ? 3f : 1.8f) * k);
                              c.drawPath(toPath(f, sc), p);
                          }
                          p.setPathEffect(null);
                      }
                      if (out != null) {
                          Layer tn = L.get("transportation_name");
                          if (tn != null) {
                              float sc = 1f / tn.extent;
                              for (Feat f : tn.feats) {
                                  if (f.type != 2) continue;
                                  String nm = nameOf(f);
                                  if (nm == null) continue;
                                  int rk = Math.max(0, rank(f.str("class")));
                                  for (float[] ln : lines(f, sc)) {
                                      Road r = new Road();
                                      r.name = nm;
                                      r.rank = rk;
                                      if (dz > 0) {
                                          float[] q = new float[ln.length];
                                          boolean in = false;
                                          for (int i2 = 0; i2 + 1 < ln.length; i2 += 2) {
                                              q[i2] = ln[i2] * ovz - sx;
                                              q[i2 + 1] = ln[i2 + 1] * ovz - sy;
                                              if (q[i2] > -0.2f && q[i2] < 1.2f && q[i2 + 1] > -0.2f && q[i2 + 1] < 1.2f) in = true;
                                          }
                                          if (!in) continue;
                                          r.xy = q;
                                      } else r.xy = ln;
                                      out.roads.add(r);
                                  }
                              }
                          }
                          String[] pl2 = {"housenumber", "poi", "place"};
                          for (int q = 0; q < 3; q++) {
                              Layer ly = L.get(pl2[q]);
                              if (ly == null) continue;
                              float sc = 1f / ly.extent;
                              for (Feat f : ly.feats) {
                                  if (f.type != 1 || f.geom.length < 3) continue;
                                  PointLabel pt = new PointLabel();
                                  pt.kind = q + 1;
                                  pt.name = q == 0 ? f.str("housenumber") : nameOf(f);
                                  pt.cls = q == 0 ? "" : q == 2 ? String.valueOf(f.str("class")) : String.valueOf(f.str("class")) + "/" + String.valueOf(f.str("subclass"));
                                  if (pt.name == null && q != 1) continue;
                                  pt.x = unzig(f.geom[1]) * sc;
                                  pt.y = unzig(f.geom[2]) * sc;
                                  if (dz > 0) {
                                      pt.x = pt.x * ovz - sx;
                                      pt.y = pt.y * ovz - sy;
                                      if (pt.x < 0 || pt.x >= 1 || pt.y < 0 || pt.y >= 1) continue;
                                  }
                                  out.pts.add(pt);
                              }
                          }
                      }
                  } catch (Throwable t) {
                      // залишаємо те, що встигли намалювати
                  }
                  c.restore();
                  return bm;
              }
          }
          EOF

