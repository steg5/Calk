              class BarView extends View {
                  float[] v;
                  String[] lab;
                  final Paint p = new Paint(Paint.ANTI_ALIAS_FLAG);

                  BarView(Context c, float[] v, String[] lab) {
                      super(c);
                      this.v = v;
                      this.lab = lab;
                  }

                  @Override
                  protected void onDraw(Canvas cv) {
                      float w = getWidth(), h = getHeight(), mx = 1;
                      for (float x : v) mx = Math.max(mx, x);
                      float bw = w / v.length, top = px(24), bot = px(26);
                      p.setTextAlign(Paint.Align.CENTER);
                      p.setTextSize(px(18));
                      for (int i = 0; i < v.length; i++) {
                          float bh = (h - top - bot) * v[i] / mx;
                          p.setColor(ACC);
                          cv.drawRoundRect(new RectF(i * bw + px(5), h - bot - bh, (i + 1) * bw - px(5), h - bot), px(5), px(5), p);
                          p.setColor(DIM);
                          cv.drawText(lab[i], i * bw + bw / 2, h - px(6), p);
                          if (v[i] > 0) cv.drawText(String.valueOf(Math.round(v[i])), i * bw + bw / 2, h - bot - bh - px(4), p);
                      }
                  }
              }

              List<String> recs() {
                  List<String> l = new ArrayList<String>();
                  for (String x : sp.getString("svc", "").split("\n")) if (!x.trim().isEmpty()) l.add(x);
                  return l;
              }

              void saveRecs(List<String> l) {
                  StringBuilder sb = new StringBuilder();
                  for (String x : l) {
                      if (sb.length() > 0) sb.append('\n');
                      sb.append(x);
                  }
                  sp.edit().putString("svc", sb.toString()).apply();
              }

              String readInfo() {
                  File ext = getExternalFilesDir(null);
                  File[] c = {new File("/sdcard/car_info.txt"), ext == null ? null : new File(ext, "car_info.txt")};
                  for (File f : c) {
                      if (f == null || !f.exists() || !f.canRead()) continue;
                      try {
                          FileInputStream in = new FileInputStream(f);
                          ByteArrayOutputStream bo = new ByteArrayOutputStream();
                          byte[] b = new byte[4096];
                          int n;
                          while ((n = in.read(b)) > 0) bo.write(b, 0, n);
                          in.close();
                          return bo.toString("UTF-8");
                      } catch (Throwable ignored) {
                      }
                  }
                  return null;
              }

              void buildService() {
                  LinearLayout head = new LinearLayout(this);
                  head.setOrientation(LinearLayout.HORIZONTAL);
                  head.setGravity(Gravity.CENTER_VERTICAL);
                  head.addView(text("Сервіс", 36, TXT, true), lp(0, -2, 1));
                  Button close = btn("Закрити", 24);
                  close.setOnClickListener(v -> svcDlg.dismiss());
                  head.addView(close, lp(160, 56, 0));
                  svcCol.addView(head, lp(-1, -2, 0));

                  // --- пробіг ---
                  int oi = sp.getInt("oilint", 10000);
                  LinearLayout c1 = svcCard("Пробіг");
                  c1.addView(text("Загальний: " + Math.round(odo) + " км", 30, TXT, false), lp(-1, -2, 0));
                  LinearLayout r1 = btnRow(c1);
                  small(r1, "Змінити", v -> askNumber("Загальний пробіг, км", odo, x -> odo = x));
                  TextView oil = text("Після заміни масла: " + Math.round(oilKm) + " км (інтервал " + oi + ")", 30,
                          oilKm >= oi ? 0xFFFF5252 : TXT, false);
                  LinearLayout.LayoutParams ol = lp(-1, -2, 0);
                  ol.setMargins(0, px(14), 0, 0);
                  c1.addView(oil, ol);
                  LinearLayout r2 = btnRow(c1);
                  small(r2, "Змінити", v -> askNumber("Пробіг після заміни масла, км", oilKm, x -> oilKm = x));
                  small(r2, "Інтервал", v -> askNumber("Інтервал заміни масла, км", sp.getInt("oilint", 10000),
                          x -> sp.edit().putInt("oilint", Math.max(1000, Math.round(x))).apply()));
                  small(r2, "Масло замінено", v -> {
                      oilKm = 0;
                      saveTrip();
                      updateOilBadge();
                      rebuildService();
                  });

                  // --- статистика ---
                  saveTrip();
                  LinearLayout c2 = svcCard("Скільки проїхав");
                  Calendar cal = Calendar.getInstance();
                  String ym = String.format(Locale.US, "%04d-%02d", cal.get(Calendar.YEAR), cal.get(Calendar.MONTH) + 1);
                  String yr = ym.substring(0, 4);
                  String[] keys = new String[12], lab = new String[12];
                  float[] bars = new float[12];
                  for (int i = 0; i < 12; i++) {
                      Calendar c = (Calendar) cal.clone();
                      c.add(Calendar.MONTH, -(11 - i));
                      keys[i] = String.format(Locale.US, "%04d-%02d", c.get(Calendar.YEAR), c.get(Calendar.MONTH) + 1);
                      lab[i] = String.format(Locale.US, "%02d", c.get(Calendar.MONTH) + 1);
                  }
                  float mSum = 0, ySum = 0;
                  for (Map.Entry<String, ?> e : days.getAll().entrySet()) {
                      if (!(e.getValue() instanceof Float)) continue;
                      float val = (Float) e.getValue();
                      String k = e.getKey();
                      if (k.startsWith(ym)) mSum += val;
                      if (k.startsWith(yr)) ySum += val;
                      for (int i = 0; i < 12; i++) if (k.startsWith(keys[i])) bars[i] += val;
                  }
                  c2.addView(text("Цей місяць: " + Math.round(mSum) + " км     Цей рік: " + Math.round(ySum) + " км", 28, TXT, false), lp(-1, -2, 0));
                  LinearLayout.LayoutParams bl = lp(-1, 230, 0);
                  bl.setMargins(0, px(10), 0, 0);
                  c2.addView(new BarView(this, bars, lab), bl);

                  // --- обслуговування ---
                  LinearLayout c3 = svcCard("Обслуговування");
                  LinearLayout r3 = btnRow(c3);
                  small(r3, "+  Додати роботу", v -> addWorkDialog());
                  final List<String> rs = recs();
                  Collections.sort(rs, Collections.reverseOrder());
                  if (rs.isEmpty()) c3.addView(text("Записів ще немає", 24, DIM, false), lp(-1, -2, 0));
                  for (final String r : rs) {
                      String[] a = r.split("\\|");
                      String date = a.length > 0 ? a[0] : "";
                      try {
                          date = new SimpleDateFormat("dd.MM.yyyy", Locale.US).format(new SimpleDateFormat("yyyy-MM-dd", Locale.US).parse(a[0]));
                      } catch (Throwable ignored) {
                      }
                      String works = a.length > 1 ? a[1].replace(";", ", ") : "";
                      String km = a.length > 2 && !a[2].equals("0") ? "  · " + a[2] + " км" : "";
                      TextView t = text(date + " — " + works + km, 24, TXT, false);
                      t.setOnLongClickListener(v -> {
                          new AlertDialog.Builder(this).setTitle("Видалити запис?").setMessage(r)
                                  .setPositiveButton("Видалити", (d, w) -> {
                                      List<String> all = recs();
                                      all.remove(r);
                                      saveRecs(all);
                                      rebuildService();
                                  }).setNegativeButton("Ні", null).show();
                          return true;
                      });
                      LinearLayout.LayoutParams tl = lp(-1, -2, 0);
                      tl.setMargins(0, px(10), 0, 0);
                      c3.addView(t, tl);
                  }
                  if (!rs.isEmpty()) c3.addView(text("Довге натискання на запис — видалити", 18, DIM, false), lp(-1, -2, 0));

                  // --- інформація ---
                  LinearLayout c4 = svcCard("Інформація");
                  String info = readInfo();
                  if (info == null) {
                      c4.addView(text("Файл не знайдено. Створи текстовий файл /sdcard/car_info.txt (UTF-8) з даними про авто.", 24, DIM, false), lp(-1, -2, 0));
                      if (Build.VERSION.SDK_INT >= 23 && checkSelfPermission(Manifest.permission.READ_EXTERNAL_STORAGE) != PackageManager.PERMISSION_GRANTED) {
                          LinearLayout r4 = btnRow(c4);
                          small(r4, "Дозволити читання файлів", v -> requestPermissions(new String[]{Manifest.permission.READ_EXTERNAL_STORAGE}, 3));
                      }
                  } else {
                      c4.addView(text(info, 24, TXT, false), lp(-1, -2, 0));
                  }
              }

              void addWorkDialog() {
                  LinearLayout col = new LinearLayout(this);
                  col.setOrientation(LinearLayout.VERTICAL);
                  col.setPadding(px(24), px(10), px(24), px(10));
                  final Calendar cal = Calendar.getInstance();
                  final SimpleDateFormat df = new SimpleDateFormat("dd.MM.yyyy", Locale.US);
                  final Button dateBtn = new Button(this);
                  dateBtn.setText("Дата: " + df.format(cal.getTime()));
                  dateBtn.setOnClickListener(v -> new DatePickerDialog(this, (dp, y, m, d) -> {
                      cal.set(y, m, d);
                      dateBtn.setText("Дата: " + df.format(cal.getTime()));
                  }, cal.get(Calendar.YEAR), cal.get(Calendar.MONTH), cal.get(Calendar.DAY_OF_MONTH)).show());
                  col.addView(dateBtn);
                  final CheckBox[] cb = new CheckBox[WORKS.length];
                  for (int i = 0; i < WORKS.length; i++) {
                      cb[i] = new CheckBox(this);
                      cb[i].setText(WORKS[i]);
                      cb[i].setTextSize(TypedValue.COMPLEX_UNIT_PX, 24 * u);
                      col.addView(cb[i]);
                  }
                  final EditText other = new EditText(this);
                  other.setHint("Інше (свій текст)");
                  col.addView(other);
                  ScrollView sv = new ScrollView(this);
                  sv.addView(col);
                  new AlertDialog.Builder(this).setTitle("Нова робота").setView(sv)
                          .setPositiveButton("Зберегти", (d, w) -> {
                              StringBuilder sb = new StringBuilder();
                              boolean oilDone = false;
                              for (int i = 0; i < cb.length; i++) {
                                  if (!cb[i].isChecked()) continue;
                                  if (sb.length() > 0) sb.append(';');
                                  sb.append(WORKS[i]);
                                  if (i == 0) oilDone = true;
                              }
                              String o = other.getText().toString().replace("|", " ").replace(";", " ").replace("\n", " ").trim();
                              if (!o.isEmpty()) {
                                  if (sb.length() > 0) sb.append(';');
                                  sb.append(o);
                              }
                              if (sb.length() == 0) {
                                  Toast.makeText(this, "Нічого не вибрано", Toast.LENGTH_SHORT).show();
                                  return;
                              }
                              List<String> all = recs();
                              all.add(ymd(cal.getTime()) + "|" + sb + "|" + Math.round(odo));
                              saveRecs(all);
                              if (oilDone) {
                                  oilKm = 0;
                                  saveTrip();
                                  updateOilBadge();
                              }
                              rebuildService();
                          })
                          .setNegativeButton("Скасувати", null).show();
              }

