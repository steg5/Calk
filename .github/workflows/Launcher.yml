              /** Іконки налаштувань (шестерня) і сервісу (гайковий ключ) у кольорі теми. */
              class IconView extends View {
                  final int kind;
                  final Paint p = new Paint(Paint.ANTI_ALIAS_FLAG);

                  IconView(Context c, int k) {
                      super(c);
                      kind = k;
                      setClickable(true);
                  }

                  @Override
                  protected void onDraw(Canvas cv) {
                      float w = getWidth(), h = getHeight(), side = Math.min(w, h) - px(12), s = side * 0.62f;
                      p.setStyle(Paint.Style.FILL);
                      p.setColor(BTN);
                      cv.drawRoundRect(new RectF(w / 2 - side / 2, h / 2 - side / 2, w / 2 + side / 2, h / 2 + side / 2), side * 0.2f, side * 0.2f, p);
                      p.setColor(icCol());
                      cv.translate(w / 2, h / 2);
                      if (kind == 0) {
                          for (int k = 0; k < 8; k++) {
                              cv.save();
                              cv.rotate(k * 45);
                              cv.drawRoundRect(new RectF(-s * 0.085f, -s * 0.47f, s * 0.085f, -s * 0.25f), s * 0.03f, s * 0.03f, p);
                              cv.restore();
                          }
                          Path ring = new Path();
                          ring.addCircle(0, 0, s * 0.33f, Path.Direction.CW);
                          Path hole = new Path();
                          hole.addCircle(0, 0, s * 0.13f, Path.Direction.CW);
                          ring.op(hole, Path.Op.DIFFERENCE);
                          cv.drawPath(ring, p);
                      } else if (kind == 2) {
                          float cs = s * 0.2f, gap = s * 0.1f;
                          for (int r = -1; r <= 1; r++)
                              for (int c = -1; c <= 1; c++)
                                  cv.drawRoundRect(new RectF(c * (cs + gap) - cs / 2, r * (cs + gap) - cs / 2, c * (cs + gap) + cs / 2, r * (cs + gap) + cs / 2), cs * 0.25f, cs * 0.25f, p);
                      } else {
                          cv.rotate(-45);
                          Path head = new Path();
                          head.addCircle(s * 0.27f, 0, s * 0.23f, Path.Direction.CW);
                          Path slot = new Path();
                          slot.addRect(s * 0.27f, -s * 0.095f, s * 0.60f, s * 0.095f, Path.Direction.CW);
                          head.op(slot, Path.Op.DIFFERENCE);
                          cv.drawPath(head, p);
                          cv.drawRoundRect(new RectF(-s * 0.40f, -s * 0.09f, s * 0.30f, s * 0.09f), s * 0.09f, s * 0.09f, p);
                          cv.drawCircle(-s * 0.40f, 0, s * 0.13f, p);
                      }
                  }
              }

