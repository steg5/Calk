              void preloadApps(final Runnable then) {
                  if (appsLoading) return;
                  appsLoading = true;
                  new Thread(() -> {
                      List<AppEntry> out = new ArrayList<AppEntry>();
                      try {
                          int sz = px(104);
                          for (ResolveInfo ri : launchables()) {
                              AppEntry e = new AppEntry();
                              e.pkg = ri.activityInfo.packageName;
                              e.label = String.valueOf(ri.loadLabel(pm));
                              try {
                                  android.graphics.drawable.Drawable dr = ri.loadIcon(pm);
                                  Bitmap bm = Bitmap.createBitmap(sz, sz, Bitmap.Config.ARGB_8888);
                                  Canvas c = new Canvas(bm);
                                  dr.setBounds(0, 0, sz, sz);
                                  dr.draw(c);
                                  e.icon = bm;
                              } catch (Throwable ignored) {
                              }
                              out.add(e);
                          }
                      } catch (Throwable ignored) {
                      }
                      appCache = out;
                      appsLoading = false;
                      if (then != null) ui.post(then);
                  }).start();
              }

