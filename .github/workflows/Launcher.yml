              List<AppEntry> sortedApps() {
                  List<AppEntry> l = new ArrayList<AppEntry>(appCache);
                  final String mode = sp.getString("sortmode", "name");
                  final java.util.HashMap<String, Long> dt = new java.util.HashMap<String, Long>();
                  final java.util.HashMap<String, Integer> ord = new java.util.HashMap<String, Integer>();
                  if (mode.equals("date")) {
                      for (AppEntry e : l) {
                          long t = 0;
                          try {
                              t = pm.getPackageInfo(e.pkg, 0).firstInstallTime;
                          } catch (Throwable ignored) {
                          }
                          dt.put(e.pkg, t);
                      }
                  }
                  if (mode.equals("manual")) {
                      String[] o = sp.getString("order", "").split(",");
                      for (int i = 0; i < o.length; i++) ord.put(o[i], i);
                  }
                  Collections.sort(l, new Comparator<AppEntry>() {
                      @Override
                      public int compare(AppEntry a, AppEntry b) {
                          int r = 0;
                          if (mode.equals("date")) r = Long.compare(dt.get(b.pkg), dt.get(a.pkg));
                          else if (mode.equals("freq")) r = Integer.compare(sp.getInt("cnt_" + b.pkg, 0), sp.getInt("cnt_" + a.pkg, 0));
                          else if (mode.equals("manual")) {
                              Integer ia = ord.get(a.pkg), ib = ord.get(b.pkg);
                              r = Integer.compare(ia == null ? 100000 : ia, ib == null ? 100000 : ib);
                          }
                          if (r != 0) return r;
                          return appName(a.pkg, a.label).compareToIgnoreCase(appName(b.pkg, b.label));
                      }
                  });
                  return l;
              }

