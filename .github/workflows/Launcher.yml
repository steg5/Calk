              @Override
              protected void onActivityResult(int req, int res, Intent data) {
                  super.onActivityResult(req, res, data);
                  if (req == 7 && res == RESULT_OK && data != null && data.getData() != null) {
                      try {
                          InputStream in = getContentResolver().openInputStream(data.getData());
                          Bitmap src = BitmapFactory.decodeStream(in);
                          in.close();
                          int side = 192;
                          float k = Math.min(side / (float) src.getWidth(), side / (float) src.getHeight());
                          int w = Math.max(1, Math.round(src.getWidth() * k)), h = Math.max(1, Math.round(src.getHeight() * k));
                          Bitmap out = Bitmap.createBitmap(side, side, Bitmap.Config.ARGB_8888);
                          Canvas cv = new Canvas(out);
                          cv.drawBitmap(Bitmap.createScaledBitmap(src, w, h, true), (side - w) / 2f, (side - h) / 2f, null);
                          FileOutputStream fo = new FileOutputStream(new File(getFilesDir(), "mk" + markSlot + ".png"));
                          out.compress(Bitmap.CompressFormat.PNG, 100, fo);
                          fo.close();
                          sp.edit().putInt("mstyle", markSlot).apply();
                          applyMark();
                          Toast.makeText(this, "Значок збережено", Toast.LENGTH_SHORT).show();
                          markDialog();
                      } catch (Throwable t) {
                          Toast.makeText(this, "Не вдалось: " + t, Toast.LENGTH_LONG).show();
                      }
                      return;
                  }
                  if (req == 8 && res == RESULT_OK && data != null && data.getData() != null && iconPkg != null) {
                      try {
                          InputStream in = getContentResolver().openInputStream(data.getData());
                          Bitmap src = BitmapFactory.decodeStream(in);
                          in.close();
                          int side = 192;
                          float k = Math.min(side / (float) src.getWidth(), side / (float) src.getHeight());
                          int w = Math.max(1, Math.round(src.getWidth() * k)), h = Math.max(1, Math.round(src.getHeight() * k));
                          Bitmap out = Bitmap.createBitmap(side, side, Bitmap.Config.ARGB_8888);
                          Canvas cv = new Canvas(out);
                          cv.drawBitmap(Bitmap.createScaledBitmap(src, w, h, true), (side - w) / 2f, (side - h) / 2f, null);
                          FileOutputStream fo = new FileOutputStream(new File(getFilesDir(), "ai_" + iconPkg + ".png"));
                          out.compress(Bitmap.CompressFormat.PNG, 100, fo);
                          fo.close();
                          iconCache.remove("f:" + iconPkg);
                          sp.edit().putString("icon_" + iconPkg, "file").apply();
                          refreshApps();
                          if (iconDone != null) iconDone.run();
                          Toast.makeText(this, "Значок збережено", Toast.LENGTH_SHORT).show();
                      } catch (Throwable t) {
                          Toast.makeText(this, "Не вдалось: " + t, Toast.LENGTH_LONG).show();
                      }
                      return;
                  }
                  if (req != 5 || res != RESULT_OK || data == null || data.getData() == null) return;
                  final Uri uri = data.getData();
                  new Thread(() -> {
                      try {
                          BitmapFactory.Options o = new BitmapFactory.Options();
                          o.inJustDecodeBounds = true;
                          InputStream in = getContentResolver().openInputStream(uri);
                          BitmapFactory.decodeStream(in, null, o);
                          in.close();
                          int s = 1;
                          while (o.outWidth / (s * 2) >= 1600) s *= 2;
                          o = new BitmapFactory.Options();
                          o.inSampleSize = s;
                          in = getContentResolver().openInputStream(uri);
                          Bitmap bm = BitmapFactory.decodeStream(in, null, o);
                          in.close();
                          FileOutputStream fo = new FileOutputStream(new File(getFilesDir(), "bg.jpg"));
                          bm.compress(Bitmap.CompressFormat.JPEG, 88, fo);
                          fo.close();
                          ui.post(this::loadBg);
                      } catch (Throwable t) {
                          ui.post(() -> Toast.makeText(this, "Не вдалось: " + t, Toast.LENGTH_LONG).show());
                      }
                  }).start();
              }

              void loadBg() {
                  File f = new File(getFilesDir(), "bg.jpg");
                  try {
                      if (f.exists()) {
                          bgCache = BitmapFactory.decodeFile(f.getAbsolutePath());
                          bg.setImageBitmap(bgCache);
                          return;
                      }
                  } catch (Throwable ignored) {
                  }
                  bg.setImageDrawable(null);
              }

              // ================= програми =================
              List<ResolveInfo> launchables() {
                  Intent i = new Intent(Intent.ACTION_MAIN);
                  i.addCategory(Intent.CATEGORY_LAUNCHER);
                  List<ResolveInfo> l = pm.queryIntentActivities(i, 0);
                  List<ResolveInfo> r = new ArrayList<ResolveInfo>();
                  for (ResolveInfo ri : l) if (!ri.activityInfo.packageName.equals(getPackageName())) r.add(ri);
                  final java.util.HashMap<ResolveInfo, String> lb = new java.util.HashMap<ResolveInfo, String>();
                  for (ResolveInfo ri : r) lb.put(ri, String.valueOf(ri.loadLabel(pm)));
                  Collections.sort(r, new Comparator<ResolveInfo>() {
                      @Override
                      public int compare(ResolveInfo a, ResolveInfo b) {
                          return lb.get(a).compareToIgnoreCase(lb.get(b));
                      }
                  });
                  return r;
              }

              String pkgFor(String key) {
                  String p = sp.getString("pkg_" + key, null);
                  if (p != null && pm.getLaunchIntentForPackage(p) != null) return p;
                  if (key.equals("radio") && pm.getLaunchIntentForPackage("com.example.radioapp") != null) return "com.example.radioapp";
                  for (ResolveInfo ri : launchables()) {
                      String label = String.valueOf(ri.loadLabel(pm)).toLowerCase(Locale.US);
                      String pk = ri.activityInfo.packageName.toLowerCase(Locale.US);
                      if (key.equals("nav") && (label.contains("igo") || pk.contains("igo"))) return ri.activityInfo.packageName;
                      if (key.equals("nav") && (label.contains("organic") || pk.contains("organicmaps"))) return ri.activityInfo.packageName;
                      if (key.equals("aimp") && (label.contains("aimp") || pk.contains("aimp"))) return ri.activityInfo.packageName;
                  }
                  return null;
              }

              void launchKey(String key) {
                  String p = pkgFor(key);
                  if (p == null) {
                      chooseApp(key, key.equals("nav") ? "Навігація" : key.equals("aimp") ? "AIMP" : "Радіо");
                      return;
                  }
                  launch(p);
              }

              void launch(String pkg) {
                  try {
                      Intent in = pm.getLaunchIntentForPackage(pkg);
                      sp.edit().putInt("cnt_" + pkg, sp.getInt("cnt_" + pkg, 0) + 1).apply();
                      if (in != null) startActivity(in);
                  } catch (Throwable t) {
                      Toast.makeText(this, "Не вдалось запустити: " + t, Toast.LENGTH_SHORT).show();
                  }
              }

              interface Pick {
                  void on(ResolveInfo ri);
              }

              void chooseApp(final String key, String title) {
                  final List<ResolveInfo> l = launchables();
                  String[] names = new String[l.size()];
                  for (int i = 0; i < names.length; i++) names[i] = String.valueOf(l.get(i).loadLabel(pm));
                  new AlertDialog.Builder(this).setTitle("Програма: " + title).setItems(names, (d, i) -> {
                      sp.edit().putString("pkg_" + key, l.get(i).activityInfo.packageName).apply();
                      refreshApps();
                  }).setNegativeButton("Скасувати", null).show();
              }

              List<String> chosenApps() {
                  List<String> r = new ArrayList<String>();
                  String s = sp.getString("apps", "");
                  if (!s.isEmpty()) for (String x : s.split(",")) if (pm.getLaunchIntentForPackage(x) != null) r.add(x);
                  return r;
              }

              void refreshApps() {
                  appsRow.removeAllViews();
                  List<String> l = chosenApps();
                  int n = sp.getInt("napps", 5);
                  for (int i = 0; i < n; i++) {
                      ImageView iv = new ImageView(this);
                      iv.setScaleType(ImageView.ScaleType.FIT_CENTER);
                      iv.setPadding(px(6), px(6), px(6), px(6));
                      if (i < l.size()) {
                          final String p = l.get(i);
                          Bitmap cu = customIcon(p);
                          if (cu != null) iv.setImageBitmap(cu);
                          else {
                              try {
                                  iv.setImageDrawable(pm.getApplicationIcon(p));
                              } catch (Throwable ignored) {
                              }
                          }
                          iv.setOnClickListener(v -> launch(p));
                      } else {
                          iv.setOnClickListener(v -> pickApps());
                      }
                      iv.setOnLongClickListener(v -> {
                          pickApps();
                          return true;
                      });
                      LinearLayout.LayoutParams ip = lp(0, -1, 1);
                      ip.setMargins(px(4), 0, px(4), 0);
                      appsRow.addView(iv, ip);
                  }
                  IconView ap = new IconView(this, 2);
                  ap.setOnClickListener(v -> appsDrawer());
                  LinearLayout.LayoutParams apl = lp(0, -1, 1);
                  apl.setMargins(px(4), 0, px(4), 0);
                  appsRow.addView(ap, apl);
                  IconView g = new IconView(this, 0);
                  g.setOnClickListener(v -> settingsMenu());
                  g.setOnLongClickListener(v -> {
                      try {
                          startActivity(new Intent(Settings.ACTION_SETTINGS));
                      } catch (Throwable e) {
                          Toast.makeText(this, "" + e, Toast.LENGTH_SHORT).show();
                      }
                      return true;
                  });
                  LinearLayout.LayoutParams gp = lp(0, -1, 1);
                  gp.setMargins(px(4), 0, px(4), 0);
                  appsRow.addView(g, gp);
              }

              void pickApps() {
                  final List<ResolveInfo> l = launchables();
                  final String[] names = new String[l.size()];
                  final boolean[] on = new boolean[l.size()];
                  List<String> cur = chosenApps();
                  for (int i = 0; i < names.length; i++) {
                      names[i] = String.valueOf(l.get(i).loadLabel(pm));
                      on[i] = cur.contains(l.get(i).activityInfo.packageName);
                  }
                  new AlertDialog.Builder(this).setTitle("Програми внизу")
                          .setMultiChoiceItems(names, on, (d, i, c) -> on[i] = c)
                          .setPositiveButton("Зберегти", (d, w) -> {
                              StringBuilder sb = new StringBuilder();
                              for (int i = 0; i < on.length; i++) {
                                  if (on[i]) {
                                      if (sb.length() > 0) sb.append(',');
                                      sb.append(l.get(i).activityInfo.packageName);
                                  }
                              }
                              sp.edit().putString("apps", sb.toString()).apply();
                              refreshApps();
                          })
                          .setNegativeButton("Скасувати", null).show();
              }

              // ================= радіо =================
              void toggleRadio() {
                  if (radioOn) {
                      tuner.stopRadio();
                      radioOn = false;
                  } else {
                      tuner.startRadio();
                      radioOn = true;
                  }
                  rPlay.setText(radioOn ? "■" : "▶");
              }

              @Override
              public void onState() {
                  if (!ready || tuner == null) return;
                  int f = tuner.freq;
                  if (f <= 0) return;
                  radioOn = true;
                  rPlay.setText("■");
                  String name = tuner.ps;
                  if (name == null || name.isEmpty()) {
                      int k = Lviv.match(f);
                      name = k >= 0 ? (String) Lviv.LIST[k][1] : "FM";
                  }
                  String fr = (f / 100) + "." + String.format(Locale.US, "%02d", f % 100) + " МГц";
                  tvStation.setText(name);
                  tvFreq.setText(fr);
                  sp.edit().putString("lname", name).putString("lfreq", fr).apply();
              }

              // ================= AIMP / медіа =================
              final MediaController.Callback ctlCb = new MediaController.Callback() {
                  @Override
                  public void onMetadataChanged(MediaMetadata m) {
                      showMeta(m);
                  }

                  @Override
                  public void onPlaybackStateChanged(PlaybackState s) {
                      updPlay(s);
                  }
              };

              void showMeta(MediaMetadata m) {
                  if (m == null) {
                      tvTrack.setText("AIMP");
                      tvArtist.setText("");
                      cover.setImageDrawable(null);
                      return;
                  }
                  CharSequence t = m.getText(MediaMetadata.METADATA_KEY_TITLE);
                  CharSequence a = m.getText(MediaMetadata.METADATA_KEY_ARTIST);
                  tvTrack.setText(t == null ? "AIMP" : t);
                  tvArtist.setText(a == null ? "" : a);
                  Bitmap bm = m.getBitmap(MediaMetadata.METADATA_KEY_ALBUM_ART);
                  if (bm == null) bm = m.getBitmap(MediaMetadata.METADATA_KEY_ART);
                  if (bm == null) bm = m.getBitmap(MediaMetadata.METADATA_KEY_DISPLAY_ICON);
                  cover.setImageBitmap(bm);
              }

              void refreshMedia() {
                  try {
                      MediaSessionManager msm = (MediaSessionManager) getSystemService(Context.MEDIA_SESSION_SERVICE);
                      List<MediaController> l = msm.getActiveSessions(new ComponentName(this, MediaListener.class));
                      needAccess = false;
                      String want = pkgFor("aimp");
                      MediaController f = null;
                      for (MediaController c : l) {
                          if (want != null && c.getPackageName().equals(want)) {
                              f = c;
                              break;
                          }
                      }
                      if (f == null) {
                          for (MediaController c : l) {
                              if (c.getPackageName().toLowerCase(Locale.US).contains("aimp")) f = c;
                          }
                      }
                      if (f == null) {
                          if (ctl != null) {
                              try {
                                  ctl.unregisterCallback(ctlCb);
                              } catch (Throwable ignored) {
                              }
                          }
                          ctl = null;
                          aPlay.setText("▶");
                          tvTrack.setText("AIMP");
                          tvArtist.setText("");
                          cover.setImageDrawable(null);
                          return;
                      }
                      if (ctl == null || !ctl.getSessionToken().equals(f.getSessionToken())) {
                          if (ctl != null) {
                              try {
                                  ctl.unregisterCallback(ctlCb);
                              } catch (Throwable ignored) {
                              }
                          }
                          ctl = f;
                          ctl.registerCallback(ctlCb);
                      }
                      showMeta(ctl.getMetadata());
                      updPlay(ctl.getPlaybackState());
                  } catch (SecurityException e) {
                      needAccess = true;
                      tvTrack.setText("Дай доступ до сповіщень");
                      tvArtist.setText("(натисни тут)");
                  } catch (Throwable ignored) {
                  }
              }

              void mediaKey(int code) {
                  try {
                      AudioManager am = (AudioManager) getSystemService(Context.AUDIO_SERVICE);
                      am.dispatchMediaKeyEvent(new KeyEvent(KeyEvent.ACTION_DOWN, code));
                      am.dispatchMediaKeyEvent(new KeyEvent(KeyEvent.ACTION_UP, code));
                  } catch (Throwable ignored) {
                  }
              }

              void mediaCmd(int what) {
                  try {
                      if (ctl != null) {
                          if (what == 0) ctl.getTransportControls().skipToPrevious();
                          else if (what == 2) ctl.getTransportControls().skipToNext();
                          else {
                              PlaybackState ps = ctl.getPlaybackState();
                              boolean playing = ps != null && ps.getState() == PlaybackState.STATE_PLAYING;
                              if (playing) ctl.getTransportControls().pause();
                              else ctl.getTransportControls().play();
                              aPlay.setText(playing ? "▶" : "❚❚");
                          }
                          return;
                      }
                  } catch (Throwable ignored) {
                  }
                  mediaKey(what == 0 ? KeyEvent.KEYCODE_MEDIA_PREVIOUS : what == 2 ? KeyEvent.KEYCODE_MEDIA_NEXT : KeyEvent.KEYCODE_MEDIA_PLAY_PAUSE);
              }
          }
