              List<ResolveInfo> launchables() {
                  Intent i = new Intent(Intent.ACTION_MAIN);
                  i.addCategory(Intent.CATEGORY_LAUNCHER);
                  List<ResolveInfo> l = pm.queryIntentActivities(i, 0);
                  List<ResolveInfo> r = new ArrayList<ResolveInfo>();
                  for (ResolveInfo ri : l) if (!ri.activityInfo.packageName.equals(getPackageName())) r.add(ri);
                  Collections.sort(r, new Comparator<ResolveInfo>() {
                      @Override
                      public int compare(ResolveInfo a, ResolveInfo b) {
                          return String.valueOf(a.loadLabel(pm)).compareToIgnoreCase(String.valueOf(b.loadLabel(pm)));
                      }
                  });
                  return r;
              }

              String pkgFor(String key) {
                  String p = sp.getString("pkg_" + key, null);
                  if (p != null && pm.getLaunchIntentForPackage(p) != null) return p;
                  if (key.equals("radio") && pm.getLaunchIntentForPackage("com.example.radioapp") != null) return "com.example.radioapp";
                  for (ResolveInfo ri : launchables()) {
                      String label = String.valueOf(ri.loadLabel(pm)).toLowerCase(Locale.US);
                      String pk = ri.activityInfo.packageName.toLowerCase(Locale.US);
                      if (key.equals("nav") && (label.contains("igo") || pk.contains("igo"))) return ri.activityInfo.packageName;
                      if (key.equals("nav") && (label.contains("organic") || pk.contains("organicmaps"))) return ri.activityInfo.packageName;
                      if (key.equals("aimp") && (label.contains("aimp") || pk.contains("aimp"))) return ri.activityInfo.packageName;
                  }
                  return null;
              }

              void launchKey(String key) {
                  String p = pkgFor(key);
                  if (p == null) {
                      chooseApp(key, key.equals("nav") ? "Навігація" : key.equals("aimp") ? "AIMP" : "Радіо");
                      return;
                  }
                  launch(p);
              }

              void launch(String pkg) {
                  try {
                      Intent in = pm.getLaunchIntentForPackage(pkg);
                      if (in != null) startActivity(in);
                  } catch (Throwable t) {
                      Toast.makeText(this, "Не вдалось запустити: " + t, Toast.LENGTH_SHORT).show();
                  }
              }

