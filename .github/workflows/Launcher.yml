              @Override
              public void onState() {
                  if (!ready || tuner == null) return;
                  int f = tuner.freq;
                  if (f <= 0) return;
                  radioOn = true;
                  rPlay.setText("■");
                  String name = tuner.ps;
                  if (name == null || name.isEmpty()) {
                      int k = Lviv.match(f);
                      name = k >= 0 ? (String) Lviv.LIST[k][1] : "FM";
                  }
                  String fr = (f / 100) + "." + String.format(Locale.US, "%02d", f % 100) + " МГц";
                  tvStation.setText(name);
                  tvFreq.setText(fr);
                  sp.edit().putString("lname", name).putString("lfreq", fr).apply();
              }

              // ================= AIMP / медіа =================
              final MediaController.Callback ctlCb = new MediaController.Callback() {
                  @Override
                  public void onMetadataChanged(MediaMetadata m) {
                      showMeta(m);
                  }

                  @Override
                  public void onPlaybackStateChanged(PlaybackState s) {
                      updPlay(s);
                  }
              };

              void showMeta(MediaMetadata m) {
                  if (m == null) {
                      tvTrack.setText("AIMP");
                      tvArtist.setText("");
                      cover.setImageDrawable(null);
                      return;
                  }
                  CharSequence t = m.getText(MediaMetadata.METADATA_KEY_TITLE);
                  CharSequence a = m.getText(MediaMetadata.METADATA_KEY_ARTIST);
                  tvTrack.setText(t == null ? "AIMP" : t);
                  tvArtist.setText(a == null ? "" : a);
                  Bitmap bm = m.getBitmap(MediaMetadata.METADATA_KEY_ALBUM_ART);
                  if (bm == null) bm = m.getBitmap(MediaMetadata.METADATA_KEY_ART);
                  if (bm == null) bm = m.getBitmap(MediaMetadata.METADATA_KEY_DISPLAY_ICON);
                  cover.setImageBitmap(bm);
              }

              void refreshMedia() {
                  try {
                      MediaSessionManager msm = (MediaSessionManager) getSystemService(Context.MEDIA_SESSION_SERVICE);
                      List<MediaController> l = msm.getActiveSessions(new ComponentName(this, MediaListener.class));
                      needAccess = false;
                      String want = pkgFor("aimp");
                      MediaController f = null;
                      for (MediaController c : l) {
                          if (want != null && c.getPackageName().equals(want)) {
                              f = c;
                              break;
                          }
                      }
                      if (f == null) {
                          for (MediaController c : l) {
                              if (c.getPackageName().toLowerCase(Locale.US).contains("aimp")) f = c;
                          }
                      }
                      if (f == null) {
                          if (ctl != null) {
                              try {
                                  ctl.unregisterCallback(ctlCb);
                              } catch (Throwable ignored) {
                              }
                          }
                          ctl = null;
                          aPlay.setText("▶");
                          tvTrack.setText("AIMP");
                          tvArtist.setText("");
                          cover.setImageDrawable(null);
                          return;
                      }
                      if (ctl == null || !ctl.getSessionToken().equals(f.getSessionToken())) {
                          if (ctl != null) {
                              try {
                                  ctl.unregisterCallback(ctlCb);
                              } catch (Throwable ignored) {
                              }
                          }
                          ctl = f;
                          ctl.registerCallback(ctlCb);
                      }
                      showMeta(ctl.getMetadata());
                      updPlay(ctl.getPlaybackState());
                  } catch (SecurityException e) {
                      needAccess = true;
                      tvTrack.setText("Дай доступ до сповіщень");
                      tvArtist.setText("(натисни тут)");
                  } catch (Throwable ignored) {
                  }
              }

              void mediaKey(int code) {
                  try {
                      AudioManager am = (AudioManager) getSystemService(Context.AUDIO_SERVICE);
                      am.dispatchMediaKeyEvent(new KeyEvent(KeyEvent.ACTION_DOWN, code));
                      am.dispatchMediaKeyEvent(new KeyEvent(KeyEvent.ACTION_UP, code));
                  } catch (Throwable ignored) {
                  }
              }

              void mediaCmd(int what) {
                  try {
                      if (ctl != null) {
                          if (what == 0) ctl.getTransportControls().skipToPrevious();
                          else if (what == 2) ctl.getTransportControls().skipToNext();
                          else {
                              PlaybackState ps = ctl.getPlaybackState();
                              boolean playing = ps != null && ps.getState() == PlaybackState.STATE_PLAYING;
                              if (playing) ctl.getTransportControls().pause();
                              else ctl.getTransportControls().play();
                              aPlay.setText(playing ? "▶" : "❚❚");
                          }
                          return;
                      }
                  } catch (Throwable ignored) {
                  }
                  mediaKey(what == 0 ? KeyEvent.KEYCODE_MEDIA_PREVIOUS : what == 2 ? KeyEvent.KEYCODE_MEDIA_NEXT : KeyEvent.KEYCODE_MEDIA_PLAY_PAUSE);
              }
          }
