              // ================= годинник =================
              int tickN = 0;

              void tick() {
                  Date d = new Date();
                  tvClock.setText(new SimpleDateFormat("HH:mm", Locale.US).format(d));
                  Locale uk = new Locale("uk", "UA");
                  String ds = new SimpleDateFormat("EEEE, d MMMM yyyy", uk).format(d);
                  if (!ds.isEmpty()) ds = ds.substring(0, 1).toUpperCase(uk) + ds.substring(1);
                  tvDate.setText(ds);
                  if (System.currentTimeMillis() - lastFix > 6000) tvSpeed.setText("—");
                  if (++tickN % 3 == 0) refreshMedia();
                  ui.postDelayed(this::tick, 1000);
              }

              // ================= GPS і поїздка =================
              final LocationListener locL = new LocationListener() {
                  @Override
                  public void onLocationChanged(Location l) {
                      long now = System.currentTimeMillis();
                      float v = l.hasSpeed() ? l.getSpeed() * 3.6f : 0f;
                      if (v < 2f) v = 0f;
                      if (lastLoc > 0 && v > 0) {
                          float dt = Math.min(3f, (now - lastLoc) / 1000f);
                          distKm += v * dt / 3600f;
                          movH += dt / 3600f;
                      }
                      lastLoc = now;
                      lastFix = now;
                      if (v > maxKmh) maxKmh = v;
                      tvSpeed.setText(String.valueOf(Math.round(v)));
                      showTrip();
                      if (now - lastSave > 15000) saveTrip();
                  }

                  @Override
                  public void onStatusChanged(String p, int s, Bundle e) {
                  }

                  @Override
                  public void onProviderEnabled(String p) {
                  }

                  @Override
                  public void onProviderDisabled(String p) {
                  }
              };

              void showTrip() {
                  float avg = movH > 0.0005f ? distKm / movH : 0f;
                  tvAvg.setText("Сер.  " + Math.round(avg));
                  tvMax.setText("Макс. " + Math.round(maxKmh));
              }

              void saveTrip() {
                  lastSave = System.currentTimeMillis();
                  sp.edit().putFloat("max", maxKmh).putFloat("dist", distKm).putFloat("mov", movH).apply();
              }

              void resetTrip() {
                  maxKmh = 0;
                  distKm = 0;
                  movH = 0;
                  saveTrip();
                  showTrip();
                  Toast.makeText(this, "Поїздку скинуто", Toast.LENGTH_SHORT).show();
              }

              final GpsStatus.Listener stL = new GpsStatus.Listener() {
                  @Override
                  public void onGpsStatusChanged(int event) {
                      try {
                          if (event != GpsStatus.GPS_EVENT_SATELLITE_STATUS || lm == null) return;
                          GpsStatus st = lm.getGpsStatus(null);
                          int used = 0, total = 0;
                          for (GpsSatellite s : st.getSatellites()) {
                              total++;
                              if (s.usedInFix()) used++;
                          }
                          tvSats.setText(" " + used + "/" + total);
                      } catch (Throwable ignored) {
                      }
                  }
              };

              @SuppressWarnings("deprecation")
              void startGps() {
                  showTrip();
                  if (Build.VERSION.SDK_INT >= 23
                          && checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION) != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(new String[]{Manifest.permission.ACCESS_FINE_LOCATION}, 2);
                      return;
                  }
                  try {
                      lm = (LocationManager) getSystemService(LOCATION_SERVICE);
                      lm.requestLocationUpdates(LocationManager.GPS_PROVIDER, 1000, 0, locL);
                      lm.addGpsStatusListener(stL);
                  } catch (Throwable t) {
                      tvSats.setText(" ✕");
                  }
              }

              @Override
              public void onRequestPermissionsResult(int req, String[] perms, int[] res) {
                  super.onRequestPermissionsResult(req, perms, res);
                  if (req == 2) startGps();
              }

