                  boolean fl = follow && hasFix;
                  float[] me = fl ? new float[]{pvx, pvy} : (hasFix ? scr(myLat, myLon) : null);
                  if (markLat != null) {
                      float[] m = scr(markLat, markLon);
                      if (me != null) {
                          p.setColor(0xFFE53935);
                          p.setStrokeWidth(4 * density);
                          p.setStyle(Paint.Style.STROKE);
                          cv.drawLine(me[0], me[1], m[0], m[1], p);
                      }
                      p.setStyle(Paint.Style.FILL);
                      p.setColor(0xFFE53935);
                      cv.drawCircle(m[0], m[1], 11 * density, p);
                      p.setColor(0xFFFFFFFF);
                      cv.drawCircle(m[0], m[1], 4 * density, p);
                  }
                  if (me != null) {
                      cv.save();
                      cv.translate(me[0], me[1]);
                      cv.rotate(fixBearing - rot);
                      if (markStyle >= 5 && markBmp != null) {
                          float s2 = 26 * density;
                          Paint bp = new Paint(Paint.FILTER_BITMAP_FLAG | Paint.ANTI_ALIAS_FLAG);
                          cv.drawBitmap(markBmp, null, new RectF(-s2, -s2, s2, s2), bp);
                      } else {
                          drawMarker(cv, p, markStyle, 18 * density, markColor, density);
                      }
                      cv.restore();
                  }
                  p.setStyle(Paint.Style.FILL);
                  if (fl) postInvalidateOnAnimation();
              }

              /** Значок моєї позиції (дивиться вгору), s - розмір. */
              public static void drawMarker(Canvas cv, Paint p, int st, float s, int fill, float d) {
                  Path a = new Path();
                  p.setStrokeJoin(Paint.Join.ROUND);
                  if (st == 1) {
                      p.setStyle(Paint.Style.FILL);
                      p.setColor(0xFF1A1A1A);
                      float[][] wh = {{-0.64f, -0.68f}, {0.52f, -0.68f}, {-0.64f, 0.34f}, {0.52f, 0.34f}};
                      for (float[] w : wh) cv.drawRoundRect(new RectF(s * w[0], s * w[1], s * (w[0] + 0.12f), s * (w[1] + 0.4f)), s * 0.04f, s * 0.04f, p);
                      a.addRoundRect(new RectF(-s * 0.52f, -s, s * 0.52f, s), s * 0.36f, s * 0.36f, Path.Direction.CW);
                      p.setColor(fill);
                      cv.drawPath(a, p);
                      p.setStyle(Paint.Style.STROKE);
                      p.setStrokeWidth(2.2f * d);
                      p.setColor(0xFFFFFFFF);
                      cv.drawPath(a, p);
                      p.setStyle(Paint.Style.FILL);
                      p.setColor(0xDD10151C);
                      cv.drawRoundRect(new RectF(-s * 0.38f, -s * 0.5f, s * 0.38f, -s * 0.12f), s * 0.12f, s * 0.12f, p);
                      cv.drawRoundRect(new RectF(-s * 0.38f, s * 0.36f, s * 0.38f, s * 0.64f), s * 0.1f, s * 0.1f, p);
                      return;
                  }
                  if (st == 2) {
                      a.moveTo(0, -s * 1.15f);
                      a.lineTo(s * 0.45f, -s * 0.4f);
                      a.lineTo(-s * 0.45f, -s * 0.4f);
                      a.close();
                      a.addCircle(0, 0.1f * s, s * 0.62f, Path.Direction.CW);
                  } else if (st == 3) {
                      a.moveTo(0, -s);
                      a.lineTo(s * 0.9f, s * 0.85f);
                      a.lineTo(s * 0.55f, s * 0.85f);
                      a.lineTo(0, -s * 0.1f);
                      a.lineTo(-s * 0.55f, s * 0.85f);
                      a.lineTo(-s * 0.9f, s * 0.85f);
                      a.close();
                  } else if (st == 4) {
                      Path c = new Path();
                      c.addCircle(0, s * 0.25f, s * 0.62f, Path.Direction.CW);
                      Path t = new Path();
                      t.moveTo(0, -s * 1.05f);
                      t.lineTo(s * 0.57f, s * 0.05f);
                      t.lineTo(-s * 0.57f, s * 0.05f);
                      t.close();
                      a.op(c, t, Path.Op.UNION);
                  } else {
                      a.moveTo(0, -s);
                      a.lineTo(s * 0.75f, s * 0.8f);
                      a.lineTo(0, s * 0.4f);
                      a.lineTo(-s * 0.75f, s * 0.8f);
                      a.close();
                  }
                  p.setStyle(Paint.Style.FILL);
                  p.setColor(fill);
                  cv.drawPath(a, p);
                  p.setStyle(Paint.Style.STROKE);
                  p.setStrokeWidth(2.5f * d);
                  p.setColor(0xFFFFFFFF);
                  cv.drawPath(a, p);
                  if (st == 2 || st == 4) {
                      p.setStyle(Paint.Style.FILL);
                      cv.drawCircle(0, st == 2 ? s * 0.1f : s * 0.25f, s * 0.2f, p);
                  }
              }

              @Override
              public boolean onTouchEvent(MotionEvent e) {
                  sg.onTouchEvent(e);
                  gd.onTouchEvent(e);
