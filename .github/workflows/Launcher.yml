              int blendOver(int fg, int base) {
                  float a = android.graphics.Color.alpha(fg) / 255f;
                  int r = Math.round(android.graphics.Color.red(fg) * a + android.graphics.Color.red(base) * (1 - a));
                  int g = Math.round(android.graphics.Color.green(fg) * a + android.graphics.Color.green(base) * (1 - a));
                  int b = Math.round(android.graphics.Color.blue(fg) * a + android.graphics.Color.blue(base) * (1 - a));
                  return 0xFF000000 | (r << 16) | (g << 8) | b;
              }

