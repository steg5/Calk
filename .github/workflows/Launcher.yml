              // ================= годинник =================
              int tickN = 0;

              void tick() {
                  Date d = new Date();
                  tvClock.setText(new SimpleDateFormat("HH:mm", Locale.US).format(d));
                  Locale uk = new Locale("uk", "UA");
                  String ds = new SimpleDateFormat("EEEE, d MMMM yyyy", uk).format(d);
                  if (!ds.isEmpty()) ds = ds.substring(0, 1).toUpperCase(uk) + ds.substring(1);
                  tvDate.setText(ds);
                  if (System.currentTimeMillis() - lastFix > 6000) tvSpeed.setText("—");
                  if (++tickN % 3 == 0) refreshMedia();
                  if (map != null && navZoom != null) navZoom.setText(String.format(Locale.US, "%.1f", map.zoom));
                  ui.postDelayed(this::tick, 1000);
              }

              // ================= GPS і поїздка =================
              Location prevLoc;
              Object gnssCb;

              @android.annotation.TargetApi(24)
              void regGnss() {
                  android.location.GnssStatus.Callback cb = new android.location.GnssStatus.Callback() {
                      @Override
                      public void onSatelliteStatusChanged(android.location.GnssStatus st) {
                          int total = st.getSatelliteCount(), used = 0;
                          for (int i = 0; i < total; i++) if (st.usedInFix(i)) used++;
                          setSats(used, total);
                      }
                  };
                  gnssCb = cb;
                  lm.registerGnssStatusCallback(cb);
              }

              final LocationListener locL = new LocationListener() {
                  @Override
                  public void onLocationChanged(Location l) {
                      long now = System.currentTimeMillis();
                      if (map != null) map.setMyLocation(l.getLatitude(), l.getLongitude(), l.hasBearing() ? l.getBearing() : -1f, l.hasSpeed() ? l.getSpeed() : 0f);
                      float v = 0f;
                      if (l.hasSpeed()) {
                          v = l.getSpeed() * 3.6f;
                      } else if (prevLoc != null) {
                          float dt = (l.getTime() - prevLoc.getTime()) / 1000f;
                          if (dt > 0.3f && dt < 10f) v = prevLoc.distanceTo(l) / dt * 3.6f;
                      }
                      prevLoc = l;
                      if (v < 2f) v = 0f;
                      if (lastLoc > 0 && v > 0) {
                          float dt = Math.min(3f, (now - lastLoc) / 1000f);
                          distKm += v * dt / 3600f;
                          addKm(v * dt / 3600f);
                          movH += dt / 3600f;
                      }
                      lastLoc = now;
                      lastFix = now;
                      if (v > maxKmh) maxKmh = v;
                      tvSpeed.setText(String.valueOf(Math.round(v)));
                      showTrip();
                      if (now - lastSave > 15000) saveTrip();
                  }

                  @Override
                  public void onStatusChanged(String p, int s, Bundle e) {
                  }

                  @Override
                  public void onProviderEnabled(String p) {
                  }

                  @Override
                  public void onProviderDisabled(String p) {
                  }
              };

              void showTrip() {
                  float avg = movH > 0.0005f ? distKm / movH : 0f;
                  tvAvg.setText("Сер.  " + Math.round(avg));
                  tvMax.setText("Макс. " + Math.round(maxKmh));
                  updateOilBadge();
              }

              void saveTrip() {
                  lastSave = System.currentTimeMillis();
                  sp.edit().putFloat("max", maxKmh).putFloat("dist", distKm).putFloat("mov", movH)
                          .putFloat("odo", odo).putFloat("oil", oilKm).apply();
                  if (pendDay > 0) {
                      String k = ymd(new Date());
                      days.edit().putFloat(k, days.getFloat(k, 0) + pendDay).apply();
                      pendDay = 0;
                  }
              }

              void resetTrip() {
                  maxKmh = 0;
                  distKm = 0;
                  movH = 0;
                  saveTrip();
                  showTrip();
                  Toast.makeText(this, "Поїздку скинуто", Toast.LENGTH_SHORT).show();
              }

              final GpsStatus.Listener stL = new GpsStatus.Listener() {
                  @Override
                  public void onGpsStatusChanged(int event) {
                      try {
                          if (event != GpsStatus.GPS_EVENT_SATELLITE_STATUS || lm == null) return;
                          GpsStatus st = lm.getGpsStatus(null);
                          int used = 0, total = 0;
                          for (GpsSatellite s : st.getSatellites()) {
                              total++;
                              if (s.usedInFix()) used++;
                          }
                          setSats(used, total);
                      } catch (Throwable ignored) {
                      }
                  }
              };

              @SuppressWarnings("deprecation")
              void startGps() {
                  showTrip();
                  if (Build.VERSION.SDK_INT >= 23 && !askedPerm
                          && (checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION) != PackageManager.PERMISSION_GRANTED
                          || checkSelfPermission(Manifest.permission.READ_EXTERNAL_STORAGE) != PackageManager.PERMISSION_GRANTED)) {
                      askedPerm = true;
                      requestPermissions(new String[]{Manifest.permission.ACCESS_FINE_LOCATION, Manifest.permission.READ_EXTERNAL_STORAGE}, 2);
                      return;
                  }
                  if (Build.VERSION.SDK_INT >= 23 && checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION) != PackageManager.PERMISSION_GRANTED) return;
                  try {
                      lm = (LocationManager) getSystemService(LOCATION_SERVICE);
                      lm.requestLocationUpdates(LocationManager.GPS_PROVIDER, 1000, 0, locL);
                      if (Build.VERSION.SDK_INT >= 24) regGnss();
                      else lm.addGpsStatusListener(stL);
                  } catch (Throwable t) {
                      tvSats.setText(" ✕");
                  }
              }

              @Override
              public void onRequestPermissionsResult(int req, String[] perms, int[] res) {
                  super.onRequestPermissionsResult(req, perms, res);
                  if (req == 2) {
                      startGps();
                      openMap();
                  }
                  if (req == 3 && svcCol != null) rebuildService();
              }

              // ================= яскравість =================
              int minB() {
                  return sp.getInt("minb", 10);
              }

              int curB() {
                  return Settings.System.getInt(getContentResolver(), Settings.System.SCREEN_BRIGHTNESS, 255);
              }

              void updateBright() {
                  bIcon.moon = curB() < 100;
                  bIcon.invalidate();
                  if (map != null && sp.getBoolean("autonav", true)) {
                      map.night = curB() < 100;
                      if (nIcon != null) {
                          nIcon.moon = map.night;
                          nIcon.invalidate();
                      }
                      map.invalidate();
                  }
              }

              void toggleBright() {
                  if (Build.VERSION.SDK_INT >= 23 && !Settings.System.canWrite(this)) {
                      try {
                          startActivity(new Intent(Settings.ACTION_MANAGE_WRITE_SETTINGS, Uri.parse("package:" + getPackageName())));
                      } catch (Throwable ignored) {
                      }
                      Toast.makeText(this, "Дозволь зміну системних налаштувань і натисни ще раз", Toast.LENGTH_LONG).show();
                      return;
                  }
                  setBright(curB() < 100 ? 255 : minB());
              }

              void setBright(int v) {
                  try {
                      Settings.System.putInt(getContentResolver(), Settings.System.SCREEN_BRIGHTNESS_MODE, 0);
                      Settings.System.putInt(getContentResolver(), Settings.System.SCREEN_BRIGHTNESS, v);
                  } catch (Throwable t) {
                      Toast.makeText(this, "Не вдалось змінити яскравість: " + t, Toast.LENGTH_LONG).show();
                  }
                  updateBright();
              }

