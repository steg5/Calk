              // ================= карти =================
              File[] mapFiles() {
                  File dir = new File(android.os.Environment.getExternalStorageDirectory(), "Nav");
                  File[] fs = dir.listFiles();
                  List<File> l = new ArrayList<File>();
                  if (fs != null) for (File f : fs) if (f.isFile() && f.getName().toLowerCase(Locale.US).endsWith(".mbtiles")) l.add(f);
                  Collections.sort(l, new Comparator<File>() {
                      @Override
                      public int compare(File a, File b) {
                          return a.getName().compareToIgnoreCase(b.getName());
                      }
                  });
                  return l.toArray(new File[0]);
              }

              File chosenMap() {
                  File[] fs = mapFiles();
                  String sel = sp.getString("mapfile", "");
                  for (File f : fs) if (f.getName().equals(sel)) return f;
                  return fs.length > 0 ? fs[0] : null;
              }

              String mapName() {
                  File f = chosenMap();
                  return f == null ? "немає файлів у Nav" : f.getName().replaceAll("\\.mbtiles$", "");
              }

              void openMap() {
                  if (map == null) return;
                  File f = chosenMap();
                  if (f != null && f.canRead()) map.open(f.getAbsolutePath());
                  map.invalidate();
              }

              void mapMenu() {
                  final File[] fs = mapFiles();
                  if (fs.length == 0) {
                      Toast.makeText(this, "У папці Nav (корінь пам'яті) немає файлів .mbtiles", Toast.LENGTH_LONG).show();
                      return;
                  }
                  File cur = chosenMap();
                  int sel = 0;
                  String[] names = new String[fs.length];
                  for (int i = 0; i < fs.length; i++) {
                      names[i] = fs[i].getName() + "  (" + (fs[i].length() / 1048576) + " МБ)";
                      if (cur != null && fs[i].equals(cur)) sel = i;
                  }
                  new AlertDialog.Builder(this).setTitle("Карта").setSingleChoiceItems(names, sel, (dd, i) -> {
                      sp.edit().putString("mapfile", fs[i].getName()).apply();
                      dd.dismiss();
                      openMap();
                  }).setNegativeButton("Скасувати", null).show();
              }

              void zoomMenu(final boolean isMin) {
                  final String[] n = {"9", "10", "11", "12", "13", "14", "15", "16", "17"};
                  float cur = sp.getFloat(isMin ? "azmin" : "azmax", isMin ? 13f : 15f);
                  new AlertDialog.Builder(this)
                          .setTitle(isMin ? "Мінімальний масштаб (траса)" : "Максимальний масштаб (місто)")
                          .setSingleChoiceItems(n, Math.max(0, Math.min(8, Math.round(cur) - 9)), (dd, i) -> {
                              float val = 9 + i;
                              float mn = sp.getFloat("azmin", 13f), mx = sp.getFloat("azmax", 15f);
                              if (isMin) {
                                  mn = val;
                                  if (mx < mn) mx = mn;
                              } else {
                                  mx = val;
                                  if (mn > mx) mn = mx;
                              }
