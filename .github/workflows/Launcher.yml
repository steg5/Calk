              class AppGrid extends ViewGroup {
                  final int cols = 6;
                  List<AppEntry> items = new ArrayList<AppEntry>();
                  GridCb cb;
                  ScrollView scroll;
                  final int cellH = px(150);
                  final int slop = px(14);
                  int downIdx = -1, tgt = -1;
                  float dx0, dy0, rawX, rawY;
                  boolean armed, dragging;

                  AppGrid(Context c) {
                      super(c);
                      setChildrenDrawingOrderEnabled(true);
                      setClipChildren(false);
                  }

                  void setItems(List<AppEntry> l) {
                      items = l;
                      removeAllViews();
                      for (AppEntry e : l) {
                          LinearLayout cell = new LinearLayout(getContext());
                          cell.setOrientation(LinearLayout.VERTICAL);
                          cell.setGravity(Gravity.CENTER_HORIZONTAL);
                          cell.setPadding(px(2), px(8), px(2), px(4));
                          ImageView iv = new ImageView(getContext());
                          Bitmap cu = customIcon(e.pkg);
                          iv.setImageBitmap(cu != null ? cu : e.icon);
                          cell.addView(iv, lp(104, 104, 0));
                          TextView tv = text(appName(e.pkg, e.label), 20, TXT, false);
                          tv.setGravity(Gravity.CENTER);
                          tv.setSingleLine(true);
                          tv.setEllipsize(android.text.TextUtils.TruncateAt.END);
                          cell.addView(tv, lp(-1, -2, 0));
                          addView(cell);
                      }
                      requestLayout();
                  }

                  @Override
                  protected void onMeasure(int ws, int hs) {
                      int w = MeasureSpec.getSize(ws);
                      int n = getChildCount();
                      int rows = Math.max(1, (n + cols - 1) / cols);
                      int cw = w / cols;
                      for (int i = 0; i < n; i++)
                          getChildAt(i).measure(MeasureSpec.makeMeasureSpec(cw, MeasureSpec.EXACTLY), MeasureSpec.makeMeasureSpec(cellH, MeasureSpec.EXACTLY));
                      setMeasuredDimension(w, rows * cellH);
                  }

                  @Override
                  protected void onLayout(boolean ch, int l, int t, int r, int b) {
                      int cw = (r - l) / cols;
                      for (int i = 0; i < getChildCount(); i++) {
                          int rr = i / cols, cc = i % cols;
                          getChildAt(i).layout(cc * cw, rr * cellH, (cc + 1) * cw, (rr + 1) * cellH);
                      }
                  }

                  @Override
                  protected int getChildDrawingOrder(int count, int i) {
                      if (dragging && downIdx >= 0 && downIdx < count) {
                          if (i == count - 1) return downIdx;
                          return i >= downIdx ? i + 1 : i;
                      }
                      return i;
                  }

                  int indexAt(float x, float y) {
                      int n = items.size();
                      if (n == 0) return -1;
                      int cw = Math.max(1, getWidth() / cols);
                      int c = Math.max(0, Math.min(cols - 1, (int) (x / cw)));
                      int r = Math.max(0, (int) (y / cellH));
                      return Math.min(n - 1, r * cols + c);
                  }

                  final Runnable arm = new Runnable() {
                      @Override
                      public void run() {
                          if (downIdx < 0 || downIdx >= getChildCount()) return;
                          armed = true;
                          performHapticFeedback(android.view.HapticFeedbackConstants.LONG_PRESS);
                          if (getParent() != null) getParent().requestDisallowInterceptTouchEvent(true);
                          View c = getChildAt(downIdx);
                          c.setScaleX(1.08f);
                          c.setScaleY(1.08f);
                      }
                  };

                  final Runnable auto = new Runnable() {
                      @Override
                      public void run() {
                          if (!dragging) return;
                          if (scroll != null) {
                              int[] sl = new int[2];
                              scroll.getLocationOnScreen(sl);
                              if (rawY < sl[1] + px(90)) scroll.scrollBy(0, -px(16));
                              else if (rawY > sl[1] + scroll.getHeight() - px(90)) scroll.scrollBy(0, px(16));
                          }
                          updateDrag();
                          postDelayed(this, 16);
                      }
                  };

                  void updateDrag() {
                      if (downIdx < 0 || downIdx >= getChildCount()) return;
                      int[] loc = new int[2];
                      getLocationOnScreen(loc);
                      float lx = rawX - loc[0], ly = rawY - loc[1];
                      View c = getChildAt(downIdx);
                      c.setTranslationX(lx - (c.getLeft() + c.getWidth() / 2f));
                      c.setTranslationY(ly - (c.getTop() + c.getHeight() / 2f));
                      int t = indexAt(lx, ly);
                      if (t != tgt) {
                          if (tgt >= 0 && tgt < getChildCount()) getChildAt(tgt).setBackground(null);
                          tgt = t;
                          if (tgt >= 0 && tgt != downIdx) getChildAt(tgt).setBackground(rounded((ACC & 0x00FFFFFF) | 0x55000000, 16));
                      }
                  }

                  void resetDrag() {
                      removeCallbacks(arm);
                      removeCallbacks(auto);
                      for (int i = 0; i < getChildCount(); i++) {
                          View c = getChildAt(i);
                          c.setScaleX(1f);
                          c.setScaleY(1f);
                          c.setTranslationX(0);
                          c.setTranslationY(0);
                          c.setBackground(null);
                      }
                      armed = false;
                      dragging = false;
                      downIdx = -1;
                      tgt = -1;
                      invalidate();
                  }

                  @Override
                  public boolean onTouchEvent(MotionEvent e) {
                      switch (e.getActionMasked()) {
                          case MotionEvent.ACTION_DOWN:
                              downIdx = indexAt(e.getX(), e.getY());
                              if (downIdx < 0) return false;
                              dx0 = e.getX();
                              dy0 = e.getY();
                              rawX = e.getRawX();
                              rawY = e.getRawY();
                              armed = false;
                              dragging = false;
                              postDelayed(arm, 420);
                              return true;
                          case MotionEvent.ACTION_MOVE:
                              rawX = e.getRawX();
                              rawY = e.getRawY();
                              float mv = Math.max(Math.abs(e.getX() - dx0), Math.abs(e.getY() - dy0));
                              if (!armed) {
                                  if (mv > slop) {
                                      removeCallbacks(arm);
                                      downIdx = -1;
                                  }
                                  return true;
                              }
                              if (!dragging && mv > slop) {
                                  dragging = true;
                                  invalidate();
                                  post(auto);
                              }
                              if (dragging) updateDrag();
                              return true;
                          case MotionEvent.ACTION_UP:
                              removeCallbacks(arm);
                              removeCallbacks(auto);
                              final int di = downIdx, ti = tgt;
                              final boolean wasArmed = armed, wasDrag = dragging;
                              resetDrag();
                              if (di < 0 || di >= items.size()) return true;
                              if (wasArmed) {
                                  if (wasDrag) {
                                      if (ti >= 0 && ti != di) {
                                          List<AppEntry> nl = new ArrayList<AppEntry>(items);
                                          AppEntry mvd = nl.remove(di);
                                          nl.add(Math.min(ti, nl.size()), mvd);
                                          if (cb != null) cb.reorder(nl);
                                      }
                                  } else if (cb != null) cb.menu(items.get(di));
                              } else if (cb != null) cb.click(items.get(di));
                              return true;
                          case MotionEvent.ACTION_CANCEL:
                              resetDrag();
                              return true;
                      }
                      return true;
                  }
              }

