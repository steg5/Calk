              class BarView extends View {
                  float[] v;
                  String[] lab;
                  final Paint p = new Paint(Paint.ANTI_ALIAS_FLAG);

                  BarView(Context c, float[] v, String[] lab) {
                      super(c);
                      this.v = v;
                      this.lab = lab;
                  }

                  @Override
                  protected void onDraw(Canvas cv) {
                      float w = getWidth(), h = getHeight(), mx = 1;
                      for (float x : v) mx = Math.max(mx, x);
                      float bw = w / v.length, top = px(24), bot = px(26);
                      p.setTextAlign(Paint.Align.CENTER);
                      p.setTextSize(px(18));
                      for (int i = 0; i < v.length; i++) {
                          float bh = (h - top - bot) * v[i] / mx;
                          p.setColor(ACC);
                          cv.drawRoundRect(new RectF(i * bw + px(5), h - bot - bh, (i + 1) * bw - px(5), h - bot), px(5), px(5), p);
                          p.setColor(DIM);
                          cv.drawText(lab[i], i * bw + bw / 2, h - px(6), p);
                          if (v[i] > 0) cv.drawText(String.valueOf(Math.round(v[i])), i * bw + bw / 2, h - bot - bh - px(4), p);
                      }
                  }
              }

