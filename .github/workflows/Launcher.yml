              void pickImage(int req) {
                  Intent a = new Intent(Intent.ACTION_OPEN_DOCUMENT);
                  a.addCategory(Intent.CATEGORY_OPENABLE);
                  a.setType("image/*");
                  Intent b = new Intent(Intent.ACTION_GET_CONTENT);
                  b.addCategory(Intent.CATEGORY_OPENABLE);
                  b.setType("image/*");
                  Intent c = new Intent(Intent.ACTION_PICK, android.provider.MediaStore.Images.Media.EXTERNAL_CONTENT_URI);
                  for (Intent in : new Intent[]{a, b, c}) {
                      try {
                          startActivityForResult(in, req);
                          return;
                      } catch (Throwable ignored) {
                      }
                  }
                  imageBrowser(req, Environment.getExternalStorageDirectory());
              }

              void imageBrowser(final int req, final File dir) {
                  File[] fs = dir.listFiles();
                  if (fs == null) {
                      Toast.makeText(this, "Немає доступу до " + dir + ". Дай програмі дозвіл на пам'ять.", Toast.LENGTH_LONG).show();
                      return;
                  }
                  final List<File> items = new ArrayList<File>();
                  List<File> ds = new ArrayList<File>(), is = new ArrayList<File>();
                  for (File f : fs) {
                      String n = f.getName().toLowerCase();
                      if (f.getName().startsWith(".")) continue;
                      if (f.isDirectory()) ds.add(f);
                      else if (n.endsWith(".png") || n.endsWith(".jpg") || n.endsWith(".jpeg") || n.endsWith(".webp") || n.endsWith(".bmp") || n.endsWith(".gif")) is.add(f);
                  }
                  Comparator<File> cmp = new Comparator<File>() {
                      @Override
                      public int compare(File x, File y2) {
                          return x.getName().compareToIgnoreCase(y2.getName());
                      }
                  };
                  Collections.sort(ds, cmp);
                  Collections.sort(is, cmp);
                  final File parent = dir.getParentFile();
                  List<String> names = new ArrayList<String>();
                  if (parent != null && parent.canRead()) {
                      items.add(parent);
                      names.add("⬆  Вгору");
                  }
                  for (File f : ds) {
                      items.add(f);
                      names.add("📁  " + f.getName());
                  }
                  for (File f : is) {
                      items.add(f);
                      names.add(f.getName());
                  }
                  new AlertDialog.Builder(this).setTitle(dir.getPath())
                          .setItems(names.toArray(new String[0]), (d, i) -> {
                              File f = items.get(i);
                              if (f.isDirectory()) imageBrowser(req, f);
                              else onActivityResult(req, RESULT_OK, new Intent().setData(Uri.fromFile(f)));
                          }).setNegativeButton("Скасувати", null).show();
              }

              final int[] MCOL = {0, 0xFF1E88E5, 0xFFFFFFFF, 0xFFE53935, 0xFF43A047, 0xFFFDD835, 0xFFFB8C00, 0xFF00E5FF, 0xFFAB47BC, 0xFFFF4081};

              int markFill() {
                  int c = sp.getInt("mcol", 0);
                  return c <= 0 || c >= MCOL.length ? ACC : MCOL[c];
              }

              void applyMark() {
                  if (map == null) return;
                  map.markStyle = sp.getInt("mstyle", 0);
                  map.markColor = markFill();
                  map.markBmp = map.markStyle >= 5 ? loadMarkBmp(map.markStyle) : null;
                  map.invalidate();
              }

              class SatView extends View {
                  final Paint p = new Paint(Paint.ANTI_ALIAS_FLAG);

                  SatView(Context c) {
                      super(c);
                  }

                  @Override
                  protected void onDraw(Canvas cv) {
                      float w = getWidth(), h = getHeight(), s = Math.min(w, h);
                      p.setColor(icCol());
                      p.setStyle(Paint.Style.FILL);
                      cv.save();
                      cv.translate(w / 2, h / 2);
                      cv.rotate(-40);
                      cv.drawRoundRect(new RectF(-s * 0.14f, -s * 0.14f, s * 0.14f, s * 0.14f), s * 0.04f, s * 0.04f, p);
                      cv.drawRect(-s * 0.46f, -s * 0.10f, -s * 0.20f, s * 0.10f, p);
                      cv.drawRect(s * 0.20f, -s * 0.10f, s * 0.46f, s * 0.10f, p);
                      p.setStyle(Paint.Style.STROKE);
                      p.setStrokeWidth(s * 0.05f);
                      cv.drawLine(0, s * 0.14f, 0, s * 0.30f, p);
                      cv.drawArc(new RectF(-s * 0.16f, s * 0.20f, s * 0.16f, s * 0.44f), 0, 180, false, p);
                      cv.restore();
                  }
              }

