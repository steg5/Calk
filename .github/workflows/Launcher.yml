                  setDlg = new Dialog(this, android.R.style.Theme_DeviceDefault_NoActionBar_Fullscreen) {
                      @Override
                      public void onWindowFocusChanged(boolean hasFocus) {
                          super.onWindowFocusChanged(hasFocus);
                          if (hasFocus && setCol != null && setSc != null) {
                              final int y0 = setSc.getScrollY();
                              rebuildSettings();
                              setSc.post(() -> setSc.scrollTo(0, y0));
                          }
                      }
                  };
                  ScrollView sc = new ScrollView(this);
                  setSc = sc;
                  sc.setBackgroundColor(BG2 | 0xFF000000);
                  setCol = new LinearLayout(this);
                  setCol.setOrientation(LinearLayout.VERTICAL);
                  setCol.setPadding(px(28), px(20), px(28), px(28));
                  sc.addView(setCol, new FrameLayout.LayoutParams(-1, -2));
                  buildSettings();
                  setDlg.setContentView(sc);
                  setDlg.show();
              }

              void rebuildSettings() {
                  if (setCol == null || setDlg == null || !setDlg.isShowing()) return;
                  setCol.removeAllViews();
                  buildSettings();
              }

              void group(String title, Object[]... items) {
                  TextView h = text(title, 26, ACC, true);
                  LinearLayout.LayoutParams hp = lp(-1, -2, 0);
                  hp.setMargins(0, px(20), 0, 0);
                  setCol.addView(h, hp);
                  LinearLayout row = null;
                  for (int i = 0; i < items.length; i++) {
                      if (i % 3 == 0) {
                          row = new LinearLayout(this);
                          row.setOrientation(LinearLayout.HORIZONTAL);
                          LinearLayout.LayoutParams rp = lp(-1, -2, 0);
                          rp.setMargins(0, px(10), 0, 0);
                          setCol.addView(row, rp);
                      }
                      final Object[] it = items[i];
                      LinearLayout tile = new LinearLayout(this);
                      tile.setOrientation(LinearLayout.VERTICAL);
                      tile.setGravity(Gravity.CENTER_VERTICAL);
                      tile.setPadding(px(18), px(12), px(18), px(12));
                      tile.setBackground(blockBg(18, BTN));
                      TextView tt = text((String) it[0], 24, TXT, true);
                      tt.setSingleLine(true);
                      tt.setEllipsize(android.text.TextUtils.TruncateAt.END);
                      tile.addView(tt, lp(-1, -2, 0));
                      TextView sb = text((String) it[1], 19, DIM, false);
                      sb.setSingleLine(true);
                      sb.setEllipsize(android.text.TextUtils.TruncateAt.END);
                      tile.addView(sb, lp(-1, -2, 0));
                      final Runnable act = (Runnable) it[2];
                      final boolean close = (Boolean) it[3];
                      tile.setOnClickListener(v -> {
                          if (close) {
                              closeSettings();
                              returnSet = true;
                          }
                          act.run();
                      });
                      LinearLayout.LayoutParams tl = lp(0, 104, 1);
                      tl.setMargins(i % 3 == 0 ? 0 : px(10), 0, 0, 0);
                      row.addView(tile, tl);
                  }
                  int rem = items.length % 3;
                  if (rem != 0) {
                      for (int k = rem; k < 3; k++) {
                          LinearLayout.LayoutParams tl = lp(0, 104, 1);
                          tl.setMargins(px(10), 0, 0, 0);
                          row.addView(new View(this), tl);
                      }
                  }
              }

