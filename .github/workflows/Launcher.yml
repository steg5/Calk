          import android.media.session.MediaSessionManager;
          import android.media.session.PlaybackState;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Environment;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.provider.Settings;
          import android.util.TypedValue;
          import android.view.Gravity;
          import android.view.KeyEvent;
          import android.view.MotionEvent;
          import android.view.Surface;
          import android.view.TextureView;
          import android.view.View;
          import android.view.ViewGroup;
          import android.widget.Button;
          import android.widget.FrameLayout;
          import android.widget.HorizontalScrollView;
          import android.widget.ImageView;
          import android.widget.LinearLayout;
          import android.widget.SeekBar;
          import android.widget.TextView;
          import android.widget.Toast;

          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.lang.reflect.Method;
          import java.text.SimpleDateFormat;
          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.Comparator;
          import java.util.Date;
          import java.util.List;
          import java.util.Locale;

          public class MainActivity extends Activity implements Tuner.Listener {
              int ACC, TXT, DIM, CARD, BTN, BG1, BG2, OV;
              static final String[] THN = {"Синя ніч", "Графіт", "Смарагд", "Бурштин", "Пурпур", "Червона яскрава", "Океан", "Ліс", "Світла", "Чорна", "Червона тьмяна", "Чорна + червоний", "Вишнева", "Рубін", "Бордо"};
              // bg1, bg2, акцент, плитка, кнопка, текст, дим. текст, затемнення фону
              static final int[][] TH = {
                      {0xFF12335C, 0xFF0A1424, 0xFF4FC3F7, 0xB3101A28, 0xFF2A3A52, 0xFFF1F5F9, 0xFFA9B8CC, 0x55000000},
                      {0xFF2B2F36, 0xFF111316, 0xFFB0BEC5, 0xB3181A1E, 0xFF343942, 0xFFF1F5F9, 0xFFA9B0B8, 0x55000000},
                      {0xFF0F3D33, 0xFF071A16, 0xFF4DD6A8, 0xB30D211C, 0xFF1F4A3F, 0xFFF1F5F9, 0xFF9CBFB4, 0x55000000},
                      {0xFF4A3010, 0xFF1A1006, 0xFFFFB74D, 0xB3231708, 0xFF4F3A1B, 0xFFF8F1E7, 0xFFC4B29A, 0x55000000},
                      {0xFF3A1F5C, 0xFF150B26, 0xFFCE93D8, 0xB31F1030, 0xFF40295E, 0xFFF4EEF8, 0xFFB7A6C9, 0x55000000},
                      {0xFF3A0508, 0xFF120203, 0xFFFF1E1E, 0xB3200709, 0xFF5A0F12, 0xFFFFECEC, 0xFFFF9A9A, 0x55000000},
                      {0xFF0B4F6C, 0xFF05202B, 0xFF4DD0E1, 0xB30A2A38, 0xFF16627F, 0xFFEFF9FC, 0xFF9CC4D0, 0x55000000},
                      {0xFF2E4A1E, 0xFF111C0B, 0xFFAED581, 0xB3172410, 0xFF3A5A2A, 0xFFF3F8EE, 0xFFB0C4A0, 0x55000000},
                      {0xFFDCE6F2, 0xFFB8C7DB, 0xFF1565C0, 0xCCFFFFFF, 0xFFC9D6E6, 0xFF1B2733, 0xFF4F6075, 0x00000000},
                      {0xFF000000, 0xFF000000, 0xFFFFFFFF, 0xCC121212, 0xFF262626, 0xFFF1F1F1, 0xFF9A9A9A, 0x00000000},
                      {0xFF2A0C0E, 0xFF0D0405, 0xFFB5322F, 0xB3170708, 0xFF3A1416, 0xFFE2BDBA, 0xFF9A6663, 0x55000000},
                      {0xFF000000, 0xFF000000, 0xFFFF1A1A, 0xCC140404, 0xFF2A0A0A, 0xFFFFE0E0, 0xFFAA6B6B, 0x00000000},
                      {0xFF4A0E22, 0xFF16040B, 0xFFFF4D79, 0xB3260813, 0xFF5E1830, 0xFFFFE9EF, 0xFFE39AB0, 0x55000000},
                      {0xFF5C0A14, 0xFF1F0307, 0xFFFF2D4A, 0xB3290509, 0xFF7A1220, 0xFFFFEAEC, 0xFFFF9AA6, 0x55000000},
                      {0xFF3B0A1E, 0xFF12030A, 0xFFD94A6B, 0xB31F0712, 0xFF521A33, 0xFFF3DCE3, 0xFFB98494, 0x55000000}};

              void applyTheme() {
                  int[] t = TH[Math.min(TH.length - 1, Math.max(0, sp.getInt("theme", 0)))];
                  BG1 = t[0];
                  BG2 = t[1];
                  ACC = t[2];
                  CARD = t[3];
                  BTN = t[4];
                  TXT = t[5];
                  DIM = t[6];
                  OV = t[7];
                  if (sp.contains("cardalpha")) CARD = (sp.getInt("cardalpha", 179) << 24) | (CARD & 0xFFFFFF);
              }

              final Handler ui = new Handler(Looper.getMainLooper());
              SharedPreferences sp;
              PackageManager pm;
              Tuner tuner;
              LocationManager lm;
              boolean ready = false;
              float u = 1f;

              // GPS і поїздка
              long lastFix = 0, lastLoc = 0;
              int satUsed = 0, satTotal = 0;
              float maxKmh = 0, distKm = 0, movH = 0;
              long lastSave = 0;

              ImageView bg;
              TextView tvClock, tvDate, tvSpeed, tvAvg, tvMax, tvSats, tvStation, tvFreq, tvTrack, tvArtist, navNote;
              Button rPlay, aPlay;
              FrameLayout dayNight;
              BrightIcon bIcon;
              ImageView cover, navIcon;
              LinearLayout appsRow;
              boolean radioOn = true, needAccess = false;

              // вікно навігації
              TextureView navView;
              Surface navSurface;
              VirtualDisplay navVd;
              boolean navFailed = false;
              int navW = 0, navH = 0;

              // медіа
              MediaController ctl;

              Typeface fontCache;
              String fontCachePath = "";

              Typeface tf(boolean bold) {
                  String fp = sp.getString("fontfile", "");
                  Typeface base = null;
                  if (!fp.isEmpty()) {
                      if (!fp.equals(fontCachePath)) {
                          fontCachePath = fp;
                          try {
                              fontCache = Typeface.createFromFile(fp);
                          } catch (Throwable e) {
                              fontCache = null;
                          }
                      }
                      base = fontCache;
                  }
                  if (base == null) return bold ? Typeface.DEFAULT_BOLD : Typeface.DEFAULT;
                  return Typeface.create(base, bold ? Typeface.BOLD : Typeface.NORMAL);
              }

              void fontMenu() {
                  File[] fs = new File("/system/fonts").listFiles();
                  List<File> l = new ArrayList<File>();
                  if (fs != null) {
                      for (File f : fs) {
                          String n = f.getName().toLowerCase(Locale.US);
                          if (!(n.endsWith(".ttf") || n.endsWith(".otf"))) continue;
                          if (n.contains("emoji") || n.contains("symbol") || n.contains("icon") || n.contains("color") || n.contains("italic")) continue;
                          l.add(f);
                      }
                  }
                  Collections.sort(l, new Comparator<File>() {
                      @Override
                      public int compare(File a, File b) {
                          return a.getName().compareToIgnoreCase(b.getName());
                      }
                  });
                  final String[] names = new String[l.size() + 1];
                  final String[] paths = new String[l.size() + 1];
                  names[0] = "Стандартний";
                  paths[0] = "";
                  String cur = sp.getString("fontfile", "");
                  int sel = 0;
                  for (int i = 0; i < l.size(); i++) {
                      String n = l.get(i).getName();
                      names[i + 1] = n.substring(0, n.lastIndexOf('.'));
                      paths[i + 1] = l.get(i).getAbsolutePath();
                      if (paths[i + 1].equals(cur)) sel = i + 1;
                  }
                  new AlertDialog.Builder(this).setTitle("Шрифт (" + l.size() + ")")
                          .setSingleChoiceItems(names, sel, (d, i) -> {
                              sp.edit().putString("fontfile", paths[i]).apply();
                              d.dismiss();
                              recreate();
                          }).show();
              }

              boolean magnet = true;

              float[][] copyRects() {
                  float[][] c = new float[5][];
                  for (int i = 0; i < 5; i++) c[i] = rect(i).clone();
                  return c;
              }

              void restore(float[][] b) {
                  for (int i = 0; i < 5; i++) rc[i] = b[i];
              }

              boolean over(int a, int b) {
                  float[] p = rect(a), q = rect(b);
                  float ox = Math.min(p[0] + p[2], q[0] + q[2]) - Math.max(p[0], q[0]);
                  float oy = Math.min(p[1] + p[3], q[1] + q[3]) - Math.max(p[1], q[1]);
                  return ox * cwPx() > 2 && oy * chPx() > 2;
              }

              boolean resolve(int i) {
                  if (!resolve2(i, -1, 0)) return false;
                  for (int a = 0; a < 5; a++) for (int b = a + 1; b < 5; b++) if (over(a, b)) return false;
                  return true;
              }

              boolean resolve2(int i, int skip, int d) {
                  for (int j = 0; j < 5; j++) {
                      if (j == i || j == skip) continue;
                      if (over(i, j) && !push(j, i, d + 1)) return false;
                  }
                  return true;
              }

              boolean push(int j, int i, int d) {
                  if (d > 8) return false;
                  float[] a = rect(i), b = rect(j);
                  int cw = cwPx(), ch = chPx();
                  float ox = (Math.min(a[0] + a[2], b[0] + b[2]) - Math.max(a[0], b[0])) * cw;
                  float oy = (Math.min(a[1] + a[3], b[1] + b[3]) - Math.max(a[1], b[1])) * ch;
                  if (ox < oy) {
                      boolean right = b[0] + b[2] / 2 > a[0] + a[2] / 2;
                      float nx = right ? a[0] + a[2] : a[0] - b[2];
                      if (nx < 0 || nx + b[2] > 1.0001f) return false;
                      b[0] = nx;
                  } else {
                      boolean down = b[1] + b[3] / 2 > a[1] + a[3] / 2;
                      float ny = down ? a[1] + a[3] : a[1] - b[3];
                      if (ny < 0 || ny + b[3] > 1.0001f) return false;
                      b[1] = ny;
                  }
                  return resolve2(j, i, d);
              }

              // ================= розкладка блоків =================
              static final String[] BN = {"Годинник", "Радіо", "AIMP", "Навігація", "Програми"};
              FrameLayout canvas;
              View[] blocks = new View[5];
              float[][] rc = new float[5][];
              EditView editView;
              LinearLayout editBar;

              void addBlock(int i, View v) {
                  blocks[i] = v;
                  canvas.addView(v, new FrameLayout.LayoutParams(px(100), px(100), Gravity.TOP | Gravity.LEFT));
              }

              int cwPx() {
                  return Math.max(1, canvas.getWidth() - 2 * px(20));
              }

              int chPx() {
                  return Math.max(1, canvas.getHeight() - 2 * px(20));
              }

              float[] defRect(int i, int cw, int ch) {
                  float g = px(16), v = px(14);
                  float lw = (cw - g) * 0.4f, rw = cw - g - lw;
                  float h = ch - v, c = h * 0.46f, m = h - c, nv = h * 0.8317f, bar = h - nv;
                  float hw = (lw - v) / 2;
                  switch (i) {
                      case 0:
                          return new float[]{0, 0, lw / cw, c / ch};
                      case 1:
                          return new float[]{0, (c + v) / ch, hw / cw, m / ch};
                      case 2:
                          return new float[]{(hw + v) / cw, (c + v) / ch, hw / cw, m / ch};
                      case 3:
                          return new float[]{(lw + g) / cw, 0, rw / cw, nv / ch};
                      default:
                          return new float[]{(lw + g) / cw, (nv + v) / ch, rw / cw, bar / ch};
                  }
              }

              float[] rect(int i) {
                  if (rc[i] == null) {
                      String s = sp.getString("r" + i, null);
                      if (s != null) {
                          try {
                              String[] a = s.split(",");
                              float[] f = new float[4];
                              for (int k = 0; k < 4; k++) f[k] = Float.parseFloat(a[k]);
                              rc[i] = f;
                          } catch (Throwable ignored) {
                          }
                      }
                      if (rc[i] == null) rc[i] = defRect(i, cwPx(), chPx());
                  }
                  return rc[i];
              }

              void saveRects() {
                  SharedPreferences.Editor ed = sp.edit();
                  for (int i = 0; i < 5; i++) {
                      float[] f = rect(i);
                      ed.putString("r" + i, f[0] + "," + f[1] + "," + f[2] + "," + f[3]);
                  }
                  ed.apply();
              }

              void layoutBlocks() {
                  if (canvas == null || canvas.getWidth() == 0) return;
                  int pad = px(20), cw = cwPx(), ch = chPx();
                  for (int i = 0; i < 5; i++) {
                      if (blocks[i] == null) continue;
                      float[] f = rect(i);
                      FrameLayout.LayoutParams p = (FrameLayout.LayoutParams) blocks[i].getLayoutParams();
                      p.gravity = Gravity.TOP | Gravity.LEFT;
                      p.leftMargin = pad + Math.round(f[0] * cw);
                      p.topMargin = pad + Math.round(f[1] * ch);
                      p.width = Math.max(1, Math.round(f[2] * cw));
                      p.height = Math.max(1, Math.round(f[3] * ch));
                      blocks[i].setLayoutParams(p);
                  }
              }

              void enterEdit() {
                  editView.setVisibility(View.VISIBLE);
                  editBar.setVisibility(View.VISIBLE);
                  editView.invalidate();
              }

              void exitEdit() {
                  saveRects();
                  if (returnSet) {
                      returnSet = false;
                      ui.post(this::settingsMenu);
                  }
                  editView.setVisibility(View.GONE);
                  editBar.setVisibility(View.GONE);
              }

              class EditView extends View {
                  final Paint p = new Paint(Paint.ANTI_ALIAS_FLAG);
                  int sel = -1;
                  boolean rs = false;
                  float lx, ly;

                  EditView(Context c) {
                      super(c);
                      setClickable(true);
                  }

                  RectF r(int i) {
                      int pad = px(20), cw = cwPx(), ch = chPx();
                      float[] f = rect(i);
                      return new RectF(pad + f[0] * cw, pad + f[1] * ch, pad + (f[0] + f[2]) * cw, pad + (f[1] + f[3]) * ch);
                  }

                  @Override
                  protected void onDraw(Canvas cv) {
                      cv.drawColor(0x88000000);
                      for (int i = 0; i < 5; i++) {
                          RectF a = r(i);
                          p.setStyle(Paint.Style.FILL);
                          p.setColor(i == sel ? 0x664FC3F7 : 0x33FFFFFF);
                          cv.drawRoundRect(a, px(20), px(20), p);
                          p.setStyle(Paint.Style.STROKE);
                          p.setStrokeWidth(px(3));
                          p.setColor(0xFF4FC3F7);
                          cv.drawRoundRect(a, px(20), px(20), p);
                          p.setStyle(Paint.Style.FILL);
                          p.setColor(0xFFFFFFFF);
                          p.setTextSize(px(28));
                          p.setTextAlign(Paint.Align.CENTER);
                          cv.drawText(BN[i], a.centerX(), a.centerY() + px(10), p);
                          p.setColor(0xFF4FC3F7);
                          float hs = px(44);
                          cv.drawRoundRect(new RectF(a.right - hs, a.bottom - hs, a.right, a.bottom), px(12), px(12), p);
                      }
                  }

                  @Override
                  public boolean onTouchEvent(MotionEvent e) {
                      float x = e.getX(), y = e.getY();
                      int cw = cwPx(), ch = chPx();
                      switch (e.getActionMasked()) {
                          case MotionEvent.ACTION_DOWN:
                              sel = -1;
                              rs = false;
                              for (int i = 4; i >= 0; i--) {
                                  RectF a = r(i);
                                  if (a.contains(x, y)) {
                                      sel = i;
                                      rs = x > a.right - px(60) && y > a.bottom - px(60);
                                      break;
                                  }
                              }
                              lx = x;
                              ly = y;
                              invalidate();
                              return true;
                          case MotionEvent.ACTION_MOVE:
                              if (sel < 0) return true;
                              float dx = (x - lx) / cw, dy = (y - ly) / ch;
                              lx = x;
                              ly = y;
                              float[][] bk = copyRects();
                              float[] f = rect(sel);
                              if (rs) {
                                  f[2] = Math.max(px(110) / (float) cw, Math.min(1 - f[0], f[2] + dx));
                                  f[3] = Math.max(px(90) / (float) ch, Math.min(1 - f[1], f[3] + dy));
                              } else {
                                  f[0] = Math.max(0, Math.min(1 - f[2], f[0] + dx));
                                  f[1] = Math.max(0, Math.min(1 - f[3], f[1] + dy));
                              }
                              if (magnet && !resolve(sel)) restore(bk);
                              layoutBlocks();
                              invalidate();
                              return true;
                          case MotionEvent.ACTION_UP:
                          case MotionEvent.ACTION_CANCEL:
                              if (sel >= 0) {
                                  float[][] bk2 = copyRects();
                                  float[] g = rect(sel);
                                  float st = px(10);
                                  g[0] = Math.round(g[0] * cw / st) * st / cw;
                                  g[1] = Math.round(g[1] * ch / st) * st / ch;
                                  g[2] = Math.max(px(110) / (float) cw, Math.min(1 - g[0], Math.round(g[2] * cw / st) * st / cw));
                                  g[3] = Math.max(px(90) / (float) ch, Math.min(1 - g[1], Math.round(g[3] * ch / st) * st / ch));
                                  if (magnet && !resolve(sel)) restore(bk2);
                                  saveRects();
                                  layoutBlocks();
                              }
                              sel = -1;
                              invalidate();
                              return true;
                      }
                      return true;
                  }
              }

              /** Панель редагування: переміщується довгим натисканням. */
              class DragBar extends LinearLayout {
                  float x0, y0, tx0, ty0;
                  boolean drag = false;
                  final Runnable lng = new Runnable() {
                      @Override
                      public void run() {
                          drag = true;
                      }
                  };

                  DragBar(Context c) {
                      super(c);
                  }

                  @Override
                  public boolean onInterceptTouchEvent(MotionEvent e) {
                      switch (e.getActionMasked()) {
                          case MotionEvent.ACTION_DOWN:
                              x0 = e.getRawX();
                              y0 = e.getRawY();
                              tx0 = getTranslationX();
                              ty0 = getTranslationY();
                              drag = false;
                              postDelayed(lng, 500);
                              break;
                          case MotionEvent.ACTION_MOVE:
                              if (!drag && (Math.abs(e.getRawX() - x0) > px(10) || Math.abs(e.getRawY() - y0) > px(10)))
                                  removeCallbacks(lng);
                              break;
                          case MotionEvent.ACTION_UP:
                          case MotionEvent.ACTION_CANCEL:
                              removeCallbacks(lng);
                              drag = false;
                              break;
                      }
                      return drag && e.getActionMasked() == MotionEvent.ACTION_MOVE;
                  }

                  @Override
                  public boolean onTouchEvent(MotionEvent e) {
                      int a = e.getActionMasked();
                      if (a == MotionEvent.ACTION_MOVE && drag) {
                          setTranslationX(tx0 + e.getRawX() - x0);
                          setTranslationY(ty0 + e.getRawY() - y0);
                      } else if (a == MotionEvent.ACTION_UP || a == MotionEvent.ACTION_CANCEL) {
                          drag = false;
                      }
                      return true;
                  }
              }

              /** Сонце / місяць: однакові білі контури. */
              class BrightIcon extends View {
                  boolean moon = false;
                  final Paint p = new Paint(Paint.ANTI_ALIAS_FLAG);

                  BrightIcon(Context c) {
                      super(c);
                  }

                  @Override
                  protected void onDraw(Canvas cv) {
                      float w = getWidth(), h = getHeight(), s = Math.min(w, h) * 0.86f;
                      float cx = w / 2, cy = h / 2;
                      p.setStyle(Paint.Style.STROKE);
                      p.setStrokeWidth(s * 0.07f);
                      p.setStrokeCap(Paint.Cap.ROUND);
                      p.setColor(TXT);
                      if (moon) {
                          Path a = new Path();
                          a.addCircle(cx + s * 0.07f, cy, s * 0.40f, Path.Direction.CW);
                          Path b = new Path();
                          b.addCircle(cx + s * 0.27f, cy - s * 0.15f, s * 0.33f, Path.Direction.CW);
                          a.op(b, Path.Op.DIFFERENCE);
                          cv.drawPath(a, p);
                      } else {
                          cv.drawCircle(cx, cy, s * 0.20f, p);
                          for (int k = 0; k < 8; k++) {
                              double ang = k * Math.PI / 4;
                              float c = (float) Math.cos(ang), sn = (float) Math.sin(ang);
                              cv.drawLine(cx + c * s * 0.30f, cy + sn * s * 0.30f, cx + c * s * 0.42f, cy + sn * s * 0.42f, p);
                          }
                      }
                  }
              }

