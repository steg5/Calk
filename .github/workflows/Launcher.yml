              @Override
              protected void onDestroy() {
                  if (ready) {
                      saveTrip();
                      if (map != null) map.close();
                      try {
                          tuner.stop();
                      } catch (Throwable ignored) {
                      }
                      try {
                          if (lm != null) {
                              lm.removeUpdates(locL);
                              if (Build.VERSION.SDK_INT >= 24) {
                                  if (gnssCb != null) lm.unregisterGnssStatusCallback((android.location.GnssStatus.Callback) gnssCb);
                              } else {
                                  lm.removeGpsStatusListener(stL);
                              }
                          }
                      } catch (Throwable ignored) {
                      }
                  }
                  super.onDestroy();
              }

