              /** Іконка супутника, намальована кодом. */
              class ClockLayout extends ViewGroup {
                  final View[] el = new View[5];
                  final float[] fx = new float[5], fy = new float[5], sc = new float[5];
                  final boolean[] cu = new boolean[5];
                  View badge;
                  LinearLayout bar;
                  boolean edit = false;
                  int sel = -1;
                  float lx, ly, gx = -1, gy = -1;
                  final Paint gp = new Paint(Paint.ANTI_ALIAS_FLAG);

                  ClockLayout(Context c) {
                      super(c);
                      setWillNotDraw(false);
                      for (int i = 0; i < 5; i++) {
                          fx[i] = Float.NaN;
                          sc[i] = 1f;
                          String v = sp.getString("ck" + i, null);
                          if (v != null) {
                              try {
                                  String[] q = v.split(",");
                                  fx[i] = Float.parseFloat(q[0]);
                                  fy[i] = Float.parseFloat(q[1]);
                                  sc[i] = Float.parseFloat(q[2]);
                                  cu[i] = true;
                              } catch (Throwable ignored) {
                                  fx[i] = Float.NaN;
                              }
                          }
                      }
                  }

                  void put(int i, View v, int w, int h) {
                      el[i] = v;
                      addView(v, new ViewGroup.LayoutParams(w, h));
                  }

                  void save() {
                      SharedPreferences.Editor ed = sp.edit();
                      for (int i = 0; i < 5; i++)
                          if (cu[i] && !Float.isNaN(fx[i])) ed.putString("ck" + i, fx[i] + "," + fy[i] + "," + sc[i]);
                      ed.apply();
                  }

                  void reset() {
                      SharedPreferences.Editor ed = sp.edit();
                      for (int i = 0; i < 5; i++) {
                          ed.remove("ck" + i);
                          fx[i] = Float.NaN;
                          cu[i] = false;
                          sc[i] = 1f;
                          el[i].setScaleX(1f);
                          el[i].setScaleY(1f);
                      }
                      ed.apply();
                      requestLayout();
                  }

                  @Override
                  protected void onMeasure(int ws, int hs) {
                      int W = MeasureSpec.getSize(ws), H = MeasureSpec.getSize(hs);
                      setMeasuredDimension(W, H);
                      for (int i = 0; i < getChildCount(); i++) {
                          View c = getChildAt(i);
                          ViewGroup.LayoutParams p = c.getLayoutParams();
                          int cw = p.width > 0 ? MeasureSpec.makeMeasureSpec(p.width, MeasureSpec.EXACTLY) : MeasureSpec.makeMeasureSpec(W, MeasureSpec.AT_MOST);
                          int chh = p.height > 0 ? MeasureSpec.makeMeasureSpec(p.height, MeasureSpec.EXACTLY) : MeasureSpec.makeMeasureSpec(H, MeasureSpec.AT_MOST);
                          c.measure(cw, chh);
                      }
                  }

                  @Override
                  protected void onLayout(boolean ch, int l, int t, int r, int b) {
                      int W = r - l, H = b - t;
                      if (W <= 0 || H <= 0) return;
                      int top = px(12);
                      if (W < px(150) || H < px(120)) return;
                      for (int i = 0; i < 5; i++) {
                          View v = el[i];
                          if (v == null) continue;
                          int w = v.getMeasuredWidth(), h = v.getMeasuredHeight();
                          if (!cu[i]) {
                              float cx, cy;
                              int h0 = el[0].getMeasuredHeight(), h1 = el[1].getMeasuredHeight();
                              switch (i) {
                                  case 0:
                                      cx = W / 2f;
                                      cy = top + h0 / 2f;
                                      break;
                                  case 1:
                                      cx = W / 2f;
                                      cy = top + h0 + h1 / 2f;
                                      break;
                                  case 2:
                                      cx = W / 2f;
                                      cy = (top + h0 + h1 + H - top) / 2f;
                                      break;
                                  case 3:
                                      cx = W - px(14) - w / 2f;
                                      cy = top + h / 2f;
                                      break;
                                  default:
                                      cx = px(12) + w / 2f;
                                      cy = px(12) + h / 2f;
                              }
                              fx[i] = cx / W;
                              fy[i] = cy / H;
                          }
                          int cx = Math.round(fx[i] * W), cy = Math.round(fy[i] * H);
                          v.layout(cx - w / 2, cy - h / 2, cx - w / 2 + w, cy - h / 2 + h);
                          v.setScaleX(sc[i]);
                          v.setScaleY(sc[i]);
                      }
                      if (badge != null) {
                          int w = badge.getMeasuredWidth(), h = badge.getMeasuredHeight();
                          badge.layout(W - px(16) - w, H - px(16) - h, W - px(16), H - px(16));
                      }
                      if (bar != null) {
                          int w = bar.getMeasuredWidth(), h = bar.getMeasuredHeight();
                          bar.layout((W - w) / 2, H - px(8) - h, (W - w) / 2 + w, H - px(8));
                      }
                  }

                  RectF box(int i) {
                      View v = el[i];
                      float w = v.getWidth() * sc[i], h = v.getHeight() * sc[i];
                      float cx = v.getLeft() + v.getWidth() / 2f, cy = v.getTop() + v.getHeight() / 2f;
                      return new RectF(cx - w / 2, cy - h / 2, cx + w / 2, cy + h / 2);
                  }

                  void startEdit() {
                      edit = true;
                      sel = -1;
                      if (bar != null) bar.setVisibility(View.VISIBLE);
                      invalidate();
                  }

                  void stopEdit() {
                      edit = false;
                      sel = -1;
                      gx = gy = -1;
                      if (bar != null) bar.setVisibility(View.GONE);
                      save();
                      invalidate();
                  }

                  void grow(float k) {
                      if (sel < 0) return;
                      cu[sel] = true;
                      sc[sel] = Math.max(0.4f, Math.min(3f, sc[sel] * k));
                      el[sel].setScaleX(sc[sel]);
                      el[sel].setScaleY(sc[sel]);
                      invalidate();
                  }

                  @Override
                  public boolean onInterceptTouchEvent(MotionEvent e) {
                      if (!edit) return false;
                      if (bar != null && bar.getVisibility() == View.VISIBLE) {
                          float x = e.getX(), y = e.getY();
                          if (x >= bar.getLeft() && x <= bar.getRight() && y >= bar.getTop() && y <= bar.getBottom()) return false;
                      }
                      return true;
                  }

                  float sx0, sy0;
                  boolean anchorDown, downOnEl, dragMoved;

                  float[] anchorPos(int a, int i) {
                      View v = el[i];
                      float hw = v.getWidth() * sc[i] / 2f, hh = v.getHeight() * sc[i] / 2f, pad = px(6);
                      int W = getWidth(), H = getHeight();
                      int col = a % 3, row = a / 3;
                      float x = col == 0 ? pad + hw : col == 1 ? W / 2f : W - pad - hw;
                      float y = row == 0 ? pad + hh : row == 1 ? H / 2f : H - pad - hh;
                      return new float[]{x, y};
                  }

                  int anchorAt(float x, float y) {
                      for (int a = 0; a < 9; a++) {
                          float[] p = anchorPos(a, sel);
                          if (Math.hypot(x - p[0], y - p[1]) < px(30)) return a;
                      }
                      return -1;
                  }

                  @Override
                  public boolean onTouchEvent(MotionEvent e) {
                      if (!edit) return false;
                      float x = e.getX(), y = e.getY();
                      int W = getWidth(), H = getHeight();
                      switch (e.getActionMasked()) {
                          case MotionEvent.ACTION_DOWN:
                              sx0 = lx = x;
                              sy0 = ly = y;
                              dragMoved = false;
                              downOnEl = false;
                              anchorDown = false;
                              if (sel >= 0) {
                                  int a = anchorAt(x, y);
                                  if (a >= 0) {
                                      float[] p = anchorPos(a, sel);
                                      cu[sel] = true;
                                      fx[sel] = p[0] / W;
                                      fy[sel] = p[1] / H;
                                      anchorDown = true;
                                      save();
                                      requestLayout();
                                      invalidate();
                                      return true;
                                  }
                              }
                              int hit = -1;
                              for (int i = 4; i >= 0; i--) {
                                  RectF bx = box(i);
                                  bx.inset(-px(10), -px(10));
                                  if (bx.contains(x, y)) {
                                      hit = i;
                                      break;
                                  }
                              }
                              sel = hit;
                              downOnEl = hit >= 0;
                              invalidate();
                              return true;
                          case MotionEvent.ACTION_MOVE:
                              if (anchorDown || sel < 0 || !downOnEl) return true;
                              if (!dragMoved) {
                                  if (Math.hypot(x - sx0, y - sy0) < px(16)) return true;
                                  dragMoved = true;
                                  lx = x;
                                  ly = y;
                              }
                              cu[sel] = true;
                              fx[sel] += (x - lx) / W;
                              fy[sel] += (y - ly) / H;
                              lx = x;
                              ly = y;
                              snap(W, H);
                              requestLayout();
                              invalidate();
                              return true;
                          case MotionEvent.ACTION_UP:
                          case MotionEvent.ACTION_CANCEL:
                              gx = gy = -1;
                              save();
                              invalidate();
                              return true;
                      }
                      return true;
                  }

                  void snap(int W, int H) {
                      View v = el[sel];
                      float hw = v.getWidth() * sc[sel] / 2f, hh = v.getHeight() * sc[sel] / 2f;
                      float cx = fx[sel] * W, cy = fy[sel] * H, th = px(26), pad = px(6);
                      cx = Math.max(pad + hw, Math.min(W - pad - hw, cx));
                      cy = Math.max(pad + hh, Math.min(H - pad - hh, cy));
                      gx = gy = -1;
                      float[] tx = {W / 2f, pad + hw, W - pad - hw};
                      float[] gl = {W / 2f, pad, W - pad};
                      for (int k = 0; k < 3; k++)
                          if (Math.abs(cx - tx[k]) < th) {
                              cx = tx[k];
                              gx = gl[k];
                              break;
                          }
                      float[] ty = {H / 2f, pad + hh, H - pad - hh};
                      float[] gm = {H / 2f, pad, H - pad};
                      for (int k = 0; k < 3; k++)
                          if (Math.abs(cy - ty[k]) < th) {
                              cy = ty[k];
                              gy = gm[k];
                              break;
                          }
                      fx[sel] = cx / W;
                      fy[sel] = cy / H;
                  }

                  @Override
                  protected void dispatchDraw(Canvas cv) {
                      super.dispatchDraw(cv);
                      if (!edit) return;
                      for (int i = 0; i < 5; i++) {
                          RectF bx = box(i);
                          gp.setStyle(Paint.Style.FILL);
                          gp.setColor(i == sel ? (ACC & 0xFFFFFF) | 0x38000000 : 0x00000000);
                          cv.drawRect(bx, gp);
                          gp.setStyle(Paint.Style.STROKE);
                          gp.setStrokeWidth(i == sel ? px(3) : px(1.5f));
                          gp.setColor(i == sel ? ACC : 0x66FFFFFF);
                          cv.drawRect(bx, gp);
                      }
                      if (sel >= 0) {
                          float[] cur = {box(sel).centerX(), box(sel).centerY()};
                          for (int a = 0; a < 9; a++) {
                              float[] p = anchorPos(a, sel);
                              boolean here = Math.hypot(cur[0] - p[0], cur[1] - p[1]) < px(5);
                              gp.setStyle(Paint.Style.FILL);
                              gp.setColor(here ? ACC : (ACC & 0xFFFFFF) | 0x66000000);
                              cv.drawCircle(p[0], p[1], px(13), gp);
                              gp.setStyle(Paint.Style.STROKE);
                              gp.setStrokeWidth(px(2));
                              gp.setColor(ACC);
                              cv.drawCircle(p[0], p[1], px(13), gp);
                          }
                      }
                      gp.setStyle(Paint.Style.STROKE);
                      gp.setStrokeWidth(px(1.5f));
                      gp.setColor(0xFF00E5FF);
                      if (gx >= 0) cv.drawLine(gx, 0, gx, getHeight(), gp);
                      if (gy >= 0) cv.drawLine(0, gy, getWidth(), gy, gp);
                  }
              }

              ClockLayout clockLay;

              void clockEdit() {
                  if (clockLay != null) clockLay.startEdit();
              }

