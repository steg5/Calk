              // ================= яскравість =================
              static final int[] DAWN = {460, 419, 360, 350, 295, 270, 288, 330, 380, 430, 420, 459};
              static final int[] DUSK = {1046, 1097, 1145, 1258, 1305, 1338, 1331, 1285, 1216, 1148, 1035, 1017};
              int lastAutoB = -1;

              float[] dayTimes() {
                  if (sp.getInt("abmode", 0) == 2) {
                      Calendar c = Calendar.getInstance();
                      float fm = c.get(Calendar.MONTH) + (c.get(Calendar.DAY_OF_MONTH) - 15f) / 30f;
                      int i0 = (int) Math.floor(fm);
                      float fr = fm - i0;
                      int a = ((i0 % 12) + 12) % 12, b = (a + 1) % 12;
                      return new float[]{DAWN[a] + (DAWN[b] - DAWN[a]) * fr, DUSK[a] + (DUSK[b] - DUSK[a]) * fr};
                  }
                  return new float[]{sp.getInt("daym", 420), sp.getInt("nightm", 1200)};
              }

              void autoBright() {
                  if (sp.getInt("abmode", 0) == 0) return;
                  if (Build.VERSION.SDK_INT >= 23 && !Settings.System.canWrite(this)) return;
                  Calendar c = Calendar.getInstance();
                  float t = c.get(Calendar.HOUR_OF_DAY) * 60 + c.get(Calendar.MINUTE) + c.get(Calendar.SECOND) / 60f;
                  float[] dn = dayTimes();
                  float D = dn[0], N = dn[1], f;
                  if (t < D) f = 0;
                  else if (t < D + 30) f = (t - D) / 30f;
                  else if (t < N) f = 1;
                  else if (t < N + 30) f = 1 - (t - N) / 30f;
                  else f = 0;
                  int mn = minB(), mx = Math.max(mn, sp.getInt("maxb", 255));
                  int b = Math.round(mn + f * (mx - mn));
                  if (b != lastAutoB) {
                      lastAutoB = b;
                      setBright(b);
                  }
              }

