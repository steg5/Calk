              Location prevLoc;
              Object gnssCb;

              @android.annotation.TargetApi(24)
              void regGnss() {
                  android.location.GnssStatus.Callback cb = new android.location.GnssStatus.Callback() {
                      @Override
                      public void onSatelliteStatusChanged(android.location.GnssStatus st) {
                          int total = st.getSatelliteCount(), used = 0;
                          for (int i = 0; i < total; i++) if (st.usedInFix(i)) used++;
                          setSats(used, total);
                      }
                  };
                  gnssCb = cb;
                  lm.registerGnssStatusCallback(cb);
              }

              final LocationListener locL = new LocationListener() {
                  @Override
                  public void onLocationChanged(Location l) {
                      long now = System.currentTimeMillis();
                      boolean bad = l.hasSpeed() && l.getSpeed() * 3.6f > 190f;
                      if (map != null && !bad) map.setMyLocation(l.getLatitude(), l.getLongitude(), l.hasBearing() ? l.getBearing() : -1f, l.hasSpeed() ? l.getSpeed() : 0f);
                      float v = 0f;
                      if (l.hasSpeed()) {
                          v = l.getSpeed() * 3.6f;
                      } else if (prevLoc != null) {
                          float dt = (l.getTime() - prevLoc.getTime()) / 1000f;
                          if (dt > 0.3f && dt < 10f) v = prevLoc.distanceTo(l) / dt * 3.6f;
                      }
                      prevLoc = l;
                      if (v < 2f || v > 190f) v = 0f;
                      if (lastLoc > 0 && v > 0) {
                          float dt = Math.min(3f, (now - lastLoc) / 1000f);
                          distKm += v * dt / 3600f;
                          addKm(v * dt / 3600f);
                          movH += dt / 3600f;
                          sessKm += v * dt / 3600f;
                          sessH += dt / 3600f;
                          pendH += dt / 3600f;
                      }
                      lastLoc = now;
                      lastFix = now;
                      if (v > maxKmh) maxKmh = v;
                      if (v > sessMax) sessMax = v;
                      if (v > pendMax) pendMax = v;
                      tvSpeed.setText(String.valueOf(Math.round(v)));
                      showTrip();
                      if (now - lastSave > 15000) saveTrip();
                  }

                  @Override
                  public void onStatusChanged(String p, int s, Bundle e) {
                  }

                  @Override
                  public void onProviderEnabled(String p) {
                  }

                  @Override
                  public void onProviderDisabled(String p) {
                  }
              };

              void showTrip() {
                  float avg = movH > 0.0005f ? distKm / movH : 0f;
                  tvAvg.setText("Сер.  " + Math.round(avg));
                  tvMax.setText("Макс. " + Math.round(maxKmh));
                  updateOilBadge();
              }

              void saveTrip() {
                  lastSave = System.currentTimeMillis();
                  sp.edit().putFloat("max", maxKmh).putFloat("dist", distKm).putFloat("mov", movH)
                          .putFloat("odo", odo).putFloat("oil", oilKm).apply();
                  sp.edit().putFloat("s_km", sessKm).putFloat("s_max", sessMax).putFloat("s_h", sessH).apply();
                  if (pendH > 0 || pendMax > 0) {
                      String k2 = ymd(new Date());
                      dst.edit().putFloat(k2 + "h", dst.getFloat(k2 + "h", 0) + pendH)
                              .putFloat(k2 + "m", Math.max(dst.getFloat(k2 + "m", 0), pendMax)).apply();
                      pendH = 0;
                      pendMax = 0;
                  }
                  if (pendDay > 0) {
                      String k = ymd(new Date());
                      days.edit().putFloat(k, days.getFloat(k, 0) + pendDay).apply();
                      pendDay = 0;
                  }
              }

              float[] agg(String[] pre) {
                  float km = 0, h = 0, mx = 0;
                  for (Map.Entry<String, ?> e : days.getAll().entrySet()) {
                      if (!(e.getValue() instanceof Float)) continue;
                      String k = e.getKey();
                      boolean ok = false;
                      for (String q : pre) if (k.startsWith(q)) ok = true;
                      if (!ok) continue;
                      km += (Float) e.getValue();
                      h += dst.getFloat(k + "h", 0);
                      mx = Math.max(mx, dst.getFloat(k + "m", 0));
                  }
                  return new float[]{km, h, mx};
              }

