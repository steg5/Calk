                  LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(0, -1, 45);
                  lp.setMargins(dp(6), 0, 0, 0);
                  root.addView(sv, lp);
                  setContentView(root);
                  status();
                  log("Лабораторія тюнера. Натисни «0: як NavRadio», потім «АВТОТЕСТ».");
