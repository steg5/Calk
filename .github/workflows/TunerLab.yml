# ШАБЛОН НОВОГО ДОДАТКА. Заміни: TunerLab (ім'я файлу й workflow), com.example.tunerlab (пакет), "Лабораторія тюнера" (назва),
# а код у MainActivity.java та інші .java-файли додай блоками cat > ... <<'EOF' (відступ 10 пробілів).
name: TunerLab

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/TunerLab.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Write project
        run: |
          mkdir -p app/src/main/java/com/example/tunerlab app/src/main/res/drawable
          echo '' | base64 -d > debug.keystore

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'TunerLab'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=false
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.example.tunerlab'
              compileSdk 34
              defaultConfig {
                  applicationId "com.example.tunerlab"
                  minSdk 23
                  targetSdk 26
                  versionCode 1
                  versionName "1.0"
              }
              signingConfigs {
                  debug {
                      storeFile file("${rootDir}/debug.keystore")
                      storePassword 'android'
                      keyAlias 'androiddebugkey'
                      keyPassword 'android'
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
              lint {
                  abortOnError false
                  checkReleaseBuilds false
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE"/>
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"/>
              <uses-permission android:name="android.permission.READ_LOGS"/>
              <application
                  android:label="Лабораторія тюнера"
                  android:icon="@drawable/ic_launcher"
                  android:allowBackup="false"
                  android:usesCleartextTraffic="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/example/tunerlab/MainActivity.java <<'EOF'
          package com.example.tunerlab;

          import android.app.Activity;
          import android.content.ClipData;
          import android.content.ClipboardManager;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.os.Bundle;
          import android.os.Environment;
          import android.os.Handler;
          import android.os.Looper;
          import android.os.Message;
          import android.view.Gravity;
          import android.view.View;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import android.widget.Toast;

          import java.io.File;
          import java.io.FileOutputStream;
          import java.lang.reflect.Method;
          import java.text.SimpleDateFormat;
          import java.util.ArrayList;
          import java.util.Date;
          import java.util.List;
          import java.util.Locale;

          public class MainActivity extends Activity {
              static final int[] IDS12 = {0x109, 0x10a, 0x201, 0x203, 0x301, 0x302, 0x401, 0x402, 0x404, 0x405, 0x406, 0x9e00};
              static final int[] IDS_OLD = {0x401, 0x402, 0x404, 0x405, 0x406, 0x9e00, 0x9e11};

              Object util;
              Class<?> cls;
              Method wr, wr2;
              String hname = "";
              String modeName = "не підключено";
              final Handler ui = new Handler(Looper.getMainLooper());
              final Handler rx = new Handler(Looper.getMainLooper(), new Handler.Callback() {
                  @Override
                  public boolean handleMessage(Message m) {
                      onMsg(m);
                      return true;
                  }
              });
              TextView tvLog, tvSt;
              ScrollView sv;
              EditText etF, etW, etA1, etA2;
              final StringBuilder logb = new StringBuilder();
              final SimpleDateFormat tf = new SimpleDateFormat("HH:mm:ss.SSS", Locale.US);
              String lastLine = "";
              volatile int freq = -1, flags = 0;
              float d;

              int dp(float v) {
                  return Math.round(v * d);
              }

              void log(String s) {
                  final String ln = tf.format(new Date()) + " " + s + "\n";
                  if (ln.substring(13).equals(lastLine)) return;
                  lastLine = ln.substring(13);
                  logb.append(ln);
                  if (logb.length() > 200000) logb.delete(0, 50000);
                  if (tvLog != null) {
                      tvLog.append(ln);
                      sv.post(new Runnable() {
                          @Override
                          public void run() {
                              sv.fullScroll(View.FOCUS_DOWN);
                          }
                      });
                  }
              }

              static String hex(byte[] b) {
                  StringBuilder sb = new StringBuilder();
                  for (int i = 0; i < b.length && i < 32; i++) sb.append(String.format("%02x ", b[i] & 0xff));
                  return sb.toString();
              }

              // ---------- зв'язок ----------
              void disconnect() {
                  try {
                      if (util != null) {
                          try {
                              cls.getMethod("removeHandler", String.class).invoke(util, hname);
                          } catch (Throwable ignored) {
                          }
                          try {
                              cls.getMethod("stop").invoke(util);
                          } catch (Throwable ignored) {
                          }
                          try {
                              cls.getMethod("close").invoke(util);
                          } catch (Throwable ignored) {
                          }
                      }
                  } catch (Throwable ignored) {
                  }
                  util = null;
              }

              /** mode 0: як NavRadio (TWUtil(1), 12 id); 1: старий (без номера); 2: TWUtil(1) + слухати все; 3: старий + слухати все */
              void connect(int mode) {
                  disconnect();
                  try {
                      cls = Class.forName("android.tw.john.TWUtil");
                      boolean one = mode == 0 || mode == 2;
                      boolean wide = mode >= 2;
                      if (one) util = cls.getConstructor(int.class).newInstance(1);
                      else util = cls.getConstructor().newInstance();
                      int[] src;
                      if (wide) {
                          List<Integer> l = new ArrayList<Integer>();
                          for (int i = 0x100; i <= 0x7ff; i++) l.add(i);
                          for (int i = 0x9e00; i <= 0x9eff; i++) l.add(i);
                          src = new int[l.size()];
                          for (int i = 0; i < src.length; i++) src[i] = l.get(i);
                      } else src = mode == 0 ? IDS12 : IDS_OLD;
                      short[] ids = new short[src.length];
                      for (int i = 0; i < ids.length; i++) ids[i] = (short) src[i];
                      Object r = cls.getMethod("open", short[].class).invoke(util, (Object) ids);
                      cls.getMethod("start").invoke(util);
                      hname = "lab" + mode;
                      cls.getMethod("addHandler", String.class, Handler.class).invoke(util, hname, rx);
                      wr = cls.getMethod("write", int.class, int.class, int.class);
                      try {
                          wr2 = cls.getMethod("write", int.class, int.class);
                      } catch (Throwable e) {
                          wr2 = null;
                      }
                      modeName = "режим " + mode + (one ? " TWUtil(1)" : " TWUtil()") + (wide ? " слухати все" : "") + ", open=" + r;
                      log("ПІДКЛЮЧЕНО: " + modeName + ", ids=" + ids.length);
                  } catch (Throwable t) {
                      modeName = "помилка";
                      log("ПОМИЛКА підключення: " + (t.getCause() != null ? t.getCause() : t));
                  }
                  status();
              }

              void status() {
                  tvSt.setText(modeName + "   |   частота: " + freq + "   прапорці: 0x" + Integer.toHexString(flags));
              }

              int w3(int what, int a1, int a2) {
                  try {
                      if (wr == null) {
                          log("TX не вдалось: немає зв'язку");
                          return -1;
                      }
                      Object r = wr.invoke(util, what, a1, a2);
                      log("TX 0x" + Integer.toHexString(what) + " " + a1 + " " + a2 + " -> " + r);
                      return 0;
                  } catch (Throwable t) {
                      log("TX помилка " + t);
                      return -2;
                  }
              }

              int w2(int what, int a1) {
                  try {
                      if (wr2 == null) {
                          log("TX2 не вдалось: немає зв'язку");
                          return -1;
                      }
                      Object r = wr2.invoke(util, what, a1);
                      log("TX 0x" + Integer.toHexString(what) + " " + a1 + " -> " + r);
                      return 0;
                  } catch (Throwable t) {
                      log("TX помилка " + t);
                      return -2;
                  }
              }

              // ---------- прийом ----------
              final List<int[]> autoVals = new ArrayList<int[]>();
              volatile boolean autoOn = false;
              long autoT0 = 0;

              void onMsg(Message m) {
                  if (m.what == 0x401 && m.obj instanceof byte[] && ((byte[]) m.obj).length >= 13) {
                      byte[] b = (byte[]) m.obj;
                      int f = ((b[2] & 0xff) << 8) | (b[3] & 0xff);
                      flags = b[0] & 0xff;
                      boolean ch = f != freq;
                      freq = f;
                      log("RX 0x401 f=" + f + " fl=0x" + Integer.toHexString(flags) + " b1=" + (b[1] & 0xff) + (ch ? "" : " (без зміни)") + "  [" + hex(b) + "]");
                      if (autoOn && ch) autoVals.add(new int[]{(int) (System.currentTimeMillis() - autoT0), f});
                      status();
                  } else {
                      log("RX 0x" + Integer.toHexString(m.what) + " a1=" + m.arg1 + " a2=" + m.arg2 + " " + (m.obj instanceof byte[] ? hex((byte[]) m.obj) : String.valueOf(m.obj)));
                  }
              }

              // ---------- послідовності ----------
              void initNav() {
                  w3(0x301, 192, 1);
                  w2(0x9e00, 1);
                  w3(0x9e11, 192, 1);
                  w2(0x109, 255);
                  w2(0x10a, 255);
                  w3(0x10a, 255, 1);
                  w2(0x112, 255);
                  w3(0x10a, 255, 0);
                  w2(0x301, 255);
                  w2(0x406, 0);
                  w2(0x401, 255);
                  w2(0x404, 255);
                  w2(0x405, 255);
                  w2(0x203, 255);
              }

              int F() {
                  try {
                      return Integer.parseInt(etF.getText().toString().trim());
                  } catch (Throwable t) {
                      return 9770;
                  }
              }

              static final String[] VN = {"A: діапазон 0x401 5 0, потім 0x402 255 f", "B: 0x402 255 f", "C: 0x402 255 f*10 (кГц)", "D: 0x401 3 f (старий)", "E: 0x402 0 f", "F: 2 арг. 0x402 f"};

              void variant(int v, final int f) {
                  switch (v) {
                      case 0:
                          w3(0x401, 5, 0);
                          ui.postDelayed(new Runnable() {
                              @Override
                              public void run() {
                                  w3(0x402, 255, f);
                              }
                          }, 300);
                          break;
                      case 1:
                          w3(0x402, 255, f);
                          break;
                      case 2:
                          w3(0x402, 255, f * 10);
                          break;
                      case 3:
                          w3(0x401, 3, f);
                          break;
                      case 4:
                          w3(0x402, 0, f);
                          break;
                      default:
                          w2(0x402, f);
                  }
              }

              // автотест
              int ai = 0, aStart = 0, aTarget = 0;
              boolean aReached = false;
              long aSentAt = 0;

              void autoStart() {
                  if (util == null) {
                      log("Спершу підключись");
                      return;
                  }
                  ai = 0;
                  log("=== АВТОТЕСТ: 6 варіантів, по ~8 с кожен ===");
                  initNav();
                  ui.postDelayed(new Runnable() {
                      @Override
                      public void run() {
                          autoNext();
                      }
                  }, 1500);
              }

              void autoNext() {
                  if (ai >= VN.length) {
                      autoOn = false;
                      log("=== АВТОТЕСТ ЗАВЕРШЕНО. Скопіюй журнал і надішли ===");
                      return;
                  }
                  aStart = freq > 0 ? freq : 9770;
                  aTarget = aStart + 150 <= 10750 ? aStart + 150 : aStart - 150;
                  if (ai % 2 == 1 && aStart - 150 >= 8800) aTarget = aStart - 150;
                  autoVals.clear();
                  autoOn = true;
                  autoT0 = System.currentTimeMillis();
                  aReached = false;
                  log("--- ТЕСТ " + VN[ai] + ": " + aStart + " -> " + aTarget);
                  variant(ai, aTarget);
                  pollAuto();
              }

              void pollAuto() {
                  ui.postDelayed(new Runnable() {
                      @Override
                      public void run() {
                          long el = System.currentTimeMillis() - autoT0;
                          boolean reached = Math.abs(freq - aTarget) <= 1;
                          if (reached || el > 7000) {
                              int first = autoVals.isEmpty() ? -1 : autoVals.get(0)[0];
                              int mid = 0;
                              for (int[] e : autoVals) if (e[1] != aTarget && e[1] != aStart) mid++;
                              String verdict = reached ? (el < 800 && mid <= 2 ? "МИТТЄВО" : "ПОВІЛЬНО (їде поступово)") : "НЕ ДІЙШЛО";
                              log("РЕЗУЛЬТАТ " + VN[ai] + ": перша зміна " + first + " мс; " + (reached ? "дійшло за " + el + " мс" : "не дійшло за 7 с, зараз " + freq) + "; проміжних значень " + mid + " => " + verdict);
                              autoOn = false;
                              ai++;
                              ui.postDelayed(new Runnable() {
                                  @Override
                                  public void run() {
                                      autoNext();
                                  }
                              }, 1800);
                          } else pollAuto();
                      }
                  }, 100);
              }

              // ---------- журнал ----------
              void copyLog() {
                  try {
                      ClipboardManager cm = (ClipboardManager) getSystemService(Context.CLIPBOARD_SERVICE);
                      cm.setPrimaryClip(ClipData.newPlainText("log", logb.toString()));
                      Toast.makeText(this, "Журнал скопійовано", Toast.LENGTH_SHORT).show();
                  } catch (Throwable t) {
                      Toast.makeText(this, "" + t, Toast.LENGTH_LONG).show();
                  }
              }

              void saveLog() {
                  try {
                      if (android.os.Build.VERSION.SDK_INT >= 23 && checkSelfPermission(android.Manifest.permission.WRITE_EXTERNAL_STORAGE) != PackageManager.PERMISSION_GRANTED) {
                          requestPermissions(new String[]{android.Manifest.permission.WRITE_EXTERNAL_STORAGE}, 1);
                          Toast.makeText(this, "Дай дозвіл і натисни ще раз", Toast.LENGTH_LONG).show();
                          return;
                      }
                      File f = new File(Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS), "tunerlab.txt");
                      FileOutputStream o = new FileOutputStream(f);
                      o.write(logb.toString().getBytes("UTF-8"));
                      o.close();
                      Toast.makeText(this, "Збережено: " + f.getAbsolutePath(), Toast.LENGTH_LONG).show();
                  } catch (Throwable t) {
                      Toast.makeText(this, "" + t, Toast.LENGTH_LONG).show();
                  }
              }

              void logcat() {
                  new Thread(new Runnable() {
                      @Override
                      public void run() {
                          try {
                              Process p = Runtime.getRuntime().exec(new String[]{"logcat", "-d", "-v", "time", "-t", "400"});
                              java.io.BufferedReader br = new java.io.BufferedReader(new java.io.InputStreamReader(p.getInputStream()));
                              String ln;
                              final StringBuilder sb = new StringBuilder();
                              while ((ln = br.readLine()) != null) {
                                  String l2 = ln.toLowerCase();
                                  if (l2.contains("tw") || l2.contains("radio") || l2.contains("tuner") || l2.contains("mcu")) sb.append(ln).append('\n');
                              }
                              final String res = sb.length() == 0 ? "(logcat: нічого про tw/radio — на цій версії Android чужі логи недоступні)" : sb.toString();
                              ui.post(new Runnable() {
                                  @Override
                                  public void run() {
                                      log("LOGCAT:\n" + res);
                                  }
                              });
                          } catch (final Throwable t) {
                              ui.post(new Runnable() {
                                  @Override
                                  public void run() {
                                      log("logcat помилка " + t);
                                  }
                              });
                          }
                      }
                  }).start();
              }

              void openApp(String pkg) {
                  try {
                      Intent i = getPackageManager().getLaunchIntentForPackage(pkg);
                      if (i == null) {
                          Toast.makeText(this, "Немає програми " + pkg, Toast.LENGTH_LONG).show();
                          return;
                      }
                      startActivity(i);
                  } catch (Throwable t) {
                      Toast.makeText(this, "" + t, Toast.LENGTH_LONG).show();
                  }
              }

              // ---------- інтерфейс ----------
              Button btn(String t, final Runnable r) {
                  Button b = new Button(this);
                  b.setText(t);
                  b.setAllCaps(false);
                  b.setTextColor(Color.WHITE);
                  b.setTextSize(13);
                  b.setSingleLine(false);
                  b.setMaxLines(2);
                  b.setPadding(dp(6), 0, dp(6), 0);
                  GradientDrawable g = new GradientDrawable();
                  g.setColor(0xFF2A3440);
                  g.setCornerRadius(dp(10));
                  b.setBackground(g);
                  b.setOnClickListener(new View.OnClickListener() {
                      @Override
                      public void onClick(View v) {
                          r.run();
                      }
                  });
                  return b;
              }

              LinearLayout row(Button... bs) {
                  LinearLayout l = new LinearLayout(this);
                  for (Button b : bs) {
                      LinearLayout.LayoutParams p = new LinearLayout.LayoutParams(0, dp(48), 1);
                      p.setMargins(dp(3), dp(3), dp(3), dp(3));
                      l.addView(b, p);
                  }
                  return l;
              }

              EditText ed(String hint, String v) {
                  EditText e = new EditText(this);
                  e.setHint(hint);
                  e.setText(v);
                  e.setTextColor(Color.WHITE);
                  e.setHintTextColor(0xFF8A99B3);
                  e.setSingleLine(true);
                  e.setTextSize(14);
                  return e;
              }

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  d = getResources().getDisplayMetrics().density;
                  LinearLayout root = new LinearLayout(this);
                  root.setBackgroundColor(0xFF101418);
                  root.setPadding(dp(8), dp(6), dp(8), dp(6));

                  LinearLayout left = new LinearLayout(this);
                  left.setOrientation(LinearLayout.VERTICAL);
                  tvSt = new TextView(this);
                  tvSt.setTextColor(0xFF4FC3F7);
                  tvSt.setTextSize(13);
                  left.addView(tvSt);
                  TextView h1 = new TextView(this);
                  h1.setText("1. Підключення");
                  h1.setTextColor(0xFFFFB74D);
                  left.addView(h1);
                  left.addView(row(btn("0: як NavRadio", new Runnable() {
                      public void run() {
                          connect(0);
                      }
                  }), btn("1: старий", new Runnable() {
                      public void run() {
                          connect(1);
                      }
                  })));
                  left.addView(row(btn("2: NavRadio + слухати ВСЕ", new Runnable() {
                      public void run() {
                          connect(2);
                      }
                  }), btn("3: старий + слухати ВСЕ", new Runnable() {
                      public void run() {
                          connect(3);
                      }
                  })));
                  left.addView(row(btn("Ініціалізація як NavRadio", new Runnable() {
                      public void run() {
                          initNav();
                      }
                  }), btn("АВТОТЕСТ (усі варіанти)", new Runnable() {
                      public void run() {
                          autoStart();
                      }
                  })));
                  TextView h2 = new TextView(this);
                  h2.setText("2. Ручні тести (частота в одиницях 10 кГц, напр. 9770 = 97.70)");
                  h2.setTextColor(0xFFFFB74D);
                  left.addView(h2);
                  etF = ed("частота", "9770");
                  left.addView(etF);
                  left.addView(row(btn(VN[0], new Runnable() {
                      public void run() {
                          variant(0, F());
                      }
                  }), btn(VN[1], new Runnable() {
                      public void run() {
                          variant(1, F());
                      }
                  })));
                  left.addView(row(btn(VN[2], new Runnable() {
                      public void run() {
                          variant(2, F());
                      }
                  }), btn(VN[3], new Runnable() {
                      public void run() {
                          variant(3, F());
                      }
                  })));
                  left.addView(row(btn(VN[4], new Runnable() {
                      public void run() {
                          variant(4, F());
                      }
                  }), btn(VN[5], new Runnable() {
                      public void run() {
                          variant(5, F());
                      }
                  })));
                  TextView h3 = new TextView(this);
                  h3.setText("3. Своя команда (what у hex, a1, a2)");
                  h3.setTextColor(0xFFFFB74D);
                  left.addView(h3);
                  LinearLayout cr = new LinearLayout(this);
                  etW = ed("what hex", "402");
                  etA1 = ed("a1", "255");
                  etA2 = ed("a2", "9770");
                  cr.addView(etW, new LinearLayout.LayoutParams(0, -2, 1));
                  cr.addView(etA1, new LinearLayout.LayoutParams(0, -2, 1));
                  cr.addView(etA2, new LinearLayout.LayoutParams(0, -2, 1));
                  left.addView(cr);
                  left.addView(row(btn("Надіслати (3 арг.)", new Runnable() {
                      public void run() {
                          try {
                              w3(Integer.parseInt(etW.getText().toString().trim(), 16), Integer.parseInt(etA1.getText().toString().trim()), Integer.parseInt(etA2.getText().toString().trim()));
                          } catch (Throwable t) {
                              log("невірні числа");
                          }
                      }
                  }), btn("Надіслати (2 арг.)", new Runnable() {
                      public void run() {
                          try {
                              w2(Integer.parseInt(etW.getText().toString().trim(), 16), Integer.parseInt(etA1.getText().toString().trim()));
                          } catch (Throwable t) {
                              log("невірні числа");
                          }
                      }
                  })));
                  TextView h4 = new TextView(this);
                  h4.setText("4. Підслухати штатне / NavRadio: підключись режимом 2 або 3, відкрий їх, поворуши повзунок, повернись сюди");
                  h4.setTextColor(0xFFFFB74D);
                  left.addView(h4);
                  left.addView(row(btn("Відкрити штатне радіо", new Runnable() {
                      public void run() {
                          openApp("com.tw.radio");
                      }
                  }), btn("Відкрити NavRadio", new Runnable() {
                      public void run() {
                          openApp("com.navimods.radio_free");
                      }
                  })));
                  left.addView(row(btn("Спробувати logcat", new Runnable() {
                      public void run() {
                          logcat();
                      }
                  }), btn("Позначка в журналі", new Runnable() {
                      public void run() {
                          log("=========== ПОЗНАЧКА ===========");
                      }
                  })));
                  left.addView(row(btn("Копіювати журнал", new Runnable() {
