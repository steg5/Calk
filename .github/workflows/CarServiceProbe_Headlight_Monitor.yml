name: Build CarServiceProbe Headlight Monitor APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Create Android project
        shell: bash
        run: |
          mkdir -p app/src/main/java/ua/step/carserviceprobe

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "CarServiceProbe"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'ua.step.carserviceprobe'
              compileSdk 35

              defaultConfig {
                  applicationId 'ua.step.carserviceprobe'
                  minSdk 23
                  targetSdk 27
                  versionCode 3
                  versionName '1.2-headlight-monitor'
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="false"
                  android:label="CarService Probe"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/ua/step/carserviceprobe/MainActivity.java <<'EOF'
          package ua.step.carserviceprobe;

          import android.app.Activity;
          import android.content.ComponentName;
          import android.content.Context;
          import android.content.Intent;
          import android.content.ServiceConnection;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.IBinder;
          import android.os.Looper;
          import android.os.Parcel;
          import android.view.Gravity;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import java.text.SimpleDateFormat;
          import java.util.Date;
          import java.util.Locale;

          public class MainActivity extends Activity {
              private static final String SERVICE_PACKAGE = "com.tw.carinfoservice";
              private static final String SERVICE_CLASS = "com.tw.carinfoservice.CarService";
              private static final String SERVICE_ACTION = "com.tw.carinfoservice.CarService.Bind";
              private static final String SERVICE_DESCRIPTOR =
                      "com.tw.carinfoservice.CarServiceAidl";
              private static final int TRANSACTION_GET_HEADLIGHT = 5;
              private static final long POLL_INTERVAL_MS = 500;

              private final Handler handler = new Handler(Looper.getMainLooper());
              private final SimpleDateFormat clock =
                      new SimpleDateFormat("HH:mm:ss.SSS", Locale.getDefault());

              private TextView statusView;
              private TextView valueView;
              private TextView changedView;
              private TextView historyView;

              private boolean bound = false;
              private boolean polling = false;
              private boolean pollInProgress = false;
              private IBinder carBinder;
              private ServiceConnection connection;
              private int lastValue = Integer.MIN_VALUE;
              private int sampleCount = 0;

              private final Runnable pollTask = new Runnable() {
                  @Override
                  public void run() {
                      if (!polling || !bound || carBinder == null) return;
                      readHeadlight();
                      handler.postDelayed(this, POLL_INTERVAL_MS);
                  }
              };

              private String now() {
                  return clock.format(new Date());
              }

              private void appendHistory(String line) {
                  historyView.append(line + "\n");
                  if (historyView.length() > 12000) {
                      historyView.setText(historyView.getText().subSequence(
                              historyView.length() - 9000, historyView.length()));
                  }
              }

              private void setStatus(String text) {
                  statusView.setText("CarService: " + text);
              }

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(20, 20, 20, 20);

                  TextView title = new TextView(this);
                  title.setText("CarService Probe");
                  title.setTextSize(25);
                  title.setGravity(Gravity.CENTER);
                  root.addView(title);

                  statusView = new TextView(this);
                  statusView.setTextSize(18);
                  statusView.setText("CarService: ПІДКЛЮЧЕННЯ...");
                  root.addView(statusView);

                  valueView = new TextView(this);
                  valueView.setTextSize(30);
                  valueView.setText("SendHeadlight: очікування");
                  root.addView(valueView);

                  changedView = new TextView(this);
                  changedView.setTextSize(16);
                  changedView.setText("Остання зміна: ще немає");
                  root.addView(changedView);

                  TextView explanation = new TextView(this);
                  explanation.setTextSize(14);
                  explanation.setText(
                          "Автоматичне читання Binder-транзакції №5 кожні 500 мс. " +
                          "Жодних команд запису в CAN або UART не надсилається.");
                  root.addView(explanation);

                  TextView historyTitle = new TextView(this);
                  historyTitle.setText("Історія значень:");
                  historyTitle.setTextSize(18);
                  root.addView(historyTitle);

                  historyView = new TextView(this);
                  historyView.setTextSize(14);
                  historyView.setTextIsSelectable(true);
                  ScrollView scroll = new ScrollView(this);
                  scroll.addView(historyView);
                  root.addView(scroll, new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT, 0, 1f));

                  setContentView(root);
                  setStatus("ПІДКЛЮЧЕННЯ...");
                  appendHistory(now() + "  Запуск монітора");
                  connectToCarService();
              }

              private void connectToCarService() {
                  connection = new ServiceConnection() {
                      @Override
                      public void onServiceConnected(ComponentName name, IBinder service) {
                          carBinder = service;
                          bound = true;
                          setStatus(service.isBinderAlive() ? "ПІДКЛЮЧЕНО" : "BINDER НЕАКТИВНИЙ");
                          appendHistory(now() + "  CarService підключено");
                          try {
                              appendHistory("Descriptor: " + service.getInterfaceDescriptor());
                          } catch (Exception e) {
                              appendHistory("Descriptor error: " + e);
                          }
                          startPolling();
                      }

                      @Override
                      public void onServiceDisconnected(ComponentName name) {
                          stopPolling();
                          bound = false;
                          carBinder = null;
                          setStatus("ВІД'ЄДНАНО");
                          appendHistory(now() + "  CarService від'єднався");
                      }

                      @Override
                      public void onBindingDied(ComponentName name) {
                          stopPolling();
                          bound = false;
                          carBinder = null;
                          setStatus("BINDING DIED");
                          appendHistory(now() + "  Binding died");
                      }

                      @Override
                      public void onNullBinding(ComponentName name) {
                          stopPolling();
                          bound = false;
                          carBinder = null;
                          setStatus("NULL BINDING");
                          appendHistory(now() + "  Null binding");
                      }
                  };

                  Intent intent = new Intent();
                  intent.setComponent(new ComponentName(SERVICE_PACKAGE, SERVICE_CLASS));
                  intent.setAction(SERVICE_ACTION);

                  try {
                      boolean accepted = bindService(intent, connection, Context.BIND_AUTO_CREATE);
                      appendHistory(now() + "  bindService(): " + accepted);
                      if (!accepted) setStatus("НЕ ВДАЛОСЯ ПІДКЛЮЧИТИСЯ");
                  } catch (Exception e) {
                      setStatus("ПОМИЛКА ПІДКЛЮЧЕННЯ");
                      appendHistory(now() + "  " + e);
                  }
              }

              private void startPolling() {
                  if (polling) return;
                  polling = true;
                  lastValue = Integer.MIN_VALUE;
                  sampleCount = 0;
                  appendHistory(now() + "  Опитування запущено, інтервал 500 мс");
                  handler.post(pollTask);
              }

              private void stopPolling() {
                  polling = false;
                  handler.removeCallbacks(pollTask);
              }

              private void readHeadlight() {
                  if (pollInProgress || !bound || carBinder == null ||
                          !carBinder.isBinderAlive()) return;

                  pollInProgress = true;
                  Parcel data = Parcel.obtain();
                  Parcel reply = Parcel.obtain();

                  try {
                      data.writeInterfaceToken(SERVICE_DESCRIPTOR);
                      boolean handled = carBinder.transact(
                              TRANSACTION_GET_HEADLIGHT, data, reply, 0);

                      if (!handled) {
                          setStatus("ПІДКЛЮЧЕНО, АЛЕ ТРАНЗАКЦІЮ №5 НЕ ОБРОБЛЕНО");
                          appendHistory(now() + "  transact(5) повернув false");
                          stopPolling();
                          return;
                      }

                      reply.readException();
                      int value = reply.readInt();
                      sampleCount++;
                      valueView.setText("SendHeadlight: " + value);

                      if (value != lastValue) {
                          String label;
                          if (value == 1) label = "1 (ймовірно ON)";
                          else if (value == 0) label = "0 (ймовірно OFF)";
                          else if (value == -1) label = "-1 (недоступне/не задане)";
                          else label = value + " (невідоме значення)";

                          changedView.setText("Остання зміна: " + now() + " → " + label);
                          appendHistory(now() + "  ЗМІНА: " + lastValue +
                                  " → " + value + " [" + label + "]");
                          lastValue = value;
                      }

                      if (sampleCount % 20 == 0) {
                          appendHistory(now() + "  Контрольне значення: " + value +
                                  " (зразок " + sampleCount + ")");
                      }
                  } catch (Exception e) {
                      setStatus("ПОМИЛКА ЧИТАННЯ");
                      appendHistory(now() + "  Помилка transact/read: " + e);
                      stopPolling();
                  } finally {
                      reply.recycle();
                      data.recycle();
                      pollInProgress = false;
                  }
              }

              @Override
              protected void onDestroy() {
                  stopPolling();
                  if (connection != null) {
                      try {
                          unbindService(connection);
                      } catch (Exception ignored) {
                      }
                  }
                  bound = false;
                  carBinder = null;
                  super.onDestroy();
              }
          }
          EOF

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK components
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found"
            exit 1
          fi
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CarServiceProbe-Headlight-Monitor-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
