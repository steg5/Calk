                  s.id = c.getLong(0);
                  s.st = c.getLong(1);
                  s.en = c.getLong(2);
                  s.stLvl = c.getInt(3);
                  s.enLvl = c.getInt(4);
                  s.stCc = c.getLong(5);
                  s.enCc = c.getLong(6);
                  s.el = c.getLong(7);
                  s.up = c.getLong(8);
                  s.sched = c.getInt(9) != 0;
                  s.snapA = c.getLong(10);
                  s.snapB = c.getLong(11);
