          /** One birthday or name day taken from a contact. */
          final class BdayEv {
              String name, lookup;
              long id;
              boolean nameday;
              int month, day, year;
              int days;
              int age = -1;
          }

          final class Bday {
              private static final String[] MONTHS = {"січ.", "лют.", "бер.", "квіт.", "трав.", "черв.", "лип.", "серп.", "вер.", "жовт.", "лист.", "груд."};
              private static final int[] TILE = {R.id.t1, R.id.t2, R.id.t3, R.id.t4};
              private static final int[] PIC = {R.id.p1, R.id.p2, R.id.p3, R.id.p4};
              private static final int[] AGE = {R.id.a1, R.id.a2, R.id.a3, R.id.a4};
              private static final int[] DAYS = {R.id.d1, R.id.d2, R.id.d3, R.id.d4};
              private static final int[] NAME = {R.id.n1, R.id.n2, R.id.n3, R.id.n4};
              private static final int[] COLORS = {0xFF168C83, 0xFF3978C6, 0xFF8064B5, 0xFF27866A, 0xFFB77924, 0xFFC2554B};

              static boolean hasPerm(Context c) {
                  return c.checkSelfPermission(Manifest.permission.READ_CONTACTS) == PackageManager.PERMISSION_GRANTED;
              }

              static int accent(Context c) {
                  int[] colors = {0xFF168C83, 0xFF3978C6, 0xFF8064B5, 0xFF27866A, 0xFFB77924};
                  return colors[Math.floorMod(Prefs.get(c).getInt("theme", 0), colors.length)];
              }

              /** Returns {year, month, day}; year 0 = unknown. */
              static int[] parse(String s) {
                  if (s == null) return null;
                  s = s.trim();
                  try {
                      Matcher m = Pattern.compile("^(\\d{4})-(\\d{1,2})-(\\d{1,2})").matcher(s);
                      int y, mo, d;
                      if (m.find()) {
                          y = Integer.parseInt(m.group(1));
                          mo = Integer.parseInt(m.group(2));
                          d = Integer.parseInt(m.group(3));
                      } else {
                          m = Pattern.compile("^--(\\d{1,2})-(\\d{1,2})").matcher(s);
                          if (m.find()) {
                              y = 0;
                              mo = Integer.parseInt(m.group(1));
                              d = Integer.parseInt(m.group(2));
                          } else {
                              m = Pattern.compile("^(\\d{4})(\\d{2})(\\d{2})$").matcher(s);
                              if (!m.find()) return null;
                              y = Integer.parseInt(m.group(1));
                              mo = Integer.parseInt(m.group(2));
                              d = Integer.parseInt(m.group(3));
                          }
                      }
                      if (y < 1800) y = 0;
                      if (mo < 1 || mo > 12 || d < 1 || d > 31) return null;
                      return new int[]{y, mo, d};
                  } catch (Throwable t) { return null; }
              }

              private static Calendar dayStart(Calendar c) {
                  Calendar x = (Calendar) c.clone();
                  x.set(Calendar.HOUR_OF_DAY, 0);
                  x.set(Calendar.MINUTE, 0);
                  x.set(Calendar.SECOND, 0);
                  x.set(Calendar.MILLISECOND, 0);
                  return x;
              }

              private static Calendar occurrence(int year, int month, int day) {
                  Calendar c = Calendar.getInstance();
                  c.clear();
                  c.set(year, month - 1, 1, 0, 0, 0);
                  c.set(Calendar.DAY_OF_MONTH, Math.min(day, c.getActualMaximum(Calendar.DAY_OF_MONTH)));
                  return c;
              }

              /** All birthdays and name days from contacts, nearest first. */
              static List<BdayEv> load(Context c) {
                  List<BdayEv> out = new ArrayList<>();
                  if (!hasPerm(c)) return out;
                  Calendar today = dayStart(Calendar.getInstance());
                  Set<String> seen = new HashSet<>();
                  Cursor cur = null;
                  try {
                      cur = c.getContentResolver().query(ContactsContract.Data.CONTENT_URI,
                              new String[]{ContactsContract.Data.CONTACT_ID, ContactsContract.Data.LOOKUP_KEY, ContactsContract.Data.DISPLAY_NAME,
                                      ContactsContract.CommonDataKinds.Event.START_DATE, ContactsContract.CommonDataKinds.Event.TYPE,
                                      ContactsContract.CommonDataKinds.Event.LABEL},
                              ContactsContract.Data.MIMETYPE + "=?", new String[]{ContactsContract.CommonDataKinds.Event.CONTENT_ITEM_TYPE}, null);
                      while (cur != null && cur.moveToNext()) {
                          long id = cur.getLong(0);
                          int type = cur.getInt(4);
                          String label = cur.getString(5);
                          String lb = label == null ? "" : label.toLowerCase(Locale.ROOT);
                          boolean name = lb.contains("імен") || lb.contains("имен") || lb.contains("name day") || lb.contains("nameday");
                          boolean birth = type == ContactsContract.CommonDataKinds.Event.TYPE_BIRTHDAY
                                  || lb.contains("народж") || lb.contains("рожд") || lb.contains("birth");
                          if (!name && !birth) continue;
                          int[] d = parse(cur.getString(3));
                          if (d == null) continue;
                          boolean nd = name && !(type == ContactsContract.CommonDataKinds.Event.TYPE_BIRTHDAY);
                          String key = id + "/" + nd + "/" + d[1] + "/" + d[2];
                          if (!seen.add(key)) continue;
                          BdayEv e = new BdayEv();
                          e.id = id;
                          e.lookup = cur.getString(1);
                          e.name = cur.getString(2) == null ? "?" : cur.getString(2);
                          e.nameday = nd;
                          e.year = d[0];
                          e.month = d[1];
                          e.day = d[2];
                          int y = today.get(Calendar.YEAR);
                          Calendar n = occurrence(y, e.month, e.day);
                          if (n.before(today)) n = occurrence(y + 1, e.month, e.day);
                          e.days = (int) Math.round((n.getTimeInMillis() - today.getTimeInMillis()) / 86400000.0);
                          if (!nd && e.year > 0) e.age = n.get(Calendar.YEAR) - e.year;
                          out.add(e);
                      }
                  } catch (Throwable ignored) {
                  } finally {
                      if (cur != null) cur.close();
                  }
                  Collections.sort(out, (a, b) -> a.days != b.days ? Integer.compare(a.days, b.days) : a.name.compareToIgnoreCase(b.name));
                  return out;
              }

              static String years(int n) {
                  int m10 = n % 10, m100 = n % 100;
                  String w = (m10 == 1 && m100 != 11) ? "рік" : (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) ? "роки" : "років";
                  return n + " " + w;
              }

              static String daysText(int d) { return d == 0 ? "сьогодні" : d == 1 ? "завтра" : d + " дн."; }

              static String dateText(BdayEv e) { return e.day + " " + MONTHS[e.month - 1]; }

              /** Contact photo scaled to about maxPx, or a coloured tile with the initial. */
              static Bitmap photo(Context c, BdayEv e, int maxPx) {
                  try {
                      Uri u = ContentUris.withAppendedId(ContactsContract.Contacts.CONTENT_URI, e.id);
                      InputStream is = ContactsContract.Contacts.openContactPhotoInputStream(c.getContentResolver(), u, true);
                      if (is != null) {
                          ByteArrayOutputStream bo = new ByteArrayOutputStream();
                          byte[] buf = new byte[16384];
                          int n;
                          while ((n = is.read(buf)) > 0) bo.write(buf, 0, n);
                          is.close();
                          byte[] data = bo.toByteArray();
                          BitmapFactory.Options o = new BitmapFactory.Options();
                          o.inJustDecodeBounds = true;
                          BitmapFactory.decodeByteArray(data, 0, data.length, o);
                          int s = 1;
                          while (Math.max(o.outWidth, o.outHeight) / (s * 2) >= maxPx) s *= 2;
                          BitmapFactory.Options o2 = new BitmapFactory.Options();
                          o2.inSampleSize = s;
                          Bitmap b = BitmapFactory.decodeByteArray(data, 0, data.length, o2);
                          if (b != null) return b;
                      }
                  } catch (Throwable ignored) { }
                  Bitmap b = Bitmap.createBitmap(maxPx, maxPx, Bitmap.Config.ARGB_8888);
                  Canvas cv = new Canvas(b);
                  cv.drawColor(COLORS[Math.floorMod((int) e.id, COLORS.length)]);
                  Paint p = new Paint(Paint.ANTI_ALIAS_FLAG);
                  p.setColor(0xFFFFFFFF);
                  p.setTextAlign(Paint.Align.CENTER);
                  p.setTypeface(Typeface.DEFAULT_BOLD);
                  p.setTextSize(maxPx * 0.5f);
                  String ini = e.name.isEmpty() ? "?" : e.name.substring(0, 1).toUpperCase(Locale.ROOT);
                  cv.drawText(ini, maxPx / 2f, maxPx * 0.66f, p);
                  return b;
              }

              private static boolean installed(Context c, String pkg) {
                  try { c.getPackageManager().getPackageInfo(pkg, 0); return true; } catch (Throwable t) { return false; }
              }

              /** Intent that opens a contact in the app chosen in the "Свята" tab (auto: the system contacts app). */
              static Intent viewIntent(Context c, long id, String lookup) {
                  Intent i = new Intent(Intent.ACTION_VIEW);
                  i.setDataAndType(ContactsContract.Contacts.getLookupUri(id, lookup), ContactsContract.Contacts.CONTENT_ITEM_TYPE);
                  String pkg = Prefs.get(c).getString("bd_app", "");
                  if (pkg.isEmpty()) {
                      String[] cand = {"com.google.android.contacts", "com.android.contacts", "com.samsung.android.contacts"};
                      for (String k : cand) if (installed(c, k)) { pkg = k; break; }
                  }
                  if (!pkg.isEmpty() && !pkg.equals("-")) {
                      i.setPackage(pkg);
                      try { if (c.getPackageManager().queryIntentActivities(i, 0).isEmpty()) i.setPackage(null); } catch (Throwable ignored) { }
                  }
                  return i;
              }

              /** Apps able to open a contact: {package, label} pairs. */
              static List<String[]> contactApps(Context c) {
                  List<String[]> out = new ArrayList<>();
                  Set<String> seen = new HashSet<>();
                  try {
                      Intent i = new Intent(Intent.ACTION_VIEW);
                      i.setDataAndType(ContentUris.withAppendedId(ContactsContract.Contacts.CONTENT_URI, 1), ContactsContract.Contacts.CONTENT_ITEM_TYPE);
                      for (android.content.pm.ResolveInfo r : c.getPackageManager().queryIntentActivities(i, 0)) {
                          String pk = r.activityInfo.packageName;
                          if (seen.add(pk)) out.add(new String[]{pk, String.valueOf(r.loadLabel(c.getPackageManager()))});
                      }
                  } catch (Throwable ignored) { }
                  return out;
              }

              static String appLabel(Context c) {
                  String pkg = Prefs.get(c).getString("bd_app", "");
                  if (pkg.isEmpty()) return "авто";
                  if (pkg.equals("-")) return "щоразу питати";
                  try {
                      android.content.pm.PackageManager pm = c.getPackageManager();
                      return String.valueOf(pm.getApplicationLabel(pm.getApplicationInfo(pkg, 0)));
                  } catch (Throwable t) { return pkg; }
              }

              // ------------------------------------------------------------ widget

              static void updateWidgets(Context c) {
                  try {
                      AppWidgetManager m = AppWidgetManager.getInstance(c);
                      int[] ids = m.getAppWidgetIds(new ComponentName(c, BdayWidget.class));
                      if (ids == null || ids.length == 0) return;
                      List<BdayEv> l = load(c);
                      RemoteViews rv = new RemoteViews(c.getPackageName(), R.layout.bday_widget);
                      PendingIntent open = PendingIntent.getActivity(c, 0, new Intent(c, MainActivity.class), PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT);
                      rv.setOnClickPendingIntent(R.id.root, open);
                      if (l.isEmpty()) {
                          rv.setTextViewText(R.id.empty, hasPerm(c) ? "Немає днів народження в контактах" : "Дайте доступ до контактів у застосунку");
                          rv.setViewVisibility(R.id.empty, View.VISIBLE);
                      } else {
                          rv.setViewVisibility(R.id.empty, View.GONE);
                      }
                      for (int i = 0; i < 4; i++) {
                          if (i >= l.size()) {
                              rv.setViewVisibility(TILE[i], View.INVISIBLE);
                              continue;
                          }
                          BdayEv e = l.get(i);
                          rv.setViewVisibility(TILE[i], View.VISIBLE);
                          rv.setImageViewBitmap(PIC[i], photo(c, e, 260));
                          String a = e.nameday ? "🎈" : ("🎂" + (e.age >= 0 ? " " + e.age : ""));
                          rv.setTextViewText(AGE[i], a);
                          rv.setTextViewText(DAYS[i], String.valueOf(e.days));
                          rv.setTextViewText(NAME[i], e.name);
                          Intent vi = viewIntent(c, e.id, e.lookup);
                          PendingIntent pi = PendingIntent.getActivity(c, 10 + i, vi, PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT);
                          rv.setOnClickPendingIntent(TILE[i], pi);
                      }
                      m.updateAppWidget(ids, rv);
                  } catch (Throwable ignored) { }
              }

              // ------------------------------------------------------------ alarms and notification

              private static PendingIntent pending(Context c, int code) {
                  Intent i = new Intent(c, BdayReceiver.class).setAction("com.example.nightnet.BDAY." + code);
                  return PendingIntent.getBroadcast(c, code, i, PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT);
              }

              /** One alarm after midnight (refresh the widget) and one at the chosen time (reminder). */
              static void schedule(Context c) {
                  try {
                      AlarmManager am = c.getSystemService(AlarmManager.class);
                      SharedPreferences p = Prefs.get(c);
                      Calendar mid = dayStart(Calendar.getInstance());
                      mid.add(Calendar.DAY_OF_YEAR, 1);
                      mid.add(Calendar.MINUTE, 5);
                      am.set(AlarmManager.RTC, mid.getTimeInMillis(), pending(c, 160));
                      if (!p.getBoolean("bd_notify", true)) {
                          am.cancel(pending(c, 170));
                          return;
                      }
                      int min = p.getInt("bd_min", 9 * 60);
                      Calendar t = dayStart(Calendar.getInstance());
                      t.add(Calendar.MINUTE, min);
                      if (!t.after(Calendar.getInstance())) t.add(Calendar.DAY_OF_YEAR, 1);
                      am.setAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, t.getTimeInMillis(), pending(c, 170));
                  } catch (Throwable ignored) { }
              }

              private static String lineFor(BdayEv e, String when) {
                  String what = e.nameday ? "іменини" : "день народження" + (e.age >= 0 ? " (" + years(e.age) + ")" : "");
                  return when + ": " + e.name + " — " + what;
              }

              /** Posts the reminder for today's events and for events in bd_days days. test = show the next three events. */
              static void notifyNow(Context c, boolean test) {
                  try {
                      SharedPreferences p = Prefs.get(c);
                      if (!test && !p.getBoolean("bd_notify", true)) return;
                      if (!hasPerm(c)) return;
                      Calendar now = Calendar.getInstance();
                      String key = now.get(Calendar.YEAR) + "-" + now.get(Calendar.DAY_OF_YEAR);
                      if (!test && key.equals(p.getString("bd_last", ""))) return;
                      int n = p.getInt("bd_days", 1);
                      List<BdayEv> l = load(c);
                      List<String> lines = new ArrayList<>();
                      for (BdayEv e : l) {
                          if (test ? lines.size() < 3 : (e.days == 0 || e.days == n)) {
                              lines.add(lineFor(e, e.days == 0 ? "Сьогодні" : e.days == 1 ? "Завтра" : "Через " + e.days + " дн."));
                          }
                      }
                      if (lines.isEmpty()) {
                          if (!test) p.edit().putString("bd_last", key).apply();
                          return;
                      }
                      NotificationManager nm = c.getSystemService(NotificationManager.class);
                      nm.createNotificationChannel(new NotificationChannel("bday", "Дні народження та іменини", NotificationManager.IMPORTANCE_DEFAULT));
                      PendingIntent pi = PendingIntent.getActivity(c, 0, new Intent(c, MainActivity.class), PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT);
                      Notification.InboxStyle st = new Notification.InboxStyle();
                      for (String s : lines) st.addLine(s);
                      Notification nt = new Notification.Builder(c, "bday")
                              .setSmallIcon(R.drawable.ic_stat)
                              .setContentTitle(lines.size() == 1 ? lines.get(0) : "Найближчі свята")
                              .setContentText(lines.size() == 1 ? "Натисніть, щоб відкрити" : lines.get(0))
                              .setStyle(lines.size() == 1 ? null : st)
                              .setGroup("nn_bday")
                              .setAutoCancel(true)
                              .setContentIntent(pi)
                              .build();
                      nm.notify(5, nt);
                      if (!test) p.edit().putString("bd_last", key).apply();
                  } catch (Throwable ignored) { }
              }
          }

          /** The "Свята" tab: reminder settings and the list of upcoming events. */
          final class BdayPage {
              private final Activity a;
              private final SharedPreferences p;
              private final List<Button> btns = new ArrayList<>();
              private ToggleRow rNot;
              private Button bDays, bTime, bRefresh, bPerm, bTest, bApp;
              private LinearLayout list;
              private TextView hint;
              private boolean loading;
              private View root;

              BdayPage(Activity a) {
                  this.a = a;
                  this.p = Prefs.get(a);
              }

              private int dp(float v) { return Ui.dp(a, v); }

              private Button button(String t) {
                  Button b = Ui.btn(a, t, Bday.accent(a));
                  btns.add(b);
                  return b;
              }

              private TextView label(String t) {
                  TextView v = Ui.tv(a, t, 15, 0xFF5F6368, true);
                  v.setPadding(dp(4), dp(18), 0, dp(4));
                  return v;
              }

              View build() {
                  LinearLayout col = new LinearLayout(a);
                  col.setOrientation(LinearLayout.VERTICAL);
                  col.setPadding(dp(16), dp(8), dp(16), dp(24));
                  col.addView(label("Нагадування"));
                  rNot = new ToggleRow(a, "Нагадувати про свята", "За кілька днів і в сам день");
                  col.addView(rNot);
                  bDays = button("");
                  bTime = button("");
                  col.addView(bDays);
                  col.addView(bTime);
                  col.addView(label("Дані з контактів"));
                  bPerm = button("Дозволити доступ до контактів");
                  bRefresh = button("Оновити з контактів");
                  bTest = button("Пробне сповіщення");
                  col.addView(bPerm);
                  col.addView(bRefresh);
                  col.addView(bTest);
                  bApp = button("");
                  col.addView(bApp);
                  hint = Ui.tv(a, "Віджет: утримуйте порожнє місце на робочому столі → Віджети → «Дні народження».", 13, 0xFF5F6368, false);
                  hint.setPadding(dp(4), dp(8), dp(4), 0);
                  col.addView(hint);
                  col.addView(label("Найближчі події"));
                  list = new LinearLayout(a);
                  list.setOrientation(LinearLayout.VERTICAL);
                  col.addView(list);

                  rNot.setOnCheckedChangeListener((v, on) -> {
                      if (loading) return;
                      p.edit().putBoolean("bd_notify", on).apply();
                      if (on && android.os.Build.VERSION.SDK_INT >= 33
                              && a.checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED)
                          a.requestPermissions(new String[]{Manifest.permission.POST_NOTIFICATIONS}, 1);
                      Bday.schedule(a.getApplicationContext());
                  });
                  bDays.setOnClickListener(v -> Dlg.pickInt(a, "Нагадувати за скільки днів", 1, 7, p.getInt("bd_days", 1), d -> {
                      p.edit().putInt("bd_days", d).putString("bd_last", "").apply();
                      refreshLabels();
                  }));
                  bTime.setOnClickListener(v -> {
                      int cur = p.getInt("bd_min", 9 * 60);
                      new TimePickerDialog(a, (view, h, m) -> {
                          p.edit().putInt("bd_min", h * 60 + m).putString("bd_last", "").apply();
                          Bday.schedule(a.getApplicationContext());
                          refreshLabels();
                      }, cur / 60, cur % 60, true).show();
                  });
                  bApp.setOnClickListener(v -> {
                      final List<String[]> apps = Bday.contactApps(a);
                      final String[] names = new String[apps.size() + 2];
                      names[0] = "Авто (системні «Контакти»)";
                      names[1] = "Щоразу питати";
                      for (int i = 0; i < apps.size(); i++) names[i + 2] = apps.get(i)[1];
                      new android.app.AlertDialog.Builder(a).setTitle("Відкривати контакт у програмі")
                              .setItems(names, (dlg, w) -> {
                                  String val = w == 0 ? "" : w == 1 ? "-" : apps.get(w - 2)[0];
                                  p.edit().putString("bd_app", val).apply();
                                  refreshLabels();
                                  refresh();
                              }).show();
                  });
                  bPerm.setOnClickListener(v -> a.requestPermissions(new String[]{Manifest.permission.READ_CONTACTS}, 2));
                  bRefresh.setOnClickListener(v -> refresh());
                  bTest.setOnClickListener(v -> {
                      final Context app = a.getApplicationContext();
                      new Thread(() -> Bday.notifyNow(app, true)).start();
                      Toast.makeText(a, "Надіслано", Toast.LENGTH_SHORT).show();
                  });
                  ScrollView sv = new ScrollView(a);
                  sv.setBackgroundColor(0xFFF7F8FA);
                  sv.addView(col);
                  root = sv;
                  refreshLabels();
                  return sv;
              }

              private void refreshLabels() {
                  loading = true;
                  rNot.setChecked(p.getBoolean("bd_notify", true));
                  loading = false;
                  int min = p.getInt("bd_min", 9 * 60);
                  bDays.setText("Нагадувати за: " + p.getInt("bd_days", 1) + " дн. і в день свята");
                  bTime.setText("Час нагадування: " + Scheduler.hhmm(min));
                  bApp.setText("Контакт відкривати в: " + Bday.appLabel(a));
                  int c = Bday.accent(a);
                  for (Button b : btns) Ui.paint(b, c);
                  rNot.recolor(c);
              }

              /** Reloads the contact data, the list and the widget. */
              void refresh() {
                  refreshLabels();
                  final boolean perm = Bday.hasPerm(a);
                  bPerm.setVisibility(perm ? View.GONE : View.VISIBLE);
                  final Context app = a.getApplicationContext();
                  new Thread(() -> {
                      final List<BdayEv> l = Bday.load(app);
                      final List<Bitmap> pics = new ArrayList<>();
                      int cnt = Math.min(40, l.size());
                      for (int i = 0; i < cnt; i++) pics.add(Bday.photo(app, l.get(i), 120));
                      Bday.updateWidgets(app);
                      Bday.schedule(app);
                      a.runOnUiThread(() -> fill(l, pics, perm));
                  }).start();
              }

              private void fill(List<BdayEv> l, List<Bitmap> pics, boolean perm) {
                  list.removeAllViews();
                  if (l.isEmpty()) {
                      list.addView(Ui.tv(a, perm ? "У контактах не знайдено днів народження чи іменин." : "Потрібен доступ до контактів.", 14, 0xFF30343A, false));
                      return;
                  }
                  for (int i = 0; i < pics.size(); i++) {
                      BdayEv e = l.get(i);
                      LinearLayout card = Ui.card(a);
                      card.setOrientation(LinearLayout.HORIZONTAL);
                      card.setGravity(Gravity.CENTER_VERTICAL);
                      ImageView iv = new ImageView(a);
                      iv.setScaleType(ImageView.ScaleType.CENTER_CROP);
                      GradientDrawable g = new GradientDrawable();
                      g.setShape(GradientDrawable.OVAL);
                      g.setColor(0xFFDDDDDD);
                      iv.setBackground(g);
                      iv.setOutlineProvider(ViewOutlineProvider.BACKGROUND);
                      iv.setClipToOutline(true);
                      iv.setImageBitmap(pics.get(i));
                      card.addView(iv, new LinearLayout.LayoutParams(dp(48), dp(48)));
                      LinearLayout tx = new LinearLayout(a);
                      tx.setOrientation(LinearLayout.VERTICAL);
                      tx.setPadding(dp(12), 0, dp(8), 0);
                      tx.addView(Ui.tv(a, e.name, 16, 0xFF202124, true));
                      String sub = e.nameday ? "🎈 іменини · " + Bday.dateText(e)
                              : "🎂 день народження · " + Bday.dateText(e) + (e.age >= 0 ? " · " + Bday.years(e.age) : "");
                      tx.addView(Ui.tv(a, sub, 13, 0xFF5F6368, false));
                      card.addView(tx, new LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f));
                      TextView d = Ui.tv(a, Bday.daysText(e.days), 15, e.days <= 3 ? Bday.accent(a) : 0xFF30343A, true);
                      card.addView(d);
                      final long id = e.id;
                      final String lookup = e.lookup;
                      card.setOnClickListener(v -> {
                          try { a.startActivity(Bday.viewIntent(a, id, lookup)); }
                          catch (Throwable ignored) { }
                      });
                      list.addView(card, Ui.lp(a, ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT, 0, 4, 0, 4));
                  }
              }
          }
