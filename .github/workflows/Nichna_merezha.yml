          package com.example.nightnet;

          import android.content.ContentValues;
          import android.content.Context;
          import android.net.Uri;
          import android.os.Environment;
          import android.provider.MediaStore;
          import java.io.BufferedReader;
          import java.io.IOException;
          import java.io.InputStream;
          import java.io.InputStreamReader;
          import java.io.OutputStream;
          import java.util.HashMap;
          import java.util.Iterator;
          import java.util.Map;
          import java.util.regex.Matcher;
          import java.util.regex.Pattern;
          import org.json.JSONArray;
          import org.json.JSONException;
          import org.json.JSONObject;

          /** Cumulative counters taken from "dumpsys batterystats". Differences of two snapshots give usage in between. */
          final class Snap {
              final HashMap<String, Double> power = new HashMap<>();   // uid or "#Component" -> mAh
              final HashMap<String, long[]> wake = new HashMap<>();    // "uid|name" -> {ms, count}
              final HashMap<String, long[]> kernel = new HashMap<>();  // name -> {ms, count}
              final HashMap<String, long[]> reasons = new HashMap<>(); // name -> {ms, count}
              boolean denied;
              int lines;

              boolean empty() { return power.isEmpty() && wake.isEmpty() && kernel.isEmpty() && reasons.isEmpty(); }

              JSONObject toJson() throws JSONException {
                  JSONObject o = new JSONObject();
                  JSONObject p = new JSONObject();
                  for (Map.Entry<String, Double> e : power.entrySet()) p.put(e.getKey(), e.getValue().doubleValue());
                  o.put("p", p);
                  o.put("w", packMap(wake));
                  o.put("k", packMap(kernel));
                  o.put("r", packMap(reasons));
                  return o;
              }

              private static JSONObject packMap(Map<String, long[]> m) throws JSONException {
                  JSONObject o = new JSONObject();
                  for (Map.Entry<String, long[]> e : m.entrySet()) {
                      JSONArray a = new JSONArray();
                      a.put(e.getValue()[0]);
                      a.put(e.getValue()[1]);
                      o.put(e.getKey(), a);
                  }
                  return o;
              }

              private static void unpackMap(JSONObject o, Map<String, long[]> out) throws JSONException {
                  if (o == null) return;
                  Iterator<String> it = o.keys();
                  while (it.hasNext()) {
                      String k = it.next();
                      JSONArray a = o.getJSONArray(k);
                      out.put(k, new long[]{a.getLong(0), a.getLong(1)});
                  }
              }

              static Snap fromJson(JSONObject o) throws JSONException {
                  Snap s = new Snap();
                  JSONObject p = o.optJSONObject("p");
                  if (p != null) {
                      Iterator<String> it = p.keys();
                      while (it.hasNext()) {
                          String k = it.next();
                          s.power.put(k, p.getDouble(k));
                      }
                  }
                  unpackMap(o.optJSONObject("w"), s.wake);
                  unpackMap(o.optJSONObject("k"), s.kernel);
                  unpackMap(o.optJSONObject("r"), s.reasons);
                  return s;
              }
          }

          final class Dump {
              static volatile String lastSource = "";
              private static long directDeniedAt = 0;
              private static long shizukuDownAt = 0;

              static void resetBackoff() { directDeniedAt = 0; shizukuDownAt = 0; }

              private static final String TIME = "((?:\\d+d )?(?:\\d+h )?(?:\\d+m )?(?:\\d+s )?(?:\\d+ms)?)";
              private static final Pattern POWER = Pattern.compile("^\\s+(Uid\\s+\\S+|[^:(]+?):\\s*([0-9]+(?:[.,][0-9]+)?)");
              private static final Pattern WAKE = Pattern.compile("^Wake lock (.+?): " + TIME + "\\s*(?:[a-z]+ )?\\((\\d+) times\\)");
              private static final Pattern KERNEL = Pattern.compile("^Kernel Wake lock (.+?): " + TIME + "\\s*(?:[a-z]+ )?\\((\\d+) times\\)");
              private static final Pattern REASON = Pattern.compile("^Wakeup reason (.+?): " + TIME + "\\s*(?:[a-z]+ )?\\((\\d+) times\\)");
              private static final Pattern UIDTOK = Pattern.compile("^(?:u\\d+[ais]\\d+|\\d+)$");
              private static final Pattern TOK = Pattern.compile("(\\d+)(ms|d|h|m|s)");

              static long parseTime(String s) {
                  Matcher m = TOK.matcher(s);
                  long t = 0;
                  while (m.find()) {
                      long n = Long.parseLong(m.group(1));
                      String u = m.group(2);
                      if (u.equals("d")) t += n * 86400000L;
                      else if (u.equals("h")) t += n * 3600000L;
                      else if (u.equals("m")) t += n * 60000L;
                      else if (u.equals("s")) t += n * 1000L;
                      else t += n;
                  }
                  return t;
              }

              private static void addAbs(Map<String, long[]> map, String key, long ms, long cnt) {
                  if (ms <= 0 && cnt <= 0) return;
                  if (!map.containsKey(key)) map.put(key, new long[]{ms, cnt});
              }

              static Snap parse(BufferedReader br) throws IOException {
                  Snap s = new Snap();
                  String line;
                  int powerIndent = -1;
                  boolean powerSeen = false;
                  String curUid = null;
                  while ((line = br.readLine()) != null) {
                      s.lines++;
                      if (s.lines <= 20 && line.contains("Permission Denial")) {
                          s.denied = true;
                          return s;
                      }
                      if (line.isEmpty()) {
                          powerIndent = -1;
                          continue;
                      }
                      int ind = 0;
                      while (ind < line.length() && line.charAt(ind) == ' ') ind++;

                      if (powerIndent >= 0) {
                          if (ind > powerIndent) {
                              Matcher m = POWER.matcher(line);
                              if (m.find()) {
                                  String label = m.group(1).trim();
                                  if (!label.startsWith("Capacity")) {
                                      double v;
                                      try { v = Double.parseDouble(m.group(2).replace(',', '.')); } catch (NumberFormatException e) { v = 0; }
                                      if (v > 0.0005) {
                                          String key = label.regionMatches(true, 0, "uid ", 0, 4) ? label.substring(4).trim() : "#" + label;
                                          if (!s.power.containsKey(key)) s.power.put(key, v);
                                      }
                                  }
                              }
                              continue;
                          }
                          powerIndent = -1;
                      }
                      if (line.indexOf("Estimated power use (mAh)") >= 0) {
                          if (!powerSeen) {
                              powerSeen = true;
                              powerIndent = ind;
                          }
                          continue;
                      }

                      String t = line.trim();
                      if (t.endsWith(":")) {
                          String tok = t.substring(0, t.length() - 1);
                          if (UIDTOK.matcher(tok).matches()) curUid = tok;
                          else if (ind <= 2) curUid = null;
                          continue;
                      }
                      if (t.startsWith("Wake lock ")) {
                          if (curUid != null) {
                              Matcher m = WAKE.matcher(t);
                              if (m.find()) addAbs(s.wake, curUid + "|" + m.group(1), parseTime(m.group(2)), Long.parseLong(m.group(3)));
                          }
                      } else if (t.startsWith("Kernel Wake lock ")) {
                          Matcher m = KERNEL.matcher(t);
                          if (m.find()) addAbs(s.kernel, m.group(1), parseTime(m.group(2)), Long.parseLong(m.group(3)));
                      } else if (t.startsWith("Wakeup reason ")) {
                          Matcher m = REASON.matcher(t);
                          if (m.find()) addAbs(s.reasons, m.group(1), parseTime(m.group(2)), Long.parseLong(m.group(3)));
                      }
                  }
                  return s;
              }

              private static Process start(boolean shizuku) throws Exception {
                  if (shizuku) return Radio.spawn("/system/bin/dumpsys", "batterystats");
                  return Runtime.getRuntime().exec(new String[]{"/system/bin/dumpsys", "batterystats"});
              }

              private static void drain(InputStream in) {
                  try {
                      byte[] b = new byte[4096];
                      while (in.read(b) >= 0) { }
                  } catch (Throwable ignored) { }
              }

              private static Snap run(boolean shizuku) {
                  Process p = null;
                  try {
                      p = start(shizuku);
                      if (p == null) return null;
                      final Process fp = p;
                      new Thread(() -> drain(fp.getErrorStream())).start();
                      BufferedReader br = new BufferedReader(new InputStreamReader(p.getInputStream(), "UTF-8"), 1 << 16);
                      Snap s = parse(br);
                      br.close();
                      return s;
                  } catch (Throwable t) {
                      return null;
                  } finally {
                      if (p != null) {
                          try { p.destroy(); } catch (Throwable ignored) { }
                      }
                  }
              }

              /** Takes a snapshot: first directly (if adb permissions were granted), then through Shizuku. */
              static Snap take() {
                  long now = System.currentTimeMillis();
                  if (now - directDeniedAt > 30 * 60 * 1000L) {
                      Snap s = run(false);
                      if (s != null && !s.denied && !s.empty()) {
                          lastSource = "напряму (adb-дозволи)";
                          return s;
                      }
                      directDeniedAt = now;
                  }
                  if (now - shizukuDownAt > 5 * 60 * 1000L) {
                      if (Radio.ready(1500)) {
                          Snap s = run(true);
                          if (s != null && !s.denied && !s.empty()) {
                              lastSource = "через Shizuku";
                              return s;
                          }
                      }
                      shizukuDownAt = now;
                  }
                  lastSource = "";
                  return null;
              }

              /** Saves the raw "dumpsys batterystats" output to Downloads, for diagnostics. */
              static String saveRaw(Context c) {
                  for (int mode = 0; mode < 2; mode++) {
                      boolean shiz = mode == 1;
                      if (shiz && !Radio.ready(3000)) break;
                      Uri uri = null;
                      Process p = null;
                      try {
                          p = start(shiz);
                          if (p == null) continue;
                          uri = Files.download(c, "nightnet_batterystats.txt", "text/plain");
                          if (uri == null) return "Не вдалося створити файл у Завантаженнях.";
                          OutputStream os = c.getContentResolver().openOutputStream(uri);
                          InputStream in = p.getInputStream();
                          final InputStream err = p.getErrorStream();
                          new Thread(() -> drain(err)).start();
                          byte[] buf = new byte[65536];
                          long total = 0;
                          int n;
                          String head = null;
                          while ((n = in.read(buf)) > 0) {
                              if (head == null) head = new String(buf, 0, Math.min(n, 300), "UTF-8");
                              os.write(buf, 0, n);
                              total += n;
                          }
                          os.close();
                          if (total > 2000 && (head == null || !head.contains("Permission Denial"))) {
                              return "Збережено у Завантаження: nightnet_batterystats.txt (" + (total / 1024) + " КБ)";
                          }
                          c.getContentResolver().delete(uri, null, null);
                      } catch (Throwable t) {
                          try { if (uri != null) c.getContentResolver().delete(uri, null, null); } catch (Throwable ignored) { }
                      } finally {
                          if (p != null) {
                              try { p.destroy(); } catch (Throwable ignored) { }
                          }
                      }
                  }
                  return "Не вдалося отримати дані: немає доступу (Shizuku або adb-дозволи).";
              }
          }

          final class Files {
              static Uri download(Context c, String name, String mime) {
                  ContentValues v = new ContentValues();
                  v.put(MediaStore.Downloads.DISPLAY_NAME, name);
                  v.put(MediaStore.Downloads.MIME_TYPE, mime);
                  v.put(MediaStore.Downloads.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS);
                  return c.getContentResolver().insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, v);
              }
          }
