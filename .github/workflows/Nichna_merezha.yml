              static String durSec(long ms) {
                  if (ms < 1000) return ms + " мс";
                  long s = ms / 1000;
                  if (s < 60) return s + " с";
                  long m = s / 60;
                  s = s % 60;
                  if (m < 60) return m + " хв " + s + " с";
                  long h = m / 60;
