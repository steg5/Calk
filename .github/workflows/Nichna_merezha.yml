                  root.addView(head, Ui.lp(this, ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT, 0, 0, 0, 0));
                  detail = new DetailView(this);
                  root.addView(detail);
                  ScrollView sv = new ScrollView(this);
                  sv.setBackgroundColor(0xFFF7F8FA);
                  sv.addView(root);
                  setContentView(sv);

                  final long id = getIntent().getLongExtra("id", 0);
                  new Thread(() -> {
                      final Sess s = Db.get(getApplicationContext()).session(id);
