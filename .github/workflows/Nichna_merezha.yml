                          }
                      } else {
                          r.key = key;
                      }
                      r.ms = ms;
                      r.cnt = cnt;
                      out.add(r);
                  }
              }

              static Detail diff(Snap a, Snap b) {
                  Detail d = new Detail();
                  for (Map.Entry<String, Double> e : b.power.entrySet()) {
                      Double prev = a.power.get(e.getKey());
                      double v = e.getValue() - (prev == null ? 0 : prev);
                      if (v < -0.05) {
                          d.reset = true;
                          continue;
                      }
                      if (v > 0.001) {
                          Row r = new Row();
                          r.key = e.getKey();
                          r.v = v;
                          d.apps.add(r);
                          d.totalMah += v;
                      }
                  }
                  diffMap(a.wake, b.wake, d.wake, d, true);
                  diffMap(a.kernel, b.kernel, d.kernel, d, false);
                  diffMap(a.reasons, b.reasons, d.reasons, d, false);
                  Collections.sort(d.apps, (x, y) -> Double.compare(y.v, x.v));
                  Collections.sort(d.wake, BY_TIME);
                  Collections.sort(d.kernel, BY_TIME);
                  Collections.sort(d.reasons, BY_COUNT);
                  return d;
              }

              static Detail forSession(Context c, Sess s) {
                  if (s.snapA <= 0 || s.snapB <= 0) return null;
                  Db db = Db.get(c);
                  SnapRow a = db.snapAt(s.snapA);
                  SnapRow b = db.snapAt(s.snapB);
                  if (a == null || b == null || a.data == null || b.data == null) return null;
                  Detail d = diff(a.data, b.data);
                  d.fromTs = a.ts;
                  d.toTs = b.ts;
                  d.fromLvl = a.level;
                  d.toLvl = b.level;
                  return d;
              }

              /** Must be called from a background thread: may take a live snapshot. */
              static Detail forRange(Context c, long from, long to) {
                  Db db = Db.get(c);
                  long now = System.currentTimeMillis();
                  if (to >= now - 120000L) Snapper.ensure(c, 20000L);
                  SnapRow a = db.nearest(from);
                  SnapRow b = db.nearest(Math.min(to, now));
                  Detail d;
                  if (a == null || b == null || a.data == null || b.data == null || a.ts >= b.ts) {
                      d = new Detail();
                      d.note = "У цьому проміжку немає двох знімків статистики. Знімки робляться при кожному вимкненні екрана і розблокуванні, тож дані з'являться після першого використання телефона з увімкненим моніторингом.";
                      return d;
                  }
                  d = diff(a.data, b.data);
                  d.fromTs = a.ts;
                  d.toTs = b.ts;
                  d.fromLvl = a.level;
                  d.toLvl = b.level;
                  d.charged = db.chargedBetween(a.ts, b.ts);
                  if (Math.abs(a.ts - from) > 20 * 60000L || Math.abs(b.ts - to) > 20 * 60000L) {
                      d.note = "Межі зсунуто до найближчих знімків статистики (вони робляться при вимкненні екрана і розблокуванні).";
                  }
                  return d;
              }
          }

          final class Names {
              private static final HashMap<String, String> cache = new HashMap<>();
              private static final Pattern APP = Pattern.compile("^u(\\d+)a(\\d+)$");

              static synchronized String label(Context c, String key) {
                  String v = cache.get(key);
                  if (v != null) return v;
                  v = resolve(c, key);
                  cache.put(key, v);
                  return v;
              }

              private static String component(String n) {
                  switch (n.trim().toLowerCase(Locale.ROOT).replace('_', ' ')) {
                      case "screen": return "Екран";
                      case "idle": return "Стан очікування (idle)";
                      case "cell standby": return "Мобільна мережа (очікування)";
                      case "mobile radio": return "Мобільний радіомодуль";
                      case "cell": return "Мобільна мережа";
                      case "wifi": return "Wi‑Fi";
                      case "bluetooth": return "Bluetooth";
                      case "phone": case "phone calls": return "Дзвінки";
                      case "camera": return "Камера";
                      case "flashlight": return "Ліхтарик";
                      case "cpu": return "Процесор (CPU)";
                      case "audio": return "Звук";
                      case "video": return "Відео";
                      case "sensors": return "Датчики";
                      case "gnss": return "GPS / геолокація";
                      case "memory": return "Пам'ять";
                      case "ambient display": return "Екран, що завжди увімкнений";
                      case "system services": return "Системні служби";
                      case "wakelock": return "Wakelock'и";
                      case "over-counted": return "Перерахунок (over-counted)";
                      case "unaccounted": return "Не віднесено (unaccounted)";
                      default: return n;
                  }
              }

              /** Package name of the app behind the key, or null. */
              static synchronized String pkg(Context c, String key) {
                  try {
                      int uid = uidOf(key);
                      if (uid < 10000) return null;
                      String[] pk = c.getPackageManager().getPackagesForUid(uid);
                      if (pk != null && pk.length > 0) return pk[0];
                      for (ApplicationInfo ai : c.getPackageManager().getInstalledApplications(0))
                          if (ai.uid == uid) return ai.packageName;
                  } catch (Throwable ignored) { }
                  return null;
              }

              private static int uidOf(String key) {
                  key = key.trim();
                  if (key.regionMatches(true, 0, "uid ", 0, 4)) key = key.substring(4).trim();
                  Matcher m = APP.matcher(key);
                  if (m.matches()) return Integer.parseInt(m.group(1)) * 100000 + 10000 + Integer.parseInt(m.group(2));
                  try { return Integer.parseInt(key); } catch (NumberFormatException e) { return Integer.MIN_VALUE + 1; }
              }

              /** Plain-language explanation for common kernel wakelock / wakeup-reason names, or null. */
              static String hint(String raw) {
                  String r = raw.toLowerCase(Locale.ROOT);
                  if (r.contains("wlan") || r.contains("qcom_rx") || r.contains("wifi")) return "Wi‑Fi: вхідні пакети будять телефон";
                  if (r.contains("alarm")) return "Таймери та будильники";
                  if (r.contains("rmnet") || r.contains("ipa") || r.contains("modem") || r.contains("smd") || r.contains("glink")) return "Мобільний модем / мережа";
                  if (r.contains("bluetooth") || r.contains("bt_")) return "Bluetooth";
                  if (r.contains("battery") || r.contains("charger") || r.contains("pmic") || r.contains("usb")) return "Живлення / USB / заряд";
                  if (r.contains("gpio") || r.contains("touch") || r.contains("fp") || r.contains("fingerprint")) return "Датчики, дотик, кнопки";
                  if (r.contains("power manager") || r.contains("powermanager")) return "Системні wakelock'и Android";
                  if (r.contains("sensor") || r.contains("ssc") || r.contains("slpi")) return "Датчики";
                  if (r.contains("rtc")) return "Годинник реального часу (таймер)";
                  if (r.contains("main") || r.contains("suspend") || r.contains("abort")) return "Системне пробудження ядра";
                  return null;
              }

              private static String resolve(Context c, String key) {
                  if (key.startsWith("#")) {
                      String rest = key.substring(1);
                      if (rest.regionMatches(true, 0, "uid ", 0, 4)) return resolve(c, rest.substring(4).trim());
                      return component(rest);
                  }
                  int uid = uidOf(key);
                  if (uid == Integer.MIN_VALUE + 1) return key;
                  if (uid == -5) return "Роздача інтернету (hotspot)";
                  if (uid == -4) return "Видалені застосунки";
                  if (uid == -1) return "Усі застосунки";
                  if (uid == 0) return "Ядро Android (root)";
                  if (uid == 1000) return "Система Android (system)";
                  if (uid == 1001) return "Радіомодуль / телефонія";
                  if (uid == 2000) return "Shell (adb / Shizuku)";
                  try {
                      PackageManager pm = c.getPackageManager();
                      String[] pk = pm.getPackagesForUid(uid);
                      if (pk == null || pk.length == 0) {
                          String p1 = pkg(c, key);
                          if (p1 != null) pk = new String[]{p1};
                      }
                      if (pk != null && pk.length > 0) {
                          String name;
                          try { name = pm.getApplicationLabel(pm.getApplicationInfo(pk[0], 0)).toString(); }
                          catch (Throwable t) { name = pk[0]; }
                          return pk.length > 1 ? name + " (+" + (pk.length - 1) + ")" : name;
                      }
                  } catch (Throwable ignored) { }
                  return uid < 10000 ? "Системний процес (uid " + uid + ")" : "Невідомий застосунок (" + key.replaceFirst("(?i)^uid\\s*", "") + ")";
              }
          }
