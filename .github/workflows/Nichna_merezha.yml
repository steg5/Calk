          package com.example.nightnet;

          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;

          public class BdayReceiver extends BroadcastReceiver {
              @Override public void onReceive(Context context, Intent intent) {
                  final PendingResult r = goAsync();
                  final Context app = context.getApplicationContext();
                  final String a = intent == null ? "" : String.valueOf(intent.getAction());
                  new Thread(() -> {
                      try {
                          Bday.schedule(app);
                          Bday.updateWidgets(app);
                          if (a.endsWith(".170")) Bday.notifyNow(app, false);
                      } finally { r.finish(); }
                  }).start();
              }
          }
          EOF

