                  btnMin = mk("");
                  btnKeep = mk("");
                  col.addView(btnMin);
                  col.addView(btnKeep);

                  col.addView(title("Доступ до статистики"));
                  tvAccess = Ui.tv(act, "Натисніть «Перевірити доступ».", 14, 0xFF30343A, false);
                  col.addView(tvAccess);
                  Button btnCheck = mk("Перевірити доступ");
                  col.addView(btnCheck, Ui.lp(act, ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT, 0, 6, 0, 0));

                  TextView adb = Ui.tv(act,
                          "Дані читаються через Shizuku. Без root Shizuku вимикається після перезавантаження телефона, тому надійніше один раз виконати на ПК (телефон по USB з увімкненим налагодженням):\n\n"
                                  + "adb shell pm grant com.example.nightnet android.permission.DUMP\n"
                                  + "adb shell pm grant com.example.nightnet android.permission.BATTERY_STATS\n"
                                  + "adb shell appops set com.example.nightnet GET_USAGE_STATS allow\n\n"
                                  + "Після цього застосунок читає статистику сам, без Shizuku.",
                          12, 0xFF30343A, false);
                  adb.setTextIsSelectable(true);
                  adb.setPadding(0, dp(10), 0, dp(6));
                  col.addView(adb);

                  col.addView(title("Дані"));
                  tvCounts = Ui.tv(act, "", 13, 0xFF5F6368, false);
                  col.addView(tvCounts);
                  Button btnCsv = mk("Експорт журналу (CSV у Завантаження)");
                  Button btnRaw = mk("Зберегти сирий вивід dumpsys (діагностика)");
                  Button btnClear = mk("Очистити журнал і знімки");
                  col.addView(btnCsv, Ui.lp(act, ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT, 0, 6, 0, 0));
                  col.addView(btnRaw);
                  col.addView(btnClear);

                  swMon.setOnCheckedChangeListener((v, on) -> {
                      if (loadingSet) return;
                      prefs.edit().putBoolean("mon_enabled", on).apply();
                      if (on) askNotif();
                      MonitorService.ensure(act.getApplicationContext());
                  });
                  btnMin.setOnClickListener(v -> {
                      prefs.edit().putInt("min_minutes", nextValue(MIN_VALUES, prefs.getInt("min_minutes", 30))).apply();
                      loadSettings();
                  });
                  btnKeep.setOnClickListener(v -> {
                      prefs.edit().putInt("keep_days", nextValue(KEEP_VALUES, prefs.getInt("keep_days", 14))).apply();
                      loadSettings();
                  });
                  btnCheck.setOnClickListener(v -> checkAccess());
                  btnCsv.setOnClickListener(v -> exportCsv());
                  btnRaw.setOnClickListener(v -> new Thread(() -> {
                      final String r = Dump.saveRaw(act.getApplicationContext());
                      act.runOnUiThread(() -> toast(r));
                  }).start());
                  btnClear.setOnClickListener(v -> new AlertDialog.Builder(act)
                          .setMessage("Видалити весь журнал і всі збережені знімки статистики?")
                          .setPositiveButton("Видалити", (dlg, w) -> new Thread(() -> {
                              Db.get(act).clear();
                              act.runOnUiThread(() -> { toast("Очищено"); loadSettings(); });
                          }).start())
                          .setNegativeButton("Скасувати", null)
                          .show());
                  return scroll(col);
              }

              private static int nextValue(int[] vals, int cur) {
                  for (int v : vals) if (v > cur) return v;
                  return vals[0];
              }

              private void loadSettings() {
                  loadingSet = true;
                  swMon.setChecked(prefs.getBoolean("mon_enabled", true));
                  loadingSet = false;
                  btnMin.setText("Мінімальна тривалість запису: " + prefs.getInt("min_minutes", 30) + " хв (тап — змінити)");
                  btnKeep.setText("Зберігати історію: " + prefs.getInt("keep_days", 14) + " дн. (тап — змінити)");
                  new Thread(() -> {
                      final int[] cnt = Db.get(act).counts();
                      act.runOnUiThread(() -> tvCounts.setText("У базі: " + cnt[0] + " знімків статистики, " + cnt[1] + " записів журналу."));
                  }).start();
              }

              private void checkAccess() {
                  tvAccess.setText("Перевірка…");
                  new Thread(() -> {
                      Dump.resetBackoff();
                      Snap s = Dump.take();
                      final String msg;
                      if (s == null) {
                          msg = "Доступу немає. Запустіть Shizuku і дайте йому дозвіл цьому застосунку (вкладка «Мережа»), або виконайте adb-команди нижче.";
                      } else {
                          msg = "Доступ є (" + Dump.lastSource + "). Розпізнано: застосунків і компонентів — " + s.power.size()
                                  + ", wakelock'ів застосунків — " + s.wake.size() + ", wakelock'ів ядра — " + s.kernel.size()
                                  + ", причин пробудження — " + s.reasons.size() + ".";
                      }
                      act.runOnUiThread(() -> tvAccess.setText(msg));
                  }).start();
              }

              private void exportCsv() {
                  new Thread(() -> {
                      String r;
                      try {
                          List<Sess> list = Db.get(act).sessions(0, Long.MAX_VALUE, 100000);
                          Uri u = Files.download(act, "nightnet_battery_log.csv", "text/csv");
                          if (u == null) throw new IllegalStateException("no uri");
                          OutputStream os = act.getContentResolver().openOutputStream(u);
                          SimpleDateFormat f = new SimpleDateFormat("yyyy-MM-dd HH:mm:ss", Locale.US);
                          StringBuilder sb = new StringBuilder("start,end,duration_min,level_start,level_end,drop_percent,percent_per_hour,deep_sleep_percent,mah,schedule\n");
                          for (Sess s : list) {
                              sb.append(f.format(new java.util.Date(s.st))).append(',')
                                      .append(f.format(new java.util.Date(s.en))).append(',')
                                      .append(s.durMs() / 60000L).append(',')
                                      .append(s.stLvl).append(',').append(s.enLvl).append(',').append(s.drop()).append(',')
                                      .append(String.format(Locale.US, "%.2f", s.perHour())).append(',')
                                      .append(String.format(Locale.US, "%.1f", s.deepPct())).append(',')
                                      .append(s.mah() >= 0 ? String.format(Locale.US, "%.0f", s.mah()) : "").append(',')
                                      .append(s.sched ? 1 : 0).append('\n');
                          }
                          os.write(sb.toString().getBytes("UTF-8"));
                          os.close();
                          r = "Збережено у Завантаження: nightnet_battery_log.csv";
                      } catch (Throwable t) {
                          r = "Не вдалося зберегти файл";
                      }
                      final String m = r;
                      act.runOnUiThread(() -> toast(m));
                  }).start();
              }
          }
