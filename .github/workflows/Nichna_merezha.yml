          /** Battery level line with coloured bands for long lock periods. */
          final class LevelChart extends View {
              private long from, to;
              private long[] ts = new long[0];
              private int[] lvl = new int[0];
              private List<Sess> sess = new ArrayList<>();
              private final Paint grid = new Paint(Paint.ANTI_ALIAS_FLAG);
              private final Paint txt = new Paint(Paint.ANTI_ALIAS_FLAG);
              private final Paint line = new Paint(Paint.ANTI_ALIAS_FLAG);
              private final Paint band = new Paint();
              int accent = 0xFF168C83;

              LevelChart(Context c) {
                  super(c);
                  float d = c.getResources().getDisplayMetrics().density;
                  grid.setColor(0xFFE3E6EB);
                  grid.setStrokeWidth(d);
                  txt.setColor(0xFF5F6368);
                  txt.setTextSize(11 * d);
                  line.setStyle(Paint.Style.STROKE);
                  line.setStrokeWidth(2 * d);
                  line.setStrokeJoin(Paint.Join.ROUND);
              }

              void set(long from, long to, long[] ts, int[] lvl, List<Sess> sess) {
                  this.from = from;
                  this.to = to;
                  this.ts = ts;
                  this.lvl = lvl;
                  this.sess = sess;
                  invalidate();
              }

              private float x(long t, float l, float cw) { return l + (float) (t - from) / (float) (to - from) * cw; }

              @Override protected void onDraw(Canvas cv) {
                  super.onDraw(cv);
                  float d = getResources().getDisplayMetrics().density;
                  float w = getWidth(), h = getHeight();
                  float l = 36 * d, r = 8 * d, t = 8 * d, b = 22 * d;
                  float cw = w - l - r, ch = h - t - b;
                  if (to <= from || cw <= 0 || ch <= 0) return;

                  txt.setTextAlign(Paint.Align.LEFT);
                  for (int p = 0; p <= 100; p += 25) {
                      float y = t + (100 - p) / 100f * ch;
                      cv.drawLine(l, y, w - r, y, grid);
                      cv.drawText(p + "%", 2 * d, y + 4 * d, txt);
                  }
                  for (Sess s : sess) {
                      float x1 = x(Math.max(s.st, from), l, cw);
                      float x2 = x(Math.min(s.en, to), l, cw);
                      if (x2 <= x1) continue;
                      band.setColor((Ui.deepColor(s.deepPct()) & 0x00FFFFFF) | 0x33000000);
                      cv.drawRect(x1, t, x2, t + ch, band);
                  }
                  Path path = new Path();
                  boolean first = true;
                  int points = 0;
                  for (int i = 0; i < ts.length; i++) {
                      if (ts[i] < from || ts[i] > to) continue;
                      float px = x(ts[i], l, cw);
                      float py = t + (100 - lvl[i]) / 100f * ch;
                      if (first) {
                          path.moveTo(px, py);
                          first = false;
                      } else {
                          path.lineTo(px, py);
                      }
                      points++;
                  }
                  if (points >= 2) {
                      line.setColor(accent);
                      cv.drawPath(path, line);
                  } else {
                      txt.setTextAlign(Paint.Align.CENTER);
                      cv.drawText("Недостатньо даних", l + cw / 2, t + ch / 2, txt);
                  }
                  SimpleDateFormat f = new SimpleDateFormat((to - from) <= 36L * 3600000L ? "HH:mm" : "dd.MM", Locale.getDefault());
                  for (int i = 0; i <= 3; i++) {
                      long tt = from + (to - from) * i / 3;
                      txt.setTextAlign(i == 0 ? Paint.Align.LEFT : i == 3 ? Paint.Align.RIGHT : Paint.Align.CENTER);
                      cv.drawText(f.format(new Date(tt)), l + cw * i / 3f, h - 5 * d, txt);
                  }
              }
          }

          final class Dlg {
              static void pickInt(Activity a, String title, int min, int max, int cur, final java.util.function.IntConsumer ok) {
                  final NumberPicker np = new NumberPicker(a);
                  np.setMinValue(min);
                  np.setMaxValue(max);
                  np.setValue(Math.max(min, Math.min(max, cur)));
                  new AlertDialog.Builder(a).setTitle(title).setView(np)
                          .setPositiveButton("Гаразд", (dlg, w) -> ok.accept(np.getValue()))
                          .setNegativeButton("Скасувати", null).show();
              }

              static void pickDecimal(Activity a, String title, float cur, final java.util.function.Consumer<Float> ok) {
                  final EditText et = new EditText(a);
                  et.setInputType(InputType.TYPE_CLASS_NUMBER | InputType.TYPE_NUMBER_FLAG_DECIMAL);
                  et.setText(String.format(Locale.US, "%.1f", cur));
                  new AlertDialog.Builder(a).setTitle(title).setView(et)
                          .setPositiveButton("Гаразд", (dlg, w) -> {
                              try {
                                  float v = Float.parseFloat(et.getText().toString().replace(',', '.'));
                                  if (v > 0) ok.accept(v);
                              } catch (NumberFormatException ignored) { }
                          })
                          .setNegativeButton("Скасувати", null).show();
              }
          }

          /** Full-width card: title, short description and a switch; the whole card is tappable. */
          final class ToggleRow extends LinearLayout {
              private final android.widget.Switch sw;
              private final TextView menu;

              ToggleRow(Context c, String title, String desc) {
                  super(c);
                  setOrientation(HORIZONTAL);
                  setGravity(Gravity.CENTER_VERTICAL);
                  GradientDrawable g = new GradientDrawable();
                  g.setColor(0xFFFFFFFF);
                  g.setCornerRadius(Ui.dp(c, 14));
                  g.setStroke(Ui.dp(c, 1), 0xFFE3E6EB);
                  setBackground(new android.graphics.drawable.RippleDrawable(ColorStateList.valueOf(0x22000000), g, null));
                  setPadding(Ui.dp(c, 16), Ui.dp(c, 12), Ui.dp(c, 12), Ui.dp(c, 12));
                  setMinimumHeight(Ui.dp(c, 64));
                  LinearLayout texts = new LinearLayout(c);
                  texts.setOrientation(VERTICAL);
                  texts.addView(Ui.tv(c, title, 16, 0xFF202124, true));
                  if (desc != null) {
                      TextView d = Ui.tv(c, desc, 13, 0xFF5F6368, false);
                      d.setPadding(0, Ui.dp(c, 2), 0, 0);
                      texts.addView(d);
                  }
                  addView(texts, new LayoutParams(0, LayoutParams.WRAP_CONTENT, 1f));
                  menu = Ui.tv(c, "▾", 22, 0xFF168C83, true);
                  menu.setGravity(Gravity.CENTER);
                  menu.setVisibility(GONE);
                  addView(menu, new LayoutParams(Ui.dp(c, 44), Ui.dp(c, 44)));
                  sw = new android.widget.Switch(c);
                  sw.setClickable(false);
                  sw.setFocusable(false);
                  addView(sw, new LayoutParams(LayoutParams.WRAP_CONTENT, LayoutParams.WRAP_CONTENT));
                  setOnClickListener(v -> sw.toggle());
                  LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(LayoutParams.MATCH_PARENT, LayoutParams.WRAP_CONTENT);
                  lp.setMargins(0, Ui.dp(c, 4), 0, Ui.dp(c, 4));
                  setLayoutParams(lp);
              }

              boolean isChecked() { return sw.isChecked(); }
              void setChecked(boolean on) { sw.setChecked(on); }
              void setOnCheckedChangeListener(android.widget.CompoundButton.OnCheckedChangeListener l) { sw.setOnCheckedChangeListener(l); }

              /** Shows a "▾" button next to the switch. */
              void setMenu(View.OnClickListener l) {
                  menu.setVisibility(VISIBLE);
                  menu.setOnClickListener(l);
              }

              View menuAnchor() { return menu; }

              void recolor(int accent) {
                  int[][] st = {{android.R.attr.state_checked}, {}};
                  sw.setThumbTintList(new ColorStateList(st, new int[]{accent, 0xFF9AA0A6}));
                  sw.setTrackTintList(new ColorStateList(st, new int[]{(accent & 0x00FFFFFF) | 0x80000000, 0x55888888}));
                  menu.setTextColor(accent);
              }
          }
