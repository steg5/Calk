              private void setPreset(int kind) {
                  long now = System.currentTimeMillis();
                  if (kind == 0) {
                      Calendar c = Calendar.getInstance();
                      c.set(Calendar.HOUR_OF_DAY, 8);
                      c.set(Calendar.MINUTE, 0);
                      c.set(Calendar.SECOND, 0);
                      c.set(Calendar.MILLISECOND, 0);
                      long end = Math.min(c.getTimeInMillis(), now);
                      rTo = end;
                      rFrom = end - 10L * 3600000L;
                  } else {
                      long span = kind == 1 ? 6L * 3600000L : kind == 2 ? 24L * 3600000L : 7L * 24L * 3600000L;
                      rTo = now;
                      rFrom = now - span;
                  }
              }

              private void pickDateTime(final boolean from) {
                  final Calendar c = Calendar.getInstance();
                  c.setTimeInMillis(from ? rFrom : rTo);
                  new DatePickerDialog(act, (dv, y, mo, d) -> {
                      new TimePickerDialog(act, (tv, h, m) -> {
                          Calendar n = Calendar.getInstance();
                          n.set(y, mo, d, h, m, 0);
                          n.set(Calendar.MILLISECOND, 0);
                          if (from) rFrom = n.getTimeInMillis();
                          else rTo = n.getTimeInMillis();
                          rangeChanged();
                      }, c.get(Calendar.HOUR_OF_DAY), c.get(Calendar.MINUTE), true).show();
                  }, c.get(Calendar.YEAR), c.get(Calendar.MONTH), c.get(Calendar.DAY_OF_MONTH)).show();
              }

              private void rangeChanged() {
                  if (rTo <= rFrom) {
                      toast("Кінець проміжку має бути пізніше за початок");
                      updateRangeButtons();
                      return;
                  }
                  prefs.edit().putLong("r_from", rFrom).putLong("r_to", rTo).apply();
                  loadRange();
              }

              private void updateRangeButtons() {
                  btnFrom.setText("Від: " + Ui.when(rFrom));
                  btnTo.setText("До: " + Ui.when(rTo));
              }

              private void loadRange() {
                  updateRangeButtons();
                  if (rTo <= rFrom) return;
                  final int seq = ++rangeSeq;
                  final long from = rFrom, to = rTo;
                  chart.accent = accent();
                  rangeDetail.message("Обчислення…");
                  new Thread(() -> {
                      Db db = Db.get(act);
                      List<long[]> lv = db.levels(from, to);
                      final long[] ts = new long[lv.size()];
                      final int[] lvl = new int[lv.size()];
                      for (int i = 0; i < ts.length; i++) {
                          ts[i] = lv.get(i)[0];
                          lvl[i] = (int) lv.get(i)[1];
                      }
                      final List<Sess> ss = db.sessions(from, to, 500);
                      final Detail d = Detail.forRange(act.getApplicationContext(), from, to);
                      act.runOnUiThread(() -> {
                          if (seq != rangeSeq) return;
                          chart.set(from, to, ts, lvl, ss);
                          showStats(ss);
                          rangeDetail.show(d, accent(), 20, 15);
                      });
                  }).start();
              }

              // ---------------------------------------------------------------- overview page

              private static final class Agg {
                  int n;
                  long dur, el, deep;
                  int drop;
                  void add(Sess s) {
                      n++;
                      dur += s.durMs();
                      el += s.el;
                      deep += Math.max(0, s.el - s.up);
                      drop += s.drop();
                  }
                  double perHour() { return dur <= 0 ? 0 : drop / (dur / 3600000.0); }
                  double deepPct() { return el <= 0 ? 0 : 100.0 * deep / el; }
                  String text() {
                      return n + " зап. · " + String.format(Locale.US, "%.2f", perHour()) + " %/год · глибокий сон " + Math.round(deepPct()) + "%";
                  }
              }

              private void showStats(List<Sess> ss) {
                  ovStats.removeAllViews();
                  ovStats.addView(Ui.tv(act, "Підсумок за період", 16, 0xFF202124, true));
                  if (ss.isEmpty()) {
                      ovStats.addView(Ui.tv(act, "Довгих блокувань за цей період немає.", 14, 0xFF30343A, false));
                      return;
                  }
                  Agg all = new Agg(), on = new Agg(), off = new Agg();
                  Sess worst = null;
                  for (Sess s : ss) {
                      all.add(s);
                      if (s.sched) on.add(s);
                      else off.add(s);
                      if (s.el > 0 && (worst == null || s.deepPct() < worst.deepPct())) worst = s;
                  }
                  ovStats.addView(Ui.tv(act, "Довгих блокувань: " + all.n + " (сумарно " + Ui.dur(all.dur) + ")", 14, 0xFF30343A, false));
                  ovStats.addView(Ui.tv(act, "У середньому: " + String.format(Locale.US, "%.2f", all.perHour()) + " %/год, глибокий сон " + Math.round(all.deepPct()) + "%", 14, Ui.deepColor(all.deepPct()), true));
                  if (worst != null) {
                      ovStats.addView(Ui.tv(act, "Найгірший запис: " + Ui.when(worst.st) + ", глибокий сон " + Math.round(worst.deepPct()) + "%", 14, 0xFF30343A, false));
                  }
                  if (on.n > 0 && off.n > 0) {
                      ovStats.addView(Ui.tv(act, "З вимкненою мережею (розклад): " + on.text(), 13, 0xFF30343A, false));
                      ovStats.addView(Ui.tv(act, "Без розкладу: " + off.text(), 13, 0xFF30343A, false));
                  }
              }

