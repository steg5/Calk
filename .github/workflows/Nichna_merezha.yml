          package com.example.nightnet;

          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.usage.NetworkStats;
          import android.app.usage.NetworkStatsManager;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.net.ConnectivityManager;
          import android.net.TrafficStats;
          import android.app.Notification;
          import java.util.ArrayList;
          import java.util.Calendar;
          import java.util.Collections;
          import java.util.HashMap;
          import java.util.List;
          import java.util.Map;
          import java.util.Locale;

          /** Mobile data used in the current monthly period, and a one-time warning at a chosen limit. */
          final class Usage {
              /** Start of the current period: the most recent billing day at 00:00. */
              static long periodStart(SharedPreferences p, long nowMs) {
                  int day = Math.max(1, Math.min(31, p.getInt("bill_day", 1)));
                  Calendar now = Calendar.getInstance();
                  now.setTimeInMillis(nowMs);
                  Calendar st = (Calendar) now.clone();
                  st.set(Calendar.DAY_OF_MONTH, Math.min(day, st.getActualMaximum(Calendar.DAY_OF_MONTH)));
                  st.set(Calendar.HOUR_OF_DAY, 0);
                  st.set(Calendar.MINUTE, 0);
                  st.set(Calendar.SECOND, 0);
                  st.set(Calendar.MILLISECOND, 0);
                  if (st.after(now)) {
                      st.set(Calendar.DAY_OF_MONTH, 1);
                      st.add(Calendar.MONTH, -1);
                      st.set(Calendar.DAY_OF_MONTH, Math.min(day, st.getActualMaximum(Calendar.DAY_OF_MONTH)));
                  }
                  return st.getTimeInMillis();
              }

              private static boolean wifiNow(Context c) {
                  try {
                      ConnectivityManager cm = c.getSystemService(ConnectivityManager.class);
                      for (android.net.Network n : cm.getAllNetworks()) {
                          android.net.NetworkCapabilities nc = cm.getNetworkCapabilities(n);
                          if (nc != null && nc.hasTransport(android.net.NetworkCapabilities.TRANSPORT_WIFI)
                                  && !nc.hasTransport(android.net.NetworkCapabilities.TRANSPORT_VPN)
                                  && nc.hasCapability(android.net.NetworkCapabilities.NET_CAPABILITY_INTERNET)) return true;
                      }
                  } catch (Throwable ignored) { }
                  return false;
              }

              /**
               * Own counter of mobile-interface traffic. The kernel counter keeps growing while the phone sleeps, so this is
               * called only when something happens anyway (screen, Wi-Fi, charger events, notification refresh). Traffic that
               * occurred while Wi-Fi was connected is not added. wifi = new Wi-Fi state if known (from a network callback).
               */
              static synchronized void sample(Context c, Boolean wifi) {
                  try {
                      SharedPreferences p = Prefs.get(c);
                      long start = periodStart(p, System.currentTimeMillis());
                      long cur = Math.max(0, TrafficStats.getMobileRxBytes()) + Math.max(0, TrafficStats.getMobileTxBytes());
                      long last = p.getLong("use2_last", -1);
                      long acc = p.getLong("use2_acc", 0);
                      boolean wasWifi = p.getBoolean("use2_wifi", false);
                      if (p.getLong("use2_period", 0) != start) acc = 0;
                      else if (last >= 0 && !wasWifi) acc += cur >= last ? cur - last : cur;
                      p.edit().putLong("use2_last", cur).putLong("use2_acc", acc).putLong("use2_period", start)
                              .putBoolean("use2_wifi", wifi != null ? wifi : wifiNow(c)).apply();
                  } catch (Throwable ignored) { }
              }

              /** Counted traffic of the period plus the manual correction (valid only for the period it was entered in). */
              static synchronized long monthBytes(Context c) {
                  sample(c, null);
                  SharedPreferences p = Prefs.get(c);
                  long start = periodStart(p, System.currentTimeMillis());
                  long acc = p.getLong("use2_period", 0) == start ? p.getLong("use2_acc", 0) : 0;
                  long off = p.getLong("use2_off_period", 0) == start ? p.getLong("use2_off", 0) : 0;
                  return Math.max(0, acc + off);
              }

              /** The user enters the real usage so far (GB); later traffic is added on top of it. */
              static synchronized void setManual(Context c, double gb) {
                  sample(c, null);
                  SharedPreferences p = Prefs.get(c);
                  long start = periodStart(p, System.currentTimeMillis());
                  long acc = p.getLong("use2_period", 0) == start ? p.getLong("use2_acc", 0) : 0;
                  long off = (long) (gb * 1073741824.0) - acc;
                  p.edit().putLong("use2_off", off).putLong("use2_off_period", start).putLong("limit_notified", 0).apply();
                  ActLog.add(c, "Трафік за місяць вручну: " + String.format(Locale.US, "%.2f", gb) + " ГБ");
              }

              static String fmt(long bytes) {
                  double mb = bytes / 1048576.0;
                  if (mb < 1000) return String.format(Locale.US, "%.0f МБ", mb);
                  return String.format(Locale.US, "%.2f ГБ", mb / 1024.0);
              }

              static void checkLimit(Context c) {
                  try {
                      SharedPreferences p = Prefs.get(c);
                      if (!p.getBoolean("limit_on", false)) return;
                      long limit = (long) (p.getFloat("limit_gb", 3.8f) * 1073741824.0);
                      long start = periodStart(p, System.currentTimeMillis());
                      if (p.getLong("limit_notified", 0) == start) return;
                      long used = monthBytes(c);
                      if (used < limit) return;
                      NotificationManager nm = c.getSystemService(NotificationManager.class);
                      nm.createNotificationChannel(new NotificationChannel("limit", "Ліміт трафіку", NotificationManager.IMPORTANCE_DEFAULT));
                      PendingIntent pi = PendingIntent.getActivity(c, 0, new Intent(c, MainActivity.class), PendingIntent.FLAG_IMMUTABLE);
                      Notification n = new Notification.Builder(c, "limit")
                              .setSmallIcon(R.drawable.ic_stat)
                              .setContentTitle("Ліміт мобільного трафіку")
                              .setContentText("Використано " + fmt(used) + " за цей місяць")
                              .setContentIntent(pi)
                              .setAutoCancel(true)
                              .setGroup("nn_limit")
                              .build();
                      nm.notify(3, n);
                      p.edit().putLong("limit_notified", start).apply();
                  } catch (Throwable ignored) { }
              }
          }
