              private static String statusText(int s) {
                  switch (s) {
                      case 2: return "Заряджання";
                      case 3: return "Розрядження";
                      case 4: return "Не заряджається";
                      case 5: return "Заряджена";
                      default: return "Невідомо";
                  }
              }

              private static String healthText(int h) {
                  switch (h) {
                      case 2: return "В нормі";
                      case 3: return "Перегрів";
                      case 4: return "Непридатна";
                      case 5: return "Перенапруга";
                      case 7: return "Холодна";
                      default: return "Невідомо";
                  }
              }

              private void updateCurrent() {
                  BatInfo b = Power.info(act);
                  if (Double.isNaN(b.ma)) {
                      curValue.setText("— мА");
                  } else {
                      curValue.setText(String.format(Locale.US, "%+.0f мА", b.ma));
                      if (Double.isNaN(minMa) || b.ma < minMa) minMa = b.ma;
                      if (Double.isNaN(maxMa) || b.ma > maxMa) maxMa = b.ma;
                  }
                  curMin.setText("мін: " + (Double.isNaN(minMa) ? "—" : String.format(Locale.US, "%.0f мА", minMa)));
                  curMax.setText("макс: " + (Double.isNaN(maxMa) ? "—" : String.format(Locale.US, "%.0f мА", maxMa)));

                  curRows.removeAllViews();
                  kv("Статус:", statusText(b.status));
                  String src = b.plugged == 0 ? "Батареї" : b.plugged == 1 ? "Мережа (AC)" : b.plugged == 2 ? "USB" : b.plugged == 4 ? "Бездротова" : "Зарядка";
                  kv("Зарядка від:", src);
                  kv("Заряд:", b.level + "%");
                  kv("Стан:", healthText(b.health));
                  if (!b.tech.isEmpty()) kv("Тип:", b.tech);
                  if (b.designMah > 0) kv("Ємність (паспорт):", String.format(Locale.US, "%.0f мАг", b.designMah));
                  if (b.ccUah > 0) kv("Зараз у батареї:", String.format(Locale.US, "%.0f мАг", b.ccUah / 1000.0));
                  if (b.ccUah > 0 && b.level > 5) kv("Ємність (оцінка):", String.format(Locale.US, "≈ %.0f мАг", b.ccUah / 1000.0 * 100.0 / b.level));
                  kv("Температура:", String.format(Locale.US, "%.1f °C", b.temp / 10.0));
                  kv("Напруга:", String.format(Locale.US, "%.2f В", b.volt / 1000.0));
                  if (!Double.isNaN(b.ma)) kv("Потужність:", String.format(Locale.US, "%.1f Вт", Math.abs(b.ma) * b.volt / 1000000.0));
              }

