          final class Fmt {
              /** {number, unit} for a speed in bytes per second, switching kB/s, MB/s, GB/s automatically. */
              static String[] speed(double bps) { return speed(bps, 10); }

              static String[] speed(double bps, int minKb) {
                  double kb = Math.max(0, bps) / 1024.0;
                  String unit = "kB/s";
                  double v = kb;
                  if (kb >= 1000) {
                      v = kb / 1024.0;
                      unit = "MB/s";
                      if (v >= 1000) {
                          v = v / 1024.0;
                          unit = "GB/s";
                      }
                  }
                  String num = kb < minKb ? "0" : v < 10 ? String.format(Locale.US, "%.1f", v) : String.format(Locale.US, "%.0f", v);
                  return new String[]{num, unit};
              }

              static String line(double bps) {
                  String[] p = speed(bps);
                  return p[0] + " " + p[1];
              }
          }

          final class Snapper {
              /** Returns the timestamp of a snapshot not older than maxAgeMs, taking a new one if needed (0 on failure). */
              static synchronized long ensure(Context c, long maxAgeMs) {
                  long last = Db.get(c).lastSnapTs();
                  if (last > 0 && System.currentTimeMillis() - last <= maxAgeMs) return last;
                  return take(c);
              }

              static synchronized long take(Context c) {
                  Snap s = Dump.take();
                  if (s == null) return 0;
                  SnapRow r = new SnapRow();
                  r.ts = System.currentTimeMillis();
                  r.level = Power.level(c);
                  r.cc = Power.cc(c);
                  r.el = SystemClock.elapsedRealtime();
                  r.up = SystemClock.uptimeMillis();
                  r.charging = Power.charging(c);
                  r.data = s;
                  Db.get(c).putSnap(r);
                  return r.ts;
              }
          }

