                  ch.enableLights(false);
                  nm.createNotificationChannel(ch);
                  NotificationChannel chCur = new NotificationChannel(CH_CUR, "Струм заряду у рядку стану", NotificationManager.IMPORTANCE_DEFAULT);
                  chCur.setShowBadge(false);
                  chCur.setSound(silent, aa);
                  chCur.enableVibration(false);
                  chCur.enableLights(false);
                  nm.createNotificationChannel(chCur);
                  // Idle state uses a minimal channel: no icon in the status bar, only in the shade.
                  NotificationChannel chMin = new NotificationChannel(CH_MIN, "Фонова робота (без значка)", NotificationManager.IMPORTANCE_MIN);
                  chMin.setShowBadge(false);
                  nm.createNotificationChannel(chMin);
                  startForeground(2, build(null, null, null, true));

                  ht = new HandlerThread("nightnet-monitor");
                  ht.start();
                  h = new Handler(ht.getLooper());
                  PowerManager pm = getSystemService(PowerManager.class);
                  wl = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "nightnet:snap");

                  rx = new BroadcastReceiver() {
                      @Override public void onReceive(Context c, Intent i) {
                          if (i == null || i.getAction() == null) return;
                          final String a = i.getAction();
                          final long now = System.currentTimeMillis();
                          final long el = SystemClock.elapsedRealtime();
                          final long up = SystemClock.uptimeMillis();
                          try { wl.acquire(90000L); } catch (Throwable ignored) { }
                          h.post(() -> handle(a, now, el, up));
                      }
                  };
                  IntentFilter f = new IntentFilter();
                  f.addAction(Intent.ACTION_SCREEN_OFF);
                  f.addAction(Intent.ACTION_SCREEN_ON);
                  f.addAction(Intent.ACTION_USER_PRESENT);
                  f.addAction(Intent.ACTION_POWER_CONNECTED);
                  f.addAction(Intent.ACTION_POWER_DISCONNECTED);
                  if (Build.VERSION.SDK_INT >= 33) registerReceiver(rx, f, Context.RECEIVER_NOT_EXPORTED);
                  else registerReceiver(rx, f);
                  h.post(this::recover);
              }

              @Override public int onStartCommand(Intent intent, int flags, int startId) {
                  try { startForeground(2, build(null, null, null, true)); basicShown = true; lastBasic = ""; } catch (Throwable ignored) { }
                  h.post(this::applyFeatures);
                  return START_STICKY;
              }

              @Override public void onDestroy() {
                  try { unregisterReceiver(rx); } catch (Throwable ignored) { }
                  try {
                      if (netCb != null) getSystemService(ConnectivityManager.class).unregisterNetworkCallback(netCb);
                  } catch (Throwable ignored) { }
                  try { nm.cancel(4); } catch (Throwable ignored) { }
                  if (ht != null) ht.quitSafely();
                  super.onDestroy();
              }

              private boolean locked() {
                  KeyguardManager km = getSystemService(KeyguardManager.class);
                  return km != null && km.isKeyguardLocked();
              }

              private void releaseLock() {
                  try { if (wl.isHeld()) wl.release(); } catch (Throwable ignored) { }
              }

              // ------------------------------------------------------------ features

              private void applyFeatures() {
                  try {
                      SharedPreferences cfg = Prefs.get(this);
                      boolean want = cfg.getBoolean("wifi_auto", false) || cfg.getBoolean("show_usage", false) || cfg.getBoolean("limit_on", false);
                      ConnectivityManager cm = getSystemService(ConnectivityManager.class);
                      if (want && netCb == null) {
                          cfg.edit().putLong("wifi_conn_since", 0).putLong("wifi_lost_since", 0).apply();
                          netCb = new ConnectivityManager.NetworkCallback() {
                              @Override public void onAvailable(Network n) { h.post(() -> wifiState(true)); }
                              @Override public void onLost(Network n) { h.post(() -> wifiState(false)); }
                          };
                          NetworkRequest req = new NetworkRequest.Builder()
                                  .addTransportType(NetworkCapabilities.TRANSPORT_WIFI)
                                  .addCapability(NetworkCapabilities.NET_CAPABILITY_INTERNET)
                                  .build();
                          try { cm.registerNetworkCallback(req, netCb); } catch (Throwable t) { netCb = null; }
                          cfg.edit().putLong("wifi_lost_since", System.currentTimeMillis()).apply();
                      } else if (!want && netCb != null) {
                          try { cm.unregisterNetworkCallback(netCb); } catch (Throwable ignored) { }
                          netCb = null;
                      }
                      if (!cfg.getBoolean("wifi_auto", false)) WifiAuto.eval(this);
                      showBasic(true);
                      kick();
                  } catch (Throwable ignored) { }
              }

              private void wifiState(boolean up) {
                  SharedPreferences p = Prefs.get(this);
                  long now = System.currentTimeMillis();
                  Usage.sample(this, up);
                  if (p.getBoolean("wifi_auto", false)) ActLog.add(this, up ? "Wi‑Fi підключено" : "Wi‑Fi втрачено");
                  if (up) {
                      if (p.getLong("wifi_conn_since", 0) == 0) p.edit().putLong("wifi_conn_since", now).putLong("wifi_lost_since", 0).apply();
                  } else {
                      p.edit().putLong("wifi_conn_since", 0).putLong("wifi_lost_since", now).apply();
                  }
                  WifiAuto.eval(this);
              }

              // ------------------------------------------------------------ notification ticker

              private final Runnable tickRun = new Runnable() {
                  @Override public void run() {
                      long again = 0;
                      try { again = doTick(); } catch (Throwable ignored) { }
                      if (again > 0) h.postDelayed(this, again);
                      else ticking = false;
                  }
              };

              private void kick() {
                  if (!ticking) {
                      ticking = true;
                      h.post(tickRun);
                  }
              }

              private String usageLine() {
                  if (!Prefs.get(this).getBoolean("show_usage", false)) return null;
                  long now = SystemClock.elapsedRealtime();
                  if (usageText == null || usageAt == 0 || now - usageAt > 30000L) {
                      usageText = "Трафік за місяць: " + Usage.fmt(Usage.monthBytes(this));
                      usageAt = now;
                      Usage.checkLimit(this);
                  }
                  return usageText;
              }

              private void resetNotification() { showBasic(false); }

              /** Idle notification: no icon in the status bar, only the monthly usage line (if enabled). */
              private void showBasic(boolean refresh) {
                  try {
                      if (refresh) usageAt = 0;
                      String t = usageLine();
                      String key = t == null ? "" : t;
                      if (basicShown && key.equals(lastBasic)) return;
                      nm.notify(2, build(t, null, null, true));
                      basicShown = true;
                      lastBasic = key;
                  } catch (Throwable ignored) { }
              }

              private Icon textIcon(String num, String unit, boolean thin) {
                  int s = 96;
                  Bitmap bm = Bitmap.createBitmap(s, s, Bitmap.Config.ARGB_8888);
                  Canvas cv = new Canvas(bm);
                  Paint pt = new Paint(Paint.ANTI_ALIAS_FLAG);
                  pt.setColor(0xFFFFFFFF);
                  pt.setTypeface(thin ? Typeface.create("sans-serif-thin", Typeface.NORMAL) : Typeface.DEFAULT_BOLD);
                  pt.setTextAlign(Paint.Align.CENTER);
                  pt.setTextSize(58);
                  while (pt.measureText(num) > s - 4 && pt.getTextSize() > 20) pt.setTextSize(pt.getTextSize() - 2);
                  cv.drawText(num, s / 2f, 50, pt);
                  pt.setTextSize(34);
                  cv.drawText(unit, s / 2f, 90, pt);
                  return Icon.createWithBitmap(bm);
              }

              private Icon speedIcon(double bps) {
                  String[] p = Fmt.speed(bps, Prefs.get(this).getInt("speed_min_kb", 10));
                  return textIcon(p[0], p[1], "kB/s".equals(p[1]));
              }

              private Notification curNote(double ma) {
                  PendingIntent pi = PendingIntent.getActivity(this, 0, new Intent(this, MainActivity.class), PendingIntent.FLAG_IMMUTABLE);
                  String n = String.format(Locale.US, "%.0f", ma);
                  return new Notification.Builder(this, CH_CUR)
                          .setSmallIcon(textIcon(n, "mA", false))
                          .setContentTitle("Струм заряду: " + n + " мА")
                          .setGroup("nn_cur")
                          .setOngoing(true)
                          .setOnlyAlertOnce(true)
                          .setShowWhen(false)
                          .setContentIntent(pi)
                          .build();
              }

              private long curAt;
              private long speedUntil;
              private String curKey = "";

              /** Returns the delay until the next tick in ms, or 0 if the ticker should stop. */
              private long doTick() {
                  SharedPreferences cfg = Prefs.get(this);
                  boolean speed = cfg.getBoolean("show_speed", false);
                  boolean cur = cfg.getBoolean("show_current", false);
                  long t = SystemClock.elapsedRealtime();
                  long minBps = Math.max(1, cfg.getInt("speed_min_kb", 10)) * 1024L;
                  long idleMs = Math.max(1, cfg.getInt("speed_idle_s", 5)) * 1000L;
                  long curMs = Math.max(1, cfg.getInt("cur_s", 5)) * 1000L;
                  // The charging current has its own status bar icon, refreshed at the chosen interval.
                  if (unlocked && cur) {
                      if (curAt == 0 || t - curAt >= curMs) {
                          curAt = t;
                          BatInfo b = Power.info(this);
                          boolean sc = b != null && b.charging && !Double.isNaN(b.ma);
                          if (sc) {
                              String key = String.valueOf(Math.round(b.ma / 5.0));
                              if (!curShown || !key.equals(curKey)) { nm.notify(4, curNote(b.ma)); curKey = key; }
                              curShown = true;
                          } else if (curShown) {
                              nm.cancel(4);
                              curShown = false;
                          }
                      }
                  } else {
                      curAt = 0;
                      if (curShown) { nm.cancel(4); curShown = false; }
                  }
                  if (!unlocked || (!speed && !curShown)) {
                      lastT = 0;
                      showBasic(false);
                      // Unlocking or connecting a charger restarts the ticker.
                      return 0;
                  }
                  if (!speed) {
                      lastT = 0;
                      showBasic(false);
                      return curMs;
                  }
                  long rx = TrafficStats.getTotalRxBytes();
                  double rxs = 0;
                  if (lastT > 0 && t > lastT && rx >= 0) rxs = Math.max(0, (rx - lastRx) * 1000.0 / (t - lastT));
                  lastRx = rx;
                  lastT = t;
                  // Speeds below 10 kB/s count as no traffic; the icon stays 5 s after the last real traffic to avoid flicker.
                  if (rxs >= minBps) speedUntil = t + idleMs;
                  if (t >= speedUntil) {
                      showBasic(false);
                      return curShown ? Math.min(idleMs, curMs) : idleMs;
                  }
                  nm.notify(2, build(usageLine(), null, speedIcon(rxs), false));
                  basicShown = false;
                  return 1000L;
              }

              // ------------------------------------------------------------ screen events and lock sessions

              private void handle(String a, long now, long el, long up) {
                  try {
                      SharedPreferences cfg = Prefs.get(this);
                      SharedPreferences m = getSharedPreferences("mon", MODE_PRIVATE);
                      boolean mon = cfg.getBoolean("mon_enabled", true);
                      boolean open = m.getBoolean("open", false);
                      if (cfg.getBoolean("show_usage", false) || cfg.getBoolean("limit_on", false)) Usage.sample(this, null);
                      if (Intent.ACTION_SCREEN_OFF.equals(a)) {
                          unlocked = false;
                          if (cfg.getLong("idle_since", 0) == 0) cfg.edit().putLong("idle_since", now).apply();
                          showBasic(true);
                          Scheduler.sync(this);
                          if (mon && !open) startSession(m, now, el, up);
                      } else if (Intent.ACTION_USER_PRESENT.equals(a) || (Intent.ACTION_SCREEN_ON.equals(a) && !locked())) {
                          unlocked = true;
                          cfg.edit().putLong("idle_since", 0).apply();
                          Scheduler.sync(this);
                          if (mon && open) endSession(m, now, el, up);
                          Usage.checkLimit(this);
                          kick();
                      } else if (Intent.ACTION_POWER_CONNECTED.equals(a)) {
                          if (open) m.edit().putBoolean("charged", true).apply();
                          kick();
                      } else if (Intent.ACTION_POWER_DISCONNECTED.equals(a)) {
                          kick();
                      }
                  } catch (Throwable ignored) {
                  } finally {
                      releaseLock();
                  }
              }

              private void recover() {
                  try {
                      PowerManager pm = getSystemService(PowerManager.class);
                      unlocked = pm.isInteractive() && !locked();
                      SharedPreferences cfg = Prefs.get(this);
                      if (unlocked) cfg.edit().putLong("idle_since", 0).apply();
                      else if (cfg.getLong("idle_since", 0) == 0) cfg.edit().putLong("idle_since", System.currentTimeMillis()).apply();
                      kick();
                      SharedPreferences m = getSharedPreferences("mon", MODE_PRIVATE);
                      if (!m.getBoolean("open", false)) return;
                      long el = SystemClock.elapsedRealtime();
                      if (el < m.getLong("st_el", 0)) {
                          m.edit().putBoolean("open", false).apply();
                          return;
                      }
                      if (unlocked) endSession(m, System.currentTimeMillis(), el, SystemClock.uptimeMillis());
                  } catch (Throwable ignored) { }
              }

              private void startSession(SharedPreferences m, long now, long el, long up) {
                  if (Power.charging(this)) return;
                  int lvl = Power.level(this);
                  long cc = Power.cc(this);
                  boolean sched = Prefs.get(this).getBoolean("active", false);
                  long snap = Snapper.ensure(this, 150000L);
                  m.edit().putBoolean("open", true).putBoolean("charged", false)
                          .putLong("st", now).putLong("st_el", el).putLong("st_up", up)
                          .putInt("st_lvl", lvl).putLong("st_cc", cc)
                          .putLong("snap_a", snap).putBoolean("sched0", sched).apply();
              }

              private void endSession(SharedPreferences m, long now, long el, long up) {
                  long st = m.getLong("st", 0);
                  long stEl = m.getLong("st_el", 0);
                  long stUp = m.getLong("st_up", 0);
                  boolean charged = m.getBoolean("charged", false) || Power.charging(this);
                  int lvl = Power.level(this);
                  long cc = Power.cc(this);
                  SharedPreferences cfg = Prefs.get(this);
                  m.edit().putBoolean("open", false).apply();

                  long minMs = cfg.getInt("min_minutes", 30) * 60000L;
                  if (st <= 0 || el < stEl || charged || now - st < minMs) {
                      // Too short for the log: no snapshot, to save battery.
                      return;
                  }
                  long snapB = Snapper.take(this);
                  Sess s = new Sess();
                  s.st = st;
                  s.en = now;
                  s.stLvl = m.getInt("st_lvl", 0);
                  s.enLvl = lvl;
                  s.stCc = m.getLong("st_cc", 0);
                  s.enCc = cc;
                  s.el = el - stEl;
                  s.up = up - stUp;
                  s.sched = m.getBoolean("sched0", false) || cfg.getBoolean("active", false) || cfg.getLong("flip_ts", 0) >= st;
                  s.snapA = m.getLong("snap_a", 0);
                  s.snapB = snapB;
                  Db db = Db.get(this);
                  db.putSession(s);
                  db.prune(now - cfg.getInt("keep_days", 14) * 86400000L);
              }
          }
