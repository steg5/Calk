                      c.save();
                      c.clipRect(cx - r * 3f, cy - r * 3f, cx + r * 3f, cy + r * (a < EMO.length ? 0.7f : 0.55f));
                      content(c, cx, cy, r, a, true);
                      c.restore();
                      noBg = false;
                  }
              }

              // ---------- малювання персонажів (координати в частках радіуса) ----------
              private static Canvas gc;
