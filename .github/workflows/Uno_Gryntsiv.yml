                  styledCorner(c, k, x, y, w, h, cornerColor, cornerOutline);
                  c.save();
                  c.rotate(180f, cx, cy);
                  styledCorner(c, k, x, y, w, h, cornerColor, cornerOutline);
                  c.restore();
              }

              private void styledCorner(Canvas c, Card k, float x, float y, float w, float h, int color, boolean outline) {
                  String s;
                  float size;
                  if (k.v <= 9) {
                      s = String.valueOf(k.v);
                      size = h * 0.11f;
                  } else {
                      s = Engine.label(k);
                      size = h * 0.082f;
                  }
