              protected int speedOf(int ms) {
                  int best = 3, d = Integer.MAX_VALUE;
                  for (int k = 0; k < 5; k++) {
                      if (Math.abs(SPEED_MS[k] - ms) < d) {
                          d = Math.abs(SPEED_MS[k] - ms);
                          best = k + 1;
                      }
                  }
                  return best;
              }

