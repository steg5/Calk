                  lobbyLimit.setText("Ліміт очок: " + limit);
                  lobbyCount.setText("Гравці: " + players.size() + " з 6 (потрібно від 2)");
                  if (lobbyStart != null) {
                      boolean ok = players.size() >= 2;
