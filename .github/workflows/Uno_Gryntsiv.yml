              private LinearLayout playerRow(final int idx, boolean inLobby) {
                  String[] p = players.get(idx);
                  boolean bot = p[3].equals("1");
                  LinearLayout row = new LinearLayout(this);
                  row.setOrientation(LinearLayout.HORIZONTAL);
                  row.setGravity(Gravity.CENTER_VERTICAL);
                  row.setBackground(bg(0xFF2C3A41, 0.2f));
                  row.setPadding(px(0.2f), px(0.08f), px(0.3f), px(0.08f));
                  Avatars.AvatarView av = new Avatars.AvatarView(this);
                  av.set(pi(p[1]), p[2], false);
                  row.addView(av, lp(1.0f, 1.0f, 0.05f));
                  final boolean hostRow = p.length > 6 && p[6].equals("1");
                  String label = bot ? p[0] : (p[0] + (hostRow ? " - господар" : " - гість"));
                  row.addView(tv(label, 0.38f, WHITE, true), new LinearLayout.LayoutParams(0, WRAP, 1f));
                  if (isHost) {
                      row.addView(btn("↑", 0xFF455A64, new View.OnClickListener() {
                          public void onClick(View v) {
                              if (host != null) hostErr(host.moveSeat(idx, -1));
                          }
                      }), lp(0.9f, 0.8f, 0.03f));
                      row.addView(btn("↓", 0xFF455A64, new View.OnClickListener() {
                          public void onClick(View v) {
                              if (host != null) hostErr(host.moveSeat(idx, 1));
                          }
                      }), lp(0.9f, 0.8f, 0.03f));
                      if (!hostRow) {
                          row.addView(btn(bot ? "Прибрати" : "Видалити", 0xFFC62828, new View.OnClickListener() {
                              public void onClick(View v) {
                                  if (host != null) hostErr(host.removePlayer(idx));
                              }
                          }), lp(2.5f, 0.8f, 0.05f));
                      }
                      if (bot) {
                          int lv = pi(p[4]);
                          View gap = new View(this);
                          row.addView(gap, new LinearLayout.LayoutParams(px(0.3f), 1));
                          for (int k = 0; k < 3; k++) {
                              final int lk = k;
                              row.addView(btn(LEVELS_SHORT[k], lv == k ? 0xFF2E7D32 : 0xFF455A64, new View.OnClickListener() {
                                  public void onClick(View v) {
                                      if (host != null) host.setLevel(idx, lk);
                                  }
                              }), lp(2.0f, 0.8f, 0.03f));
                          }
                      }
                  }
                  return row;
              }

              private void refreshLobby() {
                  if (lobbyList == null) return;
                  lobbyList.removeAllViews();
                  for (int i = 0; i < players.size(); i++) {
