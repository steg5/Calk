                                      byte[] b = msg.getBytes("UTF-8");
                                      ArrayList<InetAddress> targets = broadcastAddresses();
                                      for (InetAddress a : targets) {
                                          try {
                                              ds.send(new DatagramPacket(b, b.length, a, PORT));
                                          } catch (Exception e) {
                                              // ignore
                                          }
                                      }
