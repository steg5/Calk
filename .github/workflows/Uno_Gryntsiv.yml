          echo '' | base64 -d > app/src/main/res/raw/sfx_voice.ogg
          echo '' | base64 -d > app/src/main/res/raw/sfx_wrong.ogg
          if [ -d uno_sounds ]; then cp uno_sounds/*.mp3 app/src/main/res/raw/ || true; fi

      - name: Build
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: Uno_Gryntsiv
          path: app/build/outputs/apk/debug/app-debug.apk
