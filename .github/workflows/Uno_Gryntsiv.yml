                          String meta = http("GET", "rooms/" + c + "/meta", null);
                          if (meta == null) {
                              cb.onError(NOCON);
                              return;
                          }
                          boolean free = meta.trim().equals("null");
                          if (!free) {
                              Object o = parse(meta);
                              if (o instanceof Map && cid.equals(((Map<?, ?>) o).get("h"))) free = true;
                          }
                          if (free) {
                              pick = c;
                              break;
                          }
                      }
