              private void pickPhoto() {
                  try {
                      Intent i;
                      if (Build.VERSION.SDK_INT >= 33) {
                          i = new Intent(MediaStore.ACTION_PICK_IMAGES);
                      } else {
                          i = new Intent(Intent.ACTION_PICK, MediaStore.Images.Media.EXTERNAL_CONTENT_URI);
                      }
                      i.setType("image/*");
                      startActivityForResult(i, REQ_PHOTO);
                  } catch (Exception e) {
                      try {
                          Intent g = new Intent(Intent.ACTION_GET_CONTENT);
                          g.setType("image/*");
                          startActivityForResult(g, REQ_PHOTO);
                      } catch (Exception e2) {
                          toast("Галерею не знайдено");
                      }
                  }
              }

              @Override
              protected void onActivityResult(int req, int res, Intent data) {
                  super.onActivityResult(req, res, data);
                  if (req != REQ_PHOTO || res != RESULT_OK || data == null || data.getData() == null) return;
                  try {
                      Uri uri = data.getData();
                      InputStream in = getContentResolver().openInputStream(uri);
                      BitmapFactory.Options o = new BitmapFactory.Options();
                      o.inJustDecodeBounds = true;
                      BitmapFactory.decodeStream(in, null, o);
                      in.close();
                      int s = 1;
                      while (o.outWidth / (s * 2) >= 192 && o.outHeight / (s * 2) >= 192) s *= 2;
                      BitmapFactory.Options o2 = new BitmapFactory.Options();
                      o2.inSampleSize = s;
                      in = getContentResolver().openInputStream(uri);
                      Bitmap b = BitmapFactory.decodeStream(in, null, o2);
                      in.close();
                      if (b == null) throw new RuntimeException("decode");
                      int side = Math.min(b.getWidth(), b.getHeight());
                      Bitmap sq = Bitmap.createBitmap(b, (b.getWidth() - side) / 2, (b.getHeight() - side) / 2, side, side);
                      Bitmap sm = Bitmap.createScaledBitmap(sq, 96, 96, true);
                      ByteArrayOutputStream bo = new ByteArrayOutputStream();
                      sm.compress(Bitmap.CompressFormat.JPEG, 80, bo);
                      photo = Base64.encodeToString(bo.toByteArray(), Base64.NO_WRAP);
                      avatar = -1;
                      savePrefs();
                      refreshAvatars();
                  } catch (Exception e) {
                      toast("Не вдалося завантажити фото");
                  }
              }

